<!--

  Version     : 1.0.1

  DESCRIPTION
  -----------
  Widget autoporteur qui dessine une table du document sous la forme d'une
  ville en 3D isométrique. Il se paramètre directement dans le widget, sans
  toucher au code. Chaque ligne de la table devient un élément qui évolue au
  fil de ses étapes (de « terrain réservé » à « gratte-ciel », puis
  « déménagement », « chantier à l'arrêt » ou « immeuble fermé »). Les
  quartiers regroupent les éléments selon une colonne au choix.
  Un même widget héberge toutes les villes d'un document, en onglets ; le
  dernier onglet, « Nouvelle ville », en crée une autre.

  UNIVERS
  -------
  Chaque ville se dessine dans l'un des six univers suivants, avec ses
  dessins, son décor et son vocabulaire (étapes de l'assistant, panneau,
  fiche, légende, messages) :
  - Ville : immeubles et quartiers ;
  - Jardin : plantes et massifs ;
  - Garage : véhicules et parkings ;
  - Aéroport : vols et terminaux ;
  - Base spatiale : fusées et zones de lancement ;
  - Port : navires et quais.
  L'univers se choisit à la création et se change dans « Les finitions ».
  Les réglages sans dessin dans un univers (toits, antennes) n'y sont pas
  proposés.

  CRÉATION (rien n'est écrit avant « Construire ma ville »)
  Une question par étape (les noms des étapes 2 à 5 suivent l'univers :
  « Les quartiers » en Ville, « Les massifs » au Jardin...) ; les réponses
  se choisissent en cartes, classées
  d'après le contenu réel de la table. L'aperçu se construit au fil des
  étapes, avec une étiquette d'exemple.
  1. L'univers : ce que l'on veut représenter, puis un modèle prêt à
     l'emploi (qui crée ses tables), une table à partir de zéro ou une
     ville suggérée.
  2. Les quartiers : regrouper par quelle colonne, ou pas de quartier.
  3. Les éléments : nom de la ville, nom écrit sur chaque élément, étape.
  4. Les étapes : un dessin et une couleur par étape.
  5. Les responsables (facultatif) : colonne et emoji de chacun.
  6. La météo (facultatif) : échéance, règles.
  7. Les finitions (facultatif) : univers, taille, couleur des toits, lien,
     fiche, filtres.
  8. C'est prêt : récapitulatif et « Construire ma ville ».
  Dès l'étape 4, « Construire ma ville maintenant » saute le facultatif.
  Les choix d'une création en cours sont gardés dans le navigateur et
  proposés au retour (« Reprendre » ou « Recommencer »).
  Paramétrages d'une ville existante : mêmes étapes, enregistrement
  automatique (environ 1 s après la dernière modification).

  QUARTIERS
  ---------
  Colonne de type choix, texte, référence ou choix multiples. Avec une
  colonne à choix multiples, chaque combinaison devient un quartier (« A »,
  « B », « A + B »), les valeurs étant triées selon la liste de choix ; le
  filtre propose aussi « Avec A (seul ou combiné) ». Les suggestions
  automatiques ne retiennent jamais une colonne à choix multiples.

  AU QUOTIDIEN
  - Écran paysage : plan en ruban sur toute la largeur, panneau des filtres
    repliable par sa poignée pour donner toute la place à la carte.
  - Zoom à la molette, déplacement en faisant glisser la carte, demi-tour.
  - Étiquettes à taille constante : sans chevauchement par défaut (alertes
    affichées en priorité), ou toutes, même superposées (case du panneau,
    choix retenu par le navigateur ; l'étiquette survolée passe devant).
  - Décor qui aère la ville : parcs à thème, avenues, voiliers (masquable).
  - Clic sur un élément : fiche latérale modifiable (enregistrement dès que
    le champ est quitté) ; la ville se met à jour derrière la fiche. Si la
    vue est liée à la même table, le curseur suit l'élément ouvert.
  - Bouton d'ajout d'un élément : nom, quartier et étape, puis la fiche
    s'ouvre pour compléter.
  - Mode « Déménager » (libellé selon l'univers) : glisser un élément vers
    un autre quartier de la carte, ou vers un nom de quartier de la barre
    (y compris un quartier encore vide). Au clavier : touche D sur un
    élément, puis choix du quartier. Échap annule.
  - Filtres et recherche : la carte se recadre sur les éléments affichés.
  - Vue en liste (alternative accessible à la carte).
  - Relecture toutes les 20 s quand la page est visible, et au retour sur
    la page ; la carte n'est redessinée que si les données ont changé.

  TABLE AUTO-CRÉÉE
  ----------------
  🏙️ BIBLIOTHÈQUE VILLE ⚡ (BIBLIOTHEQUE_VILLE_ après renommage) : table
  technique de paramétrage, une ligne par ville (CLE = CONFIG:<identifiant>),
  configuration en JSON dans VALEUR, et une ligne témoin du droit de
  paramétrer (ACCES_PARAMETRAGE). Une ligne ACCES_EDITION éventuellement
  présente est ignorée. Créée avec la première ville. Aucune autre table n'est
  créée (sauf celles d'un modèle, à la demande), et la table dessinée n'est
  jamais restructurée : le widget n'y écrit que les valeurs modifiées dans
  une fiche, les éléments ajoutés, les pièces jointes ajoutées ou retirées,
  et les déménagements.

  TYPES MODIFIABLES DANS LA FICHE
  -------------------------------
  Texte (une ou plusieurs lignes, lien), nombre, oui ou non, date, date et
  heure (dans le fuseau de la colonne), liste de choix, choix multiples,
  référence, liste de références (cases à cocher, recherche au-delà de 12),
  colonne sans type précis (Any), pièces jointes (consultation, ajout et
  retrait). Non modifiables, raison affichée : colonnes calculées, colonnes
  mises à jour à chaque modification, champs de métadonnées. Les droits du
  document (rôle et règles d'accès) s'appliquent à chacun : une écriture
  refusée est signalée et seule l'action refusée est retirée.

  DROITS ET RÉGLAGE ACL RECOMMANDÉ
  --------------------------------
  Lecteurs : consultation, recherche, filtres, fiche en lecture. Éditeurs :
  en plus, modification des fiches, ajouts et déménagements, dans la limite
  des règles d'accès du document. Paramétrage : réservable aux
  propriétaires par une règle sur la ligne témoin ACCES_PARAMETRAGE ; la
  marche à suivre est affichée à l'étape 1 des paramétrages.

  DÉPENDANCES
  ------------
  - DSFR v1.13.1 (dsfr.min.css, utility.min.css)
  - Grist Plugin API (grist-plugin-api.js), origine imposée par la
    plateforme, URL non versionnée, donc non couverte par une empreinte SRI
  - pdf.js v6.2.108, version legacy (aperçu des PDF), chargé à la demande.
    Un module chargé par le script ne peut pas porter d'attribut integrity :
    chaque fichier est téléchargé, son empreinte SHA-256 comparée à la
    valeur épinglée dans PDFJS, et il n'est exécuté que si elle correspond.
  Aucune police externe.
  Le Système de design de l'État (DSFR) est réservé par ses modalités
  d'utilisation aux sites de l'État : vérifiez qu'elles s'appliquent à
  votre usage avant de déployer ce widget.

  SÉCURITÉ
  ---------
  - Aucune exécution de code dynamique, aucun accès au cadre parent
  - Aucune donnée insérée comme HTML : DOM construit par textContent et
    setAttribute ; logo dessiné élément par élément (createElementNS)
  - Liens : seul https est rendu cliquable, ouverture par un lien temporaire
    avec noopener et noreferrer (pas de window.open)
  - Niveau d'accès accordé lu par grist.onOptions : sans accès complet, le
    widget explique comment l'accorder et n'écrit rien. Avec l'accès
    complet, la plateforme applique à chaque agent ses propres droits (rôle
    et règles d'accès) ; le widget les reflète
  - Pièces jointes : liste blanche des formats acceptés à l'envoi, jeton de
    lecture seule pour consulter et télécharger (repli sur un jeton complet,
    une fois par session, si l'instance refuse la lecture seule)
  - Journalisation via logSecurite(), messages d'erreur neutres
  - Navigateur (localStorage) : panneau replié et choix des étiquettes ;
    par document, dernière ville consultée et brouillon de création gardé
    30 jours au plus (nom de la ville, table et réglages choisis, noms des
    tables créées pour un modèle, sans aucune donnée des lignes), effacé à la construction de la ville ou à
    l'abandon

  ICÔNES
  ------
  Uniquement des icônes présentes dans le DSFR v1.13.1 : une icône absente
  s'affiche comme un carré plein.

  REPÈRES POUR MODIFIER LE CODE
  -----------------------------
  [MODIFIABLE]  : réglages que l'on peut changer sans risque (couleurs,
                  textes, seuils, dessins proposés, vocabulaire des univers).
  [INTOUCHABLE] : mécanique du widget, à ne pas modifier.
  Le paramétrage courant se fait dans le widget, pas dans le code.

  HISTORIQUE
  ----------
  1.0.0 - 29/10/2026 - madeXcé - Première version publique.
  1.0.1 - 29/10/2026 - madeXcé - Corrections issues de la relecture : table
    et colonnes renommées retrouvées, impasses levées (table supprimée,
    reprise de création), valeurs spéciales des listes conservées, nombres
    formatés, textes selon l'univers, redessins allégés, repli du jeton des
    pièces jointes.

  THÈME
  ------
  data-fr-theme="light" : le widget reste en thème clair, par cohérence avec
  l'application hôte affichée autour du cadre.
-->
<html lang="fr" data-fr-scheme="light" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gristcity</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.min.css" integrity="sha256-PoTduNA12Ef0KCwFjv+8sWmCz4NgPhVDfR+3xUpKSIU=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/utility/utility.min.css" integrity="sha256-AtMKjo1PePyobCHKvBH8mkAGxX17BDtX9+yJ44JxWnU=" crossorigin="anonymous">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
  /* ==========================================================================
     STYLES COMMUNS [INTOUCHABLE]
     Bandeau, voile de chargement, fenêtres,
     assistant, panneau latéral des filtres, barre d'étapes, onglets.
     ========================================================================== */
  /* === SECTION : BASE === */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey);
      font-family: Marianne, arial, sans-serif; font-size: 1rem; }
    #skipLink:focus { position: fixed; top: 0; left: 0; z-index: 9999; padding: .5rem 1rem; clip: auto; width: auto; height: auto;
      overflow: visible; white-space: nowrap; font-size: .875rem;
      background: var(--background-default-grey); color: var(--text-action-high-blue-france); }
    main[hidden], div[hidden], section[hidden], p[hidden], button[hidden], .fr-btn[hidden] { display: none; }
    .w-contenu { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 1.75rem; color: var(--text-default-grey); }
    .w-titre-vue { margin: 0 0 .25rem; }
    .w-mention { color: var(--text-mention-grey); font-size: .8125rem; margin: 0; }
    .w-texte { font-size: .875rem; line-height: 1.55; margin: 0; color: var(--text-default-grey); }

  /* SECTION : BANDEAU */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
    .w-bandeau__logo-wrap{width:100%}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-blue-france);white-space:nowrap;margin:0;line-height:1}
    .w-bandeau__version{font-size:.75rem;color:var(--text-mention-grey);font-weight:400;margin-left:.5rem;white-space:nowrap}
    /* Logo madeXcé : couleurs lues dans les jetons DSFR */
    .w-logo{display:block;width:100%;height:auto}
    .w-logo__made{fill:var(--text-mention-grey);font-weight:400}
    .w-logo__x{fill:var(--text-label-pink-tuile);font-weight:700}
    .w-logo__ce{fill:var(--text-title-blue-france);font-weight:800}

  /* === SECTION : LOADER ET BANNIERES === */
    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Voile de superposition : seule couleur ecrite en dur admise, le jeton
         --background-overlap-grey designant une surface opaque. */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }
    .w-loader.actif { display: flex; }
    .w-loader__spinner { width: 32px; height: 32px; border: 3px solid var(--border-default-grey);
      border-top-color: var(--background-action-high-blue-france); border-radius: 50%; animation: wSpin .8s linear infinite; }
    @keyframes wSpin { to { transform: rotate(360deg); } }
    .w-loader__texte { font-size: .875rem; color: var(--text-inverted-grey); }
    .w-erreur, .w-succes { display: none; flex-shrink: 0; }
    .w-erreur.actif, .w-succes.actif { display: block; }

  /* === SECTION : MODALES === */
    .w-overlay { display: none; position: fixed; inset: 0; z-index: 9990;
      /* Voile de superposition : derogation documentee, voir .w-loader */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); align-items: center; justify-content: center; padding: 1rem; }
    .w-overlay.actif { display: flex; }
    .w-overlay--haut { z-index: 9995; }
    /* Visionneuse des pieces jointes. */
    .w-overlay--visionneuse { z-index: 9993; }
    /* Visionneuse : fenetre de 85 % de la hauteur, agrandissable en plein ecran. */
    .w-dialogue--visionneuse { max-width: 72rem; height: 85vh; }
    .w-dialogue--visionneuse.w-dialogue--plein { position: fixed; inset: 0; max-width: none; height: 100%; max-height: none; }
    .w-visionneuse__contenu.w-visionneuse__contenu--pdf { display: block; overflow: auto; padding: 0; background: var(--background-contrast-grey); color: var(--text-default-grey); }
    .w-pdf__pages { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1rem 0; }
    .w-pdf__page { background: var(--background-default-grey); color: var(--text-default-grey); border: 1px solid var(--border-default-grey); }
    .w-visionneuse__contenu { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 1.5rem 1.5rem;
      background: var(--background-alt-grey); color: var(--text-default-grey); }
    .w-visionneuse__contenu img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .w-visionneuse__contenu iframe { width: 100%; height: 100%; border: 0; background: var(--background-default-grey); color: var(--text-default-grey); }
    .w-pj__liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .375rem; }
    .w-pj__fichier { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .5rem .75rem;
      border: 1px solid var(--border-default-grey); background: var(--background-default-grey); color: var(--text-default-grey); }
    .w-pj__nom { flex: 1; min-width: 8rem; font-size: .875rem; overflow-wrap: anywhere; }
    .w-pj__taille { font-size: .75rem; color: var(--text-mention-grey); }
    .w-dialogue { background: var(--background-default-grey); color: var(--text-default-grey); width: 100%; max-width: 42rem;
      max-height: 100%; display: flex; flex-direction: column; }
    .w-dialogue--etroit { max-width: 30rem; }
    /* Fiche de l immeuble : panneau lateral qui glisse depuis la droite, sur
       toute la hauteur, comme une fiche que l'on consulte a cote du tableau. */
    .w-overlay--lateral { justify-content: flex-end; align-items: stretch; padding: 0; }
    .w-dialogue--lateral { max-width: 42rem; height: 100%; animation: wGlisse .2s ease-out; }
    .w-dialogue--lateral .w-dialogue__corps { flex: 1; }
    @keyframes wGlisse { from { transform: translateX(2rem); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .w-dialogue--lateral { animation: none; } .w-loader__spinner { animation: none; } }
    .w-dialogue__tete { display: flex; align-items: flex-start; gap: .75rem; padding: 1.25rem 1.5rem .5rem; }
    .w-dialogue__tete > div { flex: 1; }
    .w-dialogue__titre { margin: 0; }
    .w-dialogue__corps { padding: .5rem 1.5rem 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .w-dialogue__pied { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-default-grey); }
    .w-dialogue__pied .w-pousse { margin-left: auto; }

  /* === SECTION : ASSISTANT === */
    /* Mise en page fluide : tous les ecrans occupent la largeur du cadre et
       les blocs se replient les uns sous les autres quand elle diminue. */
    .w-assistant { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; }
    .w-colonnes2 { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; }
    .w-colonnes2__principal { flex: 2 1 26rem; min-width: 0; display: flex; flex-direction: column; gap: 1.25rem; }
    .w-colonnes2__cote { flex: 1 1 18rem; min-width: 16rem; display: flex; flex-direction: column; gap: 1rem; }
    .w-panneau { background: var(--background-alt-grey); color: var(--text-default-grey); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
    .w-panneau__titre { margin: 0; font-size: .9rem; font-weight: 700; color: var(--text-title-blue-france); }
    .w-tuiles { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    /* Grille de cartes de largeur identique, quelle que soit la ligne et
       quel que soit le nombre de cartes sur la ligne. */
    .w-tuiles--grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.5rem; }
    .w-tuiles--grille .w-tuile { min-width: 0; }
    .w-tuile { flex: 1 1 20rem; border: 1px solid var(--border-default-grey); padding: 1.5rem; display: flex; flex-direction: column; gap: .875rem; }
    .w-tuile ul { margin: 0; padding-left: 1.25rem; font-size: .8125rem; line-height: 1.6; }
    /* Boutons d'action des cartes : en bas et a droite, comme la barre de
       navigation. */
    .w-tuile__bas { margin-top: auto; padding-top: .5rem; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .5rem; }
    .w-tuile--depart { flex-basis: 16rem; }
    .w-tuile--existant { border: 2px solid var(--border-action-high-blue-france); }
    .w-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .375rem; }
    .w-ligne { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border: 1px solid var(--border-default-grey);
      background: var(--background-default-grey); color: var(--text-default-grey); flex-wrap: wrap; }
    .w-ligne__nom { flex: 1; min-width: 8rem; font-size: .875rem; font-weight: 500; }
    .w-ligne .fr-input { flex: 1; min-width: 8rem; margin-top: 0; }
    .w-form-info { border: 2px solid var(--border-action-high-blue-france); padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .w-form-info__actions { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }
    .w-tableau-cols { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .w-tableau-cols th { text-align: left; padding: .5rem .75rem; font-size: .8125rem; background: var(--background-alt-grey); color: var(--text-default-grey);
      border-bottom: 2px solid var(--border-plain-grey); }
    .w-tableau-cols td { padding: .5rem .75rem; border-bottom: 1px solid var(--border-default-grey); vertical-align: middle; }
    .w-defile-x { overflow-x: auto; }
    .w-centre { max-width: 40rem; margin: 2rem auto 0; text-align: center; display: flex; flex-direction: column; gap: 1rem; align-items: center; }

  /* === SECTION : TABLEAU === */
    .w-outils { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .w-outils__champ { display: flex; flex-direction: column; min-width: 10rem; }
    .w-outils__champ .fr-label { font-size: .75rem; color: var(--text-mention-grey); }
    .w-outils__champ .fr-input, .w-outils__champ .fr-select { margin-top: .25rem; }
    /* Vue ville : la page ne defile plus ; la carte occupe toute la place. */
    .w-contenu--ville { display: flex; flex-direction: column; overflow: hidden; }
    .w-contenu--ville #vPanneau { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* Disposition de la ville : panneau des filtres et reglages a gauche,
       identite et carte a droite. */
    .w-disposition { display: flex; gap: 1.5rem; flex: 1; min-height: 0; position: relative; }
    .w-principal { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .w-volet { flex: 0 0 16rem; min-height: 0; display: flex; background: var(--background-alt-grey); border-left: .25rem solid var(--border-action-high-blue-france); color: var(--text-default-grey); }
    .w-volet__contenu { flex: 1; min-width: 0; overflow-y: auto; padding: .75rem 1rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .w-volet__tete { display: none; align-items: center; justify-content: space-between; gap: .5rem; }
    .w-volet__titre { margin: 0; font-size: .875rem; font-weight: 700; color: var(--text-title-grey); }
    .w-volet__bloc { display: flex; flex-direction: column; gap: .75rem; }
    .w-volet__bloc .fr-input, .w-volet__bloc .fr-select { width: 100%; }
    .w-volet__bloc .w-outils__champ { width: 100%; }
    .w-volet__bloc + .w-volet__bloc { padding-top: .5rem; }

    .w-aide { width: 1.5rem; height: 1.5rem; flex-shrink: 0; padding: 0; margin: -.5rem 0 0 -.25rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;

  /* === SECTION : BARRE D'ETAPES === */

    .w-etapes { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: .25rem; }

    .w-etapes__item--faite .w-etapes__segment { background: var(--background-flat-success); color: var(--text-inverted-blue-france); }

  /* === SECTION : ASSISTANT VILLE === */

    /* Ecrans de parametrage en colonnes :

    .w-c3 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(13rem, 17rem) minmax(18rem, 1fr); gap: 2rem; align-items: start; }

    .w-erreur, .w-succes { position: relative; z-index: 9996; }

    .w-c3__titre { margin: 0; font-size: 1rem; font-weight: 700; color: var(--text-title-grey); }

    @media (max-width: 62em) { .w-c3, .w-c3--serre { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .w-c3--serre > div { padding: 0; } .w-c3--serre > div + div { border-left: 0; } .w-c3__apercu { grid-column: 1 / -1; position: static; } .w-c3--deux .w-c3__apercu { grid-column: auto; } }

  /* === SECTION : ONGLETS === */

  /* === SECTION : ECRANS ETROITS ===

    @media (max-width: 48em) {

  /* ==========================================================================
     STYLES DE LA VILLE [MODIFIABLE pour les couleurs, INTOUCHABLE sinon]
     ========================================================================== */
    :root {
      /* [MODIFIABLE] Ciel derrière la ville et bordures : jetons DSFR uniquement */
      --vl-ciel: var(--background-alt-blue-cumulus);
      --vl-ciel-bas: var(--background-default-grey);
      --vl-bordure: var(--border-default-grey);
    }
    /* !important : un élément caché (attribut hidden) doit le rester même quand une
       règle DSFR ou du widget lui donne un display (flex, grid, block). */
    [hidden] { display: none !important; }
    /* Identité de la ville sur une seule ligne : la carte garde la hauteur */
    .vl-identite { align-items: center; gap: .75rem 1rem; margin-bottom: .5rem; }
    .vl-identite .w-titre-vue { margin: 0; }
    .vl-identite .w-explication { margin-top: 0; }
    .vl-compteurs { display: flex; gap: .375rem; flex-wrap: wrap; margin-left: auto; }
    /* Cadre de la carte : occupe toute la place restante */
    .vl-cadre { flex: 1; min-height: 0; position: relative; border: 1px solid var(--border-default-grey); }
    .vl-carte-zone { position: absolute; inset: 0; background: linear-gradient(var(--vl-ciel), var(--vl-ciel-bas)); color: var(--text-default-grey); overflow: hidden; }
    #vl-svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
    #vl-svg.vl-glisse { cursor: grabbing; }
    .vl-vide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-mention-grey); z-index: 2; }
    .vl-vide__boite { max-width: 34rem; padding: 1rem 1.25rem; background: var(--background-default-grey); color: var(--text-default-grey); border: 1px solid var(--vl-bordure); text-align: center; display: flex; flex-direction: column; align-items: center; gap: .75rem; }
    .vl-vide__boite p { margin: 0; color: var(--text-default-grey); }
    /* Immeubles : survol et focus clavier */
    .vl-passer { position: absolute; left: .75rem; top: .75rem; z-index: 3; background-color: var(--background-default-grey); color: var(--text-action-high-blue-france); }
    .vl-passer:not(:focus) { width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .vl-bat { cursor: pointer; }
    /* Focus clavier : les fenêtres de l'immeuble s'allument, en
       plus du halo au sol (seul repère pour un terrain sans fenêtres). */
    .vl-bat:focus-visible .vl-vitre { fill: #FFC21A; }
    .vl-bat:focus-visible .vl-vitre--cote { fill: #E6A800; }
    .vl-bat .vl-halo { display: none; }
    .vl-bat:hover .vl-halo, .vl-bat:focus-visible .vl-halo, .vl-bat.vl-actif .vl-halo { display: inline; }
    .vl-bat:hover > .vl-corps, .vl-bat:focus-visible > .vl-corps { filter: brightness(1.06); }
    /* Immeuble qui vient de déménager : halo qui clignote */
    @keyframes vl-clignote { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
    .vl-bat.vl-flash .vl-halo { display: inline; stroke-width: 4; animation: vl-clignote .65s ease-in-out 4; }
    .vl-etiquette, .vl-lien-doc, .vl-dev { cursor: pointer; }
    .vl-etiquette:hover .vl-etiquette-fond { fill: var(--background-action-low-blue-france); }
    .vl-lien-doc:hover .vl-lien-doc-fond { fill: var(--background-action-low-blue-france); }
    .vl-dev--calme { opacity: .8; }
    @keyframes vl-balance { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    .vl-crochet { animation: vl-balance 3s ease-in-out infinite; }
    /* Décor animé : la grande roue tourne, la fontaine scintille, les voiliers tanguent */
    @keyframes vl-tourne { to { transform: rotate(360deg); } }
    .vl-roue { animation: vl-tourne 40s linear infinite; }
    @keyframes vl-scintille { 0%, 100% { opacity: .9; } 50% { opacity: .45; } }
    .vl-jet { animation: vl-scintille 1.6s ease-in-out infinite; }
    @keyframes vl-tangue { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
    .vl-bateau { animation: vl-tangue 3.5s ease-in-out infinite; }
    /* Cyclistes : ils avancent doucement sur la piste cyclable (1,5 case,
       soit 48 px vers la droite et 24 px vers le bas), puis réapparaissent
       au départ. [MODIFIABLE : durée] */
    @keyframes vl-pedale { 0% { transform: translate(0, 0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translate(48px, 24px); opacity: 0; } }
    .vl-velo { animation: vl-pedale 14s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .vl-crochet, .vl-bat.vl-flash .vl-halo, .vl-roue, .vl-jet, .vl-bateau, .vl-velo { animation: none; } }
    .vl-astuce { position: absolute; bottom: .75rem; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
      background: var(--background-default-grey); border: 1px solid var(--vl-bordure); border-radius: 999px; padding: .3rem .8rem; font-size: .8125rem; color: var(--text-mention-grey); }
    /* Commandes zoom et rotation */
    .vl-commandes { position: absolute; right: .75rem; bottom: .75rem; display: flex; flex-direction: column; gap: .35rem; }
    .vl-commandes .fr-btn { background-color: var(--background-default-grey); color: var(--text-default-grey); }
    .vl-bouton-etiquettes--off { text-decoration: line-through; }
    /* Légende */
    .vl-legende { position: absolute; left: .75rem; bottom: .75rem; max-width: 20rem; max-height: calc(100% - 1.5rem); overflow: auto;
      background: var(--background-default-grey); color: var(--text-default-grey); border: 1px solid var(--vl-bordure); font-size: .75rem; }
    .vl-legende summary { cursor: pointer; padding: .4rem .6rem; font-weight: 700; color: var(--text-action-high-blue-france); }
    .vl-legende ul { list-style: none; margin: 0; padding: 0 .6rem .5rem; }
    .vl-legende li { display: flex; align-items: center; gap: .4rem; padding: .1rem 0; }
    .vl-pastille { width: .8rem; height: .8rem; border-radius: 0; display: inline-block; flex: none; vertical-align: middle; }
    .vl-pastille--grande { width: 1.25rem; height: 1.25rem; border: 1px solid var(--border-plain-grey); }
    /* Info-bulle */
    .vl-infobulle { position: absolute; pointer-events: none; z-index: 5; max-width: 19rem; background: var(--background-default-grey); border: 1px solid var(--border-plain-grey);
      padding: .45rem .6rem; font-size: .75rem; color: var(--text-default-grey); }
    .vl-infobulle strong { display: block; color: var(--text-title-blue-france); font-size: .8125rem; }
    /* Mode Déménager */
    .vl-carte-zone--demenager .vl-bat, .vl-carte-zone--demenager .vl-etiquette { cursor: move; }
    .vl-zone-q { pointer-events: visiblePainted; }
    .vl-zone-q--cible { fill: var(--background-action-low-blue-france); fill-opacity: .6; stroke: var(--border-action-high-blue-france); stroke-width: 2.5; stroke-dasharray: 6 4; }
    /* !important : pendant un déménagement, le curseur « main fermée » doit
       l'emporter sur celui de chaque élément survolé (boutons, immeubles). */
    .vl-glisser-en-cours, .vl-glisser-en-cours * { cursor: grabbing !important; }
    .vl-porte-drag { position: fixed; z-index: 9999; pointer-events: none; padding: .3rem .7rem; font-size: .875rem; font-weight: 700;

    .vl-barre-demenager { display: flex; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; padding: .5rem .75rem; margin-bottom: .5rem;

    .vl-barre-demenager__texte { margin: 0; font-size: .875rem; font-weight: 500; }
    .vl-puces-q { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .375rem; }
    /* Puces de quartier : composant fr-tag du DSFR, mis en avant quand on les survole en glissant */
    /* Choix de l'univers (étape 1) : tuiles cliquables [MODIFIABLE : apparence] */
    .vl-univers__choix { display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; text-align: left; cursor: pointer; font: inherit; color: var(--text-default-grey); background: var(--background-default-grey); }
    .vl-univers__choix:hover { background: var(--background-default-grey-hover); color: var(--text-default-grey); }
    .vl-univers__choix:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 2px; }
    .vl-univers__emoji { font-size: 1rem; line-height: 1; }
    .vl-univers__titre { color: var(--text-title-grey); }
    .vl-univers__nom { font-size: .75rem; color: var(--text-action-high-blue-france); }
    .vl-puce-q:hover, .vl-puce-q--cible { background-color: var(--background-action-high-blue-france); color: var(--text-inverted-blue-france); }
    .vl-puce-q[disabled] { opacity: .45; cursor: default; }
    /* Vue en liste */
    .vl-liste { position: absolute; inset: 0; overflow: auto; padding: 1rem; background: var(--background-default-grey); color: var(--text-default-grey); }
    .vl-liste .fr-table { margin: 0; }
    .vl-lien-projet { background: none; border: 0; padding: 0; font: inherit; color: var(--text-action-high-blue-france); text-decoration: underline; cursor: pointer; text-align: left; }
    /* Fiche de l'immeuble */
    .vl-fiche-haut { display: grid; grid-template-columns: 11rem 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 36em) { .vl-fiche-haut { grid-template-columns: 1fr; } }
    .vl-fiche-maquette { background: linear-gradient(var(--vl-ciel), var(--vl-ciel-bas)); color: var(--text-default-grey); border: 1px solid var(--vl-bordure); }
    .vl-fiche-maquette svg { width: 100%; height: 13rem; display: block; }
    .vl-fiche-maquette .vl-halo { display: none; }

    .vl-fiche-etape { font-weight: 700; }
    .vl-fiche-sous-titre { margin: .5rem 0 0; font-size: 1rem; color: var(--text-title-blue-france); }
    .vl-fiche-form { display: flex; flex-direction: column; gap: .25rem; }
    .vl-fiche-statut { margin: 0; }
    .vl-lecture .fr-label { margin-bottom: .25rem; }
    .vl-valeur { margin: 0 0 .125rem; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 500; }
    .vl-cases { border: 1px solid var(--border-default-grey); padding: .5rem .75rem; margin: .5rem 0 0; }
    .vl-meteo { margin-top: .5rem; }
    .vl-meteo ul { margin: .25rem 0 0; padding-left: 1.1rem; }
    /* Assistant : aperçu de la ville et maquettes des étapes */
    .vl-apercu-boite { background: linear-gradient(var(--vl-ciel), var(--vl-ciel-bas)); color: var(--text-default-grey); border: 1px solid var(--vl-bordure); }
    .vl-apercu { width: 100%; height: 22rem; display: block; }
    .vl-table-etapes .fr-select { margin-top: 0; min-width: 11rem; }
    .vl-table-etapes .fr-hint-text { max-width: 18rem; }
    .vl-cell-mini { width: 5rem; padding: 0 .25rem; }
    .vl-mini { width: 4.5rem; height: 5.5rem; display: block; }
    .vl-couleur { display: flex; align-items: center; gap: .5rem; }
    .vl-regle .fr-select, .vl-regle .fr-input { flex: 1 1 9rem; min-width: 8rem; margin-top: 0; width: auto; }
    /* Listes de cases à cocher (fiche, filtres) : cadre qui défile, rien ne déborde */
    .w-liste-cases { max-height: 12rem; overflow-y: auto; border: 1px solid var(--border-default-grey); padding: .5rem .75rem; margin-top: .25rem;
      display: flex; flex-direction: column; gap: .25rem; position: relative; }

    .w-liste-cases > legend { top: -.5rem; }
    .w-liste-cases > .fr-input { top: 1.5rem; }

    /* Aides « i » des formulaires : affichées sous le champ, dans le flux de la
       page, pour ne jamais recouvrir les champs ou les « i » suivants */
    .w-champ-aide .w-aide__texte, .w-c3__col .w-aide__texte, .w-colonnes2 .w-aide__texte { position: static; width: auto; max-width: none; margin: .25rem 0 .5rem; }
    /* Assistant en étapes : une question, des cartes de réponses */
    .vl-intro { font-size: 1rem; line-height: 1.5; margin: 0 0 .5rem; }
    .vl-question { border: 0; padding: 0; margin: 0 0 1rem; min-width: 0; }

    .vl-cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: .75rem; }
    .vl-carte { position: relative; display: flex; flex-direction: column; gap: .25rem; padding: .75rem .875rem; cursor: pointer;
      border: 1px solid var(--border-default-grey); background: var(--background-default-grey); color: var(--text-default-grey); }
    .vl-carte:hover { border-color: var(--border-action-high-blue-france); }

    .vl-carte:focus-within { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 2px; }
    .vl-carte--choisie { border: 2px solid var(--border-action-high-blue-france); background: var(--background-alt-blue-france); padding: calc(.75rem - 1px) calc(.875rem - 1px); color: var(--text-default-grey); }
    .vl-carte__titre { font-weight: 700; font-size: .9rem; padding-right: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: .375rem; }
    .vl-carte__detail { font-size: .8125rem; color: var(--text-mention-grey); overflow-wrap: anywhere; }
    .vl-carte__badge { font-weight: 700; }
    .vl-carte--autre { cursor: default; }
    .vl-carte--autre .vl-carte__titre { cursor: pointer; padding-right: 0; }
    .vl-carte--autre input[type="radio"] { position: static; }
    .vl-carte--autre .fr-select, .vl-carte--autre .vl-combo { margin-top: .25rem; }
    .vl-bloc { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
    .vl-raccourci { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-default-grey); display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
    .vl-raccourci .w-mention { margin: 0; }
    .vl-rubrique { border: 1px solid var(--border-default-grey); margin-bottom: .5rem; background: var(--background-default-grey); color: var(--text-default-grey); }
    .vl-rubrique > summary { cursor: pointer; padding: .75rem 1rem; display: flex; flex-direction: column; gap: .125rem; list-style-position: inside; }
    .vl-rubrique[open] > summary { border-bottom: 1px solid var(--border-default-grey); background: var(--background-alt-grey); color: var(--text-default-grey); }
    .vl-rubrique > :not(summary) { margin: .75rem 1rem; }
    .vl-rubrique__titre { font-weight: 700; color: var(--text-title-grey); }
    .vl-rubrique__resume { font-size: .8125rem; color: var(--text-mention-grey); }
    .vl-recap { list-style: none; margin: .5rem 0 1rem; padding: 0; display: flex; flex-direction: column; gap: .25rem; }
    .vl-recap li { display: flex; align-items: center; gap: .75rem; padding: .375rem .75rem; border: 1px solid var(--border-default-grey); flex-wrap: wrap; }
    .vl-recap__titre { font-weight: 700; min-width: 10rem; }
    .vl-recap__valeur { flex: 1; color: var(--text-mention-grey); font-size: .875rem; }
    .vl-etiq-exemple { margin: .25rem 0 0; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .vl-etiq { display: inline-flex; align-items: center; gap: .375rem; padding: .2rem .7rem .2rem .25rem; border: 2px solid var(--border-action-high-blue-france); border-radius: 999px; background: var(--background-default-grey);
      font-weight: 700; font-size: .8125rem; color: var(--text-default-grey); }
    .vl-etiq__dev { padding: .05rem .4rem; border-radius: 999px; background: var(--background-contrast-grey); color: var(--text-default-grey); border: 1px solid var(--border-default-grey); }
    .vl-etiq__point { width: .55rem; height: .55rem; border-radius: 50%; margin-left: .3rem; }
    /* Listes longues filtrables : on tape quelques lettres, les choix s'affinent */
    .vl-combo { position: relative; margin-top: .5rem; }
    .vl-combo__saisie { padding-right: 2.5rem; }
    .vl-combo__bouton { position: absolute; right: 0; top: 0; bottom: 0; width: 2.5rem; border: 0; background: transparent; color: var(--text-default-grey); cursor: pointer; }
    .vl-combo__liste { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; max-height: 16rem; overflow-y: auto; margin: 0; padding: .25rem 0; list-style: none;
      background: var(--background-default-grey); border: 1px solid var(--border-plain-grey); color: var(--text-default-grey); }
    .vl-combo__choix { padding: .4rem .75rem; cursor: pointer; font-size: .875rem; color: var(--text-default-grey); }
    .vl-combo__choix:hover, .vl-combo__choix--actif { background: var(--background-alt-blue-france); color: var(--text-default-grey); }
    .vl-combo__choix--choisi { font-weight: 700; color: var(--text-action-high-blue-france); }
    .vl-combo__rien { padding: .4rem .75rem; font-size: .8125rem; color: var(--text-mention-grey); }
    .w-volet .vl-combo { margin-top: .25rem; }
    .vl-exemple { margin-top: .25rem; color: var(--text-mention-grey); overflow-wrap: anywhere; }
    .vl-exemple--alerte { color: var(--text-default-warning); font-weight: 500; }
    /* Écran large (paysage) : la carte prend toute la hauteur disponible */
    .w-contenu--ville { padding-top: .5rem; padding-bottom: .75rem; }
    .w-contenu--ville .w-onglets { margin-bottom: .5rem; }
    .w-contenu--ville .tab-nav { margin-bottom: .5rem; }
  </style>
</head>
<body>
  <a href="#contenu" class="fr-sr-only" id="skipLink">Aller au contenu</a>

  <div class="w-loader" id="loader" role="status" aria-live="polite">
    <div class="w-loader__spinner"></div>
    <div class="w-loader__texte" id="loaderMessage">Chargement…</div>
  </div>

  <!-- [INTOUCHABLE] Fenêtre générique (fiche latérale de l'immeuble) -->
  <div class="w-overlay" id="wModale">
    <div class="w-dialogue" id="wModaleBoite" role="dialog" aria-modal="true" aria-labelledby="wModaleTitre">
      <div class="w-dialogue__tete">
        <div><h2 class="fr-h6 w-dialogue__titre" id="wModaleTitre"></h2><p class="w-mention" id="wModaleSous"></p></div>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-close-line fr-btn--icon-left" id="wModaleFermer">Fermer</button>
      </div>
      <div class="w-dialogue__corps" id="wModaleCorps"></div>
      <div class="w-dialogue__pied" id="wModalePied"></div>
    </div>
  </div>

  <!-- [INTOUCHABLE] Visionneuse des pièces jointes (images, PDF) -->
  <div class="w-overlay w-overlay--visionneuse" id="wVisionneuse">
    <div class="w-dialogue w-dialogue--visionneuse" role="dialog" aria-modal="true" aria-labelledby="wVisionneuseTitre">
      <div class="w-dialogue__tete">
        <div><h2 class="fr-h6 w-dialogue__titre" id="wVisionneuseTitre">Aperçu du fichier</h2></div>
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-icon-zoom-in-line fr-btn--icon-left" id="wVisionneusePlein" aria-pressed="false">Plein écran</button>
        <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm fr-icon-download-line fr-btn--icon-left" id="wVisionneuseTelecharger">Télécharger</button>
        <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-close-line fr-btn--icon-left" id="wVisionneuseFermer">Fermer</button>

  </div>

  <div class="w-overlay w-overlay--haut" id="wConfirmOverlay">

      <div class="w-dialogue__corps"><p class="w-texte" id="wConfirmMsg"></p><div id="wConfirmChamp"></div></div>
      <div class="w-dialogue__pied">
        <span class="w-pousse"></span>
        <button type="button" class="fr-btn fr-btn--secondary" id="wConfirmNon">Annuler</button>

  <!-- Bandeau (fixe) -->

      <div id="bandeau-logo"></div>

      <h1 class="w-bandeau__titre" id="bandeauTitre">Gristcity</h1><span class="w-bandeau__version" id="bandeauVersion"></span>
    </div>

  <div class="w-erreur fr-alert fr-alert--error fr-alert--sm" id="wErreur" role="alert"><p id="wErreurMsg"></p><button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary fr-mt-1v" id="wErreurFermer">Fermer</button></div>
  <div class="w-succes fr-alert fr-alert--success fr-alert--sm" id="wSucces" role="status"><p id="wSuccesMsg"></p><button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary fr-mt-1v" id="wSuccesFermer">Fermer</button></div>
  <p class="fr-sr-only" id="annonce" role="status" aria-live="polite"></p>

  <main class="w-contenu" id="contenu" tabindex="-1"></main>

<script>
'use strict';

/* ==========================================================================
   SECTION 1 : CONSTANTES [MODIFIABLE la ou c'est indique]
   Toutes les constantes sont declarees ici, au premier niveau et avant toute
   fonction : initialiser() peut etre declenchee par le premier onRecords
   avant la fin de l'evaluation du script.
   ========================================================================== */

// [MODIFIABLE] Numero de version : a incrementer a chaque livraison.
var VERSION_WIDGET = '1.0.1';
var NOM_WIDGET = 'Gristcity';

/* [INTOUCHABLE] Bibliotheque des villes : table technique creee avec la
   premiere ville. Son nom est fixe : les
   villes deja creees sont conservees. Son nom se termine par un souligne apres renommage
   (BIBLIOTHEQUE_VILLE_) : elle n'est jamais proposee comme table de donnees. */
var ID_BIBLIO = 'BIBLIOTHEQUE_VILLE';
var LABEL_BIBLIO = '🏙️ BIBLIOTHÈQUE VILLE ⚡';
var CLE_CONFIG = 'CONFIG';
/* [INTOUCHABLE] Lignes temoins des droits :
   une regle d'acces les rend illisibles a ceux qui ne doivent pas modifier
   (lecteurs) ou parametrer (non-proprietaires). */
var CLE_ACCES_EDITION = 'ACCES_EDITION';
var CLE_ACCES_PARAMETRAGE = 'ACCES_PARAMETRAGE';
var DELAI_RELECTURE_META_MS = 60000;
var VERSION_CONFIG = 1;
var DELAI_API_MS = 30000;
// [MODIFIABLE] Relecture automatique des donnees (en millisecondes) quand la page est visible.
var DELAI_ACTUALISATION_MS = 20000;
var _minuterieActualisation = null;

var COLONNES_META = [
  { id: 'CREE_LE', type: 'DateTime:Europe/Paris', label: 'CREE_LE', formula: 'NOW()', recalcWhen: 0 },
  { id: 'CREE_PAR', type: 'Text', label: 'CREE_PAR', formula: 'user.Email', recalcWhen: 0 },
  { id: 'MODIFIE_LE', type: 'DateTime:Europe/Paris', label: 'MODIFIE_LE', formula: 'NOW()', recalcWhen: 2 },
  { id: 'MODIFIE_PAR', type: 'Text', label: 'MODIFIE_PAR', formula: 'user.Email', recalcWhen: 2 }
];
var COLONNES_BIBLIO = [
  { id: 'CLE', type: 'Text', label: 'CLE' },
  { id: 'VALEUR', type: 'Text', label: 'VALEUR' },
  { id: 'VERSION_CREATION', type: 'Text', label: 'VERSION_CREATION' },
  { id: 'VERSION_MODIF', type: 'Text', label: 'VERSION_MODIF' }
].concat(COLONNES_META);
var IDS_META = ['CREE_LE', 'CREE_PAR', 'MODIFIE_LE', 'MODIFIE_PAR'];
/* Types d'information modifiables depuis la fiche d'un immeuble (les pieces
   jointes ont leur propre editeur, editeurPiecesJointes). Ce qui reste en lecture
   seule l'est pour une vraie raison : colonne calculee, colonne recalculee a
   chaque modification, champ de metadonnees, ou droits du document. */
var GENRES_MODIFIABLES = ['texte', 'texte_long', 'date', 'dateheure', 'nombre', 'oui_non', 'choix', 'etiquettes', 'personne', 'lien', 'reference', 'references', 'autre'];
var MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
var COULEURS_BADGES = ['green-menthe', 'blue-ecume', 'purple-glycine', 'orange-terre-battue', 'pink-tuile',
  'yellow-tournesol', 'brown-caramel', 'green-archipel'];

/* DEROGATION PALETTE : les couleurs écrites en dur dans ce script (dessins,
   palette des façades et des toits, couleurs de la météo, décor de la ville)
   sont celles de l'illustration isométrique dessinée en SVG, pas des couleurs
   d'interface. L'information n'est jamais portée par la couleur seule : chaque
   immeuble a son étape et sa météo en texte (étiquette, info-bulle, fiche, vue
   en liste). Les couleurs de l'interface utilisent les jetons du DSFR. */

/* --------------------------------------------------------------------------
   [MODIFIABLE] LES DESSINS DE LA VILLE
   Chaque valeur d'etape d'une ville est dessinee avec l'un de ces dessins.
   cle : nom technique (ne pas toucher) ; libelle : nom montre a l'agent ;
   couleur : couleur de facade proposee par defaut ; categorie : sert aux
   filtres (chantier, service, pause, ferme).
   -------------------------------------------------------------------------- */
var DESSINS = [
  { cle: 'terrain',      libelle: 'Terrain réservé',              couleur: '#9E9E9E', categorie: 'chantier', aide: 'Un terrain nu avec un panneau : rien n\'a encore commencé.' },
  { cle: 'etude',        libelle: 'Étude du terrain',             couleur: '#D9A400', categorie: 'chantier', aide: 'Des piquets de géomètre reliés par un ruban : on étudie, on analyse.' },
  { cle: 'palissade',    libelle: 'Palissade posée',              couleur: '#E3B200', categorie: 'chantier', aide: 'Le terrain est clôturé : le feu vert est donné, le chantier va démarrer.' },
  { cle: 'fondations',   libelle: 'Fondations et grue',           couleur: '#F0A42E', categorie: 'chantier', aide: 'La dalle est coulée et la grue installée : le travail démarre.' },
  { cle: 'chantier',     libelle: 'Les étages montent',           couleur: '#F08A2E', categorie: 'chantier', aide: 'Échafaudage et grue : plus l\'étape est avancée, plus il y a d\'étages.' },
  { cle: 'termine',      libelle: 'Immeuble terminé',             couleur: '#3F7FE0', categorie: 'service',  aide: 'L\'immeuble est fini, les fenêtres sont allumées.' },
  { cle: 'gratteciel',   libelle: 'Gratte-ciel',                  couleur: '#2E9E5B', categorie: 'service',  aide: 'Un beau gratte-ciel : c\'est livré, en service, réussi.' },
  { cle: 'demenagement', libelle: 'Déménagement',                 couleur: '#8A5CD6', categorie: 'chantier', aide: 'Immeuble terminé avec une grue de déménagement : un transfert est en cours.' },
  { cle: 'pause',        libelle: 'Chantier à l\'arrêt',          couleur: '#8C8C8C', categorie: 'pause',    aide: 'Chantier interrompu, fenêtres éteintes : en pause ou en attente.' },
  { cle: 'ferme',        libelle: 'Immeuble fermé',               couleur: '#6E6E6E', categorie: 'ferme',    aide: 'Immeuble gris, porte condamnée : archivé, abandonné, clôturé.' }
];
/* [MODIFIABLE] Mots qui, dans une valeur d'etape, font proposer un dessin.
   Comparaison sans accent ni majuscule ; le premier mot trouve l'emporte,
   dans l'ordre de cette liste. Les valeurs sans mot reconnu recoivent un
   dessin selon leur rang (les premieres en terrain, les suivantes en
   chantier). */
var MOTS_DESSINS = [

function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERREUR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'AVERTISSEMENT') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('AVERTISSEMENT', 'Voile de chargement masque automatiquement apres 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Chargement…'; }
  /* Le voile n'apparait qu'au-dela du seuil : une operation breve ne
     provoque plus de clignotement de l'ecran. masquerLoader annule ce
     delai, donc le voile n'est jamais pose pour une operation rapide. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight force un reflow avant le retrait de la classe. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('AVERTISSEMENT', quoi, e); });
  }
  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';
  var div = document.createElement('div');
  div.textContent = String(texte);
  /* Les guillemets sont echappes en plus des chevrons : la sortie alimente
     aussi des valeurs d'attributs (title, data-*, value), ou un guillemet
     non echappe permettrait de sortir de l'attribut. */
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if (up === 'BIBLIOTHEQUE_CENTRALE') { return true; }
  if (up.indexOf('BIBLIOTHEQUE') !== -1 && brut.charAt(brut.length - 1) === '_') { return true; }
  /* Bibliothèques de réglages des widgets : leurs lignes sont des
     réglages techniques (CLE = CONFIG:xxx, VALEUR = texte JSON), jamais des
     données à dessiner. */
  if (up.indexOf('BIBLIOTHEQUE') === 0) { return true; }
  if (etat.biblio && brut === etat.biblio) { return true; }
  if (etat.meta && etat.meta.colonnes && etat.meta.colonnes[brut]) {
    var ids = etat.meta.colonnes[brut].map(function (c) { return c.colId; });
    if (ids.indexOf('CLE') !== -1 && ids.indexOf('VALEUR') !== -1) { return true; }
  }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

  svg.setAttribute('focusable', 'false');
  var texte = document.createElementNS(ns, 'text');
  texte.setAttribute('x', '2');
  texte.setAttribute('y', '27');
  texte.setAttribute('font-size', '19');
  texte.setAttribute('textLength', '96');
  texte.setAttribute('lengthAdjust', 'spacingAndGlyphs');
  [['made', 'w-logo__made'], ['X', 'w-logo__x'], ['Cé', 'w-logo__ce']].forEach(function (morceau) {

/* === SECTION : UTILITAIRES DOM ===
   Le DOM est construit par textContent : aucune donnee n'est jamais inseree
   comme HTML. */
function creer(tag, o, enfants) {
  var n = document.createElement(tag);
  o = o || {};
  if (o.classe) { n.className = o.classe; }
  if (o.id) { n.id = o.id; }
  if (o.texte !== undefined && o.texte !== null) { n.textContent = String(o.texte); }
  if (o.attrs) {
    Object.keys(o.attrs).forEach(function (k) {
      var v = o.attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      n.setAttribute(k, v === true ? '' : String(v));
    });
  }
  if (tag === 'button' && !n.hasAttribute('type')) { n.setAttribute('type', 'button'); }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') { n.setAttribute('autocomplete', 'off'); }
  if (o.valeur !== undefined && o.valeur !== null) { n.value = String(o.valeur); }
  if (o.coche) { n.checked = true; }
  if (o.clic) { n.addEventListener('click', o.clic); }
  if (o.change) { n.addEventListener('change', o.change); }
  if (o.saisie) { n.addEventListener('input', o.saisie); }
  (enfants || []).forEach(function (e) {
    if (e === null || e === undefined || e === false) { return; }
    n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
  });
  return n;
}

function bouton(libelle, variante, icone, clic, o) {
  o = o || {};
  var classes = ['fr-btn'];
  if (variante === 'secondaire') { classes.push('fr-btn--secondary'); }
  if (variante === 'tertiaire') { classes.push('fr-btn--tertiary'); }
  if (variante === 'discret') { classes.push('fr-btn--tertiary-no-outline'); }
  if (o.petit) { classes.push('fr-btn--sm'); }
  if (icone) { classes.push('fr-icon-' + icone); classes.push(o.iconeSeule ? 'fr-btn--icon-only' : (o.iconeDroite ? 'fr-btn--icon-right' : 'fr-btn--icon-left')); }
  if (o.classe) { classes.push(o.classe); }
  /* Bouton a icone seule : son libelle n'est lu que par les lecteurs
     d'ecran, jamais affiche, quelle que soit la version du DSFR. */
  var b = creer('button', { classe: classes.join(' '), texte: o.iconeSeule ? null : libelle, id: o.id,
    attrs: { 'aria-label': o.aria || null, disabled: o.desactive || null } }, o.iconeSeule ? [creer('span', { classe: 'fr-sr-only', texte: libelle })] : null);
  if (o.attrs) { Object.keys(o.attrs).forEach(function (k) { b.setAttribute(k, o.attrs[k]); }); }
  if (clic) {
    b.addEventListener('click', function (e) {
      var r = clic(e);
      if (r && typeof r.then === 'function') { relayer(r, 'Action : ' + libelle); }
    });
  }
  return b;
}

function couleurBadge(texte) {
  var s = String(texte || '');

  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 997; }
  return COULEURS_BADGES[h % COULEURS_BADGES.length];
}

function groupeChamp(libelle, champ, aide, obligatoire) {

  }
  if (aide) { lab.appendChild(creer('span', { classe: 'fr-hint-text', texte: aide })); }

function saisie(id, valeur, o) {

    attrs: { type: o.type || 'text', placeholder: o.indice || null, inputmode: o.clavier || null } });
}

function liste(id, options, valeur, o) {

  options.forEach(function (op) {
    var opt = creer('option', { texte: op.libelle, attrs: { value: op.valeur } });
    if (String(op.valeur) === String(valeur)) { opt.selected = true; }
    s.appendChild(opt);

}

function vider(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

function normaliser(s) {
  return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

/* Identifiant technique en majuscules, sans accent, derive d'un libelle. */
function versIdentifiant(libelle) {
  var s = String(libelle || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if (!s) { s = 'INFO'; }
  if (/^[0-9]/.test(s)) { s = 'C_' + s; }
  return s;
}

/* === SECTION : DATES ET NOMBRES ===
   Dates : timestamps Unix en secondes, convertis en UTC pour ne pas decaler
   le jour civil en heure d'ete. Zero designe une date vide. */
function formaterDate(sec) {
  if (sec === null || sec === undefined || sec === '' || typeof sec !== 'number' || sec === 0) { return ''; }
  var d = new Date(sec * 1000);
  return d.getUTCDate() + ' ' + MOIS_COURTS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function dateVersSaisie(sec) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var d = new Date(sec * 1000);
  var m = d.getUTCMonth() + 1;
  var j = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (j < 10 ? '0' : '') + j;
}

function saisieVersDate(texte) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(texte || ''));

/* === Dates et heures ===
   Une colonne "Date et heure" porte son fuseau dans son type

function formaterDateHeure(sec, fuseau) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var p = partiesDansFuseau(sec, fuseau);
  return p.j + ' ' + MOIS_COURTS[p.m - 1] + ' ' + p.a + ', ' + (p.h < 10 ? '0' : '') + p.h + ' h ' + (p.mi < 10 ? '0' : '') + p.mi;

/* Heure locale d'un fuseau vers timestamp : on part de l'heure lue comme
   universelle, puis on corrige du decalage du fuseau a cet instant, deux
   fois pour les changements d'heure. */
function epochDansFuseau(a, m, j, h, mi, fuseau) {
  var cible = Date.UTC(a, m - 1, j, h, mi) / 1000;
  var t = cible;
  for (var k = 0; k < 2; k++) {
    var p = partiesDansFuseau(t, fuseau);
    var lu = Date.UTC(p.a, p.m - 1, p.j, p.h, p.mi) / 1000;
    t = t + (cible - lu);

/* === Nombres ===
   Les formats de la colonne sont respectes : pourcentage, monnaie, nombre
   de decimales. */

  if (o.numMode === 'currency') {

function formaterNombre(v) {

}

  if (n < min) return min;
  if (n > max) return max;

function lireNombreSaisi(texte) {
  var t = String(texte || '').replace(/\s/g, '').replace(',', '.');
  if (t === '') { return null; }

/* === SECTION : ACCES A L'API === */
function gristAvecTimeout(promesse, delaiMs) {

  var delai = new Promise(function (_, rejeter) {

/* Une ecriture n'a pas de delai court : abandonner l'attente n'annule pas
   l'ecriture, et l'annoncer en echec pousserait a recommencer (doublons).
   Si Grist tarde, l'agent en est informe et le voile reste pose. Au-dela
   de 2 minutes, l'attente est relachee sans annoncer d'echec : le resultat
   est inconnu et l'agent est invite a verifier avant de recommencer. */

    var m = 'Enregistrement en attente de confirmation du document… Ne recommencez pas : il se termine tout seul.';
    signalerStatut(m);
    annoncer(m);
    var l = document.getElementById('loaderMessage');
    if (l) { l.textContent = m; }
    // Le voile ne doit pas se retirer seul pendant l'attente (60 s).
    if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  }, DELAI_ATTENTE_ECRITURE_MS);
  var minutAbandon = null;
  var abandon = new Promise(function (_, rejeter) {
    minutAbandon = setTimeout(function () {
      var e = new Error('Écriture non confirmée après ' + (DELAI_ABANDON_ECRITURE_MS / 1000) + ' s');
      e.code = 'NON_CONFIRMEE';
      rejeter(e);
    }, DELAI_ABANDON_ECRITURE_MS);
  });
  try {
    var r = await Promise.race([grist.docApi.applyUserActions(actions), abandon]);
    if (attente) { signalerStatut('Enregistrement confirmé.'); }
    return r;

   intermediaire) ou refusee de facon passagere est relancee, avec un delai
   croissant, avant d'etre signalee. Les ecritures ne sont jamais rejouees. */
async function lireTable(tid) {
  var delais = [10000, 20000, DELAI_API_MS];
  var derniere = null;
  for (var essai = 0; essai < delais.length; essai++) {
    try {
      return await gristAvecTimeout(grist.docApi.fetchTable(tid), delais[essai]);
    } catch (e) {
      derniere = e;
      logSecurite('AVERTISSEMENT', 'Lecture de ' + tid + ' sans réponse, nouvel essai', e);
      if (essai < delais.length - 1) { await new Promise(function (ok) { setTimeout(ok, 1000); }); }
    }

   alors que son interface proposait la modification (regles d'acces non
   posees). L'interface bascule en lecture seule pour la suite. */
function estRefusDroits(e) {
  var m = String((e && (e.message || e)) || '') + ' ' + String((e && e.code) || '');
  return /blocked by|access rules|acl_deny|permission|not allowed|insufficient|read.?only|viewer|no write access|auth_no_edit|only owners or editors/i.test(m);
}
/* Refus pour tout le document : rôle de lecteur (ou document ouvert en

/* Note ce que Grist vient de refuser, pour ne retirer que cette action :
   création, modification d'une cellule, d'une ligne ou de toute la table.
   Renvoie ce qui change pour l'affichage ({ tout } ou { champs, lignes }),
   ou null si rien ne change. */
function noterRefus(e, actions) {
  if (!estRefusDroits(e)) { return null; }

  // Pièce jointe illisible : ce n'est pas un droit de modification.
  if (/cannot access attachment/.test(m)) { return null; }
  if (estRefusEcritureDocument(e)) {
    var change = etat.peutModifier || etat.peutParametrer;
    etat.peutModifier = false;
    etat.peutParametrer = false;
    logSecurite('INFO', 'Écriture refusée pour le document : consultation seule', e);
    return change ? { tout: true } : null;
  }
  var a = actions && actions[0];
  if (!a) { return null; }
  var type = a[0], table = a[1];
  if (etat.biblio && table === etat.biblio) {
    var chP = etat.peutParametrer;
    etat.peutParametrer = false;
    logSecurite('INFO', 'Paramétrage refusé par les règles d\'accès', e);
    return chP ? { tout: true } : null;

  if (!etat.config || table !== etat.config.table) { return null; }
  var r = etat.refus;
  var res = null;
  if (/^(Bulk)?AddRecord$/.test(type)) { r.creation = true; res = { creation: true }; }

      // ou message inconnu : le refus le plus étroit, la cellule.

      res = { lignes: ids, champs: champs };
    }

  logSecurite('INFO', 'Action refusée par les règles d\'accès : ' + type, e);
  return res;
}

/* Après un refus noté, l'affichage reflète les nouveaux droits. Dans une
   fiche ouverte, seuls les champs concernés sont remplacés ; celui où
   l'agent est en train de saisir l'est quand il le quitte. */
function remplacerChampsFiche(idFiche, champs) {
  var form = document.getElementById('vFicheForm');
  var p = projetParId(idFiche);
  if (!form || !p) { return; }
  Array.prototype.slice.call(form.children).forEach(function (el) {
    var c = el.getAttribute('data-champ');
    if (!c || (champs && champs.indexOf(c) === -1)) { return; }
    var remplacer = function () {
      if (!el.parentNode || etat.ouvert !== idFiche) { return; }
      var nouveau = editeurChamp(projetParId(idFiche) || p, c);
      nouveau.setAttribute('data-champ', c);
      el.parentNode.replaceChild(nouveau, el);

    if (el.contains(document.activeElement)) {
      el.addEventListener('focusout', function f(ev) {
        if (ev.relatedTarget && el.contains(ev.relatedTarget)) { return; }
        el.removeEventListener('focusout', f);
        setTimeout(remplacer, 0);

    } else { remplacer(); }
  });
}
function apresRefus(e, idFiche) {
  var r = e && e.refusNote;
  if (!r) { return; }
  setTimeout(function () {
    if (etat.modaleOuverte && idFiche && etat.ouvert === idFiche && projetParId(idFiche) && document.getElementById('vFicheForm')) {
      if (r.lignes && r.lignes.indexOf(idFiche) === -1) { return; }
      remplacerChampsFiche(idFiche, r.tout || r.tousChamps ? null : r.champs);

}

async function agir(actions) {

  if (!accesComplet()) { throw new Error('Accès complet non accordé au widget : écriture refusée'); }

    return await ecrireGrist(actions);

    try { var nr = noterRefus(e, actions); if (nr && e && typeof e === 'object') { e.refusNote = nr; } } catch (x) { /* sans effet */ }
    throw e;
  }

/* Une cellule en erreur arrive sous la forme ['E', ...] : elle vaut vide. */

/* === SECTION : METADONNEES DU DOCUMENT === */
async function chargerMeta() {
  etat.metaLueA = Date.now();

  var c = await lireTable('_grist_Tables_column');

      rawViewSectionRef: t.rawViewSectionRef ? t.rawViewSectionRef[i] : 0,

  }

    var info = { ref: c.id[j], tableId: tidC, colId: c.colId[j], type: c.type[j] || 'Any', label: c.label ? (c.label[j] || c.colId[j]) : c.colId[j],

    choix: 'Choix', etiquettes: 'Choix multiples', reference: 'Référence', references: 'Liste de références',
    pj: 'Pièces jointes', autre: 'Autre' };

/* Formule de declenchement qui ecraserait aussitot une valeur ecrite par le
