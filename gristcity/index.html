}

/* === SECTION : CREATION DE TABLE (sequence canonique) === */
async function poserFormules(tid, colonnes) {
  for (var i = 0; i < colonnes.length; i++) {
    var col = colonnes[i];
    if (!col.formula) { continue; }
    try {
      await agir([['ModifyColumn', tid, col.id, { isFormula: false, formula: col.formula,
        recalcWhen: col.recalcWhen === undefined ? 0 : col.recalcWhen, recalcDeps: null }]]);
    } catch (e) {
      logSecurite('INFO', 'Formule de déclenchement non posée sur ' + col.id, e);
    }
  }
}

/* Identifiant de table libre, calcule comme le fait la plateforme
   (suffixe numerique a partir de 2), pour pouvoir creer en un seul envoi
   des tables qui se referencent. L'identifiant reel est toujours relu. */
function idTableLibre(base, reserves) {
  var pris = Object.keys(etat.meta.tables).concat(reserves || []).map(function (x) { return x.toUpperCase(); });
  var id = base;
  var n = 2;
  while (pris.indexOf(id.toUpperCase()) !== -1) { id = base + n; n++; }
  return id;
}

/* Sequence de creation : tables creees en un seul envoi avec id, type et
   label seulement ; les pages que la plateforme cree avec elles sont
   supprimees aussitot, en un seul envoi, avant toute autre preparation, si
   bien qu'elles n'apparaissent qu'un instant ; puis formules une par une et
   options de colonnes. */
async function creerTables(defs) {
  var ret = await agir(defs.map(function (d) {
    return ['AddTable', d.id, d.colonnes.map(function (c) { return { id: c.id, type: c.type, label: c.label || c.id }; })];
  }));
  var rv = ret && ret.retValues ? ret.retValues : [];
  var tids = defs.map(function (d, i) { return rv[i] && rv[i].table_id ? rv[i].table_id : d.id; });
  var vues = [];
  rv.forEach(function (r) { if (r && Array.isArray(r.views)) { r.views.forEach(function (v) { if (v && v.id) { vues.push(v.id); } }); } });
  if (!vues.length) {
    await chargerMeta();
    tids.forEach(function (t) { var m = etat.meta.tables[t]; if (m && m.primaryViewId) { vues.push(m.primaryViewId); } });
  }
  if (vues.length) {
    try {
      await agir(vues.map(function (v) { return ['RemoveRecord', '_grist_Views', v]; }));
    } catch (e) {
      logSecurite('INFO', 'Suppression des pages auto-créées non possible', e);
    }
  }
  for (var i = 0; i < defs.length; i++) {
    await poserFormules(tids[i], defs[i].colonnes);
    for (var k = 0; k < defs[i].colonnes.length; k++) {
      var c = defs[i].colonnes[k];
      if (!c.widgetOptions) { continue; }
      try {
        await agir([['ModifyColumn', tids[i], c.id, { widgetOptions: JSON.stringify(c.widgetOptions) }]]);
      } catch (e) {
        logSecurite('AVERTISSEMENT', 'Options non posées sur ' + c.id, e);
      }
    }
  }
  return tids;
}

/* Renommage des tables (nom affiché de la vue brute). ATTENTION : dans
   Grist, renommer la vue brute renomme aussi l'identifiant de la table
   (« 👥 Équipe » devient « Equipe »). On renomme donc en dernier, puis on
   relit les identifiants par la référence interne des tables, qui, elle, ne
   change pas. Retourne { ancienIdentifiant: nouvelIdentifiant }. */
async function renommerTables(liste) {
  await chargerMeta();
  var refs = {};
  for (var i = 0; i < liste.length; i++) {
    var meta = etat.meta.tables[liste[i][0]];
    if (!meta) { continue; }
    refs[liste[i][0]] = meta.ref;
    if (meta.rawViewSectionRef) {
      try { await agir([['UpdateRecord', '_grist_Views_section', meta.rawViewSectionRef, { title: liste[i][1] }]]); }
      catch (e) { logSecurite('INFO', 'Nom affiché non posé sur ' + liste[i][0], e); }
    }
  }
  await chargerMeta();
  var res = {};
  Object.keys(refs).forEach(function (ancien) {
    res[ancien] = ancien;
    Object.keys(etat.meta.tables).forEach(function (t) { if (etat.meta.tables[t].ref === refs[ancien]) { res[ancien] = t; } });
  });
  return res;
}

/* Ajout d'une colonne en deux temps : creee nue, puis typee. Les deux temps
   sont proteges separement. L'identifiant reel est relu apres creation. */
async function ajouterColonne(tid, colId, type, widgetOptions) {
  var ret = await agir([['AddColumn', tid, colId, {}]]);
  var reel = colId;
  if (ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId) { reel = ret.retValues[0].colId; }
  /* isFormula: false indispensable : sans lui, la plateforme laisse la
     colonne ajoutee en formule vide, ou rien ne peut etre ecrit. */
  var propr = { type: type, label: reel, isFormula: false };
  if (widgetOptions) { propr.widgetOptions = JSON.stringify(widgetOptions); }
  try {
    await agir([['ModifyColumn', tid, reel, propr]]);
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Colonne ' + reel + ' créée mais non typée', e);
    throw e;
  }
  return reel;
}

/* === SECTION : BIBLIOTHEQUE VILLE ===
   Table technique de parametrage : une ligne par ville (CLE = CONFIG:xxx),
   configuration en JSON dans VALEUR. */
async function reparerSchemaBiblio() {
  if (!etat.biblio) { return; }
  try {
    await chargerMeta();
    for (var k = 0; k < COLONNES_BIBLIO.length; k++) {
      var col = COLONNES_BIBLIO[k];
      var ex = infoColonne(etat.biblio, col.id);
      if (!ex) {
        var creee = false;
        try { await agir([['AddColumn', etat.biblio, col.id, {}]]); creee = true; } catch (e) { logSecurite('INFO', 'Colonne ' + col.id + ' non ajoutée', e); }
        if (creee) {
          var propr = { type: col.type, label: col.label, isFormula: false };
          if (col.formula) { propr.formula = col.formula; propr.recalcWhen = col.recalcWhen; propr.recalcDeps = null; }
          try { await agir([['ModifyColumn', etat.biblio, col.id, propr]]); } catch (e2) { logSecurite('INFO', 'Colonne ' + col.id + ' non typée', e2); }
        }
      } else if (col.formula && String(ex.formula).trim() !== col.formula) {
        try {
          await agir([['ModifyColumn', etat.biblio, col.id, { isFormula: false, formula: col.formula, recalcWhen: col.recalcWhen, recalcDeps: null }]]);
        } catch (e3) { logSecurite('INFO', 'Formule non rétablie sur ' + col.id, e3); }
      }
    }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Vérification du schéma de la bibliothèque impossible', e);
  }
}

async function assurerBibliotheque() {
  await chargerMeta();
  var trouvee = trouverTable(ID_BIBLIO);
  if (trouvee) {
    etat.biblio = trouvee;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  await chargerMeta();
  var entreTemps = trouverTable(ID_BIBLIO);
  if (entreTemps) {
    etat.biblio = entreTemps;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  return finaliserBibliotheque((await creerTables([{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }]))[0]);
}

/* Apres sa creation, la bibliotheque recoit son nom affiche ; son
   identifiant est relu, le renommage pouvant le changer. */
async function finaliserBibliotheque(tid) {
  etat.biblio = tid;
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    if (t && t.rawViewSectionRef) {
      await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { title: LABEL_BIBLIO }]]);
    }
    await chargerMeta();
    var relu = trouverTable(ID_BIBLIO);
    if (relu) { etat.biblio = relu; }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Renommage de la bibliothèque non abouti', e);
  }
  await reparerSchemaBiblio();
  return etat.biblio;
}

/* Plusieurs tableaux par document : une ligne de configuration par tableau,
   de cle CONFIG:<identifiant>. La ligne CONFIG des versions anterieures est
   lue comme un tableau, sans conversion. La liste est lue dans une variable
   locale puis affectee d'un seul coup : un rafraichissement parallele ne la
   trouve jamais videe en cours de lecture. */
function elementsFocusables(racine) {
  return Array.prototype.filter.call(racine.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
    function (n) { return !n.disabled && n.offsetParent !== null; });
}

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    var premier = f[0];
    var dernier = f[f.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  };
}

function ouvrirModale(o) {
  var ov = document.getElementById('wModale');
  var boite = document.getElementById('wModaleBoite');
  boite.className = 'w-dialogue' + (o.etroite ? ' w-dialogue--etroit' : '') + (o.laterale ? ' w-dialogue--lateral' : '');
  ov.classList.toggle('w-overlay--lateral', !!o.laterale);
  document.getElementById('wModaleTitre').textContent = o.titre;
  var sous = document.getElementById('wModaleSous');
  sous.textContent = o.sousTitre || '';
  sous.hidden = !o.sousTitre;
  var corps = document.getElementById('wModaleCorps');
  vider(corps);
  (o.corps || []).forEach(function (n) { if (n) { corps.appendChild(n); } });
  var pied = document.getElementById('wModalePied');
  vider(pied);
  (o.pied || []).forEach(function (n) { if (n) { pied.appendChild(n); } });
  if (!etat.modaleOuverte) { _modale.retour = document.activeElement; }
  _modale.surFermeture = o.surFermeture || null;
  _modale.fermerDehors = !!o.fermerDehors;
  /* Clic en dehors de la fenetre : fermeture, si le clic commence et se
     termine en dehors (une selection de texte qui deborde ne ferme rien). */
  if (!_modale.dehorsBranche) {
    _modale.dehorsBranche = true;
    ov.addEventListener('mousedown', function (e) { _modale.departDehors = e.target === ov; });
    ov.addEventListener('click', function (e) {
      if (_modale.fermerDehors && _modale.departDehors && e.target === ov) { fermerModale(); }
      _modale.departDehors = false;
    });
  }
  etat.modaleOuverte = true;
  ov.classList.add('actif');
  void ov.offsetHeight;
  if (_modale.pieger) { ov.removeEventListener('keydown', _modale.pieger); }
  _modale.pieger = fabriquerPiege(boite, fermerModale);
  ov.addEventListener('keydown', _modale.pieger);
  var cible = o.focus ? document.getElementById(o.focus) : null;
  var f = cible || elementsFocusables(corps)[0] || document.getElementById('wModaleFermer');
  if (f) { f.focus(); }
}

function fermerModale() {
  var ov = document.getElementById('wModale');
  if (!ov.classList.contains('actif')) { return; }
  ov.classList.remove('actif');
  if (_modale.pieger) { ov.removeEventListener('keydown', _modale.pieger); _modale.pieger = null; }
  etat.modaleOuverte = false;
  var rappel = _modale.surFermeture;
  _modale.surFermeture = null;
  var r = _modale.retour;
  _modale.retour = null;
  // Repère de l'élément d'origine : le redessin (rappel) peut le remplacer
  // par un élément neuf ; le focus lui est alors rendu.
  var repere = r && r.getAttribute ? { id: r.id, dataId: r.getAttribute('data-id'), classe: r.classList && r.classList[0] } : null;
  if (rappel) { rappel(); }
  if (r && !document.body.contains(r) && repere) {
    var neuf = repere.id ? document.getElementById(repere.id) : null;
    if (!neuf && repere.dataId && repere.classe) {
      neuf = Array.prototype.filter.call(document.querySelectorAll('.' + repere.classe), function (x) { return x.getAttribute('data-id') === repere.dataId; })[0] || null;
    }
    r = neuf;
  }
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  else { var t = document.getElementById('titreVue'); if (t && etat.vue === 'ville') { t.focus(); } }
  if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
}

/* Confirmation ou saisie courte. Resout true/false, ou le texte saisi. */
function confirmerAction(titre, message, libelleOui, saisieInitiale, libelleNon) {
  return new Promise(function (resolve) {
    var ov = document.getElementById('wConfirmOverlay');
    if (!ov) { resolve(false); return; }
    if (_confirm.resolution) { _confirm.resolution(null); }
    _confirm.resolution = resolve;
    document.getElementById('wConfirmTitre').textContent = titre;
    document.getElementById('wConfirmMsg').textContent = message || '';
    var zone = document.getElementById('wConfirmChamp');
    vider(zone);
    var champ = null;
    if (saisieInitiale !== undefined) {
      champ = saisie('wConfirmSaisie', saisieInitiale);
      zone.appendChild(groupeChamp('Nouveau nom', champ, null, true));
    }
    document.getElementById('wConfirmOui').textContent = libelleOui || 'Confirmer';
    document.getElementById('wConfirmNon').textContent = libelleNon || 'Annuler';
    _confirm.retour = document.activeElement;
    ov.classList.add('actif');
    void ov.offsetHeight;
    if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); }
    _confirm.pieger = fabriquerPiege(ov, function () { terminerConfirmation(null); });
    ov.addEventListener('keydown', _confirm.pieger);
    if (champ) {
      champ.focus();
      champ.select();
      champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); terminerConfirmation(true); } });
    } else {
      document.getElementById('wConfirmOui').focus();
    }
  });
}

function terminerConfirmation(oui) {
  var ov = document.getElementById('wConfirmOverlay');
  var champ = document.getElementById('wConfirmSaisie');
  // null : fenêtre fermée sans choix (Échap, autre confirmation) ; false : « Non »
  var valeur = oui ? (champ ? champ.value.trim() : true) : (oui === null ? null : false);
  ov.classList.remove('actif');
  if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); _confirm.pieger = null; }
  var r = _confirm.retour;
  _confirm.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  var res = _confirm.resolution;
  _confirm.resolution = null;
  if (res) { res(valeur); }
}

function aide(id, sujet, texte, aDroite) {
  var panneau = creer('p', { classe: 'w-aide__texte' + (aDroite ? ' w-aide__texte--droite' : ''), id: id + '_aide', texte: texte });
  panneau.hidden = true;
  var b = creer('button', { classe: 'w-aide', attrs: { type: 'button', 'aria-label': 'Aide : ' + sujet, 'aria-expanded': 'false', 'aria-controls': id + '_aide' } },
    [creer('span', { classe: 'w-aide__rond', texte: 'i', attrs: { 'aria-hidden': 'true' } })]);
  var basculer = function (ouvrir) {
    panneau.hidden = !ouvrir;
    b.setAttribute('aria-expanded', ouvrir ? 'true' : 'false');
  };
  b.addEventListener('click', function () { basculer(panneau.hidden); });
  b.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panneau.hidden) { e.stopPropagation(); basculer(false); } });
  return { bouton: b, panneau: panneau };
}

/* Texte d'explication de la ville, sous son nom. Au-dela de trois lignes
   environ, il est replie avec "Lire la suite". */
function blocExplication(texte) {
  var p = creer('p', { classe: 'w-explication', id: 'tExplication', texte: texte });
  var long = texte.length > 220 || texte.split('\n').length > 3;
  if (!long) { return p; }
  p.classList.add('w-explication--repliee');
  var b = bouton('Lire la suite', 'discret', null, function () {
    var replie = p.classList.toggle('w-explication--repliee');
    b.textContent = replie ? 'Lire la suite' : 'Réduire';
    b.setAttribute('aria-expanded', replie ? 'false' : 'true');
  }, { petit: true, id: 'tLireSuite' });
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-controls', 'tExplication');
  return creer('div', {}, [p, b]);
}


/* Barre d'etapes : un segment par etape, son nom en dessous. Bleu pour les
   etapes faites et l'etape en cours (en gras), gris pour les etapes a
   venir : tout le parcours se lit d'un coup d'oeil. Les lecteurs d'ecran
   entendent l'etat de chaque etape. Sans parcours connu (point de depart
   pas encore choisi), la suite est annoncee "selon votre choix". */
function stepper(n, noms, aller, actionFinale) {
  var d = creer('div', { classe: 'fr-stepper w-stepper' });
  var connu = noms.length > 1;
  d.appendChild(creer('h2', { classe: 'fr-stepper__title', attrs: { tabindex: '-1', id: 'titreVue' } }, [noms[n - 1],
    creer('span', { classe: 'fr-stepper__state', texte: connu ? 'Étape ' + n + ' sur ' + noms.length : 'Étape ' + n })]));
  var liste = noms.slice();
  if (!connu) { liste.push('Suite selon votre choix'); }
  var ol = creer('ol', { classe: 'w-etapes', attrs: { 'aria-label': 'Étapes' } });
  liste.forEach(function (nom, i) {
    var rang = i + 1;
    var etatEtape = rang < n ? 'faite' : (rang === n ? 'en-cours' : 'a-venir');
    /* Une etape deja atteinte (ou toutes, dans les parametrages) se rejoint
       d'un clic ; l'etape en cours et les etapes jamais atteintes ne sont
       pas des liens. */
    var action = rang !== n && aller ? aller(rang) : null;
    var suivante = !!action && rang === n + 1;
    /* Etape juste avant : invitation "Retour", symetrique de "Continuer",
       pour revenir en arriere sans chercher. [MODIFIABLE : le libelle] */
    var precedente = !!action && rang === n - 1;
    /* Etape faite : coche verte devant son nom. Etape suivante : invitation
       "Continuer". La coche s'ajoute au texte, l'etat reste lu par les
       lecteurs d'ecran. */
    var contenu = [
      creer('span', { classe: 'w-etapes__segment', attrs: { 'aria-hidden': 'true' } }),
      creer('span', { classe: 'w-etapes__ligne' }, [
        etatEtape === 'faite' ? creer('span', { classe: 'fr-icon-checkbox-circle-fill w-etapes__coche', attrs: { 'aria-hidden': 'true' } }) : null,
        creer('span', { classe: 'w-etapes__nom', texte: nom })]),
      creer('span', { classe: 'fr-sr-only', texte: etatEtape === 'faite' ? ' (terminée)' : (etatEtape === 'en-cours' ? ' (en cours)' : ' (à venir)') }),
      suivante ? creer('span', { classe: 'w-etapes__appel' }, ['Continuer', creer('span', { classe: 'fr-icon-arrow-right-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } })]) : null,
      precedente ? creer('span', { classe: 'w-etapes__appel w-etapes__appel--retour' }, [creer('span', { classe: 'fr-icon-arrow-left-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } }), 'Retour']) : null];
    var li = creer('li', { classe: 'w-etapes__item w-etapes__item--' + etatEtape + (action ? ' w-etapes__item--lien' : '') + (suivante ? ' w-etapes__item--suivante' : '') + (precedente ? ' w-etapes__item--precedente' : '') },
      action ? [creer('button', { classe: 'w-etapes__bouton', id: 'kEtape' + rang, attrs: { type: 'button' }, clic: action }, contenu)] : contenu);
    if (etatEtape === 'en-cours') { li.setAttribute('aria-current', 'step'); }
    ol.appendChild(li);
  });
  /* A la derniere etape, l'action finale (creer, brancher, enregistrer)
     prend place au bout de la ligne des etapes, la ou se trouve d'habitude
     "Continuer". */
  d.appendChild(actionFinale ? creer('div', { classe: 'w-etapes-rangee' }, [ol,
    bouton(actionFinale.libelle, null, 'check-line', actionFinale.action, { id: actionFinale.id, classe: 'w-etapes-action' })]) : ol);
  return d;
}


/* ==========================================================================
   SECTION 2 : MOTEUR DE LA VILLE [INTOUCHABLE sauf couleurs signalees]
   Plan en ruban pour les ecrans larges, dessin en 3D isometrique, etiquettes
   a taille constante, zoom et deplacement. Le moteur ne connait que des
   « immeubles » (objets p) : la section 3 les fabrique a partir de la
   configuration de chaque ville.
   ========================================================================== */

var NS_SVG = 'http://www.w3.org/2000/svg';
function $(id) { return document.getElementById(id); }
function borner(v, min, max) { return Math.max(min, Math.min(max, v)); }
// Accord singulier ou pluriel, sans parenthèses : « 1 immeuble », « 3 immeubles », « 5 000 immeubles »
function accord(n, singulier, pluriel) {
  return (typeof n === 'number' ? formaterNombre(n) : String(n)) + ' ' + (n >= 2 ? (pluriel || singulier + 's') : singulier);
}
// Comparaison de textes en français, avec un seul comparateur gardé pour toute la session
// (même ordre que localeCompare, bien plus rapide dans les grands tris)
var _collateurFr = null;
function comparerTextes(a, b) {
  if (_collateurFr === null) { try { _collateurFr = new Intl.Collator('fr'); } catch (e) { _collateurFr = false; } }
  return _collateurFr ? _collateurFr.compare(a, b) : a.localeCompare(b, 'fr');
}
// Petit générateur pseudo-aléatoire stable (les arbres restent toujours au même endroit).
function aleatoire(graine) {
  var s = graine >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function dessinDe(cle) {
  for (var i = 0; i < DESSINS.length; i++) { if (DESSINS[i].cle === cle) { return DESSINS[i]; } }
  return DESSINS[0];
}

/* --------------------------------------------------------------------------
   2.1 PLAN DE LA VILLE
   Unité : 1 = une case de la grille (un immeuble occupe une parcelle de 2 x 2).
   -------------------------------------------------------------------------- */
const LOT = 2;          // taille d'une parcelle
const MARGE_Q = 0.5;    // trottoir autour d'un quartier
const ROUTE = 1;        // largeur des rues entre quartiers
const RUE = ROUTE * 0.45;   // demi-largeur de la rue qui entoure chaque emplacement

// Ordre des immeubles dans un quartier : les terminés au fond, les chantiers devant.
function ordreDansQuartier(a, b) {
  const rang = { service: 0, chantier: 1, pause: 2, ferme: 3 };
  return (rang[a.categorie] - rang[b.categorie]) || (b.niveau - a.niveau) || comparerTextes(String(a.nom), String(b.nom));
}

// Parcelles « de respiration » d'une grille cols x rows (indices des cases) :
// les grands quartiers sont traversés par une allée de jardins (colonne et
// rangée du milieu), les quartiers moyens ont une petite place au centre.
// [MODIFIABLE] SEUIL_ALLEE : nombre de colonnes ou de rangées à partir duquel
// une allée traverse le quartier ; SEUIL_PLACE : nombre d'immeubles à partir
// duquel un quartier a une place au centre.
const SEUIL_ALLEE = 4;
const SEUIL_PLACE = 6;
function parcellesRespiration(cols, rows, n) {
  const res = new Set();
  if (cols >= SEUIL_ALLEE) { const c = Math.floor(cols / 2); for (let r = 0; r < rows; r++) res.add(r * cols + c); }
  if (rows >= SEUIL_ALLEE) { const r = Math.floor(rows / 2); for (let c = 0; c < cols; c++) res.add(r * cols + c); }
  if (!res.size && n >= SEUIL_PLACE && cols >= 3 && rows >= 3) res.add(Math.floor(rows / 2) * cols + Math.floor(cols / 2));
  return res;
}

// Disposition d'un quartier dans un emplacement de taille cw x ch (en cases de grille).
// aerer : réserve des parcelles de respiration (décor activé).
// Retourne { cols, rows, m, w, h, respiration } ou null si le quartier n'y tient pas.
function dispositionQuartier(n, cw, ch, m, aerer) {
  const libreW = cw - 2 * RUE - 2 * m, libreH = ch - 2 * RUE - 2 * m;
  let mieux = null;
  for (let cols = 1; cols <= n + 2; cols++) {
    // Trop large : écarté avant de compter les rangées (même résultat, bien plus rapide pour les grands quartiers)
    if (cols * LOT > libreW + 1e-6) continue;
    // Nombre de rangées : assez pour les immeubles, en plus des parcelles de respiration
    let rows = Math.ceil(n / cols), resp = aerer ? parcellesRespiration(cols, rows, n) : new Set();
    while (cols * rows - resp.size < n) { rows++; resp = aerer ? parcellesRespiration(cols, rows, n) : new Set(); }
    if (cols * LOT > libreW + 1e-6 || rows * LOT > libreH + 1e-6) continue;
    const vide = cols * rows - n - resp.size;   // parcelles inutilisées (plantées d'arbres)
    const forme = Math.abs(Math.log((cols * LOT / libreW) / (rows * LOT / libreH)));
    const score = vide * 2 + forme;
    if (!mieux || score < mieux.score) mieux = { cols, rows, m, w: cols * LOT + 2 * m, h: rows * LOT + 2 * m, score, respiration: resp };
  }
  return mieux;
}

// Plan EN RUBAN, pour profiter d'un écran paysage.
// Attention : en vue isométrique, une ville rectangulaire forme toujours un losange deux
// fois plus large que haut. Pour remplir une zone bien plus large, la ville est
// faite de CASES de même taille, en rangées décalées d'une demi-case
// (quinconce) : les rangées s'emboîtent et la ville s'étire de gauche à droite.
// Une case accueille un grand quartier, ou deux moyens, ou jusqu'à quatre petits.
// ratioEcran : largeur / hauteur de la zone de la carte.
function calculerPlan(projets, ratioEcran, avecParcs) {
  // 1. Regrouper les immeubles par quartier (rang du quartier, puis nom)
  const groupes = new Map();
  projets.forEach((p) => {
    const k = p.quartier;
    if (!groupes.has(k)) groupes.set(k, []);
    groupes.get(k).push(p);
  });
  const cles = [...groupes.keys()].sort((a, b) => {
    const pa = groupes.get(a)[0], pb = groupes.get(b)[0];
    return (pa.rangQuartier - pb.rangQuartier) || comparerTextes(String(pa.quartierLibelle), String(pb.quartierLibelle));
  });
  const quartiers = cles.map((k) => ({ cle: k, libelle: groupes.get(k)[0].quartierLibelle, liste: groupes.get(k).slice().sort(ordreDansQuartier) }));

  // 2. Taille d'une case : juste assez pour le plus grand quartier en carré
  const plusGrand = Math.max(...quartiers.map((q) => q.liste.length));
  let cotes = Math.max(2, Math.ceil(Math.sqrt(plusGrand)));
  while (!dispositionQuartier(plusGrand, cotes * LOT + 2 * MARGE_Q + 2 * RUE + 0.2, cotes * LOT + 2 * MARGE_Q + 2 * RUE + 0.2, MARGE_Q, avecParcs)) cotes++;
  const C = cotes * LOT + 2 * MARGE_Q + 2 * RUE + 0.2;

  // 3. Emplacement de chaque quartier : le plus petit où il tient
  quartiers.forEach((q) => {
    const n = q.liste.length;
    q.taille = 'case';
    q.dispo = dispositionQuartier(n, C, C, MARGE_Q, avecParcs);
    const enQuart = dispositionQuartier(n, C / 2, C / 2, 0.15, avecParcs);
    const enMoitie = dispositionQuartier(n, C / 2, C, 0.25, avecParcs);
    if (enQuart) { q.taille = 'quart'; q.dispo = enQuart; }
    else if (enMoitie) { q.taille = 'moitie'; q.dispo = enMoitie; }
  });

  // 4. Remplissage des cases : grands quartiers d'abord, puis moyens, puis petits.
  const rang = { case: 0, moitie: 1, quart: 2 };
  const aPlacer = quartiers.slice().sort((a, b) => rang[a.taille] - rang[b.taille]);
  const cases = [];
  aPlacer.forEach((q) => {
    if (q.taille === 'case') { cases.push({ entier: q }); return; }
    if (q.taille === 'moitie') {
      let ce = cases.find((c) => !c.entier && c.moities.some((m) => m === null));
      if (!ce) { ce = { moities: [null, null] }; cases.push(ce); }
      ce.moities[ce.moities.indexOf(null)] = { q };
      return;
    }
    let place = false;
    for (const ce of cases) {
      if (ce.entier) continue;
      for (const m of ce.moities) {
        if (m && m.quarts && m.quarts.includes(null)) { m.quarts[m.quarts.indexOf(null)] = q; place = true; break; }
      }
      if (place) break;
    }
    if (place) return;
    let ce = cases.find((c) => !c.entier && c.moities.includes(null));
    if (!ce) { ce = { moities: [null, null] }; cases.push(ce); }
    ce.moities[ce.moities.indexOf(null)] = { quarts: [q, null] };
  });

  // 4 bis. Avec le décor, des parcs (grande roue, étang...) prennent des quarts de
  //    case libres, à côté des quartiers, au lieu de cases entières vides.
  if (avecParcs) {
    const nbParcs = Math.max(cases.length >= 3 ? 2 : 1, Math.round(cases.length * PROPORTION_PARCS));
    for (let k = 0; k < nbParcs; k++) {
      const parc = { parc: true };
      let place = false;
      for (const ce of cases) {
        if (ce.entier) continue;
        for (const m of ce.moities) { if (m && m.quarts && m.quarts.includes(null)) { m.quarts[m.quarts.indexOf(null)] = parc; place = true; break; } }
        if (place) break;
        const iv = ce.moities.indexOf(null);
        if (iv !== -1) { ce.moities[iv] = { quarts: [parc, null] }; place = true; break; }
      }
      if (!place) { cases.push({ moities: [{ quarts: [parc, null] }, null] }); }
    }
  }

  // 5. Nombre de rangées : celui qui donne la forme la plus proche de l'écran
  const N = Math.max(1, cases.length);
  const ratio = ratioEcran > 0 ? ratioEcran : 3;
  let K = 1, ecart = Infinity;
  for (let k = 1; k <= N; k++) {
    const pr = Math.ceil(N / k);
    const largeur = (2 * (pr - 1) + (k > 1 ? 1 : 0) + 2) * C * DEMI_L;
    const hauteur = (k + 1) * C * DEMI_H + 340;
    const e = Math.abs(Math.log((largeur / hauteur) / ratio));
    if (e < ecart) { ecart = e; K = k; }
  }
  const parRangee = Math.ceil(N / K);

  // 6. Position des cases : rangée r, colonne c, en quinconce
  const M = 1;
  const cellules = [];
  for (let r = 0; r < K; r++) {
    for (let c = 0; c < parRangee; c++) {
      const X = c + (r + (r % 2)) / 2;
      const Y = (r - (r % 2)) / 2 - c + (parRangee - 1);
      cellules.push({ x: M + X * C, y: M + Y * C, emplacements: [] });
    }
  }
  // Les places en trop deviennent des parcs, répartis régulièrement dans la ville
  const totalPlaces = cellules.length;
  const nbParcs = totalPlaces - cases.length;
  const placesParcs = new Set();
  for (let k = 0; k < nbParcs; k++) placesParcs.add(Math.min(totalPlaces - 1, Math.floor((k + 0.5) * totalPlaces / nbParcs)));
  let suivante = 0;
  cellules.forEach((cel, i) => {
    const ce = placesParcs.has(i) ? null : cases[suivante++];
    const ajouter = (q, x, y, w, h) => cel.emplacements.push({ q, x, y, w, h });
    if (!ce) { ajouter(null, cel.x, cel.y, C, C); return; }
    if (ce.entier) { ajouter(ce.entier, cel.x, cel.y, C, C); return; }
    ce.moities.forEach((m, k) => {
      const mx = cel.x + k * C / 2;
      if (!m) { ajouter(null, mx, cel.y, C / 2, C); return; }
      if (m.q) { ajouter(m.q, mx, cel.y, C / 2, C); return; }
      m.quarts.forEach((q, j) => ajouter(q, mx, cel.y + j * C / 2, C / 2, C / 2));
    });
  });

  // 7. Chaque quartier est centré dans son emplacement, puis ses parcelles sont posées
  cellules.forEach((cel) => cel.emplacements.forEach((em) => {
    if (em.q && em.q.parc) { em.q = null; return; }   // parc : emplacement sans quartier
    const q = em.q;
    if (!q) return;
    const d = q.dispo;
    q.cols = d.cols; q.rows = d.rows; q.w = d.w; q.h = d.h;
    q.x = em.x + (em.w - d.w) / 2;
    q.y = em.y + (em.h - d.h) / 2;
    // Les immeubles prennent les parcelles dans l'ordre, en sautant celles de respiration
    const centre = (i) => ({ x: q.x + d.m + (i % d.cols) * LOT + LOT / 2, y: q.y + d.m + Math.floor(i / d.cols) * LOT + LOT / 2 });
    q.lots = []; q.vides = []; q.respirations = [];
    let suivant = 0;
    for (let i = 0; i < d.cols * d.rows; i++) {
      if (d.respiration && d.respiration.has(i)) { q.respirations.push(Object.assign({ rang: q.respirations.length }, centre(i))); continue; }
      if (suivant < q.liste.length) q.lots.push(Object.assign({ p: q.liste[suivant++] }, centre(i)));
      else q.vides.push(centre(i));
    }
  }));

  const W = Math.max(...cellules.map((ce) => ce.x + C)) + M;
  const H = Math.max(...cellules.map((ce) => ce.y + C)) + M;
  return { quartiers, cellules, C, W, H };
}

// Rotation de la ville. Attention : avec le plan en ruban, seul le demi-tour (r = 2) garde une ville large.
function rotationPlan(plan, r) {
  const W = plan.W, H = plan.H;
  const fonctions = [
    (x, y) => [x, y],
    (x, y) => [H - y, x],
    (x, y) => [W - x, H - y],
    (x, y) => [y, W - x]
  ];
  return { f: fonctions[r], W: r % 2 ? H : W, H: r % 2 ? W : H };
}
function rectTourne(f, x0, y0, x1, y1) {
  const a = f(x0, y0), b = f(x1, y1);
  return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])];
}

/* --------------------------------------------------------------------------
   2.2 DESSIN EN 3D ISOMÉTRIQUE
   Une case de grille fait 64 x 32 pixels à l'écran.
   -------------------------------------------------------------------------- */
const DEMI_L = 32;     // demi-largeur d'une case à l'écran
const DEMI_H = 16;     // demi-hauteur d'une case à l'écran
const ETAGE = 13;      // [MODIFIABLE] hauteur d'un étage en pixels
const DEMI_BAT = 0.55; // demi-largeur d'un immeuble (en cases)
const HAUTEUR_SOL = 3; // épaisseur des quartiers

// [MODIFIABLE] Couleurs du décor (DEROGATION PALETTE : illustration SVG, voir la section 1)
const DECOR = {
  herbe: '#CFE5BE', terre1: '#B48A62', terre2: '#946E4B',
  route: '#C5CAD1', eau: '#9CC9E8', eauBord: '#7FB3D9',
  quartierDessus: '#DCEFCF', quartierGauche: '#A9CB93', quartierDroite: '#8DB577',
  parcelleChantier: '#E2CDAF', parcelleService: '#EEF2EA',
  feuillage1: '#6FB26B', feuillage2: '#8CCB7F', tronc: '#7A5A3A',
  vitreAllumee: '#FFE7A0', vitreEteinte: '#C7D6E6', beton: '#BDBDBD',
  grue: '#F2B300', echafaudage: '#E4794A', ferme: '#B4B4B4', parcelleFerme: '#E3E3E3',
  panneau: '#000091'          // bleu France (DSFR)
};

function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS_SVG, tag);
  if (attrs) Object.keys(attrs).forEach((k) => { if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); });
  if (parent) parent.appendChild(e);
  return e;
}
// Projection isométrique : (x, y, hauteur) de la grille vers (x, y) à l'écran.
function proj(x, y, z) { return [(x - y) * DEMI_L, (x + y) * DEMI_H - (z || 0)]; }
function points(liste) { return liste.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '); }
function poly(g, liste, fill, extra) { return svgEl('polygon', Object.assign({ points: points(liste), fill }, extra || {}), g); }
function ligne(g, a, b, couleur, epaisseur, extra) {
  return svgEl('line', Object.assign({ x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1), stroke: couleur, 'stroke-width': epaisseur || 1, 'stroke-linecap': 'round' }, extra || {}), g);
}
// Éclaircit (f > 1) ou assombrit (f < 1) une couleur.
function nuance(hex, f) {
  const n = parseInt(String(hex).slice(1), 16);
  if (isNaN(n)) return hex;
  const m = f >= 1 ? (c) => Math.round(c + (255 - c) * Math.min(1, f - 1)) : (c) => Math.round(c * f);
  const r = m(n >> 16), v = m((n >> 8) & 255), b = m(n & 255);
  return '#' + ((1 << 24) | (r << 16) | (v << 8) | b).toString(16).slice(1);
}
// Pavé : dessus + face gauche + face droite.
function boite(g, x0, y0, x1, y1, z0, z1, coul, opts) {
  opts = opts || {};
  const base = coul.base || '#999999';
  const dessus = coul.dessus || nuance(base, 1.22);
  const gauche = coul.gauche || base;
  const droite = coul.droite || nuance(base, 0.8);
  const trait = { stroke: opts.trait || 'rgba(0,0,0,.16)', 'stroke-width': 0.6, 'stroke-linejoin': 'round' };
  if (opts.trait === 'none') trait.stroke = 'none';
  if (!opts.sansGauche) poly(g, [proj(x0, y1, z0), proj(x1, y1, z0), proj(x1, y1, z1), proj(x0, y1, z1)], gauche, trait);
  if (!opts.sansDroite) poly(g, [proj(x1, y0, z0), proj(x1, y1, z0), proj(x1, y1, z1), proj(x1, y0, z1)], droite, trait);
  if (!opts.sansDessus) poly(g, [proj(x0, y0, z1), proj(x1, y0, z1), proj(x1, y1, z1), proj(x0, y1, z1)], dessus, trait);
}
function fenetres(g, z, h, couleur, nb, largeur) {
  const s = largeur || DEMI_BAT;
  const zb = z + h * 0.28, zh = z + h * 0.78;
  for (let i = 0; i < nb; i++) {
    const a = -s + (2 * s) * (i + 0.22) / nb;
    const b = -s + (2 * s) * (i + 0.78) / nb;
    poly(g, [proj(a, s, zb), proj(b, s, zb), proj(b, s, zh), proj(a, s, zh)], couleur, { class: 'vl-vitre' });
    poly(g, [proj(s, a, zb), proj(s, b, zb), proj(s, b, zh), proj(s, a, zh)], nuance(couleur, 0.86), { class: 'vl-vitre vl-vitre--cote' });
  }
}
function arbre(g, x, y, z, taille) {
  const k = taille || 1;
  const [sx, sy] = proj(x, y, z || 0);
  ligne(g, [sx, sy], [sx, sy - 8 * k], DECOR.tronc, 2 * k);
  svgEl('circle', { cx: sx, cy: sy - 13 * k, r: 7 * k, fill: DECOR.feuillage1 }, g);
  svgEl('circle', { cx: sx - 2.5 * k, cy: sy - 15.5 * k, r: 4 * k, fill: DECOR.feuillage2 }, g);
}
// Grue de chantier (avec un crochet qui se balance doucement).
function grue(g, hauteurBat) {
  const base = proj(-0.2, -DEMI_BAT - 0.45, 0);
  const haut = base[1] - Math.max(70, hauteurBat + 40);
  const c = DECOR.grue;
  ligne(g, [base[0] - 2.5, base[1]], [base[0] - 2.5, haut], c, 1.6);
  ligne(g, [base[0] + 2.5, base[1]], [base[0] + 2.5, haut], c, 1.6);
  for (let yy = base[1]; yy > haut + 6; yy -= 8) ligne(g, [base[0] - 2.5, yy], [base[0] + 2.5, yy - 8], c, 0.8);
  ligne(g, [base[0] + 16, haut], [base[0] - 62, haut], c, 2.2);
  ligne(g, [base[0], haut - 12], [base[0] - 62, haut], c, 0.8);
  ligne(g, [base[0], haut - 12], [base[0] + 16, haut], c, 0.8);
  svgEl('rect', { x: base[0] + 10, y: haut, width: 8, height: 6, fill: '#6B6B6B' }, g);
  const xc = base[0] - 42;
  const gc = svgEl('g', { class: 'vl-crochet' }, g);
  ligne(gc, [xc, haut], [xc, haut + 28], '#555555', 0.8);
  svgEl('rect', { x: xc - 4, y: haut + 28, width: 8, height: 5, fill: '#555555' }, gc);
}
function panneauChantier(g, x, y, texte) {
  const [sx, sy] = proj(x, y, 0);
  ligne(g, [sx, sy], [sx, sy - 16], '#6B6B6B', 1.2);
  // Le panneau s'élargit pour les mots longs (« PLAN DE VOL », « EN ATTENTE ») : le texte ne déborde jamais
  const larg = Math.max(34, String(texte).length * 4.3 + 6);
  svgEl('rect', { x: sx - larg / 2, y: sy - 26, width: larg, height: 12, rx: 1.5, fill: '#FFFFFF', stroke: '#000091', 'stroke-width': 1 }, g);
  const t = svgEl('text', { x: sx, y: sy - 17.5, 'text-anchor': 'middle', 'font-size': 6.5, 'font-weight': 700, fill: '#000091', 'font-family': 'Marianne, Arial, sans-serif' }, g);
  t.textContent = texte;
}
function nuage(g, sommet, type) {
  const y = -sommet - 30;
  const gn = svgEl('g', {}, g);
  const fond = type === 'orage' ? '#7A7A7A' : '#E1E1E1';
  const bord = type === 'orage' ? '#5A5A5A' : '#B9B9B9';
  [[-10, 2, 8], [0, -3, 10], [11, 2, 8], [0, 5, 9]].forEach(([dx, dy, r]) => {
    svgEl('circle', { cx: dx, cy: y + dy, r, fill: fond, stroke: bord, 'stroke-width': 0.6 }, gn);
  });
  if (type === 'orage') {
    poly(gn, [[-1, y + 10], [5, y + 10], [1, y + 18], [6, y + 18], [-4, y + 30], [-1, y + 20], [-5, y + 20]], '#FCC63A', { stroke: '#C08C00', 'stroke-width': 0.5 });
  }
}
// Contour en pointillés : la hauteur que l'immeuble devrait avoir (le « fantôme »).
function fantome(g, z0, z1) {
  const s = DEMI_BAT;
  const attrs = { fill: 'rgba(0,0,145,.05)', stroke: '#000091', 'stroke-width': 1, 'stroke-dasharray': '3 3' };
  poly(g, [proj(-s, s, z0), proj(s, s, z0), proj(s, s, z1), proj(-s, s, z1)], attrs.fill, attrs);
  poly(g, [proj(s, -s, z0), proj(s, s, z0), proj(s, s, z1), proj(s, -s, z1)], attrs.fill, attrs);
  poly(g, [proj(-s, -s, z1), proj(s, -s, z1), proj(s, s, z1), proj(-s, s, z1)], attrs.fill, attrs);
}
// Porte d'entrée : simple décor (le lien s'ouvre par l'icône 🔗 de l'étiquette).
function porte(g, z0, h, l) {
  const s = l || DEMI_BAT;
  const haut = z0 + h * 0.75;
  poly(g, [proj(-0.12, s, z0), proj(0.12, s, z0), proj(0.12, s, haut), proj(-0.12, s, haut)], '#3A3A3A');
}
// Immeuble complet. allume : fenêtres jaunes ; ferme : gris, porte condamnée.
function immeubleComplet(g, coul, nbEtages, allume, ferme, p) {
  const s = DEMI_BAT;
  let z = 0;
  for (let i = 0; i < nbEtages; i++) {
    const h = i === 0 ? ETAGE * 1.15 : ETAGE;
    boite(g, -s, -s, s, s, z, z + h, { base: i === 0 ? nuance(coul, 0.9) : coul }, { sansDessus: i < nbEtages - 1 });
    if (i === 0) {
      if (ferme) {
        poly(g, [proj(-0.12, s, z), proj(0.12, s, z), proj(0.12, s, z + h * 0.75), proj(-0.12, s, z + h * 0.75)], '#6A6A6A');
        ligne(g, proj(-0.16, s, z + 1), proj(0.16, s, z + h * 0.7), '#8B5A2B', 1.6);
        ligne(g, proj(0.16, s, z + 1), proj(-0.16, s, z + h * 0.7), '#8B5A2B', 1.6);
      } else porte(g, z, h);
    } else {
      fenetres(g, z, h, ferme ? '#7D7D7D' : (allume ? DECOR.vitreAllumee : DECOR.vitreEteinte), 2);
    }
    z += h;
  }
  // Toit : rebord + local technique (aux couleurs du toit si elle est définie)
  const toit = p && p.toit;
  boite(g, -s, -s, s, s, z, z + 2.5, toit ? { base: nuance(toit, 0.8), dessus: toit } : { base: nuance(coul, 0.7), dessus: nuance(coul, 1.1) });
  z += 2.5;
  boite(g, -0.18, -0.25, 0.18, 0.1, z, z + 7, { base: toit || nuance(coul, 0.85) });
  return z + 7;
}
// Gratte-ciel : socle large, tour vitrée, étage en retrait, couronne et antenne.
function gratteCiel(g, coul, nbEtages, p) {
  const s = DEMI_BAT;
  const toit = p && p.toit;
  let z = 0;
  const hSocle = ETAGE * 1.3;
  boite(g, -s - 0.07, -s - 0.07, s + 0.07, s + 0.07, z, z + hSocle, { base: nuance(coul, 0.82) });
  porte(g, z, hSocle, s + 0.07);
  z += hSocle;
  const etagesTour = Math.max(3, nbEtages - 3);
  for (let i = 0; i < etagesTour; i++) {
    boite(g, -s, -s, s, s, z, z + ETAGE, { base: coul }, { sansDessus: i < etagesTour - 1 });
    fenetres(g, z, ETAGE, DECOR.vitreAllumee, 3);
    z += ETAGE;
  }
  // Corniche : bande claire qui sépare bien la façade du toit coloré
  boite(g, -s - 0.03, -s - 0.03, s + 0.03, s + 0.03, z, z + 2.5,
    toit ? { base: '#EDEDED', dessus: '#FFFFFF' } : { base: nuance(coul, 0.7), dessus: nuance(coul, 1.1) });
  z += 2.5;
  const s2 = s * 0.68;
  for (let i = 0; i < 2; i++) {
    boite(g, -s2, -s2, s2, s2, z, z + ETAGE, { base: toit || nuance(coul, 1.08) }, { sansDessus: i < 1 });
    fenetres(g, z, ETAGE, DECOR.vitreAllumee, 2, s2);
    z += ETAGE;
  }
  const s3 = s * 0.36;
  boite(g, -s3, -s3, s3, s3, z, z + ETAGE * 0.8,
    toit ? { base: nuance(toit, 0.8), dessus: nuance(toit, 1.25) } : { base: nuance(coul, 0.75), dessus: nuance(coul, 1.15) });
  z += ETAGE * 0.8;
  const pied = proj(0, 0, z);
  ligne(g, pied, [pied[0], pied[1] - 24], '#5A5A5A', 1.3);
  svgEl('circle', { cx: pied[0], cy: pied[1] - 25, r: 2, fill: '#E1000F' }, g);
  return z + 27;
}
// Antennes paraboliques sur le toit (trois au plus sont dessinées).
function antennes(g, zToit, n) {
  const nb = Math.min(3, n);
  for (let i = 0; i < nb; i++) {
    const pied = proj(-0.22 + i * 0.2, 0.15 - i * 0.12, zToit);
    ligne(g, pied, [pied[0], pied[1] - 7], '#6B6B6B', 1);
    svgEl('ellipse', {
      cx: pied[0] + 1.5, cy: pied[1] - 9, rx: 4.2, ry: 2.4, fill: '#E6E6E6', stroke: '#7A7A7A', 'stroke-width': 0.7,
      transform: 'rotate(-28 ' + (pied[0] + 1.5).toFixed(1) + ' ' + (pied[1] - 9).toFixed(1) + ')'
    }, g);
  }
}

/* Cyclistes et arceaux à vélos (simple décor). Dessinés un peu plus grands
   que nature pour rester visibles. [MODIFIABLE : couleurs, ECHELLE_VELOS] */
const ECHELLE_VELOS = 0.55;
const COULEURS_CASQUES = ['#E1000F', '#F2B300', '#FFFFFF', '#2E9E5B', '#3F7FE0', '#D6589F'];
const COULEURS_MAILLOTS = ['#000091', '#2E9E5B', '#E4794A', '#8A5CD6', '#1F9EA3', '#D64545'];
// Roue de vélo : cercle vu en biais, dans le plan vertical de l'avenue
function roueVelo(g, x, y, r) {
  const c = proj(x, y, r * 14);
  svgEl('ellipse', { cx: c[0], cy: c[1], rx: r * 13, ry: r * 15, fill: 'none', stroke: '#2B2B2B', 'stroke-width': 1.6, transform: 'rotate(-27 ' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ')' }, g);

/* Cycliste qui roule le long de l'avenue (vers le bas à droite). Le groupe
   extérieur porte l'animation (il avance doucement puis réapparaît au
   départ) ; le groupe intérieur porte la mise à l'échelle. */
function cycliste(g, x, y, casque, maillot, retard) {
  const base = proj(x, y, 0);
  const anime = svgEl('g', { class: 'vl-velo', style: 'animation-delay:-' + retard.toFixed(1) + 's' }, g);
  const v = svgEl('g', { transform: 'translate(' + base[0].toFixed(1) + ' ' + base[1].toFixed(1) + ') scale(' + ECHELLE_VELOS + ') translate(' + (-base[0]).toFixed(1) + ' ' + (-base[1]).toFixed(1) + ')' }, anime);
  const r = 0.5, zr = r * 14;
  roueVelo(v, x - 0.2, y, r);
  roueVelo(v, x + 0.2, y, r);
  const ar = proj(x - 0.2, y, zr), av = proj(x + 0.2, y, zr), selle = proj(x - 0.05, y, zr + 9), guidon = proj(x + 0.16, y, zr + 11), pedalier = proj(x, y, zr - 1);
  [[ar, selle], [selle, guidon], [guidon, av], [ar, pedalier], [pedalier, guidon]].forEach(([a, b]) => ligne(v, a, b, '#3F7FE0', 1.6));
  const hanche = proj(x - 0.05, y, zr + 11), epaule = proj(x + 0.08, y, zr + 22), tete = proj(x + 0.12, y, zr + 27);
  ligne(v, hanche, pedalier, '#3A3A5A', 2.2);   // jambe
  ligne(v, hanche, epaule, maillot, 4);         // buste penché sur le guidon
  ligne(v, epaule, guidon, maillot, 1.8);       // bras
  svgEl('circle', { cx: tete[0], cy: tete[1], r: 3.4, fill: '#F1C9A5' }, v);
  svgEl('path', { d: 'M' + (tete[0] - 3.6) + ' ' + (tete[1] - 0.5) + ' a3.8 3.8 0 0 1 7.2 0 z', fill: casque }, v);
}
// Piste cyclable verte, le long de l'avenue de devant
function pisteCyclable(g, x0, x1, y) {
  poly(g, [proj(x0, y - 0.09, 0.06), proj(x1, y - 0.09, 0.06), proj(x1, y + 0.09, 0.06), proj(x0, y + 0.09, 0.06)], '#7DBF6A');

// Arceaux à vélos, avec deux vélos garés
function arceaux(g, cx, cy, z) {

// Étang avec ponton et canards

// Kiosque à musique

  const pts = (r, z) => { const l = []; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; l.push(proj(cx + Math.cos(a) * r, cy + Math.sin(a) * r, z)); } return l; };
  poly(g, pts(1.05, 3), '#E8DFC8', { stroke: '#BFB295', 'stroke-width': 0.8 });
  poly(g, pts(1.05, 0).slice(0, 5).concat(pts(1.05, 3).slice(0, 5).reverse()), '#D9CCAE');
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + Math.PI / 8;

    ligne(g, proj(cx + Math.cos(a) * 0.85, cy + Math.sin(a) * 0.85, 3), proj(cx + Math.cos(a) * 0.85, cy + Math.sin(a) * 0.85, 22), '#FFFFFF', 1.6);

  const sommet = proj(cx, cy, 38);
  const bord = pts(1.15, 22);
  for (let i = 0; i < 8; i++) {
    const a = bord[i], b = bord[(i + 1) % 8];
    poly(g, [a, b, sommet], i % 2 ? '#2E9E5B' : '#3FAE6B', { stroke: '#22774A', 'stroke-width': 0.5 });

  ligne(g, sommet, [sommet[0], sommet[1] - 8], '#5A5A5A', 1);

  ligne(g, proj(cx - 0.25, cy - 0.3, z + 12), proj(cx - 0.25, cy - 0.3, z + 4), '#5A5A5A', 0.6);
  // Toboggan
  boite(g, cx + 0.3, cy + 0.2, cx + 0.55, cy + 0.45, z, z + 10, { base: '#3F7FE0' });
  poly(g, [proj(cx + 0.3, cy + 0.3, z + 10), proj(cx + 0.3, cy + 0.4, z + 10), proj(cx - 0.3, cy + 0.65, z + 1), proj(cx - 0.3, cy + 0.55, z + 1)], '#F2B300');
  arbre(g, cx + 0.65, cy - 0.65, z, 0.65);
}
// Ordre des petits décors (alternés pour varier)
const PETITS_DECORS = [miniJardin, miniPlace, miniJardin, miniBassin, miniJardin, miniJeux];


// Étages en construction : dalle, étages montés, squelette du suivant, échafaudage.
function etagesEnChantier(corps, coul, construits, total, p, eteint) {
  const s = DEMI_BAT;
  boite(corps, -s - 0.05, -s - 0.05, s + 0.05, s + 0.05, 0, 4, { base: DECOR.beton });
  let z = 4;
  for (let i = 0; i < construits; i++) {
    const dernier = i === construits - 1;
    boite(corps, -s, -s, s, s, z, z + ETAGE, { base: nuance(coul, 1.12), dessus: dernier && p.toit ? p.toit : undefined }, { sansDessus: false });
    if (i === 0) porte(corps, z, ETAGE);
    else fenetres(corps, z, ETAGE, DECOR.vitreEteinte, 2);
    z += ETAGE;
  }
  if (construits < total) {
    [[-s, s], [s, s], [s, -s]].forEach(([x, y]) => ligne(corps, proj(x, y, z), proj(x, y, z + ETAGE), '#7A7A7A', 1.4));
    ligne(corps, proj(-s, s, z + ETAGE), proj(s, s, z + ETAGE), '#7A7A7A', 1.2);
    ligne(corps, proj(s, s, z + ETAGE), proj(s, -s, z + ETAGE), '#7A7A7A', 1.2);
  }
  const hEch = z + (construits < total ? ETAGE : 0);
  const couleurEch = eteint ? '#9A9A9A' : DECOR.echafaudage;
  [-s - 0.06, 0, s + 0.06].forEach((x) => ligne(corps, proj(x, s + 0.08, 0), proj(x, s + 0.08, hEch), couleurEch, 1));
  for (let zz = ETAGE; zz <= hEch; zz += ETAGE) ligne(corps, proj(-s - 0.06, s + 0.08, zz), proj(s + 0.06, s + 0.08, zz), couleurEch, 1);
  return hEch;
}

// Dessine un immeuble à sa place, selon le dessin de son étape. Retourne la hauteur du sommet.
function dessinerProjet(g, p) {
  const s = DEMI_BAT;
  appliquerTheme();   // couleurs de la ville ou du jardin (voir section 2 bis)
  const coul = couleurProjet(p);
  const dessin = p.etape.dessin;
  const u = univers();
  const jardin = !!u.dessiner;   // univers sans immeubles (jardin, garage...)

  // Parcelle au sol, et halo de sélection (visible au survol et au focus clavier)
  const solParcelle = p.categorie === 'service' ? DECOR.parcelleService : (p.categorie === 'ferme' ? DECOR.parcelleFerme : DECOR.parcelleChantier);
  poly(g, [proj(-0.9, -0.9, 0), proj(0.9, -0.9, 0), proj(0.9, 0.9, 0), proj(-0.9, 0.9, 0)], solParcelle);
  poly(g, [proj(-0.95, -0.95, 0), proj(0.95, -0.95, 0), proj(0.95, 0.95, 0), proj(-0.95, 0.95, 0)], 'none', { class: 'vl-halo', stroke: '#000091', 'stroke-width': 2.2 });

  const corps = svgEl('g', { class: 'vl-corps' }, g);
  let sommet = 26;
  let base = 0;   // hauteur déjà construite (pour le fantôme)

  if (jardin) {
    // Autre univers : son propre dessin (plante, véhicule...), à son échelle
    const gp = svgEl('g', { transform: 'scale(' + u.echelle + ')' }, corps);
    const r = u.dessiner(gp, p, coul);
    sommet = r.sommet * u.echelle;
    base = r.base * u.echelle;
  } else if (dessin === 'gratteciel') {
    sommet = gratteCiel(corps, coul, Math.max(GRATTE_CIEL_BASE, p.etagesTotal + 4), p);
    if (p.antennes) antennes(corps, sommet - 27, p.antennes);
    arbre(corps, 0.8, -0.6, 0, 0.75);
    arbre(corps, -0.6, 0.8, 0, 0.75);
  } else if (dessin === 'termine') {
    sommet = immeubleComplet(corps, coul, p.etagesTotal, true, false, p);
    if (p.antennes) antennes(corps, sommet - 7, p.antennes);
    arbre(corps, 0.8, -0.6, 0, 0.7);
  } else if (dessin === 'ferme') {
    sommet = immeubleComplet(corps, DECOR.ferme, p.etagesTotal, false, true, p);
  } else if (dessin === 'demenagement') {
    sommet = immeubleComplet(corps, coul, p.etagesTotal, true, false, p);
    grue(corps, sommet);
    panneauChantier(corps, 0.55, 0.9, 'TRANSFERT');
  } else if (dessin === 'pause') {
    const construits = Math.max(1, Math.ceil(p.etagesTotal / 2));
    sommet = etagesEnChantier(corps, nuance(coul, 0.95), construits, construits, p, true);
    panneauChantier(corps, 0.55, 0.9, 'EN PAUSE');
    base = 4 + construits * ETAGE;
  } else if (dessin === 'chantier') {
    const construits = Math.max(1, p.etagesConstruits || Math.ceil(p.etagesTotal / 2));
    sommet = etagesEnChantier(corps, coul, construits, p.etagesTotal, p, false);
    grue(corps, sommet);
    base = 4 + construits * ETAGE;
  } else if (dessin === 'fondations') {
    boite(corps, -s - 0.05, -s - 0.05, s + 0.05, s + 0.05, 0, 4, { base: DECOR.beton });
    [[-s, s], [s, s], [s, -s], [0, s], [s, 0]].forEach(([x, y]) => ligne(corps, proj(x, y, 4), proj(x, y, 12), '#7A7A7A', 1.2));
    sommet = 12;
    grue(corps, 20);
    base = 4;
  } else if (dessin === 'palissade') {
    boite(corps, -0.8, -0.8, 0.8, 0.8, 0, 7, { base: '#E8E8E8', gauche: '#EDEDED', droite: '#D6D6D6' }, { sansDessus: true });
    panneauChantier(corps, 0.55, 0.85, 'PERMIS OK');
  } else if (dessin === 'parcelle') {
    // Parcelle nue (aperçu « le sol est posé ») : rien n'est encore construit
    sommet = 6;
  } else if (dessin === 'etude') {
    const coins = [[-0.6, -0.6], [0.6, -0.6], [0.6, 0.6], [-0.6, 0.6]];
    coins.forEach(([x, y]) => ligne(corps, proj(x, y, 0), proj(x, y, 9), '#E4794A', 1.4));
    for (let i = 0; i < 4; i++) {
      const a = coins[i], b = coins[(i + 1) % 4];
      ligne(corps, proj(a[0], a[1], 8), proj(b[0], b[1], 8), '#E4794A', 0.6, { 'stroke-dasharray': '2 2' });
    }
    panneauChantier(corps, 0.2, 0.75, 'ÉTUDE');
  } else {
    panneauChantier(corps, 0.1, 0.4, 'RÉSERVÉ');
  }

  // Fantôme : hauteur attendue d'après le calendrier (chantiers seulement)
  if (p.etagesFantome && p.categorie === 'chantier' && 4 + p.etagesFantome * ETAGE > base) {
    const zHaut = 4 + p.etagesFantome * ETAGE;
    if (jardin) {
      // Autre univers : la hauteur attendue est marquée par un fil en pointillés et un repère
      ligne(g, [-6, -Math.max(base, 4)], [-6, -zHaut], '#000091', 1, { 'stroke-dasharray': '3 3' });
      ligne(g, [-10, -zHaut], [-2, -zHaut], '#000091', 1.2);
    } else fantome(g, Math.max(base, 4), zHaut);
    sommet = Math.max(sommet, zHaut);
  }
  if (p.meteo !== 'beau') { if (u.meteo) u.meteo(g, sommet, p.meteo); else nuage(g, sommet, p.meteo); }
  return sommet;
}

// Couleur de la façade : par étape (défaut) ou par météo.
function couleurProjet(p) {
  if (etat.couleurs === 'meteo') {
    const cle = p.categorie === 'ferme' ? 'ferme' : p.meteo;
    for (let i = 0; i < COULEURS_METEO.length; i++) if (COULEURS_METEO[i].cle === cle) return COULEURS_METEO[i].couleur;
  }
  return p.etape.couleur || dessinDe(p.etape.dessin).couleur;
}

/* --------------------------------------------------------------------------
   2.3 SCÈNE : sol, fleuve, quartiers, immeubles
   Utilisée par la carte et par l'aperçu de l'assistant.
   options.zones : ajoute les zones de dépôt des quartiers (mode Déménager).
   -------------------------------------------------------------------------- */
function construireScene(monde, projets, ratioEcran, rotation, options) {
  options = options || {};
  appliquerTheme();
  const scene = univers().scene;
  const decor = options.decor !== false;
  const plan = calculerPlan(projets, ratioEcran, decor);
  const R = rotationPlan(plan, rotation || 0);
  const f = R.f;
  const C = plan.C;
  const gSol = svgEl('g', {}, monde);
  const gObjets = svgEl('g', {}, monde);
  const etiquettes = [];
  const panneaux = [];
  const objets = [];
  const hasard = aleatoire(plan.W * 31 + plan.H * 17);

  const cases = plan.cellules.map((ce) => {
    const r = rectTourne(f, ce.x, ce.y, ce.x + C, ce.y + C);
    return { ce, r, prof: r[0] + r[1] };
  }).sort((a, b) => a.prof - b.prof);

  // 1. Le fleuve, derrière la ville
  let xMin = Infinity, xMax = -Infinity, yHaut = Infinity;
  cases.forEach((k) => {
    [proj(k.r[0], k.r[1], 0), proj(k.r[2], k.r[1], 0), proj(k.r[0], k.r[3], 0)].forEach((pt) => {
      xMin = Math.min(xMin, pt[0]); xMax = Math.max(xMax, pt[0]); yHaut = Math.min(yHaut, pt[1]);
    });
  });
  const hautFleuve = yHaut - C * DEMI_H * 0.35;
  const basFleuve = yHaut + C * DEMI_H * 1.05;
  const retrait = C * DEMI_L * 0.6;
  poly(gSol, [[xMin + retrait, hautFleuve], [xMax - retrait, hautFleuve], [xMax, basFleuve], [xMin, basFleuve]],
    DECOR.eau, { stroke: DECOR.eauBord, 'stroke-width': 1.5 });
  if (decor) {
    const nbBateaux = Math.max(1, Math.round((xMax - xMin) / 700));
    for (let i = 0; i < nbBateaux; i++) {
      const bx = xMin + retrait + (i + 0.3 + hasard() * 0.4) * (xMax - xMin - 2 * retrait) / nbBateaux;
      const by = hautFleuve + (basFleuve - hautFleuve) * (0.18 + hasard() * 0.12);
      scene.fleuve(gSol, bx, by);
    }
  }

  // 2. Chaque case : socle, rue, pelouse, quartier (ou parc)
  let compteurParcs = 0;
  cases.forEach((k) => {
    const [x0, y0, x1, y1] = k.r;
    boite(gSol, x0, y0, x1, y1, -14, 0, { dessus: DECOR.route, gauche: DECOR.terre1, droite: DECOR.terre2 }, { trait: 'none' });
    k.ce.emplacements.forEach((em) => {
      const [ex0, ey0, ex1, ey1] = rectTourne(f, em.x, em.y, em.x + em.w, em.y + em.h);
      const e = RUE;
      poly(gSol, [proj(ex0 + e, ey0 + e, 0.05), proj(ex1 - e, ey0 + e, 0.05), proj(ex1 - e, ey1 - e, 0.05), proj(ex0 + e, ey1 - e, 0.05)], DECOR.herbe);
      const q = em.q;
      let bloc = null;
      if (q) {
        bloc = rectTourne(f, q.x, q.y, q.x + q.w, q.y + q.h);
        boite(gSol, bloc[0], bloc[1], bloc[2], bloc[3], 0, HAUTEUR_SOL, { dessus: DECOR.quartierDessus, gauche: DECOR.quartierGauche, droite: DECOR.quartierDroite });
        if (options.zones) {
          // Zone de dépôt du mode Déménager : tout l'emplacement du quartier
          poly(gSol, [proj(ex0 + e, ey0 + e, HAUTEUR_SOL), proj(ex1 - e, ey0 + e, HAUTEUR_SOL), proj(ex1 - e, ey1 - e, HAUTEUR_SOL), proj(ex0 + e, ey1 - e, HAUTEUR_SOL)],
            'transparent', { class: 'vl-zone-q', 'data-q': q.cle });
        }
      }
      // Parc assez grand : une attraction au centre (grande roue, étang, fontaine...)
      if (!q && decor && ex1 - ex0 >= 3.6 && ey1 - ey0 >= 3.6) {
        const cx = (ex0 + ex1) / 2, cy = (ey0 + ey1) / 2;
        const liste = scene.attractions;
        const attraction = liste[(compteurParcs++) % liste.length];
        bloc = [cx - 1.7, cy - 1.7, cx + 1.7, cy + 1.7];
        objets.push({ prof: cx + cy, dessiner: (g) => attraction(g, cx, cy) });
      }
      // Avenues : un lampadaire à chaque coin de la pelouse
      if (decor) {
        [[ex0 + e * 0.55, ey0 + e * 0.55], [ex1 - e * 0.55, ey0 + e * 0.55], [ex1 - e * 0.55, ey1 - e * 0.55], [ex0 + e * 0.55, ey1 - e * 0.55]].forEach(([lx, ly]) => {
          objets.push({ prof: lx + ly, dessiner: (g) => scene.coin(g, lx, ly) });
        });
        // Une voiture de temps en temps sur l'avenue de devant
        if (hasard() < 0.55 && scene.voitures) {
          const vx = ex0 + e + hasard() * Math.max(0.5, ex1 - ex0 - 2 * e - 0.6);
          const vy = ey1 - e * 0.5;
          const couleur = COULEURS_VOITURES[Math.floor(hasard() * COULEURS_VOITURES.length)];
          objets.push({ prof: vx + vy, dessiner: (g) => voiture(g, vx, vy, couleur) });
        }
        // Piste cyclable le long de l'avenue de devant, et parfois un ou deux cyclistes
        if (scene.cyclistes) {
          const yp = ey1 - e * 0.72;
          pisteCyclable(gSol, ex0 + e * 0.3, ex1 - e * 0.3, yp);
          const nb = hasard() < 0.6 ? (hasard() < 0.3 ? 2 : 1) : 0;
          for (let c = 0; c < nb; c++) {
            const cx = ex0 + e + hasard() * Math.max(0.5, ex1 - ex0 - 2 * e - 1.8);
            const casque = COULEURS_CASQUES[Math.floor(hasard() * COULEURS_CASQUES.length)];
            const maillot = COULEURS_MAILLOTS[Math.floor(hasard() * COULEURS_MAILLOTS.length)];
            const retard = hasard() * 14;
            objets.push({ prof: cx + yp, dessiner: (g) => cycliste(g, cx, yp, casque, maillot, retard) });
          }
        }
      }
      const libre = em.w * em.h - (q ? q.w * q.h : 0) - (bloc && !q ? 12 : 0);
      const nbArbres = Math.min(14, Math.max(0, Math.round(libre / (q ? 4 : 3))));
      for (let a = 0, essais = 0; a < nbArbres && essais < nbArbres * 8; essais++) {
        const tx = ex0 + e + 0.4 + hasard() * Math.max(0, ex1 - ex0 - 2 * e - 0.8);
        const ty = ey0 + e + 0.4 + hasard() * Math.max(0, ey1 - ey0 - 2 * e - 0.8);
        if (bloc && tx > bloc[0] - 0.45 && tx < bloc[2] + 0.45 && ty > bloc[1] - 0.45 && ty < bloc[3] + 0.45) continue;
        const taille = 0.65 + hasard() * 0.5;
        objets.push({ prof: tx + ty, dessiner: (g) => arbre(g, tx, ty, 0, taille) });
        a++;
      }
    });
  });

  // 3. Les immeubles et les panneaux des quartiers
  const utile = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  plan.quartiers.forEach((q) => {
    const r = rectTourne(f, q.x, q.y, q.x + q.w, q.y + q.h);
    q.lots.forEach((l) => {
      const c = f(l.x, l.y);
      objets.push({ prof: c[0] + c[1], dessiner: (g) => etiquettes.push(Object.assign({ p: l.p, prof: c[0] + c[1] }, placerProjet(g, l.p, c, options.inerte))) });
    });
    (q.respirations || []).forEach((v) => {
      const c = f(v.x, v.y);
      const petit = PETITS_DECORS[(v.rang + Math.round(v.x + v.y)) % PETITS_DECORS.length];
      objets.push({ prof: c[0] + c[1], dessiner: (g) => petit(g, c[0], c[1]) });
    });
    q.vides.forEach((v, i) => {
      const c = f(v.x, v.y);
      objets.push({
        prof: c[0] + c[1], dessiner: (g) => {
          arbre(g, c[0] - 0.4, c[1] - 0.2, HAUTEUR_SOL, 0.9);
          arbre(g, c[0] + 0.3, c[1] + 0.35, HAUTEUR_SOL, 0.8);
          if (i % 2 === 0) arbre(g, c[0] + 0.45, c[1] - 0.5, HAUTEUR_SOL, 0.7);
        }
      });
    });
    // Emprise du quartier à l'écran : sert au cadrage sur la partie « utile »
    [proj(r[0], r[1], 0), proj(r[2], r[1], 0), proj(r[2], r[3], -14), proj(r[0], r[3], -14)].forEach(([x, y]) => {
      utile.x0 = Math.min(utile.x0, x); utile.y0 = Math.min(utile.y0, y); utile.x1 = Math.max(utile.x1, x); utile.y1 = Math.max(utile.y1, y);
    });
    const pos = proj(r[0] + 0.35, r[3] - 0.35, HAUTEUR_SOL);
    panneaux.push({ pos, libelle: q.libelle + ' · ' + formaterNombre(q.liste.length), titre: q.libelle + ' : ' + accord(q.liste.length, mots().un) });
  });

  objets.sort((a, b) => a.prof - b.prof).forEach((o) => o.dessiner(gObjets));
  return { etiquettes, panneaux, R, utile };
}

// Place un immeuble (groupe cliquable et accessible au clavier, sauf dans l'aperçu).
function placerProjet(g, p, c, inerte) {
  const [sx, sy] = proj(c[0], c[1], HAUTEUR_SOL);
  const attrs = {
    class: 'vl-bat' + (etat.ouvert === p.id ? ' vl-actif' : '') + (etat.flash === p.id ? ' vl-flash' : ''),
    transform: 'translate(' + sx.toFixed(1) + ',' + sy.toFixed(1) + ')',
    'data-id': p.id
  };
  if (!inerte) {
    // Un seul arrêt de tabulation sur la carte, les flèches parcourent les
    // immeubles (organiserTabulationCarte).
    attrs.tabindex = -1;
    attrs.role = 'button';
    attrs['aria-label'] = p.nom + ', ' + (p.quartierLibelle ? mots().quartier + ' ' + p.quartierLibelle + ', ' : '') + p.etape.libelle + ', ' + libelleMeteo(p)
      + (p.devs.length ? ', ' + nomsDevs(p) : '') + '. Entrée : ouvrir la fiche' + (p.lien ? '. Touche O : ouvrir le lien' : '')
      + (etat.demenager ? '. Touche D : ' + mots().deplacer.toLowerCase() : '');
  }
  const gb = svgEl('g', attrs, g);
  const sommet = dessinerProjet(gb, p);
  return { sx, sy, sommet };
}

function libelleMeteo(p) {
  if (p.categorie === 'ferme') return '🔚 Fermé';
  if (p.meteo === 'orage') return '⛈️ Alerte';
  if (p.meteo === 'nuageux') return '☁️ À surveiller';
  return '☀️ Rien à signaler';
}
function nomsDevs(p) {
  return p.devs.map((d) => [d.emoji, d.nom].filter(Boolean).join(' ')).join(', ');
}
// Responsable « sur le chantier » : immeuble en cours de construction
function devActif(p) { return p.devs.length && p.categorie === 'chantier' && p.etape.dessin !== 'terrain'; }

/* --------------------------------------------------------------------------
   2.4 CARTE INTERACTIVE
   -------------------------------------------------------------------------- */
function rendreCarte(projets) {
  const monde = $('vl-monde');
  if (!monde) return;
  monde.replaceChildren();
  $('vl-vide').hidden = projets.length > 0;
  if (!projets.length) { etat.surcouche = null; return; }
  const zone = $('vl-svg').getBoundingClientRect();
  const ratioEcran = zone.width && zone.height ? zone.width / zone.height : 3;
  etat.ratioPlan = ratioEcran;
  const scene = construireScene(monde, projets, ratioEcran, etat.rotation, { zones: etat.demenager, decor: etat.decor });
  svgEl('g', { id: 'vl-surcouche' }, monde);
  etat.surcouche = { etiquettes: scene.etiquettes, panneaux: scene.panneaux, utile: scene.utile };
  if (etat.recentrer || !etat.vb) {
    cadrerSur(scene.R);
    etat.recentrer = false;
  }
  appliquerVue();
  dessinerSurcouche();
}

// Aperçu de l'assistant : la même ville, sans interaction, cadrée en entier.
function dessinerApercu(svg, projets) {
  svg.replaceChildren();
  if (!projets.length) return;
  const r = svg.getBoundingClientRect();
  const monde = svgEl('g', {}, svg);
  const scene = construireScene(monde, projets, r.width && r.height ? r.width / r.height : 2.2, 0, { inerte: true });
  let bb;
  try { bb = monde.getBBox(); } catch (e) { bb = { x: -500, y: -400, width: 1000, height: 600 }; }
  const k = Math.max(1, bb.width / Math.max(1, r.width || 600));
  scene.panneaux.forEach((pn) => panneauQuartier(monde, pn, k));
  try { bb = monde.getBBox(); } catch (e) { /* mesure indisponible : cadrage précédent */ }
  svg.setAttribute('viewBox', [bb.x - 10, bb.y - 10, bb.width + 20, bb.height + 20].map((n) => n.toFixed(1)).join(' '));
}

/* SURCOUCHE : étiquettes et panneaux des quartiers, toujours de la même taille
   à l'écran. Deux étiquettes qui se chevaucheraient : une seule est affichée
   (alertes d'abord), on zoome pour voir les autres. */
// [MODIFIABLE] Taille du texte à l'écran (en pixels) et longueur maximale d'un nom
const TAILLE_ETIQUETTE = 13;
const TAILLE_PANNEAU = 15;
const NOM_MAX = 32;

function pixelCarte() {
  const r = $('vl-svg').getBoundingClientRect();
  return (r.width && etat.vb) ? etat.vb.w / r.width : 1;
}
let surcoucheDemandee = false;
function demanderSurcouche() {
  if (surcoucheDemandee) return;
  surcoucheDemandee = true;

function dessinerSurcouche() {

  g.replaceChildren();

  const chevauche = (r) => occupes.some((o) => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
  const gD = svgEl('g', {}, g);
  const gE = svgEl('g', {}, g);
  const gP = svgEl('g', {}, g);
  etat.surcouche.panneaux.forEach((pn) => occupes.push(panneauQuartier(gP, pn, k)));
  let masquees = 0;
  const affichees = new Set();
  if (etat.etiquettes) {
    const prio = { orage: 0, nuageux: 1, beau: 2 };
    const candidats = etat.surcouche.etiquettes.slice().sort((a, b) => (prio[a.p.meteo] - prio[b.p.meteo]) || (b.prof - a.prof));
    const retenues = [];
    candidats.forEach((c) => {
      const m = mesurerEtiquette(c, k);
      const zone = { x: m.x - 3 * k, y: m.y - 3 * k, w: m.w + 6 * k, h: m.h + 6 * k };
      if (!etat.toutesEtiquettes && chevauche(zone)) {
        const v = etat.vb;
        if (v && c.sx > v.x && c.sx < v.x + v.w && m.y > v.y && m.y < v.y + v.h) masquees++;
        return;
      }
      occupes.push(zone);
      retenues.push([c, m]);

    retenues.forEach(([c]) => affichees.add(c.p.id));
  }

  // ville, une pastille par immeuble couvrirait toute la carte.
  const zoomSuffisant = k <= SEUIL_ZOOM_PASTILLES;
  etat.surcouche.etiquettes.forEach((c) => {
    if (!zoomSuffisant || affichees.has(c.p.id) || !c.p.devs.length || !devActif(c.p)) return;
    bulleDev(gD, c, texteDevs(c.p), k, devActif(c.p));

  if (astuce) {
    astuce.hidden = !masquees;

}
function mesurerEtiquette(c, k) {
  const p = c.p;

  const texte = (p.ref ? p.ref + ' · ' : '') + nom;
  const icone = p.meteo === 'orage' ? '⛈️' : (p.meteo === 'nuageux' ? '☁️' : '');
  const emojiDev = texteDevs(p);
  // Largeur de la pastille : selon le texte réel (emojis ou initiales), plafonnée
  const largeurEmojis = p.devs.length ? 12 + Math.min(70, Array.from(emojiDev).length * 8.5) : 0;
  const lien = !!p.lien;
  const w = (texte.length * TAILLE_ETIQUETTE * 0.6 + (icone ? 24 : 0) + (lien ? 26 : 0) + 28 + largeurEmojis) * k;
  const h = (TAILLE_ETIQUETTE + 12) * k;
  const bas = c.sy - c.sommet - (p.meteo !== 'beau' ? 50 : 10) - 4 * k;
  return { x: c.sx - w / 2, y: bas - h, w, h, bas, texte, icone, lien, emojiDev, largeurDevs: largeurEmojis - 8, devActif: devActif(p) };

// Étiquette : bulle blanche, liseré à la couleur de l'immeuble. Cliquable (fiche),

function dessinerEtiquette(g, c, m, k) {

  let debutTexte = 22 * k;
  if (m.emojiDev) {

    svgEl('rect', { x: m.x + 4.5 * k, y: cy - r, width: largeur, height: 2 * r, rx: r, fill: m.devActif ? nuance(couleur, 1.7) : '#F2F2F2', stroke: m.devActif ? couleur : '#C9C9C9', 'stroke-width': 1.3 * k }, gdev);

// [MODIFIABLE] TAILLE_DEV : diamètre de la pastille du responsable à l'écran, en pixels.
const TAILLE_DEV = 24;

const SEUIL_ZOOM_PASTILLES = 1.6;

  const r = (actif ? TAILLE_DEV : TAILLE_DEV * 0.78) / 2 * k;

  svgEl('rect', { x: x - larg / 2, y: y - mat - haut, width: larg, height: haut, rx: 4 * k, fill: jetonDsfr('--background-action-high-blue-france', DECOR.panneau), stroke: jetonDsfr('--background-default-grey', '#FFFFFF'), 'stroke-width': 1.5 * k }, gp);

   2.5 ZOOM, DÉPLACEMENT, ROTATION

// Cadrage par défaut sur la partie « utile » : les quartiers et leurs
// immeubles (étiquettes comprises). Le décor (parcs, lac, grande roue, fleuve)
// reste dessiné autour : on le voit en dézoomant ou en déplaçant la carte.
// [MODIFIABLE] MARGE_CADRAGE : marge autour des immeubles, en unités de la carte.
const MARGE_CADRAGE = 40;
// [MODIFIABLE] LARGEUR_MIN_CADRAGE : évite un zoom trop fort sur une très petite ville.
const LARGEUR_MIN_CADRAGE = 500;
function cadrerSur(R) {
  const s = etat.surcouche;
  if (s && s.etiquettes && s.etiquettes.length) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const ajouter = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    // Les quartiers entiers (leur sol), puis le haut des immeubles et des étiquettes
    if (s.utile && isFinite(s.utile.x0)) { ajouter(s.utile.x0, s.utile.y0); ajouter(s.utile.x1, s.utile.y1); }
    s.etiquettes.forEach((c) => {
      ajouter(c.sx - 2 * DEMI_L, c.sy + 2 * DEMI_H);          // pied de la parcelle
      ajouter(c.sx + 2 * DEMI_L, c.sy - c.sommet - (c.p.meteo !== 'beau' ? 85 : 45));   // sommet, nuage et étiquette
    });
    (s.panneaux || []).forEach((pn) => { ajouter(pn.pos[0] - 90, pn.pos[1] - 60); ajouter(pn.pos[0] + 90, pn.pos[1] + 10); });
    let w = x1 - x0 + 2 * MARGE_CADRAGE, h = y1 - y0 + 2 * MARGE_CADRAGE;
    let x = x0 - MARGE_CADRAGE, y = y0 - MARGE_CADRAGE;
    if (w < LARGEUR_MIN_CADRAGE) { x -= (LARGEUR_MIN_CADRAGE - w) / 2; w = LARGEUR_MIN_CADRAGE; }
    etat.vb = ajusterRatio({ x, y, w, h });
    return;
  }
  let x, y, w, h;
  try {
    const bb = $('vl-monde').getBBox();
    x = bb.x - 20; y = bb.y - 100; w = bb.width + 40; h = bb.height + 120;
  } catch (e) {
    const coins = [proj(0, 0, 0), proj(R.W, 0, 0), proj(R.W, R.H, -14), proj(0, R.H, -14)];
    const xs = coins.map((c) => c[0]), ys = coins.map((c) => c[1]);
    x = Math.min(...xs) - 30; y = Math.min(...ys) - 330;
    w = Math.max(...xs) - Math.min(...xs) + 60; h = Math.max(...ys) - Math.min(...ys) + 360;
  }
  etat.vb = ajusterRatio({ x, y, w, h });
}
function ajusterRatio(v) {
  const r = $('vl-svg').getBoundingClientRect();
  if (!r.width || !r.height) return v;
  const ratioEcran = r.width / r.height;
  const ratioVue = v.w / v.h;
  if (ratioVue > ratioEcran) {
    const nh = v.w / ratioEcran;
    return { x: v.x, y: v.y - (nh - v.h) / 2, w: v.w, h: nh };
  }
  const nw = v.h * ratioEcran;
  return { x: v.x - (nw - v.w) / 2, y: v.y, w: nw, h: v.h };
}
function appliquerVue() {
  const v = etat.vb;
  const svg = $('vl-svg');
  if (v && svg) svg.setAttribute('viewBox', [v.x, v.y, v.w, v.h].map((n) => n.toFixed(1)).join(' '));
}
function versCoordonnees(clientX, clientY) {
  const r = $('vl-svg').getBoundingClientRect();
  const v = etat.vb;
  return [v.x + (clientX - r.left) / r.width * v.w, v.y + (clientY - r.top) / r.height * v.h];
}
function zoomer(facteur, centre) {
  const v = etat.vb;
  if (!v) return;
  const nw = borner(v.w * facteur, 250, 14000);
  const k = nw / v.w;
  const c = centre || [v.x + v.w / 2, v.y + v.h / 2];
  etat.vb = { x: c[0] - (c[0] - v.x) * k, y: c[1] - (c[1] - v.y) * k, w: v.w * k, h: v.h * k };
  appliquerVue();
  demanderSurcouche();

/* --------------------------------------------------------------------------
   Dessin d'une plante selon le dessin de son etape.

   (fleurs, bourgeons, ruban du tuteur, pot) ; le feuillage reste vert.

/* Fusée verticale dessinée à l'écran (un cylindre) : H hauteur, base à z0.

function fusee(g, coul, H, z0, o) {
  o = o || {};

  }

// Fumée au sol (décollage)

function dessinerFusee(g, p, coul) {

    var hc = Math.max(16, H * ratio);
    tourLancement(g, H + 6);

    sommet = H + 9; base = hc + 3;
  } else if (d === 'fondations') {

    poly(g, [[-5.5, -5], [-10.5, -1], [-5.5, -13]], nuance(coul, 0.85));

    sommet = H * 0.6 + 4; base = 17;

    // Transporteur à chenilles, fusée couchée

    sommet = 26;
  } else if (d === 'ferme') {
    [[-0.4, 0.1], [0.3, -0.2], [0.35, 0.45]].forEach(function (q, k) {

/* ==========================================================================
   ⚓ UNIVERS PORT
   Les quartiers deviennent des quais, chaque ligne un navire dans son
   bassin : du plan à la mise à l'eau, puis en mer. La taille du navire suit
   la « hauteur » (budget, tonnage...) : vedette, cargo, porte-conteneurs.

// [MODIFIABLE] Taille des navires par rapport au dessin de base
var ECHELLE_NAVIRES = 1.15;

var DESSINS_PORT = {
  terrain:      { libelle: 'Poste réservé',       aide: 'Une bouée marque le poste à quai réservé : le projet est identifié.' },
  etude:        { libelle: 'Plans du navire',     aide: 'Les plans sont sur la table : on instruit, on étudie.' },
  palissade:    { libelle: 'Cale prête',          aide: 'La forme de radoub est vidée, les tins sont posés : feu vert.' },
  fondations:   { libelle: 'Quille posée',        aide: 'La quille et les premières membrures sont en place.' },
  chantier:     { libelle: 'Coque en construction', aide: 'La coque se borde : plus l\'étape avance, plus elle est complète.' },
  termine:      { libelle: 'À quai',              aide: 'Le navire est amarré au quai : c\'est terminé.' },
  gratteciel:   { libelle: 'En mer',              aide: 'Le navire navigue avec son sillage : c\'est en service, réussi.' },
  demenagement: { libelle: 'Remorqué',            aide: 'Un remorqueur emmène le navire vers un autre quai.' },

var DECOR_PORT = {
  route: '#A9AEB4', quartierDessus: '#C7C2B6', quartierGauche: '#9C9689', quartierDroite: '#888276',

};
/* Gabarit d'un navire selon la « hauteur » n :
   jusqu'à 10 vedette, 11 à 15 cargo, 16 et plus porte-conteneurs. */
function gabaritNavire(n) {
  if (n <= 10) { return { L: 0.55, W: 0.2, h: 5, sup: 7, conteneurs: 0 }; }
  if (n <= 15) { return { L: 0.78, W: 0.26, h: 7, sup: 10, conteneurs: 1 }; }
  return { L: 0.92, W: 0.32, h: 8, sup: 13, conteneurs: 2 };
}
/* Navire le long de x. o.eteint : feux éteints ; o.gris : coque grise ;
   o.coque : fraction de coque bordée (chantier). Retourne le sommet. */
function navire(g, coul, n, z0, o) {
  o = o || {};
  var v = gabaritNavire(n);
  var L = v.L, W = v.W, h = v.h, z = z0;
  var coque = o.gris ? '#7D848C' : '#2F3B4A';
  // Coque : corps et étrave (le nez pointu)
  boite(g, -L, -W, L * 0.7, W, z, z + h, { base: coque, droite: nuance(coque, 0.85), dessus: '#E8EBEE' });
  poly(g, [proj(L * 0.7, W, z), proj(L, 0, z + 1), proj(L, 0, z + h + 1), proj(L * 0.7, W, z + h)], nuance(coque, 0.92));
  poly(g, [proj(L * 0.7, -W, z + h), proj(L * 0.7, W, z + h), proj(L, 0, z + h + 1)], '#E8EBEE');
  poly(g, [proj(-L, W, z), proj(L * 0.7, W, z), proj(L * 0.7, W, z + 1.6), proj(-L, W, z + 1.6)], o.gris ? '#8A5A3A' : '#C8102E');
  // Superstructure à l'arrière et cheminée aux couleurs de l'étape
  var zs = z + h;
  boite(g, -L * 0.92, -W * 0.85, -L * 0.45, W * 0.85, zs, zs + v.sup, { base: o.gris ? '#B9BEC4' : '#F4F6F8' });
  fenetres(g, zs, v.sup * 0.5, o.eteint || o.gris ? '#5A6B7A' : '#FFE7A0', 2, W * 0.85);
  boite(g, -L * 0.8, -0.06, -L * 0.62, 0.06, zs + v.sup, zs + v.sup + 6, { base: coul });
  var sommet = zs + v.sup + 6;
  // Conteneurs sur le pont des plus grands navires
  if (v.conteneurs && !o.gris) {
    var cs = ['#D64545', '#3F7FE0', '#F2B300', '#2E9E5B', '#8A5CD6'];
    for (var k = 0; k < 4; k++) {
      var x0 = -L * 0.35 + k * L * 0.25;
      for (var e = 0; e < v.conteneurs; e++) {
        boite(g, x0, -W * 0.8, x0 + L * 0.22, W * 0.8, zs + e * 4, zs + e * 4 + 4, { base: cs[(k + e * 2) % cs.length] });
      }
    }
  }
  return sommet;
}
// Forme de radoub (bassin vidé, fond gris) pour les étapes de construction
function formeRadoub(g) {
  poly(g, [proj(-0.85, -0.85, 0.1), proj(0.85, -0.85, 0.1), proj(0.85, 0.85, 0.1), proj(-0.85, 0.85, 0.1)], '#9DA3A9');

    if (!cible) { return; }

    var m = MOTS_DESSINS[i];
