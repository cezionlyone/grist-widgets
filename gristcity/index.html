  }
  return etapeAvecApercu(b, enfants);
}

/* ---------- Étape 6 : la météo (facultatif) ---------- */
function etapeMeteo(b) {
  var c = b.cfg;
  var t = c.table;
  var maj = function (cle, redessiner, focusId) { return function (v) { c[cle] = v; changement(redessiner, focusId); }; };
  var enfants = [creer('p', { classe: 'w-texte vl-intro', texte: '⛅ Faites parler le ciel : un nuage ☁️ pour ce qui est à surveiller, un orage ⛈️ pour les alertes. Étape facultative.' })];
  var cal = creer('div', { classe: 'vl-bloc' }, [creer('h3', { classe: 'w-c3__titre', texte: '📅 D\'après une échéance' })]);
  cal.appendChild(choixColonne('aColEcheance', 'Échéance', 'Échéance dépassée : orage. Échéance proche : nuage. Seulement pour les ' + mots().des + ' ' + mots().etatEnCours + '.', t, TYPES_ROLES.date, c.colEcheance, true, maj('colEcheance', true, 'aColEcheance')));
  if (c.colEcheance) {
    cal.appendChild(choixColonne('aColDebut', 'Date de début', 'Avec l\'échéance, dessine en pointillés ' + (cleUnivers() === 'ville' ? 'la hauteur' : 'l\'avancement') + ' que ' + mots().le + ' devrait déjà avoir, et signale un retard sur le calendrier.', t, TYPES_ROLES.date, c.colDebut, true, maj('colDebut')));
    var jours = saisie('aJours', String(typeof c.joursAlerte === 'number' ? c.joursAlerte : JOURS_ALERTE_DEFAUT), { clavier: 'numeric' });
    jours.addEventListener('change', function () { c.joursAlerte = validerNombre(jours.value, 0, 365, JOURS_ALERTE_DEFAUT); jours.value = String(c.joursAlerte); changement(false); });
    cal.appendChild(groupeChamp('Échéance proche : nombre de jours', jours, 'Un nuage apparaît quand l\'échéance tombe dans ce nombre de jours.', false));
    /* Échéance surveillée aussi une fois terminé (contrôle technique d'un
       véhicule en service, renouvellement d'un contrat en vigueur...) */
    var cbTous = creer('input', { id: 'aEcheanceTous', attrs: { type: 'checkbox' }, coche: !!c.echeanceTous });
    cbTous.addEventListener('change', function () { c.echeanceTous = cbTous.checked; changement(false); });
    cal.appendChild(creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm fr-mt-1w' }, [cbTous, creer('label', { classe: 'fr-label', attrs: { 'for': 'aEcheanceTous' } }, ['Surveiller l\'échéance aussi une fois terminé',
      creer('span', { classe: 'fr-hint-text', texte: 'Par exemple le prochain contrôle technique d\'un véhicule en service.' })])]));
  }
  enfants.push(cal);
  var bloc = creer('div', { classe: 'vl-bloc' }, [creer('h3', { classe: 'w-c3__titre', texte: '📝 D\'après vos colonnes' }),
    creer('p', { classe: 'w-mention', texte: 'Exemple : « Points à traiter est renseignée » donne un nuage ; « Incidents ouverts est supérieure à 0 » donne un orage. Jusqu\'à ' + MAX_REGLES_METEO + ' règles.' })]);
  var regles = c.meteo || (c.meteo = []);
  regles.forEach(function (r, i) {
    var ligneR = creer('div', { classe: 'w-ligne vl-regle' });
    var selN = liste('aRegleNiveau' + i, [{ valeur: 'nuageux', libelle: '☁️ À surveiller' }, { valeur: 'orage', libelle: '⛈️ Alerte' }], r.niveau);
    selN.setAttribute('aria-label', 'Règle ' + (i + 1) + ' : météo');
    selN.addEventListener('change', function () { r.niveau = selN.value; changement(false); });
    var selCol = liste('aRegleCol' + i, colonnesUtiles(t).filter(TYPES_ROLES.meteo).map(function (x) { return { valeur: x.colId, libelle: nomColonne(x) }; }), r.col, { vide: 'Colonne' });
    selCol.setAttribute('aria-label', 'Règle ' + (i + 1) + ' : colonne');
    selCol.addEventListener('change', function () { r.col = selCol.value; changement(false); });
    var selCond = liste('aRegleCond' + i, CONDITIONS_METEO.map(function (x) { return { valeur: x.cle, libelle: x.libelle }; }), r.condition);
    selCond.setAttribute('aria-label', 'Règle ' + (i + 1) + ' : condition');
    selCond.addEventListener('change', function () { r.condition = selCond.value; changement(true, 'aRegleCond' + i); });
    var avecValeur = CONDITIONS_METEO.filter(function (x) { return x.cle === r.condition; }).map(function (x) { return x.valeur; })[0];
    var val = avecValeur ? saisie('aRegleVal' + i, r.valeur || '', { indice: 'Valeur' }) : null;
    if (val) { val.setAttribute('aria-label', 'Règle ' + (i + 1) + ' : valeur'); val.addEventListener('change', function () { r.valeur = val.value; changement(false); }); }
    [selN, selCol, selCond, val].forEach(function (x) { if (x) { ligneR.appendChild(x); } });
    // 0 est une valeur renseignée. Sur une colonne de nombres
    // (0 par défaut dans Grist), « vide » ou « renseignée » ne trie rien.
    var colR = r.col ? infoColonne(t, r.col) : null;
    if (colR && /^(Numeric|Int)$/.test(String(colR.type)) && (r.condition === 'vide' || r.condition === 'rempli')) {
      ligneR.appendChild(creer('p', { classe: 'fr-hint-text w-plein', texte: 'Colonne de nombres : 0 compte comme une valeur renseignée. Pour réagir à un nombre positif, choisissez « est supérieure à » 0.' }));
    }
    ligneR.appendChild(bouton('Supprimer la règle ' + (i + 1), 'discret', 'delete-line', function () { regles.splice(i, 1); changement(true, 'aAjoutRegle'); }, { petit: true, iconeSeule: true }));
    bloc.appendChild(ligneR);
  });
  if (regles.length < MAX_REGLES_METEO) {
    bloc.appendChild(bouton('Ajouter une règle', 'secondaire', 'add-line', function () {
      regles.push({ niveau: 'nuageux', col: '', condition: 'rempli', valeur: '' });
      changement(true, 'aRegleCol' + (regles.length - 1));
    }, { petit: true, id: 'aAjoutRegle' }));
  }
  enfants.push(bloc);
  return etapeAvecApercu(b, enfants);
}

/* ---------- Étape 7 : les finitions (facultatif, rubriques repliées) ---------- */
function rubrique(id, titre, resume, enfants, ouverte) {

    casesF, creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm fr-mt-1w' }, [cbR, creer('label', { classe: 'fr-label', attrs: { 'for': 'aRecherche' }, texte: 'Proposer la recherche' })])], ouverte === 'aRubFiltres');

/* --------------------------------------------------------------------------
   Aperçu qui se construit au fil des étapes
   -------------------------------------------------------------------------- */
function projetsSelonEtape(projets, n) {
  // En paramétrage, la ville est montrée telle qu'elle est (rien ne se construit)
  if (etat.brouillon.mode !== 'creation') { return projets; }
  return projets.map(function (p) {
    var q = Object.assign({}, p);
    if (n <= 2) {   // le sol : des parcelles vides dans leurs quartiers
      q.etape = Object.assign({}, p.etape, { dessin: 'parcelle' });
      q.categorie = 'chantier';
    }
    if (n <= 4) { q.devs = []; }
    if (n <= 5) { q.meteo = 'beau'; q.raisons = []; q.etagesFantome = 0; }
    if (n <= 6) { q.toit = null; q.antennes = 0; q.lien = null; q.etagesTotal = ETAGES_DEFAUT; q.etagesConstruits = Math.min(q.etagesConstruits, ETAGES_DEFAUT); }
    return q;
  });
}
function legendeSelonEtape(n, projets) {
  var nbQ = new Set(projets.map(function (p) { return p.quartier; })).size;
  var m = mots();
  var nbP = accord(projets.length, m.un, m.des), nbQs = accord(nbQ, m.quartier, m.quartiers);
  if (n <= 2) { return '🧱 Le sol est posé : ' + nbQs + ', ' + accord(projets.length, 'parcelle') + '. ' + majInitiale(m.des) + ' : à l\'étape suivante.'; }
  if (n === 3) { return m.icone + ' ' + nbP + ' : ' + nbQs + '. Les dessins s\'affinent à l\'étape « ' + m.etapes[2] + ' ».'; }
  if (n === 4 || n === 5) { return m.action + ' ' + nbP + ', chacun dessiné selon son étape.'; }
  if (n === 6) { var nbM = projets.filter(function (p) { return p.meteo !== 'beau'; }).length; return '⛅ ' + (nbM ? accord(nbM, m.un, m.des) + ' sous les nuages.' : 'Ciel bleu partout pour l\'instant.'); }
  return '🎨 Votre ville telle qu\'elle sera : ' + nbP + ', ' + nbQs + '.';
}
// Étiquette d'exemple (premier immeuble, de préférence avec un responsable)
function majEtiquetteExemple(projets, n) {
  var z = document.getElementById('aEtiquetteExemple');
  if (!z) { return; }
  vider(z);
  if (n < 3 || !projets.length) { z.hidden = true; return; }
  z.hidden = false;
  var p = projets.filter(function (x) { return x.devs.length; })[0] || projets[0];
  var et = creer('span', { classe: 'vl-etiq' });
  et.style.borderColor = couleurSure(p.etape.couleur, '#000091');
  if (n >= 5 && p.devs.length) { et.appendChild(creer('span', { classe: 'vl-etiq__dev', texte: texteDevs(p) })); }
  else { var pt = creer('span', { classe: 'vl-etiq__point' }); pt.style.background = couleurSure(p.etape.couleur, '#000091'); et.appendChild(pt); }
  et.appendChild(creer('span', { classe: 'vl-etiq__nom', texte: (p.ref ? p.ref + ' · ' : '') + p.nom }));
  if (n >= 6 && p.meteo !== 'beau') { et.appendChild(creer('span', { texte: p.meteo === 'orage' ? '⛈️' : '☁️' })); }
  if (n >= 7 && p.lien) { et.appendChild(creer('span', { texte: '🔗' })); }
  z.appendChild(creer('span', { classe: 'w-mention', texte: 'Une étiquette, par exemple : ' }));
  z.appendChild(et);
}

/* ==========================================================================
   SECTION 9 : CHARGEMENT, RAFRAICHISSEMENT ET DEMARRAGE [INTOUCHABLE]
   Le chargement n'ecrit rien dans la table dessinee. Il peut ecrire, une
   fois, la ligne temoin du parametrage (bibliotheque) si elle manque.
   ========================================================================== */
function majIdsVisibles() {
  var c = etat.config;
  etat.idsVisibles = (c && etat.tableLiee && etat.tableLiee === c.table && etat.derniersIds) ? etat.derniersIds : null;
}

async function chargerDonneesVille() {
  majIdsVisibles();
  etat.source = await chargerSource(etat.config);
  etat.projets = construireProjets(etat.config, etat.source);
}

function accesRefuse() { return etat.niveauAcces === 'none' || etat.niveauAcces === 'read table'; }

async function chargerTout() {
  etat.niveauUtilise = etat.niveauAcces;
  if (accesRefuse()) { afficherVue('acces'); return; }
  await lireIdDoc();
  await chargerMeta();
  etat.biblio = trouverTable(ID_BIBLIO);
  await lireVilles();
  await determinerDroits();
  choisirVille();
  if (!etat.config) {
    if (!etat.peutParametrer) { afficherVue('aucun'); return; }
    if (!enCreation()) { demarrerCreation(); }
    return;
  }
  if (!verifierConfig(etat.config)) { afficherVue('invalide'); return; }
  await chargerDonneesVille();
  afficherVue('ville');
}

/* Empreinte des donnees affichees : une relecture qui ne change rien ne
   redessine pas la ville (zoom et focus preserves). */
function empreinteDonnees() {
  // Toutes les valeurs affichées comptent, y compris les colonnes
  // de la fiche (vue en liste) et les éléments du dessin.
  var cfg = etat.config || {};
  var champs = (cfg.champsFiche || []).concat(cfg.filtres || []);
  var src = etat.source || {};
  var libelles = [(src.quartiers || []).map(function (q) { return q.cle + '=' + q.libelle; }), (src.etapes || []).map(function (x) { return x.cle + '=' + x.libelle; })];
  return JSON.stringify(libelles) + JSON.stringify(etat.projets.map(function (p) {
    return [p.id, p.nom, p.ref, p.etape.cle, p.quartier, p.meteo, p.raisons, p.etagesTotal, p.etagesConstruits, p.etagesFantome,
      p.antennes, p.devs, p.toit, p.lien,
      champs.map(function (c) { return etat.source ? valeurLigne(etat.source, c, p.index) : null; })];
  }));
}

/* Colonnes du paramétrage absentes des données lues : une colonne a été
   renommée ou supprimée depuis la dernière lecture de la structure. */
function colonnesManquantes() {
  var cfg = etat.config;
  var d = etat.source && etat.source.lignes;
  if (!cfg || !d) { return false; }
  var l = colonnesUtilisees(cfg).filter(function (c) { return c && c !== 'id' && !Object.prototype.hasOwnProperty.call(d, c); });
  // Une colonne masquée par une règle d'accès manque toujours : la
  // structure n'est relue que si la liste des manques a changé.
  var cle = l.join('|');
  if (cle === (etat.manquesVus || '')) { return false; }
  etat.manquesVus = cle;
  return l.length > 0;
}

/* silencieux : relecture automatique (sans message d'erreur, sans redessin
   si rien n'a change). forcer : redessine meme si une fiche est ouverte
   (la ville se met a jour derriere la fiche). sansDessin : donnees seulement,
   l'appelant redessine toute la vue juste apres (evite de dessiner la ville deux fois). */
async function rafraichirMaintenant(silencieux, forcer, sansDessin) {
  if (etat.vue !== 'ville' || !etat.config) { return; }
  try {
    var avant = empreinteDonnees();
    // Un redessin reporté (fiche ouverte, déménagement) est toujours fait,
    // même si les données n'ont pas changé depuis.
    var enAttente = etat.rafraichirEnAttente;
    // La structure est relue aussi en relecture automatique.
    if (Date.now() - etat.metaLueA > DELAI_RELECTURE_META_MS) { await chargerMeta(); }
    if (!verifierConfig(etat.config)) {
      await chargerMeta();
      if (!verifierConfig(etat.config)) { afficherVue('invalide'); return; }
    }
    await chargerDonneesVille();
    if (colonnesManquantes()) {
      await chargerMeta();
      if (!verifierConfig(etat.config)) { afficherVue('invalide'); return; }
      await chargerDonneesVille();
    }
    etat.rafraichirEnAttente = false;
    if (sansDessin) { return; }
    if (empreinteDonnees() === avant && !forcer && !enAttente) { return; }
    if (etat.modaleOuverte && !forcer) { etat.rafraichirEnAttente = true; return; }
    if (demenagement) { etat.rafraichirEnAttente = true; return; }
    var actif = document.activeElement;
    var idBat = actif && actif.classList && actif.classList.contains('vl-bat') ? actif.getAttribute('data-id') : null;
    rendre();
    majLegende();
    if (idBat && !etat.modaleOuverte) {
      var n = document.querySelector('.vl-bat[data-id="' + idBat + '"]');
      if (n) { n.focus(); }
    }
  } catch (e) {
    if (silencieux) { logSecurite('AVERTISSEMENT', 'Relecture automatique non aboutie', e); }
    else { afficherErreur('L\'actualisation de la ville n\'a pas abouti.', e); }
  }
}

function demarrerActualisationAuto() {
  if (_minuterieActualisation) { clearInterval(_minuterieActualisation); }
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState !== 'visible' || etat.vue !== 'ville' || etat.modaleOuverte || demenagement) { return; }
    relayer(rafraichirMaintenant(true), 'Relecture automatique');
  }, DELAI_ACTUALISATION_MS);
}

function planifierRafraichissement() {
  if (etat.vue !== 'ville') { return; }
  /* Fiche ouverte : les données sont relues quand même et le redessin n'est
     reporté que si quelque chose a changé (voir rafraichirMaintenant) : fermer
     la fiche ne redessine pas une ville inchangée. */
  if (demenagement) { etat.rafraichirEnAttente = true; return; }
  if (etat.minuterieRafraichir) { clearTimeout(etat.minuterieRafraichir); }
  etat.minuterieRafraichir = setTimeout(function () {
    etat.minuterieRafraichir = null;
    relayer(rafraichirMaintenant(true), 'Rafraîchissement');
  }, 300);
}

async function detecterTableLiee() {
  try {
    etat.tableLiee = await gristAvecTimeout(grist.selectedTable.getTableId(), 5000);
  } catch (e) {
    etat.tableLiee = null;
    logSecurite('INFO', 'Table liée à la vue non déterminée', e);
  }
}

async function initialiser() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Construction de la ville…');
  try {
    await detecterTableLiee();
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { logSecurite('INFO', 'Nom du document non lu', e); }
    lireVilleMemorisee();
    await attendreAcces();
    etat.niveauUtilise = etat.niveauAcces;
    if (accesRefuse()) { masquerLoader(); afficherVue('acces'); return; }
    await chargerMeta();
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERREUR', 'Initialisation', e);
    if (accesRefuse()) {
      afficherVue('acces');
    } else {
      afficherErreur('Le chargement n\'a pas abouti.');
      afficherVue('echec');
    }
  } finally {
    etat.initEnCours = false;
    // Niveau d'accès reçu pendant le chargement : il est appliqué maintenant.
    if (etat.accesAChange) { etat.accesAChange = false; if (etat.niveauAcces !== etat.niveauUtilise) { relayer(rechargerApresAcces(), 'Changement du niveau d\'accès'); } }
  }
}

/* Nouveau niveau d'accès (accordé tardivement ou modifié) : tout est relu. */
async function rechargerApresAcces() {
  if (etat.initEnCours) { etat.accesAChange = true; return; }
  // Pendant un paramétrage ou une création, le niveau est relu au retour
  // (chargerTout). En pratique, Grist recharge le widget quand l'accès change.
  if (enParametrage() || enCreation()) { return; }
  afficherLoader('Mise à jour des droits…');
  try {
    if (etat.modaleOuverte) { fermerModale(); }
    await chargerTout();
  } catch (e) {
    logSecurite('ERREUR', 'Rechargement après changement d\'accès', e);
    if (accesRefuse()) { afficherVue('acces'); } else { afficherErreur('Le chargement n\'a pas abouti.'); afficherVue('echec'); }
  } finally {
    masquerLoader();
  }
}

document.getElementById('wSuccesFermer').addEventListener('click', masquerSucces);
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);

document.getElementById('wVisionneuseTelecharger').addEventListener('click', function () {
  if (_visionneuse.id) { relayer(telechargerPJ(_visionneuse.id), 'Téléchargement depuis la visionneuse'); }
});
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
/* Widget masqué ou retiré (changement de page Grist, onglet fermé) :
   l'enregistrement des paramétrages en attente part tout de suite, et le
   brouillon de création est gardé. */
/* Si un enregistrement est déjà en cours, le nouveau attend sa fin : il peut
   ne pas partir avant que Grist retire le widget (cas rare, signalé au
   retour par le statut de l'écran). */
function enregistrerAvantDepart() {
  if (_minuterieSauvegarde) {
    clearTimeout(_minuterieSauvegarde);
    _minuterieSauvegarde = null;
    relayer(lancerSauvegarde(), 'Enregistrement avant départ');
  }
  memoriserBrouillon();
}
window.addEventListener('pagehide', enregistrerAvantDepart);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') { enregistrerAvantDepart(); }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.vue === 'ville' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(true), 'Relecture au retour sur la page'); }
});

/* Aides « i » : un clic ailleurs, la touche Échap ou l'ouverture d'une autre
   aide referment celles qui sont ouvertes. */
function fermerAides(sauf) {
  document.querySelectorAll('.w-aide[aria-expanded="true"]').forEach(function (b) {
    if (b === sauf) { return; }
    b.setAttribute('aria-expanded', 'false');
    var pn = document.getElementById(b.getAttribute('aria-controls'));
    if (pn) { pn.hidden = true; }
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.w-aide') : null;
  if (b) { fermerAides(b); return; }
  if (e.target.closest && e.target.closest('.w-aide__texte')) { return; }
  fermerAides(null);
}, true);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { fermerAides(null); } });

grist.ready({ requiredAccess: 'full', columns: [], allowSelectBy: true });

/* Niveau d'accès réellement accordé au widget ('none', 'read table', 'full').
   Lu avant le premier chargement ; sans accès complet, le widget passe en
   consultation seule et le dit (pas d'écriture silencieusement perdue). */
var _accesRecu = null;
var _promesseAcces = new Promise(function (ok) { _accesRecu = ok; });
function accesComplet() { return etat.niveauAcces === 'full'; }
grist.onOptions(function (options, interaction) {
  etat.niveauAcces = interaction && interaction.accessLevel ? interaction.accessLevel : null;
  _accesRecu();
  // Le premier chargement n'a pas encore lu le niveau : il le lira lui-même.
  if (etat.niveauUtilise === undefined) { return; }
  // Niveau différent de celui utilisé (y compris un accès arrivé après
  // l'attente de 3 s) : tout est relu, ou à la fin du chargement en cours.
  if (etat.niveauAcces !== etat.niveauUtilise) { relayer(rechargerApresAcces(), 'Changement du niveau d\'accès'); }
});
function attendreAcces() {
  return Promise.race([_promesseAcces, new Promise(function (ok) { setTimeout(ok, 3000); })]);
}

/* Quand la table liee a la vue change, le choix de la ville est refait ; une
   ville choisie pendant la session reste prioritaire. */
async function suivreLiaison() {
  var avant = etat.tableLiee;
  await detecterTableLiee();
  if (avant === etat.tableLiee) { return false; }
  if (['ville', 'invalide'].indexOf(etat.vue) === -1 || etat.modaleOuverte || etat.initEnCours) { return false; }
  await chargerTout();
  return true;
}
grist.onRecords(function (records) {
  var ids = {};
  (records || []).forEach(function (r) { ids[r.id] = true; });
  etat.derniersIds = ids;
  relayer(suivreLiaison().then(function (change) { if (!change) { planifierRafraichissement(); } }), 'Suivi de la liaison de la vue');
});

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) {
    logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined);
  });
}, 1500);

relayer(initialiser(), 'Initialisation');
demarrerActualisationAuto();

</script>
