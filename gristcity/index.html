  var r = refsDeColonne(source.refs, col);
  var faire = function (nomBrut, emojiCol) {
    var nom = String(nomBrut || '').trim();
    var em = emojiCol || emojisDuTexte(nom).join('');
    var propre = nom.replace(REGEX_EMOJI, '').replace(/\s+/g, ' ').trim();
    return { emoji: em || initiales(nom), nom: propre || nom };
  };
  if (genre === 'reference' || genre === 'references') {
    return versListe(v).map(function (id) { return faire(r && r.libelles[id] ? r.libelles[id] : 'Ligne ' + id, source.emojis[id]); });
  }
  if (genre === 'etiquettes') { return versListe(v).map(function (x) { return faire(x); }); }
  return [faire(String(v))];
}

/* Pastille du responsable : 3 personnes au plus, puis « +N ». La liste
   complète reste dans l'info-bulle, la fiche et la vue en liste.
   [MODIFIABLE] MAX_DEVS_PASTILLE : nombre de personnes montrées. */
var MAX_DEVS_PASTILLE = 3;
function texteDevs(p) {
  var l = p.devs.slice(0, MAX_DEVS_PASTILLE).map(function (d) { return d.emoji; });
  if (p.devs.length > MAX_DEVS_PASTILLE) { l.push('+' + (p.devs.length - MAX_DEVS_PASTILLE)); }
  return l.join(' ');
}
function placesDevs(p) { return Math.min(p.devs.length, MAX_DEVS_PASTILLE) + (p.devs.length > MAX_DEVS_PASTILLE ? 1 : 0); }

/* --------------------------------------------------------------------------
   Fabrication des immeubles
   -------------------------------------------------------------------------- */
function etagesSelon(v) {
  var n = Array.isArray(v) ? versListe(v).length : (typeof v === 'number' ? v : lireNombreSaisi(String(v === null || v === undefined ? '' : v)));
  if (typeof n !== 'number' || !isFinite(n) || n < 0) { n = 0; }
  return Math.round(borner(ETAGES_BASE + ETAGES_PAR_DOUBLEMENT * Math.log2(n + 1), ETAGES_MIN, ETAGES_MAX));
}
// Avancement d'un dessin, de 0 (terrain) à 6 (terminé)
var AVANCEMENT = { terrain: 0, etude: 1, palissade: 2, fondations: 3, chantier: 4, pause: 4, demenagement: 5.5, termine: 6, gratteciel: 6, ferme: 6 };

function evaluerRegle(regle, v, texte, col) {
  var t = normaliser(texte);
  var val = normaliser(regle.valeur || '');
  switch (regle.condition) {
    case 'rempli': return !estVide(v, col) && v !== false;
    case 'vide': return estVide(v, col);
    case 'contient': return !!val && t.indexOf(val) !== -1;
    case 'egal': return t === val;
    case 'vrai': return v === true;
    case 'superieur': {
      var n = typeof v === 'number' ? v : lireNombreSaisi(texte);
      var s = lireNombreSaisi(regle.valeur);
      return typeof n === 'number' && typeof s === 'number' && n > s;
    }
    default: return false;
  }
}

function construireProjets(cfg, source) {
  var d = source.lignes;
  var jour = aujourdhuiSec();
  var joursAlerte = typeof cfg.joursAlerte === 'number' ? cfg.joursAlerte : JOURS_ALERTE_DEFAUT;
  var etapesParCle = Object.create(null);
  source.etapes.forEach(function (e) { etapesParCle[e.cle] = e; });
  // Étapes « les étages montent » dans l'ordre : plus on avance, plus il y a d'étages
  var chantiers = source.etapes.filter(function (e) { return e.dessin === 'chantier'; }).map(function (e) { return e.cle; });
  var quartiersParCle = Object.create(null);
  source.quartiers.forEach(function (q) { quartiersParCle[q.cle] = q; });
  var projets = [];
  for (var i = 0; i < source.nb; i++) {
    var id = d.id[i];
    if (etat.idsVisibles && cfg === etat.config && !etat.idsVisibles[id]) { continue; }
    var titre = texteValeurCol(cfg.table, cfg.colTitre, valeurLigne(source, cfg.colTitre, i), source.refs) || ('Ligne ' + id);
    var cleE = cleDeValeur(valeurLigne(source, cfg.colEtape, i), infoColonne(cfg.table, cfg.colEtape));
    var e = etapesParCle[cleE];
    if (!e) {
      // Étape vide ou inconnue : terrain réservé
      var brut = valeurLigne(source, cfg.colEtape, i);
      e = { cle: cleE, libelle: cleE === CLE_VIDE ? 'Étape non renseignée' : texteValeurCol(cfg.table, cfg.colEtape, brut, source.refs), rang: -1, dessin: 'terrain', couleur: dessinDe('terrain').couleur };
    }
    var etape = { cle: e.cle, libelle: e.libelle, dessin: e.dessin, couleur: e.couleur, rang: e.rang };
    var dessinInfo = dessinDe(etape.dessin);
    var cleQ = cfg.colQuartier ? cleDeValeur(valeurLigne(source, cfg.colQuartier, i), infoColonne(cfg.table, cfg.colQuartier)) : CLE_VIDE;
    var q = quartiersParCle[cleQ];
    var p = {
      id: id, index: i, nom: String(titre),
      ref: cfg.colRef ? texteValeurCol(cfg.table, cfg.colRef, valeurLigne(source, cfg.colRef, i), source.refs) : '',
      etape: etape,
      categorie: dessinInfo.categorie,
      niveau: etape.rang,
      quartier: cfg.colQuartier ? cleQ : CLE_VIDE,
      quartierLibelle: cfg.colQuartier ? (q ? q.libelle : (cleQ === CLE_VIDE ? quartierVide() : texteValeurCol(cfg.table, cfg.colQuartier, valeurLigne(source, cfg.colQuartier, i), source.refs))) : (cfg.nom || 'La ville'),
      rangQuartier: q ? q.rang : 9999,
      devs: cfg.colResponsable ? devsDeValeur(cfg, source, valeurLigne(source, cfg.colResponsable, i)) : [],
      lien: cfg.colLien ? lienSur(valeurLigne(source, cfg.colLien, i)) : null,
      toit: null, antennes: 0, meteo: 'beau', raisons: [],
      etagesTotal: cfg.colHauteur ? etagesSelon(valeurLigne(source, cfg.colHauteur, i)) : ETAGES_DEFAUT,
      etagesConstruits: 0, etagesFantome: 0
    };
    if (cfg.colToit) {
      var vt = texteValeurCol(cfg.table, cfg.colToit, valeurLigne(source, cfg.colToit, i), source.refs);
      p.toit = couleurToit(cfg, vt);
      p.toitLibelle = vt;
    }
    if (cfg.colAntennes) {
      var va = valeurLigne(source, cfg.colAntennes, i);
      p.antennes = Array.isArray(va) ? versListe(va).length : (typeof va === 'number' ? va : (lireNombreSaisi(String(va === null || va === undefined ? '' : va)) || 0));
      // Donnée numérique validée : entier entre 0 et 1000
      p.antennes = (typeof p.antennes === 'number' && isFinite(p.antennes)) ? Math.max(0, Math.min(1000, Math.round(p.antennes))) : 0;
    }
    if (etape.dessin === 'chantier') {
      var j = chantiers.indexOf(etape.cle);
      var frac = j >= 0 ? (j + 1) / (chantiers.length + 1) : 0.5;
      p.etagesConstruits = Math.max(1, Math.round(frac * p.etagesTotal));
    }
    // --- Météo ---
    if (p.categorie !== 'ferme') {
      var graves = [], autres = [];
      var enCours = p.categorie === 'chantier' || p.categorie === 'pause';
      var ech = cfg.colEcheance ? valeurLigne(source, cfg.colEcheance, i) : null;
      // Échéance surveillée en chantier, ou aussi une fois terminé si la ville le demande (echeanceTous)
      var surveiller = enCours || (cfg.echeanceTous && p.categorie === 'service');
      if (surveiller && typeof ech === 'number' && ech) {
        // Jour civil de l'échéance : dans le fuseau de la colonne pour une
        // « Date et heure », sinon la date Grist (minuit UTC).
        var echJour = jourCivil(ech, infoColonne(cfg.table, cfg.colEcheance));
        // « Échéance : date dépassée » : tournure neutre, juste quel que soit le genre du libellé
        if (echJour < jour) { graves.push(libelleCol(cfg, cfg.colEcheance) + ' : date dépassée (' + formaterDate(echJour) + ')'); }
        else if (echJour - jour <= joursAlerte * 86400) { autres.push(libelleCol(cfg, cfg.colEcheance) + ' : date proche (' + formaterDate(echJour) + ')'); }
      }
      if (enCours && typeof ech === 'number' && ech) {
        var deb = cfg.colDebut ? valeurLigne(source, cfg.colDebut, i) : null;
        if (typeof deb === 'number' && deb && ech > deb) {
          var ratio = borner((jour - deb) / (ech - deb), 0, 1);
          var avance = (AVANCEMENT[etape.dessin] || 0) / 6;
          if (etape.dessin === 'chantier') { avance = (3 + 3 * p.etagesConstruits / p.etagesTotal) / 6; }
          if (ratio - avance >= 1 / 6) {
            autres.push('En retard sur le calendrier (' + Math.round(ratio * 100) + ' % du temps écoulé)');
            if (ratio > 0.5) { p.etagesFantome = Math.max(1, Math.ceil((ratio - 0.5) * 2 * p.etagesTotal)); }
          }
        }
      }
      (cfg.meteo || []).forEach(function (regle) {
        if (!regle.col || !infoColonne(cfg.table, regle.col)) { return; }
        var v = valeurLigne(source, regle.col, i);
        var t = texteValeurCol(cfg.table, regle.col, v, source.refs);
        if (!evaluerRegle(regle, v, t, infoColonne(cfg.table, regle.col))) { return; }
        var lib = libelleCol(cfg, regle.col);
        var raisons = [];
        if (regle.condition === 'vrai') { raisons = [lib]; }
        else if (regle.condition === 'vide') { raisons = [lib + ' non renseignée']; }
        else {
          var lignesTexte = String(t).split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
          if (regle.condition === 'contient') { lignesTexte = lignesTexte.filter(function (x) { return normaliser(x).indexOf(normaliser(regle.valeur)) !== -1; }); }
          raisons = (lignesTexte.length ? lignesTexte : [t]).map(function (x) { return lib + ' : ' + (x.length > 140 ? x.slice(0, 139) + '…' : x); });
        }
        raisons.forEach(function (r) {
          if (graves.indexOf(r) !== -1 || autres.indexOf(r) !== -1) { return; }
          (regle.niveau === 'orage' ? graves : autres).push(r);
        });
      });
      if (graves.length) { p.meteo = 'orage'; } else if (autres.length) { p.meteo = 'nuageux'; }
      p.raisons = graves.concat(autres);
    }
    projets.push(p);
  }
  return projets;
}

/* Noms lisibles : on affiche toujours le libellé d'une colonne (celui de
   l'en-tête dans Grist), jamais son identifiant technique, et les soulignés
   « _ » sont remplacés par des espaces (« NB_DOCUMENTS » devient « NB DOCUMENTS »). */
function nomLisible(t) {
  return String(t === null || t === undefined ? '' : t).replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
}
function nomColonne(c) { return c ? nomLisible(c.label || c.colId) : ''; }
function nomTable(tid) { return nomLisible(libelleTable(tid)); }
function libelleCol(cfg, colId) {
  var c = infoColonne(cfg.table, colId);
  return c ? nomColonne(c) : nomLisible(colId);
}

// Couleur du toit d'une valeur : choisie dans les paramétrages, sinon proposée d'après les mots connus.
function toitAuto(libelle) {
  var t = normaliser(libelle);
  for (var i = 0; i < TOITS_PROPOSES.length; i++) { if (t.indexOf(TOITS_PROPOSES[i].mot) !== -1) { return TOITS_PROPOSES[i].couleur; } }
  return null;
}
function couleurToit(cfg, libelle) {
  if (!libelle) { return null; }
  var toits = cfg.toits || {};
  if (Object.prototype.hasOwnProperty.call(toits, libelle)) { return couleurSure(toits[libelle], null); }
  return toitAuto(libelle);
}

/* ==========================================================================
   SECTION 4 : NAVIGATION ENTRE LES VUES ET ONGLETS [INTOUCHABLE]
   ========================================================================== */
function contenu() { return document.getElementById('contenu'); }

function titreVue(texte) {
  return creer('h2', { classe: 'fr-h6 w-titre-vue', texte: texte, attrs: { tabindex: '-1', id: 'titreVue' } });
}

function enCreation() { return etat.vue === 'assistant' && etat.brouillon && etat.brouillon.mode === 'creation'; }
function enParametrage() { return etat.vue === 'assistant' && etat.brouillon && etat.brouillon.mode === 'parametrage'; }

function afficherVue(vue, garderFocus) {
  if (_minutRecherche) { clearTimeout(_minutRecherche); _minutRecherche = null; }
  etat.vue = vue;
  var zone = contenu();
  vider(zone);
  cacherInfobulleSiPresente();
  if (vue === 'assistant') { rendreAssistant(zone); memoriserBrouillon(); }
  else if (vue === 'ville') { rendreVille(zone); }
  else if (vue === 'invalide') { rendreInvalide(zone); }
  else if (vue === 'echec') { rendreEchec(zone); }
  else if (vue === 'aucun') { rendreAucun(zone); }
  else if (vue === 'acces') { rendreAcces(zone); }
  if (vue === 'ville' || vue === 'invalide' || vue === 'assistant') { envelopperOnglets(zone); }
  zone.classList.toggle('w-contenu--ville', vue === 'ville');
  document.title = etat.config && etat.config.nom && vue === 'ville' ? etat.config.nom + ' - ' + NOM_WIDGET : NOM_WIDGET;
  if (vue === 'ville') { apresAffichageVille(); }
  ameliorerListes(zone);
  if (!garderFocus) {
    var t = document.getElementById('titreVue');
    if (t) { t.focus(); }
  }
}

/* Un onglet par ville du document, puis l'onglet « Nouvelle ville », toujours
   dernier (proprietaires seulement). Fleches gauche et droite, Debut et Fin
   parcourent les onglets. */
function ongletsVilles() {
  var ul = creer('ul', { classe: 'fr-tabs__list', attrs: { role: 'tablist', 'aria-label': 'Villes du document' } });
  var onglets = [];
  var activer = [];
  var creation = enCreation();
  etat.tableaux.forEach(function (t, i) {
    var actif = !creation && t.cle === etat.cleConfig;
    onglets.push(creer('button', { classe: 'fr-tabs__tab fr-tabs__tab--icon-left fr-icon-map-pin-2-line w-onglet', id: 'vOnglet' + i, texte: (t.config.nom || 'Ville sans nom'),
      attrs: { role: 'tab', 'aria-selected': actif ? 'true' : 'false', 'aria-controls': 'vPanneau', tabindex: actif ? '0' : '-1' } }));
    activer.push(function () { return allerALaVille(t.cle); });
  });
  if (etat.peutParametrer) {
    onglets.push(creer('button', { classe: 'fr-tabs__tab fr-tabs__tab--icon-left fr-icon-add-line w-onglet', id: 'vOngletNouveau', texte: 'Nouvelle ville',
      attrs: { role: 'tab', 'aria-selected': creation ? 'true' : 'false', 'aria-controls': 'vPanneau', tabindex: creation ? '0' : '-1' } }));
    activer.push(async function () {
      if (enCreation()) { return; }
      if (enParametrage() && !(await sortirParametrages(false))) { return; }
      // Reprise proposée : le focus reste dans la question posée
      if (demarrerCreation()) { return; }
      var f = document.getElementById('vOngletNouveau');
      if (f) { f.focus(); }
      annoncer('Nouvelle ville : choisissez la table à dessiner.');
    });
  }
  onglets.forEach(function (b, i) {
    b.addEventListener('click', function () { relayer(activer[i](), 'Changement d\'onglet'); });
    b.addEventListener('keydown', function (e) {
      var k = null;
      var n = onglets.length;
      if (e.key === 'ArrowRight') { k = (i + 1) % n; }
      if (e.key === 'ArrowLeft') { k = (i + n - 1) % n; }
      if (e.key === 'Home') { k = 0; }
      if (e.key === 'End') { k = n - 1; }
      if (k !== null) { e.preventDefault(); onglets[k].focus(); relayer(activer[k](), 'Changement d\'onglet'); }
    });
    ul.appendChild(creer('li', { attrs: { role: 'presentation' } }, [b]));
  });
  return creer('nav', { classe: 'tab-nav w-onglets', attrs: { 'aria-label': 'Navigation entre les villes' } }, [ul]);
}

function envelopperOnglets(zone) {
  var actif = 'vOngletNouveau';
  if (!enCreation()) { etat.tableaux.forEach(function (t, i) { if (t.cle === etat.cleConfig) { actif = 'vOnglet' + i; } }); }
  var panneauV = creer('div', { id: 'vPanneau', attrs: { role: 'tabpanel', 'aria-labelledby': actif } });
  while (zone.firstChild) { panneauV.appendChild(zone.firstChild); }
  zone.appendChild(ongletsVilles());
  zone.appendChild(panneauV);
}

async function allerALaVille(cle) {
  if (enParametrage()) {
    var sorti = await sortirParametrages(cle === etat.cleConfig);
    if (!sorti || cle === etat.cleConfig) { return; }
  }
  if (enCreation() && etat.brouillon.etape > 1) {
    // Tables d'un modèle déjà créées : le message ne dit pas « Rien n'a été créé » (même texte que « Annuler »)
    var ok = await confirmerAction('Abandonner la création ?', etat.brouillon.tablesCreees ? 'La ville n\'est pas créée. Les choix faits pour la nouvelle ville ne sont pas conservés.' : 'Rien n\'a été créé. Les choix faits pour la nouvelle ville ne sont pas conservés.', 'Abandonner');
    if (!ok) { var f = document.getElementById('vOngletNouveau'); if (f) { f.focus(); } return; }
  }
  if (enCreation()) {
    // Abandon confirmé : comme « Annuler », le brouillon est oublié
    await proposerSuppressionTables(etat.brouillon);
    oublierBrouillon();
  }
  etat.brouillon = null;
  return changerDeVille(cle);
}

function changerDeVille(cle) {
  memoriserVille(cle);
  etat.filtre = { mode: 'tout', recherche: '', fermes: true, valeurs: {} };
  etat.recentrer = true;
  etat.demenager = false;
  etat.vb = null;
  return chargerTout().then(function () {
    var n = 0;
    etat.tableaux.forEach(function (t, i) { if (t.cle === etat.cleConfig) { n = i; } });
    annoncer('Ville ' + (etat.config ? etat.config.nom : '') + ' affichée, ' + (n + 1) + ' sur ' + etat.tableaux.length + '.');
    var f = document.getElementById('vOnglet' + n);
    if (f) { f.focus(); }
  });
}

/* Dernière ville consultée : retenue par le navigateur, pour ce document. */
function cleStockage() { return 'gristcity:' + (etat.nomDoc || 'document'); }
function lireVilleMemorisee() {
  try { etat.tableauMemorise = window.localStorage.getItem(cleStockage()); } catch (e) { etat.tableauMemorise = null; }
}
function memoriserVille(cle) {
  etat.tableauSession = cle;
  etat.tableauMemorise = cle;
  try { window.localStorage.setItem(cleStockage(), cle); } catch (e) { logSecurite('INFO', 'Dernière ville non mémorisée par le navigateur', e); }
}

function rendreInvalide(zone) {
  // Ville construite par erreur sur une table technique (bibliothèque de réglages)
  var technique = etat.config && etat.config.table && etat.meta.tables[etat.config.table] && estTableExclue(etat.config.table);
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue(technique ? 'Cette ville dessine une table technique' : 'La ville ne trouve plus ses données'),
    creer('p', { classe: 'w-texte', texte: technique
      ? 'La table « ' + nomTable(etat.config.table) + ' » contient les réglages des widgets (des codes comme « CONFIG:… »), pas des données : ses lignes ne peuvent pas devenir des ' + mots().des + '. Supprimez cette ville, puis créez-en une sur une table de données.'
      : 'La table ou l\'une des colonnes principales de la ville (nom ou étape) n\'existe plus dans ce document, ou a été renommée.' }),
    etat.peutParametrer ? creer('div', { classe: 'w-tuile__bas' }, [
      // Table supprimée : le paramétrage ne peut pas rebrancher la ville sur une autre table, seule la suppression aide
      technique || !etat.meta.tables[etat.config.table] ? null : bouton('Corriger les paramétrages', 'secondaire', 'settings-5-line', function () { ouvrirParametrage(3); }),
      bouton('Supprimer cette ville', null, 'delete-line', supprimerVille)])
      : creer('p', { classe: 'w-texte', texte: 'Signalez-le à un propriétaire du document.' })]));
}
function rendreAucun(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('Aucune ville pour l\'instant'),
    creer('p', { classe: 'w-texte', texte: accesComplet() ? 'Aucune ville n\'est encore configurée dans ce document. Sa création est réservée aux propriétaires du document.'
      : 'Aucune ville n\'est encore configurée. Pour en créer une, accordez l\'accès complet au widget : dans le panneau de droite de la page, rubrique Accès, choisissez « Accès complet au document ».' })]));
}
/* Sans accès complet, Grist ne peut pas appliquer à chacun ses propres
   droits : le widget l'explique au lieu d'afficher une erreur. */
function rendreAcces(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('Gristcity a besoin de l\'accès complet'),
    creer('p', { classe: 'w-texte', texte: 'Pour appliquer à chacun ses propres droits (consultation, modification, paramétrage), Gristcity doit avoir l\'accès complet au document.' }),
    creer('p', { classe: 'w-texte', texte: 'Une personne qui peut modifier le document peut l\'accorder : dans le panneau de droite de la page, rubrique Accès, choisissez « Accès complet au document ». Les règles d\'accès du document continuent de s\'appliquer à chaque agent.' })]));
}
function rendreEchec(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('Le chargement n\'a pas abouti'),
    creer('p', { classe: 'w-texte', texte: 'La ville n\'a pas pu être affichée.' }),
    bouton('Réessayer', null, 'refresh-line', initialiser)]));
}

/* ==========================================================================
   SECTION 5 : LA VILLE (panneau des filtres, carte, liste) [INTOUCHABLE]
   ========================================================================== */

// Colonne dans laquelle le widget peut écrire
function colonneEcrivable(colId) {
  var col = etat.config ? infoColonne(etat.config.table, colId) : null;
  if (!etat.peutModifier || !col) { return false; }
  if (etat.refus.modification || etat.refus.colonnes[colId]) { return false; }
  return !col.formule && !col.formuleVide && !estEcrasee(col) && IDS_META.indexOf(col.colId) === -1;
}
/* Colonne qui peut être remplie à la création d'une ligne : la création
   relève du droit « Créer » de Grist, pas du droit « Modifier ». */
function colonneCreable(colId) {
  var col = etat.config ? infoColonne(etat.config.table, colId) : null;
  if (!etat.peutModifier || !col) { return false; }
  return !col.formule && !col.formuleVide && !estEcrasee(col) && IDS_META.indexOf(col.colId) === -1;
}
function demenagementPossible() {
  return !!(etat.config && etat.config.colQuartier && colonneEcrivable(etat.config.colQuartier));
}

function titreVolet(icone, texte, id, explication) {
  var a = explication ? aide(id, texte, explication) : null;

/* Valeurs proposées par un filtre : celles présentes dans les immeubles. */
function valeursFiltre(cle) {
  var cfg = etat.config, src = etat.source;
  var vus = Object.create(null);
  var res = [];
  var ajouter = function (v, lib) { if (v === '' || vus[v]) { return; } vus[v] = true; res.push({ valeur: v, libelle: lib || v }); };
  if (cle === '__quartier') {
    src.quartiers.forEach(function (q) { ajouter(q.cle, q.libelle); });
    if (etat.projets.some(function (p) { return p.quartier === CLE_VIDE; })) { ajouter(CLE_VIDE, quartierVide()); }
    if (estColListe(infoColonne(cfg.table, cfg.colQuartier))) {
      src.quartiers.forEach(function (q) {
        var l = listeDeCle(q.cle);
        if (l.length === 1 && src.quartiers.some(function (x) { var lx = listeDeCle(x.cle); return lx.length > 1 && lx.indexOf(l[0]) !== -1; })) {
          ajouter(PREFIXE_CONTIENT + l[0], 'Avec ' + l[0] + ' (seul ou combiné)');
        }
      });
    }
    return res;
  }
  if (cle === '__dev') {
    etat.projets.forEach(function (p) { p.devs.forEach(function (d) { ajouter(d.nom, [d.emoji, d.nom].join(' ')); }); });
    return res.sort(function (a, b) { return a.valeur.localeCompare(b.valeur, 'fr'); });
  }
  if (cle === '__etape') {
    src.etapes.forEach(function (e) { ajouter(e.cle, e.libelle); });
    return res;
  }
  var col = infoColonne(cfg.table, cle);
  var genre = genreDe(col, null);
  etat.projets.forEach(function (p) {
    var v = valeurLigne(src, cle, p.index);
    if (genre === 'etiquettes' || genre === 'references') {
      versListe(v).forEach(function (x) { ajouter(texteValeurCol(cfg.table, cle, ['L', x], src.refs)); });
    } else {
      ajouter(texteValeurCol(cfg.table, cle, v, src.refs));
    }
  });
  if (genre === 'choix') {
    var ordre = choixDe(col);
    res.sort(function (a, b) { return ordre.indexOf(a.valeur) - ordre.indexOf(b.valeur); });
  } else { res.sort(function (a, b) { return a.valeur.localeCompare(b.valeur, 'fr'); }); }
  return res;
}
function passeFiltre(p, cle, choisie) {
  var cfg = etat.config, src = etat.source;
  if (cle === '__quartier') {
    if (String(choisie).indexOf(PREFIXE_CONTIENT) === 0) { return listeDeCle(p.quartier).indexOf(String(choisie).slice(PREFIXE_CONTIENT.length)) !== -1; }
    return p.quartier === choisie;
  }
  if (cle === '__dev') { return choisie === VALEUR_VIDE ? !p.devs.length : p.devs.some(function (d) { return d.nom === choisie; }); }
  if (cle === '__etape') { return p.etape.cle === choisie; }
  var v = valeurLigne(src, cle, p.index);
  var genre = genreDe(infoColonne(cfg.table, cle), null);
  if (choisie === VALEUR_VIDE) { return estVide(v, infoColonne(cfg.table, cle)); }
  if (genre === 'etiquettes' || genre === 'references') {
    return versListe(v).some(function (x) { return texteValeurCol(cfg.table, cle, ['L', x], src.refs) === choisie; });
  }
  return texteValeurCol(cfg.table, cle, v, src.refs) === choisie;
}

function projetsFiltres() {
  var f = etat.filtre;
  var cfg = etat.config;
  var r = normaliser(f.recherche);
  return etat.projets.filter(function (p) {
    if (f.mode === 'chantiers' && p.categorie !== 'chantier' && p.categorie !== 'pause') { return false; }
    if (f.mode === 'termines' && p.categorie !== 'service') { return false; }
    if (f.mode === 'alerte' && (p.meteo === 'beau' || p.categorie === 'ferme')) { return false; }
    if (!f.fermes && p.categorie === 'ferme') { return false; }
    var cles = Object.keys(f.valeurs);
    for (var i = 0; i < cles.length; i++) { if (!passeFiltre(p, cles[i], f.valeurs[cles[i]])) { return false; } }

  return projets.slice().sort(function (a, b) { return (a.rangQuartier - b.rangQuartier) || comparerTextes(String(a.quartierLibelle), String(b.quartierLibelle)) || ordreDansQuartier(a, b); });
}
function batsParId() {
  var m = Object.create(null);
  document.querySelectorAll('#vl-svg .vl-bat').forEach(function (b) { m[b.getAttribute('data-id')] = b; });
  return m;
}
function organiserTabulationCarte(projets) {
  var m = batsParId();
  etat.ordreBats = ordreLecture(projets).map(function (p) { return String(p.id); }).filter(function (id) { return m[id]; });
  var courant = etat.batCourant && m[etat.batCourant] ? etat.batCourant : etat.ordreBats[0];
  Object.keys(m).forEach(function (id) { m[id].setAttribute('tabindex', id === courant ? '0' : '-1'); });
}
function rendreCourant(id) {

/* Carte vide : on dit pourquoi (table encore vide, vue liée qui filtre, ou
   filtres du panneau), au lieu d'un message unique trompeur. */
function majMessageVide(projets) {
  var z = $('vl-vide');

  if (!etat.source || !etat.source.nb) {
    texte = 'La table « ' + nomTable(cfg.table) + ' » ne contient encore aucune ligne visible : la ville se construira avec les premières lignes.';
  } else if (!etat.projets.length && etat.idsVisibles) {

/* Résultat d'un filtre, annoncé une fois aux lecteurs d'écran (les compteurs
   ne sont pas une zone annoncée, pour ne pas être relus à chaque redessin). */
function annoncerResultat() {

}
function majEffacer() {

function majCompteurs(projets) {
  var z = $('vCompteurs');
  if (!z) { return; }
  var n = { chantier: 0, service: 0, alerte: 0 };
  projets.forEach(function (p) {

  });
  vider(z);
  // Compteurs dans le vocabulaire de l'univers (immeubles, plantes, véhicules...)

  z.appendChild(badge(k[1][0] + ' ' + accord(n.chantier, k[1][1], k[1][2]), 'warning'));
  z.appendChild(badge(k[2][0] + ' ' + accord(n.service, k[2][1], k[2][2]), 'success'));

function majLegende() {
  var ul = $('vl-legende-liste');
  if (!ul) { return; }

  var ligneL = function (couleur, texte) {
    var pastille = creer('span', { classe: 'vl-pastille', attrs: { 'aria-hidden': 'true' } });

    ul.appendChild(creer('li', {}, [pastille, texte]));
  };
  if (etat.couleurs === 'meteo') {
    COULEURS_METEO.forEach(function (c) { ligneL(c.couleur, c.libelle); });
  } else {
    etat.source.etapes.forEach(function (e) { ligneL(e.couleur, e.libelle + ' : ' + libelleDessin(e.dessin).toLowerCase()); });
  }
  var cfg = etat.config;
  if (cfg.colToit && mots().toit) {

    etat.projets.forEach(function (p) {
      if (p.toit && p.toitLibelle && !vus[p.toitLibelle]) { vus[p.toitLibelle] = true; ligneL(p.toit, mots().toit.legende + ' : ' + p.toitLibelle); }
    });
  }
  ul.appendChild(creer('li', { texte: mots().legendeMeteo }));
  if (etat.decor) { ul.appendChild(creer('li', { texte: mots().legendeDecor })); }
  if (cfg.colDebut && cfg.colEcheance) { ul.appendChild(creer('li', { texte: '⬚ Pointillés : ' + (cleUnivers() === 'ville' ? 'hauteur' : 'avancement') + ' attendu' + (cleUnivers() === 'ville' ? 'e' : '') + ' d\'après le calendrier' })); }
  if (cfg.colResponsable) { ul.appendChild(creer('li', { texte: '🙂 Pastille : ' + libelleCol(cfg, cfg.colResponsable).toLowerCase() + ' (encadrée en couleur sur ' + mots().unA + ' ' + mots().etatEnCours + ')' })); }
  if (cfg.colLien) { ul.appendChild(creer('li', { texte: '🔗 Ouvre le lien dans un nouvel onglet' })); }
  if (cfg.colAntennes && mots().antennes) { ul.appendChild(creer('li', { texte: '📡 Antennes : ' + libelleCol(cfg, cfg.colAntennes).toLowerCase() })); }
}

// Vue en liste : alternative accessible à la carte (RGAA)
function rendreListe(projets) {
  var cfg = etat.config;
  var z = $('vl-liste');
  vider(z);
  var extras = (cfg.champsFiche || []).filter(function (c) { return [cfg.colTitre, cfg.colEtape, cfg.colQuartier, cfg.colResponsable].indexOf(c) === -1 && infoColonne(cfg.table, c); }).slice(0, 3);
  var majuscule = function (x) { x = String(x || ''); return x.charAt(0).toUpperCase() + x.slice(1); };
  var entetes = [majuscule(mots().un)].concat(cfg.colQuartier ? [majuscule(mots().suffixeQuartier || 'quartier')] : [], ['Étape', 'Météo'], cfg.colResponsable ? [libelleCol(cfg, cfg.colResponsable)] : [], extras.map(function (c) { return libelleCol(cfg, c); }));
  var table = creer('table', {}, [
    creer('caption', { classe: 'fr-sr-only', texte: majInitiale(mots().des) + ' de la ville ' + (cfg.nom || '') }),
    creer('thead', {}, [creer('tr', {}, entetes.map(function (t) { return creer('th', { texte: t, attrs: { scope: 'col' } }); }))])]);
  var corps = creer('tbody');

    var cellules = [creer('td', {}, [creer('button', { classe: 'vl-lien-projet', texte: (p.ref ? p.ref + ' · ' : '') + p.nom, clic: function () { ouvrirFiche(p.id); } })])];
    if (cfg.colQuartier) { cellules.push(creer('td', { texte: p.quartierLibelle })); }
    cellules.push(creer('td', { texte: p.etape.libelle }));
    cellules.push(creer('td', { texte: libelleMeteo(p) + (p.raisons.length ? ' : ' + p.raisons.join(' ; ') : '') }));
    if (cfg.colResponsable) { cellules.push(creer('td', { texte: nomsDevs(p) })); }
    extras.forEach(function (c) { cellules.push(creer('td', { texte: texteValeurCol(cfg.table, c, valeurLigne(etat.source, c, p.index), etat.source.refs) })); });
    corps.appendChild(creer('tr', {}, cellules));
  });
  table.appendChild(corps);
  if (!projets.length) { var mv = $('vl-vide'); z.appendChild(creer('p', { classe: 'w-mention', texte: mv ? mv.textContent : mots().aucunUn + '.' })); }
  else { z.appendChild(creer('div', { classe: 'fr-table fr-table--sm fr-table--no-caption' }, [creer('div', { classe: 'fr-table__wrapper' }, [creer('div', { classe: 'fr-table__container' }, [creer('div', { classe: 'fr-table__content' }, [table])])])])); }
}

/* --------------------------------------------------------------------------
   Interactions de la carte : zoom, déplacement, clic, clavier, info-bulle,
   glisser-déposer du mode Déménager.
   -------------------------------------------------------------------------- */
var glisse = null;        // déplacement de la carte à la souris
var demenagement = null;  // immeuble en cours de déménagement { id, x, y, actif }
var _ecouteursFenetre = false;
var _observateur = null;

function brancherCarte() {
  var svg = $('vl-svg');
  if (!svg) { return; }
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomer(e.deltaY > 0 ? 1.12 : 1 / 1.12, versCoordonnees(e.clientX, e.clientY));
  }, { passive: false });
  svg.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) { return; }
    var b = e.target.closest('.vl-bat, .vl-etiquette');
    if (etat.demenager && b) {
      demenagement = { id: Number(b.getAttribute('data-id')), x: e.clientX, y: e.clientY, actif: false };
      return;
    }
    glisse = { x: e.clientX, y: e.clientY, bouge: false };
  });
  svg.addEventListener('click', function (e) {
    if ((glisse && glisse.bouge) || (demenagement && demenagement.actif)) { return; }
    var lienClique = e.target.closest('.vl-lien-doc');
    if (lienClique) { ouvrirLien(Number(lienClique.getAttribute('data-id'))); return; }
    var b = e.target.closest('.vl-bat, .vl-etiquette, .vl-dev');
    if (b) { ouvrirFiche(Number(b.getAttribute('data-id'))); }
  });
  svg.addEventListener('focusin', function (e) {
    var b = e.target.closest ? e.target.closest('.vl-bat') : null;
    if (b) { rendreCourant(b.getAttribute('data-id')); }
  });
  svg.addEventListener('keydown', function (e) {
    var b = e.target.closest('.vl-bat');
    if (!b) { return; }
    if (e.key === 'Escape') { cacherInfobulle(); return; }
    var id = Number(b.getAttribute('data-id'));
    var l = etat.ordreBats || [];
    var i = l.indexOf(String(id));
    var k = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { k = Math.min(l.length - 1, i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { k = Math.max(0, i - 1); }
    else if (e.key === 'Home') { k = 0; }
    else if (e.key === 'End') { k = l.length - 1; }
    if (k !== null && i !== -1) {
      e.preventDefault();
      var cible = rendreCourant(l[k]);
      if (cible) { cible.focus(); }
      return;
    }
    if (e.key === 'o' || e.key === 'O') { e.preventDefault(); ouvrirLien(id); return; }
    if (etat.demenager && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); choisirPourDemenager(id); return; }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrirFiche(id); }
  });
  svg.addEventListener('pointerover', function (e) {
    // Étiquettes superposées : celle que l'on survole passe devant
    var etq = e.target.closest('.vl-etiquette');
    if (etq && etat.toutesEtiquettes && etq.parentNode && etq.parentNode.lastChild !== etq) { etq.parentNode.appendChild(etq); }
    var b = e.target.closest('.vl-bat, .vl-etiquette, .vl-dev');
    if (b && !(glisse && glisse.bouge) && !(demenagement && demenagement.actif)) { montrerInfobulle(b, e.clientX, e.clientY, !!e.target.closest('.vl-lien-doc')); }
  });
  svg.addEventListener('pointermove', function (e) {
    if (demenagement && demenagement.actif) { return; }
    var b = e.target.closest('.vl-bat, .vl-etiquette, .vl-dev');
    if (b && !(glisse && glisse.bouge)) { montrerInfobulle(b, e.clientX, e.clientY, !!e.target.closest('.vl-lien-doc')); }
    else if (!b) { cacherInfobulle(); }
  });
  svg.addEventListener('pointerleave', cacherInfobulle);
  svg.addEventListener('focusin', function (e) {
    var b = e.target.closest('.vl-bat');
    if (!b) { return; }
    var r = b.getBoundingClientRect();
    montrerInfobulle(b, r.right, r.top + r.height / 2);
  });
  svg.addEventListener('focusout', cacherInfobulle);
  $('vl-zoom-plus').addEventListener('click', function () { zoomer(1 / 1.25); });
  $('vl-zoom-moins').addEventListener('click', function () { zoomer(1.25); });
  $('vl-recentrer').addEventListener('click', function () { etat.recentrer = true; rendre(); });
  $('vl-tourner').addEventListener('click', function () { etat.rotation = etat.rotation ? 0 : 2; etat.recentrer = true; rendre(); });
  $('vl-etiquettes').addEventListener('click', function () { basculerEtiquettes(!etat.etiquettes); });
  // Redimensionnement : même centre ; si la forme change beaucoup, le ruban est recalculé
  if (_observateur) { _observateur.disconnect(); _observateur = null; }
  if (window.ResizeObserver) {
    _observateur = new ResizeObserver(function () {
      var s = $('vl-svg');
      if (!s || !etat.vb || etat.vueListe) { return; }
      var r = s.getBoundingClientRect();
      var ratio = r.width && r.height ? r.width / r.height : 0;
      if (ratio && etat.ratioPlan && Math.abs(Math.log(ratio / etat.ratioPlan)) > 0.3) { etat.recentrer = true; rendre(); return; }
      etat.vb = ajusterRatio(etat.vb); appliquerVue(); demanderSurcouche();
    });
    _observateur.observe(svg);
  }
  if (!_ecouteursFenetre) {
    _ecouteursFenetre = true;
    window.addEventListener('pointermove', surDeplacementFenetre);
    window.addEventListener('pointerup', surRelachementFenetre);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && demenagement) { annulerGlisser(); annoncer('Déménagement annulé.'); }
    });
  }
}

function surDeplacementFenetre(e) {
  var svg = $('vl-svg');
  if (demenagement) {
    var dx0 = e.clientX - demenagement.x, dy0 = e.clientY - demenagement.y;
    if (!demenagement.actif && Math.hypot(dx0, dy0) < 5) { return; }
    if (!demenagement.actif) {
      demenagement.actif = true;
      var p = projetParId(demenagement.id);
      var porteDrag = $('vl-porte-drag');
      if (porteDrag && p) { porteDrag.textContent = '🚚 ' + p.nom; porteDrag.hidden = false; }
      cacherInfobulle();
      document.body.classList.add('vl-glisser-en-cours');
    }
    var pd = $('vl-porte-drag');
    if (pd) { pd.style.left = (e.clientX + 12) + 'px'; pd.style.top = (e.clientY + 12) + 'px'; }
    marquerCible(cibleSous(e.clientX, e.clientY));
    return;
  }
  if (!glisse || !etat.vb || !svg) { return; }
  var dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
  if (!glisse.bouge && Math.hypot(dx, dy) < 4) { return; }
  glisse.bouge = true;
  svg.classList.add('vl-glisse');
  var r = svg.getBoundingClientRect();
  etat.vb.x -= dx / r.width * etat.vb.w;
  etat.vb.y -= dy / r.height * etat.vb.h;
  glisse.x = e.clientX;
  glisse.y = e.clientY;
  appliquerVue();
  cacherInfobulle();
}
function surRelachementFenetre(e) {
  var svg = $('vl-svg');
  if (svg) { svg.classList.remove('vl-glisse'); }
  if (demenagement) {
    var d = demenagement;
    var cible = d.actif ? cibleSous(e.clientX, e.clientY) : null;
    setTimeout(function () { annulerGlisser(); }, 0);
    if (d.actif && cible !== null) { relayer(demenagerVers(d.id, cible), 'Déménagement'); }
    return;
  }
  setTimeout(function () { glisse = null; }, 0);
}
function annulerGlisser() {
  var etaitEnCours = !!demenagement;
  demenagement = null;
  // Rafraîchissement reporté pendant le glisser : repris maintenant.
  if (etaitEnCours && etat.rafraichirEnAttente) { planifierRafraichissement(); }
  var pd = $('vl-porte-drag');
  if (pd) { pd.hidden = true; }
  marquerCible(null);
  document.body.classList.remove('vl-glisser-en-cours');
}
// Quartier sous le pointeur : un nom de la barre de déménagement, ou une zone de la carte
function cibleSous(x, y) {
  var els = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
  for (var i = 0; i < els.length; i++) {
    var puce = els[i].closest ? els[i].closest('[data-q-cle]') : null;
    if (puce) { return puce.getAttribute('data-q-cle'); }
    if (els[i].classList && els[i].classList.contains('vl-zone-q')) { return els[i].getAttribute('data-q'); }
  }
  return null;
}
function marquerCible(cle) {
  document.querySelectorAll('.vl-zone-q--cible, .vl-puce-q--cible').forEach(function (n) { n.classList.remove('vl-zone-q--cible'); n.classList.remove('vl-puce-q--cible'); });
  if (cle === null || cle === undefined) { return; }
  document.querySelectorAll('.vl-zone-q').forEach(function (n) { if (n.getAttribute('data-q') === cle) { n.classList.add('vl-zone-q--cible'); } });
  document.querySelectorAll('[data-q-cle]').forEach(function (n) { if (n.getAttribute('data-q-cle') === cle) { n.classList.add('vl-puce-q--cible'); } });
}

function projetParId(id) {
  for (var i = 0; i < etat.projets.length; i++) { if (etat.projets[i].id === id) { return etat.projets[i]; } }
  return null;
}
// Ouvre le lien d'un immeuble dans un nouvel onglet : l'adresse est validée à nouveau
// (https uniquement) et ouverte par un lien temporaire avec noopener et noreferrer.
function ouvrirLien(id) {
  var p = projetParId(id);
  var url = p ? lienSur(p.lien) : null;
  if (!url) { return; }
  var a = creer('a', { attrs: { href: url, target: '_blank', rel: 'noopener noreferrer' } });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function montrerInfobulle(b, clientX, clientY, surLien) {
  var p = projetParId(Number(b.getAttribute('data-id')));
  var bulle = $('vl-infobulle');
  if (!p || !bulle) { return; }
  vider(bulle);
  bulle.appendChild(creer('strong', { texte: (surLien ? '🔗 Ouvrir : ' : '') + (p.ref ? '[' + p.ref + '] ' : '') + p.nom }));
  if (etat.config.colQuartier) { bulle.appendChild(creer('div', { texte: '🏘️ ' + p.quartierLibelle })); }
  bulle.appendChild(creer('div', { texte: p.etape.libelle }));
  bulle.appendChild(creer('div', { texte: libelleMeteo(p) + (p.raisons.length ? ' : ' + p.raisons[0] + (p.raisons.length > 1 ? ' (et ' + (p.raisons.length - 1) + ' autre' + (p.raisons.length > 2 ? 's' : '') + ')' : '') : '') }));
  if (p.devs.length) { bulle.appendChild(creer('div', { texte: (devActif(p) ? mots().icSurPlace + ' ' + mots().surPlace + ' : ' : '🧑‍💻 ') + nomsDevs(p) })); }
  if (etat.demenager) { bulle.appendChild(creer('div', { texte: '🚚 Faites glisser ' + mots().le + ' vers ' + mots().autreQ })); }
  else if (!surLien && p.lien) { bulle.appendChild(creer('div', { texte: '🔗 L\'icône de l\'étiquette ouvre le lien' })); }
  bulle.hidden = false;
  var zone = $('vl-carte-zone').getBoundingClientRect();
  var x = clientX - zone.left + 14, y = clientY - zone.top + 14;
  if (x + bulle.offsetWidth > zone.width - 8) { x = clientX - zone.left - bulle.offsetWidth - 14; }
  if (y + bulle.offsetHeight > zone.height - 8) { y = clientY - zone.top - bulle.offsetHeight - 14; }
  bulle.style.left = Math.max(4, x) + 'px';
  bulle.style.top = Math.max(4, y) + 'px';
}
// Étiquettes affichées ou masquées : le bouton 🏷️ de la carte et la case du panneau restent d'accord
function basculerEtiquettes(afficher) {
  etat.etiquettes = afficher;
  demanderSurcouche();
  var b = $('vl-etiquettes');
  if (b) {
    b.setAttribute('aria-pressed', afficher ? 'true' : 'false');
    var lib = afficher ? 'Masquer les étiquettes' : 'Afficher les étiquettes';
    b.title = lib;
    var sr = b.querySelector('.fr-sr-only');
    if (sr) { sr.textContent = lib; }
    b.classList.toggle('vl-bouton-etiquettes--off', !afficher);
  }
  var c = $('vEtiquettes');
  if (c) { c.checked = afficher; }
  annoncer(afficher ? 'Étiquettes affichées.' : 'Étiquettes masquées.');
}
function cacherInfobulle() { var b = $('vl-infobulle'); if (b) { b.hidden = true; } }
function cacherInfobulleSiPresente() { cacherInfobulle(); annulerGlisser(); }

/* --------------------------------------------------------------------------
   Mode Déménager : un immeuble change de quartier
   -------------------------------------------------------------------------- */
function basculerDemenager() {
  etat.demenager = !etat.demenager;
  etat.choisi = null;
  afficherVue('ville', true);
  var f = $('vDemenager');
  if (f) { f.focus(); }
  annoncer(etat.demenager
    ? mots().modeDeplacer + ' : faites glisser ' + mots().unA + ' vers ' + mots().autreQ + '. Au clavier, placez-vous sur ' + mots().unA + ', touche D, puis choisissez ' + mots().nouveauQ + '.'
    : mots().modeDeplacer + ' terminé.');
}

// Barre des quartiers : cibles de dépôt toujours visibles, et choix au clavier
function barreDemenagement() {
  var cfg = etat.config;
  var choisi = etat.choisi ? projetParId(etat.choisi) : null;
  var puces = etat.source.quartiers.map(function (q) { return { cle: q.cle, libelle: q.libelle }; });
  puces.push({ cle: CLE_VIDE, libelle: quartierVide() });
  var liste = creer('ul', { classe: 'vl-puces-q', attrs: { 'aria-label': majInitiale(mots().quartiers) + ' de destination' } });
  puces.forEach(function (q) {
    var actuel = choisi && choisi.quartier === q.cle;
    liste.appendChild(creer('li', {}, [creer('button', { classe: 'fr-tag fr-tag--sm fr-tag--icon-left fr-icon-home-4-line vl-puce-q', texte: q.libelle,
      attrs: { 'data-q-cle': q.cle, disabled: (choisi && actuel) ? true : null, 'aria-label': choisi ? mots().deplacer + ' : ' + choisi.nom + ' vers ' + q.libelle : q.libelle },
      clic: function () {
        if (!etat.choisi) { annoncer('Choisissez d\'abord ' + mots().unA + ' : touche D sur ' + mots().unA + ', ou faites-le glisser ici.'); return; }
        relayer(demenagerVers(etat.choisi, q.cle), 'Déménagement au clavier');
      } })]));
  });
  var barre = creer('div', { classe: 'vl-barre-demenager', id: 'vBarreDemenager' }, [
    creer('p', { classe: 'vl-barre-demenager__texte', texte: choisi
      ? '🚚 ' + choisi.nom + ' : choisissez ' + mots().nouveauQ + '.'
      : '🚚 Faites glisser ' + mots().unA + ' vers ' + mots().leQ.replace(/^(le|la) /, function (x) { return x === 'la ' ? 'une ' : 'un '; }) + ' de la carte ou vers un nom ci-dessous (' + libelleCol(cfg, cfg.colQuartier) + ' sera modifié). Échap annule.' }),
    liste]);
  // Échap annule le choix fait au clavier et rend le focus à l'immeuble
  barre.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !etat.choisi) { return; }
    e.preventDefault();
    e.stopPropagation();
    var id = etat.choisi;
    etat.choisi = null;
    barre.replaceWith(barreDemenagement());
    var b = Array.prototype.filter.call(document.querySelectorAll('.vl-bat'), function (x) { return x.getAttribute('data-id') === String(id); })[0];
    if (b) { b.focus(); }
    annoncer(mots().annule);
  });
  return barre;
}
function choisirPourDemenager(id) {
  etat.choisi = id;
  var ancienne = $('vBarreDemenager');
  if (ancienne) { ancienne.replaceWith(barreDemenagement()); }
  var p = projetParId(id);
  var premier = document.querySelector('.vl-puce-q:not([disabled])');
  if (premier) { premier.focus(); }
  annoncer((p ? p.nom : 'Élément') + ' : choisissez sa destination dans la liste.');
}

async function demenagerVers(id, cleQ) {
  var cfg = etat.config;
  var p = projetParId(id);
  if (!p || p.quartier === cleQ) { return; }
  var col = infoColonne(cfg.table, cfg.colQuartier);
  var valeur;
  // Choix multiples : le quartier « A + B » écrit les deux valeurs, « A » n'en garde qu'une
  if (estColListe(col)) { valeur = cleQ === CLE_VIDE ? null : ['L'].concat(listeDeCle(cleQ)); }
  else if (col.type.indexOf('Ref:') === 0) { valeur = cleQ === CLE_VIDE ? 0 : Number(cleQ); }
  else { valeur = cleQ === CLE_VIDE ? '' : cleQ; }
  var nomQ = cleQ === CLE_VIDE ? quartierVide() : ((etat.source.quartiers.filter(function (q) { return q.cle === cleQ; })[0] || {}).libelle || cleQ);
  var champs = {};
  champs[cfg.colQuartier] = valeur;
  try {
    await agir([['UpdateRecord', cfg.table, id, champs]]);
  } catch (e) {
    afficherErreur(estRefusDroits(e) ? 'Vos droits ne permettent pas de modifier cette information.' : mots().deplacement + ' n\'a pas abouti.', e);
    apresRefus(e, null);
    return;
  }
  etat.choisi = null;
  etat.flash = id;
  // Données seulement : afficherVue redessine juste après (évite de dessiner la ville deux fois)
  await rafraichirMaintenant(false, true, true);
  afficherVue('ville', true);
  // « Tâche a déménagé dans le quartier Ventes », ou « Tâche a déménagé dans « Sans quartier » » (et non « dans le quartier Sans quartier »)
  var phraseQ = p.nom + ' ' + mots().deplace + ' ' + (cleQ === CLE_VIDE ? 'dans « ' + nomQ + ' »' : mots().dansQ + ' ' + nomQ) + '.';
  annoncer(phraseQ);
  afficherSucces('🚚 ' + phraseQ);
  var b = document.querySelector('.vl-bat[data-id="' + id + '"]');
  if (b) { b.focus(); }
  setTimeout(function () {
    etat.flash = null;
    var n = document.querySelector('.vl-bat.vl-flash');
    if (n) { n.classList.remove('vl-flash'); }
  }, 2600);
}

/* ==========================================================================
   SECTION 5 BIS : CONSTRUIRE UN NOUVEL IMMEUBLE [INTOUCHABLE sauf libelles]
   Une petite fenêtre demande le
   nom, le quartier et l'étape, Gristcity ajoute la ligne dans la table, puis
   ouvre aussitôt la fiche du nouvel immeuble pour compléter le reste.
   Bouton visible seulement si l'on a le droit d'écrire et si la colonne du
   nom peut être saisie (pas une formule).
   ========================================================================== */
function constructionPossible() {
  var cfg = etat.config;
  // Le nom saisi est un texte : la colonne du nom doit l'accepter
  var colT = cfg ? infoColonne(cfg.table, cfg.colTitre) : null;
  var texteAccepte = !!(colT && /^(Text|Any|Choice)$/.test(String(colT.type || '')));
  return !!(cfg && accesComplet() && etat.peutModifier && !etat.refus.creation && texteAccepte && colonneCreable(cfg.colTitre));
}

/* Valeur à écrire pour une clé d'étape ou de quartier : un numéro de ligne
   pour une colonne Référence, le texte lui-même pour une colonne Choix. */
function valeurPourCle(colId, cle) {
  var col = infoColonne(etat.config.table, colId);
  if (!col || !cle || cle === CLE_VIDE) { return null; }
  if (estColListe(col)) { return ['L'].concat(listeDeCle(cle)); }
  return col.type.indexOf('Ref:') === 0 ? Number(cle) : cle;
}

function ouvrirConstruction() {
  var cfg = etat.config;
  var nom = saisie('vNouveauNom', '');
  var m = mots();
  var champs = [groupeChamp(nomColonne(infoColonne(cfg.table, cfg.colTitre)), nom, m.aideNom, true)];
  var selQ = null, selE = null;
  // Quartier : proposé seulement si la colonne peut être saisie
  if (cfg.colQuartier && colonneCreable(cfg.colQuartier)) {
    var qs = etat.source.quartiers.filter(function (q) { return q.cle !== CLE_VIDE; });
    selQ = liste('vNouveauQuartier', qs.map(function (q) { return { valeur: q.cle, libelle: q.libelle }; }), '', { vide: quartierVide() });
    champs.push(groupeChamp(nomColonne(infoColonne(cfg.table, cfg.colQuartier)), selQ, m.aideQuartier, false));
  }
  // Étape : la première étape du chantier est proposée par défaut
  if (cfg.colEtape && colonneCreable(cfg.colEtape)) {
    var es = etat.source.etapes.filter(function (e) { return e.cle !== CLE_VIDE; });
    selE = liste('vNouvelleEtape', es.map(function (e) { return { valeur: e.cle, libelle: e.libelle + ' · ' + libelleDessin(e.dessin) }; }), es.length ? es[0].cle : '', { vide: 'Pas encore d\'étape' });
    champs.push(groupeChamp(nomColonne(infoColonne(cfg.table, cfg.colEtape)), selE, m.aideEtape, false));
  }
  var form = creer('form', { classe: 'vl-construction', attrs: { novalidate: 'novalidate' } }, champs);
  var valider = function () { return construireImmeuble(nom, selQ, selE); };
  form.addEventListener('submit', function (e) { e.preventDefault(); relayer(valider(), 'Construction d\'un immeuble'); });
  ouvrirModale({
    titre: m.titreConstruire,
    sousTitre: 'Une nouvelle ligne dans la table ' + nomTable(cfg.table),
    etroite: true,
    corps: [creer('p', { classe: 'w-mention', texte: 'Vous compléterez les autres informations dans la fiche, qui s\'ouvre juste après.' }), form],
    pied: [bouton('Annuler', 'secondaire', null, fermerModale, { id: 'vNouveauAnnuler' }),
      bouton(mots().construireCourt, null, 'check-line', valider, { id: 'vNouveauOk' })]
  });
  setTimeout(function () { nom.focus(); }, 50);
}

var _constructionEnCours = false;
async function construireImmeuble(nom, selQ, selE) {
  // Un seul ajout à la fois : double Entrée ou double clic n'envoient rien de plus.
  // Le verrou est relâché dès la fermeture de la saisie (voir plus bas).
  if (_constructionEnCours) { return; }
  _constructionEnCours = true;
  try {
    await construireImmeubleUneFois(nom, selQ, selE);
  } finally {
    _constructionEnCours = false;
  }
}

async function construireImmeubleUneFois(nom, selQ, selE) {
  var cfg = etat.config;
  var texte = nom.value.trim();
  if (!texte) {
    signalerSaisie(nom.id, 'Ce nom est obligatoire.');
    return;
  }
  var champs = {};
  champs[cfg.colTitre] = texte;
  if (selQ && selQ.value) { champs[cfg.colQuartier] = valeurPourCle(cfg.colQuartier, selQ.value); }
  if (selE && selE.value) { champs[cfg.colEtape] = valeurPourCle(cfg.colEtape, selE.value); }
  var bt = document.getElementById('vNouveauOk');
  if (bt) { bt.disabled = true; }
  var id;
  try {
    var r = await agir([['AddRecord', cfg.table, null, champs]]);
    id = r && r.retValues ? r.retValues[0] : null;
  } catch (e) {
    if (bt) { bt.disabled = false; }
    afficherErreur(estRefusDroits(e) ? 'Vos droits ne permettent pas d\'ajouter une ligne dans cette table.' : 'L\'ajout n\'a pas abouti.', e);
    if (e && e.refusNote) { fermerModale(); apresRefus(e, null); }
    return;
  }
  fermerModale();
  _constructionEnCours = false;
  /* Une vue Grist liée et filtrée peut ne pas encore connaître la nouvelle
     ligne : on l'ajoute aux lignes visibles pour la voir tout de suite. */
  if (id && etat.derniersIds) { etat.derniersIds[id] = true; }
  etat.flash = id;
  etat.recentrer = false;
  // Données seulement : afficherVue redessine juste après
  await rafraichirMaintenant(false, true, true);
  afficherVue('ville', true);
  var mm = mots();
  annoncer(mm.action + ' ' + texte + ' ' + mm.fait + '.');
  afficherSucces(mm.action + ' « ' + texte + ' » ' + mm.fait + '. Complétez sa fiche.');
  setTimeout(function () {
    etat.flash = null;
    var n = document.querySelector('.vl-bat.vl-flash');
    if (n) { n.classList.remove('vl-flash'); }
  }, 2600);
  if (id && projetParId(id)) { ouvrirFiche(id); }
}

/* ==========================================================================
   SECTION 6 : FICHE D'UN IMMEUBLE (panneau latéral, modifiable) [INTOUCHABLE]
   Chaque modification est enregistrée dès que le champ est quitté. La ville
   se met à jour derrière la fiche (l'immeuble grandit sous vos yeux).
   ========================================================================== */
function champsDeLaFiche(cfg) {
  var l = [cfg.colTitre, cfg.colEtape, cfg.colQuartier, cfg.colResponsable].concat(cfg.champsFiche || []);
  var vus = Object.create(null);
  return l.filter(function (c) { if (!c || vus[c] || !infoColonne(cfg.table, c)) { return false; } vus[c] = true; return true; });
}

function ouvrirFiche(id) {
  var cfg = etat.config;
  var p = projetParId(id);
  if (!p) { return; }
  etat.ouvert = id;
  // Curseur Grist : la vue liée à la même table se place sur cette ligne
  if (etat.tableLiee && etat.tableLiee === cfg.table) {
    try { relayer(grist.setCursorPos({ rowId: id }), 'Placement du curseur'); } catch (e) { logSecurite('INFO', 'Curseur non déplacé', e); }
  }
  var form = creer('div', { classe: 'vl-fiche-form', id: 'vFicheForm' });
  champsDeLaFiche(cfg).forEach(function (colId) {
    var ed = editeurChamp(p, colId);
    ed.setAttribute('data-champ', colId);
    form.appendChild(ed);
  });
  var pied = [
    p.lien ? creer('a', { classe: 'fr-btn fr-btn--secondary fr-icon-external-link-line fr-btn--icon-left', texte: 'Ouvrir le lien',
      attrs: { href: p.lien, target: '_blank', rel: 'noopener noreferrer', title: 'Ouvrir le lien - nouvelle fenêtre' } }) : null,
    creer('span', { classe: 'w-pousse' }),
    creer('p', { classe: 'w-mention vl-fiche-statut', id: 'vFicheStatut', attrs: { role: 'status', 'aria-live': 'polite' } })];
  ouvrirModale({
    titre: (p.ref ? p.ref + ' · ' : '') + p.nom,
    sousTitre: cfg.colQuartier ? '🏘️ ' + majInitiale(mots().quartier) + ' ' + p.quartierLibelle : (cfg.nom || ''),
    laterale: true, fermerDehors: true,
    corps: [creer('div', { classe: 'vl-fiche-haut', id: 'vFicheHaut' }), creer('h3', { classe: 'vl-fiche-sous-titre', texte: 'Informations' }),
      etat.peutModifier ? creer('p', { classe: 'w-mention', texte: 'Chaque modification est enregistrée dès que vous quittez le champ.' }) : null, form],
    pied: pied,
    /* Seule la mise en évidence de l'élément ouvert change : pas de redessin complet
       (plusieurs secondes pour des milliers de lignes). Des données modifiées entre-temps
       sont redessinées par le rafraîchissement en attente. */
    surFermeture: function () {
      etat.ouvert = null;
      document.querySelectorAll('#vl-svg .vl-bat.vl-actif').forEach(function (n) { n.classList.remove('vl-actif'); });
    }
  });
  majFicheHaut(p);
  ameliorerListes(document.getElementById('wModaleCorps'));
}

// Haut de la fiche : maquette de l'immeuble, étape et météo
function majFicheHaut(p) {
  var z = $('vFicheHaut');
  if (!z) { return; }
  vider(z);
  var svg = svgEl('svg', { viewBox: '-70 -260 140 300', role: 'img', 'aria-label': 'Maquette : ' + libelleDessin(p.etape.dessin).toLowerCase() });
  var g = svgEl('g', {}, svg);
  poly(g, [proj(-1.1, -1.1, 0), proj(1.1, -1.1, 0), proj(1.1, 1.1, 0), proj(-1.1, 1.1, 0)], DECOR.quartierDessus);
  dessinerProjet(g, p);
  var typeAlerte = p.categorie === 'ferme' ? 'info' : ({ beau: 'success', nuageux: 'warning', orage: 'error' })[p.meteo];
  var meteo = creer('div', { classe: 'fr-alert fr-alert--sm fr-alert--' + typeAlerte + ' vl-meteo' }, [creer('p', {}, [creer('strong', { texte: libelleMeteo(p) })])]);
  if (p.raisons.length) { meteo.appendChild(creer('ul', {}, p.raisons.map(function (r) { return creer('li', { texte: r }); }))); }
  z.appendChild(creer('div', { classe: 'vl-fiche-maquette' }, [svg]));
  // Cadrage sur la maquette, une fois dans la page (la mesure est impossible avant)
  try {
    var bb = g.getBBox();
    if (bb.width && bb.height) { svg.setAttribute('viewBox', [bb.x - 12, bb.y - 12, bb.width + 24, bb.height + 24].map(function (n) { return n.toFixed(1); }).join(' ')); }
  } catch (e) { logSecurite('INFO', 'Maquette cadrée par défaut', e); }
  z.appendChild(creer('div', { classe: 'vl-fiche-resume' }, [
    creer('p', { classe: 'vl-fiche-etape' }, [pastilleCouleur(couleurProjet(p)), ' ' + p.etape.libelle]),
    creer('p', { classe: 'w-mention', texte: mots().action + ' ' + libelleDessin(p.etape.dessin) + (p.categorie !== 'ferme' && etat.config.colHauteur && !univers().dessiner ? ' · ' + accord(p.etagesTotal, 'étage') : '') }),
    p.devs.length ? creer('p', { classe: 'w-mention', texte: (devActif(p) ? mots().icSurPlace + ' ' + mots().surPlace + ' : ' : '🧑‍💻 ') + nomsDevs(p) }) : null,
    meteo]));
}

function pastilleCouleur(couleur) {
  var s = creer('span', { classe: 'vl-pastille', attrs: { 'aria-hidden': 'true' } });
  s.style.background = couleurSure(couleur, jetonDsfr('--background-disabled-grey', '#E5E5E5'));

/* ==========================================================================
   SECTION 6 TER : PIÈCES JOINTES DE LA FICHE [INTOUCHABLE]
   Liste des fichiers d'une colonne de pièces jointes, consultation dans une
   visionneuse, téléchargement, ajout et retrait. Les écritures sont immédiates.
   ========================================================================== */
// [MODIFIABLE] Taille maximale et extensions refusées à l'envoi.
var PJ_TAILLE_MAX = 20 * 1024 * 1024;
/* [MODIFIABLE] Formats acceptés à l'envoi (liste blanche) :
   bureautique (les formats à macros récents .docm, .xlsm, .pptm sont
   exclus ; les anciens .doc, .xls, .ppt restent admis par usage), PDF,
   images, texte, archives, messages. Les pages web, le XML, les SVG, les
   scripts et les exécutables sont refusés. */
var PJ_EXTENSIONS_ACCEPTEES = ['pdf', 'doc', 'docx', 'odt', 'rtf', 'txt', 'md', 'xls', 'xlsx', 'ods', 'csv', 'ppt', 'pptx', 'odp',
  'png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'tif', 'tiff', 'heic', 'zip', '7z', 'eml', 'msg', 'ics', 'vcf', 'json'];
// Images affichables dans la visionneuse (le SVG est exclu par sécurité).
var PJ_IMAGES = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'];
var DELAI_ENVOI_MS = 120000;

function idsPJ(v) {
  return Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(function (x) { return typeof x === 'number'; }) : [];
}

async function chargerMetaPJ() {
  try {
    var d = await lireTable('_grist_Attachments');
    var m = {};
    for (var i = 0; i < d.id.length; i++) { m[d.id[i]] = { nom: colonneDe(d, 'fileName', i) || ('Fichier ' + d.id[i]), taille: colonneDe(d, 'fileSize', i) || 0 }; }
    etat.pjMeta = m;
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Noms des pièces jointes illisibles', e);
  }
}

/* Jeton d'accès : en lecture seule pour consulter et télécharger (avec repli
   sur un jeton complet si l'instance le refuse, voir recupererPJ), avec
   écriture pour envoyer un fichier. */
async function obtenirJeton(ecriture) {
  var cle = ecriture ? 'jetonEcriture' : 'jeton';
  var j = etat[cle];
  if (j && Date.now() < j.expire) { return j; }
  var r = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !ecriture }), 15000);
  etat[cle] = { token: r.token, baseUrl: r.baseUrl, expire: Date.now() + Math.max(0, (r.ttlMsecs || 60000) - 30000) };
  return etat[cle];
}

async function fetchDelai(url, options, delaiMs) {
  var ctrl = new AbortController();
  var minut = setTimeout(function () { ctrl.abort(); }, delaiMs);
  try {
    options.signal = ctrl.signal;
    return await fetch(url, options);
  } finally {
    clearTimeout(minut);
  }
}

function extensionDe(nom) {
  var m = /\.([A-Za-z0-9]+)$/.exec(String(nom || ''));
  return m ? m[1].toLowerCase() : '';
}

function formaterTaille(octets) {
  if (!octets) { return ''; }
  if (octets < 1024) { return octets + ' o'; }
  if (octets < 1024 * 1024) { return Math.round(octets / 1024) + ' ko'; }
  return (octets / (1024 * 1024)).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' Mo';
}

function iconePJ(nom) {
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) !== -1) { return 'fr-icon-image-line'; }
  if (ext === 'pdf') { return 'fr-icon-file-pdf-line'; }
  return 'fr-icon-file-line';
}

async function recupererPJ(id) {
  var essai = async function (complet) {
    var j = await obtenirJeton(complet);
    return fetchDelai(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token), {}, DELAI_API_MS);
  };
  var rep = await essai(etat.pjJetonComplet === true);
  /* Certaines instances Grist refusent un jeton en lecture seule pour les fichiers,
     même pour les consulter : nouvel essai, une seule fois, avec un jeton complet,
     gardé ensuite pour la session. */
  if ((rep.status === 401 || rep.status === 403) && etat.pjJetonComplet !== true) {
    etat.pjJetonComplet = true;
    rep = await essai(true);
  }
  if (!rep.ok) { throw new Error('Réponse ' + rep.status); }
  return rep.blob();
}

async function telechargerPJ(id) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'fichier';
  afficherLoader('Téléchargement…');
  try {
    var blob = await recupererPJ(id);
    var url = URL.createObjectURL(blob);
    var a = creer('a', { attrs: { href: url, download: nom } });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    masquerLoader();
  } catch (e) {
    masquerLoader();
    afficherErreur('Le téléchargement du fichier n\'a pas abouti.', e);
  }
}

var _visionneuse = { url: null, retour: null, pieger: null, id: null, pdf: null, tour: 0, plein: false, observateur: null, taches: [] };

/* pdf.js : les PDF sont dessines par le widget, le lecteur integre du
   navigateur n'etant pas utilisable partout dans le cadre d'un widget
   (Firefox telecharge le fichier au lieu de l'afficher). Version legacy,
   epinglee ; chaque fichier n'est execute qu'apres verification de son
   empreinte SHA-256, l'equivalent de l'attribut integrity pour un module
   charge par le script. */
var PDFJS = {
  version: '6.2.108',
  base: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/',
  lib: { fichier: 'pdf.min.mjs', empreinte: 'n6sMkQvxSEg1xcKuto9+s9/Of560NaAEUmxa+G1wiQw=' },
  worker: { fichier: 'pdf.worker.min.mjs', empreinte: 'vA0biOoLZhlrHTalisJDxtkq3+clYk4qn904G9+O9DQ=' }
};
var _pdfjsChargement = null;

async function moduleVerifie(ressource) {
  var rep = await fetchDelai(PDFJS.base + ressource.fichier, { credentials: 'omit' }, DELAI_API_MS);
  if (!rep.ok) { throw new Error('Réponse ' + rep.status + ' pour ' + ressource.fichier); }
  var octets = await rep.arrayBuffer();
  var hache = new Uint8Array(await crypto.subtle.digest('SHA-256', octets));

  _visionneuse.taches.forEach(function (t) { if (t && t.tache) { try { t.tache.cancel(); } catch (e) { /* deja terminee */ } } });

  if (etatPage.tache) { try { etatPage.tache.cancel(); } catch (e) { /* deja terminee */ } etatPage.tache = null; }
  etatPage.dessinee = false;
  etatPage.gen++;

  etatPage.canvas.height = 0;
  if (etatPage.page) { try { etatPage.page.cleanup(); } catch (e) { /* sans effet */ } etatPage.page = null; }

async function dessinerPagePDF(doc, etatPage, tour) {

    c.width = Math.floor(vue.width);
    c.height = Math.floor(vue.height);

async function dessinerPDF() {
  var doc = _visionneuse.pdf;

  if (!doc || !zone) { return; }
  arreterDessinsPDF();
  var tour = ++_visionneuse.tour;
  vider(zone);
  zone.classList.add('w-visionneuse__contenu--pdf');
  var pages = creer('div', { classe: 'w-pdf__pages' });
  // Les pages sont des images : la version lisible est le fichier lui-même
  zone.appendChild(creer('p', { classe: 'fr-sr-only', texte: 'Ce document est affiché sous forme d\'images de pages (' + doc.numPages + ' pages). Pour le lire avec un lecteur d\'écran, utilisez le bouton Télécharger.' }));
  zone.appendChild(pages);

  var ratio = window.devicePixelRatio || 1;

  var p1 = await doc.getPage(1);
  if (_visionneuse.pdf !== doc || _visionneuse.tour !== tour) { return; }
  var b1 = p1.getViewport({ scale: 1 });
  var hauteur = Math.floor(b1.height * largeur / b1.width);

    canvas.width = 0;
    canvas.height = 0;
    canvas.style.width = Math.floor(largeur) + 'px';
    canvas.style.height = hauteur + 'px';
    canvas.setAttribute('data-page', String(n));

async function consulterPJ(id) {

function validerFichierPJ(f) {
  if (!f.size) { return 'Le fichier « ' + f.name + ' » est vide.'; }
  if (f.size > PJ_TAILLE_MAX) { return 'Le fichier « ' + f.name + ' » dépasse 20 Mo.'; }
  var ext = extensionDe(f.name);
  if (PJ_EXTENSIONS_ACCEPTEES.indexOf(ext) === -1) {
    return (ext ? 'Les fichiers .' + ext + ' ne sont pas acceptés.' : 'Le fichier « ' + f.name + ' » n\'a pas d\'extension : il n\'est pas accepté.')
      + ' Formats acceptés : documents, tableurs, présentations, PDF, images, texte, archives et messages.';
  }
  return null;
}


var _envoiPJ = false;

// Valeur actuelle d'une colonne de pièces jointes, relue avant d'écrire pour
// ne pas effacer un fichier joint entre-temps par quelqu'un d'autre.
// Valeur actuelle d'une colonne de pièces jointes, lue directement dans la
// table, quelle que soit la sélection d'une vue liée. Lève une erreur si la
// ligne ne peut pas être relue : rien ne doit alors être écrit.
async function pjActuelles(idLigne, colId) {
  var d;
  try {
    d = await lireTable(etat.config.table);
  } catch (e) {
    throw new Error('Échec de relecture de la ligne : ' + String((e && e.message) || e));
  }
  var i = (d.id || []).indexOf(idLigne);
  var e;
  if (i === -1 || !d[colId]) {
    e = new Error((i === -1 ? 'Ligne ' + idLigne : 'Colonne ' + colId) + ' introuvable');
    e.code = 'PJ_INTROUVABLE';
    throw e;
  }
  // Seules une cellule vide ou une liste de pièces jointes sont réécrites :
  // une valeur d'un autre type (erreur de formule, texte) serait écrasée.
  var brute = d[colId][i];
  if (!(brute === null || brute === '' || (Array.isArray(brute) && brute[0] === 'L'))) {
    e = new Error('Cellule de pièces jointes au format inattendu : ' + JSON.stringify(brute).slice(0, 80));
    e.code = 'PJ_FORMAT';
    throw e;
  }
  return idsPJ(brute);
}
function messagePJ(e, defaut) {
  if (e && e.code === 'PJ_INTROUVABLE') { return 'Cet élément ou sa colonne de fichiers n\'existe plus : rien n\'a été modifié. Rouvrez la fiche.'; }
  if (e && e.code === 'PJ_FORMAT') { return 'La cellule de fichiers contient une valeur inattendue (erreur ou texte) : rien n\'a été modifié pour ne pas l\'écraser. Corrigez-la directement dans la table.'; }
  if (/relecture/.test(String(e && e.message))) { return defaut + ' : la ligne n\'a pas pu être relue. Réessayez.'; }

// valeur relue (ligne sortie de la sélection d'une vue liée).
var _pjVues = {};
function pjAffichees(idLigne, colId) {
  var p = projetParId(idLigne);
  if (p) { return idsPJ(valeurLigne(etat.source, colId, p.index)); }
  return _pjVues[idLigne + ':' + colId] || [];
}

async function envoyerPJ(idLigne, colId, fichiers, idChamp, redessiner) {
  if (_envoiPJ) { annoncer('Un envoi est déjà en cours.'); return; }
  for (var k = 0; k < fichiers.length; k++) {
    var err = validerFichierPJ(fichiers[k]);
    if (err) { signalerSaisie(idChamp, err); return; }
  }
  _envoiPJ = true;
  try {
    var j = await obtenirJeton(true);
    var nouveaux = [];
    for (var i = 0; i < fichiers.length; i++) {
      afficherLoader(fichiers.length > 1 ? 'Envoi du fichier ' + (i + 1) + ' sur ' + fichiers.length + '…' : 'Envoi du fichier…');
      var fd = new FormData();
      fd.append('upload', fichiers[i], fichiers[i].name);
      var rep = await fetchDelai(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token),
        { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' }, body: fd }, DELAI_ENVOI_MS);
      if (!rep.ok) { throw new Error('Réponse ' + rep.status); }
      var ids = await rep.json();
      if (!Array.isArray(ids) || !ids.length) { throw new Error('Réponse inattendue à l\'envoi'); }
      nouveaux = nouveaux.concat(ids);
    }
    var maj = {};
    maj[colId] = ['L'].concat((await pjActuelles(idLigne, colId)).concat(nouveaux));
    await agir([['UpdateRecord', etat.config.table, idLigne, maj]]);
    _pjVues[idLigne + ':' + colId] = maj[colId].slice(1);
    await chargerMetaPJ();
    await rafraichirMaintenant(true, true);
    masquerLoader();
    redessiner();
    annoncer(nouveaux.length > 1 ? nouveaux.length + ' fichiers ajoutés.' : 'Fichier ajouté.');
  } catch (e) {
    masquerLoader();
    afficherErreur(estRefusDroits(e) ? 'Vos droits ne permettent pas d\'ajouter un fichier ici.'
      : messagePJ(e, 'Le fichier n\'a pas été rattaché') || 'L\'envoi du fichier n\'a pas abouti.', e);
    apresRefus(e, idLigne);
  } finally {
    _envoiPJ = false;
  }
}

async function retirerPJ(idLigne, colId, id, redessiner) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'ce fichier';
  var ok = await confirmerAction('Retirer « ' + nom + ' » ?', 'Le fichier ne sera plus rattaché à cet élément. Il reste conservé dans le document.', 'Retirer');
  if (!ok) { return; }
  // Même verrou que l'envoi : un ajout et un retrait simultanés se
  // relisent la même cellule et l'un effacerait l'autre.
  if (_envoiPJ) { annoncer('Une mise à jour des fichiers est déjà en cours.'); return; }
  _envoiPJ = true;
  afficherLoader('Mise à jour…');
  try {
    var reste = (await pjActuelles(idLigne, colId)).filter(function (x) { return x !== id; });
    var maj = {};
    maj[colId] = reste.length ? ['L'].concat(reste) : null;
    await agir([['UpdateRecord', etat.config.table, idLigne, maj]]);
    _pjVues[idLigne + ':' + colId] = reste;
    await rafraichirMaintenant(true, true);
    masquerLoader();
    redessiner();
    annoncer('Fichier ' + nom + ' retiré.');
  } catch (e) {
    masquerLoader();
    afficherErreur(estRefusDroits(e) ? 'Vos droits ne permettent pas de retirer ce fichier.'
      : messagePJ(e, 'Le fichier n\'a pas été retiré') || 'Le retrait du fichier n\'a pas abouti.', e);
    apresRefus(e, idLigne);
  } finally {
    _envoiPJ = false;

        modifiable ? bouton('Retirer', 'discret', 'delete-line', function () { return retirerPJ(p.id, colId, fid, dessiner); }, { petit: true, iconeSeule: true, aria: 'Retirer ' + meta.nom }) : null
      ]));
