function basculerAide() {
  etat.aideOuverte = !etat.aideOuverte;
  if (etat.aideOuverte) { rendreAide(); var t = document.getElementById('aideTitre'); if (t) { t.focus(); } }
  else { var a = document.getElementById('aide'); a.hidden = true; vider(a); }
  var b = document.querySelector('.btn--aide');
  if (b) { b.setAttribute('aria-expanded', etat.aideOuverte ? 'true' : 'false'); if (!etat.aideOuverte) { b.focus(); } }
}

function rendreAide() {
  var a = document.getElementById('aide');
  a.hidden = false;
  vider(a);
  a.appendChild(creer('div', { classe: 'volet__tete' }, [
    creer('h2', { classe: 'volet__titre', id: 'aideTitre', attrs: { tabindex: '-1' } }, [icone('aide'), 'Aide']),
    bouton('Fermer l’aide', 'ico', 'fermer', basculerAide)
  ]));
  var onglets = creer('div', { classe: 'aide-onglets', attrs: { role: 'tablist', 'aria-label': 'Rubriques de l’aide' } });
  [['quoi', 'À quoi ça sert'], ['pas', 'Pas à pas'], ['questions', 'Questions']].forEach(function (o) {
    onglets.appendChild(creer('button', { classe: 'aide-onglet', texte: o[1], id: 'aideOnglet_' + o[0], attrs: { role: 'tab', 'aria-selected': etat.aideOnglet === o[0] ? 'true' : 'false', 'aria-controls': 'aidePanneau', tabindex: etat.aideOnglet === o[0] ? '0' : '-1' },
      clic: function () { etat.aideOnglet = o[0]; rendreAide(); var n = document.getElementById('aideOnglet_' + o[0]); if (n) { n.focus(); } } }));
  });
  onglets.addEventListener('keydown', function (e) {
    var ordre = ['quoi', 'pas', 'questions'];
    var i = ordre.indexOf(etat.aideOnglet);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      etat.aideOnglet = ordre[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3];
      rendreAide();
      document.getElementById('aideOnglet_' + etat.aideOnglet).focus();
    }
  });
  a.appendChild(onglets);
  var corps = creer('div', { classe: 'volet__corps', id: 'aidePanneau', attrs: { role: 'tabpanel', 'aria-labelledby': 'aideOnglet_' + etat.aideOnglet } });
  if (etat.aideOnglet === 'questions') {
    AIDE.questions.forEach(function (q, i) {
      var id = 'aideQ' + i;
      var rep = creer('div', { id: id, attrs: { hidden: true } }, [creer('p', { texte: q[1] })]);
      var b = creer('button', { attrs: { 'aria-expanded': 'false', 'aria-controls': id } }, [creer('span', { texte: q[0] }), icone('plus', 'ico--s')]);
      b.addEventListener('click', function () {
        var ouvert = b.getAttribute('aria-expanded') === 'true';
        b.setAttribute('aria-expanded', ouvert ? 'false' : 'true');
        rep.hidden = ouvert;
        b.replaceChild(icone(ouvert ? 'plus' : 'moins', 'ico--s'), b.lastChild);
      });
      corps.appendChild(creer('div', { classe: 'question' }, [b, rep]));
    });
  } else {
    AIDE[etat.aideOnglet].forEach(function (bloc) {
      if (bloc[0] === 'p') { corps.appendChild(creer('p', { texte: bloc[1] })); }
      else if (bloc[0] === 'h') { corps.appendChild(creer('h3', { texte: bloc[1] })); }
      else { corps.appendChild(creer(etat.aideOnglet === 'pas' ? 'ol' : 'ul', { attrs: { style: 'padding-left:1.25rem;margin:0;display:flex;flex-direction:column;gap:.5rem' } }, bloc[1].map(function (t) { return creer('li', { texte: t }); }))); }
    });
  }
  a.appendChild(corps);
}

/* === SECTION : ACTUALISATION AUTOMATIQUE ===
   Relecture toutes les 20 s quand la page est visible, et au retour sur la
   page ; l'écran n'est redessiné que si les données ont changé. */
var _actualisationEnCours = false;
async function actualiser() {
  if (_actualisationEnCours || !etat.config || etat.assistant || document.visibilityState === 'hidden') { return; }
  if (etat.modaleOuverte || etat.menuPlus) { etat.rafraichirEnAttente = true; return; }
  _actualisationEnCours = true;
  try {
    var change = await chargerDonnees();
    if (change && !etat.modaleOuverte && !etat.assistant) {
      var focus = document.activeElement && document.activeElement.id;
      rendre();
      if (focus) { var n = document.getElementById(focus); if (n) { n.focus(); } }
    }
  } catch (e) {
    logSecurite('INFO', 'Actualisation impossible', e);
  } finally {
    _actualisationEnCours = false;
  }
}

/* === SECTION : DÉMARRAGE ===
   Le chargement n'écrit rien dans le document. */
async function demarrer() {
  dessinerLogo();
  var fermer = document.getElementById('wModaleFermer');
  fermer.appendChild(icone('fermer'));
  fermer.addEventListener('click', fermerModale);
  document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
  document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
  document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
  document.getElementById('wSucces').addEventListener('click', masquerSucces);
  rendreBandeau();
  afficherLoader('Chargement…');
  try {
    grist.ready({ requiredAccess: 'full' });
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 10000); } catch (e) { logSecurite('INFO', 'Nom du document inconnu', e); }
    await lireFuseauDoc();
    await chargerMeta();
    etat.biblio = trouverTableModele(ID_BIBLIO);
    if (etat.biblio) { await lireBibliotheque(); }
    masquerLoader();
    if (etat.arbres.length) {
      var memo = lireArbreMemorise();
      var cle = etat.arbres.some(function (a) { return a.cle === memo; }) ? memo : etat.arbres[0].cle;
      await changerArbre(cle);
    } else {
      rendre();
    }
  } catch (e) {
    masquerLoader();
    afficherErreur('Le widget n’a pas pu lire le document. Vérifiez qu’il a l’accès complet au document (panneau de droite, rubrique « Accès »).', e);
    var z = contenu();
    vider(z);
    z.appendChild(creer('div', { classe: 'vide' }, [creer('h2', { texte: 'Accès au document nécessaire' }),
      creer('p', { texte: 'Dans le panneau de droite de cette vue, rubrique « Accès », choisissez « Accès complet au document », puis rechargez la page.' })]));
  }
  setInterval(function () { relayer(actualiser(), 'Actualisation'); }, DELAI_ACTUALISATION_MS);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { relayer(actualiser(), 'Actualisation au retour'); } });
}

relayer(demarrer(), 'Démarrage');
</script>
