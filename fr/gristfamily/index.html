  DESCRIPTION
  -----------
  Gristfamily : un arbre généalogique pour tous, sans connaissance
  technique. Un même widget héberge tous les arbres d'un document, en
  onglets ; le dernier onglet, « Nouvel arbre », en crée un autre. Les
  arbres d'un même document partagent les mêmes tables : un arbre est une
  façon de regarder la famille (personne au centre, générations
  affichées, couleurs), pas une copie des données.

  Modèle de données : une personne a une union d'origine (ses parents) ;
  une union relie deux personnes (ou une seule, ou aucune si seule la
  fratrie est connue) et porte leurs enfants. Les familles recomposées,
  les demi-frères et sœurs et les remariages se saisissent donc sans
  bricolage. Le sexe est facultatif ; il ne sert jamais à placer les
  personnes, seulement à un liseré de couleur sur les cartes : les branches portent le prénom du parent
  (« Côté Marc », « Côté Claire »).

  Vues :
  - Arbre : la personne au centre, ses ascendants au-dessus, ses
    descendants et leurs conjoints en dessous, sa fratrie à côté ;
    déplacement à la souris ou au clavier, zoom, « + » sur chaque carte
    pour ajouter un parent, un conjoint, un enfant, un frère ou une sœur ;
  - Ascendance : éventail des ancêtres, jusqu'à 6 générations ;
  - Liste : toutes les personnes, avec recherche, branche et lien avec
    la personne au centre (père, grand-mère, demi-sœur, belle-famille) ;
  - Carte : la famille placée selon le lieu de vie, de naissance ou de
    décès, et les cousins ADN selon leur ville et leur pays ;
  - Anniversaires : naissances et unions des douze prochains mois, et en
    option les dates de souvenir des personnes décédées ;
  - Cousins ADN (en option) : les correspondances reçues des sites de
    tests ADN, sans obligation de les rattacher à l'arbre : pays, site,
    ADN partagé en centimorgans, branche supposée, contact. Une
    estimation de la parenté est affichée d'après les centimorgans
    quand la relation n'est pas renseignée.
  Fiche personne dans un volet à droite (CRUD complet : ajouter,
  modifier, supprimer, photo). Dates partielles admises (« 1920 »,
  « 03/1920 ») et dates approximatives (« vers 1920 »).

  DÉPENDANCES
  -----------
  - Thème madeXcé autonome aux couleurs de Grist (jetons de conception
    sur :root), sans feuille de style ni police externe.
  - Icônes dessinées en SVG par le script (createElementNS).
  - Leaflet 1.9.4 (carte), chargé seulement à l'ouverture de la vue
    Carte, avec empreintes SRI ; fonds de carte OpenStreetMap ; noms de
    lieux (jamais de personnes) envoyés au service Nominatim pour être
    situés, un par seconde au plus, coordonnées gardées dans la
    bibliothèque (CLE = LIEU:<lieu>).
  - Grist Plugin API (grist-plugin-api.js), chargée depuis
    docs.getgrist.com : origine imposée par la plateforme, adresse non
    versionnée, donc sans empreinte SRI.

  TABLES CRÉÉES AUTOMATIQUEMENT
  -----------------------------
  🌳 BIBLIOTHÈQUE D'ARBRES ⚡ (BIBLIOTHEQUE_D_ARBRES_) : réglages, une
  ligne par arbre (CLE = ARBRE:<identifiant>, VALEUR = configuration
  JSON) et deux lignes témoins des droits (ACCES_EDITION,
  ACCES_PARAMETRAGE). Exclue des listes de tables.
  👤 PERSONNES ⚡ (PERSONNES_) : PRENOM, NOM, NOM NAISSANCE, SEXE,
  PHOTO, NAISSANCE, NAISSANCE APPROX, NAISSANCE LIEU, LIEU VIE, DECEDE, DECES,
  DECES APPROX, DECES LIEU, PARENTS (référence à l'union d'origine),
  FILIATION, PROFESSION, NOTES, NOM COMPLET (formule d'affichage).
  💞 UNIONS ⚡ (UNIONS_) : PERSONNE A, PERSONNE B, TYPE, DEBUT, FIN,
  SEPARES, NOTES, COUPLE (formule d'affichage).
  🧬 COUSINS ADN ⚡ (COUSINS_ADN_), seulement si l'option est cochée :
  PRENOM, NOM, PAYS, VILLE, SITE, AGE, ADN CM, ADN POURCENT, SEGMENTS,
  SEGMENT MAX CM, RELATION ESTIMEE, BRANCHE, PATRONYMES, LIEU COMMUN,
  TAILLE ARBRE, ANCETRE PROBABLE, CONTACT, CONTACTE, NOTES.
  Saisie d'un cousin par copier-coller de sa fiche sur le site de test
  (MyHeritage notamment), ou import groupé d'une page entière de
  correspondances ; les doublons (même prénom et même nom) sont ignorés.
  Cercles de parenté d'après les centimorgans : famille proche (1 300 cM
  et plus), famille élargie (200 à 1 300), parents éloignés.
  Dates stockées en texte AAAA, AAAA-MM ou AAAA-MM-JJ (tri correct,
  dates partielles possibles), affichées « 12 mars 1963 ».
  Chaque table porte les quatre champs CREE LE, CREE PAR, MODIFIE LE,
  MODIFIE PAR (formules de déclenchement remplies par la plateforme,
  jamais par le widget). Les pages créées avec les tables sont supprimées
  aussitôt : le widget est l'interface prévue. Une table du modèle qui
  existe déjà est réutilisée, jamais recréée avec un numéro.

  UTILISER SES PROPRES TABLES
  ---------------------------
  Parcours « J'ai déjà une table de personnes » : chaque information du
  modèle est reliée à une colonne existante de type compatible, ou créée.
  Aucune colonne n'est jamais retypée ni supprimée. La table des unions
  est celle du modèle (créée si besoin).

  CONFIGURATION
  -------------
  Aucun appel à setOption : la configuration vit dans la bibliothèque.
  Le dernier arbre consulté est mémorisé par le navigateur
  (localStorage), par document.

  DROITS
  ------
  Accès complet au document requis. Trois niveaux : lecteurs
  (consultation), éditeurs (en plus : ajouter, modifier, supprimer des
  personnes), propriétaires (en plus : paramétrage). Le widget lit les
  lignes témoins ACCES_EDITION et ACCES_PARAMETRAGE ; une règle d'accès
  qui les rend illisibles masque les commandes correspondantes (marche à
  suivre dans le paramétrage, étape « Général »). Masquer est un confort :
  la vraie protection vient des règles d'accès et des droits du document.

  SÉCURITÉ
  --------
  - Ni exécution de code dynamique, ni accès au cadre parent
  - Aucune donnée insérée comme HTML : DOM construit avec textContent et
    setAttribute ; echapperHTML() fait partie du socle commun
  - Photos : fichiers récupérés en Blob, jeton d'accès demandé au moment
    de l'appel, limité au document, jamais stocké ni journalisé ; images
    seulement (jpg, jpeg, png, gif, webp), 10 Mo au plus
  - Journalisation par logSecurite(), messages d'erreur neutres
  - Confirmations par fenêtres HTML, écouteurs posés par addEventListener

  JETON D'ACCÈS DANS LES APPELS REST
  ---------------------------------
  L'envoi et l'affichage des photos passent le jeton en paramètre de
  l'adresse : l'en-tête Authorization exige une vérification préalable
  que le serveur refuse depuis le cadre du widget. Le jeton n'apparaît
  dans aucun lien ni attribut de la page, mais peut figurer dans les
  journaux du serveur. Atténuations : jeton demandé au moment de l'appel,
  limité au document, renouvelé avant expiration, jamais conservé hors
  de la mémoire de la page.

  ACCESSIBILITÉ
  -------------
  Cartes de l'arbre et secteurs de l'éventail atteignables au clavier,
  flèches pour déplacer l'arbre, + et - pour zoomer ; noms accessibles
  reprenant le texte visible ; couleur jamais seule porteuse
  d'information (légende, libellés) ; cibles de 24 px au moins ; fenêtres
  avec piège du focus et retour du focus.
-->

<style>
/* === SECTION : JETONS DE CONCEPTION [MODIFIABLE : couleurs] ===
   Palette Grist ; contrastes du texte de 4,5:1 au moins. */
:root {
  --sable: #F7F7F7; --sable2: #EFEFEF; --encre: #262633; --gris: #5E5E70; --trait: #D9D9D9; --trait-fort: #A3A3B2; --blanc: #FFFFFF;

  --ecume: #DCF4EB; --peche: #FDE7CF; --peche-f: #8A4200; --lavande: #E3ECFD; --lavande-f: #1D4ED8;
  --flamant: #FDE5E7; --flamant-f: #A8021A; --citron: #FFF6E6; --citron-f: #7A4F00; --mauve: #F0E6FA; --mauve-f: #6B2FA0;
  --erreur: #C0141C;
  --ombre: 0 1px 3px rgba(38, 38, 51, .08); --ombre-forte: 0 10px 30px rgba(31, 37, 50, .22);
  --voile: rgba(38, 38, 51, .5);
  --r-s: 4px; --r-m: 6px; --r-l: 10px;
  --police: -apple-system, BlinkMacSystemFont, "Segoe UI", "Liberation Sans", Helvetica, Arial, sans-serif;
  --carte-l: 220px; --carte-h: 100px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--police); font-size: .875rem; line-height: 1.5; color: var(--encre); background: var(--blanc); display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--vert-f); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 1.125rem; height: 1.125rem; flex: none; }
.ico--s { width: 1rem; height: 1rem; }
.ico--l { width: 1.5rem; height: 1.5rem; }

/* === Boutons === */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; min-height: 2.25rem; padding: 0 .875rem; border: 1px solid var(--trait); border-radius: var(--r-m);
  background: var(--blanc); color: var(--encre); font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--sable); }
.btn--p { background: var(--vert-f); border-color: var(--vert-f); color: var(--blanc); }
.btn--p:hover { background: var(--vert-ff); }
.btn--danger { color: var(--erreur); border-color: var(--erreur); }
.btn--danger:hover { background: var(--flamant); }
.btn--plein-danger { background: var(--erreur); border-color: var(--erreur); color: var(--blanc); }
.btn--plein-danger:hover { background: #9A0F16; }
.btn--disc { border-color: transparent; background: transparent; color: var(--vert-f); }
.btn--disc:hover { background: var(--ecume); }
.btn--s { min-height: 2rem; padding: 0 .625rem; font-size: .8125rem; }
.btn--ico { width: 2.25rem; padding: 0; border-color: transparent; background: transparent; color: var(--gris); }
.btn--ico:hover { background: var(--sable2); color: var(--encre); }
.btn--ico.btn--s { width: 2rem; }
.btn:disabled { background: var(--sable2); border-color: var(--sable2); color: #767676; cursor: not-allowed; }
.btn--aide { border-color: var(--vert); color: var(--vert-f); }
.btn--aide[aria-expanded="true"] { background: var(--ecume); }

/* === Champs === */
.champ { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
.champ > label, .etiq { font-weight: 600; font-size: .8125rem; }
.indice { color: var(--gris); font-size: .75rem; font-weight: 400; }
.saisie { width: 100%; min-height: 2.375rem; padding: .4375rem .625rem; border: 1px solid #B8B8C2; border-radius: var(--r-m); background: var(--blanc); }
.saisie:focus { border-color: var(--vert-f); box-shadow: 0 0 0 3px var(--ecume); outline: none; }
.saisie[aria-invalid="true"] { border-color: var(--erreur); }
textarea.saisie { resize: vertical; }
.erreur-champ { color: var(--erreur); font-size: .8125rem; }
.case { display: flex; align-items: flex-start; gap: .5rem; cursor: pointer; min-height: 1.75rem; }
.case input { width: 1.125rem; height: 1.125rem; margin: .125rem 0 0; accent-color: var(--vert-f); flex: none; }

.grille2 .plein { grid-column: 1 / -1; }
@media (max-width: 560px) { .grille2 { grid-template-columns: minmax(0, 1fr); } }

/* === Alertes, badges === */
.alerte { display: flex; gap: .625rem; align-items: flex-start; padding: .75rem .875rem; border-radius: var(--r-m); background: var(--sable); color: var(--encre); }
.alerte p { margin: 0; }
.alerte--info { background: var(--ecume); }

.alerte--erreur { background: var(--flamant); color: var(--flamant-f); }

.br-a { background: var(--peche); color: var(--peche-f); }
.br-b { background: var(--ecume); color: var(--vert-f); }
.br-desc { background: var(--lavande); color: var(--lavande-f); }
.br-centre { background: var(--citron); color: var(--citron-f); }
.br-allie { background: var(--sable2); color: #44444F; }
.br-aucune { background: var(--sable2); color: #44444F; }
.br-adn { background: var(--mauve); color: var(--mauve-f); }
.gen-0 { background: var(--citron); color: var(--citron-f); } .gen-1 { background: var(--peche); color: var(--peche-f); } .gen-2 { background: var(--ecume); color: var(--vert-f); }
.gen-3 { background: var(--lavande); color: var(--lavande-f); } .gen-4 { background: var(--mauve); color: var(--mauve-f); } .gen-5 { background: var(--flamant); color: var(--flamant-f); }

.w-logo__x { fill: var(--orange); font-weight: 800; } .w-logo__ce { fill: var(--vert); font-weight: 800; }
.bandeau__sep { width: 1px; height: 1.5rem; background: var(--trait); }
.bandeau__nom { font-weight: 700; font-size: 1rem; }

.bandeau__version { color: var(--gris); font-size: .75rem; }
.bandeau__d { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; }

.vide h2 { margin: 0; color: var(--encre); font-size: 1.25rem; }

/* === Arbre === */
.vue-arbre { position: absolute; inset: 0; overflow: hidden; background-color: var(--sable); background-image: radial-gradient(#D6D6DE 1px, transparent 1px); background-size: 22px 22px; cursor: grab; touch-action: none; }
.vue-arbre:focus-visible { outline-offset: -3px; }
.vue-arbre.glisse { cursor: grabbing; }
.monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.liens { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.liens path { fill: none; stroke: var(--trait-fort); stroke-width: 2; }
.liens .adopte { stroke-dasharray: 6 5; }
.liens .coeur { fill: #E1000F; stroke: none; }
.liens .coeur--separe { fill: var(--trait-fort); }
.noeud { position: absolute; width: var(--carte-l); min-height: var(--carte-h); display: flex; }
.carte { width: 100%; min-height: var(--carte-h); display: flex; align-items: center; gap: .625rem; padding: .5rem .625rem .5rem .75rem; background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--r-l);
  box-shadow: var(--ombre); text-align: left; cursor: pointer; }
.carte:hover { border-color: var(--trait-fort); }
.carte--mort { background: #F4F4F6; }
.carte--centre { border: 2px solid var(--vert); }
.carte--sel { border: 2px solid var(--vert-f); box-shadow: 0 0 0 4px rgba(22, 179, 120, .22); }
.carte--double { border-style: dashed; }
.carte.carte--h { border-left: 6px solid #4C84D8; }
.carte.carte--f { border-left: 6px solid #D9608E; }
.carte--mort .carte__nom::after { content: " \2020"; color: var(--gris); font-weight: 400; }
.legende__sexe { display: inline-block; width: .25rem; height: .875rem; border-radius: 2px; vertical-align: -2px; margin-right: .375rem; }
.carte--trouve { box-shadow: 0 0 0 4px var(--orange); }
.carte__txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.carte__nom { font-weight: 600; font-size: .8125rem; white-space: normal; overflow-wrap: anywhere; }
.carte__info { font-size: .75rem; color: var(--gris); white-space: normal; overflow-wrap: anywhere; }
.avatar { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8125rem; overflow: hidden; background: var(--sable2); color: #44444F; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--carre { border-radius: var(--r-m); }
.avatar.br-a { background: var(--peche); color: var(--peche-f); } .avatar.br-b { background: var(--ecume); color: var(--vert-f); } .avatar.br-desc { background: var(--lavande); color: var(--lavande-f); }
.avatar.br-centre { background: var(--citron); color: var(--citron-f); }
.avatar.gen-0 { background: var(--citron); color: var(--citron-f); } .avatar.gen-1 { background: var(--peche); color: var(--peche-f); } .avatar.gen-2 { background: var(--ecume); color: var(--vert-f); }
.avatar.gen-3 { background: var(--lavande); color: var(--lavande-f); } .avatar.gen-4 { background: var(--mauve); color: var(--mauve-f); } .avatar.gen-5 { background: var(--flamant); color: var(--flamant-f); }
.avatar--xl { width: 5.5rem; height: 5.5rem; font-size: 1.5rem; }
.plus { position: absolute; right: -10px; bottom: -10px; width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 2px solid var(--blanc); background: var(--vert-f); color: var(--blanc);
  display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); padding: 0; }
.noeud:hover .plus, .noeud:focus-within .plus, .plus[aria-expanded="true"] { opacity: 1; }
@media (hover: none) { .plus { opacity: 1; } }
.menu-plus { position: absolute; z-index: 20; width: 14.5rem; padding: .375rem; background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--r-l); box-shadow: var(--ombre-forte); display: flex; flex-direction: column; }
.menu-plus__titre { padding: .375rem .625rem; font-size: .75rem; font-weight: 700; color: var(--gris); }
.menu-plus button { display: flex; align-items: center; gap: .5rem; min-height: 2.5rem; padding: 0 .625rem; border: 0; border-radius: var(--r-m); background: transparent; text-align: left; cursor: pointer; }
.menu-plus button:hover, .menu-plus button:focus-visible { background: var(--ecume); }
.menu-plus button:disabled { color: #767676; cursor: not-allowed; background: transparent; }
.commandes { position: absolute; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: 2px; padding: 3px; background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--r-l); box-shadow: var(--ombre); }
.legende { position: absolute; left: 1rem; bottom: 1rem; right: 5rem; display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .75rem; padding: .5rem .75rem; background: rgba(255, 255, 255, .94); border: 1px solid var(--trait); border-radius: var(--r-l); font-size: .75rem; width: max-content; max-width: calc(100% - 6rem); }
.pastille { width: .75rem; height: .75rem; border-radius: 50%; display: inline-block; vertical-align: -1px; margin-right: .25rem; border: 1px solid rgba(0, 0, 0, .15); }
.titre-vue { position: absolute; left: 1rem; top: .75rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; pointer-events: none; }
.titre-vue > * { pointer-events: auto; }
.titre-vue__nom { font-size: 1rem; font-weight: 700; background: rgba(247, 247, 247, .9); padding: 0 .25rem; border-radius: var(--r-s); }

/* === Éventail === */
.eventail { width: 100%; max-width: 1100px; height: auto; display: block; margin: 0 auto; }
.secteur { stroke: var(--blanc); stroke-width: 2; cursor: pointer; }
.secteur:hover, .secteur:focus-visible { filter: brightness(.95); outline: none; stroke: var(--vert-f); stroke-width: 3; }
.secteur--vide { fill: #FAFAFB; stroke: var(--trait); stroke-dasharray: 4 4; }
.eventail text { pointer-events: none; font-family: var(--police); }

/* === Tableaux === */
.tableau-conteneur { overflow-x: auto; border: 1px solid #E6E6EC; border-radius: var(--r-l); background: var(--blanc); }
table.tableau { width: 100%; border-collapse: collapse; }
.tableau th, .tableau td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid #EEEEF2; vertical-align: middle; }
.tableau thead th { background: #FAFAFB; font-size: .75rem; font-weight: 700; color: var(--gris); white-space: nowrap; }
.tableau tbody tr:hover { background: #FAFAFB; }
.tri { display: inline-flex; align-items: center; gap: .25rem; border: 0; background: transparent; font: inherit; color: inherit; cursor: pointer; padding: .25rem 0; }
.lien-personne { border: 0; background: transparent; padding: 0; color: var(--vert-f); font-weight: 600; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(0, 117, 72, .35); }
.lien-personne:hover { text-decoration-color: currentColor; }
.filtres { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; margin-bottom: 1rem; }
.filtres .champ { flex: 1 1 12rem; max-width: 18rem; }
.compteurs { display: flex; flex-wrap: wrap; gap: .375rem; }
.cousin-icone { background: none; border: 0; overflow: visible; }
.cousin-icone:hover { z-index: 10000 !important; }
.cousin-pile { width: 230px; pointer-events: auto; display: flex; flex-direction: column; gap: 4px; }
.cousin-pile__lieu { font-size: .6875rem; font-weight: 700; color: #4B1F78; text-shadow: 0 0 3px #fff, 0 0 3px #fff; text-align: center; }
.cousin-carte { display: flex; flex-direction: column; gap: 1px; text-align: left; width: 100%; padding: 3px 8px; background: #fff; border: 1px solid #D8CCE6; border-left: 4px solid #6B2FA0; border-radius: 8px; cursor: pointer; font: inherit; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.cousin-carte--proche { border-left-color: #C2410C; }
.cousin-carte--elargie { border-left-color: #6B2FA0; }
.cousin-carte--eloignee { border-left-color: #8A8AA0; }
.drapeau { width: 20px; height: 15px; object-fit: cover; border: 1px solid rgba(0,0,0,.2); border-radius: 2px; flex: none; vertical-align: -2px; }
.cousin-carte__pays { display: flex; align-items: center; gap: 5px; font-size: .6875rem; font-weight: 600; color: #4B1F78; }
.cousin-carte__nom { font-size: .8125rem; font-weight: 600; color: #1D1D2B; white-space: normal; overflow-wrap: anywhere; }
.cousin-carte__info { font-size: .6875rem; color: #55556A; white-space: normal; overflow-wrap: anywhere; }
.cousin-pile__plus { align-self: center; font: inherit; font-size: .75rem; padding: 2px 10px; border-radius: 999px; border: 1px solid #D8CCE6; background: #fff; cursor: pointer; color: #4B1F78; }
.puce-filtre { display: inline-flex; align-items: center; gap: .375rem; min-height: 2rem; padding: 0 .75rem; border-radius: 999px; border: 1px solid var(--trait); background: var(--blanc); cursor: pointer; font-size: .8125rem; }
.puce-filtre[aria-pressed="true"] { background: var(--mauve); border-color: var(--mauve-f); color: var(--mauve-f); font-weight: 600; }

/* === Anniversaires === */
.mois { margin: 0 0 1.5rem; }
.mois h3 { margin: 0 0 .5rem; font-size: .875rem; color: var(--gris); }
.anniv { display: flex; align-items: center; gap: .875rem; padding: .625rem .75rem; border: 1px solid #EEEEF2; border-radius: var(--r-l); background: var(--blanc); margin-bottom: .5rem; }
.anniv__date { flex: none; width: 3.25rem; text-align: center; border-radius: var(--r-m); padding: .25rem 0; line-height: 1.2; }
.anniv__jour { display: block; font-size: 1.125rem; font-weight: 800; }
.anniv__mois { display: block; font-size: .75rem; font-weight: 600; }
.anniv--naissance .anniv__date { background: var(--ecume); color: var(--vert-f); }
.anniv--union .anniv__date { background: var(--peche); color: var(--peche-f); }
.anniv--souvenir .anniv__date { background: var(--sable2); color: #44444F; }

/* === Fiche === */
.fiche__id { display: flex; flex-direction: column; align-items: center; gap: .375rem; text-align: center; padding-bottom: 1rem; border-bottom: 1px solid #EEEEF2; margin-bottom: 1rem; }
.fiche__nom { margin: .25rem 0 0; font-size: 1.125rem; }
.fiche__ligne { margin: 0; color: var(--gris); }
.fiche__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .375rem; margin-top: .5rem; }
.section-f { margin: 0 0 1.125rem; }
.section-f h3 { margin: 0 0 .5rem; font-size: .75rem; font-weight: 700; letter-spacing: .04em; color: var(--gris); }
.rel { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .4375rem .625rem; border-radius: var(--r-m); background: var(--sable); margin-bottom: .25rem; }
.rel__sous { color: var(--gris); font-size: .75rem; }
.union-bloc { border: 1px solid #EEEEF2; border-radius: var(--r-l); padding: .625rem; margin-bottom: .5rem; }
.union-bloc__tete { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .375rem; }
.ajouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .375rem; }
.meta { color: var(--gris); font-size: .75rem; margin: 1rem 0 0; }

/* === Assistant === */
.assistant { display: flex; flex-direction: column; min-height: 100%; }
.assistant__tete { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: .875rem 1.5rem; border-bottom: 1px solid #E6E6EC; }
.assistant__tete h1 { margin: 0; font-size: 1.125rem; }
.assistant__statut { color: var(--gris); font-size: .8125rem; }
.assistant__corps { flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0; }
.etapes { flex: 0 0 13.75rem; padding: 1.25rem .875rem; border-right: 1px solid #E6E6EC; background: #FAFAFB; }
.etapes ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .25rem; }
.etape-btn { width: 100%; display: flex; align-items: center; gap: .625rem; min-height: 2.5rem; padding: 0 .625rem; border: 0; border-radius: var(--r-m); background: transparent; color: var(--gris); font-weight: 500; text-align: left; cursor: pointer; }
.etape-btn[aria-current="step"] { background: var(--ecume); color: var(--encre); font-weight: 700; }
.etape-btn:disabled { cursor: not-allowed; }
.etape-num { width: 1.5rem; height: 1.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; background: var(--sable2); color: var(--gris); flex: none; }
.etape-btn--faite .etape-num { background: var(--vert-f); color: var(--blanc); }
.etape-btn[aria-current="step"] .etape-num { background: var(--vert); color: var(--blanc); }
.assistant__zone { flex: 999 1 32rem; min-width: 0; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
.assistant__apercu { flex: 1 1 18rem; max-width: 26rem; padding: 1.5rem; background: var(--sable); border-left: 1px solid #E6E6EC; display: flex; flex-direction: column; gap: .875rem; }
.etape-n { margin: 0 0 .125rem; color: var(--gris); font-size: .8125rem; font-weight: 600; }
.etape-titre { margin: 0; font-size: 1.25rem; }
.assistant__pied { display: flex; justify-content: space-between; gap: .75rem; padding: .875rem 1.5rem; border-top: 1px solid #E6E6EC; background: var(--blanc); position: sticky; bottom: 0; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .875rem; }
.tuile { display: flex; flex-direction: column; align-items: flex-start; gap: .375rem; padding: 1rem 1.125rem; border: 1px solid var(--trait); border-radius: var(--r-l); background: var(--blanc); text-align: left; cursor: pointer; }
.tuile:hover { border-color: var(--trait-fort); }
.tuile[aria-pressed="true"] { border: 2px solid var(--vert); background: #F6FCF9; }
.tuile:disabled { cursor: not-allowed; background: var(--sable); color: var(--gris); }
.tuile__titre { font-weight: 700; font-size: .9375rem; }
.tuile__texte { color: var(--gris); font-size: .8125rem; }
.bloc { border: 1px solid #E6E6EC; border-radius: var(--r-l); padding: 1rem 1.125rem; display: flex; flex-direction: column; gap: .75rem; }
.bloc h3 { margin: 0; font-size: .9375rem; }
.bloc--danger { border-color: #F2B8BC; }
.correspondances { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: .5rem 1rem; align-items: center; }
.recap { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .5rem; }
.recap li { display: flex; gap: .5rem; align-items: flex-start; }
.recap .ico { color: var(--vert-f); margin-top: .125rem; }
.formule { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8125rem; background: var(--sable); padding: .125rem .375rem; border-radius: var(--r-s); user-select: all; }

/* === Accueil === */
.accueil { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 2.5rem 1.5rem; background: var(--sable); text-align: center; }
.accueil h1 { margin: 0; font-size: 1.75rem; font-weight: 800; }
.accueil p { margin: 0; color: var(--gris); font-size: 1rem; max-width: 36rem; }

/* === Aide === */
.volet--aide { background: var(--citron); }
.volet--aide .volet__tete { border-bottom-color: #F1E2C2; }
.aide-onglets { display: flex; gap: .25rem; padding: 0 .75rem; border-bottom: 1px solid #F1E2C2; flex: none; }
.aide-onglet { min-height: 2.75rem; padding: 0 .625rem; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--citron-f); font-weight: 500; cursor: pointer; }
.aide-onglet[aria-selected="true"] { color: var(--encre); font-weight: 700; border-bottom-color: var(--orange); }
.volet--aide .volet__corps p, .volet--aide .volet__corps li { line-height: 1.6; }
.volet--aide h3 { margin: 1rem 0 .375rem; font-size: .875rem; }
.question { border-bottom: 1px solid #F1E2C2; }
.question > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: .5rem; min-height: 3rem; padding: 0; border: 0; background: transparent; text-align: left; font-weight: 600; cursor: pointer; }
.question > div { padding: 0 0 .875rem; }
.question p { margin: 0 0 .5rem; }

/* === Fenêtres, messages, chargement === */
.leaflet-container { isolation: isolate; }
.coche-verif { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: #16A34A; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.coche-verif .ico { width: .75rem; height: .75rem; stroke-width: 3; }
.point-verif { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: #EA580C; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); font-weight: 800; font-size: .8125rem; line-height: 1; }
.point-verif--coin { position: absolute; top: -8px; right: -8px; z-index: 2; pointer-events: none; }
.point-verif--ligne { margin-right: .375rem; vertical-align: middle; width: 1.0625rem; height: 1.0625rem; font-size: .6875rem; }
.coche-verif--coin { position: absolute; top: -8px; left: -8px; z-index: 2; pointer-events: none; }
.coche-verif--ligne { margin-right: .375rem; vertical-align: middle; width: 1.0625rem; height: 1.0625rem; }
.coche-verif--ligne .ico { width: .625rem; height: .625rem; }
.voile { position: fixed; inset: 0; z-index: 100000; background: var(--voile); display: none; align-items: center; justify-content: center; padding: 1rem; }
.voile.actif { display: flex; }
.dialogue { width: 36rem; max-width: 100%; max-height: calc(100vh - 2rem); display: flex; flex-direction: column; background: var(--blanc); border-radius: 12px; box-shadow: var(--ombre-forte); }
.dialogue--etroit { width: 26rem; }
.dialogue__tete { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; padding: 1.125rem 1.25rem .5rem 1.5rem; }
.dialogue__titre { margin: 0; font-size: 1.125rem; }
.dialogue__sous { margin: .25rem 0 0; color: var(--gris); }
.dialogue__corps { padding: .75rem 1.5rem; overflow: auto; display: flex; flex-direction: column; gap: .875rem; }
.dialogue__pied { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .5rem; padding: 1rem 1.5rem 1.25rem; }
.dialogue__pied .gauche { margin-right: auto; }
.message { position: fixed; right: 1rem; bottom: 1rem; z-index: 100002; max-width: 26rem; display: none; align-items: flex-start; gap: .625rem; padding: .75rem .875rem; border-radius: var(--r-l); box-shadow: var(--ombre-forte); }
.message.actif { display: flex; }
.message--ok { background: var(--encre); color: var(--blanc); }
.message--erreur { background: var(--flamant); color: var(--flamant-f); border: 1px solid #F2B8BC; }
.message p { margin: 0; flex: 1; }
.message button { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0; }
#loader { position: fixed; inset: 0; z-index: 100001; display: none; align-items: center; justify-content: center; background: rgba(255, 255, 255, .7); }
#loader.actif { display: flex; }
.loader__boite { display: flex; align-items: center; gap: .75rem; padding: .875rem 1.25rem; background: var(--blanc); border-radius: var(--r-l); box-shadow: var(--ombre-forte); font-weight: 600; }
.tourne { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 3px solid var(--ecume); border-top-color: var(--vert-f); animation: tourne .8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .tourne { animation-duration: 3s; } }


/* === Tablette et téléphone === */
@media (max-width: 1100px) { .vue-btn__txt { display: none; } .vue-btn { padding: 0 .625rem; } }
@media (max-width: 760px) {
  .bandeau { padding: .375rem .75rem; }
  .bandeau__version, .bandeau__sep { display: none; }
  .bandeau__arbre { display: none; }
  .btn--aide .btn__txt { display: none; }
  .btn--aide { width: 2.75rem; padding: 0; }
  .bandeau__d { width: 100%; justify-content: flex-end; flex-wrap: nowrap; }
  .recherche { flex: 1 1 auto; min-width: 0; }
  .recherche .saisie { width: 100%; }
  .onglets { padding: 0 .5rem; }
  .onglets__arbres { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
  .onglet { white-space: nowrap; }
  .page { padding: 1rem .875rem 1.5rem; }
  .etapes { flex: 1 1 100%; border-right: 0; border-bottom: 1px solid #E6E6EC; padding: .5rem; overflow-x: auto; }
  .etapes ol { flex-direction: row; }
  .etape-btn { white-space: nowrap; }
  .assistant__zone { padding: 1rem; }
  .assistant__apercu { max-width: none; border-left: 0; border-top: 1px solid #E6E6EC; }
  .correspondances { grid-template-columns: minmax(0, 1fr); gap: .25rem; }
  .correspondances .etiq { margin-top: .5rem; }
  .legende { display: none; }
  .titre-vue .badge { display: none; }
  .dialogue { max-height: calc(100vh - 1rem); }
  .voile { padding: .5rem; align-items: flex-end; }
  .message { left: .5rem; right: .5rem; max-width: none; }
}
@media (pointer: coarse) {
  .btn, .saisie { min-height: 2.75rem; }
  .btn--ico { width: 2.75rem; }
  .plus { width: 2.25rem; height: 2.25rem; right: -12px; bottom: -12px; }
  .vue-btn { min-height: 2.5rem; }

}

/** Journalisation. Niveaux admis : 'ERROR', 'WARNING', 'INFO'. */
function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERROR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'WARNING') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('WARNING', 'Voile de chargement masqué automatiquement après 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Chargement…'; }
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight force un recalcul avant de retirer la classe. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('WARNING', quoi, e); });

  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';

  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if ((up.indexOf('LIBRARY') !== -1 || up.indexOf('BIBLIOTHEQUE') !== -1) && brut.charAt(brut.length - 1) === '_') { return true; }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

  var pris = Object.keys(etat.meta.tables).map(function (x) { return x.toUpperCase(); });
  var id = base;
  var n = 2;
  while (pris.indexOf(id.toUpperCase()) !== -1) { id = base + n; n++; }
  return id;
}

async function poserFormules(tid, colonnes) {
  for (var i = 0; i < colonnes.length; i++) {
    var col = colonnes[i];
    if (!col.formula) { continue; }
    try {
      if (col.calculee) {
        await agir([['ModifyColumn', tid, col.id, { isFormula: true, formula: col.formula }]]);
      } else {
        await agir([['ModifyColumn', tid, col.id, { isFormula: false, formula: col.formula,
          recalcWhen: col.recalcWhen === undefined ? 0 : col.recalcWhen, recalcDeps: null }]]);
      }
    } catch (e) {
      logSecurite('INFO', 'Formule non posée sur ' + col.id, e);
    }
  }
}

async function poserChoix(tid, colonnes) {
  for (var i = 0; i < colonnes.length; i++) {
    var c = colonnes[i];
    if (!c.choix) { continue; }
    try {
      await agir([['ModifyColumn', tid, c.id, { widgetOptions: JSON.stringify({ choices: c.choix }) }]]);
    } catch (e) { logSecurite('WARNING', 'Choix non posés sur ' + c.id, e); }
  }
}

/* Création : tables en un seul appel (identifiant, type, libellé), pages
   créées avec elles supprimées aussitôt, puis formules et listes de choix,
   puis libellés des tables. Les identifiants réels sont relus. */
async function creerTables(defs) {
  var ret = await agir(defs.map(function (d) {
    return ['AddTable', d.id, d.colonnes.map(function (c) { return { id: c.id, type: typeAvecFuseau(c.type), label: c.label || c.id }; })];
  }));
  var rv = ret && ret.retValues ? ret.retValues : [];
  var tids = defs.map(function (d, i) { return rv[i] && rv[i].table_id ? rv[i].table_id : d.id; });
  await chargerMeta();
  var vues = [];
  tids.forEach(function (t) { var m = etat.meta.tables[t]; if (m && m.primaryViewId) { vues.push(m.primaryViewId); } });
  if (vues.length) {
    try { await agir(vues.map(function (v) { return ['RemoveRecord', '_grist_Views', v]; })); }
    catch (e) { logSecurite('INFO', 'Pages créées automatiquement non supprimées', e); }
  }
  for (var i = 0; i < defs.length; i++) {
    await poserFormules(tids[i], defs[i].colonnes);
    await poserChoix(tids[i], defs[i].colonnes);
  }
  await chargerMeta();
  for (var k = 0; k < defs.length; k++) {
    var m = etat.meta.tables[tids[k]];
    if (m && m.rawViewSectionRef && defs[k].libelle) {
      try { await agir([['UpdateRecord', '_grist_Views_section', m.rawViewSectionRef, { title: defs[k].libelle }]]); }
      catch (e2) { logSecurite('WARNING', 'Table non renommée : ' + tids[k], e2); }
    }
  }
  await chargerMeta();
  /* Le renommage peut changer l'identifiant : il est relu. */
  return defs.map(function (d, i) { return trouverTableModele(d.id) || tids[i]; });
}

/* Ajout d'une colonne en deux temps : créée nue, puis typée. */
async function ajouterColonne(tid, colId, type, label, choix) {
  var ret = await agir([['AddColumn', tid, colId, {}]]);
  var reel = colId;
  if (ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId) { reel = ret.retValues[0].colId; }
  var propr = { type: typeAvecFuseau(type), label: label || reel, isFormula: false };
  if (choix) { propr.widgetOptions = JSON.stringify({ choices: choix }); }
  await agir([['ModifyColumn', tid, reel, propr]]);
  return reel;
}

/* Colonne d'affichage d'une référence : la formule d'affichage rend les
   tables brutes lisibles (« Marc Moreau » au lieu de PERSONNES[3]). */
async function poserAffichageRef(tid, colRef, tidCible, colAff) {
  try {
    await chargerMeta();
    var src = infoColonne(tid, colRef);
    var aff = infoColonne(tidCible, colAff);
    if (!src || !aff) { return; }
    await agir([['ModifyColumn', tid, colRef, { visibleCol: aff.ref }], ['SetDisplayFormula', tid, null, src.ref, '$' + colRef + '.' + colAff]]);
  } catch (e) {
    logSecurite('INFO', 'Colonne d’affichage non posée sur ' + colRef, e);
  }
}

/* === SECTION : BIBLIOTHÈQUE D'ARBRES === */
async function reparerSchemaBiblio() {
  for (var k = 0; k < COLONNES_BIBLIO.length; k++) {
    var col = COLONNES_BIBLIO[k];
    if (infoColonne(etat.biblio, col.id)) { continue; }
    try { await ajouterColonne(etat.biblio, col.id, col.type, col.label); } catch (e) { logSecurite('INFO', 'Colonne ' + col.id + ' non ajoutée', e); }
  }
}

async function assurerBibliotheque() {
  await chargerMeta();
  var trouvee = trouverTableModele(ID_BIBLIO);
  if (trouvee) { etat.biblio = trouvee; await reparerSchemaBiblio(); return etat.biblio; }
  etat.biblio = (await creerTables([{ id: ID_BIBLIO, libelle: LABEL_BIBLIO, colonnes: COLONNES_BIBLIO }]))[0];
  return etat.biblio;
}

/* Lecture des arbres et des lignes témoins. Une ligne témoin illisible
   (règle d'accès) alors que les témoins ont été posés masque les commandes. */
async function lireBibliotheque() {
  etat.arbres = [];
  etat.lignesBiblio = {};
  if (!etat.biblio) { return; }
  var d = await lireTable(etat.biblio);
  var cles = {};
  var arbres = [];
  var lieux = {};
  for (var i = 0; i < (d.id || []).length; i++) {
    var cle = String(valeurCellule(d.CLE ? d.CLE[i] : '') || '');
    cles[cle] = d.id[i];
    if (cle.indexOf('LIEU:') === 0) {
      try { lieux[cle.slice(5)] = JSON.parse(valeurCellule(d.VALEUR[i]) || '{}'); } catch (e3) { logSecurite('INFO', 'Lieu illisible : ' + cle, e3); }
      continue;
    }
    if (cle.indexOf('ARBRE:') !== 0) { continue; }
    try {
      var cfg = JSON.parse(valeurCellule(d.VALEUR[i]) || '{}');
      cfg.cle = cle;
      cfg.ligne = d.id[i];
      arbres.push(cfg);
    } catch (e) { logSecurite('WARNING', 'Configuration illisible : ' + cle, e); }
  }
  arbres.sort(function (a, b) { return (a.cree || 0) - (b.cree || 0); });
  etat.arbres = arbres;
  etat.lignesBiblio = cles;
  Object.keys(lieux).forEach(function (k) { etat.lieux[k] = lieux[k]; });
  if (cles[CLE_TEMOINS]) {
    etat.peutModifier = !!cles[CLE_EDITION];
    etat.peutParametrer = !!cles[CLE_PARAM] && etat.peutModifier;
  }
}

async function poserTemoins() {
  var manquants = [CLE_TEMOINS, CLE_EDITION, CLE_PARAM].filter(function (c) { return !etat.lignesBiblio[c]; });
  if (!manquants.length || etat.lignesBiblio[CLE_TEMOINS]) { return; }
  try {
    await agir(manquants.map(function (c) { return ['AddRecord', etat.biblio, null, { CLE: c, VALEUR: '', VERSION: VERSION }]; }));
  } catch (e) { logSecurite('INFO', 'Lignes témoins non posées', e); }
}

async function ecrireConfig(cfg) {
  var copie = JSON.parse(JSON.stringify(cfg));
  delete copie.cle; delete copie.ligne;
  var valeur = JSON.stringify(copie);
  if (cfg.ligne) {
    await agir([['UpdateRecord', etat.biblio, cfg.ligne, { VALEUR: valeur, VERSION: VERSION }]]);
  } else {
    var r = await agir([['AddRecord', etat.biblio, null, { CLE: cfg.cle, VALEUR: valeur, VERSION: VERSION }]]);
    cfg.ligne = r && r.retValues ? r.retValues[0] : null;
  }
}

function cleStockage() { return 'gristfamily:' + (etat.nomDoc || 'doc'); }
function lireArbreMemorise() { try { return window.localStorage.getItem(cleStockage()); } catch (e) { return null; } }
function memoriserArbre(cle) { try { window.localStorage.setItem(cleStockage(), cle); } catch (e) { logSecurite('INFO', 'Mémorisation impossible', e); } }

/* === SECTION : CONFIGURATION D'UN ARBRE === */
function idsParDefaut(champs) {
  var o = {};
  champs.forEach(function (c) { o[c.cle] = c.id; });
  return o;
}

function affichageParDefaut() {
  return { ascendants: 3, descendants: 3, fratrie: true, tout: true, couleur: 'branche',
    carte: { photo: true, annees: true, lieu: false, nomNaissance: true, profession: false, sexeCouleur: true },
    souvenirs: false, unionsAnniv: true, cousins: false };
}

function completerConfig(cfg) {
  cfg.tables = cfg.tables || {};
  cfg.cols = cfg.cols || idsParDefaut(CHAMPS_PERS);
  /* Deux façons de relier les personnes : « colonnes » (une seule table,
     colonnes PARENT 1, PARENT 2, CONJOINTS) ou « unions » (table des
     unions, pour noter mariages et dates). Les arbres créés avant ce
     choix sont en « unions ». */
  cfg.liens = cfg.liens || 'unions';
  if (cfg.liens === 'unions' && !cfg.cols.parents) { cfg.cols.parents = COL_PARENTS.id; }
  cfg.colsUnions = cfg.colsUnions || idsParDefaut(CHAMPS_UNIONS);
  cfg.colsCousins = cfg.colsCousins || idsParDefaut(CHAMPS_COUSINS);
  var def = affichageParDefaut();
  cfg.affichage = cfg.affichage || {};
  Object.keys(def).forEach(function (k) { if (cfg.affichage[k] === undefined) { cfg.affichage[k] = def[k]; } });
  Object.keys(def.carte).forEach(function (k) { if (cfg.affichage.carte[k] === undefined) { cfg.affichage.carte[k] = def.carte[k]; } });
  return cfg;
}

/* Les identifiants de tables sont relus à chaque chargement : un
   renommage dans le document ne casse pas l'arbre. */
function verifierTablesConfig(cfg) {
  ['pers', 'unions', 'cousins'].forEach(function (k) {
    var tid = cfg.tables[k];
    if (!tid || (etat.meta && etat.meta.tables[tid])) { return; }
    var base = k === 'pers' ? ID_PERS : (k === 'unions' ? ID_UNIONS : ID_COUSINS);
    var relu = tid.toUpperCase().replace(/_+$/, '') === base.replace(/_+$/, '') ? trouverTableModele(base) : null;
    cfg.tables[k] = relu || null;
  });
  return !!(cfg.tables.pers && (cfg.liens === 'colonnes' || cfg.tables.unions));
}

function modeColonnes() { return !!(etat.config && etat.config.liens === 'colonnes'); }
function idsRefListe(v) { v = valeurCellule(v); if (Array.isArray(v) && v[0] === 'L') { return v.slice(1).filter(function (x) { return typeof x === 'number' && x > 0; }); } return typeof v === 'number' && v > 0 ? [v] : []; }

/* Mode « colonnes » : les unions n'existent pas en table, elles sont
   reconstituées en mémoire à partir des parents et des conjoints. */
function unionVirtuelle(d, a, b) {
  var x = Math.min(a || 0, b || 0);
  var y = Math.max(a || 0, b || 0);
  if (!x && y) { x = y; y = 0; }
  var cle = x + '-' + y;
  if (d.cleUnion[cle]) { return d.cleUnion[cle]; }
  d.prochainId = (d.prochainId || 0) + 1;
  var id = d.prochainId;
  d.cleUnion[cle] = id;
  d.U[id] = { id: id, a: x, b: y, type: '', debut: null, fin: null, separes: false, notes: '', virtuelle: true };
  [x, y].forEach(function (z) { if (z) { (d.unionsDe[z] = d.unionsDe[z] || []).push(id); } });
  return id;
}

/* === SECTION : LECTURE DES DONNÉES === */
function idRef(v) { v = valeurCellule(v); return typeof v === 'number' && v > 0 ? v : 0; }
function idsPJ(v) { v = valeurCellule(v); return Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(function (x) { return typeof x === 'number'; }) : []; }
function texteCellule(v) { v = valeurCellule(v); return v === null || v === undefined ? '' : String(v); }
function nombreCellule(v) { v = valeurCellule(v); return typeof v === 'number' && isFinite(v) ? v : null; }

async function chargerDonnees() {
  var cfg = etat.config;
  var dp = await lireTable(cfg.tables.pers);
  var colonnes = cfg.liens === 'colonnes';
  var du = colonnes ? {} : await lireTable(cfg.tables.unions);
  var dc = null;
  if (cfg.affichage.cousins && cfg.tables.cousins && etat.meta.tables[cfg.tables.cousins]) {
    try { dc = await lireTable(cfg.tables.cousins); } catch (e) { logSecurite('WARNING', 'Cousins ADN illisibles', e); }
  }
  var empreinte = JSON.stringify([dp, du, dc]);
  if (empreinte === etat.empreinte && etat.donnees) { return false; }
  etat.empreinte = empreinte;
  var cols = cfg.cols;
  var cu = cfg.colsUnions;
  var P = {};
  var ordre = [];
  var col = function (d, c, i) { return c && d[c] ? d[c][i] : undefined; };
  for (var i = 0; i < (dp.id || []).length; i++) {
    var id = dp.id[i];
    var p = { id: id };
    CHAMPS_PERS.forEach(function (ch) {
      var v = col(dp, cols[ch.cle], i);
      if (ch.genre === 'date') { p[ch.cle] = lireDate(valeurCellule(v)); }
      else if (ch.genre === 'oui') { p[ch.cle] = valeurCellule(v) === true; }
      else if (ch.genre === 'pj') { p[ch.cle] = idsPJ(v); }
      else { p[ch.cle] = texteCellule(v).trim(); }
    });
    if (colonnes) {
      p.p1 = idRef(col(dp, cols.parent1, i));
      p.p2 = idRef(col(dp, cols.parent2, i));
      p.conjoints = idsRefListe(col(dp, cols.conjoints, i));
      p.parents = 0;
    } else {
      p.parents = idRef(col(dp, cols.parents, i));
    }
    p.creeLe = nombreCellule(col(dp, 'CREE_LE', i));
    p.creePar = texteCellule(col(dp, 'CREE_PAR', i));
    p.modifieLe = nombreCellule(col(dp, 'MODIFIE_LE', i));
    p.modifiePar = texteCellule(col(dp, 'MODIFIE_PAR', i));
    P[id] = p;
    ordre.push(id);
  }
  var U = {};
  for (var j = 0; j < (du.id || []).length; j++) {
    var u = { id: du.id[j], a: idRef(col(du, cu.a, j)), b: idRef(col(du, cu.b, j)), type: texteCellule(col(du, cu.type, j)),
      debut: lireDate(valeurCellule(col(du, cu.debut, j))), fin: lireDate(valeurCellule(col(du, cu.fin, j))),
      separes: valeurCellule(col(du, cu.separes, j)) === true, notes: texteCellule(col(du, cu.notes, j)) };
    if (u.a && !P[u.a]) { u.a = 0; }
    if (u.b && !P[u.b]) { u.b = 0; }
    if (!u.a && u.b) { u.a = u.b; u.b = 0; u.inverse = true; }
    U[u.id] = u;
  }
  var unionsDe = {};
  var enfantsDe = {};
  if (colonnes) {
    var dv = { U: U, unionsDe: unionsDe, cleUnion: {}, prochainId: 0 };
    ordre.forEach(function (pid) {
      var pp = P[pid];
      var a1 = P[pp.p1] ? pp.p1 : 0;
      var a2 = P[pp.p2] && pp.p2 !== a1 ? pp.p2 : 0;
      if (a1 || a2) { pp.parents = unionVirtuelle(dv, a1, a2); }
    });
    ordre.forEach(function (pid) {
      P[pid].conjoints.forEach(function (c) { if (P[c] && c !== pid) { unionVirtuelle(dv, pid, c); } });
    });
    etat.cleUnion = dv.cleUnion;
    etat.prochainUnion = dv.prochainId;
    unionsDe = {};
  }
  Object.keys(U).forEach(function (k) {
    var un = U[k];
    [un.a, un.b].forEach(function (x) { if (x) { (unionsDe[x] = unionsDe[x] || []).push(un.id); } });
  });
  ordre.forEach(function (pid) {
    var pp = P[pid];
    if (pp.parents && !U[pp.parents]) { pp.parents = 0; }
    if (pp.parents) { (enfantsDe[pp.parents] = enfantsDe[pp.parents] || []).push(pid); }
  });
  Object.keys(enfantsDe).forEach(function (k) { enfantsDe[k].sort(comparerNaissance); });
  Object.keys(unionsDe).forEach(function (k) { unionsDe[k].sort(function (x, y) { return comparerDates(U[x].debut, U[y].debut) || x - y; }); });
  var C = [];
  if (dc) {
    var cc = cfg.colsCousins;
    for (var k2 = 0; k2 < (dc.id || []).length; k2++) {
      var co = { id: dc.id[k2] };
      CHAMPS_COUSINS.forEach(function (ch) {
        var v = col(dc, cc[ch.cle], k2);
        if (ch.type === 'Numeric' || ch.type === 'Int') { co[ch.cle] = nombreCellule(v); }
        else if (ch.type === 'Bool') { co[ch.cle] = valeurCellule(v) === true; }
        else if (ch.type === 'REF_PERS') { co[ch.cle] = idRef(v); }
        else { co[ch.cle] = texteCellule(v).trim(); }
      });
      C.push(co);
    }
  }
  etat.donnees = { P: P, U: U, ordre: ordre, unionsDe: unionsDe, enfantsDe: enfantsDe, cousins: C };
  return true;
}

function comparerDates(d1, d2) {
  if (!d1 && !d2) { return 0; }
  if (!d1) { return 1; }
  if (!d2) { return -1; }
  return (d1.a - d2.a) || ((d1.m || 0) - (d2.m || 0)) || ((d1.j || 0) - (d2.j || 0));
}

function comparerNaissance(x, y) {
  var P = etat.donnees ? etat.donnees.P : {};
  return comparerDates(P[x] && P[x].naissance, P[y] && P[y].naissance) || x - y;
}

/* === SECTION : LIENS DE PARENTÉ === */
function pers(id) { return etat.donnees && id ? etat.donnees.P[id] || null : null; }
function unionDe(id) { return etat.donnees && id ? etat.donnees.U[id] || null : null; }
function nomComplet(p) { if (!p) { return ''; } var s = (p.prenom + ' ' + p.nom).trim(); return s || 'Sans nom'; }
function initiales(p) {
  var a = (p.prenom || '').trim().charAt(0);
  var b = (p.nom || '').trim().charAt(0);
  var s = (a + b).toUpperCase();
  return s || '?';
}
function estDecede(p) { return !!(p && (p.decede || p.deces)); }
function accord(p, masc, fem, neutre) { return p && p.sexe === 'Femme' ? fem : (p && p.sexe === 'Homme' ? masc : neutre); }

function parentsDe(pid) {
  var p = pers(pid);
  var u = p ? unionDe(p.parents) : null;
  if (!u) { return []; }
  return [u.a, u.b].filter(function (x) { return x && pers(x); });
}

function enfantsUnion(uid) { return (etat.donnees.enfantsDe[uid] || []).slice(); }
function unionsPersonne(pid) { return (etat.donnees.unionsDe[pid] || []).slice(); }
function conjointDans(uid, pid) { var u = unionDe(uid); if (!u) { return 0; } return u.a === pid ? u.b : (u.b === pid ? u.a : 0); }

function fratrieDe(pid) {
  var p = pers(pid);
  if (!p || !p.parents) { return { pleins: [], demi: [] }; }
  var pleins = enfantsUnion(p.parents).filter(function (x) { return x !== pid; });
  var demi = [];
  parentsDe(pid).forEach(function (par) {
    unionsPersonne(par).forEach(function (uid) {
      if (uid === p.parents) { return; }
      enfantsUnion(uid).forEach(function (e) { if (e !== pid && demi.indexOf(e) === -1 && pleins.indexOf(e) === -1) { demi.push(e); } });
    });
  });
  demi.sort(comparerNaissance);
  return { pleins: pleins, demi: demi };
}

function tousEnfants(pid) {
  var l = [];
  unionsPersonne(pid).forEach(function (uid) { enfantsUnion(uid).forEach(function (e) { if (l.indexOf(e) === -1) { l.push(e); } }); });
  return l;
}

/* Personne au centre : celle choisie pour la session, sinon celle de la
   configuration, sinon la première personne. */
function idCentre() {
  var d = etat.donnees;
  if (!d || !d.ordre.length) { return 0; }
  if (etat.centreSession && d.P[etat.centreSession]) { return etat.centreSession; }
  if (etat.config.centre && d.P[etat.config.centre]) { return etat.config.centre; }
  return d.ordre[0];
}

/* Branche et génération de chaque personne par rapport au centre. Les
   branches portent le prénom du parent (jamais le sexe). */
function calculerBranches(centre) {
  var res = {};
  if (!centre) { return { parId: res, noms: {} }; }
  res[centre] = { branche: 'centre', gen: 0 };
  var par = parentsDe(centre);
  var noms = {};
  var monter = function (pid, branche, gen) {
    var file = [[pid, gen]];
    while (file.length) {
      var x = file.shift();
      if (res[x[0]]) { continue; }
      res[x[0]] = { branche: branche, gen: x[1] };
      parentsDe(x[0]).forEach(function (q) { file.push([q, x[1] - 1]); });
    }
  };
  if (par[0]) { noms.a = 'Côté ' + (pers(par[0]).prenom || nomComplet(pers(par[0]))); monter(par[0], 'a', -1); }
  if (par[1]) { noms.b = 'Côté ' + (pers(par[1]).prenom || nomComplet(pers(par[1]))); monter(par[1], 'b', -1); }
  var fr = fratrieDe(centre);
  fr.pleins.concat(fr.demi).forEach(function (s) { if (!res[s]) { res[s] = { branche: 'fratrie', gen: 0 }; } });
  var file = [[centre, 0]];
  var vus = {};
  while (file.length) {
    var x = file.shift();
    if (vus[x[0]]) { continue; }
    vus[x[0]] = true;
    unionsPersonne(x[0]).forEach(function (uid) {
      var cj = conjointDans(uid, x[0]);
      if (cj && !res[cj]) { res[cj] = { branche: 'allie', gen: x[1] }; }
      enfantsUnion(uid).forEach(function (e) {
        if (!res[e]) { res[e] = { branche: 'desc', gen: x[1] + 1 }; }
        file.push([e, x[1] + 1]);
      });
    });
  }
  /* Collatéraux : descendants de chaque ancêtre qui ne sont pas encore
     placés (oncles, tantes, neveux, cousins), en partant des plus proches. */
  var ancetres = Object.keys(res).map(Number).filter(function (k) { return res[k].gen < 0 && (res[k].branche === 'a' || res[k].branche === 'b'); });
  ancetres.sort(function (x, y) { return res[y].gen - res[x].gen; });
  ancetres.forEach(function (an) {
    var haut = -res[an].gen;
    var fc = [[an, 0]];
    var vusC = {};
    while (fc.length) {
      var y = fc.shift();
      if (vusC[y[0]]) { continue; }
      vusC[y[0]] = true;
      unionsPersonne(y[0]).forEach(function (uid) {
        enfantsUnion(uid).forEach(function (e) {
          if (res[e]) { if (res[e].branche === 'fratrie' && haut === 1) { fc.push([e, y[1] + 1]); } return; }
          res[e] = { branche: haut === 1 ? 'fratrie' : res[an].branche, gen: y[1] + 1 - haut, coll: { haut: haut, bas: y[1] + 1 } };
          fc.push([e, y[1] + 1]);
        });
      });
    }
  });
  Object.keys(res).forEach(function (k) {
    if (!res[k].coll && ['fratrie', 'a', 'b'].indexOf(res[k].branche) === -1) { return; }
    unionsPersonne(+k).forEach(function (uid) {
      var cj = conjointDans(uid, +k);
      if (cj && !res[cj]) { res[cj] = { branche: 'allie', gen: res[k].gen }; }
    });
  });
  /* Belle-famille : parents des conjoints. */
  Object.keys(res).forEach(function (k) {
    var info = res[k];
    if (info.branche !== 'allie' || info.parentDe) { return; }
    parentsDe(+k).forEach(function (q) { if (!res[q]) { res[q] = { branche: 'allie', gen: info.gen - 1, parentDe: +k }; } });
  });
  return { parId: res, noms: noms };
}

function libelleBranche(b, noms) {
  if (b === 'a') { return noms.a || 'Premier parent'; }
  if (b === 'b') { return noms.b || 'Second parent'; }
  if (b === 'centre') { return 'Personne au centre'; }
  if (b === 'fratrie') { return 'Frères et sœurs'; }
  if (b === 'desc') { return 'Descendants'; }
  if (b === 'allie') { return 'Conjoints et belle-famille'; }
  return 'Non reliée';
}

/* Lien de parenté avec la personne au centre, en mots. */
function libelleParente(pid, br, centre) {
  var info = br.parId[pid];
  var p = pers(pid);
  if (!info || !p) { return ''; }
  var g = info.gen;
  var prefixe = function (n) { var s = ''; for (var i = 0; i < n; i++) { s += 'Arrière-'; } return s; };
  if (info.branche === 'centre') { return 'Personne au centre'; }
  if (info.coll) { return libelleCollateral(p, info.coll.haut, info.coll.bas); }
  if (info.branche === 'a' || info.branche === 'b') {
    if (g === -1) { return accord(p, 'Père', 'Mère', 'Parent'); }
    if (g >= -5) { var pr = prefixe(-g - 2); return pr + (pr ? accord(p, 'grand-père', 'grand-mère', 'grand-parent') : accord(p, 'Grand-père', 'Grand-mère', 'Grand-parent')); }
    return 'Ancêtre, ' + (-g) + 'e génération';
  }
  if (info.branche === 'fratrie') {
    var demi = fratrieDe(centre).demi.indexOf(pid) !== -1;
    return demi ? accord(p, 'Demi-frère', 'Demi-sœur', 'Demi-frère ou demi-sœur') : accord(p, 'Frère', 'Sœur', 'Frère ou sœur');
  }
  if (info.branche === 'desc') {
    if (g === 1) { return accord(p, 'Fils', 'Fille', 'Enfant'); }
    if (g <= 5) { var pd = prefixe(g - 2); return pd + (pd ? accord(p, 'petit-fils', 'petite-fille', 'petit-enfant') : accord(p, 'Petit-fils', 'Petite-fille', 'Petit-enfant')); }
    return 'Descendant, ' + g + 'e génération';
  }
  if (info.branche === 'allie' && info.parentDe) {
    return accord(p, 'Père', 'Mère', 'Parent') + ' de ' + (pers(info.parentDe).prenom || nomComplet(pers(info.parentDe)));
  }
  if (info.branche === 'allie') {
    var avec = unionsPersonne(pid).map(function (uid) { return conjointDans(uid, pid); }).filter(function (x) { return x && br.parId[x] && br.parId[x].branche !== 'allie'; })[0];
    if (avec === centre) { return accord(p, 'Conjoint', 'Conjointe', 'Conjoint'); }
    return avec ? accord(p, 'Conjoint', 'Conjointe', 'Conjoint') + ' de ' + (pers(avec).prenom || nomComplet(pers(avec))) : accord(p, 'Conjoint', 'Conjointe', 'Conjoint');
  }
  return '';
}

/* Parenté par un ancêtre commun : haut = générations entre la personne au
   centre et cet ancêtre, bas = générations entre l'ancêtre et la personne. */
function libelleCollateral(p, haut, bas) {
  var arr = function (n) { var s = ''; for (var i = 0; i < n; i++) { s += 'Arrière-'; } return s; };
  var maj = function (pr, mot) { return pr ? pr + mot : mot.charAt(0).toUpperCase() + mot.slice(1); };
  if (haut === 1) {
    if (bas === 1) { return accord(p, 'Demi-frère', 'Demi-sœur', 'Demi-frère ou demi-sœur'); }
    if (bas === 2) { return accord(p, 'Neveu', 'Nièce', 'Neveu ou nièce'); }
    return maj(arr(bas - 3), accord(p, 'petit-neveu', 'petite-nièce', 'petit-neveu ou petite-nièce'));
  }
  if (bas === 1) {
    if (haut === 2) { return accord(p, 'Oncle', 'Tante', 'Oncle ou tante'); }
    return maj(arr(haut - 3), accord(p, 'grand-oncle', 'grand-tante', 'grand-oncle ou grand-tante'));
  }
  if (haut === 2 && bas === 2) { return accord(p, 'Cousin germain', 'Cousine germaine', 'Cousin germain'); }
  if (haut === 3 && bas === 3) { return accord(p, 'Cousin issu de germain', 'Cousine issue de germain', 'Cousin issu de germain'); }
  if (haut === 2 && bas === 3) { return accord(p, 'Petit-cousin', 'Petite-cousine', 'Petit-cousin'); }
  return accord(p, 'Cousin éloigné', 'Cousine éloignée', 'Cousin éloigné');
}

function classeBranche(b) {
  return { a: 'br-a', b: 'br-b', centre: 'br-centre', fratrie: 'br-centre', desc: 'br-desc', allie: 'br-allie' }[b] || 'br-aucune';
}

function libelleGeneration(g) {
  if (g === null || g === undefined) { return ''; }
  if (g === 0) { return 'Même génération'; }
  var hauts = { '-1': 'Parents', '-2': 'Grands-parents', '-3': 'Arrière-grands-parents' };
  var bas = { '1': 'Enfants', '2': 'Petits-enfants', '3': 'Arrière-petits-enfants' };
  if (g < 0) { return hauts[String(g)] || 'Ancêtres, ' + (-g) + 'e génération'; }
  return bas[String(g)] || 'Descendants, ' + g + 'e génération';
}

function classeCouleur(p, br) {
  var mode = etat.config.affichage.couleur;
  if (mode === 'aucune') { return 'br-aucune'; }
  var info = br.parId[p.id];
  if (mode === 'generation') { return info ? 'gen-' + (Math.abs(info.gen) % 6) : 'br-aucune'; }
  return classeBranche(info ? info.branche : '');
}

/* Ligne d'information d'une carte : années, lieu ou profession. */
function infoCarte(p) {
  var a = etat.config.affichage.carte;
  var morceaux = [];
  if (a.annees) {
    var n = anneeAffichee(p.naissance, p.naissanceApprox);
    var d = anneeAffichee(p.deces, p.decesApprox);
    if (n && d) { morceaux.push(n + ' - ' + d); }
    else if (n) { morceaux.push(estDecede(p) ? n + ' - ?' : n); }
    else if (d) { morceaux.push('? - ' + d); }
    else if (estDecede(p)) { morceaux.push(accord(p, 'décédé', 'décédée', 'décès')); }
    var ag = texteAge(p);
    if (ag && morceaux.length) { morceaux[morceaux.length - 1] += ' (' + ag + ')'; }
  }
  if (a.lieu && p.naissanceLieu) { morceaux.push(p.naissanceLieu); }
  if (a.profession && p.profession) { morceaux.push(p.profession); }
  return morceaux.join(' · ');
}

/* Estimation de la parenté d'après l'ADN partagé (moyennes publiées par
   le Shared cM Project) : affichée comme estimation, jamais enregistrée. */
function estimerParente(cm) {
  if (cm === null || cm === undefined || isNaN(cm) || cm <= 0) { return ''; }
  if (cm >= 2300) { return 'Parent, enfant, frère ou sœur'; }
  if (cm >= 1300) { return 'Grand-parent, oncle, tante, demi-frère ou demi-sœur'; }
  if (cm >= 550) { return 'Cousin germain'; }
  if (cm >= 200) { return 'Cousin au 2e degré'; }
  if (cm >= 75) { return 'Cousin au 3e degré'; }
  if (cm >= 35) { return 'Cousin au 4e degré'; }
  return 'Cousin éloigné (5e degré ou plus)';
}

/* === SECTION : ÉCRITURES === */
function infoChampPers(cle) {
  for (var i = 0; i < CHAMPS_PERS.length; i++) { if (CHAMPS_PERS[i].cle === cle) { return CHAMPS_PERS[i]; } }
  return null;
}

function colonnePersEstDate(cle) {
  var c = infoColonne(etat.config.tables.pers, etat.config.cols[cle]);
  return !!(c && /^Date/.test(c.type));
}

/* Valeurs d'un formulaire (clés du modèle) vers les colonnes de la table. */
function versColonnesPers(v) {
  var cols = etat.config.cols;
  var o = {};
  Object.keys(v).forEach(function (cle) {
    if (cle === 'parents' && modeColonnes()) {
      var uv = unionDe(v.parents);
      var e1 = cols.parent1 && infoColonne(etat.config.tables.pers, cols.parent1);
      var e2 = cols.parent2 && infoColonne(etat.config.tables.pers, cols.parent2);
      if (e1) { o[cols.parent1] = uv ? uv.a || 0 : 0; }
      if (e2) { o[cols.parent2] = uv ? uv.b || 0 : 0; }
      return;
    }
    var colId = cle === 'parents' ? cols.parents : cols[cle];
    if (!colId || !infoColonne(etat.config.tables.pers, colId)) { return; }
    var ch = infoChampPers(cle);
    var val = v[cle];
    if (ch && ch.genre === 'date') {
      val = colonnePersEstDate(cle) ? dateVersSecondes(val) : dateVersTexteStocke(val);
    } else if (ch && ch.genre === 'pj') {
      val = ['L'].concat(val || []);
    }
    o[colId] = val;
  });
  return o;
}

function versColonnesUnion(v) {
  var cu = etat.config.colsUnions;
  var o = {};
  Object.keys(v).forEach(function (cle) {
    if (!cu[cle]) { return; }
    var val = v[cle];
    if (cle === 'debut' || cle === 'fin') { val = dateVersTexteStocke(val); }
    o[cu[cle]] = val;
  });
  return o;
}

/* Personne déjà présente dans la table (même prénom et même nom, sans
   tenir compte des accents ni des majuscules) : jamais de doublon au centre. */
async function personneExistante(tid, cols, v) {
  try {
    var d = await lireTable(tid);
    var ids = d.id || [];
    var cp = d[cols.prenom] || [], cn = d[cols.nom] || [];
    for (var i = 0; i < ids.length; i++) {
      if (normaliser(cp[i]) === normaliser(v.prenom) && normaliser(cn[i]) === normaliser(v.nom)) { return ids[i]; }
    }
  } catch (e) { logSecurite('INFO', 'Recherche de la personne au centre impossible', e); }
  return 0;
}

async function ajouterPersonne(v) {
  var r = await agir([['AddRecord', etat.config.tables.pers, null, versColonnesPers(v)]]);
  return r && r.retValues ? r.retValues[0] : null;
}

async function modifierPersonne(id, v) {
  await agir([['UpdateRecord', etat.config.tables.pers, id, versColonnesPers(v)]]);
}

/* Mode « colonnes » : une union avec deux personnes s'écrit dans la
   colonne CONJOINTS ; une union sans conjoint n'existe qu'en mémoire,
   le temps de rattacher un enfant. */
async function ajouterUnion(v) {
  if (modeColonnes()) {
    var d = etat.donnees;
    var dv = { U: d.U, unionsDe: d.unionsDe, cleUnion: etat.cleUnion || {}, prochainId: etat.prochainUnion || 0 };
    var id = unionVirtuelle(dv, v.a || 0, v.b || 0);
    etat.cleUnion = dv.cleUnion; etat.prochainUnion = dv.prochainId;
    if (v.a && v.b) { await lierConjoints(v.a, v.b, true); }
    return id;
  }
  var r = await agir([['AddRecord', etat.config.tables.unions, null, versColonnesUnion(v)]]);
  return r && r.retValues ? r.retValues[0] : null;
}

async function lierConjoints(a, b, lier) {
  var cid = etat.config.cols.conjoints;
  if (!cid || !infoColonne(etat.config.tables.pers, cid)) { return; }
  var p = pers(a);
  var l = (p.conjoints || []).filter(function (x) { return x !== b; });
  if (lier) { l.push(b); }
  var actions = [];
  var x = {}; x[cid] = ['L'].concat(l); actions.push(['UpdateRecord', etat.config.tables.pers, a, x]);
  if (!lier) {
    var q = pers(b);
    if (q && (q.conjoints || []).indexOf(a) !== -1) {
      var y = {}; y[cid] = ['L'].concat(q.conjoints.filter(function (z) { return z !== a; })); actions.push(['UpdateRecord', etat.config.tables.pers, b, y]);
    }
  }
  await agir(actions);
}

async function modifierUnion(id, v) {
  if (modeColonnes()) { return; }
  await agir([['UpdateRecord', etat.config.tables.unions, id, versColonnesUnion(v)]]);
}

/* Après une écriture : relecture et nouveau dessin. */
async function apresEcriture(message, selection) {
  etat.empreinte = '';
  await chargerDonnees();
  if (selection !== undefined) { etat.selection = selection; }
  rendre();
  if (message) { afficherSucces(message); annoncer(message); }
}

/* === SECTION : RENDU GÉNÉRAL === */
var VUES = [
  { cle: 'arbre', nom: 'Arbre', icone: 'arbre' },
  { cle: 'ascendance', nom: 'Ascendance', icone: 'eventail' },
  { cle: 'liste', nom: 'Liste', icone: 'liste' },
  { cle: 'anniversaires', nom: 'Anniversaires', icone: 'gateau' },
  { cle: 'carte', nom: 'Carte', icone: 'carte' },
  { cle: 'cousins', nom: 'Cousins ADN', icone: 'adn' }
];

function vuesDisponibles() {
  return VUES.filter(function (v) { return v.cle !== 'cousins' || (etat.config && etat.config.affichage.cousins && etat.config.tables.cousins); });
}

function contenu() { return document.getElementById('contenu'); }

function rendre() {
  fermerMenuPlus();
  rendreBandeau();
  var zone = contenu();
  if (etat.assistant) {
    document.getElementById('onglets').hidden = true;
    fermerFiche(true);
    vider(zone);
    rendreAssistant(zone);
    return;
  }

    document.getElementById('onglets').hidden = true;
    fermerFiche(true);
    vider(zone);
    rendreAccueil(zone);
    return;
  }
  rendreOnglets();

/* Bandeau : recherche, imprimante, paramétrage, aide. */
function rendreBandeau() {

  var d = document.getElementById('bandeauDroite');
  vider(d);

  }

  d.appendChild(aide);
}

function zoneRecherche() {
  var boite = creer('div', { classe: 'recherche', attrs: { role: 'search' } });
  var lab = creer('label', { classe: 'sr', texte: 'Rechercher une personne', attrs: { 'for': 'recherchePers' } });
  var inp = creer('input', { classe: 'saisie', id: 'recherchePers', attrs: { type: 'search', placeholder: 'Rechercher une personne ou un cousin', 'aria-controls': 'suggestions', 'aria-expanded': 'false', 'aria-autocomplete': 'list' } });
  var ul = creer('ul', { classe: 'suggestions', id: 'suggestions', attrs: { hidden: true, 'aria-label': 'Personnes trouvées' } });
  var maj = function () {
    var q = normaliser(inp.value);
    vider(ul);
    if (q.length < 1) { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
    var trouves = etat.donnees.ordre.map(pers).filter(function (p) {
      return normaliser(nomComplet(p) + ' ' + p.nomNaissance + ' ' + p.naissanceLieu).indexOf(q) !== -1;
    }).sort(function (a, b) { return nomComplet(a).localeCompare(nomComplet(b), 'fr'); });
    var cousinsTrouves = vuesDisponibles().some(function (v) { return v.cle === 'cousins'; }) ? (etat.donnees.cousins || []).filter(function (c) {
      return normaliser([c.prenom, c.nom, c.patronymes, c.ville, c.pays].join(' ')).indexOf(q) !== -1;
    }) : [];
    if (!trouves.length && !cousinsTrouves.length) { ul.appendChild(creer('li', { classe: 'indice', texte: 'Personne ne correspond.', attrs: { style: 'padding:.5rem .625rem' } })); }
    trouves.forEach(function (p) {
      var b = creer('button', { clic: function () { inp.value = ''; ul.hidden = true; allerAPersonne(p.id); } },
        [creer('span', { texte: nomComplet(p) }), creer('span', { classe: 'indice', texte: anneeAffichee(p.naissance, p.naissanceApprox) })]);
      ul.appendChild(creer('li', {}, [b]));
    });
    if (cousinsTrouves.length) {
      ul.appendChild(creer('li', { classe: 'indice', texte: 'Cousins ADN', attrs: { style: 'padding:.5rem .625rem .25rem', role: 'presentation' } }));
      cousinsTrouves.slice(0, 12).forEach(function (c) {
        var nomC = ((c.prenom || '') + ' ' + (c.nom || '')).trim();
        var bc = creer('button', { clic: function () {
          inp.value = ''; ul.hidden = true;
          etat.filtreCousins.texte = nomC;
          etat.cousinsAffichage = 'tableau';
          etat.vue = 'cousins';
          rendre();
          annoncer('Cousin ADN : ' + nomC);
        } }, [creer('span', { texte: nomC }), creer('span', { classe: 'indice', texte: [c.pays, c.cm ? formaterNombre(c.cm, 1) + ' cM' : ''].filter(Boolean).join(', ') })]);
        ul.appendChild(creer('li', {}, [bc]));
      });
    }
    ul.hidden = false;
    inp.setAttribute('aria-expanded', 'true');
  };
  inp.addEventListener('input', maj);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { var f = ul.querySelector('button'); if (f) { e.preventDefault(); f.focus(); } }
    if (e.key === 'Escape') { inp.value = ''; maj(); }
    if (e.key === 'Enter') { var g = ul.querySelector('button'); if (g) { e.preventDefault(); g.click(); } }
  });
  ul.addEventListener('keydown', function (e) {
    var bs = Array.prototype.slice.call(ul.querySelectorAll('button'));
    var i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < bs.length - 1) { e.preventDefault(); bs[i + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) { bs[i - 1].focus(); } else { inp.focus(); } }
    if (e.key === 'Escape') { ul.hidden = true; inp.focus(); }
  });
  boite.addEventListener('focusout', function () { setTimeout(function () { if (!boite.contains(document.activeElement)) { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); } }, 120); });
  boite.appendChild(icone('recherche'));
  boite.appendChild(lab);
  boite.appendChild(inp);
  boite.appendChild(ul);
  return boite;
}

/* Une personne trouvée : dans l'arbre, elle est montrée si elle y figure,
   sinon elle devient le centre de l'arbre pour la session. */
function allerAPersonne(pid) {
  etat.selection = pid;

  if (etat.vue === 'arbre') {
    var disp = etat.disposition;
    var present = disp && disp.noeuds.some(function (n) { return n.pid === pid; });
    if (!present) { etat.centreSession = pid; }
    rendre();
    centrerSur(pid, true);

  setTimeout(function () { etat.trouve = null; var n = document.querySelector('.carte--trouve'); if (n) { n.classList.remove('carte--trouve'); } }, 2500);
}

}

/* Colonne « Vérifiée » : ajoutée toute seule aux tables des arbres créés
   avant cette fonction (la colonne VERIFIEE est reprise si elle existe). */
async function assurerColonnesVerifiee(cfg) {
  try {
    var jobs = [[cfg.tables.pers, cfg.cols], [cfg.tables.cousins, cfg.colsCousins]];
    for (var i = 0; i < jobs.length; i++) {
      var tid = jobs[i][0];
      var cols = jobs[i][1];
      if (!tid || !cols || !etat.meta || !etat.meta.tables[tid]) { continue; }
      var marques = [['verifiee', 'VERIFIEE'], ['aVerifier', 'A_VERIFIER']];
      for (var m = 0; m < marques.length; m++) {
        var cle = marques[m][0];
        var idCol = marques[m][1];
        if (cols[cle] && infoColonne(tid, cols[cle])) { continue; }
        if (infoColonne(tid, idCol)) { cols[cle] = idCol; continue; }
        if (!etat.peutModifier) { continue; }
        cols[cle] = await ajouterColonne(tid, colonneLibre(tid, idCol), 'Bool', idCol.replace(/_/g, ' '));
        await chargerMeta();
      }
    }
    /* Colonnes de la fiche MyHeritage (liens, noms ancestraux...) */
    var tc = cfg.tables.cousins;
    if (tc && cfg.colsCousins && etat.meta && etat.meta.tables[tc] && etat.peutModifier) {
      for (var k = 0; k < CLES_COUSINS_ETENDUES.length; k++) {
        var def = CHAMPS_COUSINS.filter(function (x) { return x.cle === CLES_COUSINS_ETENDUES[k]; })[0];
        if (cfg.colsCousins[def.cle] && infoColonne(tc, cfg.colsCousins[def.cle])) { continue; }
        if (infoColonne(tc, def.id)) { cfg.colsCousins[def.cle] = def.id; continue; }
        cfg.colsCousins[def.cle] = await ajouterColonne(tc, colonneLibre(tc, def.id), 'Text', def.label);
        await chargerMeta();
      }
    }
  } catch (e) { logSecurite('WARNING', 'Colonne Vérifiée non ajoutée', e); }
}
