/* === SECTION : DISPOSITION DE L'ARBRE ===
   Le centre, sa fratrie à côté, ses ascendants au-dessus (en pyramide),
   ses descendants et leurs conjoints en dessous (sert à choisir les
   personnes de l'arbre centré). Une personne déjà placée
   qui réapparaît (mariage entre cousins...) est dessinée en pointillés,
   sans répéter sa descendance. */
var DIM = { L: 220, H: 100, GX: 24, GC: 40, GY: 78, MARGE: 80 };

function construireBloc(pid, d, D, vus) {
  vus[pid] = true;
  var bloc = { pid: pid, partenaires: [], groupes: [] };
  unionsPersonne(pid).forEach(function (uid) {
    var cj = conjointDans(uid, pid);
    var part = null;
    if (cj) { part = { uid: uid, pid: cj, dup: !!vus[cj] }; vus[cj] = true; bloc.partenaires.push(part); }
    var enfants = [];
    if (d < D) {
      enfantsUnion(uid).forEach(function (e) {
        if (vus[e]) { enfants.push({ pid: e, dup: true, partenaires: [], groupes: [] }); }
        else { enfants.push(construireBloc(e, d + 1, D, vus)); }
      });
    }
    bloc.groupes.push({ uid: uid, part: part, enfants: enfants });
  });
  return bloc;
}

function largeurRangee(bloc) { var n = bloc.partenaires.length; return DIM.L * (1 + n) + DIM.GC * n; }

function mesurerBloc(bloc) {
  var rangee = largeurRangee(bloc);
  var enf = 0;
  var nGroupes = 0;
  bloc.groupes.forEach(function (g) {
    if (!g.enfants.length) { g.w = 0; return; }
    var w = 0;
    g.enfants.forEach(function (e, i) { w += mesurerBloc(e) + (i ? DIM.GX : 0); });
    g.w = w;
    enf += w + (nGroupes ? DIM.GX * 2 : 0);
    nGroupes++;
  });
  bloc.wEnfants = enf;
  bloc.w = Math.max(rangee, enf);
  return bloc.w;
}

function placerBloc(bloc, gauche, g, sortie, opt) {
  var y = g * (DIM.H + DIM.GY);
  var rangee = largeurRangee(bloc);
  var x0 = opt && opt.x0 != null ? opt.x0 : gauche + (bloc.w - rangee) / 2;
  sortie.noeuds.push({ pid: bloc.pid, x: x0, y: y, dup: !!bloc.dup });
  if (bloc.dup) { return { cx: x0 + DIM.L / 2 }; }
  var ancres = {};
  bloc.partenaires.forEach(function (pt, k) {
    var px = x0 + (DIM.L + DIM.GC) * (k + 1);
    sortie.noeuds.push({ pid: pt.pid, x: px, y: y, dup: pt.dup });
    var u = unionDe(pt.uid);
    if (k === 0) {
      var ax = x0 + DIM.L + DIM.GC / 2;
      sortie.traits.push({ pts: [[x0 + DIM.L, y + DIM.H / 2], [px, y + DIM.H / 2]] });
      sortie.coeurs.push({ x: ax, y: y + DIM.H / 2, separe: u && u.separes, uid: pt.uid });
      ancres[pt.uid] = [ax, y + DIM.H / 2];
    } else {
      var hy = y - 10 - 7 * (k - 1);
      sortie.traits.push({ pts: [[x0 + DIM.L * 0.7, y], [x0 + DIM.L * 0.7, hy], [px + DIM.L / 2, hy], [px + DIM.L / 2, y]] });
      sortie.coeurs.push({ x: (x0 + DIM.L * 0.7 + px + DIM.L / 2) / 2, y: hy, separe: u && u.separes, uid: pt.uid });
      ancres[pt.uid] = [px + DIM.L / 2, y + DIM.H];
    }
  });
  var xe = opt && opt.xe != null ? opt.xe : gauche + (bloc.w - bloc.wEnfants) / 2;
  var premier = true;
  bloc.groupes.forEach(function (gr) {
    if (!gr.enfants.length) { return; }
    if (!premier) { xe += DIM.GX * 2; }
    premier = false;
    var centres = [];
    gr.enfants.forEach(function (e, i) {
      if (i) { xe += DIM.GX; }
      var r = placerBloc(e, xe, g + 1, sortie);
      centres.push({ x: r.cx, pid: e.pid });
      xe += e.w;
    });
    var a = ancres[gr.uid] || [x0 + DIM.L / 2, y + DIM.H];
    relierEnfants(a, centres, y + DIM.H + DIM.GY / 2, y + DIM.H + DIM.GY, sortie);
  });
  return { cx: x0 + DIM.L / 2 };
}

/* Lien d'une union vers ses enfants : descente, barre, puis un trait par
   enfant (en pointillés pour une adoption). */
function relierEnfants(a, centres, yBarre, yEnfants, sortie) {
  if (!centres.length) { return; }
  var xs = centres.map(function (c) { return c.x; });
  var min = Math.min.apply(null, xs.concat(a ? [a[0]] : []));
  var max = Math.max.apply(null, xs.concat(a ? [a[0]] : []));
  if (a) { sortie.traits.push({ pts: [[a[0], a[1]], [a[0], yBarre]] }); }
  if (max > min) { sortie.traits.push({ pts: [[min, yBarre], [max, yBarre]] }); }
  centres.forEach(function (c) {
    var p = pers(c.pid);
    sortie.traits.push({ pts: [[c.x, yBarre], [c.x, yEnfants]], adopte: p && p.filiation === 'Adoption' });
  });
}

function mesurerAsc(pid, k, A) {
  var p = pers(pid);
  if (k >= A || !p || !p.parents) { return DIM.L; }
  return Math.max(DIM.L, largeurCouple(p.parents, k + 1, A));
}

function largeurCouple(uid, k, A) {
  var u = unionDe(uid);
  if (!u) { return 0; }
  var l = [u.a, u.b].filter(function (x) { return x; });
  var w = 0;
  l.forEach(function (x, i) { w += mesurerAsc(x, k, A) + (i ? DIM.GC : 0); });
  return w;
}

/* Couple d'ascendants centré sur cx, à la génération k au-dessus du
   centre. Renvoie le point d'ancrage pour relier les enfants. */
function placerCouple(uid, k, A, cx, vus, sortie) {
  var u = unionDe(uid);
  if (!u) { return null; }
  var l = [u.a, u.b].filter(function (x) { return x; });
  if (!l.length) { return null; }
  var y = -k * (DIM.H + DIM.GY);
  var tot = largeurCouple(uid, k, A);
  var g = cx - tot / 2;
  var xs = [];
  l.forEach(function (pid, i) {
    if (i) { g += DIM.GC; }
    var w = mesurerAsc(pid, k, A);
    var px = g + w / 2 - DIM.L / 2;
    var dup = !!vus[pid];
    vus[pid] = true;
    sortie.noeuds.push({ pid: pid, x: px, y: y, dup: dup });
    xs.push(px);
    var p = pers(pid);
    if (!dup && k < A && p && p.parents) {
      var anc = placerCouple(p.parents, k + 1, A, px + DIM.L / 2, vus, sortie);
      if (anc) {
        var yMilieu = y - DIM.GY / 2;
        sortie.traits.push({ pts: [[anc[0], anc[1]], [anc[0], yMilieu], [px + DIM.L / 2, yMilieu], [px + DIM.L / 2, y]], adopte: p.filiation === 'Adoption' });
        /* Frères et sœurs de cet ancêtre (oncles, tantes...) : placés après coup. */
        if (sortie.pending && etat.config.affichage.fratrie !== false) {
          sortie.pending.push({ pid: pid, px: px, y: y, anc: anc, yMilieu: yMilieu, cote: i === 0 ? -1 : 1 });
        }
      }
    }
    g += w;
  });
  if (l.length === 2) {
    var ay = y + DIM.H / 2;
    var ax = (xs[0] + DIM.L + xs[1]) / 2;
    sortie.traits.push({ pts: [[xs[0] + DIM.L, ay], [xs[1], ay]] });
    sortie.coeurs.push({ x: ax, y: ay, separe: u.separes, uid: uid });
    return [ax, ay];
  }
  return [xs[0] + DIM.L / 2, y + DIM.H];
}

function calculerDisposition(centre) {
  var aff = etat.config.affichage;
  var A = Math.max(0, Math.min(8, aff.ascendants | 0));
  var D = Math.max(0, Math.min(8, aff.descendants | 0));
  var sortie = { noeuds: [], traits: [], coeurs: [], pending: [] };
  if (!centre) { return sortie; }
  var vus = {};
  var p = pers(centre);
  var freres = aff.fratrie && p.parents ? enfantsUnion(p.parents).filter(function (x) { return x !== centre; }) : [];
  freres.forEach(function (f) { vus[f] = true; });
  vus[centre] = true;
  var bloc = construireBloc(centre, 0, D, vus);
  mesurerBloc(bloc);
  /* Chaque frère ou sœur avec ses conjoints et ses enfants (neveux, nièces). */
  var blocsFreres = {};
  freres.forEach(function (f) { var bf = construireBloc(f, 0, D, vus); mesurerBloc(bf); blocsFreres[f] = bf; });
  /* Le centre est posé en premier ; ses frères et sœurs viennent juste à sa
     gauche, sur la même rangée (côté opposé à son conjoint). Leurs enfants
     se rangent à gauche de ceux du centre, sans chevauchement. */
  var centres = [];
  var r = placerBloc(bloc, 0, 0, sortie);
  centres.push({ x: r.cx, pid: centre });
  var rangeeC = largeurRangee(bloc);
  var curRang = (bloc.w - rangeeC) / 2 - DIM.GX;
  var curEnf = (bloc.w - bloc.wEnfants) / 2 - DIM.GX * 2;
  var ordre = (p.parents ? enfantsUnion(p.parents) : [centre]).filter(function (x) { return freres.indexOf(x) !== -1; });
  ordre.slice().reverse().forEach(function (f) {
    var bf = blocsFreres[f];
    var x0f = curRang - largeurRangee(bf);
    var opt = { x0: x0f };
    if (bf.wEnfants) {
      var xef = Math.min(curEnf - bf.wEnfants, x0f + largeurRangee(bf) / 2 - bf.wEnfants / 2);
      opt.xe = xef;
      curEnf = xef - DIM.GX * 2;
    }
    var rf = placerBloc(bf, 0, 0, sortie, opt);
    centres.push({ x: rf.cx, pid: f });
    curRang = x0f - DIM.GX;
  });
  if (p.parents) {
    var cs = centres.map(function (c) { return c.x; });
    var cx = (Math.min.apply(null, cs) + Math.max.apply(null, cs)) / 2;
    var anc = A > 0 ? placerCouple(p.parents, 1, A, cx, vus, sortie) : null;
    if (anc || centres.length > 1) { relierEnfants(anc, centres, -DIM.GY / 2, 0, sortie); }
  }
  /* Oncles, tantes et leurs familles : à côté de leur frère ou sœur ancêtre, le plus
     près possible, en s'écartant vers l'extérieur tant qu'une carte gêne. */
  sortie.pending.forEach(function (it) {
    var pp = pers(it.pid);
    if (!pp || !pp.parents) { return; }
    var sibs = enfantsUnion(pp.parents).filter(function (x) { return x !== it.pid && !vus[x]; });
    var cur = it.cote > 0 ? it.px + DIM.L + DIM.GX : it.px - DIM.GX;
    var g = Math.round(it.y / (DIM.H + DIM.GY));
    sibs.forEach(function (f) {
      var bf = construireBloc(f, 0, 1, vus);
      mesurerBloc(bf);
      var rw = largeurRangee(bf);
      var x0 = it.cote > 0 ? cur : cur - rw;
      var tmp = null;
      var rf = null;
      for (var essai = 0; essai < 60; essai++) {
        tmp = { noeuds: [], traits: [], coeurs: [] };
        rf = placerBloc(bf, x0 - (bf.w - rw) / 2, g, tmp, { x0: x0 });
        var gene = tmp.noeuds.some(function (a) {
          return sortie.noeuds.some(function (b) { return a.y === b.y && Math.abs(a.x - b.x) < DIM.L + DIM.GX / 2; });
        });
        if (!gene) { break; }
        x0 += it.cote * (DIM.L + DIM.GX);
      }
      tmp.noeuds.forEach(function (n) { sortie.noeuds.push(n); });
      tmp.traits.forEach(function (t) { sortie.traits.push(t); });
      tmp.coeurs.forEach(function (c) { sortie.coeurs.push(c); });
      sortie.traits.push({ pts: [[it.anc[0], it.anc[1]], [it.anc[0], it.yMilieu], [rf.cx, it.yMilieu], [rf.cx, it.y]], adopte: pers(f) && pers(f).filiation === 'Adoption' });
      cur = it.cote > 0 ? Math.max(x0 + rw, x0 + bf.w) + DIM.GX : Math.min(x0, x0 + (rw - bf.w) / 2) - DIM.GX;
    });
  });
  /* Recadrage : tout en coordonnées positives, avec une marge. */
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  sortie.noeuds.forEach(function (n) { minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x + DIM.L); maxY = Math.max(maxY, n.y + DIM.H); });
  sortie.traits.forEach(function (t) { t.pts.forEach(function (q) { minY = Math.min(minY, q[1]); }); });
  var dx = DIM.MARGE - minX;
  var dy = DIM.MARGE + 40 - minY;
  sortie.noeuds.forEach(function (n) { n.x += dx; n.y += dy; });
  sortie.traits.forEach(function (t) { t.pts.forEach(function (q) { q[0] += dx; q[1] += dy; }); });
  sortie.coeurs.forEach(function (c) { c.x += dx; c.y += dy; });
  sortie.largeur = maxX - minX + DIM.MARGE * 2;
  sortie.hauteur = maxY - minY + DIM.MARGE * 2 + 40;
  var gens = {};
  sortie.noeuds.forEach(function (n) { gens[n.y] = true; });
  sortie.nbGenerations = Object.keys(gens).length;
  return sortie;
}

/* Disposition en générations : chaque personne n'a qu'une seule carte.
   1. Chaque personne reçoit une génération (rangée) : les conjoints sur la
      même rangée, les enfants sur la rangée du dessous.
   2. Les conjoints forment une « unité » posée d'un seul tenant.
   3. L'ordre des unités sur chaque rangée part d'un parcours de la famille
      (frères et sœurs du côté extérieur du couple), puis il est affiné pour
      limiter les croisements de traits.
   4. Les positions sont ajustées pour centrer les parents au-dessus de leurs
      enfants, sans jamais faire se chevaucher deux cartes.
   5. Les traits sont tracés à partir des positions finales. */
function calculerDispositionGraphe(garder) {
  var sortie = { noeuds: [], traits: [], coeurs: [] };
  var d = etat.donnees;
  var ids = d.ordre.filter(function (id) { return d.P[id] && (!garder || garder[id]); });
  var dedans = {};
  ids.forEach(function (id) { dedans[id] = true; });
  var ref = idCentre();
  if (!dedans[ref]) { ref = ids[0]; }

  function membresUnion(uid) {
    var u = unionDe(uid);
    if (!u) { return []; }
    var l = [];
    [u.a, u.b].forEach(function (x) { if (x && dedans[x] && l.indexOf(x) === -1) { l.push(x); } });
    return l;
  }
  function parentsUnion(id) {
    var p = pers(id);
    return p && p.parents && membresUnion(p.parents).length ? p.parents : 0;
  }
  function unionsDeP(id) { return unionsPersonne(id).filter(function (uid) { return membresUnion(uid).length; }); }
  function enfantsDeU(uid) { return enfantsUnion(uid).filter(function (x) { return dedans[x]; }).sort(comparerNaissance); }

  /* 1. Générations */
  var gen = {};
  [ref].concat(ids).forEach(function (s) {
    if (!s || gen[s] != null) { return; }
    gen[s] = 0;
    var file = [s];
    var poser = function (y, gy) { if (y && dedans[y] && gen[y] == null) { gen[y] = gy; file.push(y); } };
    while (file.length) {
      var x = file.shift();
      var g = gen[x];
      unionsDeP(x).forEach(function (uid) { membresUnion(uid).forEach(function (y) { poser(y, g); }); });
      var pu = parentsUnion(x);
      if (pu) { membresUnion(pu).forEach(function (y) { poser(y, g - 1); }); }
      unionsDeP(x).forEach(function (uid) { enfantsDeU(uid).forEach(function (y) { poser(y, g + 1); }); });
    }
  });

  /* 2. Unités : une personne et ses conjoints de la même rangée */
  var uniteDe = {};
  var membres = [];
  ids.forEach(function (id) {
    if (uniteDe[id] != null) { return; }
    var comp = [];
    var pile = [id];
    var vu = {};
    vu[id] = true;
    while (pile.length) {
      var x = pile.pop();
      comp.push(x);
      unionsDeP(x).forEach(function (uid) {
        membresUnion(uid).forEach(function (y) { if (!vu[y] && gen[y] === gen[id]) { vu[y] = true; pile.push(y); } });
      });
    }
    var voisins = function (x) {
      var l = [];
      unionsDeP(x).forEach(function (uid) { membresUnion(uid).forEach(function (y) { if (y !== x && comp.indexOf(y) !== -1 && l.indexOf(y) === -1) { l.push(y); } }); });
      return l;
    };
    var ordre;
    if (comp.length === 1) { ordre = comp; }
    else {
      var deg = {};
      comp.forEach(function (x) { deg[x] = voisins(x).length; });
      var chaine = comp.every(function (x) { return deg[x] <= 2; }) && comp.some(function (x) { return deg[x] === 1; });
      if (chaine) {
        /* Couple ou personne entre deux conjoints : on suit la chaîne. */
        var bouts = comp.filter(function (x) { return deg[x] === 1; });
        var depart = bouts[0];
        if (comp.length === 2) { var u0 = unionDe(unionsDeP(id).filter(function (uid) { return membresUnion(uid).length === 2; })[0]); if (u0 && comp.indexOf(u0.a) !== -1) { depart = u0.a; } }
        else {
          var milieu = comp.filter(function (x) { return deg[x] === 2; })[0];
          var cj = [];
          unionsDeP(milieu).forEach(function (uid) { membresUnion(uid).forEach(function (y) { if (y !== milieu && cj.indexOf(y) === -1) { cj.push(y); } }); });
          if (cj.length && bouts.indexOf(cj[0]) !== -1) { depart = cj[0]; }
        }
        ordre = [depart];
        while (ordre.length < comp.length) {
          var suiv = voisins(ordre[ordre.length - 1]).filter(function (y) { return ordre.indexOf(y) === -1; })[0];
          if (!suiv) { break; }
          ordre.push(suiv);
        }
        comp.forEach(function (x) { if (ordre.indexOf(x) === -1) { ordre.push(x); } });
      } else {
        /* Cas rare (plusieurs conjoints de part et d'autre) : la personne au
           plus grand nombre d'unions au milieu, les autres autour. */
        var centre = comp.slice().sort(function (x, y) { return deg[y] - deg[x]; })[0];
        var autres = comp.filter(function (x) { return x !== centre; });
        ordre = [autres[0], centre].concat(autres.slice(1));
      }
    }
    var k = membres.length;
    membres.push(ordre);
    ordre.forEach(function (x) { uniteDe[x] = k; });
  });
  var genU = membres.map(function (m) { return gen[m[0]]; });

  /* 3a. Ordre de départ : parcours de la famille. Les ascendants et les
     frères et sœurs du conjoint de gauche viennent à gauche, ceux du
     conjoint de droite à droite ; une personne seule garde ses aînés à
     gauche et ses cadets à droite. */
  var rangees = {};
  var visite = {};
  var fait = {};
  var emettre = function (u) { (rangees[genU[u]] = rangees[genU[u]] || []).push(u); };
  var famille = function (x) {
    var pu = parentsUnion(x);
    if (!pu || fait[pu]) { return null; }
    fait[pu] = true;
    parcourir(uniteDe[membresUnion(pu)[0]]);
    return enfantsDeU(pu).filter(function (y) { return y !== x; });
  };
  var parcourir = function (u) {
    if (u == null || visite[u]) { return; }
    visite[u] = true;
    var m = membres[u];
    var apres = [];
    var fr = famille(m[0]);
    if (fr) {
      if (m.length > 1) { fr.forEach(function (y) { parcourir(uniteDe[y]); }); }
      else {
        fr.forEach(function (y) { if (comparerNaissance(y, m[0]) < 0) { parcourir(uniteDe[y]); } else { apres.push(y); } });
      }
    }
    emettre(u);
    m.forEach(function (x) {
      unionsDeP(x).forEach(function (uid) {
        if (fait[uid]) { return; }
        fait[uid] = true;
        enfantsDeU(uid).forEach(function (y) { parcourir(uniteDe[y]); });
      });
    });
    apres.forEach(function (y) { parcourir(uniteDe[y]); });
    m.slice(1).forEach(function (x) {
      var f2 = famille(x);
      if (f2) { f2.forEach(function (y) { parcourir(uniteDe[y]); }); }
    });
  };
  parcourir(uniteDe[ref]);
  ids.forEach(function (id) { parcourir(uniteDe[id]); });

  var gens = Object.keys(rangees).map(Number).sort(function (a, b) { return a - b; });

  /* Positions abstraites (en « places ») pour compter les croisements. */
  var place = {};
  var calculerPlaces = function (g) {
    var c = 0;
    rangees[g].forEach(function (u) { membres[u].forEach(function (x) { place[x] = c++; }); });
  };
  gens.forEach(calculerPlaces);
  var unionsAvecEnfants = [];
  var vuU = {};
  ids.forEach(function (id) {
    unionsDeP(id).forEach(function (uid) {
      if (vuU[uid]) { return; }
      vuU[uid] = true;
      if (enfantsDeU(uid).length) { unionsAvecEnfants.push(uid); }
    });
  });
  var ancrePlace = function (uid) {
    var m = membresUnion(uid);
    var s = 0;
    m.forEach(function (x) { s += place[x]; });
    return s / m.length;
  };
  var aretes = function (g) {
    var l = [];
    unionsAvecEnfants.forEach(function (uid) {
      var m = membresUnion(uid);
      if (gen[m[0]] !== g) { return; }
      var a = ancrePlace(uid);
      enfantsDeU(uid).forEach(function (e) { if (gen[e] === g + 1) { l.push([a, place[e]]); } });
    });
    return l;
  };
  var croisements = function (g) {
    var l = aretes(g);
    var n = 0;
    for (var i = 0; i < l.length; i++) {
      for (var j = i + 1; j < l.length; j++) {
        if ((l[i][0] - l[j][0]) * (l[i][1] - l[j][1]) < 0) { n++; }
      }
    }
    return n;
  };
  /* Une unité étrangère glissée au milieu d'une fratrie compte aussi. */
  var intercales = function (g) {
    var n = 0;
    var r = rangees[g];
    var pos = {};
    r.forEach(function (u, i) { pos[u] = i; });
    var fr = {};
    r.forEach(function (u) { membres[u].forEach(function (x) { var pu = parentsUnion(x); if (pu) { (fr[pu] = fr[pu] || []).push(pos[u]); } }); });
    Object.keys(fr).forEach(function (pu) {
      var l = fr[pu];
      if (l.length < 2) { return; }
      var mi = Math.min.apply(null, l);
      var ma = Math.max.apply(null, l);
      for (var i = mi + 1; i < ma; i++) { if (l.indexOf(i) === -1) { n++; } }
    });
    return n;
  };
  var total = function () { var n = 0; gens.forEach(function (g) { n += croisements(g) + intercales(g); }); return n; };

  /* 3b. Affinage de l'ordre (méthode des barycentres), en gardant le
     meilleur ordre trouvé. */
  var copier = function () { var c = {}; gens.forEach(function (g) { c[g] = rangees[g].slice(); }); return c; };
  var meilleur = copier();
  var meilleurN = total();
  var bary = function (u, sens) {
    var s = 0;
    var n = 0;
    membres[u].forEach(function (x) {
      if (sens < 0) {
        var pu = parentsUnion(x);
        if (pu && gen[membresUnion(pu)[0]] === gen[x] - 1) { s += ancrePlace(pu); n++; }
      } else {
        unionsDeP(x).forEach(function (uid) {
          enfantsDeU(uid).forEach(function (e) { if (gen[e] === gen[x] + 1) { s += place[e]; n++; } });
        });
      }
    });
    return n ? s / n : null;
  };
  var trier = function (g, sens) {
    /* Les unités sans lien dans ce sens gardent leur place ; les autres
       sont triées entre elles sur les places restantes. */
    var r = rangees[g];
    var cles = {};
    var mobiles = [];
    r.forEach(function (u, i) {
      var b = bary(u, sens);
      if (b != null) { cles[u] = b + i * 1e-6; mobiles.push(u); }
    });
    mobiles.sort(function (a, b) { return cles[a] - cles[b]; });
    var k = 0;
    rangees[g] = r.map(function (u) { return cles[u] != null ? mobiles[k++] : u; });
    calculerPlaces(g);
  };
  for (var it = 0; it < 12 && meilleurN > 0; it++) {
    if (it % 2 === 0) { gens.forEach(function (g) { trier(g, -1); }); }
    else { gens.slice().reverse().forEach(function (g) { trier(g, 1); }); }
    var n = total();
    if (n < meilleurN) { meilleurN = n; meilleur = copier(); }
  }
  rangees = meilleur;
  gens.forEach(calculerPlaces);
  /* Retouches : chaque unité essaie toutes les places de sa rangée et
     garde celle qui réduit les croisements et les fratries coupées. */
  var coutLocal = function (g) { return croisements(g - 1) + croisements(g) + intercales(g); };
  for (var passe = 0; passe < 4; passe++) {
    var mieux = false;
    gens.forEach(function (g) {
      var r = rangees[g];
      if (r.length > 60) { return; }
      r.slice().forEach(function (u) {
        var i0 = r.indexOf(u);
        r.splice(i0, 1);
        var best = i0;
        var bestC = Infinity;
        for (var i = 0; i <= r.length; i++) {
          r.splice(i, 0, u);
          calculerPlaces(g);
          var c = coutLocal(g);
          if (c < bestC || (c === bestC && i === i0)) { bestC = c; best = i; }
          r.splice(i, 1);
        }
        r.splice(best, 0, u);
        calculerPlaces(g);
        if (best !== i0) { mieux = true; }
      });
    });
    if (!mieux) { break; }
  }

  /* Sens des couples : chaque conjoint du côté de sa propre famille. */
  membres.forEach(function (m, u) {
    if (m.length < 2) { return; }
    var cote = function (x) { var pu = parentsUnion(x); return pu && gen[membresUnion(pu)[0]] === gen[x] - 1 ? ancrePlace(pu) : null; };
    var a = cote(m[0]);
    var b = cote(m[m.length - 1]);
    if (a != null && b != null && a > b) {
      var avant = croisements(genU[u] - 1) + croisements(genU[u]);
      m.reverse();
      calculerPlaces(genU[u]);
      if (croisements(genU[u] - 1) + croisements(genU[u]) > avant) { m.reverse(); calculerPlaces(genU[u]); }
    }
  });

  /* 4. Positions horizontales */
  var largeurU = function (u) { var n = membres[u].length; return DIM.L * n + DIM.GC * (n - 1); };
  var decal = function (u, x) { return membres[u].indexOf(x) * (DIM.L + DIM.GC); };
  var X = {};
  var memeFamille = function (u, v) {
    var pu = {};
    membres[u].forEach(function (x) { var p = parentsUnion(x); if (p) { pu[p] = true; } });
    return membres[v].some(function (x) { var p = parentsUnion(x); return p && pu[p]; });
  };
  var ecart = {};
  gens.forEach(function (g) {
    var x = 0;
    rangees[g].forEach(function (u, i) {
      if (i) {
        var v = rangees[g][i - 1];
        ecart[u] = memeFamille(u, v) ? DIM.GX : DIM.GX * 3;
        x += ecart[u];
      }
      X[u] = x;
      x += largeurU(u);
    });
  });
  var centreP = function (x) { var u = uniteDe[x]; return X[u] + decal(u, x) + DIM.L / 2; };
  var ancreX = function (uid) {
    var m = membresUnion(uid);
    var s = 0;
    m.forEach(function (x) { s += centreP(x); });
    return s / m.length;
  };
  /* Régression isotone : chaque unité au plus près de sa cible, dans
     l'ordre de la rangée et sans chevauchement. */
  var ajuster = function (g) {
    var r = rangees[g];
    var cible = [];
    var poids = [];
    r.forEach(function (u) {
      var s = 0;
      var n = 0;
      membres[u].forEach(function (x) {
        var pu = parentsUnion(x);
        if (pu && gen[membresUnion(pu)[0]] === g - 1) { s += ancreX(pu) - decal(u, x) - DIM.L / 2; n++; }
        unionsDeP(x).forEach(function (uid) {
          var en = enfantsDeU(uid).filter(function (e) { return gen[e] === g + 1; });
          if (!en.length) { return; }
          var m = 0;
          en.forEach(function (e) { m += centreP(e); });
          m /= en.length;
          var mu = membresUnion(uid);
          var off = 0;
          mu.forEach(function (y) { off += decal(u, y) + DIM.L / 2; });
          off /= mu.length;
          if (mu.every(function (y) { return uniteDe[y] === u; })) { s += m - off; n++; }
        });
      });
      cible.push(n ? s / n : null);
      poids.push(n ? n : 1e-6);
    });
    var o = [];
    var acc = 0;
    r.forEach(function (u, i) { if (i) { acc += largeurU(r[i - 1]) + ecart[u]; } o.push(acc); });
    /* Une unité sans lien suit simplement ses voisines. */
    var v = cible.map(function (c, i) { return c == null ? null : c - o[i]; });
    var dernier = null;
    v.forEach(function (x, i) { if (x == null) { v[i] = dernier; } else { dernier = x; } });
    dernier = null;
    for (var j = v.length - 1; j >= 0; j--) { if (v[j] == null) { v[j] = dernier; } else { dernier = v[j]; } }
    v = v.map(function (x, i) { return x == null ? X[r[i]] - o[i] : x; });
    var blocs = [];
    r.forEach(function (u, i) {
      blocs.push({ v: v[i], w: poids[i], n: 1 });
      while (blocs.length > 1 && blocs[blocs.length - 2].v > blocs[blocs.length - 1].v) {
        var b2 = blocs.pop();
        var b1 = blocs.pop();
        var w = b1.w + b2.w;
        blocs.push({ v: (b1.v * b1.w + b2.v * b2.w) / w, w: w, n: b1.n + b2.n });
      }
    });
    var i = 0;
    blocs.forEach(function (b) { for (var k = 0; k < b.n; k++) { X[r[i]] = b.v + o[i]; i++; } });
  };
  var ajusterTout = function (n) {
    for (var tour = 0; tour < n; tour++) {
      gens.forEach(ajuster);
      gens.slice().reverse().forEach(ajuster);
    }
  };
  ajusterTout(30);
  /* Un conjoint dont seuls les parents sont connus se met du côté de ses
     parents (sa fratrie est ainsi à côté de lui). */
  var retourne = false;
  membres.forEach(function (m, u) {
    if (m.length !== 2) { return; }
    var cote = function (x) { var pu = parentsUnion(x); return pu && gen[membresUnion(pu)[0]] === gen[x] - 1 ? ancreX(pu) : null; };
    var a = cote(m[0]);
    var b = cote(m[1]);
    var milieu = X[u] + largeurU(u) / 2;
    if ((a != null && b == null && a > milieu) || (b != null && a == null && b < milieu)) { m.reverse(); retourne = true; }
  });
  if (retourne) { ajusterTout(15); }

  /* 5. Cartes et traits */
  var pas = DIM.H + DIM.GY;
  var g0 = gens[0];
  var Y = function (x) { return (gen[x] - g0) * pas; };
  ids.forEach(function (x) { sortie.noeuds.push({ pid: x, x: centreP(x) - DIM.L / 2, y: Y(x), dup: false }); });

  var barres = {};
  var ancres = {};
  vuU = {};
  ids.forEach(function (id) {
    unionsDeP(id).forEach(function (uid) {
      if (vuU[uid]) { return; }
      vuU[uid] = true;
      var m = membresUnion(uid);
      var u = unionDe(uid);
      if (m.length === 2) {
        var a = m[0];
        var b = m[1];
        if (centreP(a) > centreP(b)) { a = m[1]; b = m[0]; }
        var ua = uniteDe[a];
        var adjacents = ua === uniteDe[b] && membres[ua].indexOf(b) - membres[ua].indexOf(a) === 1;
        if (adjacents) {
          var ym = Y(a) + DIM.H / 2;
          var xa = centreP(a) + DIM.L / 2;
          var xb = centreP(b) - DIM.L / 2;
          sortie.traits.push({ pts: [[xa, ym], [xb, ym]] });
          sortie.coeurs.push({ x: (xa + xb) / 2, y: ym, separe: u.separes, uid: uid });
          ancres[uid] = [(xa + xb) / 2, ym];
        } else {
          var ya = Y(a);
          var yb = Y(b);
          var hy = Math.min(ya, yb) - 12 - (Object.keys(ancres).length % 3) * 6;
          sortie.traits.push({ pts: [[centreP(a) - 30, ya], [centreP(a) - 30, hy], [centreP(b) + 30, hy], [centreP(b) + 30, yb]] });
          sortie.coeurs.push({ x: (centreP(a) + centreP(b)) / 2, y: hy, separe: u.separes, uid: uid });
          var en = enfantsDeU(uid);
          var mx = 0;
          en.forEach(function (e) { mx += centreP(e); });
          var proche = en.length && Math.abs(centreP(b) - mx / en.length) < Math.abs(centreP(a) - mx / en.length) ? b : a;
          ancres[uid] = [centreP(proche), Y(proche) + DIM.H];
        }
      } else {
        ancres[uid] = [centreP(m[0]), Y(m[0]) + DIM.H];
      }
      var enf = enfantsDeU(uid).filter(function (e) { return gen[e] > gen[m[0]]; });
      if (!enf.length) { return; }
      var gEnf = Math.min.apply(null, enf.map(function (e) { return gen[e]; }));
      var xs = enf.map(centreP).concat([ancres[uid][0]]);
      (barres[gEnf] = barres[gEnf] || []).push({ uid: uid, enf: enf, min: Math.min.apply(null, xs), max: Math.max.apply(null, xs) });
    });
  });
  /* Barres d'enfants : sur des voies différentes quand elles se recouvrent. */
  Object.keys(barres).forEach(function (gk) {
    var l = barres[gk].sort(function (a, b) { return a.min - b.min; });
    var fins = [];
    l.forEach(function (b) {
      var v = 0;
      while (fins[v] != null && fins[v] > b.min - 8) { v++; }
      fins[v] = b.max;
      b.voie = v;
    });
    var nv = fins.length;
    var base = (Number(gk) - g0) * pas - DIM.GY / 2;
    l.forEach(function (b) {
      var yb = base + (nv > 1 ? (b.voie - (nv - 1) / 2) * Math.min(12, (DIM.GY - 24) / (nv - 1)) : 0);
      var a = ancres[b.uid];
      sortie.traits.push({ pts: [[a[0], a[1]], [a[0], yb]] });
      if (b.max > b.min) { sortie.traits.push({ pts: [[b.min, yb], [b.max, yb]] }); }
      b.enf.forEach(function (e) {
        var p = pers(e);
        sortie.traits.push({ pts: [[centreP(e), yb], [centreP(e), Y(e)]], adopte: p && p.filiation === 'Adoption' });
      });
    });
  });

  /* Recadrage */
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  sortie.noeuds.forEach(function (n) { minX = Math.min(minX, n.x); minY = Math.min(minY, n.y); maxX = Math.max(maxX, n.x + DIM.L); maxY = Math.max(maxY, n.y + DIM.H); });
  sortie.traits.forEach(function (t) { t.pts.forEach(function (q) { minY = Math.min(minY, q[1]); minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); }); });
  if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 0; maxY = 0; }
  var dx = DIM.MARGE - minX;
  var dy = DIM.MARGE + 40 - minY;
  sortie.noeuds.forEach(function (n) { n.x += dx; n.y += dy; });
  sortie.traits.forEach(function (t) { t.pts.forEach(function (q) { q[0] += dx; q[1] += dy; }); });
  sortie.coeurs.forEach(function (c) { c.x += dx; c.y += dy; });
  sortie.largeur = maxX - minX + DIM.MARGE * 2;
  sortie.hauteur = maxY - minY + DIM.MARGE * 2 + 40;
  sortie.nbGenerations = gens.length;
  sortie.croisements = total();
  return sortie;
}

/* === SECTION : VUE ARBRE === */
function rendreArbre(zone, garderCamera) {
  var d = etat.donnees;
  if (!d.ordre.length) {
    zone.appendChild(creer('div', { classe: 'vide' }, [
      creer('h2', { texte: 'Votre arbre est vide' }),
      creer('p', { texte: 'Commencez par vous-même ou par la personne de votre choix : vous ajouterez ensuite ses parents, ses enfants et ses proches avec le bouton « + » de sa carte.' }),
      etat.peutModifier ? bouton('Ajouter la première personne', 'p', 'plus', function () { ouvrirFormPersonne({ mode: 'seule', premiere: true }); }) : null
    ]));
    return;
  }
  var centre = idCentre();
  var br = calculerBranches(centre);
  etat.branches = br;
  var disp;
  if (etat.config.affichage.tout !== false) { disp = calculerDispositionGraphe(null); }
  else {
    /* Arbre centré : mêmes personnes qu'avant (limites d'ascendants et de
       descendants), mais chacune dessinée une seule fois. */
    var garder = {};
    calculerDisposition(centre).noeuds.forEach(function (n) { garder[n.pid] = true; });
    disp = calculerDispositionGraphe(garder);
  }

/* === SECTION : DÉPLACEMENT ET ZOOM ===
   Souris : glisser pour déplacer, Ctrl + molette pour zoomer, molette pour
   défiler. Tactile : un doigt pour déplacer, deux doigts pour zoomer.
   Clavier : flèches, + et -, 0 pour tout voir. */
function camera() {
  if (!etat.cam[etat.cleArbre]) { etat.cam[etat.cleArbre] = { x: 0, y: 0, z: 1 }; }
  return etat.cam[etat.cleArbre];
}

function appliquerCamera() {
  var m = document.getElementById('monde');
  if (!m) { return; }
  var c = camera();
  m.style.transform = 'translate(' + Math.round(c.x) + 'px,' + Math.round(c.y) + 'px) scale(' + c.z + ')';
}

function zoomer(f, px, py) {
  var v = document.getElementById('vueArbre');
  if (!v) { return; }
  var c = camera();
  var nz = Math.max(0.2, Math.min(2.2, c.z * f));
  if (px === undefined) { px = v.clientWidth / 2; py = v.clientHeight / 2; }
  c.x = px - (px - c.x) * (nz / c.z);
  c.y = py - (py - c.y) * (nz / c.z);
  c.z = nz;
  appliquerCamera();
}

function ajuster() {
  var v = document.getElementById('vueArbre');
  var d = etat.disposition;
  if (!v || !d) { return; }
  var c = camera();
  var z = Math.min(1, (v.clientWidth - 20) / d.largeur, (v.clientHeight - 20) / d.hauteur);
  c.z = Math.max(0.2, z);
  c.x = (v.clientWidth - d.largeur * c.z) / 2;
  c.y = Math.max(0, (v.clientHeight - d.hauteur * c.z) / 2);
  appliquerCamera();
}

function centrerSur(pid, garderZoom) {
  var v = document.getElementById('vueArbre');
  var d = etat.disposition;
  if (!v || !d) { return; }
  var n = d.noeuds.filter(function (x) { return x.pid === pid && !x.dup; })[0] || d.noeuds.filter(function (x) { return x.pid === pid; })[0];
  if (!n) { ajuster(); return; }
  var c = camera();
  if (!garderZoom) { c.z = v.clientWidth < 600 ? 0.75 : 1; }
  c.x = v.clientWidth / 2 - (n.x + DIM.L / 2) * c.z;
  c.y = v.clientHeight / 2 - (n.y + DIM.H / 2) * c.z;
  appliquerCamera();
}

function ajusterPourImpression() {
  var d = etat.disposition;
  var m = document.getElementById('monde');
  if (!d || !m) { return; }
  var z = Math.min(1, 1000 / d.largeur);
  m.style.transform = 'scale(' + z + ')';
  document.getElementById('vueArbre').style.height = Math.ceil(d.hauteur * z + 20) + 'px';
  var retablir = function () { window.removeEventListener('afterprint', retablir); var v = document.getElementById('vueArbre'); if (v) { v.style.height = ''; } appliquerCamera(); };
  window.addEventListener('afterprint', retablir);
}

function brancherNavigation(vue, monde) {
  var pointeurs = {};
  var depart = null;
  var pincement = null;
  var estFond = function (cible) { return !cible.closest('.noeud, .commandes, .legende, .titre-vue, .menu-plus'); };
  vue.addEventListener('pointerdown', function (e) {
    if (!estFond(e.target)) { return; }
    pointeurs[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { vue.setPointerCapture(e.pointerId); } catch (er) { logSecurite('INFO', 'Capture du pointeur impossible', er); }
    var ids = Object.keys(pointeurs);
    if (ids.length === 1) {
      var c = camera();
      depart = { x: e.clientX, y: e.clientY, cx: c.x, cy: c.y };
      vue.classList.add('glisse');
    } else if (ids.length === 2) {
      var a = pointeurs[ids[0]], b = pointeurs[ids[1]];
      pincement = { dist: Math.hypot(a.x - b.x, a.y - b.y), z: camera().z };
      depart = null;
    }
  });
  vue.addEventListener('pointermove', function (e) {
    if (!pointeurs[e.pointerId]) { return; }
    pointeurs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointeurs);
    if (ids.length === 2 && pincement) {
      var a = pointeurs[ids[0]], b = pointeurs[ids[1]];
      var dist = Math.hypot(a.x - b.x, a.y - b.y);
      var r = vue.getBoundingClientRect();
      var c = camera();
      zoomer((pincement.z * dist / pincement.dist) / c.z, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    } else if (depart) {
      var cam = camera();
      cam.x = depart.cx + e.clientX - depart.x;
      cam.y = depart.cy + e.clientY - depart.y;
      appliquerCamera();
    }
  });
  var fin = function (e) {
    delete pointeurs[e.pointerId];
    if (Object.keys(pointeurs).length < 2) { pincement = null; }
    if (!Object.keys(pointeurs).length) { depart = null; vue.classList.remove('glisse'); }
  };
  vue.addEventListener('pointerup', fin);
  vue.addEventListener('pointercancel', fin);
  vue.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = vue.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) { zoomer(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); return; }
    var c = camera();
    c.x -= e.deltaX;
    c.y -= e.deltaY;
    appliquerCamera();
  }, { passive: false });
  vue.addEventListener('keydown', function (e) {
    if (e.target !== vue) { return; }
    var c = camera();
    var pas = 60;
    if (e.key === 'ArrowLeft') { c.x += pas; } else if (e.key === 'ArrowRight') { c.x -= pas; }
    else if (e.key === 'ArrowUp') { c.y += pas; } else if (e.key === 'ArrowDown') { c.y -= pas; }
    else if (e.key === '+' || e.key === '=') { zoomer(1.2); e.preventDefault(); return; }
    else if (e.key === '-') { zoomer(1 / 1.2); e.preventDefault(); return; }
    else if (e.key === '0') { ajuster(); e.preventDefault(); return; }
    else { return; }
    e.preventDefault();
    appliquerCamera();
  });
}

/* === SECTION : PHOTOS ===
   Fichiers récupérés en Blob ; le jeton n'apparaît dans aucun lien. */
async function obtenirJeton(ecriture) {
  var cle = ecriture ? 'jetonEcriture' : 'jeton';
  var j = etat[cle];
  if (j && Date.now() < j.expire) { return j; }
  var r = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !ecriture }), 15000);
  etat[cle] = { token: r.token, baseUrl: r.baseUrl, expire: Date.now() + Math.max(0, (r.ttlMsecs || 60000) - 30000) };
  return etat[cle];
}

async function fetchDelai(url, options, delaiMs) {
  var ctrl = new AbortController();
  var minut = setTimeout(function () { ctrl.abort(); }, delaiMs);
  try {
    options.signal = ctrl.signal;
    return await fetch(url, options);
  } finally {
    clearTimeout(minut);
  }
}

async function recupererPJ(id) {
  var essai = async function (complet) {
    var j = await obtenirJeton(complet);
    return fetchDelai(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token), {}, DELAI_API_MS);
  };
  var rep = await essai(etat.pjJetonComplet === true);
  if ((rep.status === 401 || rep.status === 403) && etat.pjJetonComplet !== true) {
    etat.pjJetonComplet = true;
    rep = await essai(true);
  }
  if (!rep.ok) { throw new Error('Réponse ' + rep.status); }
  return rep.blob();
}

/* Une photo n'est demandée qu'une fois par session ; seules les images
   sont affichées. */
function afficherPhoto(el, id) {
  var poser = function (n, url) {
    if (!url || n.querySelector('img')) { return; }
    vider(n);
    n.appendChild(creer('img', { attrs: { src: url, alt: '' } }));
  };
  if (etat.photos[id]) { poser(el, etat.photos[id]); return; }
  if (!etat.photosEnCours[id]) {
    etat.photosEnCours[id] = recupererPJ(id).then(function (blob) {
      if (blob.type && !/^image\/(jpeg|png|gif|webp)$/.test(blob.type) && blob.type !== 'application/octet-stream') { return null; }
      etat.photos[id] = URL.createObjectURL(blob);
      return etat.photos[id];
    }).catch(function (e) { logSecurite('INFO', 'Photo non affichée', e); return null; });
  }
  etat.photosEnCours[id].then(function (url) {
    if (!url) { return; }
    document.querySelectorAll('[data-photo="' + id + '"]').forEach(function (n) { poser(n, url); });
  });
}

function validerPhoto(f) {
  var ext = (/\.([A-Za-z0-9]+)$/.exec(f.name || '') || [])[1];
  ext = ext ? ext.toLowerCase() : '';
  if (EXT_PHOTOS.indexOf(ext) === -1) { return 'Choisissez une image : JPG, PNG, GIF ou WebP.'; }
  if (f.size > TAILLE_MAX_PHOTO) { return 'L’image dépasse 10 Mo.'; }
  return '';
}

async function envoyerPhoto(fichier) {
  var j = await obtenirJeton(true);
  var fd = new FormData();
  fd.append('upload', fichier, fichier.name);
  var rep = await fetchDelai(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token),
    { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' }, body: fd }, DELAI_ENVOI_MS);
  if (!rep.ok) { throw new Error('Réponse ' + rep.status); }
  var ids = await rep.json();
  if (!Array.isArray(ids) || !ids.length) { throw new Error('Réponse inattendue'); }
  return ids[0];
}

function rendreFiche() {

  f.hidden = false;
  vider(f);

function elementsFocusables(racine) {

    function (n) { return !n.disabled && n.offsetParent !== null; });

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    var premier = f[0];
    var dernier = f[f.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  };
}

  var pied = document.getElementById('wModalePied');
  vider(pied);
  (o.pied || []).forEach(function (n) { if (n) { pied.appendChild(n); } });

function fermerModale() {
  var ov = document.getElementById('wModale');

      txt.appendChild(creer('button', { classe: 'lien-personne', texte: 'Est-ce la même personne ? La relier', clic: function () { var s = document.getElementById('fExistant'); s.value = String(trouve.id); s.dispatchEvent(new Event('change')); s.focus(); } }));
    }
    zoneDoublon.appendChild(alerte('attention', txt));
    zoneDoublon.hidden = false;
  };
  ['fPrenom', 'fNom'].forEach(function (id) { var el = zoneNouv.querySelector('#' + id); el.addEventListener('blur', verifierDoublon); });
  var enregistrer = bouton(o.mode === 'modifier' ? 'Enregistrer' : 'Ajouter', 'p', null, function () { return validerFormPersonne(o, etatForm, enregistrer); });
  ouvrirModale({ titre: t[0], sousTitre: t[1], corps: corps, pied: [bouton('Annuler', '', null, fermerModale), enregistrer], focus: zoneExistant ? 'fPrenom' : null });
}

function lireDateChamp(id) {

  var r = analyserSaisieDate(el ? el.value : '');
  if (r.erreur) { marquerInvalide(id, r.erreur); return null; }

async function validerFormPersonne(o, etatForm, btn) {
  var val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var existant = etatForm.existant ? parseInt(etatForm.existant, 10) : 0;
  var v = null;
  if (!existant) {
    if (!val('fPrenom') && !val('fNom')) { marquerInvalide('fPrenom', 'Indiquez au moins un prénom ou un nom.'); return; }
    var n = lireDateChamp('fNaissance'); if (!n) { return; }
    var decede = document.getElementById('fDecede').checked;
    var d = decede ? lireDateChamp('fDeces') : { date: null, approx: false }; if (!d) { return; }
    if (colonnePersEstDate('naissance') && n.date && (!n.date.j || n.approx)) { marquerInvalide('fNaissance', 'La colonne de votre table attend une date complète : jour, mois et année.'); return; }
    if (n.date && d.date && comparerDates(d.date, n.date) < 0) { marquerInvalide('fDeces', 'Le décès ne peut pas précéder la naissance.'); return; }
    v = { prenom: val('fPrenom'), nom: val('fNom'), nomNaissance: val('fNomNaissance'), sexe: val('fSexe'),
      naissance: n.date, naissanceApprox: n.approx, naissanceLieu: val('fNaissanceLieu'), residence: val('fResidence'), profession: val('fProfession'),
      decede: decede, deces: decede ? d.date : null, decesApprox: decede ? d.approx : false, decesLieu: decede ? val('fDecesLieu') : '', notes: val('fNotes'), verifiee: document.getElementById('fVerifiee').checked, aVerifier: document.getElementById('fAVerifier').checked };
    if (document.getElementById('fFiliation')) { v.filiation = val('fFiliation'); }
  }
  var debutUnion = null;
  if (o.mode === 'conjoint' && !modeColonnes()) { var du = lireDateChamp('fDebutUnion'); if (!du) { return; } debutUnion = du.date; }
  btn.disabled = true;
  afficherLoader('Enregistrement…');
  try {
    if (v && etatForm.nouvellePhoto) {
      afficherLoader('Envoi de la photo…');
      var idPhoto = await envoyerPhoto(etatForm.nouvellePhoto);
      v.photo = [idPhoto];
    } else if (v && o.mode === 'modifier') {
      v.photo = etatForm.photo ? [etatForm.photo] : [];
    }
    var cible = existant;
    var message = '';
    if (o.mode === 'modifier') {
      await modifierPersonne(o.id, v);
      cible = o.id;
      message = nomComplet({ prenom: v.prenom, nom: v.nom }) + ' : modifications enregistrées.';
    } else {
      if (!cible) { cible = await ajouterPersonne(v); }
      await relier(o, cible, { type: val('fTypeUnion'), debut: debutUnion, separes: document.getElementById('fSepares') ? document.getElementById('fSepares').checked : false, autre: val('fAutreParent') });
      message = (v ? nomComplet({ prenom: v.prenom, nom: v.nom }) : nomComplet(pers(cible))) + (existant ? ' : lien ajouté.' : ' est dans l’arbre.');
      if (o.premiere && cible) { etat.config.centre = cible; await ecrireConfig(etat.config); }
    }
    masquerLoader();
    fermerModale();
    await apresEcriture(message, cible);
  } catch (e) {
    masquerLoader();
    btn.disabled = false;
    if (e && e.message === 'LIEN') { return; }
    afficherErreur(messageEchec(e, 'L’enregistrement a échoué. Réessayez.'), e);
  }
}

/* Crée le lien de parenté entre la personne de départ et la personne
   ajoutée ou choisie. */
async function relier(o, cible, opt) {
  var de = pers(o.de);
  var cu = etat.config.colsUnions;
  if (o.mode === 'seule' || !de) { return; }
  if (o.mode === 'parent' && modeColonnes()) {
    var cp = etat.config.cols;
    var xp = {};
    if (!pers(de.p1)) { xp[cp.parent1] = cible; }
    else if (!pers(de.p2)) { xp[cp.parent2] = cible; }
    else { afficherErreur('Deux parents sont déjà indiqués pour ' + nomComplet(de) + '.'); throw new Error('LIEN'); }
    await agir([['UpdateRecord', etat.config.tables.pers, de.id, xp]]);
  } else if (o.mode === 'parent') {
    var u = unionDe(de.parents);
    if (!u) {
      var nu = await ajouterUnion({ a: cible });
      await modifierPersonne(de.id, { parents: nu });
    } else if (!u.a) {
      await modifierUnion(u.id, { a: cible });
    } else if (!u.b) {
      var x = {};
      x[u.inverse ? cu.a : cu.b] = cible;
      await agir([['UpdateRecord', etat.config.tables.unions, u.id, x]]);
    } else {
      afficherErreur('Deux parents sont déjà indiqués pour ' + nomComplet(de) + '.');
      throw new Error('LIEN');
    }
  } else if (o.mode === 'conjoint') {
    if (unionsPersonne(de.id).some(function (uid) { return conjointDans(uid, de.id) === cible; })) {
      afficherErreur('Cette union existe déjà.');
      throw new Error('LIEN');
    }
    await ajouterUnion({ a: de.id, b: cible, type: opt.type || '', debut: opt.debut, separes: !!opt.separes });
  } else if (o.mode === 'enfant') {
    var uid = 0;
    if (opt.autre && opt.autre.charAt(0) === 'u') { uid = parseInt(opt.autre.slice(1), 10); }
    if (!uid) {
      var seule = unionsPersonne(de.id).filter(function (x) { return !conjointDans(x, de.id); })[0];
      uid = seule || await ajouterUnion({ a: de.id });
    }
    await lierParents(cible, uid);
  } else if (o.mode === 'fratrie') {
    var uf = de.parents;
    if (!uf && modeColonnes()) {
      afficherErreur('Indiquez d’abord un parent de ' + nomComplet(de) + ' : ses frères et sœurs seront rattachés à ce parent.');
      throw new Error('LIEN');
    }
    if (!uf) {
      uf = await ajouterUnion({});
      await modifierPersonne(de.id, { parents: uf });
    }
    await lierParents(cible, uf);
  }
}

async function lierParents(pid, uid) {
  var p = pers(pid);
  if (p && p.parents && p.parents !== uid) {
    afficherErreur(nomComplet(p) + ' a déjà des parents indiqués : modifiez d’abord sa fiche.');
    throw new Error('LIEN');
  }
  await modifierPersonne(pid, { parents: uid });
}

/* Suppression d'une personne : ses unions perdent ce partenaire (une union
   devenue vide et sans enfant est supprimée) ; ses enfants restent. */
async function supprimerPersonne(pid) {
  var p = pers(pid);
  var ok = await confirmerAction('Supprimer ' + nomComplet(p) + ' ?', 'Sa fiche et sa photo dans l’arbre seront supprimées. Ses enfants et ses proches restent dans l’arbre. Cette action ne peut pas être annulée depuis le widget.', 'Supprimer');
  if (!ok) { return; }
  var cu = etat.config.colsUnions;
  var actions = [];
  if (modeColonnes()) {
    var cc = etat.config.cols;
    etat.donnees.ordre.forEach(function (q) {
      if (q === pid) { return; }
      var pq = pers(q);
      var x = {};
      if (pq.p1 === pid && cc.parent1) { x[cc.parent1] = 0; }
      if (pq.p2 === pid && cc.parent2) { x[cc.parent2] = 0; }
      if (cc.conjoints && infoColonne(etat.config.tables.pers, cc.conjoints) && pq.conjoints.indexOf(pid) !== -1) { x[cc.conjoints] = ['L'].concat(pq.conjoints.filter(function (z) { return z !== pid; })); }
      if (Object.keys(x).length) { actions.push(['UpdateRecord', etat.config.tables.pers, q, x]); }
    });
  } else unionsPersonne(pid).forEach(function (uid) {
    var u = unionDe(uid);
    var autre = conjointDans(uid, pid);
    if (!autre && !enfantsUnion(uid).length) { actions.push(['RemoveRecord', etat.config.tables.unions, uid]); return; }
    var x = {};
    var colA = u.inverse ? cu.b : cu.a;
    var colB = u.inverse ? cu.a : cu.b;
    if (u.a === pid) { x[colA] = 0; } else { x[colB] = 0; }
    actions.push(['UpdateRecord', etat.config.tables.unions, uid, x]);
  });
  etat.donnees.cousins.forEach(function (c) {
    if (c.ancetre === pid) { var y = {}; y[etat.config.colsCousins.ancetre] = 0; actions.push(['UpdateRecord', etat.config.tables.cousins, c.id, y]); }
  });
  actions.push(['RemoveRecord', etat.config.tables.pers, pid]);
  afficherLoader('Suppression…');
  try {
    await agir(actions);
    if (etat.centreSession === pid) { etat.centreSession = null; }
    if (etat.config.centre === pid) {
      var reste = etat.donnees.ordre.filter(function (x) { return x !== pid; });
      etat.config.centre = parentsDe(pid)[0] || tousEnfants(pid)[0] || reste[0] || 0;
      try { await ecrireConfig(etat.config); } catch (e2) { logSecurite('WARNING', 'Centre non mis à jour', e2); }
    }
    masquerLoader();
    fermerFiche(true);
    await apresEcriture('Fiche de ' + nomComplet(p) + ' supprimée.', null);
  } catch (e) {
    masquerLoader();
    afficherErreur(messageEchec(e, 'La suppression a échoué.'), e);
  }
}

/* === SECTION : VUE ASCENDANCE (éventail) === */
function rendreAscendance(zone) {
  var page = creer('div', { classe: 'page' });
  zone.appendChild(page);
  if (!etat.donnees.ordre.length) { rendreArbre(zone); return; }
  var centre = idCentre();
  var pc = pers(centre);
  var G = etat.genEventail || Math.max(3, Math.min(5, etat.config.affichage.ascendants || 4));
  var selG = liste('genEventail', [2, 3, 4, 5, 6].map(function (n) { return { valeur: n, libelle: n + ' générations' }; }), G);
  selG.addEventListener('change', function () { etat.genEventail = parseInt(selG.value, 10); rendre(); });
  /* Places : niveau 0 = centre ; aux places 2j et 2j+1 du niveau k, les
     parents de la place j du niveau k-1. */
  var places = [[centre]];
  var connus = 0;
  for (var k = 1; k <= G; k++) {
    var niveau = [];
    places[k - 1].forEach(function (pid) {
      var par = pid ? unionDe(pers(pid).parents) : null;
      niveau.push(par && par.a ? par.a : 0);
      niveau.push(par && par.b ? par.b : 0);
    });
    niveau.forEach(function (x) { if (x) { connus++; } });
    places.push(niveau);
  }
  var possibles = Math.pow(2, G + 1) - 2;
  page.appendChild(creer('div', { classe: 'page__tete' }, [
    creer('h2', { classe: 'page__titre' }, ['Ascendance de ' + nomComplet(pc), badge(connus + ' ancêtres connus sur ' + possibles)]),
    creer('div', { classe: 'champ no-print', attrs: { style: 'min-width:11rem' } }, [creer('label', { classe: 'sr', texte: 'Nombre de générations', attrs: { 'for': 'genEventail' } }), selG])
  ]));
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 1000 540');
  svg.setAttribute('class', 'eventail');
  svg.setAttribute('role', 'group');
  svg.setAttribute('aria-label', 'Éventail des ancêtres de ' + nomComplet(pc));
  var cx = 500, cy = 520, r0 = 78, rmax = 505;
  var largeurAnneau = (rmax - r0) / G;
  var couleurs = { a: ['#FDE7CF', '#8A4200'], b: ['#DCF4EB', '#005E3A'] };
  var arc = function (r1, r2, a1, a2) {
    var p = function (r, a) { return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); };
    var grand = a2 - a1 > Math.PI ? 1 : 0;
    return 'M' + p(r1, a1) + ' L' + p(r2, a1) + ' A' + r2 + ' ' + r2 + ' 0 ' + grand + ' 1 ' + p(r2, a2) + ' L' + p(r1, a2) + ' A' + r1 + ' ' + r1 + ' 0 ' + grand + ' 0 ' + p(r1, a1) + ' Z';
  };
  var activer = function (g, action) {
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.addEventListener('click', action);
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); action(); } });
  };
  for (var k2 = 1; k2 <= G; k2++) {
    var n = Math.pow(2, k2);
    var ouv = Math.PI / n;
    var r1 = r0 + (k2 - 1) * largeurAnneau, r2 = r1 + largeurAnneau;
    for (var j = 0; j < n; j++) {
      var pid = places[k2][j];
      var enfant = places[k2 - 1][Math.floor(j / 2)];
      var a1 = Math.PI + j * ouv, a2 = a1 + ouv;
      var cote = j < n / 2 ? 'a' : 'b';
      var g = document.createElementNS(ns, 'g');
      var chemin = document.createElementNS(ns, 'path');
      chemin.setAttribute('d', arc(r1, r2, a1, a2));
      if (!pid) {
        if (!enfant) { continue; }
        chemin.setAttribute('class', 'secteur secteur--vide');
        g.appendChild(chemin);
        if (etat.peutModifier) {
          (function (de) {
            g.setAttribute('aria-label', 'Ajouter un parent à ' + nomComplet(pers(de)));
            activer(g, function () { ouvrirFormPersonne({ mode: 'parent', de: de }); });
          })(enfant);
          var am0 = (a1 + a2) / 2, rm0 = (r1 + r2) / 2;
          var plus = document.createElementNS(ns, 'text');
          plus.setAttribute('x', (cx + rm0 * Math.cos(am0)).toFixed(1));
          plus.setAttribute('y', (cy + rm0 * Math.sin(am0) + 6).toFixed(1));
          plus.setAttribute('text-anchor', 'middle');
          plus.setAttribute('font-size', k2 > 4 ? '14' : '18');
          plus.setAttribute('fill', '#5E5E70');
          plus.textContent = '+';
          g.appendChild(plus);
        }
        svg.appendChild(g);
        continue;
      }
      var p = pers(pid);
      chemin.setAttribute('class', 'secteur');
      chemin.setAttribute('fill', couleurs[cote][0]);
      g.appendChild(chemin);
      (function (id) {
        g.setAttribute('aria-label', nomComplet(pers(id)) + (periodeVie(pers(id)) ? ', ' + periodeVie(pers(id)) : '') + ', ' + libelleGeneration(-k2) + '. Ouvrir la fiche');
        activer(g, function () { ouvrirFiche(id); });
      })(pid);
      /* Texte : tangentiel dans les deux premiers anneaux, rayonnant ensuite */
      var am = (a1 + a2) / 2, rm = (r1 + r2) / 2;
      var deg = am * 180 / Math.PI;
      var rot = k2 <= 2 ? deg + 90 : (deg > 270 ? deg : deg + 180);
      var tx = cx + rm * Math.cos(am), ty = cy + rm * Math.sin(am);
      var taille = k2 <= 2 ? 15 : (k2 === 3 ? 13 : (k2 === 4 ? 11 : 9.5));
      var maxCar = k2 <= 2 ? 22 : Math.max(8, Math.floor(largeurAnneau / (taille * 0.55)));
      var couper = function (s) { return s.length > maxCar ? s.slice(0, maxCar - 1) + '…' : s; };
      var lignes = k2 >= 5 ? [couper(p.prenom || nomComplet(p)), couper(p.nom)] : [couper(p.prenom), couper(p.nom), periodeVie(p)];
      lignes = lignes.filter(function (x) { return x; });
      var texte = document.createElementNS(ns, 'text');
      texte.setAttribute('transform', 'translate(' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ') rotate(' + rot.toFixed(1) + ')');
      texte.setAttribute('text-anchor', 'middle');
      texte.setAttribute('font-size', taille);
      texte.setAttribute('fill', couleurs[cote][1]);
      lignes.forEach(function (l, i) {
        var t = document.createElementNS(ns, 'tspan');
        t.setAttribute('x', '0');
        t.setAttribute('dy', i === 0 ? (-(lignes.length - 1) * taille * 0.6 + taille * 0.35).toFixed(1) : (taille * 1.2).toFixed(1));
        if (i === 0) { t.setAttribute('font-weight', '700'); }
        t.textContent = l;
        texte.appendChild(t);
      });
      g.appendChild(texte);
      svg.appendChild(g);
    }
  }
  var gc = document.createElementNS(ns, 'g');
  var cercle = document.createElementNS(ns, 'path');
  cercle.setAttribute('d', 'M' + (cx - r0) + ' ' + cy + ' A' + r0 + ' ' + r0 + ' 0 0 1 ' + (cx + r0) + ' ' + cy + ' Z');
  cercle.setAttribute('class', 'secteur');
  cercle.setAttribute('fill', '#FFF6E6');
  gc.appendChild(cercle);
  var tc = document.createElementNS(ns, 'text');
  tc.setAttribute('x', cx); tc.setAttribute('y', cy - 30); tc.setAttribute('text-anchor', 'middle'); tc.setAttribute('font-size', '15'); tc.setAttribute('font-weight', '700'); tc.setAttribute('fill', '#7A4F00');
  tc.textContent = (pc.prenom || nomComplet(pc)).slice(0, 14);
  gc.appendChild(tc);
  gc.setAttribute('aria-label', nomComplet(pc) + ', au centre. Ouvrir la fiche');
  activer(gc, function () { ouvrirFiche(centre); });
  svg.appendChild(gc);
  page.appendChild(svg);
  var br = calculerBranches(centre);

function prochaineOccurrence(m, j, ref) {
  var annee = ref.getFullYear();
  var d = new Date(annee, m - 1, j);
  if (d.getMonth() !== m - 1) { d = new Date(annee, m - 1, 28); }
  var debutJour = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  if (d < debutJour) { d = new Date(annee + 1, m - 1, j); }
  return d;
}

/* Import groupé : une page de correspondances copiée depuis le site est
   découpée en fiches (une fiche commence par le nom, suivi de la ligne
   « Âge » ou « De »). Les cousins déjà présents (même prénom et même nom)
   sont ignorés. Rien n'est écrit avant « Ajouter ». */
function decouperFichesADN(texte) {
  var lignes = String(texte || '').replace(/\r/g, '').split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l; });
  var debuts = [];
  lignes.forEach(function (l, i) {
    if (i > 0 && /^([ÂA]ge|De|From)\s*:/i.test(l) && !/:/.test(lignes[i - 1]) && /^[\p{L}'’ .\-\[\]]{2,80}$/u.test(lignes[i - 1])) {
      var d = i - 1;
      if (debuts.length && debuts[debuts.length - 1] === d) { return; }
      debuts.push(d);
    }
  });
  return debuts.map(function (d, k) { return lignes.slice(d, k + 1 < debuts.length ? debuts[k + 1] : lignes.length).join('\n'); })
    .map(analyserFicheADN).filter(function (r) { return (r.prenom || r.nom) && (r.cm || r.pays || r.relation); });
}

    res.appendChild(apercu);

function chargerLeaflet() {

    if (window.L && window.L.map) { ok(window.L); return; }
    var lien = document.createElement('link');
    lien.rel = 'stylesheet';
    lien.href = LEAFLET.css;
    lien.integrity = LEAFLET.cssSri;

/* Lieux à placer : membres de la famille selon le lieu choisi, cousins ADN
   selon leur ville et leur pays. */
function lieuxAPlacer() {
  var mode = etat.carteMode || 'residence';
  var lieux = {};
  var ajouter = function (nom, quoi) {
    nom = String(nom || '').trim();
    if (!nom) { return; }
    var k = normaliser(nom);
    if (!lieux[k]) { lieux[k] = { nom: nom, cle: k, personnes: [], cousins: [] }; }
    lieux[k][quoi.type].push(quoi.id);
  };
  etat.donnees.ordre.map(pers).forEach(function (p) {
    var l = mode === 'naissance' ? p.naissanceLieu : (mode === 'deces' ? p.decesLieu : (estDecede(p) ? '' : p.residence));
    ajouter(l, { type: 'personnes', id: p.id });
  });
  if (etat.carteCousins !== false) {
    etat.donnees.cousins.forEach(function (c) {
      var l = [c.ville, c.pays].filter(function (x) { return x; }).join(', ');
      ajouter(l, { type: 'cousins', id: c.id });
    });
  }
  return Object.keys(lieux).map(function (k) { return lieux[k]; }).sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
}

async function geocoderManquants(lieux, rappel) {
  lieux.forEach(function (l) { if (!etat.lieux[l.cle] && _fileGeo.indexOf(l.nom) === -1) { _fileGeo.push(l.nom); } });
  if (_geoEnCours) { return; }
  _geoEnCours = true;
  try {
    while (_fileGeo.length) {
      var nom = _fileGeo.shift();
      var cle = normaliser(nom);
      if (etat.lieux[cle]) { continue; }
      var res = null;
      try {
        var rep = await fetchDelai(URL_GEOCODAGE + '?format=jsonv2&limit=1&accept-language=fr&q=' + encodeURIComponent(nom), { headers: { Accept: 'application/json' } }, 15000);
        if (rep.ok) {
          var j = await rep.json();
          res = Array.isArray(j) && j[0] ? { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) } : { introuvable: true };
          if (res.lat !== undefined && (isNaN(res.lat) || isNaN(res.lon))) { res = { introuvable: true }; }
        }
      } catch (e) { logSecurite('INFO', 'Lieu non situé : réseau', e); etat.lieux[cle] = { introuvable: true, reseau: true }; }
      if (res) {
        etat.lieux[cle] = res;
        if (etat.peutModifier && etat.biblio) {
          try { await agir([['AddRecord', etat.biblio, null, { CLE: 'LIEU:' + cle, VALEUR: JSON.stringify(res), VERSION: VERSION }]]); }
          catch (e2) { logSecurite('INFO', 'Lieu non gardé dans la bibliothèque', e2); }
        }
        if (etat.vue === 'carte' || etat.vue === 'cousins') { rappel(); }
      }
      await new Promise(function (ok) { setTimeout(ok, 1100); });
    }
  } finally {
    _geoEnCours = false;
    if (etat.vue === 'carte') { rappel(); }
  }
}

/* === SECTION : ASSISTANT DE CRÉATION ET PARAMÉTRAGE ===
   Mêmes étapes pour créer un arbre et pour le paramétrer. Création : rien

var ETAPES = ['Général', 'Les tables', 'Les liens', 'Les cartes', 'Affichage', 'Récapitulatif'];

/* Mots qui évoquent chaque information, pour proposer une colonne. */
var INDICES_COLONNES = {
  prenom: ['prenom', 'first', 'given'], nom: ['nom', 'name', 'last', 'surname', 'famille'], nomNaissance: ['naissance nom', 'nom de naissance', 'jeune fille', 'maiden', 'birth name'],
  sexe: ['sexe', 'genre', 'gender', 'sex'], photo: ['photo', 'portrait', 'image', 'picture'], naissance: ['naissance', 'birth', 'ne le', 'date de naissance', 'dob'],
  naissanceApprox: ['naissance approx'], naissanceLieu: ['lieu de naissance', 'naissance lieu', 'birthplace', 'birth place'], residence: ['lieu de vie', 'residence', 'ville', 'adresse', 'city'],
  decede: ['decede', 'deceased', 'mort'], deces: ['deces', 'death', 'mort le'], decesApprox: ['deces approx'], decesLieu: ['lieu de deces', 'deces lieu', 'death place'],

function colonnesCompatibles(tid, ch) {

}

function proposerColonne(tid, ch, prises) {
  var cand = colonnesCompatibles(tid, ch).filter(function (c) { return prises.indexOf(c.colId) === -1; });
  var exact = cand.filter(function (c) { return c.colId.toUpperCase() === ch.id; })[0];
  if (exact) { return exact.colId; }
  var mots = INDICES_COLONNES[ch.cle] || [];
  var meilleur = null;
  cand.forEach(function (c) {
    var l = normaliser(c.label + ' ' + c.colId.replace(/_/g, ' '));

/* Colonnes de liens du mode « colonnes » : deux parents et les conjoints,
   dans la table des personnes elle-même. */
var LIENS_COLONNES = [
  { cle: 'parent1', id: 'PARENT_1', label: 'PARENT 1', nom: 'Premier parent', liste: false, indices: ['parent 1', 'pere', 'father', 'parent1'] },
  { cle: 'parent2', id: 'PARENT_2', label: 'PARENT 2', nom: 'Second parent', liste: false, indices: ['parent 2', 'mere', 'mother', 'parent2'] },
  { cle: 'conjoints', id: 'CONJOINTS', label: 'CONJOINTS', nom: 'Conjoints', liste: true, indices: ['conjoint', 'epou', 'mari', 'spouse', 'partenaire'] }
];
function typeLien(l, tid) { return (l.liste ? 'RefList:' : 'Ref:') + tid; }
function colonnesLien(tid, l) { return colonnesDe(tid).filter(function (c) { return !c.formule && (c.type === 'Ref:' + tid || c.type === 'RefList:' + tid) && (l.liste || c.type === 'Ref:' + tid); }); }
function proposerLien(tid, l, prises) {
  var cand = colonnesLien(tid, l).filter(function (c) { return prises.indexOf(c.colId) === -1; });
  var r = '';
  cand.forEach(function (c) { var t = normaliser(c.label + ' ' + c.colId.replace(/_/g, ' ')); l.indices.forEach(function (m) { if (!r && t.indexOf(m) !== -1) { r = c.colId; } }); });

/* Mode des tables Gristfamily déjà présentes : « colonnes » ou « unions »
   (tables créées par une version précédente). */
/* La table de l'arbre se reconnaît à son nom ET à ses colonnes de liens :

   jamais prise pour celle du widget. */

  var t = trouverTableModele(ID_PERS);
  if (!t) { return null; }
  return infoColonne(t, 'PARENT_1') || infoColonne(t, COL_PARENTS.id) ? t : null;
}

function modeTablesModele() {
  var tp = tableGenealogie();
  if (!tp) { return null; }
  if (infoColonne(tp, 'PARENT_1')) { return 'colonnes'; }
  return infoColonne(tp, COL_PARENTS.id) && trouverTableModele(ID_UNIONS) ? 'unions' : 'colonnes';

function tablesPersonnesPossibles() {

    var sel = liste('map_' + ch.cle, opts, b.cols[ch.cle] || '', { vide: 'Créer la colonne ' + ch.label });
    sel.addEventListener('change', function () { b.cols[ch.cle] = sel.value; changement(); });
    grille.appendChild(creer('label', { classe: 'etiq', texte: ch.nom, attrs: { 'for': 'map_' + ch.cle } }));
    grille.appendChild(dejaCree ? creer('span', { classe: 'indice', texte: 'Colonne ' + b.cols[ch.cle] }) : sel);
  });
  if (b.liens === 'colonnes') {
    LIENS_COLONNES.forEach(function (l) {
      var opts = colonnesLien(b.tablePers, l).map(function (c) { return { valeur: c.colId, libelle: c.label }; });
      var dejaCree = a.mode === 'parametres' && b.cols[l.cle] && !opts.some(function (o) { return o.valeur === b.cols[l.cle]; });
      var sel = liste('map_' + l.cle, opts, b.cols[l.cle] || '', { vide: 'Créer la colonne ' + l.label });
      sel.addEventListener('change', function () { b.cols[l.cle] = sel.value; changement(); });
      grille.appendChild(creer('label', { classe: 'etiq', texte: l.nom, attrs: { 'for': 'map_' + l.cle } }));
      grille.appendChild(dejaCree ? creer('span', { classe: 'indice', texte: 'Colonne ' + b.cols[l.cle] }) : sel);
    });
  }
  z.appendChild(grille);
  if (b.liens === 'colonnes') { z.appendChild(creer('p', { classe: 'indice', texte: 'Parents et conjoints : colonnes de type Référence vers « ' + libelleTable(b.tablePers) + ' » elle-même. Une colonne de texte (« Martin Jean ») ne peut pas servir de lien.', attrs: { style: 'margin:0;max-width:44rem' } })); }
}

/* === SECTION : DÉFINITIONS DES TABLES DU MODÈLE === */
function defPersonnes(idUnions) {
  return { id: ID_PERS, libelle: LABEL_PERS, colonnes: CHAMPS_PERS.map(function (c) { return { id: c.id, type: c.type, label: c.label, choix: c.choix }; })
    .concat([{ id: COL_PARENTS.id, type: 'Ref:' + idUnions, label: COL_PARENTS.label }, { id: COL_NOM_COMPLET.id, type: 'Text', label: COL_NOM_COMPLET.label, formula: COL_NOM_COMPLET.formula, calculee: true }])
    .concat(COLONNES_META) };
}

function defPersonnesSeule() {
  return { id: ID_PERS, libelle: LABEL_PERS, colonnes: CHAMPS_PERS.map(function (c) { return { id: c.id, type: c.type, label: c.label, choix: c.choix }; })
    .concat([{ id: COL_NOM_COMPLET.id, type: 'Text', label: COL_NOM_COMPLET.label, formula: COL_NOM_COMPLET.formula, calculee: true }])
    .concat(COLONNES_META) };
}

/* Colonnes de liens (parents, conjoints) : reprises si choisies, sinon
   ajoutées. Renvoie { parent1, parent2, conjoints } -> identifiants. */
async function completerLiens(tPers, choisies) {
  var res = {};
  await chargerMeta();
  var affichage = infoColonne(tPers, 'NOM_COMPLET') ? 'NOM_COMPLET' : (choisies && choisies.nom) || 'NOM';
  for (var i = 0; i < LIENS_COLONNES.length; i++) {
    var l = LIENS_COLONNES[i];
    var voulu = choisies ? choisies[l.cle] : (infoColonne(tPers, l.id) ? l.id : '');
    if (voulu && infoColonne(tPers, voulu)) { res[l.cle] = voulu; continue; }
    afficherLoader('Ajout de la colonne ' + l.label + '…');
    res[l.cle] = await ajouterColonne(tPers, colonneLibre(tPers, l.id), typeLien(l, tPers), l.label);
    await poserAffichageRef(tPers, res[l.cle], tPers, affichage);
  }
  return res;
}

function defUnions(idPers, avecCouple) {
  var cols = CHAMPS_UNIONS.map(function (c) { return { id: c.id, type: c.type === 'REF_PERS' ? 'Ref:' + idPers : c.type, label: c.label, choix: c.choix }; });
  if (avecCouple) { cols.push({ id: COL_COUPLE.id, type: 'Text', label: COL_COUPLE.label, formula: '" et ".join([p.NOM_COMPLET for p in [$PERSONNE_A, $PERSONNE_B] if p])', calculee: true }); }
  return { id: ID_UNIONS, libelle: LABEL_UNIONS, colonnes: cols.concat(COLONNES_META) };
}

function defCousins(idPers) {
  return { id: ID_COUSINS, libelle: LABEL_COUSINS, colonnes: CHAMPS_COUSINS.map(function (c) { return { id: c.id, type: c.type === 'REF_PERS' ? 'Ref:' + idPers : c.type, label: c.label, choix: c.choix }; }).concat(COLONNES_META) };
}

/* Colonnes du modèle manquantes dans une table réutilisée (version
   antérieure du widget) : ajoutées, jamais modifiées. */
async function completerColonnes(tid, defs) {
  for (var i = 0; i < defs.length; i++) {
    var c = defs[i];
    if (infoColonneSansCasse(tid, c.id) || c.calculee || IDS_META.indexOf(c.id) !== -1) { continue; }
    try { await ajouterColonne(tid, c.id, c.type, c.label, c.choix); } catch (e) { logSecurite('WARNING', 'Colonne ' + c.id + ' non ajoutée', e); }
  }
}

function colonneLibre(tid, base) {
  var id = base;
  var n = 2;
  while (infoColonne(tid, id)) { id = base + '_' + n; n++; }
  return id;
}

/* Colonnes réelles d'une table de cousins déjà remplie : noms d'un export
   MyHeritage d'abord, puis la colonne du modèle quelle que soit sa casse. */
var ALIAS_COUSINS = { prenom: ['Cousin_ADN'], cm: ['ADN_partage_cM_'], tailleArbre: ['Taille_de_son_arbre_personnes_'] };
function colonnesCousins(tc) {
  var o = {};
  CHAMPS_COUSINS.forEach(function (ch) {
    var alias = (ALIAS_COUSINS[ch.cle] || []).map(function (a) { return infoColonneSansCasse(tc, a); }).filter(function (x) { return x; })[0];
    var col = alias || infoColonneSansCasse(tc, ch.id);
    o[ch.cle] = col ? col.colId : ch.id;
  });
  return o;
}

async function assurerCousins(idPers) {
  var tc = trouverTableModele(ID_COUSINS);
  if (tc) { await completerColonnes(tc, defCousins(idPers).colonnes); return tc; }
  tc = (await creerTables([defCousins(idPers)]))[0];
  await poserAffichageRef(tc, 'ANCETRE_PROBABLE', idPers, infoColonne(idPers, 'NOM_COMPLET') ? 'NOM_COMPLET' : (etat.config ? etat.config.cols.nom : 'NOM'));
  return tc;
}

/* === SECTION : CRÉATION DE L'ARBRE === */
async function creerArbre() {
  var b = etat.assistant.b;
  if (!b.nom.trim()) { allerEtape(1); signalerEtape(); return; }
  var btn = document.getElementById('btnCreer');
  if (btn) { btn.disabled = true; }
  afficherLoader('Création de l’arbre…');
  try {
    await assurerBibliotheque();
    await lireBibliotheque();
    await poserTemoins();
    await chargerMeta();
    var tPers, tUnions;
    var cols;
    if (b.source === 'modele' && b.liens === 'colonnes') {
      tPers = tableGenealogie();
      if (!tPers) {
        tPers = (await creerTables([defPersonnesSeule()]))[0];
      }
      await chargerMeta();
      await completerColonnes(tPers, defPersonnesSeule().colonnes);
      await completerLiens(tPers, null);
      cols = idsParDefaut(CHAMPS_PERS);
      LIENS_COLONNES.forEach(function (l) { cols[l.cle] = l.id; });
      tUnions = null;
    } else if (b.source === 'modele') {
      tPers = tableGenealogie();
      tUnions = trouverTableModele(ID_UNIONS);
      if (!tPers) {
        var dU = defUnions(ID_PERS, true);
        dU.id = idTableLibre(ID_UNIONS);
        var dP = defPersonnes(dU.id);
        var ids = await creerTables([dP, dU]);
        tPers = ids[0]; tUnions = ids[1];
        await poserAffichageRef(tUnions, 'PERSONNE_A', tPers, 'NOM_COMPLET');
        await poserAffichageRef(tUnions, 'PERSONNE_B', tPers, 'NOM_COMPLET');
        await poserAffichageRef(tPers, 'PARENTS', tUnions, 'COUPLE');
      } else if (tPers && !tUnions) {
        tUnions = (await creerTables([defUnions(tPers, !!infoColonne(tPers, 'NOM_COMPLET'))]))[0];
        await completerColonnes(tPers, [{ id: COL_PARENTS.id, type: 'Ref:' + tUnions, label: COL_PARENTS.label }]);
      }
      await chargerMeta();
      await completerColonnes(tPers, defPersonnes(tUnions).colonnes);
      await completerColonnes(tUnions, defUnions(tPers, false).colonnes);
      cols = idsParDefaut(CHAMPS_PERS);
      cols.parents = COL_PARENTS.id;
    } else {
      tPers = b.tablePers;
      cols = {};
      for (var i = 0; i < CHAMPS_PERS.length; i++) {
        var ch = CHAMPS_PERS[i];
        if (b.cols[ch.cle]) { cols[ch.cle] = b.cols[ch.cle]; continue; }
        afficherLoader('Ajout de la colonne ' + ch.label + '…');
        cols[ch.cle] = await ajouterColonne(tPers, colonneLibre(tPers, ch.id), ch.type, ch.label, ch.choix);
        await chargerMeta();
      }
      if (b.liens === 'colonnes') {
        var lc = await completerLiens(tPers, b.cols);
        Object.keys(lc).forEach(function (k) { cols[k] = lc[k]; });
        tUnions = null;
      } else {
      cols.parents = '';
      tUnions = trouverTableModele(ID_UNIONS);
      var refA = tUnions ? infoColonne(tUnions, 'PERSONNE_A') : null;
      if (!tUnions || !refA || refA.type !== 'Ref:' + tPers) {
        await chargerMeta();
        var def = defUnions(tPers, false);
        def.id = idTableLibre(ID_UNIONS);
        def.libelle = tUnions ? LABEL_UNIONS.replace(' ⚡', ' ' + libelleTable(tPers).toUpperCase() + ' ⚡') : LABEL_UNIONS;
        tUnions = (await creerTables([def]))[0];
      }
      var parents = colonnesDe(tPers).filter(function (c) { return c.type === 'Ref:' + tUnions && !c.formule; })[0];
      cols.parents = parents ? parents.colId : await ajouterColonne(tPers, colonneLibre(tPers, COL_PARENTS.id), 'Ref:' + tUnions, COL_PARENTS.label);
      await poserAffichageRef(tUnions, 'PERSONNE_A', tPers, cols.nom);
      await poserAffichageRef(tUnions, 'PERSONNE_B', tPers, cols.nom);
      }
    }
    await chargerMeta();
    var tCousins = null;
    if (b.affichage.cousins) { afficherLoader('Préparation des cousins ADN…'); tCousins = await assurerCousins(tPers); }
    var cfg = completerConfig({ cle: 'ARBRE:' + Date.now().toString(36), nom: b.nom.trim(), cree: Date.now(), source: b.source, liens: b.liens,
      tables: { pers: tPers, unions: tUnions, cousins: tCousins }, cols: cols, affichage: b.affichage, centre: 0 });
    if (tCousins) { await chargerMeta(); cfg.colsCousins = colonnesCousins(tCousins); }
    etat.config = cfg;
    if (b.centre.prenom.trim() || b.centre.nom.trim()) {
      var v = { prenom: b.centre.prenom.trim(), nom: b.centre.nom.trim() };
      cfg.centre = await personneExistante(tPers, cols, v) || await ajouterPersonne(v);
    }
    await ecrireConfig(cfg);
    await lireBibliotheque();
    masquerLoader();
    etat.assistant = null;
    await changerArbre(cfg.cle);
    afficherSucces('L’arbre « ' + cfg.nom + ' » est prêt. Ajoutez vos proches avec le bouton « + » des cartes.');
  } catch (e) {
    masquerLoader();
    if (btn) { btn.disabled = false; }
    afficherErreur(messageEchec(e, 'La création de l’arbre a échoué. Rien n’a été supprimé ; vous pouvez réessayer.'), e);
  }
}

/* Paramétrage : enregistrement des changements. */
async function sauvegarderParametres() {
  var a = etat.assistant;
  var cfg = a ? a.cfg : null;
  if (!a || !cfg) { return; }
  var b = a.b;
  var s = document.getElementById('statutSauvegarde');
  if (!b.nom.trim()) { if (s) { s.textContent = 'Le nom de l’arbre est obligatoire : non enregistré.'; } return; }
  if (s) { s.textContent = 'Enregistrement…'; }
  try {
    cfg.nom = b.nom.trim();
    cfg.affichage = b.affichage;
    if (b.centre.id) { cfg.centre = b.centre.id; }
    if (cfg.source === 'existant') {
      await chargerMeta();
      for (var i = 0; i < CHAMPS_PERS.length; i++) {
        var ch = CHAMPS_PERS[i];
        var voulu = b.cols[ch.cle];
        if (voulu) { cfg.cols[ch.cle] = voulu; continue; }
        if (cfg.cols[ch.cle] && infoColonne(cfg.tables.pers, cfg.cols[ch.cle])) { continue; }
        cfg.cols[ch.cle] = await ajouterColonne(cfg.tables.pers, colonneLibre(cfg.tables.pers, ch.id), ch.type, ch.label, ch.choix);
        b.cols[ch.cle] = cfg.cols[ch.cle];
        await chargerMeta();
      }
      if (cfg.liens === 'colonnes') {
        var lc = await completerLiens(cfg.tables.pers, b.cols);
        Object.keys(lc).forEach(function (k) { cfg.cols[k] = lc[k]; b.cols[k] = lc[k]; });
        masquerLoader();
      }
    }
    if (cfg.affichage.cousins && (!cfg.tables.cousins || !etat.meta.tables[cfg.tables.cousins])) {
      await chargerMeta();
      cfg.tables.cousins = await assurerCousins(cfg.tables.pers);
      await chargerMeta();
      cfg.colsCousins = colonnesCousins(cfg.tables.cousins);
    }
    await ecrireConfig(cfg);
    etat.config = cfg;
    a.statut = 'Enregistré.';
    var s2 = document.getElementById('statutSauvegarde');
    if (s2) { s2.textContent = 'Enregistré.'; }
    if (a.etape === 1) { var t = document.querySelector('.assistant__tete h1'); if (t) { t.textContent = 'Paramètres de l’arbre « ' + cfg.nom + ' »'; } }
  } catch (e) {
    var s3 = document.getElementById('statutSauvegarde');
    if (s3) { s3.textContent = 'Non enregistré.'; }
    afficherErreur(messageEchec(e, 'Les paramètres n’ont pas pu être enregistrés.'), e);
  }
}
