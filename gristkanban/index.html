/* Barre d'etapes : un segment par etape, son nom en dessous. Bleu pour les
   etapes faites et l'etape en cours (en gras), gris pour les etapes a
   venir : tout le parcours se lit d'un coup d'oeil. Les lecteurs d'ecran
   entendent l'etat de chaque etape. Sans parcours connu (point de depart
   pas encore choisi), la suite est annoncee "selon votre choix". */
function stepper(n, noms, aller, actionFinale) {
  var d = creer('div', { classe: 'fr-stepper w-stepper' });
  var connu = noms.length > 1;
  d.appendChild(creer('h2', { classe: 'fr-stepper__title', attrs: { tabindex: '-1', id: 'titreVue' } }, [noms[n - 1],
    creer('span', { classe: 'fr-stepper__state', texte: connu ? 'Étape ' + n + ' sur ' + noms.length : 'Étape ' + n })]));
  var liste = noms.slice();
  if (!connu) { liste.push('Suite selon votre choix'); }
  var ol = creer('ol', { classe: 'w-etapes', attrs: { 'aria-label': 'Étapes' } });
  liste.forEach(function (nom, i) {
    var rang = i + 1;
    var etatEtape = rang < n ? 'faite' : (rang === n ? 'en-cours' : 'a-venir');
    /* Une etape deja atteinte (ou toutes, dans les parametrages) se rejoint
       d'un clic ; l'etape en cours et les etapes jamais atteintes ne sont
       pas des liens. */
    var action = rang !== n && aller ? aller(rang) : null;
    var suivante = !!action && rang === n + 1;
    /* Etape faite : coche verte devant son nom. Etape suivante : invitation
       "Continuer". La coche s'ajoute au texte, l'etat reste lu par les
       lecteurs d'ecran. */
    var contenu = [
      creer('span', { classe: 'w-etapes__segment', attrs: { 'aria-hidden': 'true' } }),
      creer('span', { classe: 'w-etapes__ligne' }, [
        etatEtape === 'faite' ? creer('span', { classe: 'fr-icon-checkbox-circle-fill w-etapes__coche', attrs: { 'aria-hidden': 'true' } }) : null,
        creer('span', { classe: 'w-etapes__nom', texte: nom })]),
      creer('span', { classe: 'fr-sr-only', texte: etatEtape === 'faite' ? ' (terminée)' : (etatEtape === 'en-cours' ? ' (en cours)' : ' (à venir)') }),
      suivante ? creer('span', { classe: 'w-etapes__appel' }, ['Continuer', creer('span', { classe: 'fr-icon-arrow-right-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } })]) : null];
    var li = creer('li', { classe: 'w-etapes__item w-etapes__item--' + etatEtape + (action ? ' w-etapes__item--lien' : '') + (suivante ? ' w-etapes__item--suivante' : '') },
      action ? [creer('button', { classe: 'w-etapes__bouton', id: 'kEtape' + rang, attrs: { type: 'button' }, clic: action }, contenu)] : contenu);
    if (etatEtape === 'en-cours') { li.setAttribute('aria-current', 'step'); }
    ol.appendChild(li);
  });
  /* A la derniere etape, l'action finale (creer, brancher, enregistrer)
     prend place au bout de la ligne des etapes, la ou se trouve d'habitude
     "Continuer". */
  d.appendChild(actionFinale ? creer('div', { classe: 'w-etapes-rangee' }, [ol,
    bouton(actionFinale.libelle, null, 'check-line', actionFinale.action, { id: actionFinale.id, classe: 'w-etapes-action' })]) : ol);
  return d;
}

/* === SECTION : DOCUMENT SANS KANBAN ===
   Un document qui n'a encore aucun Kanban s'ouvre directement sur l'onglet
   "Nouveau Kanban" : barre d'etapes et choix du point de depart. */
function ouvrirNouveauKanban() {
  if (!etat.peutParametrer) { afficherVue('aucun'); return; }
  etat.brouillon = { mode: 'creation', etape: 0 };
  afficherVue('assistant');
}

/* === SECTION : SAISIES ET RECAPITULATIFS === */
/* Saisie refusee : message d'erreur du systeme de design sous le champ, relie
   par aria-describedby, focus sur le champ et annonce. Ce n'est pas une
   anomalie : journalisation au niveau INFO. */
function marquerInvalide(id, message, sansFocus) {
  var n = document.getElementById(id);
  logSecurite('INFO', 'Saisie refusée : ' + message);
  if (!n) { signalerSaisie(message); return; }
  var idMsg = id + '_erreur';
  var ancien = document.getElementById(idMsg);
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  var msg = creer('p', { classe: 'fr-error-text', id: idMsg, texte: message });
  var groupe = n.closest ? n.closest('.fr-input-group') : null;
  if (groupe) { groupe.classList.add('fr-input-group--error'); groupe.appendChild(msg); }
  else if (n.parentNode) { n.parentNode.insertBefore(msg, n.nextSibling); }
  n.setAttribute('aria-invalid', 'true');
  n.setAttribute('aria-describedby', idMsg);
  var effacer = function () {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
    if (groupe) { groupe.classList.remove('fr-input-group--error'); }
    if (msg.parentNode) { msg.parentNode.removeChild(msg); }
    n.removeEventListener('input', effacer);
    n.removeEventListener('change', effacer);
  };
  n.addEventListener('input', effacer);
  n.addEventListener('change', effacer);
  if (!sansFocus) { n.focus(); }
  annoncer(message);
}

/* Refus de saisie sans champ a designer : banniere, sans niveau ERREUR. */
function signalerSaisie(message) {
  logSecurite('INFO', 'Saisie refusée : ' + message);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function recap(titre, lignes, allerA) {
  return creer('section', { classe: 'w-recap', attrs: { 'aria-label': titre } }, [
    creer('div', { classe: 'w-recap__tete' }, [creer('h3', { texte: titre }),
      allerA ? bouton('Modifier', 'discret', 'edit-line', allerA, { petit: true, aria: 'Modifier : ' + titre }) : null]),
    creer('ul', {}, lignes.map(function (l) { return creer('li', { texte: l }); }))
  ]);
}

/* === SECTION : ASSISTANT KANBAN (creation et personnalisation) ===
   Un meme parcours en six etapes sert a creer un Kanban et a le
   personnaliser. Tout se fait sur un brouillon : rien n'est ecrit dans le
   document avant la derniere etape, ou les changements sont relus puis
   enregistres en une fois. "Annuler" abandonne le brouillon. */

function uid() { etat.uidSeq = (etat.uidSeq || 0) + 1; return 'u' + etat.uidSeq; }

/* Les nombres entiers, montants et pourcentages sont des nombres : seuls le
   type et le format de la colonne les distinguent. */
function genreStocke(code) { return genreParCode(code).stocke || code; }

function genreAffiche(col, g) {
  if (g !== 'nombre' || !col) { return g; }
  var o = col.options || {};
  if (o.numMode === 'currency') { return 'montant'; }
  if (o.numMode === 'percent') { return 'pourcentage'; }
  if (col.type === 'Int') { return 'entier'; }
  return g;
}

function genreParCode(code) {
  for (var i = 0; i < GENRES.length; i++) { if (GENRES[i].code === code) { return GENRES[i]; } }
  return GENRES[0];
}

function libelleGenre(g, col) {
  for (var i = 0; i < GENRES.length; i++) { if (GENRES[i].code === g) { return GENRES[i].libelle; } }
  return col ? libelleType(col) : 'Autre';
}

function optionsChoix(valeurs) {
  return { choices: valeurs.slice() };
}

function infoVide(libelle, genre) {
  return { uid: uid(), col: null, libelle: libelle || '', libelleInitial: null, genre: genre || 'texte', valeurs: [], valeursInitiales: [],
    echeance: false, responsable: false, supprimee: false, nouvelle: true, utilisee: true, utiliseeInitiale: true,
    surCarte: genre !== 'texte_long', dansFiche: true, typeFixe: false, valeursModifiables: true, peutSupprimer: true, ouverte: false };
}

/* Brouillon a partir d'une definition (modele, Kanban repris, Kanban
   vierge) : uniquement pour la creation. */
function brouillonDepuisDefinition(def) {
  var b = { mode: 'creation', source: 'creation', etape: 1, nom: def.nom || '', description: def.description || '',
    colonnes: [], infos: [], ordreCarte: [], ordreFiche: [], compact: false, recherche: true, filtres: [], filtreRetard: false, tri: null,
    nomsInfos: true, couverture: null, couleur: null,
    colonnesModifiables: true, colonnesOrdonnables: true, origine: def.origine || null, ignores: def.ignores || [] };
  var o = def.options || {};
  def.etapes.forEach(function (n) {
    b.colonnes.push({ uid: uid(), cle: null, nom: n, nomInitial: null, supprimee: false, dest: null, nb: 0 });
  });
  var parLib = {};
  (def.champs || []).forEach(function (ch) {
    var i = infoVide(ch.libelle, ch.genre);
    i.valeurs = (ch.valeurs || []).slice();
    i.echeance = !!ch.echeance && ch.genre === 'date';
    i.responsable = !!ch.responsable;
    if (ch.surCarte !== undefined) { i.surCarte = !!ch.surCarte; }
    if (ch.dansFiche !== undefined) { i.dansFiche = ch.dansFiche !== false; }
    b.infos.push(i);
    parLib[normaliser(ch.libelle)] = i.uid;
  });
  b.ordreCarte = b.infos.map(function (i) { return i.uid; });
  var of = (o.ordreFiche || []).map(function (l) { return parLib[normaliser(l)]; }).filter(Boolean);
  b.ordreFiche = of.concat(b.ordreCarte.filter(function (u) { return of.indexOf(u) === -1; }));
  b.compact = !!o.compact;
  b.recherche = o.recherche !== false;
  b.filtreRetard = o.filtreRetard !== undefined ? !!o.filtreRetard : b.infos.some(function (i) { return i.echeance; });
  if (o.filtres) { b.filtres = o.filtres.map(function (l) { return parLib[normaliser(l)]; }).filter(Boolean); }
  else { b.filtres = b.infos.filter(function (i) { return i.responsable; }).map(function (i) { return i.uid; }); }
  return b;
}

function brouillonVierge() {
  return brouillonDepuisDefinition({ nom: '', etapes: MODELES_ETAPES[0].slice(), champs: [
    { libelle: 'Description', genre: 'texte_long', surCarte: false },
    { libelle: 'Date d\'échéance', genre: 'date', echeance: true },
    { libelle: 'Responsable', genre: 'personne', responsable: true }] });
}

/* Brouillon a partir du Kanban affiche, pour le personnaliser. Pour un
   Kanban branche sur une table, toutes les colonnes de la table sont
   listees ; l'agent choisit celles a utiliser, sans jamais en creer ni en
   supprimer dans sa table. */
function brouillonDepuisConfig() {
  var c = etat.config;
  var src = c.sourceEtapes;
  var creation = c.mode === 'creation';
  var b = { mode: 'personnalisation', source: creation ? 'creation' : 'branche', etape: 1, nom: c.nom || '', description: c.description || '',
    colonnes: [], infos: [], compact: !!c.compact, recherche: c.recherche !== false, filtreRetard: !!c.filtreRetard,
    nomsInfos: c.nomsInfos !== false, couverture: null, couleur: null, historique: !!c.historique, archiveUid: null,
    tri: c.colOrdreCartes ? null : (c.tri ? { col: c.tri.col, sens: c.tri.sens } : { col: c.colTitre, sens: 'asc' }),
    colonnesModifiables: src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colAffichage),
    colonnesOrdonnables: src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colOrdre) };
  etat.etapes.forEach(function (e) {
    b.colonnes.push({ uid: uid(), cle: e.cle, id: e.id, nom: e.libelle, nomInitial: e.libelle,
      supprimee: false, dest: null, nb: cartesDeEtape(e.cle).length });
  });
  var cols;
  if (creation) {
    cols = c.champs.map(function (ch) { return colonneCartes(ch.col); }).filter(Boolean);
  } else {
    cols = colonnesDe(c.tableCartes).filter(function (col) {
      return col.colId !== c.colEtape && col.colId !== c.colTitre && col.colId !== c.colOrdreCartes && IDS_META.indexOf(col.colId) === -1 && IDS_TECHNIQUES.indexOf(col.colId) === -1;
    });
  }
  var parCol = {};
  cols.forEach(function (col) {
    var ch = champDe(col.colId);
    var g = genreAffiche(col, genreDe(col, ch));
    var i = infoVide(ch && ch.libelle ? ch.libelle : col.label, g);
    i.col = col.colId;
    i.libelleInitial = i.libelle;
    i.nouvelle = false;
    i.typeFixe = true;
    i.valeurs = GENRES_A_VALEURS.indexOf(g) !== -1 ? valeursProposees(col.colId) : [];
    i.valeursInitiales = i.valeurs.slice();
    i.valeursModifiables = !col.formule && (col.type === 'Choice' || col.type === 'ChoiceList');
    i.echeance = c.colEcheance === col.colId;
    i.responsable = c.colResponsable === col.colId;
    i.utilisee = !!ch;
    i.utiliseeInitiale = i.utilisee;
    i.surCarte = ch ? !!ch.surCarte : true;
    i.dansFiche = ch ? estDansFiche(ch) : true;
    i.peutSupprimer = creation;
    i.lectureSeule = !estModifiable(col, g);
    b.infos.push(i);
    parCol[col.colId] = i.uid;
  });
  var ordreC = c.champs.map(function (ch) { return parCol[ch.col]; }).filter(Boolean);
  b.ordreCarte = ordreC.concat(b.infos.map(function (i) { return i.uid; }).filter(function (u) { return ordreC.indexOf(u) === -1; }));
  var ordreF = champsOrdreFiche().map(function (ch) { return parCol[ch.col]; }).filter(Boolean);
  b.ordreFiche = ordreF.concat(b.ordreCarte.filter(function (u) { return ordreF.indexOf(u) === -1; }));
  b.filtres = (c.filtres || []).map(function (f) { return parCol[f]; }).filter(Boolean);
  b.couverture = c.couverture ? parCol[c.couverture] || null : null;
  b.couleur = c.couleur ? parCol[c.couleur] || null : null;
  var colArch = c.colonneArchive ? b.colonnes.filter(function (x) { return x.cle === c.colonneArchive; })[0] : null;
  b.archiveUid = colArch ? colArch.uid : null;
  b.initial = JSON.stringify(etatComparable(b));
  b.initCarte = sequenceVisible(b, 'ordreCarte', 'surCarte');
  b.initFiche = sequenceVisible(b, 'ordreFiche', 'dansFiche');
  return b;
}

/* Suite des informations visibles sur la carte ou dans la fiche, dans
   l'ordre : sert a detecter un changement de contenu ou d'ordre. */
function sequenceVisible(b, cle, prop) {
  return b[cle].map(function (u) {
    for (var i = 0; i < b.infos.length; i++) { if (b.infos[i].uid === u) { var x = b.infos[i]; return infoActive(x) && x[prop] ? u : null; } }
    return null;
  }).filter(Boolean).join('|');
}

/* Les champs qui definissent le Kanban, pour savoir si quelque chose a
   change depuis l'ouverture du brouillon. */
function etatComparable(b) {
  return { nom: b.nom, description: b.description, compact: b.compact, recherche: b.recherche, filtreRetard: b.filtreRetard, tri: b.tri,
    nomsInfos: b.nomsInfos, couverture: b.couverture, couleur: b.couleur, historique: !!b.historique, archive: b.archiveUid || null,
    colonnes: b.colonnes.map(function (x) { return [x.cle, x.nom, x.supprimee, x.dest]; }),
    infos: b.infos.map(function (i) { return [i.col, i.libelle, i.genre, i.valeurs, i.echeance, i.responsable, i.supprimee, i.utilisee, i.surCarte, i.dansFiche]; }),
    ordreCarte: b.ordreCarte, ordreFiche: b.ordreFiche, filtres: b.filtres };
}

function infoParUid(u) {
  var b = etat.brouillon;
  for (var i = 0; i < b.infos.length; i++) { if (b.infos[i].uid === u) { return b.infos[i]; } }
  return null;
}

function colonneParUid(u) {
  var b = etat.brouillon;
  for (var i = 0; i < b.colonnes.length; i++) { if (b.colonnes[i].uid === u) { return b.colonnes[i]; } }
  return null;
}

function infoActive(i) { return i && !i.supprimee && i.utilisee; }
function colonnesActives() {
  var b = etat.brouillon;
  var l = b.colonnes.filter(function (x) { return !x.supprimee; });
  /* La colonne d'archives est toujours la derniere. */
  var a = l.filter(function (x) { return x.uid === b.archiveUid; })[0];
  return a ? l.filter(function (x) { return x !== a; }).concat([a]) : l;
}

/* --- Points d'entree --- */
function demarrerCreation() {
  if (!etat.peutParametrer) { return; }
  etat.brouillon = { mode: 'creation', etape: 0 };
  afficherVue('assistant');
}

function ouvrirPersonnalisation() {
  if (!etat.peutParametrer) { return; }
  etat.brouillon = brouillonDepuisConfig();
  afficherVue('assistant');
}

/* Abandon d'une creation : confirmation si une etape a ete commencee. */
async function quitterAssistant() {
  var b = etat.brouillon;
  if (b && b.etape > 0) {
    var ok = await confirmerAction('Abandonner la création ?', 'Rien n\'a été créé. Les choix faits dans ces étapes ne sont pas conservés.', 'Abandonner');
    if (!ok) { return; }
  }
  etat.brouillon = null;
  if (etat.tableaux.length) { await chargerTout(); } else { ouvrirNouveauKanban(); }
}

/* --- Rendu general --- */
function rendreAssistantKanban(zone) {
  var b = etat.brouillon;
  if (b.mode === 'creation' && b.etape === 0) { rendreDepart(zone); return; }
  var bloc = creer('div', { classe: 'w-assistant' });
  var n = b.etape;
  var noms = b.mode === 'creation' ? PARCOURS.modele : ETAPES_PARAMETRAGE;
  var decalage = b.mode === 'creation' ? noms.length - ETAPES_ASSISTANT.length : 0;
  var rang = decalage + n;
  b.etapeMax = Math.max(b.etapeMax || 0, n);
  var finale = b.mode === 'creation' && n === ETAPES_ASSISTANT.length ? { libelle: 'Créer mon Kanban', action: validerAssistant, id: 'kValider' } : null;
  var tete = creer('div', { classe: 'w-assistant__tete' }, [stepper(rang, noms, function (r) {
    if (b.mode === 'creation' && r <= decalage) {
      return function () { b.etape = 0; if (r === 1) { b.choixDepart = null; } afficherVue('assistant'); };
    }
    var cible = r - decalage;
    if (b.mode === 'creation' && cible > b.etapeMax + 1) { return null; }
    return function () { if (cible > n && !validerEtape(n)) { return; } allerEtape(cible); };
  }, finale)]);
  var cote = creer('div', { classe: 'w-assistant__etat' });
  if (b.mode === 'personnalisation') {
    /* Parametrages : enregistrement automatique, etat affiche en continu,
       retour direct au Kanban. */
    cote.appendChild(creer('p', { classe: 'w-mention', id: 'kTitrePerso', texte: 'Paramétrages de « ' + (etat.config.nom || '') + ' »' }));
    cote.appendChild(creer('p', { classe: 'w-mention w-statut', id: 'kStatut', attrs: { role: 'status' },
      texte: b.statut || 'Les modifications sont enregistrées automatiquement.' }));
    cote.appendChild(bouton('Retour au Kanban', 'secondaire', 'arrow-left-line', function () { return sortirParametrages(true); }, { petit: true, id: 'navRetour' }));
  } else {
    cote.appendChild(bouton('Annuler la création', 'tertiaire', 'close-line', quitterAssistant, { petit: true, id: 'navAnnuler' }));
  }
  tete.appendChild(cote);
  bloc.appendChild(tete);
  if (b.origine && n === 1) {
    bloc.appendChild(alerte('info', null, 'Prérempli à partir ' + b.origine + '. Tout reste modifiable.'
      + (b.ignores.length ? ' Non repris, faute d\'équivalent dans un nouveau Kanban : ' + b.ignores.join(', ') + '.' : '')));
  }
  if (n === 1) { bloc.appendChild(etapeKanban()); }
  if (n === 2) { bloc.appendChild(etapeColonnes()); }
  if (n === 3) { bloc.appendChild(etapeInformations()); }
  if (n === 4) { bloc.appendChild(etapeCarte()); }
  if (n === 5) { bloc.appendChild(etapeFiche()); }
  if (n === 6) { bloc.appendChild(etapeFiltres()); }
  if (n === 7) { bloc.appendChild(etapeVerifier()); }
  zone.appendChild(bloc);
}

function allerEtape(n) {
  var b = etat.brouillon;
  if (n < 0) { return; }
  if (n === 0 && b.mode !== 'creation') { return; }
  b.etape = n;
  afficherVue('assistant');
}

/* Rerendu d'une etape apres un changement de structure, focus repose sur
   l'element indique. */
function redessinerEtape(focusId) {
  afficherVue('assistant', true);
  var f = focusId ? document.getElementById(focusId) : null;
  if (f) { f.focus(); } else { var t = document.getElementById('titreVue'); if (t) { t.focus(); } }
}

/* Toute modification dans les parametrages declenche un enregistrement
   automatique differe. En creation, rien n'est ecrit avant la fin. */
function majAttente() {
  var b = etat.brouillon;
  if (b && b.mode === 'personnalisation') { planifierSauvegarde(); }
}

function enParametrage() {
  return etat.vue === 'assistant' && !!etat.brouillon && etat.brouillon.mode === 'personnalisation';
}

function statutSauvegarde(texte, erreur) {
  var b = etat.brouillon;
  if (b) { b.statut = texte; }
  var z = document.getElementById('kStatut');
  if (z) { z.textContent = texte; z.classList.toggle('w-statut--erreur', !!erreur); }
}

function planifierSauvegarde() {
  var b = etat.brouillon;
  clearTimeout(b.minuterie);
  statutSauvegarde('Modification en cours…');
  b.minuterie = setTimeout(function () { relayer(sauvegarderBrouillon(), 'Enregistrement automatique'); }, DELAI_AUTOSAVE_MS);
}

/* Une saisie incomplete n'est pas enregistree : la raison est affichee. */
function raisonNonEnregistrable(b) {
  if (!b.nom.trim()) { return 'le Kanban n\'a pas de nom'; }
  var vus = {};
  var act = b.colonnes.filter(function (x) { return !x.supprimee; });
  if (!act.length) { return 'le Kanban doit garder au moins une colonne'; }
  for (var i = 0; i < act.length; i++) {
    var k = normaliser(act[i].nom);
    if (!k) { return 'une colonne n\'a pas de nom'; }
    if (vus[k]) { return 'deux colonnes portent le nom « ' + act[i].nom.trim() + ' »'; }
    vus[k] = true;
  }
  var noms = { titre: true };
  var infos = b.infos.filter(infoActive);
  for (var j = 0; j < infos.length; j++) {
    var n = normaliser(infos[j].libelle);
    if (!n) { return 'une information n\'a pas de nom'; }
    if (noms[n]) { return 'deux informations portent le nom « ' + infos[j].libelle.trim() + ' »'; }
    noms[n] = true;
  }
  return null;
}

async function sauvegarderBrouillon() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'personnalisation') { return; }
  clearTimeout(b.minuterie);
  if (b.enCours) { b.encore = true; return; }
  if (!compterChangements(b)) { statutSauvegarde(b.dernier ? 'Enregistré à ' + b.dernier : 'Les modifications sont enregistrées automatiquement.'); return; }
  var raison = raisonNonEnregistrable(b);
  if (raison) { statutSauvegarde('Non enregistré : ' + raison + '.', true); return; }
  b.enCours = true;
  statutSauvegarde('Enregistrement…');
  try {
    var cles = await appliquerBrouillon();
    await chargerMeta();
    verifierConfig();
    await reparerColonnesVides(etat.config);
    if (etat.config.historique) { await assurerHistorique(etat.config); }
    await chargerDonnees();
    await lireTableaux();
    consoliderBrouillon(b, cles);
    var d = new Date();
    b.dernier = (d.getHours() < 10 ? '0' : '') + d.getHours() + ' h ' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    if (etat.brouillon === b) {
      statutSauvegarde('Enregistré à ' + b.dernier);
      var t = document.getElementById('kTitrePerso');
      if (t) { t.textContent = 'Paramétrages de « ' + (etat.config.nom || '') + ' »'; }
      var nav = document.querySelector('.w-onglets');
      if (nav && nav.parentNode) { nav.parentNode.replaceChild(ongletsKanbans(), nav); }
    }
  } catch (e) {
    b.enCours = false;
    statutSauvegarde('L\'enregistrement n\'a pas abouti.', true);
    afficherErreur('L\'enregistrement automatique n\'a pas abouti. Les paramétrages affichés ont été relus depuis le document.', e);
    try { await chargerMeta(); verifierConfig(); await chargerDonnees(); } catch (e2) { logSecurite('ERREUR', 'Relecture après échec', e2); }
    if (etat.brouillon === b) { var nb = brouillonDepuisConfig(); nb.etape = b.etape; etat.brouillon = nb; afficherVue('assistant', true); }
    return;
  }
  b.enCours = false;
  if (b.encore && etat.brouillon === b) { b.encore = false; await sauvegarderBrouillon(); }
}

/* Enregistre tout de suite ce qui attend ; vrai si plus rien n'attend. */
async function enregistrerMaintenant() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'personnalisation') { return true; }
  clearTimeout(b.minuterie);
  /* Attente bornee : un enregistrement bloque ne fige pas la sortie. */
  var limite = Date.now() + 30000;
  while (b.enCours && Date.now() < limite) { await new Promise(function (r) { setTimeout(r, 50); }); }
  await sauvegarderBrouillon();
  return !compterChangements(b);
}

/* Sortie des parametrages (bouton Retour ou onglet) : enregistre d'abord ;
   une saisie incomplete est signalee avant d'etre abandonnee. */
async function sortirParametrages(afficher) {
  var b = etat.brouillon;
  var ok = await enregistrerMaintenant();
  if (!ok) {
    var raison = raisonNonEnregistrable(b);
    var quitter = await confirmerAction('Quitter les paramétrages ?', 'Une modification n\'a pas pu être enregistrée' + (raison ? ' : ' + raison : '') + '. Elle sera perdue.', 'Quitter');
    if (!quitter) { return false; }
  }
  etat.brouillon = null;
  if (afficher) { await chargerTout(); }
  return true;
}

/* Apres enregistrement, le brouillon devient la nouvelle reference : les
   elements supprimes disparaissent, les nouveaux recoivent leur colonne. */
function consoliderBrouillon(b, cleParUid) {
  var src = etat.config.sourceEtapes;
  b.colonnes = b.colonnes.filter(function (x) { return !x.supprimee; });
  b.colonnes.forEach(function (x) {
    if (src.type === 'choice' || src.type === 'liste') { x.cle = x.nom.trim(); }
    else if (!x.cle && cleParUid[x.uid]) { x.cle = cleParUid[x.uid]; x.id = parseInt(x.cle, 10); }
    x.nomInitial = x.nom.trim();
    x.dest = null;
    x.nb = x.cle ? cartesDeEtape(x.cle).length : 0;
  });
  var retirees = b.infos.filter(function (i) { return i.supprimee; }).map(function (i) { return i.uid; });
  var garder = function (u) { return retirees.indexOf(u) === -1; };
  b.infos = b.infos.filter(function (i) { return !i.supprimee; });
  b.ordreCarte = b.ordreCarte.filter(garder);
  b.ordreFiche = b.ordreFiche.filter(garder);
  b.filtres = b.filtres.filter(garder);
  if (b.couverture && !garder(b.couverture)) { b.couverture = null; }
  if (b.couleur && !garder(b.couleur)) { b.couleur = null; }
  b.infos.forEach(function (i) {
    i.nouvelle = false; i.typeFixe = true; i.libelleInitial = i.libelle.trim();
    i.valeursInitiales = i.valeurs.slice(); i.utiliseeInitiale = i.utilisee;
  });
  b.initial = JSON.stringify(etatComparable(b));
  b.initCarte = sequenceVisible(b, 'ordreCarte', 'surCarte');
  b.initFiche = sequenceVisible(b, 'ordreFiche', 'dansFiche');
}

function boutonsOrdre(liste, index, nom, idBase, surDeplacer, suffixe) {
  return [
    bouton('Monter', 'discret', 'arrow-up-line', function () { surDeplacer(index, -1); }, { petit: true, iconeSeule: true, aria: 'Monter ' + nom + (suffixe || ''), desactive: index === 0, id: idBase + 'H' + index }),
    bouton('Descendre', 'discret', 'arrow-down-line', function () { surDeplacer(index, 1); }, { petit: true, iconeSeule: true, aria: 'Descendre ' + nom + (suffixe || ''), desactive: index === liste.length - 1, id: idBase + 'B' + index })
  ];
}

function echanger(tab, i, j) { var t = tab[i]; tab[i] = tab[j]; tab[j] = t; }

/* Les boutons d'une ligne nomment l'element qu'ils touchent ("Monter la
   colonne En attente"). Ce nom suit la saisie : le libelle est un modele
   ou {nom} est remplace a chaque frappe. */
function preparerLibelles(racine, prefixe, nomActuel) {
  Array.prototype.forEach.call(racine.querySelectorAll('button[aria-label]'), function (bt) {
    var a = bt.getAttribute('aria-label');
    if (a.indexOf(prefixe + nomActuel) !== -1) { bt.setAttribute('data-modele', a.split(prefixe + nomActuel).join(prefixe + '{nom}')); }
  });
}

function majLibelles(racine, nom) {
  Array.prototype.forEach.call(racine.querySelectorAll('button[data-modele]'), function (bt) {
    bt.setAttribute('aria-label', bt.getAttribute('data-modele').split('{nom}').join(nom));
  });
}

/* --- Etape 1 : le Kanban --- */
function etapeKanban() {
  var b = etat.brouillon;
  var nom = saisie('kNom', b.nom, { indice: 'Préparation du séminaire annuel' });
  var desc = saisie('kDesc', b.description, { multiligne: true, lignes: 5 });
  var apNom = creer('p', { classe: 'fr-h6 fr-mb-0', id: 'kApNom', texte: b.nom || 'Nom du Kanban' });
  var apDesc = creer('p', { classe: 'w-mention', id: 'kApDesc', texte: b.description });
  nom.addEventListener('input', function () { b.nom = nom.value; apNom.textContent = nom.value || 'Nom du Kanban'; majAttente(); });
  desc.addEventListener('input', function () { b.description = desc.value; apDesc.textContent = desc.value; majAttente(); });
  var principal = [
    groupeChamp('Nom du Kanban', nom, 'Visible en tête du Kanban et dans son onglet.', true),
    groupeChamp('Explication pour les utilisateurs (facultatif)', desc, 'Affichée sous le nom du Kanban. Par exemple : à quoi il sert, qui le met à jour, ce que signifie chaque colonne. Laissez vide si ce n\'est pas utile.')
  ];
  /* Kanban branche sur une table : le fil d'activite est une option, car il
     ajoute deux colonnes techniques a la table de l'agent. */
  var options = [];
  if (b.mode === 'personnalisation' && !etat.config.colKanban) {
    options.push(optionCase('kHistorique', 'Historique et commentaires des cartes', 'Chaque carte garde le fil de ses modifications, faites dans le Kanban comme dans la table, et peut recevoir des commentaires. Deux colonnes techniques sont ajoutées à votre table : ' + COL_HISTORIQUE + ' et ' + COL_COMMENTAIRE + '.', b.historique,
      function (v) { b.historique = v; majAttente(); }));
  }
  if (b.mode === 'personnalisation') {
    var aRet = aide('kRetirer', 'suppression du Kanban', etat.config.colKanban
      ? 'Le Kanban disparaît des onglets et ses cartes sont supprimées. Les autres Kanbans du document ne sont pas touchés. Une confirmation est demandée.'
      : 'Le Kanban disparaît des onglets. Votre table et ses lignes restent dans le document. Une confirmation est demandée.');
    options.push(creer('div', { classe: 'w-champ-aide w-opt w-zone-retrait' }, [bouton('Supprimer ce Kanban', 'secondaire', 'delete-line', recommencer, { petit: true }), aRet.bouton, aRet.panneau]));
    options.push(encartDroits());
  }
  return ecranColonnes([{ titre: 'Le Kanban', contenu: principal }, options.length ? { titre: 'Options', contenu: options } : null],
    { titre: 'Aperçu', noeud: creer('div', { classe: 'w-apercu-blanc' }, [apNom, apDesc]) });
}

/* --- Etape 2 : les colonnes --- */
function apercuColonnes() {
  var z = creer('div', { classe: 'w-apercu-etapes', id: 'kApCol', attrs: { role: 'img' } });
  majApercuColonnes(z);
  return z;
}

function majApercuColonnes(z) {
  z = z || document.getElementById('kApCol');
  if (!z) { return; }
  vider(z);
  var act = colonnesActives();
  z.setAttribute('aria-label', 'Aperçu : ' + act.length + ' colonnes, ' + act.map(function (x) { return x.nom || 'sans nom'; }).join(', '));
  act.forEach(function (x) {
    z.appendChild(creer('div', { texte: x.nom || 'Sans nom' }));
  });
}

/* Parametrages : la suppression d'une colonne est enregistree aussitot,
   apres confirmation ; les cartes vont dans la colonne choisie. */
async function supprimerColonneParametrage(x) {
  var autres = colonnesActives().filter(function (y) { return y !== x; });
  var nom = x.nom || 'sans nom';
  if (!x.cle) {
    etat.brouillon.colonnes = etat.brouillon.colonnes.filter(function (y) { return y !== x; });
    majAttente(); redessinerEtape('kAjoutCol'); return;
  }
  if (!x.nb) {
    var ok = await confirmerAction('Supprimer la colonne « ' + nom + ' » ?', 'Elle ne contient aucune carte. La suppression est enregistrée aussitôt.', 'Supprimer');
    if (!ok) { return; }
    x.supprimee = true;
    await enregistrerMaintenant();
    redessinerEtape('kAjoutCol');
    return;
  }
  var sel = liste('kDestModale', autres.map(function (y) { return { valeur: y.uid, libelle: y.nom || 'Sans nom' }; }), autres[0].uid);
  ouvrirModale({ titre: 'Supprimer la colonne « ' + nom + ' » ?', etroite: true, focus: 'kDestModale',
    corps: [creer('p', { classe: 'w-texte', texte: (x.nb > 1 ? 'Ses ' + x.nb + ' cartes seront déplacées' : 'Sa carte sera déplacée') + ' dans la colonne choisie ci-dessous. La suppression est enregistrée aussitôt.' }),
      groupeChamp('Déplacer les cartes dans', sel)],
    pied: [creer('span', { classe: 'w-pousse' }), bouton('Annuler', 'secondaire', null, fermerModale),
      bouton('Supprimer la colonne', null, 'delete-line', async function () {
        x.supprimee = true;
        x.dest = sel.value;
        fermerModale();
        await enregistrerMaintenant();
        redessinerEtape('kAjoutCol');
      })] });
}

function etapeColonnes() {

  } else {

  }

  b.colonnes.forEach(function (x, i) {

    } else {

    }
    var li = creer('li', { classe: 'w-ligne' + (x.supprimee ? ' w-ligne--supprimee' : '') }, [
      b.colonnesOrdonnables && !x.supprimee ? creer('span', { classe: 'w-poignee fr-icon-drag-move-2-line', attrs: { 'aria-hidden': 'true' } }) : null,
      creer('span', { classe: 'w-ligne__num', texte: String(i + 1), attrs: { 'aria-hidden': 'true' } }),

      null
    ].concat(b.colonnesOrdonnables && !x.supprimee ? boutonsOrdre(b.colonnes, i, 'la colonne ' + nomAff, 'kCol', deplacer) : [])
      .concat(b.colonnesModifiables ? [x.supprimee
        ? bouton('Annuler la suppression', 'discret', 'arrow-go-back-line', function () { x.supprimee = false; x.dest = null; majAttente(); redessinerEtape('kCol' + i); },
          { petit: true, aria: 'Annuler la suppression de la colonne ' + nomAff, id: 'kColR' + i })
        : bouton('Supprimer', 'discret', 'delete-line', function () {
          if (colonnesActives().length === 1) { signalerSaisie('Le Kanban doit garder au moins une colonne.'); return; }
          if (perso) { return supprimerColonneParametrage(x); }
          x.supprimee = true;
          var autres = colonnesActives();
          x.dest = autres.length ? autres[0].uid : null;
          majAttente();
          redessinerEtape('kColR' + i);
        }, { petit: true, iconeSeule: true, aria: 'Supprimer la colonne ' + nomAff, id: 'kColS' + i })] : []));
    preparerLibelles(li, 'la colonne ', nomAff);
    ol.appendChild(li);
    if (x.supprimee) {
      var msg = creer('li', { classe: 'w-ligne w-ligne--detail-alerte' }, [creer('span', { classe: 'fr-icon-warning-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } })]);
      if (x.cle && x.nb) {
        var autresC = colonnesActives();
        var sel = liste('kDest' + i, autresC.map(function (y) { return { valeur: y.uid, libelle: y.nom || 'Sans nom' }; }), x.dest);
        sel.addEventListener('change', function () { x.dest = sel.value; majAttente(); });
        msg.appendChild(creer('label', { attrs: { 'for': 'kDest' + i }, texte: 'Cette colonne sera supprimée. ' + (x.nb > 1 ? 'Ses ' + x.nb + ' cartes iront' : 'Sa carte ira') + ' dans' }));
        msg.appendChild(sel);
      } else {
        msg.appendChild(creer('span', { texte: 'Cette colonne sera supprimée.' }));
      }
      ol.appendChild(msg);
    }
  });
  principal.push(ol);
  if (b.colonnesModifiables) {
    principal.push(creer('div', {}, [bouton('Ajouter une colonne', 'secondaire', 'add-line', function () {
      b.colonnes.push({ uid: uid(), cle: null, nom: '', nomInitial: null, limite: null, supprimee: false, dest: null, nb: 0 });
      majAttente();
      redessinerEtape('kCol' + (b.colonnes.length - 1));
    }, { petit: true, id: 'kAjoutCol' })]));
  }
  if (b.colonnesOrdonnables) {
    brancherTriListe(ol, function (de, vers) {
      /* La liste contient les lignes de detail des colonnes supprimees, qui
         ne se deplacent pas : on retrouve les colonnes par leur position
         parmi les lignes deplacables. */
      var mobiles = b.colonnes.filter(function (x) { return !x.supprimee; });
      var item = mobiles[de];
      var cible = mobiles[vers];
      var a = b.colonnes.indexOf(item);
      b.colonnes.splice(a, 1);
      b.colonnes.splice(b.colonnes.indexOf(cible) + (vers > de ? 1 : 0), 0, item);
      majAttente();
      redessinerEtape(null);
      return Promise.resolve();
    });
  }
  /* Colonne d'archives, facultative : toujours en dernier, repliee sur le
     Kanban meme quand elle contient des cartes. */
  var options = [];
  if (b.colonnesModifiables) {
    var arch = b.colonnes.filter(function (x) { return x.uid === b.archiveUid && !x.supprimee; })[0];
    options.push(optionCase('kArchive', 'Colonne Archives à la fin du Kanban', 'Pour ranger les cartes terminées sans les supprimer. Elle reste repliée sur le Kanban, même quand elle contient des cartes ; un clic l\'ouvre le temps de consulter.', !!arch,
      function (coche) {
        if (coche) {
          var existante = b.colonnes.filter(function (x) { return !x.supprimee && x.nom.trim().toLowerCase() === 'archives'; })[0];
          if (!existante) {
            existante = { uid: uid(), cle: null, nom: 'Archives', nomInitial: null, limite: null, supprimee: false, dest: null, nb: 0 };
            b.colonnes.push(existante);
          }
          b.archiveUid = existante.uid;
        } else {
          var col = b.colonnes.filter(function (x) { return x.uid === b.archiveUid; })[0];
          if (col && !col.cle) { b.colonnes.splice(b.colonnes.indexOf(col), 1); }
          b.archiveUid = null;
        }
        majAttente();
        redessinerEtape('kArchive');
      }));
  }
  return ecranColonnes([
    { titre: 'Colonnes du Kanban', id: 'kAideCol', aide: b.colonnesModifiables ? 'Les colonnes sont les étapes du travail. Renommez-les directement dans la liste ; faites-les glisser par leur poignée, ou utilisez les flèches, pour changer leur ordre.' : null, contenu: principal },
    options.length ? { titre: 'Options', contenu: options } : null],
    { titre: 'Aperçu du Kanban', noeud: apercuColonnes() });
}

/* --- Etape 3 : les informations --- */
var SUGGESTIONS_RAPIDES = [
  { libelle: 'Description', genre: 'texte_long' }, { libelle: 'Date d\'échéance', genre: 'date', echeance: true },
  { libelle: 'Responsable', genre: 'personne', responsable: true }, { libelle: 'Priorité', genre: 'choix', valeurs: ['Basse', 'Normale', 'Haute'] },
  { libelle: 'Étiquettes', genre: 'etiquettes', valeurs: ['Urgent', 'À valider'] }, { libelle: 'Pièces jointes', genre: 'pj' }];

function ajouterInfo(def) {
  var b = etat.brouillon;
  var i = infoVide(def ? def.libelle : '', def ? def.genre : 'texte');
  if (def) {
    i.valeurs = (def.valeurs || []).slice();
    if (def.echeance) { attribuerRole(i, 'echeance'); }
    if (def.responsable) { attribuerRole(i, 'responsable'); }
  }
  i.ouverte = !def;
  b.infos.push(i);
  b.ordreCarte.push(i.uid);
  b.ordreFiche.push(i.uid);
  majAttente();
  redessinerEtape(def ? 'kAjoutInfo' : 'kInfoNom' + (b.infos.length - 1));
}

/* Un role (echeance, responsable) n'appartient qu'a une information. */
function attribuerRole(info, role) {
  etat.brouillon.infos.forEach(function (x) { x[role] = false; });
  info[role] = true;
}

function roleEcheancePossible(i) { return i.genre === 'date'; }
function roleResponsablePossible(i) { return ['personne', 'choix', 'texte', 'reference'].indexOf(i.genre) !== -1; }

  var consigne = (branche
    ? 'Voici les colonnes de votre table. Cochez celles que le Kanban utilise ; cliquez sur Modifier pour changer le nom affiché, les valeurs possibles ou le rôle. Votre table n\'est jamais modifiée dans sa structure ; décocher une colonne la retire du Kanban, pas de votre table.'
    : 'Une information est ce que l\'on note sur chaque carte. Cliquez sur Modifier pour changer son nom, ses valeurs possibles ou son rôle.')
    + ' Le rôle Échéance signale les cartes en retard ; le rôle Responsable ajoute une icône de personne sur la carte. Ce qui s\'affiche sur la carte et dans la fiche se choisit aux étapes suivantes.';

      creer('span', { classe: 'w-ligne__info', texte: libelleGenre(info.genre, info.col && etat.config ? colonneCartes(info.col) : null)
        + (info.lectureSeule && info.col && etat.config ? ', non modifiable (' + raisonLectureSeule(colonneCartes(info.col), info.genre).replace(/^./, function (x) { return x.toLowerCase(); }) + ')' : '') }),
      roles.length ? creer('span', { classe: 'w-carte__badges' }, roles) : null,
      info.supprimee
        ? bouton('Annuler la suppression', 'discret', 'arrow-go-back-line', function () { info.supprimee = false; majAttente(); redessinerEtape('kInfoM' + i); },
          { petit: true, aria: 'Annuler la suppression de ' + nom, id: 'kInfoR' + i })
        : bouton(info.ouverte ? 'Fermer' : 'Modifier', 'discret', info.ouverte ? 'close-line' : 'edit-line', function () {
          info.ouverte = !info.ouverte; redessinerEtape(info.ouverte ? 'kInfoNom' + i : 'kInfoM' + i);
        }, { petit: true, aria: (info.ouverte ? 'Fermer ' : 'Modifier ') + nom, id: 'kInfoM' + i })
    ]);
    var bm = ligneInfo.querySelector('#kInfoM' + i);
    if (bm) { bm.setAttribute('aria-expanded', info.ouverte ? 'true' : 'false'); bm.setAttribute('data-modele', (info.ouverte ? 'Fermer ' : 'Modifier ') + '{nom}'); }
    ul.appendChild(ligneInfo);
    if (info.ouverte && !info.supprimee) { ul.appendChild(creer('li', { classe: 'w-detail' }, [detailInformation(info, i)])); }
    if (info.supprimee) {
      ul.appendChild(creer('li', { classe: 'w-ligne w-ligne--detail-alerte' }, [creer('span', { classe: 'fr-icon-warning-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } }),
        creer('span', { texte: info.nouvelle ? 'Cette information ne sera pas créée.' : 'Cette information sera supprimée.' })]));
    }
  });
  principal.push(ul);
  var ajouts = [];
  if (!branche) {
    principal.push(bouton('Ajouter une information', 'secondaire', 'add-line', function () { ajouterInfo(null); }, { petit: true, id: 'kAjoutInfo' }));
    var presentes = b.infos.filter(function (x) { return !x.supprimee; }).map(function (x) { return normaliser(x.libelle); });
    var rapides = SUGGESTIONS_RAPIDES.filter(function (s) { return presentes.indexOf(normaliser(s.libelle)) === -1; });
    if (rapides.length) {
      ajouts.push(creer('div', { classe: 'w-volet__actions' }, rapides.map(function (s) {
        return bouton(s.libelle, 'discret', 'add-line', function () { ajouterInfo(s); }, { petit: true, aria: 'Ajouter l\'information ' + s.libelle });
      })));
    }
  }
  return ecranColonnes([
    { titre: 'Informations des cartes', id: 'kAideInfos', aide: consigne, contenu: principal },
    ajouts.length ? { titre: 'Ajouter en un clic', id: 'kAideRapides', aide: 'Informations courantes, prêtes à l\'emploi : un clic les ajoute à la liste, que vous pouvez ensuite modifier.', contenu: ajouts } : null],
    { titre: 'Aperçu de la carte', noeud: creer('div', { id: 'kApCarte' }, [apercuCarte()]) });
}

function detailInformation(info, i) {
  var b = etat.brouillon;
  var zone = creer('div', { classe: 'w-form-info' });
  var nom = saisie('kInfoNom' + i, info.libelle, { indice: 'Budget prévu' });
  nom.addEventListener('input', function () {
    info.libelle = nom.value;
    var t = document.getElementById('kInfoT' + i);
    if (t) { t.textContent = nom.value || 'Nouvelle information'; }
    var l = document.getElementById('kInfoL' + i);
    if (l) { majLibelles(l, nom.value || 'Nouvelle information'); }
    var sup = zone.querySelector('button[data-modele]');
    if (sup) { majLibelles(zone, nom.value || ''); }
    majAttente();
  });
  zone.appendChild(groupeChamp(b.source === 'branche' ? 'Nom affiché dans le Kanban' : 'Nom de l\'information', nom, null, true));
  if (info.typeFixe) {
    zone.appendChild(creer('div', { classe: 'fr-input-group' }, [creer('p', { classe: 'fr-label fr-mb-0', texte: 'Type de réponse' }),
      creer('p', { classe: 'w-mention', texte: libelleGenre(info.genre) + ' (non modifiable une fois créé)' })]));
  } else {
    var fs = creer('fieldset', { classe: 'fr-fieldset' }, [creer('legend', { classe: 'fr-fieldset__legend fr-text--md', texte: 'Quel type de réponse ?' })]);
    var grille = creer('div', { classe: 'w-options' });
    GENRES.filter(function (g) { return !g.masque; }).forEach(function (g) {
      var choisi = info.genre === g.code || (g.code === 'texte' && info.genre === 'texte_long');
      var r = creer('input', { attrs: { type: 'radio', name: 'kGenre' + i, id: 'kGenre' + i + '_' + g.code }, coche: choisi });
      r.addEventListener('change', function () {
        info.genre = g.code;
        if (info.echeance && !roleEcheancePossible(info)) { info.echeance = false; }
        if (info.responsable && !roleResponsablePossible(info)) { info.responsable = false; }
        info.surCarte = g.code !== 'texte_long';
        majAttente();
        redessinerEtape('kGenre' + i + '_' + g.code);
      });
      grille.appendChild(creer('label', { classe: 'w-option' + (choisi ? ' w-option--choisie' : ''), attrs: { 'for': 'kGenre' + i + '_' + g.code } }, [r,
        creer('span', {}, [g.libelle, creer('span', { classe: 'w-option__exemple', texte: g.exemple })])]));
    });
    fs.appendChild(grille);
    zone.appendChild(fs);
    if (info.genre === 'texte' || info.genre === 'texte_long') {
      var cbLignes = creer('input', { attrs: { type: 'checkbox', id: 'kLignes' + i }, coche: info.genre === 'texte_long' });
      cbLignes.addEventListener('change', function () {
        info.genre = cbLignes.checked ? 'texte_long' : 'texte';
        info.surCarte = !cbLignes.checked;
        if (info.responsable && !roleResponsablePossible(info)) { info.responsable = false; }
        majAttente();
        redessinerEtape('kLignes' + i);
      });
      zone.appendChild(creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm' }, [cbLignes, creer('label', { classe: 'fr-label', attrs: { 'for': 'kLignes' + i } },
        ['Sur plusieurs lignes', creer('span', { classe: 'fr-hint-text', texte: 'Retour à la ligne automatique, pour une description ou des notes.' })])]));
    }
  }
  if (GENRES_A_VALEURS.indexOf(info.genre) !== -1 && info.valeursModifiables) {
    var puces = creer('ul', { classe: 'w-puces', attrs: { 'aria-label': 'Valeurs possibles de ' + (info.libelle || 'cette information') } });
    info.valeurs.forEach(function (v, k) {
      puces.appendChild(creer('li', { classe: 'w-puce' }, [v, bouton('Retirer', 'discret', 'close-line', function () {
        info.valeurs.splice(k, 1); majAttente(); redessinerEtape('kVal' + i);
      }, { petit: true, iconeSeule: true, aria: 'Retirer la valeur ' + v })]));
    });
    if (!info.valeurs.length) { puces.appendChild(creer('li', { classe: 'w-mention', texte: info.genre === 'personne' ? 'Aucune personne pour l\'instant.' : 'Aucune valeur pour l\'instant.' })); }
    var nv = saisie('kVal' + i, '', { indice: info.genre === 'personne' ? 'Prénom N.' : 'Nouvelle valeur' });
    var ajouterValeur = function () {
      var v = nv.value.trim();
      if (!v) { marquerInvalide('kVal' + i, 'Saisissez une valeur à ajouter.'); return; }
      if (info.valeurs.map(normaliser).indexOf(normaliser(v)) !== -1) { marquerInvalide('kVal' + i, 'Cette valeur existe déjà.'); return; }
      info.valeurs.push(v); majAttente(); redessinerEtape('kVal' + i);
    };
    nv.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ajouterValeur(); } });
    zone.appendChild(creer('div', { classe: 'fr-input-group' }, [creer('p', { classe: 'fr-label fr-mb-1v', texte: info.genre === 'personne' ? 'Personnes proposées' : 'Valeurs possibles' }),
      puces, creer('div', { classe: 'w-outils fr-mb-0' }, [creer('label', { classe: 'fr-sr-only', attrs: { 'for': 'kVal' + i }, texte: 'Nouvelle valeur' }), nv,
        bouton('Ajouter', 'secondaire', 'add-line', ajouterValeur, { petit: true, aria: 'Ajouter la valeur' })]),
      info.nouvelle ? null : creer('p', { classe: 'fr-hint-text', texte: 'Retirer une valeur ne l\'efface pas des cartes qui la portent déjà.' })]));
  }
  var roles = creer('div', { classe: 'w-outils fr-mb-0' });
  [['echeance', 'Sert d\'échéance', roleEcheancePossible, 'kEch'], ['responsable', 'Désigne le responsable', roleResponsablePossible, 'kResp']].forEach(function (r) {
    var possible = r[2](info);
    var cb = creer('input', { attrs: { type: 'checkbox', id: r[3] + i, disabled: !possible }, coche: info[r[0]] });
    cb.addEventListener('change', function () {
      if (cb.checked) { attribuerRole(info, r[0]); } else { info[r[0]] = false; }
      if (r[0] === 'echeance' && !b.infos.some(function (x) { return x.echeance; })) { b.filtreRetard = false; }
      majAttente();
      redessinerEtape(r[3] + i);
    });
    roles.appendChild(creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm' }, [cb, creer('label', { classe: 'fr-label', attrs: { 'for': r[3] + i }, texte: r[1] })]));
  });
  zone.appendChild(roles);
  if (info.peutSupprimer) {
    zone.appendChild(creer('div', { classe: 'w-form-info__actions' }, [bouton('Supprimer cette information', 'discret', 'delete-line', function () {
      if (info.nouvelle) {
        b.infos.splice(i, 1);
        b.ordreCarte = b.ordreCarte.filter(function (u) { return u !== info.uid; });
        b.ordreFiche = b.ordreFiche.filter(function (u) { return u !== info.uid; });
        b.filtres = b.filtres.filter(function (u) { return u !== info.uid; });
        majAttente();
        redessinerEtape('kAjoutInfo');
        return;
      }
      if (b.mode === 'personnalisation') {
        return (async function () {
          var ok = await confirmerAction('Supprimer l\'information « ' + (info.libelleInitial || info.libelle) + ' » ?',
            'Son contenu sera effacé de toutes les cartes. La suppression est enregistrée aussitôt et ne peut pas être annulée.', 'Supprimer');
          if (!ok) { return; }
          info.supprimee = true; info.ouverte = false;
          await enregistrerMaintenant();
          redessinerEtape('kAjoutInfo');
        })();
      }
      info.supprimee = true; info.ouverte = false; majAttente(); redessinerEtape('kInfoR' + i);
    }, { petit: true, aria: 'Supprimer l\'information ' + (info.libelle || '') })]));
    var bs = zone.querySelector('.w-form-info__actions button');
    if (bs) { bs.setAttribute('data-modele', 'Supprimer l\'information {nom}'); }
  }
  return zone;
}

/* --- Etape 4 : la carte et la fiche --- */
function valeurExemple(info) {
  var ex = { texte: 'Salle B', texte_long: 'Salle de 80 places, vidéoprojecteur.', date: '15 oct. 2026', nombre: '1 200', oui_non: info.libelle,
    choix: info.valeurs[0] || 'Haute', etiquettes: info.valeurs[0] || 'Urgent', personne: info.valeurs[0] || 'Claire M.', lien: info.libelle,
    pj: '2', reference: 'Visas', dateheure: '15 oct. 2026, 14 h 30', entier: '12', montant: '1 250,00 €', pourcentage: '15 %' };
  return ex[info.genre] || '…';
}

function apercuCarte() {
  var b = etat.brouillon;
  var art = creer('div', { classe: 'w-carte', attrs: { 'aria-hidden': 'true' } });
  var couv = b.couverture ? infoParUid(b.couverture) : null;
  if (couv && infoActive(couv) && !b.compact) { art.appendChild(creer('div', { classe: 'w-apercu-couverture', texte: 'Image de couverture' })); }
  art.appendChild(creer('p', { classe: 'w-carte__titre w-apercu-titre', texte: 'Exemple de carte' }));
  var coul = b.couleur ? infoParUid(b.couleur) : null;
  if (coul && infoActive(coul)) { var vc = valeurExemple(coul); art.classList.add('w-carte--couleur'); art.classList.add('w-carte--c-' + couleurBadge(vc)); }
  var infos = creer('div', { classe: 'w-carte__infos' });
  var lib = function (i) { return b.nomsInfos ? creer('span', { classe: 'w-carte__libelle', texte: i.libelle }) : null; };
  /* Icone de l'apercu : la meme que sur la vraie carte, selon le type. */
  var ico = function (i) {
    if (i.echeance) { return creer('span', { classe: 'fr-icon-calendar-line fr-icon--sm w-carte__ico', attrs: { 'aria-hidden': 'true' } }); }
    if (i.responsable) { return iconeInfo('personne'); }
    var g = i.genre;
    if (g === 'montant') { return iconeInfo('nombre', { options: { numMode: 'currency' } }); }
    if (g === 'entier' || g === 'pourcentage') { return iconeInfo('nombre'); }
    if (g === 'texte_long') { return iconeInfo('texte'); }
    return iconeInfo(g);
  };
  var visibles = b.ordreCarte.map(infoParUid).filter(function (i) { return infoActive(i) && i.surCarte; });
  if (b.compact) { visibles = visibles.filter(function (i) { return i.echeance || i.responsable; }); }
  visibles.forEach(function (i) {
    var v = valeurExemple(i);
    if (i.genre === 'choix' || i.genre === 'etiquettes') { infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [ico(i), lib(i), badge(v, couleurBadge(v))])); }
    else if (i.genre === 'texte_long') { infos.appendChild(creer('p', { classe: 'w-carte__texte' }, [ico(i), lib(i), v])); }
    else if (i.genre === 'lien') { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [ico(i), creer('span', { classe: 'fr-link fr-link--sm', texte: i.libelle })])); }
    else if (i.genre === 'oui_non') { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [creer('span', { classe: 'w-carte__libelle', texte: i.libelle }), creer('span', { classe: 'fr-icon-check-line fr-icon--sm w-carte__coche' })])); }
    else {
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [ico(i), lib(i), creer('span', { classe: 'w-carte__valeur', texte: v })]));
    }
  });
  if (coul && infoActive(coul) && visibles.indexOf(coul) === -1) { var v2 = valeurExemple(coul); infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [lib(coul), badge(v2, couleurBadge(v2))])); }
  if (infos.childNodes.length) { art.appendChild(infos); }
  return art;
}

function apercuFiche() {

  var ol = creer('ol', { classe: 'w-texte w-apercu-fiche', attrs: { 'aria-label': 'Ordre des informations dans la fiche' } }, [creer('li', { texte: 'Titre de la carte' }), creer('li', { texte: 'Colonne' })]);
  b.ordreFiche.map(infoParUid).filter(function (i) { return infoActive(i) && i.dansFiche; }).forEach(function (i) { ol.appendChild(creer('li', { texte: i.libelle })); });

function majApercusCarteFiche() {
  var zc = document.getElementById('kApCarte');

function listeOrdre(cle, prop, idBase, titre, suffixe) {
  var b = etat.brouillon;
  var uids = b[cle].filter(function (u) { return infoActive(infoParUid(u)); });
  var ul = creer('ol', { classe: 'w-liste', attrs: { 'aria-label': titre } });
  var deplacer = function (i, d) {
    var a = b[cle].indexOf(uids[i]);
    var c2 = b[cle].indexOf(uids[i + d]);
    echanger(b[cle], a, c2);
    majAttente();
    redessinerEtape(idBase + (d < 0 ? 'H' : 'B') + (i + d));
  };
  uids.forEach(function (u, i) {
    var info = infoParUid(u);
    var cb = creer('input', { attrs: { type: 'checkbox', id: idBase + i }, coche: info[prop] });
    cb.addEventListener('change', function () { info[prop] = cb.checked; majApercusCarteFiche(); majAttente(); });
    ul.appendChild(creer('li', { classe: 'w-ligne' }, [creer('span', { classe: 'w-poignee fr-icon-drag-move-2-line', attrs: { 'aria-hidden': 'true' } }),
      creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm w-ligne__nom' }, [cb, creer('label', { classe: 'fr-label', attrs: { 'for': idBase + i }, texte: info.libelle })])]
      .concat(boutonsOrdre(uids, i, info.libelle, idBase, deplacer, suffixe))));
  });
  if (!uids.length) { ul.appendChild(creer('li', { classe: 'w-mention', texte: 'Aucune information : seul le titre est affiché.' })); }
  brancherTriListe(ul, function (de, vers) {
    var item = uids[de];
    var tab = b[cle];
    tab.splice(tab.indexOf(item), 1);
    tab.splice(tab.indexOf(uids[vers]) + (vers > de ? 1 : 0), 0, item);
    majAttente();
    redessinerEtape(null);
    return Promise.resolve();
  });
  return ul;
}

/* Option d'affichage avec son aide "i" : case a cocher, ou liste avec son
   libelle. L'aide s'insere sous l'option, jamais par-dessus l'apercu. */
function optionCase(id, libelle, explication, coche, surChange) {
  var cb = creer('input', { attrs: { type: 'checkbox', id: id }, coche: coche });
  cb.addEventListener('change', function () { surChange(cb.checked); });
  var a = aide(id, libelle, explication);
  return creer('div', { classe: 'w-champ-aide w-opt' }, [creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm' }, [cb,
    creer('label', { classe: 'fr-label', attrs: { 'for': id }, texte: libelle })]), a.bouton, a.panneau]);
}

function optionListe(id, libelle, explication, sel) {
  var a = aide(id, libelle, explication);
  return creer('div', { classe: 'w-champ-aide w-opt w-opt--liste' }, [
    creer('div', { classe: 'w-libelle-aide' }, [creer('label', { classe: 'fr-label', attrs: { 'for': id }, texte: libelle }), a.bouton]), a.panneau, sel]);
}

function titreColonne(texte, explication, id) {
  var a = explication ? aide(id, texte, explication) : null;
  return creer('div', { classe: 'w-champ-aide w-opt' }, [creer('h3', { classe: 'w-c3__titre', texte: texte }), a ? a.bouton : null, a ? a.panneau : null]);
}

/* Ecran de parametrage en colonnes : chaque colonne a son titre sur la
   meme ligne, l'apercu (a droite) commence au niveau du premier element. */
function ecranColonnes(cols, apercu, classe) {
  var enfants = cols.filter(Boolean).map(function (c) {
    return creer('div', { classe: 'w-c3__col' }, [titreColonne(c.titre, c.aide || null, c.id || null)].concat(c.contenu));
  });

    enfants.push(creer('div', { classe: 'w-c3__apercu' }, [titreColonne(apercu.titre, null),
      creer('div', { classe: 'w-apercu-boite' }, [apercu.noeud])]));
  }
  return creer('div', { classe: 'w-c3' + (enfants.length === 2 ? ' w-c3--deux' : '') + (classe ? ' ' + classe : '') }, enfants);
}

/* --- Etape 4 : la carte --- trois colonnes : les informations a ranger,
   les options d'affichage, l'apercu (visible pendant le defilement). */
function etapeCarte() {
  var b = etat.brouillon;
  var maj = function () { majApercusCarteFiche(); majAttente(); };
  var options = [titreColonne('Options d\'affichage', null)];
  var selCouv = null;
  var pjsDispo = false;
  options.push(optionCase('kCompact', 'Affichage compact', 'La carte ne montre que son titre, son échéance et son responsable, sans image de couverture : pratique quand les colonnes sont chargées.', b.compact,
    function (v) {
      b.compact = v;
      /* L'affichage compact masque la couverture : la liste est grisee. */
      if (selCouv) { selCouv.disabled = v || !pjsDispo; }
      maj();
    }));
  options.push(optionCase('kNoms', 'Afficher le nom des informations', 'Par exemple « Priorité Haute ». Les informations vides restent visibles par leur nom, pour signaler ce qui manque. Sans les noms, la carte affiche seulement les valeurs saisies.', b.nomsInfos,
    function (v) { b.nomsInfos = v; maj(); }));
  var actives = b.infos.filter(infoActive);
  var pjs = actives.filter(function (i) { return i.genre === 'pj'; });
  pjsDispo = pjs.length > 0;
  selCouv = liste('kCouv', pjs.map(function (i) { return { valeur: i.uid, libelle: i.libelle }; }), b.couverture || '', { vide: 'Aucune' });
  if (!pjsDispo || b.compact) { selCouv.disabled = true; }
  selCouv.addEventListener('change', function () { b.couverture = selCouv.value || null; maj(); });
  options.push(optionListe('kCouv', 'Image de couverture', 'La première image jointe s\'affiche en haut de la carte. Seules les images au format JPG, PNG, GIF, WebP ou BMP peuvent servir de couverture : un PDF ou un autre document n\'est pas affiché, il reste consultable dans la fiche. L\'affichage compact masque l\'image de couverture : décochez-le pour la voir.'
    + (pjs.length ? '' : ' Disponible quand une information est de type pièces jointes (étape « Les informations »).'), selCouv));
  var colorables = actives.filter(function (i) { return i.genre === 'choix' || i.genre === 'personne'; });
  var selCoul = liste('kCouleur', colorables.map(function (i) { return { valeur: i.uid, libelle: i.libelle }; }), b.couleur || '', { vide: 'Aucune' });
  if (!colorables.length) { selCoul.setAttribute('disabled', ''); }
  selCoul.addEventListener('change', function () { b.couleur = selCoul.value || null; maj(); });
  options.push(optionListe('kCouleur', 'Couleur des cartes selon', 'Un liseré coloré par valeur, à gauche de la carte. La valeur reste écrite sur la carte.'
    + (colorables.length ? '' : ' Disponible quand une information est une liste de choix ou une personne (étape « Les informations »).'), selCoul));
  if (b.tri) {
    var c = etat.config;
    var cols = colonnesDe(c.tableCartes).filter(function (x) { return ['date', 'nombre', 'texte', 'choix'].indexOf(genreDe(x)) !== -1; });
    var selTri = liste('kTri', cols.map(function (x) { return { valeur: x.colId, libelle: x.colId === c.colTitre ? 'Titre' : libelleChampCol(x.colId) }; }), b.tri.col);
    var selSens = liste('kSens', [{ valeur: 'asc', libelle: 'Croissant' }, { valeur: 'desc', libelle: 'Décroissant' }], b.tri.sens);
    selTri.addEventListener('change', function () { b.tri.col = selTri.value; majAttente(); });
    selSens.addEventListener('change', function () { b.tri.sens = selSens.value; majAttente(); });
    options.push(optionListe('kTri', 'Ranger les cartes par', 'Ordre des cartes dans chaque colonne, pour tout le monde. Chacun peut aussi trier pour lui-même depuis le panneau du Kanban.', selTri),
      groupeChamp('Sens', selSens));
  }
  return creer('div', { classe: 'w-c3' }, [
    creer('div', { classe: 'w-c3__col' }, [titreColonne('Informations sur la carte', 'Ce que l\'on voit d\'un coup d\'œil. Cochez les informations à afficher et rangez-les dans l\'ordre voulu, par leur poignée ou avec les flèches.', 'kAideCarte'),
      listeOrdre('ordreCarte', 'surCarte', 'kCarte', 'Informations sur la carte', ' sur la carte')]),
    creer('div', { classe: 'w-c3__col' }, options),
    creer('div', { classe: 'w-c3__apercu' }, [titreColonne('Aperçu de la carte', null), creer('div', { classe: 'w-apercu-boite' }, [creer('div', { id: 'kApCarte' }, [apercuCarte()])])])]);
}

/* --- Etape 5 : la fiche --- les informations a ranger, l'apercu. */
function etapeFiche() {
  return creer('div', { classe: 'w-c3 w-c3--deux' }, [
    creer('div', { classe: 'w-c3__col' }, [titreColonne('Informations dans la fiche', 'Ce qui s\'affiche en cliquant sur une carte. Le titre et la colonne y sont toujours. Cochez les informations à afficher et rangez-les dans l\'ordre voulu.', 'kAideFiche'),

/* --- Etape 5 : filtres et recherche --- */
/* Apercu du panneau de gauche du Kanban, tel que les agents le verront. */
function apercuVolet() {
  var b = etat.brouillon;

  var section = function (t) { z.appendChild(creer('p', { classe: 'w-apercu-volet__titre', texte: t })); };
