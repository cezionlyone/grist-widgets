  DESCRIPTION
  -----------
  Gristkanban : widget de Kanbans destiné à tous, sans connaissance technique. Un même
  widget héberge tous les Kanbans d'un document, présentés en onglets ; le
  dernier onglet, "Nouveau Kanban", en crée un autre.

  Création, guidée par une barre d'étapes cliquable (pas de bouton en bas de
  page) ; rien n'est écrit dans le document avant "Créer mon Kanban". Une
  seule question au départ :
  - J'ai déjà des données dans ce document : Kanbans suggérés d'après les
    tables du document (colonne d'étape, titre, échéance, responsable), ou
    paramétrage libre ; la table existante n'est jamais restructurée,
    hormis l'ajout annoncé d'une colonne ORDRE ;
  - Je n'ai pas encore de données : Kanban vierge, l'un des onze modèles
    métier, ou la structure d'un Kanban du document (sans ses cartes).
  Étapes communes : le Kanban (nom, explication facultative), les colonnes,
  les informations des cartes, la carte et la fiche, filtres et recherche,
  vérification.

  Paramétrages d'un Kanban existant : mêmes étapes, enregistrement
  automatique (environ 1 s après la dernière modification), état affiché en
  continu, suppressions confirmées sur le moment, retour direct au Kanban.

  Au quotidien :
  - colonnes qui défilent seules, page fixe ; colonnes vides réduites ;
  - glisser-déposer des cartes et des colonnes ; alternatives sans glisser :
    bouton Déplacer, colonne et position dans la fiche, flèches des
    paramétrages (RGAA 7.1, WCAG 2.5.7) ;
  - fiche latérale à enregistrement automatique, pièces jointes ;
  - recherche, filtres, "Regrouper par" (responsable, priorité, référence,
    oui ou non) ;
  - affichage des cartes : informations choisies et ordonnées, nom des
    informations affiché ou non, image de couverture, couleur selon une
    valeur, mode compact, échéances en retard signalées ;
  - mise à jour automatique : notifications de la plateforme, relecture
    toutes les 20 s quand la page est visible, relecture au retour sur la
    page ; l'écran n'est redessiné que si les données ont changé.

  TYPES DE COLONNES
  -----------------
  Affichés et modifiables : texte (y compris sur plusieurs lignes et en
  lien), nombre, entier, montant, pourcentage (formats de la colonne
  respectés), oui ou non, date, date et heure (dans le fuseau de la
  colonne), liste de choix, choix multiples, référence et référence
  multiple (recherche au-delà de 30 lignes), pièces jointes.
  Non modifiables, raison affichée : colonnes calculées, colonnes mises à
  jour à chaque modification, champs de métadonnées, type non défini.
  Une valeur non valide est montrée, signalée et conservée.
  À la création, tous ces types sont proposés sauf les références.

  HISTORIQUE
  ----------
  1.0.0 - 29/10/2026 - madeXcé - Première version publique.

  DÉPENDANCES
  ------------
  - DSFR v1.13.1 (dsfr.min.css, utility.min.css)
  - SortableJS v1.15.6 (glisser-déposer des cartes et des colonnes)
  - Grist Plugin API (grist-plugin-api.js), chargée depuis
    docs.getgrist.com : origine imposée par la plateforme, URL non
    versionnée, donc non couverte par une empreinte SRI
  - pdf.js v6.2.108, version legacy (aperçu des PDF), chargé à la demande

  INTÉGRITÉ DES RESSOURCES (SRI)
  -------------------------------
  Chaque ressource CDN en version épinglée porte une empreinte
  integrity="sha256-..." et crossorigin="anonymous".
  Non couvert : grist-plugin-api.js, URL non versionnée.
  pdf.js (pdf.min.mjs et pdf.worker.min.mjs) est chargé par le script, qui
  ne peut pas porter d'attribut integrity : chaque fichier est téléchargé,
  son empreinte SHA-256 comparée à la valeur épinglée dans PDFJS, et il
  n'est exécuté que si elle correspond.

  TABLES AUTO-CRÉÉES
  ------------------
  📋 BIBLIOTHÈQUE KANBAN ⚡ (BIBLIOTHEQUE_KANBAN_ après renommage) : table
  technique de paramétrage, une ligne par Kanban (CLE = CONFIG:<identifiant>)
  dont la colonne VALEUR porte la configuration en JSON. Créée avec le premier
  Kanban. Exclue des listes de tables par estTableExclue().
  KANBAN_CARTES : une seule table de cartes pour tous les Kanbans créés par
  le widget (parcours "Partir de zéro" et "Utiliser un modèle"), créée avec
  le premier d'entre eux. Aucune autre table n'est créée ensuite. Chaque
  carte porte l'identifiant de son Kanban (KANBAN), son titre (TITRE), sa
  colonne (COLONNE, liste de choix) et son rang (ORDRE), puis les
  informations choisies. Un nouveau Kanban réutilise une colonne existante
  de même nom et de même type et n'ajoute que celles qui manquent ; les
  valeurs proposées (personnes, priorités...) restent propres à chaque
  Kanban. Supprimer un Kanban supprime ses cartes et les colonnes dont aucun
  autre Kanban ne se sert ; la table reste.
  KANBAN_HISTORIQUE et KANBAN_COMMENTAIRE : colonnes techniques du fil
  d'activité. KANBAN_HISTORIQUE est une formule de déclenchement
  (recalculée à chaque modification de la ligne) générée par le widget à
  partir des informations suivies : elle compare l'état précédent de la
  carte (variable value) à son état actuel et ajoute les différences, avec
  user.Name et NOW(), dans un JSON {"etat", "journal", "com"} limité à 300
  événements. Le widget dépose chaque commentaire dans KANBAN_COMMENTAIRE ;
  la formule l'ajoute au fil. Pour un Kanban branché, ces deux colonnes ne
  sont ajoutées à la table existante que si l'option est cochée.
  Identifiants de champs en majuscules. Chaque table porte les quatre champs
  de métadonnées CREE_LE, CREE_PAR, MODIFIE_LE, MODIFIE_PAR. Les pages créées
  automatiquement avec les tables sont supprimées aussitôt : le widget est la
  seule interface prévue.

  CHAMPS DE MÉTADONNÉES
  ----------------------
  CREE_LE, CREE_PAR, MODIFIE_LE et MODIFIE_PAR sont des colonnes à formule
  de déclenchement, alimentées par la plateforme et jamais par ce widget.

  CONFIGURATION ET SOURCE UNIQUE
  -------------------------------
  Kanbans créés par le widget : leurs colonnes (À faire, En cours...) et leur
  ordre sont rangés dans leur configuration. Kanbans branchés sur une table
  existante : les colonnes sont lues à chaque chargement dans leur source
  (lignes de la table référencée, ou valeurs d'une colonne de choix). Aucun appel à setOption :
  la configuration vit dans la bibliothèque. Le dernier Kanban consulté est
  retenu par le navigateur (localStorage), par document.

  MODIFICATIONS DES TABLES EXISTANTES
  -------------------------------------
  Parcours "Partir de mes données" : une seule modification de structure est
  possible, l'ajout d'une colonne numérique ORDRE (ou ORDRE_KANBAN si le nom
  est pris) pour mémoriser le rangement manuel des cartes ; elle est annoncée
  à l'étape de vérification. Aucune colonne n'est jamais retypée ni
  supprimée : une colonne retirée du Kanban reste dans la table. Les valeurs
  d'une liste de choix utilisée comme étape peuvent être renommées,
  ajoutées, réordonnées ou supprimées depuis les paramétrages (cartes mises
  à jour en conséquence).

  RAFRAÎCHISSEMENT ET LIAISON
  -----------------------------
  Les données sont lues par fetchTable. Quand la vue personnalisée est liée à
  la table des cartes, les filtres et la sélection par une autre vue sont
  respectés (identifiants reçus par onRecords), et ouvrir une carte déplace le
  curseur sur la ligne correspondante. Toute mise à jour reçue pendant un
  glisser-déposer ou une fiche ouverte est différée à leur fermeture. Une
  minuterie unique pilote la relecture automatique.

  DROITS REQUIS
  --------------
  Accès complet au document : le widget crée des tables et des colonnes et
  écrit dans les cartes. Une personne en lecture seule voit les Kanbans ; ses
  tentatives d'écriture sont refusées par la plateforme.

  SÉCURITÉ
  ---------
  - Aucune exécution de code dynamique, aucun accès au cadre parent
  - Aucune donnée n'est insérée comme HTML : le DOM est construit par
    textContent et setAttribute ; le Markdown est affiché en texte brut.
    echapperHTML() fait partie du socle commun et reste disponible, sans
    appel dans cette version
  - Logo dessiné élément par élément (createElementNS) : aucun balisage
    n'est inséré
  - Pièces jointes et images de couverture : fichiers récupérés en Blob, le
    jeton d'accès n'apparaît dans aucun lien de la page ; aperçu limité aux
    images matricielles et aux PDF, type imposé d'après l'extension ; 20 Mo
    au plus, exécutables refusés
  - Liens : seuls les schémas http et https sont rendus cliquables, avec
    rel="noopener noreferrer"
  - Journalisation via logSecurite(), messages d'erreur neutres
  - Confirmations par modales HTML, écouteurs posés par addEventListener

  JETON D'ACCES DANS LES APPELS REST
  ----------------------------------
  Le téléchargement des pièces jointes transmet le jeton d'accès en
  paramètre d'URL de l'appel fetch. La forme attendue serait l'en-tête
  Authorization, mais elle ne fonctionne pas sur la plateforme : le widget
  s'exécute dans un cadre d'origine différente
  de celle de l'API, et cet en-tête impose un contrôle préalable que le
  serveur refuse. Le jeton n'apparaît dans aucun lien ni attribut de la
  page, mais il peut figurer dans les journaux du serveur.
  Atténuations : jeton demandé au moment de l'appel, limité au seul
  document courant, renouvelé avant expiration, jamais stocké hors de la
  mémoire de la page ni journalisé.

  DROITS ET RÉGLAGE ACL RECOMMANDÉ
  --------------------------------
  Trois niveaux : lecteurs (consultation, recherche, filtres, fiche en
  lecture), éditeurs (en plus : ajout, modification, déplacement et
  suppression des cartes, commentaires), propriétaires (en plus :
  paramétrage, création et suppression des Kanbans, ordre des colonnes).
  Le widget lit deux lignes témoins de BIBLIOTHEQUE_KANBAN (CLE valant
  ACCES_EDITION et ACCES_PARAMETRAGE), qu'il crée une fois. Une règle
  d'accès les rend illisibles à ceux qui ne doivent pas modifier ou
  paramétrer ; la marche à suivre est affichée dans les paramétrages.
  Sans ces règles, un refus d'écriture fait basculer l'interface en
  lecture seule. Masquer est un confort : la protection réelle vient des
  règles d'accès et des droits du document.
  Le chargement n'écrit rien : réparation des colonnes et formule
  d'historique sont faites au paramétrage, par un propriétaire.

  ACCESSIBILITÉ
  --------------
  Barre d'étapes et onglets utilisables au clavier, état des étapes et des
  enregistrements annoncé aux lecteurs d'écran, noms accessibles contenant le
  texte visible, couleur jamais seule porteuse d'information, cibles d'au
  moins 24 px, alternatives au glisser-déposer.

  DSFR
  -----
  Le Système de design de l'État (DSFR) est réservé par ses modalités
  d'utilisation aux sites de l'État : vérifiez qu'elles s'appliquent à
  votre usage avant de déployer ce widget.

  THÈME
  ------
  data-fr-theme="light" : le widget reste en thème clair, par cohérence avec
  l'application hôte affichée autour du cadre.
-->

    .w-recap { border: 1px solid var(--border-default-grey); padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
    .w-recap__tete { display: flex; align-items: center; gap: .5rem; }
    .w-recap__tete h3 { margin: 0; font-size: .9rem; font-weight: 700; color: var(--text-title-blue-france); flex: 1; }
    .w-recap ul { margin: 0; padding-left: 1.25rem; font-size: .875rem; line-height: 1.6; }
    .w-form-info { border: 2px solid var(--border-action-high-blue-france); padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .w-form-info__actions { display: flex; justify-content: flex-end; gap: .5rem; flex-wrap: wrap; }
    .w-tableau-cols { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .w-tableau-cols th { text-align: left; padding: .5rem .75rem; font-size: .8125rem; background: var(--background-alt-grey); color: var(--text-default-grey);
      border-bottom: 2px solid var(--border-plain-grey); }
    .w-tableau-cols td { padding: .5rem .75rem; border-bottom: 1px solid var(--border-default-grey); vertical-align: middle; }
    .w-defile-x { overflow-x: auto; }
    .w-centre { max-width: 40rem; margin: 2rem auto 0; text-align: center; display: flex; flex-direction: column; gap: 1rem; align-items: center; }

  /* === SECTION : TABLEAU === */
    .w-outils { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .w-outils__champ { display: flex; flex-direction: column; min-width: 10rem; }
    .w-outils__champ .fr-label { font-size: .75rem; color: var(--text-mention-grey); }
    .w-outils__champ .fr-input, .w-outils__champ .fr-select { margin-top: .25rem; }
    .w-tableau { display: flex; gap: .75rem; align-items: flex-start; overflow-x: auto; padding-bottom: .75rem; }
    /* Vue Kanban : la page ne defile pas ; chaque colonne defile seule. */
    .w-contenu--kanban { display: flex; flex-direction: column; overflow: hidden; }
    .w-contenu--kanban #kPanneau { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* Disposition du Kanban : panneau des filtres et reglages a gauche,
       identite et colonnes a droite. */
    .w-disposition { display: flex; gap: 1.5rem; flex: 1; min-height: 0; position: relative; }
    .w-principal { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .w-volet { flex: 0 0 16rem; min-height: 0; display: flex; background: var(--background-alt-grey); border-left: .25rem solid var(--border-action-high-blue-france); color: var(--text-default-grey); }
    .w-volet__contenu { flex: 1; min-width: 0; overflow-y: auto; padding: .75rem 1rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .w-volet__tete { display: none; align-items: center; justify-content: space-between; gap: .5rem; }
    .w-volet__titre { margin: 0; font-size: .875rem; font-weight: 700; color: var(--text-title-grey); }
    .w-volet__bloc { display: flex; flex-direction: column; gap: .75rem; }
    .w-volet__bloc .fr-input, .w-volet__bloc .fr-select { width: 100%; }
    .w-volet__bloc .w-outils__champ { width: 100%; }
    .w-volet__bloc + .w-volet__bloc { padding-top: .5rem; }
    .w-volet__entete { display: flex; align-items: center; gap: .5rem; }
    .w-volet__puce { flex-shrink: 0; width: 1.5rem; height: 1.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-inverted-blue-france); background: var(--background-action-high-blue-france); }
    .w-volet__h { margin: 0; font-size: 1rem; line-height: 1.5rem; font-weight: 700; color: var(--text-title-grey); }
    .w-volet__bloc .fr-label .fr-hint-text { margin-top: .125rem; }
    .w-volet__case { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; }
    .w-volet .w-aide__texte { flex: 1 0 100%; }
    .w-volet__actions { display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; }
    .w-volet__actions .fr-btn--secondary { margin-top: .25rem; }
    .w-volet-mobile { display: none; }
    /* Poignee : fine bande sur le bord droit du panneau, deux traits
       verticaux ; un clic replie ou deplie le panneau. */
    .w-volet__poignee { position: relative; flex: 0 0 .75rem; align-self: stretch; padding: 0; cursor: pointer; border: 0; border-left: 1px solid var(--border-default-grey);
      background: var(--background-alt-grey); color: var(--text-default-grey); }
    .w-volet__poignee::before { content: ''; position: absolute; top: 50%; left: 50%; width: .25rem; height: 1.75rem; margin: -.875rem 0 0 -.125rem;
      border-left: 1px solid var(--border-plain-grey); border-right: 1px solid var(--border-plain-grey); }
    .w-volet__poignee:hover { background: var(--background-contrast-grey); color: var(--text-default-grey); }
    .w-volet__poignee:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: -2px; }
    .w-volet--replie { flex-basis: auto; }
    .w-volet--replie .w-volet__contenu { display: none; }
    .w-volet--replie .w-volet__poignee { flex-basis: 1rem; border-left: 0; }
    .w-volet__compte { position: absolute; top: .5rem; left: 50%; transform: translateX(-50%); min-width: 1.25rem; height: 1.25rem; padding: 0 .25rem; border-radius: 999px;
      font-size: .75rem; font-weight: 700; line-height: 1.25rem; text-align: center; color: var(--text-inverted-blue-france); background: var(--background-action-high-blue-france); }
    .w-volet__compte:empty { display: none; }
    /* Ecran etroit : le panneau s'ouvre par-dessus le Kanban. */
    @media (max-width: 48em) {
      .w-volet, .w-volet--replie { display: none; position: absolute; z-index: 30; top: 0; bottom: 0; left: 0; width: min(20rem, 92%); border-right: 1px solid var(--border-plain-grey); }
      .w-volet--mobile-ouvert, .w-volet--mobile-ouvert.w-volet--replie { display: flex; }
      .w-volet--replie .w-volet__contenu { display: flex; }
      .w-volet__poignee { display: none; }
      .w-volet__tete { display: flex; }
      .w-volet-mobile { display: inline-flex; flex-shrink: 0; }
      .w-disposition { gap: 0; }
    }
    .w-contenu--kanban .w-tableau { flex: 1; min-height: 0; align-items: stretch; }
    .w-contenu--kanban .w-colonne { max-height: 100%; min-height: 0; }
    .w-contenu--kanban .w-colonne__liste { flex: 1; min-height: 3rem; overflow-y: auto; overscroll-behavior: contain; }
    .w-colonne__tete .w-colonne__ajouter { margin-left: auto; }
    /* Bouton "+" rond de 28 px : taille de cible suffisante (RGAA, WCAG
       2.5.8), sans la hauteur minimale d'un bouton du systeme de design. */
    .w-plus { width: 1.75rem; height: 1.75rem; flex-shrink: 0; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; line-height: 1;
      background: var(--background-action-high-blue-france); color: var(--text-inverted-blue-france); }
    .w-plus:hover { background: var(--background-action-high-blue-france-hover); color: var(--text-inverted-blue-france); }
    .w-identite { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .w-identite__texte { min-width: 0; max-width: 48rem; }
    .w-identite .w-titre-vue { margin-bottom: .25rem; }
    .w-champ-aide { position: relative; }
    .w-libelle-aide { display: flex; align-items: center; gap: .25rem; }
    .w-libelle-aide .fr-label { margin-bottom: 0; }
    /* Bouton d'aide "i" : cible de 24 px, rond fin bleu France. */
    /* Bouton d'aide "i" : petit rond en exposant, sans fond ; la zone
       cliquable reste de 24 px. */
    .w-aide { width: 1.5rem; height: 1.5rem; flex-shrink: 0; padding: 0; margin: -.5rem 0 0 -.25rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 0; color: var(--text-action-high-blue-france); vertical-align: super; }
    .w-aide__rond { width: .875rem; height: .875rem; border-radius: 50%; border: 1px solid currentColor; display: inline-flex; align-items: center; justify-content: center;
      font-family: Georgia, 'Times New Roman', serif; font-size: .75rem; font-weight: 700; font-style: italic; line-height: 1; }
    .w-aide[aria-expanded="true"] .w-aide__rond { color: var(--text-inverted-blue-france); background: var(--background-action-high-blue-france); border-color: var(--border-action-high-blue-france); }
    .w-aide:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 0; }
    .w-aide__texte { position: absolute; z-index: 20; top: 100%; left: 0; width: 18rem; max-width: 80vw; margin: .375rem 0 0; padding: .75rem; font-size: .8125rem; line-height: 1.45;
      color: var(--text-default-grey); background: var(--background-default-grey); border: 1px solid var(--border-plain-grey); }
    .w-aide__texte--droite { left: auto; right: 0; }
    /* Dans le panneau, l'aide s'insere dans le flux : jamais tronquee, jamais
       sous le Kanban. */
    .w-volet .w-aide__texte { position: static; width: auto; max-width: none; margin: 0; }
    .w-astuces { display: flex; flex-direction: column; align-items: flex-end; gap: .25rem; margin: .375rem 0 0 auto; }
    .w-astuce { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: .25rem; margin: 0; font-size: .75rem; color: var(--text-mention-grey); text-align: right; }
    .w-astuce__icone { color: var(--text-action-high-blue-france); }
    /* Infobulle au survol et au focus clavier (l'infobulle native du
       navigateur ne s'affiche pas dans le cadre de la plateforme). */
    .w-infobulle { position: relative; }
    .w-infobulle::after { content: attr(data-infobulle); position: absolute; z-index: 40; bottom: calc(100% + .375rem); right: 0; white-space: nowrap; pointer-events: none;
      padding: .25rem .5rem; font-family: Marianne, arial, sans-serif; font-size: .75rem; font-weight: 400; font-style: normal; line-height: 1.4;
      color: var(--text-default-grey); background: var(--background-default-grey); border: 1px solid var(--border-plain-grey); opacity: 0; visibility: hidden; }
    .w-infobulle:hover::after, .w-infobulle:focus-visible::after { opacity: 1; visibility: visible; }
    .w-infobulle--dessous::after { bottom: auto; top: calc(100% + .375rem); }
    .w-infobulle--dessous-gauche::after { bottom: auto; top: calc(100% + .375rem); right: auto; left: 0; }
    .w-plus--dessin { width: 1.125rem; height: 1.125rem; font-size: .75rem; cursor: default; }
    .w-plus--dessin:hover { background: var(--background-action-high-blue-france); color: var(--text-inverted-blue-france); }
    .w-plus:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 2px; }
    /* Colonne vide repliee a la verticale : bande etroite sur toute la
       hauteur, bouton + en haut, puis le compteur et le nom ecrit a la
       verticale. Toute la bande reste une zone de depot ; des qu'elle
       recoit une carte, la colonne se redeploie. */
    .w-tableau .w-colonne--vide, .w-tableau.w-compact .w-colonne--vide { flex: 0 0 3rem; padding: .5rem .25rem; }
    .w-contenu--kanban .w-colonne--vide { align-self: stretch; }
    .w-colonne--vide .w-colonne__tete { flex-direction: column; align-items: center; gap: .5rem; }
    .w-colonne--vide .w-colonne__ajouter { order: -2; margin-left: 0; }
    .w-colonne--vide .w-colonne__compte { order: -1; }
    .w-colonne__archives { flex-shrink: 0; margin-left: auto; width: 1.75rem; height: 1.75rem; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-action-high-blue-france); background: transparent; border: 1px solid var(--border-action-high-blue-france); border-radius: 50%; }
    .w-colonne__archives:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 2px; }
    .w-colonne--vide .w-colonne__archives { order: -2; margin-left: 0; }
    .w-colonne--archive { background: var(--background-contrast-grey); color: var(--text-default-grey); }
    .w-colonne--vide .w-colonne__poignee { order: 1; }
    .w-colonne--vide .w-colonne__titre { flex: 0 0 auto; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow-wrap: normal; max-height: 16rem; overflow: hidden; text-overflow: ellipsis; }
    .w-contenu--kanban .w-colonne--vide .w-colonne__liste, .w-colonne--vide .w-colonne__liste { flex: 1 1 auto; min-height: 3rem; }
    .w-glisser-en-cours .w-colonne--vide .w-colonne__liste { border: 1px dashed var(--border-plain-grey); }
    .w-explication { margin: .25rem 0 0; font-size: .875rem; color: var(--text-mention-grey); white-space: pre-line; max-width: 60rem; }
    .w-explication--repliee { max-height: 4.2em; overflow: hidden; }
    .w-colonne { flex: 0 0 17rem; background: var(--background-alt-grey); color: var(--text-default-grey); padding: .75rem; display: flex; flex-direction: column; gap: .625rem;
      border-top: 3px solid transparent; }
    .w-compact .w-colonne { flex-basis: 14rem; }
    .w-colonne--alerte { border-top-color: var(--border-plain-warning); }
    .w-colonne__tete { display: flex; align-items: flex-start; gap: .5rem; }
    .w-colonne__titre { margin: 0; font-size: .9rem; font-weight: 700; flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .w-colonne__tete .w-plus { flex-shrink: 0; }
    /* Compteur juste apres le nom de la colonne ; le bouton + reste a droite. */
    .w-colonne__compte { font-size: .75rem; color: var(--text-mention-grey); flex-shrink: 0; line-height: 1.5rem; }
    .w-colonne__titre { line-height: 1.5rem; }
    .w-colonne__liste { display: flex; flex-direction: column; gap: .5rem; min-height: 3rem; }
    .w-colonne__vide { font-size: .8125rem; color: var(--text-mention-grey); margin: 0; padding: .5rem 0; }
    .w-carte { background: var(--background-default-grey); border: 1px solid var(--border-default-grey); padding: .75rem;
      display: flex; flex-direction: column; gap: .5rem; cursor: pointer; color: var(--text-default-grey); }
    .w-carte:hover { border-color: var(--border-action-high-blue-france); }
    .w-carte.sortable-chosen { border-color: var(--border-action-high-blue-france); }
    .sortable-fallback { opacity: .9; cursor: grabbing; }
    .w-compact .w-carte { padding: .5rem .625rem; gap: .25rem; }
    .w-carte:focus-within { border-color: var(--border-action-high-blue-france); }
    .w-carte.sortable-ghost { opacity: .4; }
    .w-carte__titre { margin: 0; font-size: .875rem; font-weight: 700; line-height: 1.35; }
    .w-carte__ouvrir { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--text-title-blue-france);
      text-align: left; cursor: pointer; }
    .w-carte__ouvrir:hover { text-decoration: underline; }
    .w-carte__ouvrir:focus-visible { outline: 2px solid var(--border-action-high-blue-france); outline-offset: 2px; }
    /* Une information par ligne : le nom puis la valeur, qui se suivent et
       se replient comme une phrase, avec un espacement toujours identique. */
    .w-carte__infos { display: flex; flex-direction: column; gap: .1875rem; font-size: .8125rem; color: var(--text-default-grey); }
    /* Nom d'une information sur la carte : plus petit et plus discret que la
       valeur, pour les distinguer d'un coup d'oeil. */
    .w-carte__libelle { font-size: .75rem; line-height: 1.2; color: var(--text-mention-grey); font-weight: 400; margin-right: .25rem; }
    .w-carte__valeur { font-size: .8125rem; font-weight: 500; }
    .w-carte__groupe { display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; }
    .w-carte__couverture { display: block; width: calc(100% + 1.5rem); max-height: 8rem; margin: -.75rem -.75rem 0; object-fit: cover;
      background: var(--background-contrast-grey); color: var(--text-default-grey); }
    .w-apercu-couverture { height: 4rem; margin: -.75rem -.75rem 0; background: var(--background-contrast-grey); color: var(--text-mention-grey);
      font-size: .75rem; display: flex; align-items: center; justify-content: center; }
    /* Couleur des cartes : un liseré a gauche, selon la valeur d'une
       information. La valeur reste ecrite sur la carte. */
    .w-carte--couleur { border-left-width: .25rem; }
    .w-carte--c-green-menthe { border-left-color: var(--background-action-high-green-menthe, var(--border-plain-grey)); }
    .w-carte--c-blue-ecume { border-left-color: var(--background-action-high-blue-ecume, var(--border-plain-grey)); }
    .w-carte--c-purple-glycine { border-left-color: var(--background-action-high-purple-glycine, var(--border-plain-grey)); }
    .w-carte--c-orange-terre-battue { border-left-color: var(--background-action-high-orange-terre-battue, var(--border-plain-grey)); }
    .w-carte--c-pink-tuile { border-left-color: var(--background-action-high-pink-tuile, var(--border-plain-grey)); }
    .w-carte--c-yellow-tournesol { border-left-color: var(--background-action-high-yellow-tournesol, var(--border-plain-grey)); }
    .w-carte--c-brown-caramel { border-left-color: var(--background-action-high-brown-caramel, var(--border-plain-grey)); }
    .w-carte--c-green-archipel { border-left-color: var(--background-action-high-green-archipel, var(--border-plain-grey)); }
    /* Rangee d'onglets figee en haut quand la page defile (creation,
       parametrages). Le decalage annule la marge haute du contenu. */
    .w-onglets { position: sticky; top: -1rem; z-index: 5; background: var(--background-default-grey); padding-top: .25rem; color: var(--text-default-grey); }
    .w-carte__info { display: block; line-height: 1.35; }
    .w-carte__info > .fr-icon--sm::before, .w-carte__info > [class*="fr-icon-"]::before { vertical-align: -.125rem; }
    .w-carte__info > [class*="fr-icon-"] { margin-right: .25rem; }
    .w-carte__coche { color: var(--text-default-success); margin-left: .125rem; }
    .w-carte__ico { color: var(--text-mention-grey); margin-right: .25rem; }
    .w-carte__retard .w-carte__ico { color: inherit; }
    .w-carte__groupe .w-carte__ico, .w-carte__texte .w-carte__ico { margin-right: .125rem; }
    .w-carte__retard { color: var(--text-default-error); font-weight: 700; }
    .w-carte__invalide { color: var(--text-default-warning); }
    .w-lecture-seule { display: inline-flex; align-items: center; gap: .25rem; }
    .w-liste-cases { max-height: 12rem; overflow-y: auto; border: 1px solid var(--border-default-grey); padding: .5rem .75rem; margin-top: .5rem; }
    .w-carte__badges { display: flex; flex-wrap: wrap; gap: .25rem; }
    .w-carte__pied { display: flex; justify-content: flex-end; align-items: center; gap: .25rem; }
    .w-carte__bulle { display: inline-flex; align-items: center; gap: .25rem; }
    .w-carte__nbcom { font-size: .75rem; font-weight: 700; }
    /* Fil d'activite de la fiche : evenements et commentaires, du plus
       ancien au plus recent, champ de saisie en bas. */
    .w-activite { display: flex; flex-direction: column; gap: .75rem; }
    .w-fiche__onglets { margin-bottom: 1rem; }
    .w-fiche__panneau[hidden] { display: none; }
    .w-activite__fil { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .w-activite__item { margin: 0; padding: 0; font-size: .8125rem; line-height: 1.45; color: var(--text-default-grey); }
    .w-activite__entete { margin: 0; font-size: .75rem; color: var(--text-mention-grey); }
    .w-activite__entete strong { color: var(--text-title-grey); }
    .w-activite__texte { margin: .125rem 0 0; }
    .w-activite__item--commentaire .w-activite__texte { padding: .5rem .75rem; white-space: pre-line; background: var(--background-alt-blue-france); color: var(--text-default-grey); }
    .w-activite__saisie { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
    .w-activite__saisie .fr-input { width: 100%; }
    .w-carte__texte { font-size: .8125rem; color: var(--text-default-grey); margin: 0; overflow-wrap: anywhere; }

  /* === SECTION : AJUSTEMENTS DU BANDEAU ===
     Regles ajoutees apres celles du bandeau commun, sans les modifier : un
     titre trop long est coupe par des points de suspension. */
    .w-bandeau__marque { min-width: 0; flex-shrink: 1; }
    .w-bandeau__titre { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .w-poignee { cursor: grab; color: var(--text-mention-grey); }

  /* === SECTION : BARRE D'ETAPES === */
    .w-stepper .fr-stepper__title { margin-bottom: .75rem; }
    .w-etapes { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: .25rem; }
    .w-etapes__item { display: flex; flex-direction: column; gap: .375rem; min-width: 0; }
    .w-etapes__segment { display: block; height: .375rem; background: var(--background-contrast-grey); color: var(--text-default-grey); }
    .w-etapes__nom { font-size: .75rem; line-height: 1.25; color: var(--text-mention-grey); overflow-wrap: anywhere; }
    /* Trois etats bien distincts : faite en vert, en cours en bleu France
       et mise en avant (segment epais, fond clair, nom en gras), a venir en
       gris. */
    .w-etapes__item--faite .w-etapes__segment { background: var(--background-flat-success); color: var(--text-inverted-success); }

    @media (max-width: 48em) {

<script>

];

].concat(COLONNES_META);
var IDS_META = ['CREE_LE', 'CREE_PAR', 'MODIFIE_LE', 'MODIFIE_PAR'];
/* Colonnes techniques du fil d'activite : la formule d'historique et la

var COL_HISTORIQUE = 'KANBAN_HISTORIQUE';

/* Types de reponse proposes a l'agent, dans ses mots. */
var GENRES = [
  { code: 'texte', libelle: 'Texte', exemple: 'Un lieu, un numéro de dossier, une description', type: 'Text' },
  /* Meme type Texte, avec le retour a la ligne : choisi par une case a

  { code: 'texte_long', libelle: 'Texte sur plusieurs lignes', exemple: '', type: 'Text', masque: true },
  { code: 'date', libelle: 'Date', exemple: 'Une échéance, une date de réception', type: 'Date' },

  { code: 'montant', libelle: 'Montant en euros', exemple: 'Un budget, un coût', type: 'Numeric', options: { numMode: 'currency', currency: 'EUR' }, stocke: 'nombre' },
  { code: 'pourcentage', libelle: 'Pourcentage', exemple: 'Un taux d\'avancement', type: 'Numeric', options: { numMode: 'percent' }, stocke: 'nombre' },
  { code: 'oui_non', libelle: 'Oui ou non', exemple: 'Une case à cocher', type: 'Bool' },

];
var GENRES_A_VALEURS = ['choix', 'etiquettes', 'personne'];
var GENRES_MODIFIABLES = ['texte', 'texte_long', 'date', 'dateheure', 'nombre', 'oui_non', 'choix', 'etiquettes', 'personne', 'lien', 'reference', 'references', 'pj'];
/* Au-dela de ce nombre de lignes, une reference se choisit avec une
   recherche plutot que dans une longue liste. */
var SEUIL_RECHERCHE_REF = 30;
/* Pieces jointes : controles d'ergonomie avant envoi. Ils ne remplacent pas

var PJ_TAILLE_MAX = 20 * 1024 * 1024;
var PJ_EXTENSIONS_INTERDITES = ['exe', 'bat', 'cmd', 'com', 'scr', 'msi', 'vbs', 'js', 'jse', 'ps1', 'sh', 'jar', 'dll', 'lnk', 'reg', 'hta'];

      { libelle: 'Priorité', genre: 'choix', valeurs: ['Basse', 'Normale', 'Haute', 'Urgente'] },

/** Journalisation. Niveaux admis : 'ERREUR', 'AVERTISSEMENT', 'INFO'. */
function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERREUR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'AVERTISSEMENT') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('AVERTISSEMENT', 'Voile de chargement masque automatiquement apres 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Chargement…'; }
  /* Le voile n'apparait qu'au-dela du seuil : une operation breve ne
     provoque plus de clignotement de l'ecran. masquerLoader annule ce
     delai, donc le voile n'est jamais pose pour une operation rapide. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight force un reflow avant le retrait de la classe. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

var _minuterieErreur = null;

function afficherErreur(message, erreur) {
  logSecurite('ERREUR', message, erreur);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message || 'Une erreur est survenue.'; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function masquerErreur() {
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); _minuterieErreur = null; }
  var bandeau = document.getElementById('wErreur');
  if (bandeau) { bandeau.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('AVERTISSEMENT', quoi, e); });
  }
  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';
  var div = document.createElement('div');
  div.textContent = String(texte);
  /* Les guillemets sont echappes en plus des chevrons : la sortie alimente
     aussi des valeurs d'attributs (title, data-*, value), ou un guillemet
     non echappe permettrait de sortir de l'attribut. */
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if (up.indexOf('BIBLIOTHEQUE') !== -1 && brut.charAt(brut.length - 1) === '_') { return true; }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

   Logo madeXcé, dessiné élément par élément : aucun balisage n'est inséré
   comme HTML, aucune ressource externe. Les couleurs viennent des classes
   .w-logo__* (jetons DSFR). */
function dessinerLogo() {
  var c = document.getElementById('bandeau-logo');
  if (!c) { return; }
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 100 40');
  svg.setAttribute('class', 'w-logo');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'madeXcé');
  svg.setAttribute('focusable', 'false');
  var texte = document.createElementNS(ns, 'text');
  texte.setAttribute('x', '2');
  texte.setAttribute('y', '27');
  texte.setAttribute('font-size', '19');
  texte.setAttribute('textLength', '96');
  texte.setAttribute('lengthAdjust', 'spacingAndGlyphs');
  [['made', 'w-logo__made'], ['X', 'w-logo__x'], ['Cé', 'w-logo__ce']].forEach(function (morceau) {
    var t = document.createElementNS(ns, 'tspan');
    t.setAttribute('class', morceau[1]);
    t.textContent = morceau[0];
    texte.appendChild(t);
  });
  svg.appendChild(texte);
  c.textContent = '';
  c.appendChild(svg);
}

/* === SECTION : UTILITAIRES DOM ===
   Le DOM est construit par textContent : aucune donnee n'est jamais inseree
   comme HTML. */
function creer(tag, o, enfants) {
  var n = document.createElement(tag);
  o = o || {};
  if (o.classe) { n.className = o.classe; }
  if (o.id) { n.id = o.id; }
  if (o.texte !== undefined && o.texte !== null) { n.textContent = String(o.texte); }
  if (o.attrs) {
    Object.keys(o.attrs).forEach(function (k) {
      var v = o.attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      n.setAttribute(k, v === true ? '' : String(v));
    });
  }
  if (tag === 'button' && !n.hasAttribute('type')) { n.setAttribute('type', 'button'); }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') { n.setAttribute('autocomplete', 'off'); }
  if (o.valeur !== undefined && o.valeur !== null) { n.value = String(o.valeur); }
  if (o.coche) { n.checked = true; }
  if (o.clic) { n.addEventListener('click', o.clic); }
  if (o.change) { n.addEventListener('change', o.change); }
  if (o.saisie) { n.addEventListener('input', o.saisie); }
  (enfants || []).forEach(function (e) {
    if (e === null || e === undefined || e === false) { return; }
    n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
  });
  return n;
}

function bouton(libelle, variante, icone, clic, o) {
  o = o || {};
  var classes = ['fr-btn'];
  if (variante === 'secondaire') { classes.push('fr-btn--secondary'); }
  if (variante === 'tertiaire') { classes.push('fr-btn--tertiary'); }
  if (variante === 'discret') { classes.push('fr-btn--tertiary-no-outline'); }
  if (o.petit) { classes.push('fr-btn--sm'); }
  if (icone) { classes.push('fr-icon-' + icone); classes.push(o.iconeSeule ? 'fr-btn--icon-only' : (o.iconeDroite ? 'fr-btn--icon-right' : 'fr-btn--icon-left')); }
  if (o.classe) { classes.push(o.classe); }
  /* Bouton a icone seule : son libelle n'est lu que par les lecteurs
     d'ecran, jamais affiche, quelle que soit la version du DSFR. */
  var b = creer('button', { classe: classes.join(' '), texte: o.iconeSeule ? null : libelle, id: o.id,
    attrs: { 'aria-label': o.aria || null, disabled: o.desactive || null } }, o.iconeSeule ? [creer('span', { classe: 'fr-sr-only', texte: libelle })] : null);
  if (o.attrs) { Object.keys(o.attrs).forEach(function (k) { b.setAttribute(k, o.attrs[k]); }); }
  if (clic) {
    b.addEventListener('click', function (e) {
      var r = clic(e);
      if (r && typeof r.then === 'function') { relayer(r, 'Action : ' + libelle); }
    });
  }
  return b;
}

function badge(texte, variante) {

function couleurBadge(texte) {
  var s = String(texte || '');
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 997; }
  return COULEURS_BADGES[h % COULEURS_BADGES.length];
}

function groupeChamp(libelle, champ, aide, obligatoire) {
  var id = champ.id;
  var lab = creer('label', { classe: 'fr-label', attrs: { 'for': id } }, [libelle]);
  if (obligatoire) {
    lab.appendChild(document.createTextNode(' '));
    lab.appendChild(creer('span', { texte: '(obligatoire)', classe: 'w-mention', attrs: { 'aria-hidden': 'true' } }));
    champ.setAttribute('aria-required', 'true');
  }
  if (aide) { lab.appendChild(creer('span', { classe: 'fr-hint-text', texte: aide })); }
  return creer('div', { classe: 'fr-input-group' }, [lab, champ]);
}

function saisie(id, valeur, o) {
  o = o || {};
  if (o.multiligne) {
    return creer('textarea', { classe: 'fr-input', id: id, valeur: valeur || '', attrs: { rows: o.lignes || 3, placeholder: o.indice || null } });
  }
  return creer('input', { classe: 'fr-input', id: id, valeur: valeur || '',
    attrs: { type: o.type || 'text', placeholder: o.indice || null, inputmode: o.clavier || null } });
}

function liste(id, options, valeur, o) {
  o = o || {};
  var s = creer('select', { classe: 'fr-select', id: id });
  if (o.vide !== undefined) { s.appendChild(creer('option', { texte: o.vide, attrs: { value: '' } })); }
  options.forEach(function (op) {
    var opt = creer('option', { texte: op.libelle, attrs: { value: op.valeur } });
    if (String(op.valeur) === String(valeur)) { opt.selected = true; }
    s.appendChild(opt);
  });
  return s;
}

function alerte(type, titre, texte) {

  if (texte) { a.appendChild(typeof texte === 'string' ? creer('p', { texte: texte }) : texte); }
  return a;
}

function vider(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

function normaliser(s) {
