/* Identifiant technique en majuscules, sans accent, derive d'un libelle. */
function versIdentifiant(libelle) {
  var s = String(libelle || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if (!s) { s = 'INFO'; }
  if (/^[0-9]/.test(s)) { s = 'C_' + s; }
  return s;
}

/* === SECTION : DATES ET NOMBRES ===
   Dates : timestamps Unix en secondes, convertis en UTC pour ne pas decaler
   le jour civil en heure d'ete. Zero designe une date vide. */
function formaterDate(sec) {
  if (sec === null || sec === undefined || sec === '' || typeof sec !== 'number' || sec === 0) { return ''; }
  var d = new Date(sec * 1000);
  return d.getUTCDate() + ' ' + MOIS_COURTS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function dateVersSaisie(sec) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var d = new Date(sec * 1000);
  var m = d.getUTCMonth() + 1;
  var j = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (j < 10 ? '0' : '') + j;
}

function saisieVersDate(texte) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(texte || ''));
  if (!m) { return null; }
  var a = parseInt(m[1], 10);
  var mo = parseInt(m[2], 10);
  var j = parseInt(m[3], 10);
  if (mo < 1 || mo > 12 || j < 1 || j > 31) { return null; }
  return Date.UTC(a, mo - 1, j) / 1000;
}

/* === Dates et heures ===
   Une colonne "Date et heure" porte son fuseau dans son type
   ("DateTime:Europe/Paris"). L'affichage et la saisie se font dans ce
   fuseau, jamais dans celui du navigateur ni en temps universel. */
function fuseauDe(col) {
  var t = col && col.type ? String(col.type) : '';
  var f = t.indexOf('DateTime:') === 0 ? t.slice(9) : '';
  try { new Intl.DateTimeFormat('fr-FR', { timeZone: f || 'Europe/Paris' }); return f || 'Europe/Paris'; } catch (e) { return 'Europe/Paris'; }
}

function partiesDansFuseau(sec, fuseau) {
  var parts = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: fuseau, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date(sec * 1000)).forEach(function (x) { parts[x.type] = x.value; });
  return { a: parseInt(parts.year, 10), m: parseInt(parts.month, 10), j: parseInt(parts.day, 10), h: parseInt(parts.hour, 10) % 24, mi: parseInt(parts.minute, 10) };
}

function formaterDateHeure(sec, fuseau) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var p = partiesDansFuseau(sec, fuseau);
  return p.j + ' ' + MOIS_COURTS[p.m - 1] + ' ' + p.a + ', ' + (p.h < 10 ? '0' : '') + p.h + ' h ' + (p.mi < 10 ? '0' : '') + p.mi;
}

/* Heure locale d'un fuseau vers timestamp : on part de l'heure lue comme
   universelle, puis on corrige du decalage du fuseau a cet instant, deux
   fois pour les changements d'heure. */
function epochDansFuseau(a, m, j, h, mi, fuseau) {
  var cible = Date.UTC(a, m - 1, j, h, mi) / 1000;
  var t = cible;
  for (var k = 0; k < 2; k++) {
    var p = partiesDansFuseau(t, fuseau);
    var lu = Date.UTC(p.a, p.m - 1, p.j, p.h, p.mi) / 1000;
    t = t + (cible - lu);
  }
  return t;
}

/* === Nombres ===
   Les formats de la colonne sont respectes : pourcentage, monnaie, nombre
   de decimales. */
function formatNombreDe(col) {
  var o = col && col.options ? col.options : {};
  var f = { style: 'decimal', maximumFractionDigits: 10 };
  if (o.numMode === 'percent') { f.style = 'percent'; f.maximumFractionDigits = 2; }
  if (o.numMode === 'currency') { f.style = 'currency'; f.currency = o.currency || 'EUR'; f.minimumFractionDigits = 2; f.maximumFractionDigits = 2; }
  if (typeof o.decimals === 'number') { f.minimumFractionDigits = o.decimals; if (f.maximumFractionDigits < o.decimals) { f.maximumFractionDigits = o.decimals; } }
  if (typeof o.maxDecimals === 'number') { f.maximumFractionDigits = Math.max(o.maxDecimals, f.minimumFractionDigits || 0); }
  if (col && col.type === 'Int' && f.style !== 'percent') { f.maximumFractionDigits = 0; f.minimumFractionDigits = 0; }
  return f;
}

function formaterNombreCol(v, col) {
  if (typeof v !== 'number' || !isFinite(v)) { return ''; }
  try { return new Intl.NumberFormat('fr-FR', formatNombreDe(col)).format(v); } catch (e) { return formaterNombre(v); }
}

/* Valeur non valide : texte saisi dans une colonne d'un autre type (la
   cellule apparait en rouge dans le tableur). Elle est montree telle
   quelle, signalee, et jamais effacee sans action de l'agent. */
function estValeurInvalide(genre, v) {
  return typeof v === 'string' && v !== '' && ['date', 'dateheure', 'nombre', 'reference', 'oui_non'].indexOf(genre) !== -1;
}

function lienDepuisTexte(t) {
  var m = /^(.*?)\s*(https?:\/\/\S+)$/i.exec(String(t || '').trim());
  return m ? { libelle: m[1] || m[2], url: m[2] } : null;
}

/* Raison affichee pour une information non modifiable. */
function raisonLectureSeule(col, genre) {
  if (!etat.peutModifier) { return 'Vos droits sur ce document permettent la consultation seulement'; }
  if (!col) { return 'Information introuvable'; }
  if (IDS_META.indexOf(col.colId) !== -1) { return 'Renseignée automatiquement'; }
  if (col.formule) { return 'Calculée automatiquement : elle ne se modifie pas'; }
  if (estEcrasee(col)) { return 'Mise à jour automatiquement à chaque modification de la carte'; }
  return 'Ce type d\'information ne se modifie pas ici';
}

function aujourdhuiSec() {
  var d = new Date();
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
}

function formaterNombre(v) {
  if (typeof v !== 'number' || !isFinite(v)) { return ''; }
  return v.toLocaleString('fr-FR');
}

function validerNombre(valeur, min, max, defaut) {
  var n = parseFloat(valeur);
  if (isNaN(n) || !isFinite(n)) return defaut;
  if (n < min) return min;
  if (n > max) return max;
  return n;
}

function lireNombreSaisi(texte) {
  var t = String(texte || '').replace(/\s/g, '').replace(',', '.');
  if (t === '') { return null; }
  if (!/^-?\d+(\.\d+)?$/.test(t)) { return undefined; }
  return validerNombre(t, -1e15, 1e15, null);
}

/* === SECTION : ACCES A L'API === */
function gristAvecTimeout(promesse, delaiMs) {
  return Promise.race([promesse, new Promise(function (_, rejeter) {
    setTimeout(function () { rejeter(new Error('Délai dépassé')); }, delaiMs);
  })]);
}

/* Une lecture sans reponse (message perdu au demarrage, cadre
   intermediaire) ou refusee de facon passagere est relancee, avec un delai
   croissant, avant d'etre signalee. Les ecritures ne sont jamais rejouees. */
async function lireTable(tid) {
  var delais = [10000, 20000, DELAI_API_MS];
  var derniere = null;
  for (var essai = 0; essai < delais.length; essai++) {
    try {
      return await gristAvecTimeout(grist.docApi.fetchTable(tid), delais[essai]);
    } catch (e) {
      derniere = e;
      logSecurite('AVERTISSEMENT', 'Lecture de ' + tid + ' sans réponse, nouvel essai', e);
      if (essai < delais.length - 1) { await new Promise(function (ok) { setTimeout(ok, 1000); }); }
    }
  }
  throw derniere;
}

/* Refus pour droits insuffisants : la personne consulte en lecture seule
   alors que son interface proposait la modification (regles d'acces non
   posees). L'interface bascule en lecture seule pour la suite. */
function estRefusDroits(e) {
  var m = String((e && (e.message || e)) || '');
  return /blocked by|access rules|acl_deny|permission|not allowed|insufficient|read.?only|viewer/i.test(m);
}
async function agir(actions) {
  try {
    return await gristAvecTimeout(grist.docApi.applyUserActions(actions), DELAI_API_MS);
  } catch (e) {
    if (estRefusDroits(e) && etat.peutModifier && !enParametrage()) {
      etat.peutModifier = false;
      etat.peutParametrer = false;
      logSecurite('INFO', 'Écriture refusée : passage en lecture seule', e);
    }
    throw e;
  }
}

/* Une cellule en erreur arrive sous la forme ['E', ...] : elle vaut vide. */
function valeurCellule(v) {
  if (Array.isArray(v) && v[0] === 'E') { return ''; }
  return v;
}

function colonneDe(donnees, col, i) {
  return donnees && donnees[col] ? valeurCellule(donnees[col][i]) : undefined;
}

/* === SECTION : METADONNEES DU DOCUMENT === */
async function chargerMeta() {
  etat.metaLueA = Date.now();
  var t = await lireTable('_grist_Tables');
  var c = await lireTable('_grist_Tables_column');
  var tables = {};
  var parRef = {};
  for (var i = 0; i < t.id.length; i++) {
    var tid = t.tableId[i];
    tables[tid] = { ref: t.id[i], tableId: tid, primaryViewId: t.primaryViewId ? t.primaryViewId[i] : 0,
      rawViewSectionRef: t.rawViewSectionRef ? t.rawViewSectionRef[i] : 0,
      resume: t.summarySourceTable ? !!t.summarySourceTable[i] : false };
    parRef[t.id[i]] = tid;
  }
  var colonnes = {};
  var colParRef = {};
  for (var j = 0; j < c.id.length; j++) {
    var tidC = parRef[c.parentId[j]];
    if (!tidC) { continue; }
    var opts = {};
    try { opts = c.widgetOptions[j] ? JSON.parse(c.widgetOptions[j]) : {}; } catch (e) { opts = {}; }
    var info = { ref: c.id[j], tableId: tidC, colId: c.colId[j], type: c.type[j] || 'Any', label: c.label ? (c.label[j] || c.colId[j]) : c.colId[j],
      formule: Boolean(c.isFormula[j]) && Boolean(c.formula[j]), formula: c.formula[j] || '',
      /* Colonne a formule vide : sans contenu possible, toute ecriture est refusee. */
      formuleVide: Boolean(c.isFormula[j]) && !c.formula[j],
      declencheur: !c.isFormula[j] && Boolean(c.formula[j]), options: opts,
      recalcWhen: c.recalcWhen ? c.recalcWhen[j] : 0, recalcDeps: c.recalcDeps ? c.recalcDeps[j] : null,
      visibleCol: c.visibleCol ? c.visibleCol[j] : 0, pos: c.parentPos ? c.parentPos[j] : j };
    colParRef[c.id[j]] = info;
    if (!colonnes[tidC]) { colonnes[tidC] = []; }
    colonnes[tidC].push(info);
  }
  Object.keys(colonnes).forEach(function (k) { colonnes[k].sort(function (a, b) { return a.pos - b.pos; }); });
  /* Nom affiche des tables : titre de la vue brute (le nom que l'agent a
     donne a la table), sinon nom de sa page, sinon identifiant sans
     soulignes. L'identifiant technique n'est jamais montre tel quel. */
  try {
    var vs = await lireTable('_grist_Views_section');
    var titres = {};
    for (var v = 0; v < vs.id.length; v++) { titres[vs.id[v]] = vs.title ? vs.title[v] : ''; }
    var vues = {};
    try { var vw = await lireTable('_grist_Views'); for (var w = 0; w < vw.id.length; w++) { vues[vw.id[w]] = vw.name ? vw.name[w] : ''; } } catch (e2) { vues = {}; }
    Object.keys(tables).forEach(function (k) { tables[k].libelle = titres[tables[k].rawViewSectionRef] || vues[tables[k].primaryViewId] || ''; });
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Noms des tables illisibles : identifiants affichés sans soulignés', e);
  }
  etat.meta = { tables: tables, colonnes: colonnes, colParRef: colParRef };
}

function libelleTable(tid) {
  var t = etat.meta && etat.meta.tables ? etat.meta.tables[tid] : null;
  return (t && t.libelle) || String(tid || '').replace(/_/g, ' ');
}

function colonnesDe(tid) {
  return (etat.meta.colonnes[tid] || []).filter(function (c) {
    return c.colId !== 'manualSort' && c.colId.indexOf('gristHelper_') !== 0;
  });
}

function infoColonne(tid, colId) {
  var l = etat.meta.colonnes[tid] || [];
  for (var i = 0; i < l.length; i++) { if (l[i].colId === colId) { return l[i]; } }
  return null;
}

function tableCibleRef(type) {
  var t = String(type || '');
  if (t.indexOf('Ref:') === 0) { return t.slice(4); }
  if (t.indexOf('RefList:') === 0) { return t.slice(8); }
  return null;
}

function colAffichageRef(col) {
  if (!col || !col.visibleCol) { return null; }
  var v = etat.meta.colParRef[col.visibleCol];
  return v ? v.colId : null;
}

function trouverTable(motif) {
  var up = motif.toUpperCase();
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) { if (ids[i].toUpperCase().indexOf(up) !== -1) { return ids[i]; } }
  return null;
}

/* Genre d'affichage d'une colonne : celui choisi a la creation s'il existe,
   sinon deduit de son type. */
function genreDe(col, champ) {
  if (champ && champ.genre) { return champ.genre; }
  if (!col) { return 'autre'; }
  var t = col.type;
  if (t === 'Text') { return col.options && col.options.widget === 'HyperLink' ? 'lien' : (col.options && col.options.wrap ? 'texte_long' : 'texte'); }
  if (t === 'Numeric' || t === 'Int') { return 'nombre'; }
  if (t === 'Bool') { return 'oui_non'; }
  if (t === 'Date') { return 'date'; }
  if (t.indexOf('DateTime') === 0) { return 'dateheure'; }
  if (t === 'Choice') { return 'choix'; }
  if (t === 'ChoiceList') { return 'etiquettes'; }
  if (t.indexOf('Ref:') === 0) { return 'reference'; }
  if (t.indexOf('RefList:') === 0) { return 'references'; }
  if (t === 'Attachments') { return 'pj'; }
  return 'autre';
}

function libelleType(col) {
  var g = genreDe(col, null);
  var noms = { texte: 'Texte', texte_long: 'Texte', nombre: 'Nombre', oui_non: 'Oui ou non', date: 'Date', dateheure: 'Date et heure',
    choix: 'Liste de choix', etiquettes: 'Choix multiples', reference: 'Référence', references: 'Liste de références',
    pj: 'Pièces jointes', autre: 'Autre' };
  var n = noms[g] || 'Autre';
  if (g === 'reference' || g === 'references') { n += ' vers ' + libelleTable(tableCibleRef(col.type)); }
  if (col.formule) { n += ' (calculée)'; }
  if (col.options && col.options.numMode === 'percent') { n += ' (pourcentage)'; }
  if (col.options && col.options.numMode === 'currency') { n += ' (montant)'; }
  return n;
}

/* Formule de declenchement qui ecraserait aussitot une valeur ecrite par le
   widget : recalcul a chaque modification de la ligne (recalcWhen 2), ou a
   chaque modification de la colonne elle-meme (recalcWhen 1 avec la colonne
   dans ses dependances). Une valeur par defaut a la creation (recalcWhen 0)
   n'empeche pas l'ecriture. */
function estEcrasee(col) {
  if (!col || !col.declencheur) { return false; }
  if (col.recalcWhen === 2) { return true; }
  if (col.recalcWhen === 1) {
    var deps = Array.isArray(col.recalcDeps) ? col.recalcDeps.slice(1) : [];
    return deps.indexOf(col.ref) !== -1;
  }
  return false;
}

function estModifiable(col, genre) {
  if (!etat.peutModifier) { return false; }
  if (!col || col.formule || col.formuleVide || estEcrasee(col)) { return false; }
  if (IDS_META.indexOf(col.colId) !== -1) { return false; }
  return GENRES_MODIFIABLES.indexOf(genre) !== -1;
}

/* Table KANBAN_CARTES du document, quel que soit son contenu. */
function tableCartesBase() {
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) { if (ids[i].toUpperCase() === ID_TABLE_CARTES) { return ids[i]; } }
  return null;
}

/* Table des cartes a utiliser pour un nouveau Kanban. KANBAN_CARTES est
   toujours preferee ; si elle existe sans sa colonne KANBAN (table creee par
   une version anterieure), elle est completee au lieu d'en creer une autre,
   ce qui produisait KANBAN_CARTES2. Retourne null s'il faut la creer. */
async function preparerTableCartes() {
  var base = tableCartesBase();
  if (base && infoColonne(base, COL_KANBAN)) { return base; }
  if (base && await adopterTableCartes(base)) { return base; }
  return tableCartesPartagee();
}

/* Complete une KANBAN_CARTES anterieure : colonnes principales manquantes,
   colonne KANBAN, et rattachement de ses cartes au Kanban qui l'utilisait
   seul. Refuse (false) si plusieurs anciens Kanbans s'en servent : leurs
   cartes ne peuvent pas etre reparties sans risque. */
async function adopterTableCartes(tid) {
  await lireTableaux();
  var anciens = etat.tableaux.filter(function (t) { return t.config && t.config.tableCartes === tid && !t.config.colKanban; });
  if (anciens.length > 1) {
    logSecurite('AVERTISSEMENT', 'Table ' + tid + ' utilisée par plusieurs anciens Kanbans : non complétée');
    return false;
  }
  var base = [['TITRE', 'Text'], ['COLONNE', 'Choice'], ['ORDRE', 'Numeric'], [COL_KANBAN, 'Text']];
  for (var i = 0; i < base.length; i++) {
    if (!infoColonne(tid, base[i][0])) { await ajouterColonne(tid, base[i][0], base[i][1], null); }
  }
  if (anciens.length === 1) {
    var t = anciens[0];
    var d = await lireTable(tid);
    var ids = d.id.filter(function (id, k) { return !colonneDe(d, COL_KANBAN, k); });
    if (ids.length) { await agir([['BulkUpdateRecord', tid, ids, (function () { var m = {}; m[COL_KANBAN] = ids.map(function () { return t.cle; }); return m; })()]]); }
    var cfg = JSON.parse(JSON.stringify(t.config));
    cfg.colKanban = COL_KANBAN;
    cfg.idKanban = t.cle;
    await agir([['UpdateRecord', etat.biblio, t.ligne, { VALEUR: JSON.stringify(cfg), VERSION_MODIF: VERSION_WIDGET }]]);
    logSecurite('INFO', 'Ancien Kanban rattaché à la table partagée ' + tid + ' (' + ids.length + ' cartes)');
  }
  await chargerMeta();
  return !!infoColonne(tid, COL_KANBAN);
}

/* Table de cartes partagee du document, si elle existe deja. */
function tableCartesPartagee() {
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) {
    if (ids[i].toUpperCase().indexOf(ID_TABLE_CARTES) === 0 && infoColonne(ids[i], COL_KANBAN)) { return ids[i]; }
  }
  return null;
}

/* Valeurs proposees pour une information : celles du Kanban (une meme
   colonne de la table partagee peut servir a plusieurs Kanbans, chacun avec
   ses propres valeurs), sinon celles de la colonne. */
function valeursProposees(colId) {
  var ch = champDe(colId);
  if (ch && Array.isArray(ch.valeurs)) { return ch.valeurs.slice(); }
  return choixDe(colonneCartes(colId));
}

/* Ajoute des valeurs a la liste de choix d'une colonne, sans en retirer :
   d'autres Kanbans peuvent utiliser les autres. */
async function unirChoix(tid, colId, valeurs) {
  var col = infoColonne(tid, colId);
  if (!col) { return; }
  var opts = JSON.parse(JSON.stringify(col.options || {}));
  var actuels = Array.isArray(opts.choices) ? opts.choices.slice() : [];
  var ajout = valeurs.filter(function (v) { return v && actuels.indexOf(v) === -1; });
  if (!ajout.length) { return; }
  opts.choices = actuels.concat(ajout);
  await agir([['UpdateRecord', '_grist_Tables_column', col.ref, { widgetOptions: JSON.stringify(opts) }]]);
  col.options = opts;
}

/* Vrai si un autre Kanban du document utilise cette colonne. */
function colonneUtiliseeAilleurs(tid, colId) {
  return etat.tableaux.some(function (t) {
    var cfg = t.config;
    if (t.cle === etat.cleConfig || cfg.tableCartes !== tid) { return false; }
    /* Toute colonne referencee par un autre Kanban compte : informations,
       titre, etape, echeance, responsable, ordre et filtres. */
    return (cfg.champs || []).some(function (ch) { return ch.col === colId; }) || cfg.colEcheance === colId || cfg.colResponsable === colId
      || cfg.colTitre === colId || cfg.colEtape === colId || cfg.colOrdreCartes === colId || cfg.colKanban === colId
      || (cfg.filtres || []).indexOf(colId) !== -1;
  });
}

/* Colonne d'une information dans la table partagee : une colonne existante
   de meme nom et de meme type est reutilisee, sinon une colonne est creee.
   "pris" liste les colonnes deja utilisees par ce Kanban. */
async function assurerColonneInfo(tid, libelle, genre, pris) {
  var g = genreParCode(genre);
  var mode = (g.options && g.options.numMode) || '';
  var base = versIdentifiant(libelle);
  var id = base;
  var k = 2;
  for (;;) {
    var ex = infoColonne(tid, id);
    var libre = pris.indexOf(id.toUpperCase()) === -1;
    if (libre && ex && ex.type === g.type && !ex.formule && ((ex.options && ex.options.numMode) || '') === mode) { pris.push(id.toUpperCase()); return id; }
    if (libre && !ex) { break; }
    id = base + '_' + k;
    k++;
  }
  var o = genre === 'texte_long' ? { wrap: true } : (g.options || null);
  var reel = await ajouterColonne(tid, id, g.type, o);
  pris.push(reel.toUpperCase());
  await chargerMeta();
  return reel;
}

function choixDe(col) {
  return col && col.options && Array.isArray(col.options.choices) ? col.options.choices.slice() : [];
}

/* === SECTION : CREATION DE TABLE (sequence canonique) === */
async function poserFormules(tid, colonnes) {
  for (var i = 0; i < colonnes.length; i++) {
    var col = colonnes[i];
    if (!col.formula) { continue; }
    try {
      await agir([['ModifyColumn', tid, col.id, { isFormula: false, formula: col.formula,
        recalcWhen: col.recalcWhen === undefined ? 0 : col.recalcWhen, recalcDeps: null }]]);
    } catch (e) {
      logSecurite('INFO', 'Formule de déclenchement non posée sur ' + col.id, e);
    }
  }
}

/* Identifiant de table libre, calcule comme le fait la plateforme
   (suffixe numerique a partir de 2), pour pouvoir creer en un seul envoi
   des tables qui se referencent. L'identifiant reel est toujours relu. */
function idTableLibre(base, reserves) {
  var pris = Object.keys(etat.meta.tables).concat(reserves || []).map(function (x) { return x.toUpperCase(); });
  var id = base;
  var n = 2;
  while (pris.indexOf(id.toUpperCase()) !== -1) { id = base + n; n++; }
  return id;
}

/* Sequence de creation : tables creees en un seul envoi avec id, type et
   label seulement ; les pages que la plateforme cree avec elles sont
   supprimees aussitot, en un seul envoi, avant toute autre preparation, si
   bien qu'elles n'apparaissent qu'un instant ; puis formules une par une et
   options de colonnes. */
async function creerTables(defs) {
  var ret = await agir(defs.map(function (d) {
    return ['AddTable', d.id, d.colonnes.map(function (c) { return { id: c.id, type: c.type, label: c.label || c.id }; })];
  }));
  var rv = ret && ret.retValues ? ret.retValues : [];
  var tids = defs.map(function (d, i) { return rv[i] && rv[i].table_id ? rv[i].table_id : d.id; });
  var vues = [];
  rv.forEach(function (r) { if (r && Array.isArray(r.views)) { r.views.forEach(function (v) { if (v && v.id) { vues.push(v.id); } }); } });
  if (!vues.length) {
    await chargerMeta();
    tids.forEach(function (t) { var m = etat.meta.tables[t]; if (m && m.primaryViewId) { vues.push(m.primaryViewId); } });
  }
  if (vues.length) {
    try {
      await agir(vues.map(function (v) { return ['RemoveRecord', '_grist_Views', v]; }));
    } catch (e) {
      logSecurite('INFO', 'Suppression des pages auto-créées non possible', e);
    }
  }
  for (var i = 0; i < defs.length; i++) {
    await poserFormules(tids[i], defs[i].colonnes);
    for (var k = 0; k < defs[i].colonnes.length; k++) {
      var c = defs[i].colonnes[k];
      if (!c.widgetOptions) { continue; }
      try {
        await agir([['ModifyColumn', tids[i], c.id, { widgetOptions: JSON.stringify(c.widgetOptions) }]]);
      } catch (e) {
        logSecurite('AVERTISSEMENT', 'Options non posées sur ' + c.id, e);
      }
    }
  }
  return tids;
}

/* Ajout d'une colonne en deux temps : creee nue, puis typee. Les deux temps
   sont proteges separement. L'identifiant reel est relu apres creation. */
async function ajouterColonne(tid, colId, type, widgetOptions) {
  var ret = await agir([['AddColumn', tid, colId, {}]]);
  var reel = colId;
  if (ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId) { reel = ret.retValues[0].colId; }
  /* isFormula: false indispensable : sans lui, la plateforme laisse la
     colonne ajoutee en formule vide, ou rien ne peut etre ecrit. */
  var propr = { type: type, label: reel, isFormula: false };
  if (widgetOptions) { propr.widgetOptions = JSON.stringify(widgetOptions); }
  try {
    await agir([['ModifyColumn', tid, reel, propr]]);
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Colonne ' + reel + ' créée mais non typée', e);
    throw e;
  }
  return reel;
}

/* === SECTION : BIBLIOTHEQUE KANBAN === */
async function reparerSchemaBiblio() {
  if (!etat.biblio) { return; }
  try {
    await chargerMeta();
    for (var k = 0; k < COLONNES_BIBLIO.length; k++) {
      var col = COLONNES_BIBLIO[k];
      var ex = infoColonne(etat.biblio, col.id);
      if (!ex) {
        var creee = false;
        try { await agir([['AddColumn', etat.biblio, col.id, {}]]); creee = true; } catch (e) { logSecurite('INFO', 'Colonne ' + col.id + ' non ajoutée', e); }
        if (creee) {
          var propr = { type: col.type, label: col.label, isFormula: false };
          if (col.formula) { propr.formula = col.formula; propr.recalcWhen = col.recalcWhen; propr.recalcDeps = null; }
          try { await agir([['ModifyColumn', etat.biblio, col.id, propr]]); } catch (e2) { logSecurite('INFO', 'Colonne ' + col.id + ' non typée', e2); }
        }
      } else if (col.formula && String(ex.formula).trim() !== col.formula) {
        try {
          await agir([['ModifyColumn', etat.biblio, col.id, { isFormula: false, formula: col.formula, recalcWhen: col.recalcWhen, recalcDeps: null }]]);
        } catch (e3) { logSecurite('INFO', 'Formule non rétablie sur ' + col.id, e3); }
      }
    }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Vérification du schéma de la bibliothèque impossible', e);
  }
}

async function assurerBibliotheque() {
  await chargerMeta();
  var trouvee = trouverTable(ID_BIBLIO);
  if (trouvee) {
    etat.biblio = trouvee;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  await chargerMeta();
  var entreTemps = trouverTable(ID_BIBLIO);
  if (entreTemps) {
    etat.biblio = entreTemps;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  return finaliserBibliotheque((await creerTables([{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }]))[0]);
}

/* Apres sa creation, la bibliotheque recoit son nom affiche ; son
   identifiant est relu, le renommage pouvant le changer. */
async function finaliserBibliotheque(tid) {
  etat.biblio = tid;
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    if (t && t.rawViewSectionRef) {
      await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { title: LABEL_BIBLIO }]]);
    }
    await chargerMeta();
    var relu = trouverTable(ID_BIBLIO);
    if (relu) { etat.biblio = relu; }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Renommage de la bibliothèque non abouti', e);
  }
  await reparerSchemaBiblio();
  return etat.biblio;
}

/* Plusieurs tableaux par document : une ligne de configuration par tableau,
   de cle CONFIG:<identifiant>. La ligne CONFIG des versions anterieures est
   lue comme un tableau, sans conversion. La liste est lue dans une variable
   locale puis affectee d'un seul coup : un rafraichissement parallele ne la
   trouve jamais videe en cours de lecture. */
async function lireTableaux() {
  if (!etat.biblio) { etat.tableaux = []; return []; }
  var d = await lireTable(etat.biblio);
  var l = [];
  var temE = false, temP = false;
  for (var i = 0; i < d.id.length; i++) {
    var cle = colonneDe(d, 'CLE', i);
    if (cle === CLE_ACCES_EDITION) { temE = true; continue; }
    if (cle === CLE_ACCES_PARAMETRAGE) { temP = true; continue; }
    if (cle !== CLE_CONFIG && !(typeof cle === 'string' && cle.indexOf(CLE_CONFIG + ':') === 0)) { continue; }
    try {
      var cfg = JSON.parse(colonneDe(d, 'VALEUR', i) || '{}');
      if (cfg && cfg.tableCartes) { l.push({ cle: cle, ligne: d.id[i], config: cfg }); }
    } catch (e) {
      logSecurite('AVERTISSEMENT', 'Configuration illisible : ' + cle, e);
    }
  }
  l.sort(function (a, b) { return a.ligne - b.ligne; });
  etat.tableaux = l;
  etat.temoinEdition = temE;
  etat.temoinParam = temP;
  return l;
}

/* Un meme widget heberge tous les Kanbans du document ; l'agent passe de
   l'un a l'autre par la liste "Tableau affiche". Tableau montre a
   l'ouverture, dans l'ordre : celui choisi pendant la session, celui dont la
   table des cartes est liee a la vue (cas d'un tableau branche sur des
   donnees), le dernier consulte dans ce navigateur, sinon le premier cree. */
function choisirTableau() {
  var l = etat.tableaux;
  var t = null;
  var chercher = function (f) { for (var i = 0; i < l.length; i++) { if (f(l[i])) { return l[i]; } } return null; };
  if (etat.tableauSession) { t = chercher(function (x) { return x.cle === etat.tableauSession; }); }
  if (!t && etat.tableLiee) { t = chercher(function (x) { return x.config.tableCartes === etat.tableLiee; }); }
  if (!t && etat.tableauMemorise) { t = chercher(function (x) { return x.cle === etat.tableauMemorise; }); }
  if (!t && l.length) { t = l[0]; }
  etat.config = t ? t.config : null;
  etat.biblioLigne = t ? t.ligne : null;
  etat.cleConfig = t ? t.cle : null;
  return t;
}

/* Dernier tableau consulte : retenu par le navigateur, pour ce document.
   Simple commodite : si le stockage est indisponible, le premier tableau
   s'affiche. */
function cleStockage() { return 'gristkanban:' + (etat.nomDoc || 'document'); }

function lireTableauMemorise() {
  try { etat.tableauMemorise = window.localStorage.getItem(cleStockage()); } catch (e) { etat.tableauMemorise = null; }
}

function memoriserTableau(cle) {
  etat.tableauSession = cle;
  etat.tableauMemorise = cle;
  try { window.localStorage.setItem(cleStockage(), cle); } catch (e) { logSecurite('INFO', 'Dernier Kanban non mémorisé par le navigateur', e); }
}

function libererCouvertures() {
  var co = etat.couvertures || {};
  Object.keys(co).forEach(function (k) {
    Promise.resolve(co[k]).then(function (url) { try { URL.revokeObjectURL(url); } catch (e) { logSecurite('INFO', 'Image non libérée', e); } }).catch(function () {});
  });
  etat.couvertures = {};
}

function changerDeTableau(cle) {
  if (cle === etat.cleConfig && etat.vue === 'tableau') { return Promise.resolve(); }
  libererCouvertures();
  memoriserTableau(cle);
  etat.valeursFiltres = {}; etat.retardSeul = false; etat.recherche = ''; etat.regroupement = null;
  return chargerTout().then(function () {
    var n = 0;
    etat.tableaux.forEach(function (t, i) { if (t.cle === etat.cleConfig) { n = i; } });
    annoncer('Kanban ' + (etat.config ? etat.config.nom : '') + ' affiché, ' + (n + 1) + ' sur ' + etat.tableaux.length + '.');
    var f = document.getElementById('kOnglet' + n);
    if (f) { f.focus(); }
  });
}

/* Vrai si l'agent est en train de creer un Kanban : ecran "Par ou
   commencer ?", etapes de creation ou branchement sur ses donnees. */
function enCreation() {
  return (etat.vue === 'assistant' && etat.brouillon && etat.brouillon.mode === 'creation') || etat.vue === 'branchement';
}

function creationCommencee() {
  return (etat.vue === 'assistant' && etat.brouillon && etat.brouillon.mode === 'creation' && etat.brouillon.etape > 0) || etat.vue === 'branchement';
}

/* Un onglet par Kanban du document, puis l'onglet "Nouveau Kanban", toujours
   dernier. Ce dernier affiche dans son panneau l'ecran "Par ou commencer ?"
   et les etapes de creation. Au clavier, fleches gauche et droite, Debut et
   Fin parcourent tous les onglets ; le focus reste sur l'onglet. */
function ongletsKanbans() {
  var ul = creer('ul', { classe: 'fr-tabs__list', attrs: { role: 'tablist', 'aria-label': 'Kanbans du document' } });
  var onglets = [];
  var creation = enCreation();
  var activer = [];
  etat.tableaux.forEach(function (t, i) {
    var actif = !creation && t.cle === etat.cleConfig;
    var b = creer('button', { classe: 'fr-tabs__tab w-onglet', id: 'kOnglet' + i, texte: t.config.nom || 'Kanban sans nom',
      attrs: { role: 'tab', 'aria-selected': actif ? 'true' : 'false', 'aria-controls': 'kPanneau', tabindex: actif ? '0' : '-1' } });
    activer.push(function () { return allerAuKanban(t.cle); });
    onglets.push(b);
  });
  var nouveau = creer('button', { classe: 'fr-tabs__tab fr-tabs__tab--icon-left fr-icon-add-line w-onglet', id: 'kOngletNouveau', texte: 'Nouveau Kanban',
    attrs: { role: 'tab', 'aria-selected': creation ? 'true' : 'false', 'aria-controls': 'kPanneau', tabindex: creation ? '0' : '-1' } });
  activer.push(async function () {
    if (enCreation()) { return; }
    if (enParametrage() && !(await sortirParametrages(false))) { return; }
    demarrerCreation();
    var f = document.getElementById('kOngletNouveau');
    if (f) { f.focus(); }
    annoncer('Nouveau Kanban : choisissez par où commencer.');
  });
  if (etat.peutParametrer) { onglets.push(nouveau); } else { activer.pop(); }
  onglets.forEach(function (b, i) {
    b.addEventListener('click', function () { relayer(activer[i](), 'Changement d\'onglet'); });
    b.addEventListener('keydown', function (e) {
      var k = null;
      var n = onglets.length;
      if (e.key === 'ArrowRight') { k = (i + 1) % n; }
      if (e.key === 'ArrowLeft') { k = (i + n - 1) % n; }
      if (e.key === 'Home') { k = 0; }
      if (e.key === 'End') { k = n - 1; }
      if (k !== null) { e.preventDefault(); onglets[k].focus(); relayer(activer[k](), 'Changement d\'onglet'); }
    });
    ul.appendChild(creer('li', { attrs: { role: 'presentation' } }, [b]));
  });
  var nav = creer('nav', { classe: 'tab-nav w-onglets', attrs: { 'aria-label': 'Navigation entre les Kanbans' } }, [ul]);
  setTimeout(function () {
    var a = document.querySelector('.w-onglet[aria-selected="true"]');
    if (a && a.scrollIntoView) { a.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  }, 0);
  return nav;
}

/* Place la rangee d'onglets au-dessus du contenu de la vue, et range ce
   contenu dans le panneau relie a l'onglet actif. */
function envelopperOnglets(zone) {
  var creation = enCreation();
  var actif = 'kOngletNouveau';
  if (!creation) { etat.tableaux.forEach(function (t, i) { if (t.cle === etat.cleConfig) { actif = 'kOnglet' + i; } }); }
  var panneauK = creer('div', { id: 'kPanneau', attrs: { role: 'tabpanel', 'aria-labelledby': actif } });
  while (zone.firstChild) { panneauK.appendChild(zone.firstChild); }
  zone.appendChild(ongletsKanbans());
  zone.appendChild(panneauK);
}

/* Passage a un Kanban existant. Une creation commencee est abandonnee
   apres confirmation seulement. */
async function allerAuKanban(cle) {
  if (enParametrage()) {
    var sorti = await sortirParametrages(cle === etat.cleConfig);
    if (!sorti || cle === etat.cleConfig) { return; }
  }
  if (creationCommencee()) {
    var ok = await confirmerAction('Abandonner la création ?', 'Rien n\'a été créé. Les choix faits pour le nouveau Kanban ne sont pas conservés.', 'Abandonner');
    if (!ok) {
      var f = document.getElementById('kOngletNouveau');
      if (f) { f.focus(); }
      return;
    }
  }
  if (enCreation()) { etat.brouillon = null; etat.assistant = null; etat.cleConfig = null; }
  return changerDeTableau(cle);
}

function nouvelleCleConfig() {
  return CLE_CONFIG + ':' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}

/* Prepare l'ecriture d'un nouveau tableau : la prochaine ecriture de
   configuration ajoutera une ligne au lieu de remplacer celle d'un autre. */
function preparerNouveauTableau() {
  etat.biblioLigne = null;
  etat.cleConfig = nouvelleCleConfig();
  return etat.cleConfig;
}

async function ecrireConfig(cfg) {
  cfg.version = VERSION_CONFIG;
  var valeur = JSON.stringify(cfg);
  if (etat.biblioLigne) {
    await agir([['UpdateRecord', etat.biblio, etat.biblioLigne, { VALEUR: valeur, VERSION_MODIF: VERSION_WIDGET }]]);
  } else {
    if (!etat.cleConfig) { etat.cleConfig = nouvelleCleConfig(); }
    var ret = await agir([['AddRecord', etat.biblio, null, { CLE: etat.cleConfig, VALEUR: valeur, VERSION_CREATION: VERSION_WIDGET, VERSION_MODIF: VERSION_WIDGET }]]);
    etat.biblioLigne = ret && ret.retValues ? ret.retValues[0] : null;
  }
  etat.config = cfg;
}

/* Controle de la configuration au chargement : les colonnes disparues sont
   retirees de l'affichage, jamais recreees. */
function verifierConfig() {
  var c = etat.config;
  if (!c || !c.tableCartes || !etat.meta.tables[c.tableCartes]) { return false; }
  if (!infoColonne(c.tableCartes, c.colTitre) || !infoColonne(c.tableCartes, c.colEtape)) { return false; }
  if (c.colKanban && !infoColonne(c.tableCartes, c.colKanban)) { return false; }
  c.champs = (c.champs || []).filter(function (ch) {
    var ok = !!infoColonne(c.tableCartes, ch.col);
    if (!ok) { logSecurite('AVERTISSEMENT', 'Colonne disparue, retirée de l\'affichage : ' + ch.col); }
    return ok;
  });
  if (c.colEcheance && !infoColonne(c.tableCartes, c.colEcheance)) { c.colEcheance = null; }
  /* Filtres : une configuration d'un ancien format n'en a pas ; le filtre
     par responsable qu'elle proposait est repris. */
  if (!Array.isArray(c.filtres)) { c.filtres = c.colResponsable ? [c.colResponsable] : []; }
  c.filtres = c.filtres.filter(function (col) { return !!infoColonne(c.tableCartes, col); });
  if (c.recherche === undefined) { c.recherche = true; }
  if (c.colResponsable && !infoColonne(c.tableCartes, c.colResponsable)) { c.colResponsable = null; }
  if (c.couverture && !champDe(c.couverture)) { c.couverture = null; }
  if (c.couleur && !champDe(c.couleur)) { c.couleur = null; }
  if (c.colKanban) { c.historique = true; }
  if (c.colOrdreCartes && !infoColonne(c.tableCartes, c.colOrdreCartes)) { c.colOrdreCartes = null; }
  c.limites = c.limites || {};
  if (c.sourceEtapes && c.sourceEtapes.type === 'liste') {
    if (!Array.isArray(c.sourceEtapes.valeurs)) { c.sourceEtapes.valeurs = []; }
    return true;
  }
  var colE = infoColonne(c.tableCartes, c.colEtape);
  var cible = tableCibleRef(colE.type);
  if (cible && colE.type.indexOf('Ref:') === 0) {
    c.sourceEtapes = { type: 'ref', table: cible, colAffichage: colAffichageRef(colE) || (c.sourceEtapes && c.sourceEtapes.colAffichage) || null,
      colOrdre: (c.sourceEtapes && c.sourceEtapes.colOrdre && infoColonne(cible, c.sourceEtapes.colOrdre)) ? c.sourceEtapes.colOrdre : null };
  } else if (colE.type === 'Choice') {
    c.sourceEtapes = { type: 'choice' };
  } else {
    c.sourceEtapes = { type: 'text' };
  }
  return true;
}

/* === SECTION : DONNEES DU TABLEAU === */
function colonneCartes(colId) { return infoColonne(etat.config.tableCartes, colId); }

async function chargerRef(tidCible, colAff) {
  var cle = tidCible + '|' + (colAff || '');
  if (etat.refs[cle]) { return etat.refs[cle]; }
  var d = await lireTable(tidCible);
  var m = { ids: [], libelles: {} };
  for (var i = 0; i < d.id.length; i++) {
    var v = colAff ? colonneDe(d, colAff, i) : d.id[i];
    m.ids.push(d.id[i]);
    m.libelles[d.id[i]] = (v === null || v === undefined || v === '') ? ('Ligne ' + d.id[i]) : String(v);
  }
  etat.refs[cle] = m;
  return m;
}

function refDeColonne(col) {
  var cible = tableCibleRef(col.type);
  return etat.refs[cible + '|' + (colAffichageRef(col) || '')] || null;
}

/* Les filtres et la selection de la vue ne s'appliquent que si la vue est
   liee a la table des cartes. */
function majIdsVisibles() {
  var c = etat.config;
  etat.idsVisibles = (c && etat.tableLiee && etat.tableLiee === c.tableCartes && etat.derniersIds) ? etat.derniersIds : null;
}

async function chargerDonnees() {
  var c = etat.config;
  if (!c) { return; }
  majIdsVisibles();
  etat.refs = {};
  var d = await lireTable(c.tableCartes);
  var src = c.sourceEtapes;
  var etapes = [];
  if (src.type === 'ref') {
    var e = await lireTable(src.table);
    for (var i = 0; i < e.id.length; i++) {
      var lib = src.colAffichage ? colonneDe(e, src.colAffichage, i) : ('Ligne ' + e.id[i]);
      etapes.push({ cle: String(e.id[i]), libelle: (lib === null || lib === undefined || lib === '') ? 'Sans nom' : String(lib),
        ordre: src.colOrdre ? colonneDe(e, src.colOrdre, i) : colonneDe(e, 'manualSort', i), id: e.id[i] });
    }
    etapes.sort(function (a, b) {
      var oa = typeof a.ordre === 'number' ? a.ordre : 1e15;
      var ob = typeof b.ordre === 'number' ? b.ordre : 1e15;
      return oa - ob || a.id - b.id;
    });
  } else if (src.type === 'choice') {
    choixDe(colonneCartes(c.colEtape)).forEach(function (v) { etapes.push({ cle: String(v), libelle: String(v) }); });
  } else if (src.type === 'liste') {
    src.valeurs.forEach(function (v) { etapes.push({ cle: String(v), libelle: String(v) }); });
  }
  /* Colonnes de reference affichees sur les cartes ou servant de filtre. */
  var aCharger = c.champs.map(function (ch) { return colonneCartes(ch.col); });
  if (c.colResponsable) { aCharger.push(colonneCartes(c.colResponsable)); }
  c.filtres.forEach(function (f) { aCharger.push(colonneCartes(f)); });
  /* Lectures en parallele, une seule par couple table visee et colonne
     d'affichage : elles etaient faites une par une, colonne apres colonne. */
  var vues = {};
  var lectures = [];
  aCharger.forEach(function (col) {
    if (!col || !tableCibleRef(col.type)) { return; }
    var cleRef = tableCibleRef(col.type) + '|' + (colAffichageRef(col) || '');
    if (vues[cleRef]) { return; }
    vues[cleRef] = true;
    lectures.push(chargerRef(tableCibleRef(col.type), colAffichageRef(col)).catch(function (e2) { logSecurite('AVERTISSEMENT', 'Référence illisible : ' + col.colId, e2); }));
  });
  await Promise.all(lectures);
  var cles = {};
  etapes.forEach(function (x) { cles[x.cle] = true; });
  var cartes = [];
  var textes = {};
  for (var k = 0; k < d.id.length; k++) {
    if (c.colKanban && colonneDe(d, c.colKanban, k) !== c.idKanban) { continue; }
    var brut = colonneDe(d, c.colEtape, k);
    var cle;
    if (src.type === 'ref') { cle = brut ? String(brut) : CLE_NON_CLASSE; }
    else { cle = (brut === null || brut === undefined || brut === '') ? CLE_NON_CLASSE : String(brut); }
    if (src.type === 'text' && cle !== CLE_NON_CLASSE) { textes[cle] = true; }
    if (src.type !== 'text' && !cles[cle]) { cle = CLE_NON_CLASSE; }
    var valeurs = {};
    c.champs.forEach(function (ch) { valeurs[ch.col] = colonneDe(d, ch.col, k); });
    if (c.colEcheance) { valeurs[c.colEcheance] = colonneDe(d, c.colEcheance, k); }
    if (c.colResponsable) { valeurs[c.colResponsable] = colonneDe(d, c.colResponsable, k); }
    c.filtres.forEach(function (f) { valeurs[f] = colonneDe(d, f, k); });
    IDS_META.forEach(function (m) { if (d[m]) { valeurs[m] = colonneDe(d, m, k); } });
    if (c.historique && d[COL_HISTORIQUE]) { valeurs[COL_HISTORIQUE] = colonneDe(d, COL_HISTORIQUE, k); }
    cartes.push({ id: d.id[k], titre: colonneDe(d, c.colTitre, k), cle: cle, brut: brut,
      ordre: c.colOrdreCartes ? colonneDe(d, c.colOrdreCartes, k) : null, valeurs: valeurs });
  }
  if (src.type === 'text') {
    Object.keys(textes).sort(function (a, b) { return a.localeCompare(b, 'fr'); }).forEach(function (t) { etapes.push({ cle: t, libelle: t }); });
  }
  etat.etapes = etapes;
  etat.cartes = cartes;
  if (c.champs.some(function (ch) { return genreDe(colonneCartes(ch.col), ch) === 'pj'; })) { await chargerMetaPJ(); }
}

function comparerCartes(a, b) {
  var c = etat.config;
  if (c.colOrdreCartes) {
    var oa = typeof a.ordre === 'number' ? a.ordre : 1e15;
    var ob = typeof b.ordre === 'number' ? b.ordre : 1e15;
    return oa - ob || a.id - b.id;
  }
  if (c.tri && c.tri.col) {
    var va = c.tri.col === c.colTitre ? a.titre : a.valeurs[c.tri.col];
    var vb = c.tri.col === c.colTitre ? b.titre : b.valeurs[c.tri.col];
    var vide = function (v) { return v === null || v === undefined || v === '' || v === 0; };
    if (vide(va) && !vide(vb)) { return 1; }
    if (!vide(va) && vide(vb)) { return -1; }
    var r = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va || '').localeCompare(String(vb || ''), 'fr');
    return (c.tri.sens === 'desc' ? -r : r) || a.id - b.id;
  }
  return a.id - b.id;
}

/* === Historique et commentaires ===
   Chaque carte porte son propre fil d'activite, calcule par une formule de
   declenchement de la table (KANBAN_HISTORIQUE), recalculee a chaque
   modification de la ligne, quelle qu'en soit l'origine (Kanban, table,
   formulaire, API). La formule compare l'etat precedent de la carte, garde
   dans la cellule elle-meme (variable value), a son etat actuel, et ajoute
   les differences avec l'auteur (user) et l'heure (NOW). Un commentaire est
   depose par le widget dans KANBAN_COMMENTAIRE ; la formule l'ajoute au fil.
   Le contenu est du JSON : {"etat": {...}, "journal": [...], "com": "..."}. */
function exprSuivi(tid, colId) {
  var col = infoColonne(tid, colId);
  if (!col || col.formule || IDS_META.indexOf(colId) !== -1 || IDS_TECHNIQUES.indexOf(colId) !== -1) { return null; }
  var t = String(col.type || '');
  var vis = colAffichageRef(col);
  if (t.indexOf('Ref:') === 0) { return '($' + colId + '.' + (vis || 'id') + ' if $' + colId + ' else "")'; }
  if (t.indexOf('RefList:') === 0) { return '[r.' + (vis || 'id') + ' for r in ($' + colId + ' or [])]'; }
  if (t === 'Attachments') { return '[a.fileName for a in ($' + colId + ' or [])]'; }
  return '$' + colId;
}

/* Colonnes suivies : celles de tous les Kanbans qui utilisent la table. */
function colonnesSuivies(tid) {
  var cfgs = etat.tableaux.map(function (t) { return t.config; }).filter(function (cfg) { return cfg && cfg.tableCartes === tid; });
  if (etat.config && etat.config.tableCartes === tid && cfgs.indexOf(etat.config) === -1) { cfgs.push(etat.config); }
  var res = [];
  var ajouter = function (id) { if (id && res.indexOf(id) === -1 && exprSuivi(tid, id)) { res.push(id); } };
  cfgs.forEach(function (cfg) {
    ajouter(cfg.colTitre);
    ajouter(cfg.colEtape);
    (cfg.champs || []).forEach(function (ch) { ajouter(ch.col); });
    ajouter(cfg.colEcheance);
    ajouter(cfg.colResponsable);
  });
  return res;
}

function formuleHistorique(tid) {
  var lignes = colonnesSuivies(tid).map(function (id) { return '  "' + id + '": TXT(' + exprSuivi(tid, id) + '),'; });
  return [
    'import json',
    'def TXT(v):',
    '  if v is None:',
    '    return ""',
    '  if isinstance(v, bool):',
    '    return "oui" if v else "non"',
    '  if isinstance(v, (list, tuple)):',
    '    return ", ".join(TXT(x) for x in v if x not in (None, ""))',
    '  if hasattr(v, "hour"):',
    '    return v.strftime("%d/%m/%Y %H:%M")',
    '  if hasattr(v, "strftime"):',
    '    return v.strftime("%d/%m/%Y")',
    '  if isinstance(v, float):',
    '    return (str(int(v)) if v == int(v) else str(v)).replace(".", ",")',
    '  return str(v)',
    'etat = {'].concat(lignes).concat([
    '}',
    'try:',
    '  h = json.loads(value) if value else {}',
    'except Exception:',
    '  h = {}',
    'if not isinstance(h, dict):',
    '  h = {}',
    'avant = h.get("etat")',
    'journal = h.get("journal") or []',
    'qui = (user.Name or user.Email or "") if user else ""',
    'quand = NOW().isoformat()',
    'if avant is None:',
    '  journal.append({"type": "debut", "qui": qui, "le": quand})',
    'else:',
    '  for k, v in etat.items():',
    '    if k in avant and avant[k] != v:',
    '      journal.append({"type": "modification", "champ": k, "de": avant[k], "a": v, "qui": qui, "le": quand})',
    'com = $' + COL_COMMENTAIRE + ' or ""',
    'if com and com != h.get("com"):',
    '  try:',
    '    texte = json.loads(com).get("texte", "")',
    '  except Exception:',
    '    texte = com',
    '  if texte:',
    '    journal.append({"type": "commentaire", "texte": texte, "qui": qui, "le": quand})',
    'return json.dumps({"etat": etat, "journal": journal[-' + MAX_EVENEMENTS + ':], "com": com}, ensure_ascii=False)']).join('\n');
}

/* Cree les colonnes du fil si besoin et met la formule a jour quand les
   informations suivies ont change. Sans droit de modification, rien n'est
   ecrit et le fil existant reste lisible. */
async function assurerHistorique(c) {
  var tid = c.tableCartes;
  try {
    var manque = [COL_COMMENTAIRE, COL_HISTORIQUE].filter(function (id) { return !infoColonne(tid, id); });
    for (var i = 0; i < manque.length; i++) { await ajouterColonne(tid, manque[i], 'Text', manque[i] === COL_HISTORIQUE ? { wrap: true } : null); }
    if (manque.length) { await chargerMeta(); }
    var col = infoColonne(tid, COL_HISTORIQUE);
    var f = formuleHistorique(tid);
    if (col && (col.formula !== f || col.recalcWhen !== 2 || col.formule)) {
      await agir([['ModifyColumn', tid, COL_HISTORIQUE, { isFormula: false, formula: f, recalcWhen: 2, recalcDeps: null }]]);
      await chargerMeta();
    }
  } catch (e) {
    logSecurite('INFO', 'Historique des cartes non mis à jour (droits insuffisants ou table indisponible)', e);
  }
}

/* Reparation : une colonne d'un Kanban restee en formule vide (ajoutee par
   une version precedente sans isFormula: false) devient une colonne de
   donnees. Sans risque : une formule vide ne contient rien. */
async function reparerColonnesVides(c) {
  var tid = c.tableCartes;
  var ids = [];
  var cfgs = etat.tableaux.map(function (t) { return t.config; }).filter(function (cfg) { return cfg && cfg.tableCartes === tid; });
  if (cfgs.indexOf(c) === -1) { cfgs.push(c); }
  cfgs.forEach(function (cfg) {
    /* Table creee par le widget : toutes ses colonnes. Table de l'agent :
       seulement la colonne technique des commentaires. */
    if (cfg.colKanban) { (cfg.champs || []).forEach(function (ch) { if (ids.indexOf(ch.col) === -1) { ids.push(ch.col); } }); }
  });
  if (c.historique) { ids.push(COL_COMMENTAIRE); }
  var actions = [];
  ids.forEach(function (id) {
    var col = infoColonne(tid, id);
    if (col && col.formuleVide) { actions.push(['ModifyColumn', tid, id, { isFormula: false }]); }
  });
  if (!actions.length) { return; }
  try {
    await agir(actions);
    await chargerMeta();
    logSecurite('INFO', actions.length + ' colonne(s) en formule vide convertie(s) en colonnes de données');
  } catch (e) {
    logSecurite('INFO', 'Colonnes en formule vide non réparées (droits insuffisants)', e);
  }
}

function journalCarte(carte) {
  var v = carte && carte.valeurs ? carte.valeurs[COL_HISTORIQUE] : null;
  if (!v || typeof v !== 'string') { return []; }
  try { var h = JSON.parse(v); return Array.isArray(h.journal) ? h.journal : []; } catch (e) { return []; }
}

function nbCommentaires(carte) {
  return journalCarte(carte).filter(function (e) { return e.type === 'commentaire'; }).length;
}

function cartesDeEtape(cle) {
  return etat.cartes.filter(function (x) { return x.cle === cle; }).sort(comparerCartes);
}

/* === Regroupement a la volee ===
   Les memes cartes en colonnes selon une autre information (responsable,
   priorite...). Rien n'est modifie dans le parametrage ; faire glisser une
   carte change la valeur de cette information. */
function colonnesRegroupables() {
  var c = etat.config;
  var ids = c.champs.map(function (ch) { return ch.col; });
  if (c.colResponsable && ids.indexOf(c.colResponsable) === -1) { ids.push(c.colResponsable); }
  return ids.filter(function (id) { var col = colonneCartes(id); return col && !col.formule && GENRES_REGROUPABLES.indexOf(genreDe(col, champDe(id))) !== -1; });
}

function cleGroupe(carte) {
  var col = etat.regroupement;
  var g = genreDe(colonneCartes(col), champDe(col));
  var v = carte.valeurs[col];
  if (g === 'oui_non') { return v ? 'Oui' : 'Non'; }
  if (g === 'reference') { return v ? String(v) : VALEUR_VIDE; }
  return (v === null || v === undefined || v === '') ? VALEUR_VIDE : String(v);
}

function groupesAffiches() {
  var col = etat.regroupement;
  var info = colonneCartes(col);
  var g = genreDe(info, champDe(col));
  var res = [];
  var vus = {};
  var ajouter = function (cle, libelle) { if (!vus[cle]) { vus[cle] = true; res.push({ cle: cle, libelle: libelle }); } };
  if (g === 'oui_non') { ajouter('Oui', 'Oui'); ajouter('Non', 'Non'); return res; }
  if (g === 'reference') {
    var r = refDeColonne(info);
    if (r) { r.ids.forEach(function (id) { ajouter(String(id), r.libelles[id]); }); }
    etat.cartes.forEach(function (x) { var k = cleGroupe(x); if (k !== VALEUR_VIDE) { ajouter(k, texteValeur(col, x.valeurs[col])); } });
  } else {
    valeursProposees(col).forEach(function (v) { ajouter(String(v), String(v)); });
    etat.cartes.forEach(function (x) { var k = cleGroupe(x); if (k !== VALEUR_VIDE) { ajouter(k, k); } });
  }
  ajouter(VALEUR_VIDE, 'Non renseigné');
  return res;
}

function valeurPourGroupe(cle) {
  var col = etat.regroupement;
  var g = genreDe(colonneCartes(col), champDe(col));
  if (g === 'oui_non') { return cle === 'Oui'; }
  if (g === 'reference') { return cle === VALEUR_VIDE ? 0 : parseInt(cle, 10); }
  return cle === VALEUR_VIDE ? null : cle;
}

function cartesColonne(cle) {
  var l = etat.regroupement ? etat.cartes.filter(function (x) { return cleGroupe(x) === cle; }).sort(comparerCartes) : cartesDeEtape(cle);
  return triVue() ? l.slice().sort(comparerVue) : l;
}

/* === Tri de consultation ===
   Ordre d'affichage choisi par l'agent dans le panneau, pour lui seul et
   pour ce Kanban (retenu par le navigateur). Il ne change jamais l'ordre
   enregistre : deplacements, position dans la fiche et retour a l'ordre
   manuel s'appuient sur celui-ci. */
function colonnesTriables() {
  var c = etat.config;
  var res = [{ valeur: c.colTitre, libelle: 'Titre' }];
  var vus = {};
  vus[c.colTitre] = true;
  var ajouter = function (col, libelle) {
    if (!col || vus[col] || !colonneCartes(col)) { return; }
    vus[col] = true;
    res.push({ valeur: col, libelle: libelle || libelleChampCol(col) });
  };
  c.champs.forEach(function (ch) {
    var g = genreDe(colonneCartes(ch.col), ch);
    if (['date', 'dateheure', 'nombre', 'choix', 'personne', 'texte', 'reference', 'oui_non'].indexOf(g) !== -1) { ajouter(ch.col); }
  });
  ajouter(c.colEcheance);
  ajouter(c.colResponsable);
  ajouter('CREE_LE', 'Date de création');
  ajouter('MODIFIE_LE', 'Dernière modification');
  return res;
}

function cleTriVue() { return 'kanbans.tri.' + (etat.cleConfig || ''); }

function triVue() {
  var t = null;
  try { var v = window.localStorage.getItem(cleTriVue()); if (v !== null) { t = v ? JSON.parse(v) : null; } else { t = etat.trisVue[etat.cleConfig] || null; } }
  catch (e) { t = etat.trisVue[etat.cleConfig] || null; }
  if (!t || !t.col || !colonnesTriables().some(function (o) { return o.valeur === t.col; })) { return null; }
  return t;
}

function definirTriVue(t) {
  etat.trisVue[etat.cleConfig] = t;
  try { window.localStorage.setItem(cleTriVue(), t ? JSON.stringify(t) : ''); } catch (e) { logSecurite('INFO', 'Tri non mémorisé par le navigateur', e); }
}

function comparerVue(a, b) {
  var c = etat.config;
  var t = triVue();
  var col = t.col;
  var g = col === c.colTitre ? 'texte' : genreDe(colonneCartes(col), champDe(col));
  var val = function (x) { return col === c.colTitre ? x.titre : x.valeurs[col]; };
  var va = val(a);
  var vb = val(b);
  var vide = function (v) { return v === null || v === undefined || v === '' || (g === 'reference' && v === 0) || typeof v === 'object' && !Array.isArray(v); };
  if (vide(va) && !vide(vb)) { return 1; }
  if (!vide(va) && vide(vb)) { return -1; }
  var r = 0;
  if (!vide(va)) {
    if (g === 'choix' || g === 'personne') {
      var ordre = valeursProposees(col);
      var ia = ordre.indexOf(va);
      var ib = ordre.indexOf(vb);
      r = (ia === -1 ? 1e6 : ia) - (ib === -1 ? 1e6 : ib) || String(va).localeCompare(String(vb), 'fr');
    } else if (g === 'reference') {
      r = String(texteValeur(col, va)).localeCompare(String(texteValeur(col, vb)), 'fr');
    } else if (g === 'oui_non') {
      r = (va ? 0 : 1) - (vb ? 0 : 1);
    } else if (typeof va === 'number' && typeof vb === 'number') {
      r = va - vb;
    } else {
      r = String(va).localeCompare(String(vb), 'fr', { sensitivity: 'base' });
    }
    if (t.sens === 'desc') { r = -r; }
  }
  return r || comparerCartes(a, b);
}

function libelleColonne(cle) {
  if (!etat.regroupement) { return libelleEtape(cle); }
  var gr = groupesAffiches();
  for (var i = 0; i < gr.length; i++) { if (gr[i].cle === cle) { return gr[i].libelle; } }
  return cle;
}

/* Ecrit la nouvelle valeur de l'information de regroupement. */
async function ecrireGroupe(id, cle, parGlisser) {
  var c = etat.config;
  var carte = carteParId(id);
  if (!carte) { redessinerColonnes(); return; }
  var maj = {};
  maj[etat.regroupement] = valeurPourGroupe(cle);
  try {
    await agir([['UpdateRecord', c.tableCartes, id, maj]]);
    carte.valeurs[etat.regroupement] = maj[etat.regroupement];
    annoncer('La carte ' + (carte.titre || 'sans titre') + ' a maintenant ' + libelleChampCol(etat.regroupement) + ' : ' + libelleColonne(cle) + '.');
    redessinerColonnes();
    if (!parGlisser) {
      var b = document.querySelector('.w-carte[data-id="' + id + '"] .w-carte__deplacer');
      if (b) { b.focus(); }
    }
  } catch (e) {
    afficherErreur('La modification de la carte n\'a pas abouti.', e);
    redessinerColonnes();
  }
  if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
}

function libelleEtape(cle) {
  if (cle === CLE_NON_CLASSE) { return 'Non classé'; }
  for (var i = 0; i < etat.etapes.length; i++) { if (etat.etapes[i].cle === cle) { return etat.etapes[i].libelle; } }
  return cle;
}

function valeurEtapePourCle(cle) {
  return etat.config.sourceEtapes.type === 'ref' ? (parseInt(cle, 10) || 0) : cle;
}

function libelleChamp(ch) {
  if (ch.libelle) { return ch.libelle; }
  var col = colonneCartes(ch.col);
  return col ? col.label : ch.col;
}

function estDansFiche(ch) { return ch.dansFiche !== false; }

/* Ordre de la fiche : celui de config.ordreFiche, puis les informations qui
   n'y figurent pas encore, dans l'ordre des cartes. */
function champsOrdreFiche() {
  var c = etat.config;
  var res = [];
  (c.ordreFiche || []).forEach(function (id) { var ch = champDe(id); if (ch && res.indexOf(ch) === -1) { res.push(ch); } });
  c.champs.forEach(function (ch) { if (res.indexOf(ch) === -1) { res.push(ch); } });
  return res;
}

function champDe(colId) {
  var l = etat.config.champs;
  for (var i = 0; i < l.length; i++) { if (l[i].col === colId) { return l[i]; } }
  return null;
}

/* Valeur lisible d'une cellule, quel que soit son type. */
function texteValeur(colId, v) {
  var col = colonneCartes(colId);
  var genre = genreDe(col, champDe(colId));
  if (v === null || v === undefined || v === '') { return ''; }
  if (genre === 'pj') {
    var n = idsPJ(v).length;
    return n ? n + (n > 1 ? ' fichiers' : ' fichier') : '';
  }
  if (estValeurInvalide(genre, v)) { return v + ' (valeur non valide)'; }
  if (genre === 'date') { return formaterDate(v); }
  if (genre === 'dateheure') { return formaterDateHeure(v, fuseauDe(col)); }
  if (genre === 'nombre') { return formaterNombreCol(v, col); }
  if (genre === 'oui_non') { return v ? 'Oui' : 'Non'; }
  if (genre === 'reference') {
    var r = refDeColonne(col);
    return v ? (r && r.libelles[v] ? r.libelles[v] : 'Ligne ' + v) : '';
  }
  if (Array.isArray(v) && v[0] === 'L') {
    var rs = genre === 'references' ? refDeColonne(col) : null;
    return v.slice(1).map(function (x) { return rs && rs.libelles[x] ? rs.libelles[x] : String(x); }).join(', ');
  }
  if (typeof v === 'object') { return ''; }
  return String(v);
}

function estEnRetard(carte) {
  var c = etat.config;
  if (!c.colEcheance) { return false; }
  var v = carte.valeurs[c.colEcheance];
  if (typeof v !== 'number' || !v) { return false; }
  var derniere = etat.etapes.length ? etat.etapes[etat.etapes.length - 1].cle : null;
  if (carte.cle === derniere) { return false; }
  return v < aujourdhuiSec();
}

function genreFiltre(colId) { return genreDe(colonneCartes(colId), champDe(colId)); }

function estVide(v) {
  return v === null || v === undefined || v === '' || v === 0 || (Array.isArray(v) && v.length <= 1);
}

/* Une carte passe un filtre si sa valeur correspond a celle choisie. Pour
   des etiquettes, il suffit qu'elle porte l'etiquette choisie. */
function passeFiltre(carte, colId, choisie) {
  var v = carte.valeurs[colId];
  var g = genreFiltre(colId);
  if (choisie === VALEUR_VIDE) { return g === 'oui_non' ? false : estVide(v); }
  if (g === 'oui_non') { return (v ? 'Oui' : 'Non') === choisie; }
  if (g === 'etiquettes') { return Array.isArray(v) && v.slice(1).map(String).indexOf(choisie) !== -1; }
  if (g === 'references') {
    var rs = refDeColonne(colonneCartes(colId));
    return Array.isArray(v) && v.slice(1).some(function (id) { return (rs && rs.libelles[id] ? rs.libelles[id] : String(id)) === choisie; });
  }
  return texteValeur(colId, v) === choisie;
}

/* Valeurs proposees dans un filtre : celles de la liste de choix, dans leur
   ordre, puis celles trouvees dans les cartes, par ordre alphabetique. */
function valeursFiltre(colId) {
  var g = genreFiltre(colId);
  if (g === 'oui_non') { return ['Oui', 'Non']; }
  var res = [];
  var vus = {};
  var ajouter = function (x) { var t = String(x); if (t && !vus[t]) { vus[t] = true; res.push(t); } };
  valeursProposees(colId).forEach(ajouter);
  var trouvees = [];
  etat.cartes.forEach(function (x) {
    var v = x.valeurs[colId];
    if (g === 'etiquettes') { (Array.isArray(v) ? v.slice(1) : []).forEach(function (e) { trouvees.push(String(e)); }); }
    else if (g === 'references') {
      var rs = refDeColonne(colonneCartes(colId));
      (Array.isArray(v) ? v.slice(1) : []).forEach(function (id) { trouvees.push(rs && rs.libelles[id] ? rs.libelles[id] : String(id)); });
    }
    else { trouvees.push(texteValeur(colId, v)); }
  });
  trouvees.sort(function (a, b) { return a.localeCompare(b, 'fr'); }).forEach(ajouter);
  return res;
}

function nombreFiltresActifs() {
  var n = Object.keys(etat.valeursFiltres).filter(function (k) { return etat.valeursFiltres[k]; }).length;
  return n + (etat.retardSeul ? 1 : 0) + (etat.recherche ? 1 : 0);
}

function correspondFiltres(carte) {
  if (etat.idsVisibles && !etat.idsVisibles[carte.id]) { return false; }
  var c = etat.config;
  var cles = Object.keys(etat.valeursFiltres);
  for (var i = 0; i < cles.length; i++) {
    var choisie = etat.valeursFiltres[cles[i]];
    if (choisie && c.filtres.indexOf(cles[i]) !== -1 && !passeFiltre(carte, cles[i], choisie)) { return false; }
  }
  if (etat.retardSeul && c.filtreRetard && !estEnRetard(carte)) { return false; }
  if (etat.recherche) {
    var q = normaliser(etat.recherche);
    var morceaux = [carte.titre];
    Object.keys(carte.valeurs).forEach(function (k) { if (genreFiltre(k) !== 'pj') { morceaux.push(texteValeur(k, carte.valeurs[k])); } });
    if (normaliser(morceaux.join(' ')).indexOf(q) === -1) { return false; }
  }
  return true;
}

/* === SECTION : MODALES ===
   Deux niveaux : la fenetre principale (fiche, deplacement, formulaires) et
   la confirmation, qui peut s'ouvrir par-dessus. Piege de tabulation et
   retour du focus pour chacun. */
function elementsFocusables(racine) {
  return Array.prototype.filter.call(racine.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
    function (n) { return !n.disabled && n.offsetParent !== null; });
}

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    var premier = f[0];
    var dernier = f[f.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  };
}

function ouvrirModale(o) {
  var ov = document.getElementById('wModale');
  var boite = document.getElementById('wModaleBoite');
  boite.className = 'w-dialogue' + (o.etroite ? ' w-dialogue--etroit' : '') + (o.laterale ? ' w-dialogue--lateral' : '');
  ov.classList.toggle('w-overlay--lateral', !!o.laterale);
  document.getElementById('wModaleTitre').textContent = o.titre;
  var sous = document.getElementById('wModaleSous');
  sous.textContent = o.sousTitre || '';
  sous.hidden = !o.sousTitre;
  var corps = document.getElementById('wModaleCorps');
  vider(corps);
  (o.corps || []).forEach(function (n) { if (n) { corps.appendChild(n); } });
  var pied = document.getElementById('wModalePied');
  vider(pied);
  (o.pied || []).forEach(function (n) { if (n) { pied.appendChild(n); } });
  if (!etat.modaleOuverte) { _modale.retour = document.activeElement; }
  _modale.surFermeture = o.surFermeture || null;
  _modale.fermerDehors = !!o.fermerDehors;
  /* Clic en dehors de la fenetre : fermeture, si le clic commence et se
     termine en dehors (une selection de texte qui deborde ne ferme rien). */
  if (!_modale.dehorsBranche) {
    _modale.dehorsBranche = true;
    ov.addEventListener('mousedown', function (e) { _modale.departDehors = e.target === ov; });
    ov.addEventListener('click', function (e) {
      if (_modale.fermerDehors && _modale.departDehors && e.target === ov) { fermerModale(); }
      _modale.departDehors = false;
    });
  }
  etat.modaleOuverte = true;
  ov.classList.add('actif');
  void ov.offsetHeight;
  if (_modale.pieger) { ov.removeEventListener('keydown', _modale.pieger); }
  _modale.pieger = fabriquerPiege(boite, fermerModale);
  ov.addEventListener('keydown', _modale.pieger);
  var cible = o.focus ? document.getElementById(o.focus) : null;
  var f = cible || elementsFocusables(corps)[0] || document.getElementById('wModaleFermer');
  if (f) { f.focus(); }
}

function fermerModale() {
  var ov = document.getElementById('wModale');
  if (!ov.classList.contains('actif')) { return; }
  ov.classList.remove('actif');
  if (_modale.pieger) { ov.removeEventListener('keydown', _modale.pieger); _modale.pieger = null; }
  etat.modaleOuverte = false;
  var rappel = _modale.surFermeture;
  _modale.surFermeture = null;
  if (rappel) { rappel(); }
  var r = _modale.retour;
  _modale.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
}

/* Confirmation ou saisie courte. Resout true/false, ou le texte saisi. */
function confirmerAction(titre, message, libelleOui, saisieInitiale) {
  return new Promise(function (resolve) {
    var ov = document.getElementById('wConfirmOverlay');
    if (!ov) { resolve(false); return; }
    if (_confirm.resolution) { _confirm.resolution(false); }
    _confirm.resolution = resolve;
    document.getElementById('wConfirmTitre').textContent = titre;
    document.getElementById('wConfirmMsg').textContent = message || '';
    var zone = document.getElementById('wConfirmChamp');
    vider(zone);
    var champ = null;
    if (saisieInitiale !== undefined) {
      champ = saisie('wConfirmSaisie', saisieInitiale);
      zone.appendChild(groupeChamp('Nouveau nom', champ, null, true));
    }
    document.getElementById('wConfirmOui').textContent = libelleOui || 'Confirmer';
    _confirm.retour = document.activeElement;
    ov.classList.add('actif');
    void ov.offsetHeight;
    _confirm.pieger = fabriquerPiege(ov, function () { terminerConfirmation(false); });
    ov.addEventListener('keydown', _confirm.pieger);
    if (champ) {
      champ.focus();
      champ.select();
      champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); terminerConfirmation(true); } });
    } else {
      document.getElementById('wConfirmOui').focus();
    }
  });
}

function terminerConfirmation(oui) {
  var ov = document.getElementById('wConfirmOverlay');
  var champ = document.getElementById('wConfirmSaisie');
  var valeur = oui ? (champ ? champ.value.trim() : true) : false;
  ov.classList.remove('actif');
  if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); _confirm.pieger = null; }
  var r = _confirm.retour;
  _confirm.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  var res = _confirm.resolution;
  _confirm.resolution = null;
  if (res) { res(valeur); }
}

/* === SECTION : NAVIGATION ENTRE LES VUES === */
function contenu() { return document.getElementById('contenu'); }

function titreVue(texte) {

/* === SECTION : TITRE DE LA PAGE ===
   Le bandeau porte un titre generique, le widget pouvant heberger plusieurs

}

async function annulerAssistant() {
