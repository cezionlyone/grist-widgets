function etapeFiltres() {
  var b = etat.brouillon;
  var maj = function (focusId) { majAttente(); redessinerEtape(focusId); };
  var aEcheance = b.infos.some(function (i) { return infoActive(i) && i.echeance; });
  var filtres = [];
  var retard = optionCase('kRetard', 'En retard seulement', aEcheance ? 'Ne garde que les cartes dont l\'échéance est dépassée.' : 'Disponible quand une information a le rôle Échéance (étape « Les informations »).',
    b.filtreRetard && aEcheance, function (v) { b.filtreRetard = v; maj('kRetard'); });
  if (!aEcheance) { retard.querySelector('input').disabled = true; }
  filtres.push(retard);
  var cand = b.infos.filter(function (i) { return infoActive(i) && GENRES_FILTRABLES.indexOf(i.genre) !== -1; });
  if (!cand.length) { filtres.push(creer('p', { classe: 'w-mention', texte: 'Aucune information ne se prête à un filtre.' })); }
  cand.forEach(function (info, i) {
    var cb = creer('input', { attrs: { type: 'checkbox', id: 'kFil' + i }, coche: b.filtres.indexOf(info.uid) !== -1 });
    cb.addEventListener('change', function () {
      if (cb.checked) { b.filtres.push(info.uid); } else { b.filtres = b.filtres.filter(function (u) { return u !== info.uid; }); }
      maj('kFil' + i);
    });
    filtres.push(creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm' }, [cb, creer('label', { classe: 'fr-label', attrs: { 'for': 'kFil' + i }, texte: info.libelle })]));
  });
  var recherche = [optionCase('kRech', 'Recherche', 'Dans le titre et le contenu des cartes, sans tenir compte des accents ni des majuscules.', b.recherche,
    function (v) { b.recherche = v; maj('kRech'); })];
  return ecranColonnes([
    { titre: 'Filtres', id: 'kAideFiltres', aide: 'Les filtres proposés dans le panneau du Kanban, dans l\'ordre où vous les cochez. Les listes de choix, étiquettes, personnes, références, oui ou non et textes peuvent servir de filtre. Un bouton « Effacer les filtres » apparaît dès qu\'un filtre est posé.', contenu: filtres },
    { titre: 'Recherche', contenu: recherche }],
    { titre: 'Aperçu du panneau du Kanban', noeud: apercuVolet() }, 'w-c3--serre');
}

/* --- Etape 6 : verifier --- */
function changementsParEtape(b) {
  var g = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
  var perso = b.mode === 'personnalisation';
  var c = etat.config;
  var cfgVisibles = function (u) { return infoActive(infoParUid(u)); };
  if (!perso) {
    g[1].push({ t: 'Nom : ' + b.nom.trim() });
    if (b.description.trim()) { g[1].push({ t: 'Description : ' + b.description.trim() }); }
    colonnesActives().forEach(function (x) { g[2].push({ t: x.nom.trim() }); });
    b.infos.filter(infoActive).forEach(function (i) {
      g[3].push({ t: i.libelle + ' : ' + libelleGenre(i.genre).toLowerCase() + (i.valeurs.length ? ' (' + i.valeurs.join(', ') + ')' : '')
        + (i.echeance ? ', échéance' : '') + (i.responsable ? ', responsable' : '') });
      if (GENRES_A_VALEURS.indexOf(i.genre) !== -1 && !i.valeurs.length) {
        g[3].push({ t: i.libelle + ' : aucune valeur proposée. Sa liste restera vide dans les cartes tant que vous n\'en ajoutez pas.', alerte: true });
      }
    });
    var surC = b.ordreCarte.filter(cfgVisibles).map(infoParUid).filter(function (i) { return i.surCarte; }).map(function (i) { return i.libelle; });
    var dansF = b.ordreFiche.filter(cfgVisibles).map(infoParUid).filter(function (i) { return i.dansFiche; }).map(function (i) { return i.libelle; });
    g[4].push({ t: 'Sur la carte : ' + (surC.length ? surC.join(', ') : 'le titre seulement') + (b.compact ? ' (affichage compact)' : '') });
    g[5].push({ t: 'Dans la fiche : ' + (dansF.length ? dansF.join(', ') : 'le titre et la colonne seulement') });
    if (!b.nomsInfos) { g[4].push({ t: 'Noms des informations masqués sur les cartes' }); }
    if (b.couverture && infoActive(infoParUid(b.couverture))) { g[4].push({ t: 'Image de couverture : ' + infoParUid(b.couverture).libelle }); }
    if (b.couleur && infoActive(infoParUid(b.couleur))) { g[4].push({ t: 'Couleur des cartes selon : ' + infoParUid(b.couleur).libelle }); }
    var outils = [];
    if (b.recherche) { outils.push('recherche'); }
    b.filtres.map(infoParUid).filter(infoActive).forEach(function (i) { outils.push('filtre ' + i.libelle); });
    if (b.filtreRetard) { outils.push('en retard seulement'); }
    g[6].push({ t: outils.length ? outils.join(', ') : 'Aucun outil de recherche' });
    return g;
  }
  if (b.nom.trim() !== (c.nom || '')) { g[1].push({ t: 'Nom : « ' + b.nom.trim() + ' »' }); }
  if (b.description.trim() !== (c.description || '')) { g[1].push({ t: 'Description modifiée' }); }
  if (!!b.historique !== !!c.historique) { g[1].push({ t: b.historique ? 'Historique et commentaires activés' : 'Historique et commentaires désactivés' }); }
  var actives = colonnesActives();
  b.colonnes.forEach(function (x) {
    if (x.supprimee && x.cle) {
      var d = colonneParUid(x.dest);
      g[2].push({ t: '« ' + x.nomInitial + ' » supprimée' + (x.nb ? ' : ' + (x.nb > 1 ? 'ses ' + x.nb + ' cartes iront' : 'sa carte ira') + ' dans « ' + (d ? d.nom : '') + ' »' : ''), alerte: true });
    } else if (!x.supprimee && !x.cle) {
      g[2].push({ t: 'Nouvelle colonne « ' + x.nom.trim() + ' »' });
    } else if (!x.supprimee) {
      if (x.nom.trim() !== x.nomInitial) { g[2].push({ t: '« ' + x.nomInitial + ' » renommée en « ' + x.nom.trim() + ' »' }); }
    }
  });
  var ordreInit = etat.etapes.map(function (e) { return e.cle; }).join('|');
  var ordreNouv = actives.filter(function (x) { return x.cle; }).map(function (x) { return x.cle; });
  var ordreInitFiltre = etat.etapes.map(function (e) { return e.cle; }).filter(function (k) { return ordreNouv.indexOf(k) !== -1; }).join('|');
  if (ordreNouv.join('|') !== ordreInitFiltre && ordreInit) { g[2].push({ t: 'Ordre des colonnes modifié' }); }
  b.infos.forEach(function (i) {
    if (i.nouvelle && !i.supprimee) { g[3].push({ t: 'Nouvelle information « ' + i.libelle.trim() + ' » (' + libelleGenre(i.genre).toLowerCase() + ')' }); return; }
    if (i.nouvelle) { return; }
    if (i.supprimee) { g[3].push({ t: '« ' + i.libelleInitial + ' » supprimée : son contenu sera effacé de toutes les cartes', alerte: true }); return; }
    if (i.utilisee !== i.utiliseeInitiale) { g[3].push({ t: (i.utilisee ? 'Colonne « ' + i.libelle + ' » utilisée' : 'Colonne « ' + i.libelle + ' » retirée du Kanban (elle reste dans votre table)') }); }
    if (i.libelle.trim() !== i.libelleInitial) { g[3].push({ t: '« ' + i.libelleInitial + ' » renommée en « ' + i.libelle.trim() + ' »' }); }
    var ajout = i.valeurs.filter(function (v) { return i.valeursInitiales.indexOf(v) === -1; });
    var retrait = i.valeursInitiales.filter(function (v) { return i.valeurs.indexOf(v) === -1; });
    if (ajout.length) { g[3].push({ t: i.libelle + ' : ' + (ajout.length > 1 ? 'valeurs' : 'valeur') + ' ajoutée' + (ajout.length > 1 ? 's' : '') + ' (' + ajout.join(', ') + ')' }); }
    if (retrait.length) { g[3].push({ t: i.libelle + ' : ' + (retrait.length > 1 ? 'valeurs' : 'valeur') + ' retirée' + (retrait.length > 1 ? 's' : '') + ' (' + retrait.join(', ') + ')' }); }
  });
  var ech = b.infos.filter(function (i) { return infoActive(i) && i.echeance; })[0];
  var resp = b.infos.filter(function (i) { return infoActive(i) && i.responsable; })[0];
  if ((ech ? ech.col || ech.uid : null) !== (c.colEcheance || null)) { g[3].push({ t: ech ? 'Échéance : « ' + ech.libelle + ' »' : 'Plus d\'information d\'échéance' }); }
  if ((resp ? resp.col || resp.uid : null) !== (c.colResponsable || null)) { g[3].push({ t: resp ? 'Responsable : « ' + resp.libelle + ' »' : 'Plus d\'information de responsable' }); }
  var init = JSON.parse(b.initial);
  if (sequenceVisible(b, 'ordreCarte', 'surCarte') !== b.initCarte) { g[4].push({ t: 'Contenu ou ordre de la carte modifié' }); }
  if (sequenceVisible(b, 'ordreFiche', 'dansFiche') !== b.initFiche) { g[5].push({ t: 'Contenu ou ordre de la fiche modifié' }); }
  if (b.compact !== init.compact) { g[4].push({ t: b.compact ? 'Affichage compact activé' : 'Affichage compact désactivé' }); }
  if (b.nomsInfos !== init.nomsInfos) { g[4].push({ t: b.nomsInfos ? 'Noms des informations affichés sur les cartes' : 'Noms des informations masqués sur les cartes' }); }
  if (b.couverture !== init.couverture) { var ic = infoParUid(b.couverture); g[4].push({ t: ic ? 'Image de couverture : « ' + ic.libelle + ' »' : 'Plus d\'image de couverture' }); }
  if (b.couleur !== init.couleur) { var il = infoParUid(b.couleur); g[4].push({ t: il ? 'Couleur des cartes selon « ' + il.libelle + ' »' : 'Plus de couleur des cartes' }); }
  if (JSON.stringify(b.tri) !== JSON.stringify(init.tri)) { g[4].push({ t: 'Rangement des cartes modifié' }); }
  if (b.recherche !== init.recherche) { g[6].push({ t: b.recherche ? 'Recherche proposée' : 'Recherche retirée' }); }
  if (b.filtreRetard !== init.filtreRetard) { g[6].push({ t: b.filtreRetard ? 'Filtre « En retard seulement » proposé' : 'Filtre « En retard seulement » retiré' }); }
  var fAv = init.filtres.join('|');
  var fAp = b.filtres.filter(function (u) { return infoActive(infoParUid(u)); }).join('|');
  if (fAv !== fAp) {
    var nouv = b.filtres.filter(function (u) { return init.filtres.indexOf(u) === -1 && infoActive(infoParUid(u)); }).map(function (u) { return infoParUid(u).libelle; });
    var ret = init.filtres.filter(function (u) { return b.filtres.indexOf(u) === -1 || !infoActive(infoParUid(u)); }).map(function (u) { var i = infoParUid(u); return i ? i.libelleInitial || i.libelle : ''; });
    if (nouv.length) { g[6].push({ t: 'Filtre' + (nouv.length > 1 ? 's' : '') + ' ajouté' + (nouv.length > 1 ? 's' : '') + ' : ' + nouv.join(', ') }); }
    if (ret.length) { g[6].push({ t: 'Filtre' + (ret.length > 1 ? 's' : '') + ' retiré' + (ret.length > 1 ? 's' : '') + ' : ' + ret.join(', ') }); }
    if (!nouv.length && !ret.length) { g[6].push({ t: 'Ordre des filtres modifié' }); }
  }
  return g;
}

function compterChangements(b) {
  if (!b || b.mode !== 'personnalisation') { return 0; }
  var g = changementsParEtape(b);
  return Object.keys(g).reduce(function (s, k) { return s + g[k].length; }, 0);
}

/* Derniere etape de la creation : recapitulatif du Kanban a creer. */
function etapeVerifier() {
  var b = etat.brouillon;
  var g = changementsParEtape(b);
  var principal = [creer('p', { classe: 'w-texte w-mention', texte: 'Rien n\'a encore été créé. Relisez votre Kanban, puis créez-le.' })];
  [1, 2, 3, 4, 5, 6].forEach(function (n) {
    principal.push(creer('section', { classe: 'w-recap', attrs: { 'aria-label': ETAPES_ASSISTANT[n - 1] } }, [
      creer('div', { classe: 'w-recap__tete' }, [creer('h3', { texte: ETAPES_ASSISTANT[n - 1] }),
        bouton('Modifier', 'discret', 'edit-line', function () { allerEtape(n); }, { petit: true, aria: 'Modifier : ' + ETAPES_ASSISTANT[n - 1] })]),
      creer('ul', {}, g[n].map(function (l) {
        return creer('li', { classe: l.alerte ? 'w-recap__alerte' : null }, [l.alerte ? creer('strong', { texte: l.t }) : l.t]);
      }))]));
  });
  return creer('div', { classe: 'w-assistant' }, principal);
}

/* --- Validation des etapes --- */
function validerEtape(n) {
  var b = etat.brouillon;
  masquerErreur();
  if (n === 1 && !b.nom.trim()) { marquerInvalide('kNom', 'Donnez un nom au Kanban pour continuer.'); return false; }
  if (n === 2) {
    var act = colonnesActives();
    if (!act.length) { signalerSaisie('Le Kanban doit garder au moins une colonne.'); return false; }
    var vus = {};
    for (var i = 0; i < b.colonnes.length; i++) {
      var x = b.colonnes[i];
      if (x.supprimee) { continue; }
      var k = normaliser(x.nom);
      if (!k) { marquerInvalide('kCol' + i, 'La colonne ' + (i + 1) + ' n\'a pas de nom.'); return false; }
      if (vus[k]) { marquerInvalide('kCol' + i, 'Deux colonnes portent le même nom : ' + x.nom + '.'); return false; }
      vus[k] = true;
    }
  }
  if (n === 3) {
    var noms = { titre: true };
    for (var j = 0; j < b.infos.length; j++) {
      var inf = b.infos[j];
      if (!infoActive(inf)) { continue; }
      var kn = normaliser(inf.libelle);
      if (!kn) { inf.ouverte = true; redessinerEtape('kInfoNom' + j); marquerInvalide('kInfoNom' + j, 'Donnez un nom à cette information.'); return false; }
      if (noms[kn]) { inf.ouverte = true; redessinerEtape('kInfoNom' + j); marquerInvalide('kInfoNom' + j, 'Une autre information porte déjà ce nom.'); return false; }
      noms[kn] = true;
    }
  }
  return true;
}

/* Fin de la creation : les etapes 1 a 3 sont controlees une derniere fois,
   puis le Kanban est cree. */
async function validerAssistant() {
  for (var n = 1; n <= 3; n++) { if (!validerEtapeSansRendu(n)) { allerEtape(n); validerEtape(n); return; } }
  return creerDepuisBrouillon();
}

function validerEtapeSansRendu(n) {
  var b = etat.brouillon;
  if (n === 1) { return !!b.nom.trim(); }
  if (n === 2) {
    var vus = {};
    var act = colonnesActives();
    if (!act.length) { return false; }
    return act.every(function (x) { var k = normaliser(x.nom); if (!k || vus[k]) { return false; } vus[k] = true; return true; });
  }
  if (n === 3) {
    var noms = { titre: true };
    return b.infos.filter(infoActive).every(function (i) { var k = normaliser(i.libelle); if (!k || noms[k]) { return false; } noms[k] = true; return true; });
  }
  return true;
}

/* --- Creation a partir du brouillon --- */
async function creerDepuisBrouillon() {
  var b = etat.brouillon;
  var actives = colonnesActives();
  var infos = b.ordreCarte.map(infoParUid).filter(infoActive);
  afficherLoader('Préparation de votre Kanban…');
  try {
    /* Premier Kanban du document : la bibliotheque et la table des cartes
       sont creees ensemble. Ensuite, plus aucune table : chaque Kanban
       ajoute ses cartes dans la meme table, et n'y ajoute que les colonnes
       qui n'existent pas encore. */
    await chargerMeta();
    var biblioAbsente = !trouverTable(ID_BIBLIO);
    var tidCartes = await preparerTableCartes();
    var defs = biblioAbsente ? [{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }] : [];
    if (!tidCartes) {
      defs.push({ id: idTableLibre(ID_TABLE_CARTES), colonnes: [{ id: 'TITRE', type: 'Text' }, { id: COL_KANBAN, type: 'Text' },
        { id: 'COLONNE', type: 'Choice' }, { id: 'ORDRE', type: 'Numeric' }, { id: COL_COMMENTAIRE, type: 'Text' }, { id: COL_HISTORIQUE, type: 'Text' }].concat(COLONNES_META) });
    }
    if (defs.length) {
      var tids = await creerTables(defs);
      if (biblioAbsente) { await finaliserBibliotheque(tids[0]); }
      if (!tidCartes) { tidCartes = tids[tids.length - 1]; }
      await chargerMeta();
    }
    var noms = actives.map(function (x) { return x.nom.trim(); });
    var pris = IDS_RESERVES.slice();
    for (var n = 0; n < infos.length; n++) {
      infos[n].colCree = await assurerColonneInfo(tidCartes, infos[n].libelle, infos[n].genre, pris);
      if (GENRES_A_VALEURS.indexOf(infos[n].genre) !== -1) { await unirChoix(tidCartes, infos[n].colCree, infos[n].valeurs); }
    }
    await unirChoix(tidCartes, 'COLONNE', noms);
    var colDe = function (u) { var i = infoParUid(u); return infoActive(i) ? i.colCree : null; };
    var ech = infos.filter(function (i) { return i.echeance; })[0];
    var resp = infos.filter(function (i) { return i.responsable; })[0];
    await assurerBibliotheque();
    await lireTableaux();
    var cleKanban = preparerNouveauTableau();
    memoriserTableau(cleKanban);
    await ecrireConfig({
      mode: 'creation', nom: b.nom.trim(), description: b.description.trim(),
      tableCartes: tidCartes, colTitre: 'TITRE', colEtape: 'COLONNE', colKanban: COL_KANBAN, idKanban: cleKanban, historique: true,
      sourceEtapes: { type: 'liste', valeurs: noms },
      colonneArchive: (function () { var a = actives.filter(function (x) { return x.uid === b.archiveUid; })[0]; return a ? a.nom.trim() : null; })(),
      colOrdreCartes: 'ORDRE', tri: null,
      champs: infos.map(function (i) {
        var ch = { col: i.colCree, libelle: i.libelle.trim(), genre: genreStocke(i.genre), surCarte: !!i.surCarte, dansFiche: !!i.dansFiche };
        if (GENRES_A_VALEURS.indexOf(i.genre) !== -1) { ch.valeurs = i.valeurs.slice(); }
        return ch;
      }),
      ordreFiche: b.ordreFiche.map(colDe).filter(Boolean),
      colEcheance: ech ? ech.colCree : null, colResponsable: resp ? resp.colCree : null, limites: {}, compact: !!b.compact,
      recherche: !!b.recherche, filtres: b.filtres.map(colDe).filter(Boolean), filtreRetard: !!b.filtreRetard && !!ech,
      nomsInfos: b.nomsInfos !== false, couverture: b.couverture ? colDe(b.couverture) : null, couleur: b.couleur ? colDe(b.couleur) : null
    });
    var nomCree = b.nom.trim();
    etat.brouillon = null;
    await chargerTout();
    masquerLoader();
    afficherSucces('Votre Kanban « ' + nomCree + ' » est prêt.');
  } catch (e) {
    masquerLoader();
    afficherErreur('La création du Kanban n\'a pas abouti. Rien n\'a été supprimé : vous pouvez réessayer.', e);
  }
}

/* --- Personnalisation : application du brouillon ---
   Ordre : nouvelles colonnes (pour pouvoir y deplacer des cartes), noms,
   ordre, deplacement des cartes des colonnes supprimees puis suppression ;
   informations creees, valeurs, suppressions ; enfin la configuration. */
async function appliquerBrouillon() {
  var b = etat.brouillon;
  var c = etat.config;
  var src = c.sourceEtapes;
  {
    var cleParUid = {};
    var actives = colonnesActives();
    b.colonnes.forEach(function (x) { if (x.cle) { cleParUid[x.uid] = x.cle; } });
    if (b.colonnesModifiables && src.type === 'ref') {
      for (var i = 0; i < actives.length; i++) {
        var x = actives[i];
        if (x.cle) { continue; }
        var champs = {};
        champs[src.colAffichage] = x.nom.trim();
        var ret = await agir([['AddRecord', src.table, null, champs]]);
        x.id = ret && ret.retValues ? ret.retValues[0] : null;
        cleParUid[x.uid] = String(x.id);
      }
      var actions = [];
      actives.forEach(function (y) {
        if (y.cle && y.nom.trim() !== y.nomInitial) { var ch = {}; ch[src.colAffichage] = y.nom.trim(); actions.push(['UpdateRecord', src.table, y.id, ch]); }
      });
      if (src.colOrdre) {
        var maj = {};
        maj[src.colOrdre] = actives.map(function (_, k) { return (k + 1) * ORDRE_PAS; });
        actions.push(['BulkUpdateRecord', src.table, actives.map(function (y) { return parseInt(cleParUid[y.uid], 10); }), maj]);
      }
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) {
          var m = {};
          m[c.colEtape] = cartes.map(function () { return parseInt(cleParUid[y.dest], 10); });
          actions.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]);
        }
        actions.push(['RemoveRecord', src.table, y.id]);
      });
      if (actions.length) { await agir(actions); }
    } else if (b.colonnesModifiables && src.type === 'choice') {
      var col = colonneCartes(c.colEtape);
      var opts = JSON.parse(JSON.stringify(col.options || {}));
      var anciennes = opts.choiceOptions || {};
      var nouvellesOpts = {};
      var acts = [];
      actives.forEach(function (y) {
        var nom = y.nom.trim();
        cleParUid[y.uid] = nom;
        if (y.cle && anciennes[y.cle]) { nouvellesOpts[nom] = anciennes[y.cle]; }
        if (y.cle && nom !== y.cle) {
          var cartes = cartesDeEtape(y.cle);
          if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return nom; }); acts.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
        }
      });
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return cleParUid[y.dest]; }); acts.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
      });
      opts.choices = actives.map(function (y) { return y.nom.trim(); });
      if (opts.choiceOptions) { opts.choiceOptions = nouvellesOpts; }
      acts.push(['UpdateRecord', '_grist_Tables_column', col.ref, { widgetOptions: JSON.stringify(opts) }]);
      await agir(acts);
    }
    if (b.colonnesModifiables && src.type === 'liste') {
      /* Colonnes du Kanban rangees dans ses reglages : un renommage ou une
         suppression ne touche que les cartes de ce Kanban. */
      var actL = [];
      actives.forEach(function (y) {
        var nom = y.nom.trim();
        cleParUid[y.uid] = nom;
        if (y.cle && nom !== y.cle) {
          var cartes = cartesDeEtape(y.cle);
          if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return nom; }); actL.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
        }
      });
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return cleParUid[y.dest]; }); actL.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
      });
      if (actL.length) { await agir(actL); }
      src.valeurs = actives.map(function (y) { return y.nom.trim(); });
      await unirChoix(c.tableCartes, c.colEtape, src.valeurs);
    }
    /* Informations */
    var partagee = !!c.colKanban;
    if (b.source === 'creation') {
      var pris = IDS_RESERVES.concat(b.infos.filter(function (i) { return i.col; }).map(function (i) { return i.col.toUpperCase(); }));
      for (var j = 0; j < b.infos.length; j++) {
        var inf = b.infos[j];
        if (inf.supprimee && !inf.nouvelle && inf.col) {
          if (partagee) {
            /* Table partagee : le contenu est efface des cartes de ce Kanban ;
               la colonne n'est supprimee que si aucun autre Kanban ne s'en sert. */
            var ids = etat.cartes.map(function (x) { return x.id; });
            if (ids.length) { var vide = {}; vide[inf.col] = ids.map(function () { return null; }); await agir([['BulkUpdateRecord', c.tableCartes, ids, vide]]); }
            if (!colonneUtiliseeAilleurs(c.tableCartes, inf.col)) { await agir([['RemoveColumn', c.tableCartes, inf.col]]); }
          } else {
            await agir([['RemoveColumn', c.tableCartes, inf.col]]);
          }
          continue;
        }
        if (inf.nouvelle && !inf.supprimee) {
          if (partagee) {
            inf.col = await assurerColonneInfo(c.tableCartes, inf.libelle, inf.genre, pris);
            if (GENRES_A_VALEURS.indexOf(inf.genre) !== -1) { await unirChoix(c.tableCartes, inf.col, inf.valeurs); }
          } else {
            var base = versIdentifiant(inf.libelle);
            var id = base;
            var k = 2;
            var tous = IDS_RESERVES.concat(colonnesDe(c.tableCartes).map(function (x) { return x.colId.toUpperCase(); }));
            while (tous.indexOf(id) !== -1) { id = base + '_' + k; k++; }
            var o = GENRES_A_VALEURS.indexOf(inf.genre) !== -1 ? optionsChoix(inf.valeurs) : (inf.genre === 'texte_long' ? { wrap: true } : (genreParCode(inf.genre).options || null));
            inf.col = await ajouterColonne(c.tableCartes, id, genreParCode(inf.genre).type, o);
          }
        }
      }
    }
    for (var v = 0; v < b.infos.length; v++) {
      var iv = b.infos[v];
      if (!infoActive(iv) || iv.nouvelle || !iv.valeursModifiables) { continue; }
      if (JSON.stringify(iv.valeurs) === JSON.stringify(iv.valeursInitiales)) { continue; }
      if (partagee && b.source === 'creation') { await unirChoix(c.tableCartes, iv.col, iv.valeurs); continue; }
      var cc = colonneCartes(iv.col);
      var op = JSON.parse(JSON.stringify(cc.options || {}));
      op.choices = iv.valeurs.slice();
      await agir([['UpdateRecord', '_grist_Tables_column', cc.ref, { widgetOptions: JSON.stringify(op) }]]);
    }
    /* Configuration */
    var colDe = function (u) { var i = infoParUid(u); return infoActive(i) ? i.col : null; };
    var ech = b.infos.filter(function (i) { return infoActive(i) && i.echeance; })[0];
    var resp = b.infos.filter(function (i) { return infoActive(i) && i.responsable; })[0];
    c.nom = b.nom.trim();
    c.description = b.description.trim();
    c.historique = c.colKanban ? true : !!b.historique;
    c.colonneArchive = b.archiveUid && cleParUid[b.archiveUid] ? String(cleParUid[b.archiveUid]) : null;
    c.compact = !!b.compact;
    c.recherche = !!b.recherche;
    c.filtreRetard = !!b.filtreRetard && !!ech;
    c.limites = {};
    c.colEcheance = ech ? ech.col : null;
    c.colResponsable = resp ? resp.col : null;
    c.filtres = b.filtres.map(colDe).filter(Boolean);
    c.ordreFiche = b.ordreFiche.map(colDe).filter(Boolean);
    c.champs = b.ordreCarte.map(infoParUid).filter(infoActive).map(function (i) {
      var ch = { col: i.col, surCarte: !!i.surCarte, dansFiche: !!i.dansFiche };
      if (b.source === 'creation') {
        ch.libelle = i.libelle.trim();
        ch.genre = genreStocke(i.genre);
        if (c.colKanban && GENRES_A_VALEURS.indexOf(i.genre) !== -1) { ch.valeurs = i.valeurs.slice(); }
      }
      else if (i.libelle.trim() !== (colonneCartes(i.col) || {}).label) { ch.libelle = i.libelle.trim(); }
      return ch;
    });
    if (b.tri) { c.tri = { col: b.tri.col, sens: b.tri.sens }; }
    c.nomsInfos = b.nomsInfos !== false;
    c.couverture = b.couverture ? colDe(b.couverture) : null;
    c.couleur = b.couleur ? colDe(b.couleur) : null;
    await ecrireConfig(c);
    return cleParUid;
  }
}

/* Point de depart en une question : le document contient-il deja des
   donnees ? A l'etape 2, chaque branche commence par un Kanban vierge,
   puis propose les suggestions (avec donnees) ou les modeles et les Kanbans
   du document (sans donnees) : repartir d'un Kanban revient a s'en servir
   comme modele. */
function rendreDepart(zone) {
  var b = etat.brouillon;
  if (b.choixDepart === 'modele') { rendreChoixModele(zone); return; }
  var bloc = creer('div', { classe: 'w-assistant' });
  bloc.appendChild(stepper(1, ['Point de départ']));
  var option = function (id, icone, titre, texte, libelle, action, principal) {
    return creer('section', { classe: 'w-tuile w-tuile--depart', attrs: { 'aria-labelledby': id } }, [
      creer('span', { classe: 'fr-icon-' + icone + ' fr-icon--lg w-tuile__icone', attrs: { 'aria-hidden': 'true' } }),
      creer('h3', { classe: 'fr-h5 fr-m-0', id: id, texte: titre }),
      creer('p', { classe: 'w-texte w-mention', texte: texte }),
      creer('div', { classe: 'w-tuile__bas' }, [bouton(libelle, principal ? null : 'secondaire', 'arrow-right-line', action)])
    ]);
  };
  /* Une seule question au depart : le document contient-il deja des
     donnees ? La suite (suggestions ou parametrage libre d'une part,
     modele ou Kanban vierge d'autre part) vient a l'etape 2. */
  var aDesDonnees = tablesBranchables().length > 0;
  var nbSug = aDesDonnees ? suggestionsDeDonnees().length : 0;
  var texteDonnees = !aDesDonnees ? 'Ce document ne contient encore aucune table de données : cette possibilité sera proposée dès qu\'il en aura une.'
    : (nbSug ? 'Le widget a analysé vos tables et vous suggère ' + (nbSug > 1 ? nbSug + ' Kanbans prêts' : 'un Kanban prêt') + ' à l\'emploi. Vous pouvez aussi le paramétrer vous-même à partir de la table de votre choix.'
      : 'Le widget n\'a pas trouvé de Kanban à vous suggérer d\'après vos tables : vous le paramétrez vous-même à partir de la table de votre choix.');
  var tuileDonnees = option('dDonnees', 'table-line', 'J\'ai déjà des données dans ce document', texteDonnees,
    'Utiliser mes données', function () { return demarrerBranchement(); }, aDesDonnees);
  if (!aDesDonnees) { tuileDonnees.querySelector('button').disabled = true; }
  bloc.appendChild(creer('div', { classe: 'w-tuiles' }, [tuileDonnees,
    option('dSans', 'add-line', 'Je n\'ai pas encore de données', etat.tableaux.length ? 'Le widget crée tout pour vous : partez d\'un modèle prêt à l\'emploi, d\'un de vos Kanbans ou d\'un Kanban vierge.'
        : 'Le widget crée tout pour vous : partez d\'un modèle prêt à l\'emploi ou d\'un Kanban vierge.',
      'Commencer sans données', function () { b.choixDepart = 'modele'; afficherVue('assistant'); }, !aDesDonnees)
  ]));
  zone.appendChild(bloc);
}

function rendreChoixModele(zone) {
  var b = etat.brouillon;
  var bloc = creer('div', { classe: 'w-assistant' });
  bloc.appendChild(stepper(2, PARCOURS.modele, function (r) { return r === 1 ? function () { b.choixDepart = null; afficherVue('assistant'); } : null; }));
  bloc.appendChild(creer('p', { classe: 'w-texte w-mention', texte: 'Partez d\'un Kanban vierge ou d\'un modèle : il prépare les colonnes et les informations des cartes, que vous modifiez ensuite à votre guise.' }));
  var vierge = creer('div', { classe: 'w-tuiles w-tuiles--grille' });
  vierge.appendChild(creer('section', { classe: 'w-tuile', attrs: { 'aria-label': 'Kanban vierge' } }, [

/* Reprend la structure d'un Kanban du document. Les colonnes sont lues dans
   leur source ; une information de type reference devient une liste de
   choix dont les valeurs sont les lignes visees ; les types sans equivalent
   dans un nouveau tableau sont signales et ignores. */
async function repartirDeTableau(t) {
  afficherLoader('Lecture du Kanban…');
  try {
    await chargerMeta();
    var cfg = t.config;
    var tc = cfg.tableCartes;
    if (!etat.meta.tables[tc]) { throw new Error('Table des cartes absente : ' + tc); }
    var colE = infoColonne(tc, cfg.colEtape);
    var etapes = [];
    var parCle = {};
    var cible = colE ? tableCibleRef(colE.type) : null;
    if (cfg.sourceEtapes && cfg.sourceEtapes.type === 'liste') {
      (cfg.sourceEtapes.valeurs || []).forEach(function (v) { etapes.push(v); parCle[v] = v; });
    } else if (colE && cible && colE.type.indexOf('Ref:') === 0) {
      var aff = colAffichageRef(colE) || (cfg.sourceEtapes && cfg.sourceEtapes.colAffichage);
      var ord = cfg.sourceEtapes && cfg.sourceEtapes.colOrdre;
      var e = await lireTable(cible);
      var lignes = [];
      for (var i = 0; i < e.id.length; i++) {
        lignes.push({ id: e.id[i], lib: aff ? colonneDe(e, aff, i) : null, o: ord ? colonneDe(e, ord, i) : colonneDe(e, 'manualSort', i) });
      }
      lignes.sort(function (x, y) { return (typeof x.o === 'number' ? x.o : 1e15) - (typeof y.o === 'number' ? y.o : 1e15) || x.id - y.id; });
      lignes.forEach(function (l) { if (l.lib) { etapes.push(String(l.lib)); parCle[String(l.id)] = String(l.lib); } });
    } else if (colE && colE.type === 'Choice') {
      choixDe(colE).forEach(function (v) { etapes.push(v); parCle[v] = v; });
    } else if (colE) {
      var d = await lireTable(tc);
      var vus = {};
      (d[cfg.colEtape] || []).forEach(function (v) { if (v && typeof v === 'string' && !vus[v]) { vus[v] = true; etapes.push(v); parCle[v] = v; } });
      etapes.sort(function (x, y) { return x.localeCompare(y, 'fr'); });
    }
    if (!etapes.length) { etapes = MODELES_ETAPES[0].slice(); }
    var champs = [];
    var ignores = [];
    var libParCol = {};
    for (var k = 0; k < (cfg.champs || []).length; k++) {
      var ch = cfg.champs[k];
      var col = infoColonne(tc, ch.col);
      if (!col) { continue; }
      var lib = ch.libelle || col.label;
      var g = genreAffiche(col, ch.genre || genreDe(col, null));
      var valeurs = [];
      if (g === 'reference') {
        try {
          var r = await chargerRef(tableCibleRef(col.type), colAffichageRef(col));
          valeurs = r.ids.map(function (id) { return r.libelles[id]; });
          g = 'choix';
        } catch (e2) {
          ignores.push(lib);
          continue;
        }
      } else if (['references', 'autre'].indexOf(g) !== -1) {
        ignores.push(lib);
        continue;
      } else if (GENRES_A_VALEURS.indexOf(g) !== -1) {
        valeurs = Array.isArray(ch.valeurs) ? ch.valeurs.slice() : choixDe(col);
      }
      libParCol[ch.col] = lib;
      champs.push({ libelle: lib, genre: g, valeurs: valeurs, echeance: ch.col === cfg.colEcheance, responsable: ch.col === cfg.colResponsable,
        surCarte: ch.surCarte, dansFiche: ch.dansFiche });
    }
    var parCol = function (l) { return (l || []).map(function (x) { return libParCol[x]; }).filter(Boolean); };
    etat.brouillon = brouillonDepuisDefinition({ nom: (cfg.nom || 'Tableau') + ' (copie)', description: cfg.description || '', etapes: etapes, champs: champs,
      options: { filtres: parCol(cfg.filtres), filtreRetard: !!cfg.filtreRetard, ordreFiche: parCol(cfg.ordreFiche),
        compact: !!cfg.compact, recherche: cfg.recherche !== false },
      origine: 'du Kanban « ' + (cfg.nom || 'Sans nom') + ' »', ignores: ignores });
    etat.brouillon.choixDepart = 'modele';
    masquerLoader();
    afficherVue('assistant');
  } catch (e) {
    masquerLoader();
    afficherErreur('La lecture de ce Kanban n\'a pas abouti.', e);
  }
}

/* Kanbans suggeres a partir des tables du document : pour chaque table non
   encore utilisee, le widget cherche une colonne qui ressemble a une etape
   (liste de choix ou reference, nom evoquant un statut, un etat, une
   phase...) et un titre. Les meilleures propositions sont presentees en
   premier ; aucune n'est appliquee sans validation. */

  var res = [];
  tablesBranchables().forEach(function (tid) {
    if (tableauDeTable(tid)) { return; }
    var a = nouvelAssistantBranchement(tid);
    proposerAssociations(a);
    if (!a.colEtape || !a.colTitre) { return; }
    var colE = infoColonne(tid, a.colEtape);
    var score = (colE.type === 'Choice' ? 3 : (colE.type.indexOf('Ref:') === 0 ? 2 : 0)) + (evoqueRole(colE, 'etape') ? 2 : 0)

    res.push({ a: a, score: score, colE: colE, nom: libelleTable(tid) + ' par ' + colE.label });
  });
  return res.sort(function (x, y) { return y.score - x.score; }).slice(0, 6);

function tableauDeTable(tid) {

  return null;
}

function tablesBranchables() {

    return !estTableExclue(tid) && !t.resume && tid.toUpperCase().indexOf(ID_BIBLIO) === -1 && !(tid.toUpperCase().indexOf(ID_TABLE_CARTES) === 0 && infoColonne(tid, COL_KANBAN));
  }).sort(function (x, y) { return x.localeCompare(y, 'fr'); });
}

/* Raison pour laquelle une colonne ne peut pas porter l'etape, ou null si
   elle le peut. Les raisons sont redigees pour l'agent. */
function raisonRefusEtape(c) {
  var typeOk = c.type === 'Choice' || c.type === 'Text' || c.type === 'Any' || c.type.indexOf('Ref:') === 0;
  if (c.type === 'ChoiceList') { return 'choix multiples : une carte ne peut pas être dans deux colonnes à la fois'; }
  if (!typeOk) { return null; }
  if (c.formule) { return 'colonne calculée : le Kanban ne pourrait pas y écrire l\'étape quand une carte est déplacée'; }
  if (estEcrasee(c)) { return 'sa formule de déclenchement recalcule la valeur à chaque modification : un déplacement de carte serait aussitôt annulé'; }
  return '';
}

function colonnesEtapePossibles(tid) {
  return colonnesDe(tid).filter(function (c) { return raisonRefusEtape(c) === ''; });
}

/* Colonnes qui ressemblent a une colonne d'etape mais sont ecartees. Les
   dates, nombres, cases a cocher ne sont pas listees : elles ne peuvent
   evidemment pas servir d'etape. */
function colonnesEtapeEcartees(tid) {
  return colonnesDe(tid).filter(function (c) {
    var r = raisonRefusEtape(c);
    return r !== null && r !== '' && IDS_META.indexOf(c.colId) === -1 && IDS_TECHNIQUES.indexOf(c.colId) === -1;
  });
}

function colonnesTitrePossibles(tid) {
  return colonnesDe(tid).filter(function (c) { return c.type === 'Text' || c.type === 'Any'; });

function colonneOrdreExistante(tid) {
  var candidats = ['ORDRE', 'ORDRE_KANBAN'];
  for (var i = 0; i < candidats.length; i++) {
    var c = infoColonne(tid, candidats[i]);
    if (c && (c.type === 'Numeric' || c.type === 'Int') && !c.formule) { return c.colId; }
  }
  return null;
}

function nomColonneOrdreLibre(tid) {
  var pris = colonnesDe(tid).map(function (c) { return c.colId.toUpperCase(); })
    .concat(colonnesDe(tid).map(function (c) { return String(c.label).toUpperCase(); }));
  if (pris.indexOf('ORDRE') === -1) { return 'ORDRE'; }
  var n = 'ORDRE_KANBAN';
  var k = 2;
  while (pris.indexOf(n) !== -1) { n = 'ORDRE_KANBAN_' + k; k++; }
  return n;
}

function autresColonnes(a) {
  return colonnesDe(a.table).filter(function (c) {
    return c.colId !== a.colEtape && c.colId !== a.colTitre && IDS_META.indexOf(c.colId) === -1 && IDS_TECHNIQUES.indexOf(c.colId) === -1 && c.colId !== colonneOrdreExistante(a.table);

}

        creer('span', { classe: 'fr-hint-text', texte: ordreExistant ? 'La colonne ' + ordreExistant + ' de votre table sera utilisée pour mémoriser l\'ordre.'
          : 'Une colonne ' + nomColonneOrdreLibre(a.table) + ' sera ajoutée à votre table pour mémoriser l\'ordre. Rien d\'autre n\'est modifié.' })])])]),

function evoqueRole(col, role) {
  var n = ' ' + normaliser(col.label + ' ' + col.colId).replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  return INDICES_ROLES[role].some(function (m) { return n.indexOf(' ' + m + ' ') !== -1; });
}

/* Propositions faites a l'arrivee sur l'etape 2, d'apres le nom et le type
   des colonnes. Un choix deja fait par l'agent n'est jamais remplace. */
function proposerAssociations(a) {
  var t = a.table;
  var score = function (c, role) {
    return (evoqueRole(c, role) ? 2 : 0) + (c.type === 'Choice' ? 1.5 : (c.type.indexOf('Ref:') === 0 ? 1 : 0));
  };
  if (!a.colEtape) {
    var etapes = colonnesEtapePossibles(t).map(function (c) { return { c: c, s: score(c, 'etape') }; })
      .filter(function (x) { return x.s >= 1; }).sort(function (x, y) { return y.s - x.s; });
    if (etapes.length) { a.colEtape = etapes[0].c.colId; }
  }
  if (!a.colTitre) {
    var titres = colonnesTitrePossibles(t).filter(function (c) { return c.colId !== a.colEtape; });
    var parNom = titres.filter(function (c) { return evoqueRole(c, 'titre'); });
    var libres = titres.filter(function (c) { return !c.formule; });
    var choix = parNom[0] || libres[0] || null;
    if (choix) { a.colTitre = choix.colId; }
  }
  var autres = colonnesDe(t).filter(function (c) { return c.colId !== a.colEtape && c.colId !== a.colTitre && IDS_META.indexOf(c.colId) === -1 && IDS_TECHNIQUES.indexOf(c.colId) === -1; });
  if (!a.colEcheance) {
    var ech = autres.filter(function (c) { return c.type === 'Date' && evoqueRole(c, 'echeance'); })[0];
    if (ech) { a.colEcheance = ech.colId; }
  }
  if (!a.colResponsable) {
    var resp = autres.filter(function (c) { return (c.type === 'Choice' || c.type === 'Text' || c.type.indexOf('Ref:') === 0) && evoqueRole(c, 'responsable'); })[0];
    if (resp) { a.colResponsable = resp.colId; }
  }
  if (!Object.keys(a.champs).length) {
    var coches = [];
    if (a.colEcheance) { coches.push(a.colEcheance); }
    if (a.colResponsable) { coches.push(a.colResponsable); }
    autres.filter(function (c) { return (c.type === 'Choice' || c.type === 'ChoiceList') && coches.indexOf(c.colId) === -1; }).slice(0, 2)
      .forEach(function (c) { coches.push(c.colId); });
    autres.filter(function (c) { return c.type === 'Attachments'; }).slice(0, 1).forEach(function (c) { coches.push(c.colId); });
    coches.slice(0, 5).forEach(function (id) { a.champs[id] = true; });
  }
  a.proposeesPour = t;
}

function annonceePropositions(a) {
  if (a.proposeesPour !== a.table) { return null; }
  return alerte('info', null, 'Le widget a fait des propositions d\'après le nom et le type de vos colonnes. Vérifiez-les : vous pouvez tout changer.');
}

/* La structure du document est relue a chaque changement d'etape : une
   colonne creee ou modifiee pendant l'assistant est prise en compte, et un
   choix devenu invalide est retire. */
/* Saut vers une etape du branchement depuis la barre d'etapes : en arriere
   directement, en avant etape par etape pour garder les controles. */
async function allerEtapeBranchement(cible) {
  var a = etat.assistant;
  if (cible < a.etape) { a.suggestion = null; a.etape = cible; afficherVue('branchement'); return; }
  while (a.etape < cible) {
    var avant = a.etape;
    await changerEtapeBranchement(1);
    if (a.etape === avant) { return; }
  }
}

async function changerEtapeBranchement(sens) {
  var a = etat.assistant;
  if (sens < 0) { a.suggestion = null; }
  try {
    await chargerMeta();
  } catch (e) {
    afficherErreur('La lecture de la structure du document n\'a pas abouti.', e);
    return;
  }
  if (a.table && tablesBranchables().indexOf(a.table) === -1) {
    a.table = null; a.colEtape = null; a.colTitre = null; a.champs = {};
  }
  if (a.table) {
    var ids = function (l) { return l.map(function (c) { return c.colId; }); };
    if (a.colEtape && ids(colonnesEtapePossibles(a.table)).indexOf(a.colEtape) === -1) { a.colEtape = null; }
    if (a.colTitre && ids(colonnesTitrePossibles(a.table)).indexOf(a.colTitre) === -1) { a.colTitre = null; }
    Object.keys(a.champs).forEach(function (k) { if (!infoColonne(a.table, k)) { delete a.champs[k]; } });
  }
  if (sens > 0 && !validerBranchement(a.etape)) { return; }
  if (sens > 0 && a.etape === 1 && a.table && a.proposeesPour !== a.table) { proposerAssociations(a); }
  a.etape = sens > 0 ? a.etape + 1 : a.etape - 1;
  afficherVue('branchement');
}

function validerBranchement(n) {
  var a = etat.assistant;
  masquerErreur();
  if (n === 1 && !a.table) { signalerSaisie('Choisissez une table pour continuer.'); return false; }
  if (n === 2) {
    if (!a.colEtape) { marquerInvalide('bColEtape', 'Choisissez la colonne qui indique l\'étape.'); return false; }
    if (!a.colTitre) { marquerInvalide('bColTitre', 'Choisissez la colonne qui sert de titre.'); return false; }
    if (a.colEtape === a.colTitre) { marquerInvalide('bColTitre', 'Le titre et l\'étape doivent être deux colonnes différentes.'); return false; }
    if (!a.triCol) { a.triCol = a.colTitre; }
  }
  return true;
}

function branchementEtape4() {
  var a = etat.assistant;
  var aller = function (n) { return function () { a.etape = n; afficherVue('branchement'); }; };
  var colE = infoColonne(a.table, a.colEtape);
  var colT = infoColonne(a.table, a.colTitre);
  var choisis = autresColonnes(a).filter(function (c) { return a.champs[c.colId]; });
  var modifs = choisis.filter(function (c) { return estModifiable(c, genreDe(c)); }).map(function (c) { return c.label; });
  var lecture = choisis.filter(function (c) { return !estModifiable(c, genreDe(c)); }).map(function (c) { return c.label; });
  var ordreExistant = colonneOrdreExistante(a.table);
  var ajout = a.ordre === 'manuel' && !ordreExistant ? nomColonneOrdreLibre(a.table) : null;
  var lignesCarte = [];
  if (modifs.length) { lignesCarte.push(modifs.join(', ') + ' (modifiables)'); }
  if (lecture.length) { lignesCarte.push(lecture.join(', ') + ' (non modifiables)'); }
  if (!lignesCarte.length) { lignesCarte.push('Le titre seulement'); }
  var tri = a.ordre === 'manuel' ? 'Rangement à la main' : 'Tri automatique par ' + (a.triCol === a.colTitre ? 'titre' : (infoColonne(a.table, a.triCol) || {}).label);
  return creer('div', { classe: 'w-colonnes2' }, [
    creer('div', { classe: 'w-colonnes2__principal' }, [
      ajout ? alerte('warning', 'Votre table ' + libelleTable(a.table) + ' va être modifiée', '1 colonne ajoutée : ' + ajout + ' (nombre), pour mémoriser le rangement des cartes. Aucune donnée existante ne sera modifiée ni supprimée.')
        : alerte('info', 'Votre table ne sera pas modifiée', 'Aucune colonne ne sera ajoutée ni modifiée dans la table ' + libelleTable(a.table) + '.'),
      recap('Associations', ['Étape : ' + colE.label + ' (' + libelleType(colE).toLowerCase() + ')', 'Titre : ' + colT.label], aller(2)),
      recap('Sur les cartes', lignesCarte.concat([tri]), aller(3))
    ]),
    creer('div', { classe: 'w-colonnes2__cote' }, [panneau('Et ensuite ?', [
      creer('p', { classe: 'w-texte', texte: 'Le Kanban s\'affiche aussitôt. Toute carte déplacée met à jour la colonne ' + colE.label + ' de la ligne correspondante.' }),
      creer('p', { classe: 'w-texte', texte: 'Vous pourrez revenir sur ces choix depuis « Paramétrages ».' })])])
  ]);
}

async function executerBranchement() {
  var a = etat.assistant;
  afficherLoader('Branchement du Kanban…');
  try {
    await chargerMeta();
    var colOrdre = null;
    if (a.ordre === 'manuel') {
      colOrdre = colonneOrdreExistante(a.table);
      if (!colOrdre) { colOrdre = await ajouterColonne(a.table, nomColonneOrdreLibre(a.table), 'Numeric', null); }
    }
    var colE = infoColonne(a.table, a.colEtape);
    var cible = tableCibleRef(colE.type);
    var source = colE.type === 'Choice' ? { type: 'choice' } : (cible ? { type: 'ref', table: cible, colAffichage: colAffichageRef(colE), colOrdre: colonneOrdreExistante(cible) } : { type: 'text' });
    var champs = autresColonnes(a).filter(function (c) { return a.champs[c.colId]; }).map(function (c) { return { col: c.colId, surCarte: true }; });
    await assurerBibliotheque();
    await lireTableaux();
    memoriserTableau(preparerNouveauTableau());
    await ecrireConfig({
      mode: 'branche', nom: libelleTable(a.table), description: '', tableCartes: a.table, colTitre: a.colTitre, colEtape: a.colEtape,
      sourceEtapes: source, colOrdreCartes: colOrdre, tri: a.ordre === 'auto' ? { col: a.triCol || a.colTitre, sens: a.triSens } : null,
      champs: champs, colEcheance: a.colEcheance || null, colResponsable: a.colResponsable || null, limites: {}, compact: false,
      recherche: true, filtres: a.colResponsable ? [a.colResponsable] : [], filtreRetard: !!a.colEcheance
    });
    etat.assistant = null;
    await chargerTout();
    masquerLoader();
    afficherSucces('Votre Kanban « ' + (etat.config.nom || '') + ' » est prêt : il affiche la table ' + libelleTable(etat.config.tableCartes) + '.');
  } catch (e) {
    masquerLoader();
    afficherErreur('Le branchement du Kanban n\'a pas abouti.', e);
  }
}

   navigateur. Sur ecran etroit, le panneau s'ouvre par-dessus le Kanban. */

function voletReplie() {

function rendreTableau(zone) {
  var c = etat.config;
  var replie = voletReplie();

/* Aide "i" : un bouton qui affiche une courte explication au clic (pas au
   survol : inutilisable au clavier et au toucher, et sans effet dans le
   cadre de la plateforme). Echap ou un second clic la referme. */
function aide(id, sujet, texte, aDroite) {
  var panneau = creer('p', { classe: 'w-aide__texte' + (aDroite ? ' w-aide__texte--droite' : ''), id: id + '_aide', texte: texte });
  panneau.hidden = true;

    [creer('span', { classe: 'w-aide__rond', texte: 'i', attrs: { 'aria-hidden': 'true' } })]);
  var basculer = function (ouvrir) {
    panneau.hidden = !ouvrir;
    b.setAttribute('aria-expanded', ouvrir ? 'true' : 'false');
  };
  b.addEventListener('click', function () { basculer(panneau.hidden); });
  b.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panneau.hidden) { e.stopPropagation(); basculer(false); } });
  return { bouton: b, panneau: panneau };

/* Texte d'explication du Kanban, sous son nom. Au-dela de trois lignes
   environ, il est replie avec "Lire la suite". */
function blocExplication(texte) {
  var p = creer('p', { classe: 'w-explication', id: 'tExplication', texte: texte });
  var long = texte.length > 220 || texte.split('\n').length > 3;
  if (!long) { return p; }
  p.classList.add('w-explication--repliee');
  var b = bouton('Lire la suite', 'discret', null, function () {
    var replie = p.classList.toggle('w-explication--repliee');
    b.textContent = replie ? 'Lire la suite' : 'Réduire';
    b.setAttribute('aria-expanded', replie ? 'false' : 'true');
  }, { petit: true, id: 'tLireSuite' });
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-controls', 'tExplication');
  return creer('div', {}, [p, b]);
}

function libelleChampCol(colId) {

function redessinerColonnes() {
  detruireSortables();
  var zone = document.getElementById('tTableau');
  if (!zone) { return; }
  var defilements = {};
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) { defilements[l.getAttribute('data-cle')] = l.scrollTop; });
  var defilementX = zone.scrollLeft;
  vider(zone);
  var cles;
  if (etat.regroupement) {
    cles = groupesAffiches().map(function (g) { return g.cle; });
  } else {
    cles = etat.etapes.map(function (e) { return e.cle; });
    if (etat.cartes.some(function (x) { return x.cle === CLE_NON_CLASSE; })) { cles.push(CLE_NON_CLASSE); }
  }
  cles.forEach(function (cle) { zone.appendChild(rendreColonne(cle)); });
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) {
    brancherGlisser(l, l.getAttribute('data-cle'));
    if (defilements[l.getAttribute('data-cle')]) { l.scrollTop = defilements[l.getAttribute('data-cle')]; }
  });
  zone.scrollLeft = defilementX;
  brancherGlisserColonnes(zone);
}

function cleId(cle) { return String(cle).replace(/[^A-Za-z0-9_-]/g, '_'); }

function rendreCarte(x) {
  var c = etat.config;
  var art = creer('div', { classe: 'w-carte', attrs: { 'data-id': x.id, role: 'listitem' } });
  /* Un clic n'importe ou sur la carte ouvre sa fiche. Au clavier, c'est le

     tabulation supplementaire. Un clic qui suit de pres un glisser est
     ignore. */
