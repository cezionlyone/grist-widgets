    if (e.target.closest && e.target.closest('button, a, input, select, textarea')) { return; }
    ouvrirCarte(x, x.cle);
  });
  var titre = x.titre ? String(x.titre) : 'Sans titre';
  art.appendChild(creer('h4', { classe: 'w-carte__titre' }, [creer('button', { classe: 'w-carte__ouvrir', texte: titre,
    attrs: { 'aria-label': 'Ouvrir la carte ' + titre }, clic: function () { ouvrirCarte(x, x.cle); } })]));
  /* Un seul flux d'informations, dans l'ordre choisi aux parametrages :
     pastilles, textes et valeurs ne sont pas regroupes par nature. */
  var infos = creer('div', { classe: 'w-carte__infos' });
  var noms = c.nomsInfos !== false;
  /* Nom de l'information (petit, discret) suivi de sa valeur ; sans les
     noms, la valeur seule. Le separateur " : " reste lu par les lecteurs
     d'ecran. */
  var avecNom = function (lib, valeur) {
    if (!noms) { return [creer('span', { classe: 'fr-sr-only', texte: lib + ' : ' }), creer('span', { classe: 'w-carte__valeur', texte: valeur })]; }
    return [creer('span', { classe: 'w-carte__libelle', texte: lib }), creer('span', { classe: 'fr-sr-only', texte: ' : ' }), creer('span', { classe: 'w-carte__valeur', texte: valeur })];
  };
  var champs = c.champs.filter(function (ch) { return ch.surCarte; });
  if (c.compact) { champs = champs.filter(function (ch) { return ch.col === c.colEcheance || ch.col === c.colResponsable; }); }
  if (c.couverture && !c.compact) {
    var image = premiereImage(x.valeurs[c.couverture]);
    if (image) {
      var img = creer('img', { classe: 'w-carte__couverture', attrs: { alt: '', loading: 'lazy' } });
      art.insertBefore(img, art.firstChild);
      relayer(chargerCouverture(image, img), 'Image de couverture');
    }
  }
  if (c.couleur) {
    var vc = texteValeur(c.couleur, x.valeurs[c.couleur]);
    if (vc) { art.classList.add('w-carte--couleur'); art.classList.add('w-carte--c-' + couleurBadge(vc)); }
  }
  champs.forEach(function (ch) {
    var col = colonneCartes(ch.col);
    var g = genreDe(col, ch);
    var v = x.valeurs[ch.col];
    var t = texteValeur(ch.col, v);
    var lib = libelleChamp(ch);
    /* Information vide : visible par son nom seul quand les noms sont
       affiches, pour signaler ce qui manque ;
       masquee sinon. */
    if (!t && g !== 'oui_non') {
      if (noms) {
        infos.appendChild(creer('span', { classe: 'w-carte__info w-carte__info--vide' }, [iconeInfo(g, col), creer('span', { classe: 'w-carte__libelle', texte: lib }),
          creer('span', { classe: 'fr-sr-only', texte: ' : non renseigné' })]));
      }
      return;
    }
    if (ch.col === c.colEcheance) {
      var retard = estEnRetard(x);
      infos.appendChild(creer('span', { classe: 'w-carte__info' + (retard ? ' w-carte__retard' : '') }, [
        creer('span', { classe: (retard ? 'fr-icon-warning-line' : 'fr-icon-calendar-line') + ' fr-icon--sm w-carte__ico', attrs: { 'aria-hidden': 'true' } })]
        .concat(avecNom(retard ? 'En retard' : lib, t))));
    } else if (g === 'personne' || ch.col === c.colResponsable) {
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo('personne')].concat(avecNom(lib, t))));
    } else if (g === 'choix') {
      infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [iconeInfo(g, col), noms ? creer('span', { classe: 'w-carte__libelle', texte: lib }) : creer('span', { classe: 'fr-sr-only', texte: lib + ' : ' }),
        badge(t, couleurBadge(t))]));
    } else if (g === 'etiquettes') {
      infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [iconeInfo(g, col), noms ? creer('span', { classe: 'w-carte__libelle', texte: lib }) : creer('span', { classe: 'fr-sr-only', texte: lib + ' : ' })]
        .concat((Array.isArray(v) ? v.slice(1) : []).map(function (e) { return badge(String(e), couleurBadge(e)); }))));
    } else if (g === 'references') {
      infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [iconeInfo(g, col), noms ? creer('span', { classe: 'w-carte__libelle', texte: lib }) : creer('span', { classe: 'fr-sr-only', texte: lib + ' : ' })]
        .concat(t.split(', ').map(function (e) { return badge(e); }))));
    } else if (estValeurInvalide(g, v)) {
      infos.appendChild(creer('span', { classe: 'w-carte__info w-carte__invalide' }, [creer('span', { classe: 'fr-icon-warning-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } })].concat(avecNom(lib, t))));
    } else if (g === 'oui_non') {
      /* Oui ou non : le nom, comme les autres, puis une coche verte. */
      if (v !== true && noms) { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [creer('span', { classe: 'w-carte__libelle', texte: lib }), creer('span', { classe: 'fr-sr-only', texte: ' : non' })])); }
      if (v === true) { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [creer('span', { classe: 'w-carte__libelle', texte: lib }),
        creer('span', { classe: 'fr-icon-check-line fr-icon--sm w-carte__coche', attrs: { 'aria-hidden': 'true' } }), creer('span', { classe: 'fr-sr-only', texte: ' : oui' })])); }
    } else if (g === 'lien') {
      var lk = lienDepuisTexte(t);
      if (lk) {
        var texteLien = lk.libelle !== lk.url ? lk.libelle : lib;
        infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo(g, col), creer('a', { classe: 'fr-link fr-link--sm', texte: texteLien, attrs: { href: lk.url, target: '_blank', rel: 'noopener noreferrer', title: texteLien + ' - nouvelle fenêtre' } })]));
      } else { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo(g, col)].concat(avecNom(lib, t)))); }
    } else if (g === 'pj') {
      var nb = idsPJ(v).length;
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo('pj')]
        .concat(noms ? [creer('span', { classe: 'w-carte__libelle', texte: lib })] : [])
        .concat([creer('span', { classe: 'w-carte__valeur', texte: String(nb), attrs: { 'aria-hidden': 'true' } }), creer('span', { classe: 'fr-sr-only', texte: lib + ' : ' + t })])));
    } else if (g === 'texte_long') {
      infos.appendChild(creer('p', { classe: 'w-carte__texte' }, (noms ? [iconeInfo(g, col), creer('span', { classe: 'w-carte__libelle', texte: lib }), creer('span', { classe: 'fr-sr-only', texte: ' : ' })] : [creer('span', { classe: 'fr-sr-only', texte: lib + ' : ' })])
        .concat([t.length > 120 ? t.slice(0, 117) + '…' : t])));
    } else {
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo(g, col)].concat(avecNom(lib, t.length > 60 ? t.slice(0, 57) + '…' : t))));
    }
  });
  var echeanceAffichee = champs.some(function (ch) { return ch.col === c.colEcheance; });
  if (c.colEcheance && !echeanceAffichee && estEnRetard(x)) {
    infos.appendChild(creer('span', { classe: 'w-carte__info w-carte__retard' }, avecNom('En retard', texteValeur(c.colEcheance, x.valeurs[c.colEcheance]))));
  }
  /* La couleur ne porte jamais seule l'information : si l'information qui
     colore la carte n'y est pas affichee, sa valeur est ajoutee. */
  if (c.couleur && !champs.some(function (ch) { return ch.col === c.couleur; })) {
    var vcl = texteValeur(c.couleur, x.valeurs[c.couleur]);
    if (vcl) { infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [creer('span', { classe: noms ? 'w-carte__libelle' : 'fr-sr-only', texte: libelleChampCol(c.couleur) + (noms ? '' : ' : ') }), badge(vcl, couleurBadge(vcl))])); }
  }
  if (infos.childNodes.length) { art.appendChild(infos); }
  if (x.cle !== CLE_NON_CLASSE || etat.etapes.length) {
    var nbCom = c.historique ? nbCommentaires(x) : 0;
    var bulle = c.historique ? creer('button', { classe: 'fr-btn fr-btn--tertiary-no-outline fr-btn--sm w-carte__bulle w-infobulle',
      attrs: { 'aria-label': 'Activité et commentaires de la carte ' + titre + (nbCom ? ', ' + nbCom + ' commentaire' + (nbCom > 1 ? 's' : '') : ''), 'data-infobulle': 'Activité et commentaires' },
      clic: function () { if (Date.now() - etat.finGlisser < 400) { return; } ouvrirCarte(x, null, null, { activite: true }); } }, [
      creer('span', { classe: 'fr-icon-chat-3-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } }),
      nbCom ? creer('span', { classe: 'w-carte__nbcom', texte: String(nbCom), attrs: { 'aria-hidden': 'true' } }) : null]) : null;
    art.appendChild(creer('div', { classe: 'w-carte__pied' }, [bulle, !etat.peutModifier ? null : bouton('Déplacer', 'discret', 'drag-move-2-line', function () { if (Date.now() - etat.finGlisser < 400) { return; } ouvrirDeplacement(x); },
      { petit: true, iconeSeule: true, aria: 'Déplacer la carte ' + titre, classe: 'w-carte__deplacer w-infobulle', attrs: { 'data-infobulle': 'Déplacer cette carte' } })]));
  }
  return art;
}

/* Glisser-deposer en mode souris simulee (forceFallback) : le glisser natif
   du navigateur ne demarre pas depuis un bouton, or le titre de la carte en
   est un, et il se comporte de facon inegale dans un cadre integre. La
   tolerance de 4 px distingue un clic d'un debut de glisser. */
function brancherGlisser(listeCartes, cle) {
  if (!etat.peutModifier) { return; }
  if (typeof Sortable === 'undefined') {
    if (!etat.sortableAbsent) {
      etat.sortableAbsent = true;
      logSecurite('AVERTISSEMENT', 'Bibliothèque de glisser-déposer non chargée : seul le bouton Déplacer est disponible');
    }
    return;
  }
  var c = etat.config;
  var s = Sortable.create(listeCartes, {
    group: { name: 'kanban', put: cle !== CLE_NON_CLASSE },
    sort: !etat.regroupement && !triVue() && !!c.colOrdreCartes && cle !== CLE_NON_CLASSE,
    animation: 150,
    forceFallback: true,
    fallbackOnBody: true,
    fallbackTolerance: 4,
    /* Au doigt, le glisser demande un appui de 300 ms : un simple balayage
       fait defiler la page. A la souris, le glisser est immediat. */
    delay: 300,
    delayOnTouchOnly: true,
    touchStartThreshold: 5,
    draggable: '.w-carte',
    filter: 'a',
    preventOnFilter: false,
    onStart: function () {
      etat.glisserEnCours = true;
      var t = document.getElementById('tTableau');
      if (t) { t.classList.add('w-glisser-en-cours'); }
    },
    onEnd: function (evt) {
      etat.glisserEnCours = false;
      etat.finGlisser = Date.now();
      var tt = document.getElementById('tTableau');
      if (tt) { tt.classList.remove('w-glisser-en-cours'); }
      var id = parseInt(evt.item.getAttribute('data-id'), 10);
      var dest = evt.to.getAttribute('data-cle');
      if (evt.from === evt.to && evt.oldIndex === evt.newIndex) {
        if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
        return;
      }
      if (etat.regroupement) {
        if (evt.from === evt.to) { redessinerColonnes(); return; }
        relayer(ecrireGroupe(id, dest, true), 'Changement de valeur par glisser-déposer');
        return;
      }
      relayer(deplacerCarte(id, dest, triVue() ? 1e9 : evt.newIndex, true), 'Déplacement par glisser-déposer');
    }
  });
  etat.sortables.push(s);
}

/* Colonnes reordonnables directement sur le Kanban : vue par etape, source
   liste de choix ou table avec colonne ORDRE. Alternative au clavier : les
   fleches de l'etape 2 des parametrages. */
function colonnesOrdonnablesSurKanban() {
  var c = etat.config;
  /* Reordonner les colonnes modifie le parametrage : reserve aux personnes
     qui peuvent parametrer. */
  if (!c || etat.regroupement || !etat.peutParametrer) { return false; }
  var src = c.sourceEtapes;
  return src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colOrdre);
}

function brancherGlisserColonnes(zone) {
  if (typeof Sortable === 'undefined' || !colonnesOrdonnablesSurKanban()) { return; }
  etat.sortables.push(Sortable.create(zone, {
    group: 'colonnes', handle: '.w-colonne__poignee', draggable: '.w-colonne:not(.w-colonne--nonclasse)',
    animation: 150, forceFallback: true, fallbackOnBody: true, direction: 'horizontal',
    onStart: function () { etat.glisserEnCours = true; },
    onEnd: function (evt) {
      etat.glisserEnCours = false;
      etat.finGlisser = Date.now();
      if (evt.oldIndex === evt.newIndex) { return; }
      var cles = Array.prototype.map.call(zone.querySelectorAll('.w-colonne:not(.w-colonne--nonclasse)'), function (sec) { return sec.getAttribute('data-cle'); });
      relayer(ecrireOrdreColonnes(cles, evt.item.getAttribute('data-cle')), 'Réordonnancement des colonnes');
    }
  }));
}

async function ecrireOrdreColonnes(cles, cleDeplacee) {
  var c = etat.config;
  var src = c.sourceEtapes;
  try {
    if (src.type === 'liste') {
      src.valeurs = cles.slice();
      await ecrireConfig(c);
    } else if (src.type === 'choice') {
      var col = colonneCartes(c.colEtape);
      var opts = JSON.parse(JSON.stringify(col.options || {}));
      var reste = choixDe(col).filter(function (v) { return cles.indexOf(v) === -1; });
      opts.choices = cles.concat(reste);
      await agir([['UpdateRecord', '_grist_Tables_column', col.ref, { widgetOptions: JSON.stringify(opts) }]]);
    } else {
      var maj = {};
      maj[src.colOrdre] = cles.map(function (_, i) { return (i + 1) * ORDRE_PAS; });
      await agir([['BulkUpdateRecord', src.table, cles.map(function (k) { return parseInt(k, 10); }), maj]]);
    }
    await chargerMeta();
    verifierConfig();
    await chargerDonnees();
    redessinerColonnes();
    annoncer('Colonne ' + libelleEtape(cleDeplacee) + ' déplacée en position ' + (cles.indexOf(cleDeplacee) + 1) + ' sur ' + cles.length + '.');
  } catch (e) {
    afficherErreur('Le déplacement de la colonne n\'a pas abouti.', e);
    redessinerColonnes();
  }
}

function carteParId(id) {
  for (var i = 0; i < etat.cartes.length; i++) { if (etat.cartes[i].id === id) { return etat.cartes[i]; } }
  return null;
}

/* Deplacement d'une carte : l'etape change, et si le rangement est manuel la
   colonne de destination est renumerotee en entier (pas de 10), ce qui evite
   les ordres egaux ou vides. Seules les lignes dont l'ordre change sont
   ecrites. L'index porte sur les cartes visibles : il est converti en rang
   parmi toutes les cartes de la colonne. */
async function deplacerCarte(id, cleDest, indexVisible, parGlisser) {
  var c = etat.config;
  var carte = carteParId(id);
  if (!carte || !cleDest || cleDest === CLE_NON_CLASSE) { redessinerColonnes(); return; }
  var ids = [];
  var maj = {};
  var etapeChange = carte.cle !== cleDest;
  if (c.colOrdreCartes) {
    /* L'ordre est relu juste avant d'ecrire : un collegue a pu deplacer une
       carte de la meme colonne depuis le dernier rafraichissement, et l'ordre
       local l'aurait ecrase. */
    try {
      var frais = await lireTable(c.tableCartes);
      for (var fi = 0; fi < frais.id.length; fi++) {
        var xf = carteParId(frais.id[fi]);
        if (xf) { xf.ordre = colonneDe(frais, c.colOrdreCartes, fi); }
      }
    } catch (eOrd) { logSecurite('AVERTISSEMENT', 'Ordre des cartes non relu avant déplacement', eOrd); }
    var toutes = cartesDeEtape(cleDest).filter(function (x) { return x.id !== id; });
    var visibles = toutes.filter(correspondFiltres);
    var rang = toutes.length;
    if (indexVisible < visibles.length) { rang = toutes.indexOf(visibles[indexVisible]); }
    toutes.splice(rang, 0, carte);
    toutes.forEach(function (x, i) {
      var o = (i + 1) * ORDRE_PAS;
      if (x.ordre !== o || (x.id === id && etapeChange)) { ids.push(x.id); maj[x.id] = o; }
    });
  }
  if (!ids.length && !etapeChange) { redessinerColonnes(); return; }
  var actions = [];
  if (etapeChange) {
    var champEtape = {};
    champEtape[c.colEtape] = valeurEtapePourCle(cleDest);
    actions.push(['UpdateRecord', c.tableCartes, id, champEtape]);
  }
  if (c.colOrdreCartes && ids.length) {
    var champsOrdre = {};
    champsOrdre[c.colOrdreCartes] = ids.map(function (i) { return maj[i]; });
    actions.push(['BulkUpdateRecord', c.tableCartes, ids, champsOrdre]);
  }
  try {
    await agir(actions);
    ids.forEach(function (i) { var x = carteParId(i); if (c.colOrdreCartes) { x.ordre = maj[i]; } });
    if (etapeChange) { carte.cle = cleDest; carte.brut = valeurEtapePourCle(cleDest); }
    var pos = cartesDeEtape(cleDest).indexOf(carte) + 1;
    var total = cartesDeEtape(cleDest).length;
    annoncer('La carte ' + (carte.titre || 'sans titre') + ' a été déplacée dans ' + libelleEtape(cleDest) + ', position ' + pos + ' sur ' + total + '.');
    redessinerColonnes();
    if (!parGlisser) {
      var b = document.querySelector('.w-carte[data-id="' + id + '"] .w-carte__deplacer');
      if (b) { b.focus(); }
    }
  } catch (e) {
    afficherErreur('Le déplacement de la carte n\'a pas abouti.', e);
    redessinerColonnes();
  }
  if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
}

function ouvrirDeplacement(x) {
  if (etat.regroupement) { ouvrirDeplacementGroupe(x); return; }
  var c = etat.config;
  var titre = x.titre || 'Sans titre';
  var choix = { cle: x.cle === CLE_NON_CLASSE ? etat.etapes[0].cle : x.cle, pos: 0 };
  var fs = creer('fieldset', { classe: 'fr-fieldset' }, [creer('legend', { classe: 'fr-fieldset__legend', texte: 'Vers quelle colonne ?' })]);
  var selPos = creer('select', { classe: 'fr-select', id: 'dPos' });
  var majPositions = function () {
    vider(selPos);
    var autres = cartesDeEtape(choix.cle).filter(function (y) { return y.id !== x.id && correspondFiltres(y); });
    for (var i = 0; i <= autres.length; i++) {
      var lib = i === 0 ? 'En haut de la colonne' : (i === autres.length ? 'En bas de la colonne' : 'Après « ' + (autres[i - 1].titre || 'Sans titre') + ' »');
      var o = creer('option', { texte: lib, attrs: { value: i } });
      selPos.appendChild(o);
    }
    var actuelle = cartesDeEtape(choix.cle).filter(correspondFiltres).indexOf(x);
    selPos.value = String(choix.cle === x.cle && actuelle >= 0 ? actuelle : autres.length);
  };
  etat.etapes.forEach(function (e, i) {
    var n = cartesDeEtape(e.cle).length;
    var r = creer('input', { attrs: { type: 'radio', name: 'dDest', id: 'dDest' + i }, coche: e.cle === choix.cle });
    r.addEventListener('change', function () { choix.cle = e.cle; majPositions(); });
    var lab = creer('label', { classe: 'fr-label', attrs: { 'for': 'dDest' + i } }, [e.libelle,
      creer('span', { classe: 'fr-hint-text', texte: n + ' carte' + (n > 1 ? 's' : '') + (e.cle === x.cle ? ', colonne actuelle' : '') })]);
    fs.appendChild(creer('div', { classe: 'fr-fieldset__element' }, [creer('div', { classe: 'fr-radio-group' }, [r, lab])]));
  });
  majPositions();
  var corps = [fs];
  if (c.colOrdreCartes) { corps.push(groupeChamp('Position dans la colonne', selPos)); }
  else { corps.push(creer('p', { classe: 'w-mention', texte: 'Les cartes de ce Kanban sont triées automatiquement : seule la colonne peut être choisie.' })); }
  corps.push(creer('p', { classe: 'w-mention', texte: 'Vous pouvez aussi faire glisser la carte avec la souris.' }));
  ouvrirModale({ titre: 'Déplacer la carte', sousTitre: titre, etroite: true, corps: corps,
    focus: 'dDest' + Math.max(0, etat.etapes.map(function (e) { return e.cle; }).indexOf(choix.cle)),
    pied: [creer('span', { classe: 'w-pousse' }), bouton('Annuler', 'secondaire', null, fermerModale),
      bouton('Déplacer', null, 'check-line', function () {
        var pos = c.colOrdreCartes ? parseInt(selPos.value, 10) || 0 : 0;
        fermerModale();
        return deplacerCarte(x.id, choix.cle, pos, false);
      })] });
}

/* Deplacement au clavier en mode regroupe : choisir la nouvelle valeur. */
function ouvrirDeplacementGroupe(x) {
  var titre = x.titre || 'Sans titre';
  var actuel = cleGroupe(x);
  var choix = { cle: actuel };
  var nomInfo = libelleChampCol(etat.regroupement);
  var fs = creer('fieldset', { classe: 'fr-fieldset' }, [creer('legend', { classe: 'fr-fieldset__legend', texte: nomInfo + ' : vers quelle colonne ?' })]);
  groupesAffiches().forEach(function (g, i) {
    var r = creer('input', { attrs: { type: 'radio', name: 'dDest', id: 'dDest' + i }, coche: g.cle === actuel });
    r.addEventListener('change', function () { choix.cle = g.cle; });
    fs.appendChild(creer('div', { classe: 'fr-fieldset__element' }, [creer('div', { classe: 'fr-radio-group' }, [r,
      creer('label', { classe: 'fr-label', attrs: { 'for': 'dDest' + i } }, [g.libelle, g.cle === actuel ? creer('span', { classe: 'fr-hint-text', texte: 'colonne actuelle' }) : null])])]));
  });
  var idx = groupesAffiches().map(function (g) { return g.cle; }).indexOf(actuel);
  ouvrirModale({ titre: 'Déplacer la carte', sousTitre: titre, etroite: true,
    corps: [fs, creer('p', { classe: 'w-mention', texte: 'Le Kanban est regroupé par ' + nomInfo + ' : déplacer la carte change cette information.' })],
    focus: 'dDest' + Math.max(0, idx),
    pied: [creer('span', { classe: 'w-pousse' }), bouton('Annuler', 'secondaire', null, fermerModale),
      bouton('Déplacer', null, 'check-line', function () {
        fermerModale();
        if (choix.cle === actuel) { return; }
        return ecrireGroupe(x.id, choix.cle, false);
      })] });
}

/* === SECTION : PIECES JOINTES ===
   Mecanisme eprouve sur l'instance :
   jeton d'acces en ecriture (un jeton en lecture seule est refuse pour les
   fichiers, meme en consultation), envoi en multipart avec l'en-tete
   X-Requested-With (sans lui, la protection anti-CSRF du serveur repond 403),
   sans Content-Type pose a la main (le navigateur calcule la frontiere).
   L'envoi ne rattache rien : les identifiants recus sont ecrits ensuite dans
   la cellule, au format ['L', id1, id2]. Retirer un fichier retire sa
   reference ; le fichier reste dans le stockage du document.
   Les noms et tailles viennent de la table _grist_Attachments, lue par l'API
   du widget. Les fichiers sont recuperes en Blob : le jeton n'apparait jamais
   dans un lien de la page. */
/* Image de couverture : premiere piece jointe dont l'extension est une
   image matricielle. Les fichiers sont recuperes en Blob une seule fois par
   session ; le jeton n'apparait jamais dans la page. */
/* Icone d'une information sur la carte, selon son type. Uniquement des
   icones du DSFR. Decorative : le nom de l'information reste lu. */
function iconeInfo(g, col) {
  var nom = { date: 'calendar-line', dateheure: 'time-line', personne: 'user-line', texte: 'file-text-line', texte_long: 'file-text-line',
    lien: 'links-line', pj: 'attachment-line', reference: 'folder-2-line', references: 'folder-2-line', choix: 'list-unordered', etiquettes: 'list-unordered',
    nombre: (col && col.options && col.options.numMode === 'currency') ? 'money-euro-circle-line' : 'hashtag' }[g];
  return nom ? creer('span', { classe: 'fr-icon-' + nom + ' fr-icon--sm w-carte__ico', attrs: { 'aria-hidden': 'true' } }) : null;
}

function premiereImage(v) {
  var ids = idsPJ(v);
  for (var i = 0; i < ids.length; i++) {
    var m = etat.pjMeta[ids[i]];
    if (m && PJ_IMAGES.indexOf(extensionDe(m.nom)) !== -1) { return ids[i]; }
  }
  return null;
}

async function chargerCouverture(id, img) {
  etat.couvertures = etat.couvertures || {};
  if (!etat.couvertures[id]) {
    etat.couvertures[id] = recupererPJ(id).then(function (blob) {
      var ext = extensionDe(etat.pjMeta[id].nom);
      return URL.createObjectURL(new Blob([blob], { type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext) }));
    });
  }
  try {
    img.src = await etat.couvertures[id];
  } catch (e) {
    delete etat.couvertures[id];
    if (img.parentNode) { img.parentNode.removeChild(img); }
    logSecurite('AVERTISSEMENT', 'Image de couverture non chargée', e);
  }
}

function idsPJ(v) {
  return Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(function (x) { return typeof x === 'number'; }) : [];
}

async function chargerMetaPJ() {
  try {
    var d = await lireTable('_grist_Attachments');
    var m = {};
    for (var i = 0; i < d.id.length; i++) { m[d.id[i]] = { nom: colonneDe(d, 'fileName', i) || ('Fichier ' + d.id[i]), taille: colonneDe(d, 'fileSize', i) || 0 }; }
    etat.pjMeta = m;
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Noms des pièces jointes illisibles', e);
  }
}

async function obtenirJeton() {
  var j = etat.jeton;
  if (j && Date.now() < j.expire) { return j; }
  var r = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: false }), 15000);
  etat.jeton = { token: r.token, baseUrl: r.baseUrl, expire: Date.now() + Math.max(0, (r.ttlMsecs || 60000) - 30000) };
  return etat.jeton;
}

async function fetchDelai(url, options, delaiMs) {
  var ctrl = new AbortController();
  var minut = setTimeout(function () { ctrl.abort(); }, delaiMs);
  try {
    options.signal = ctrl.signal;
    return await fetch(url, options);
  } finally {
    clearTimeout(minut);
  }
}

function extensionDe(nom) {
  var m = /\.([A-Za-z0-9]+)$/.exec(String(nom || ''));
  return m ? m[1].toLowerCase() : '';
}

function formaterTaille(octets) {
  if (!octets) { return ''; }
  if (octets < 1024) { return octets + ' o'; }
  if (octets < 1024 * 1024) { return Math.round(octets / 1024) + ' ko'; }
  return (octets / (1024 * 1024)).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' Mo';
}

function iconePJ(nom) {
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) !== -1) { return 'fr-icon-image-line'; }
  if (ext === 'pdf') { return 'fr-icon-file-pdf-line'; }
  return 'fr-icon-file-line';
}

async function recupererPJ(id) {
  var j = await obtenirJeton();
  var rep = await fetchDelai(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token), {}, DELAI_API_MS);
  if (!rep.ok) { throw new Error('Réponse ' + rep.status); }
  return rep.blob();
}

async function telechargerPJ(id) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'fichier';
  afficherLoader('Téléchargement…');
  try {
    var blob = await recupererPJ(id);
    var url = URL.createObjectURL(blob);
    var a = creer('a', { attrs: { href: url, download: nom } });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    masquerLoader();
  } catch (e) {
    masquerLoader();
    afficherErreur('Le téléchargement du fichier n\'a pas abouti.', e);
  }
}

var _visionneuse = { url: null, retour: null, pieger: null, id: null, pdf: null, tour: 0, plein: false };

/* pdf.js : les PDF sont dessines par le widget, le lecteur integre du
   navigateur n'etant pas utilisable partout dans le cadre d'un widget
   (Firefox telecharge le fichier au lieu de l'afficher). Version legacy,
   epinglee ; chaque fichier n'est execute qu'apres verification de son
   empreinte SHA-256, l'equivalent de l'attribut integrity pour un module
   charge par le script. */
var PDFJS = {
  version: '6.2.108',
  base: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/',
  lib: { fichier: 'pdf.min.mjs', empreinte: 'n6sMkQvxSEg1xcKuto9+s9/Of560NaAEUmxa+G1wiQw=' },
  worker: { fichier: 'pdf.worker.min.mjs', empreinte: 'vA0biOoLZhlrHTalisJDxtkq3+clYk4qn904G9+O9DQ=' }
};
var _pdfjsChargement = null;

async function moduleVerifie(ressource) {
  var rep = await fetchDelai(PDFJS.base + ressource.fichier, { credentials: 'omit' }, DELAI_API_MS);
  if (!rep.ok) { throw new Error('Réponse ' + rep.status + ' pour ' + ressource.fichier); }
  var octets = await rep.arrayBuffer();
  var hache = new Uint8Array(await crypto.subtle.digest('SHA-256', octets));
  var b64 = btoa(String.fromCharCode.apply(null, Array.prototype.slice.call(hache)));
  if (b64 !== ressource.empreinte) { throw new Error('Empreinte non conforme pour ' + ressource.fichier); }
  return URL.createObjectURL(new Blob([octets], { type: 'text/javascript' }));
}

function chargerPdfJs() {
  if (!_pdfjsChargement) {
    _pdfjsChargement = Promise.all([moduleVerifie(PDFJS.lib), moduleVerifie(PDFJS.worker)]).then(function (urls) {
      return import(urls[0]).then(function (lib) {
        lib.GlobalWorkerOptions.workerSrc = urls[1];
        return lib;
      });
    }).catch(function (e) {
      _pdfjsChargement = null;
      throw e;
    });
  }
  return _pdfjsChargement;
}

/* Dessine toutes les pages a la largeur de la visionneuse. Un nouveau dessin
   (plein ecran) interrompt le precedent. */
async function dessinerPDF() {
  var doc = _visionneuse.pdf;
  var zone = document.getElementById('wVisionneuseContenu');
  if (!doc || !zone) { return; }
  var tour = ++_visionneuse.tour;
  vider(zone);
  zone.classList.add('w-visionneuse__contenu--pdf');
  var pages = creer('div', { classe: 'w-pdf__pages' });
  zone.appendChild(pages);
  var largeur = Math.max(200, Math.min(zone.clientWidth - 48, 1400));
  var ratio = window.devicePixelRatio || 1;
  for (var n = 1; n <= doc.numPages; n++) {
    if (_visionneuse.pdf !== doc || _visionneuse.tour !== tour) { return; }
    var page = await doc.getPage(n);
    var base = page.getViewport({ scale: 1 });
    var vue = page.getViewport({ scale: (largeur / base.width) * ratio });
    var canvas = creer('canvas', { classe: 'w-pdf__page', attrs: { role: 'img', 'aria-label': 'Page ' + n + ' sur ' + doc.numPages } });
    canvas.width = Math.floor(vue.width);
    canvas.height = Math.floor(vue.height);
    canvas.style.width = Math.floor(vue.width / ratio) + 'px';
    canvas.style.height = Math.floor(vue.height / ratio) + 'px';
    if (_visionneuse.pdf !== doc || _visionneuse.tour !== tour) { return; }
    pages.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vue }).promise;
  }
}

function appliquerPleinEcranVisionneuse() {
  var boite = document.querySelector('#wVisionneuse .w-dialogue--visionneuse');
  if (boite) { boite.classList.toggle('w-dialogue--plein', _visionneuse.plein); }
  var b = document.getElementById('wVisionneusePlein');
  if (b) {
    b.textContent = _visionneuse.plein ? 'Réduire' : 'Plein écran';
    b.classList.toggle('fr-icon-zoom-in-line', !_visionneuse.plein);
    b.classList.toggle('fr-icon-zoom-out-line', _visionneuse.plein);
    b.setAttribute('aria-pressed', _visionneuse.plein ? 'true' : 'false');
  }
}

function basculerPleinEcranVisionneuse() {
  _visionneuse.plein = !_visionneuse.plein;
  appliquerPleinEcranVisionneuse();
  if (_visionneuse.pdf) { relayer(dessinerPDF(), 'Nouveau dessin du PDF'); }
}

async function consulterPJ(id) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'Fichier';
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) === -1 && ext !== 'pdf') { return telechargerPJ(id); }
  var ov = document.getElementById('wVisionneuse');
  var zone = document.getElementById('wVisionneuseContenu');
  document.getElementById('wVisionneuseTitre').textContent = nom;
  _visionneuse.plein = false;
  appliquerPleinEcranVisionneuse();
  zone.classList.remove('w-visionneuse__contenu--pdf');
  vider(zone);
  zone.appendChild(creer('p', { classe: 'w-texte', texte: 'Chargement du fichier…' }));
  _visionneuse.retour = document.activeElement;
  _visionneuse.id = id;
  ov.classList.add('actif');
  void ov.offsetHeight;
  _visionneuse.pieger = fabriquerPiege(ov, fermerVisionneuse);
  ov.addEventListener('keydown', _visionneuse.pieger);
  document.getElementById('wVisionneuseFermer').focus();
  try {
    var blob = await recupererPJ(id);
    if (_visionneuse.id !== id) { return; }
    /* Le type du Blob est impose d'apres l'extension verifiee, quel que soit
       celui annonce par le serveur. */
    var type = ext === 'pdf' ? 'application/pdf' : 'image/' + (ext === 'jpg' ? 'jpeg' : ext);
    _visionneuse.url = URL.createObjectURL(new Blob([blob], { type: type }));
    vider(zone);
    if (ext === 'pdf') {
      zone.appendChild(creer('p', { classe: 'w-texte', texte: 'Préparation de l\'aperçu…' }));
      var lib = await chargerPdfJs();
      var doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false, enableXfa: false }).promise;
      if (_visionneuse.id !== id) { doc.destroy(); return; }
      _visionneuse.pdf = doc;
      await dessinerPDF();
    } else {
      zone.appendChild(creer('img', { attrs: { src: _visionneuse.url, alt: nom } }));
    }
  } catch (e) {
    if (_visionneuse.id !== id) { return; }
    zone.classList.remove('w-visionneuse__contenu--pdf');
    vider(zone);
    zone.appendChild(creer('p', { classe: 'w-texte', texte: 'L\'aperçu n\'a pas pu être affiché. Vous pouvez télécharger le fichier.' }));
    logSecurite('ERREUR', 'Aperçu de pièce jointe', e);
  }
}

function fermerVisionneuse() {
  var ov = document.getElementById('wVisionneuse');
  if (!ov.classList.contains('actif')) { return; }
  ov.classList.remove('actif');
  if (_visionneuse.pieger) { ov.removeEventListener('keydown', _visionneuse.pieger); _visionneuse.pieger = null; }
  vider(document.getElementById('wVisionneuseContenu'));
  if (_visionneuse.url) { URL.revokeObjectURL(_visionneuse.url); _visionneuse.url = null; }
  if (_visionneuse.pdf) { try { _visionneuse.pdf.destroy(); } catch (e) { /* deja detruit */ } _visionneuse.pdf = null; }
  _visionneuse.plein = false;
  appliquerPleinEcranVisionneuse();
  document.getElementById('wVisionneuseContenu').classList.remove('w-visionneuse__contenu--pdf');
  _visionneuse.id = null;
  var r = _visionneuse.retour;
  _visionneuse.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
}

function validerFichierPJ(f) {
  if (!f.size) { return 'Le fichier « ' + f.name + ' » est vide.'; }
  if (f.size > PJ_TAILLE_MAX) { return 'Le fichier « ' + f.name + ' » dépasse 20 Mo.'; }
  var ext = extensionDe(f.name);
  if (PJ_EXTENSIONS_INTERDITES.indexOf(ext) !== -1) { return 'Les fichiers .' + ext + ' ne sont pas acceptés.'; }
  return null;
}

var _envoiPJ = false;

async function envoyerPJ(carte, colId, fichiers, idChamp, redessiner) {
  if (_envoiPJ) { signalerSaisie('Un envoi est déjà en cours.'); return; }
  for (var k = 0; k < fichiers.length; k++) {
    var err = validerFichierPJ(fichiers[k]);
    if (err) { marquerInvalide(idChamp, err); return; }
  }
  var c = etat.config;
  _envoiPJ = true;
  try {
    var j = await obtenirJeton();
    var nouveaux = [];
    for (var i = 0; i < fichiers.length; i++) {
      afficherLoader(fichiers.length > 1 ? 'Envoi du fichier ' + (i + 1) + ' sur ' + fichiers.length + '…' : 'Envoi du fichier…');
      var fd = new FormData();
      fd.append('upload', fichiers[i], fichiers[i].name);
      var rep = await fetchDelai(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token),
        { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' }, body: fd }, DELAI_ENVOI_MS);
      if (!rep.ok) { throw new Error('Réponse ' + rep.status); }
      var ids = await rep.json();
      if (!Array.isArray(ids) || !ids.length) { throw new Error('Réponse inattendue à l\'envoi'); }
      nouveaux = nouveaux.concat(ids);
    }
    var maj = {};
    maj[colId] = ['L'].concat(idsPJ(carte.valeurs[colId]).concat(nouveaux));
    await agir([['UpdateRecord', c.tableCartes, carte.id, maj]]);
    carte.valeurs[colId] = maj[colId];
    await chargerMetaPJ();
    masquerLoader();
    redessiner();
    redessinerColonnes();
    annoncer(nouveaux.length > 1 ? nouveaux.length + ' fichiers ajoutés.' : 'Fichier ajouté.');
  } catch (e) {
    masquerLoader();
    afficherErreur('L\'envoi du fichier n\'a pas abouti.', e);
  } finally {
    _envoiPJ = false;
  }
}

async function retirerPJ(carte, colId, id, redessiner) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'ce fichier';
  var ok = await confirmerAction('Retirer « ' + nom + ' » de la carte ?', 'Le fichier ne sera plus rattaché à cette carte. Il reste conservé dans le document.', 'Retirer');
  if (!ok) { return; }
  var reste = idsPJ(carte.valeurs[colId]).filter(function (x) { return x !== id; });
  var maj = {};
  maj[colId] = reste.length ? ['L'].concat(reste) : null;
  afficherLoader('Mise à jour…');
  try {
    await agir([['UpdateRecord', etat.config.tableCartes, carte.id, maj]]);
    carte.valeurs[colId] = maj[colId];
    masquerLoader();
    redessiner();
    redessinerColonnes();
    annoncer('Fichier ' + nom + ' retiré de la carte.');
  } catch (e) {
    masquerLoader();
    afficherErreur('Le retrait du fichier n\'a pas abouti.', e);
  }
}

/* Editeur de la fiche : liste des fichiers (consulter, telecharger,
   retirer) et ajout. Les ecritures sont immediates, hors de
   l'enregistrement automatique des autres champs. */
function editeurPiecesJointes(ch, carte, idx, modifiable) {
  var lib = libelleChamp(ch);
  var id = 'fc_' + idx;
  var bloc = creer('div', { classe: 'fr-input-group', id: id + '_bloc' }, [creer('p', { classe: 'fr-label fr-mb-1v', texte: lib })]);
  if (!carte) {
    bloc.appendChild(creer('p', { classe: 'fr-hint-text', texte: 'Ajoutez d\'abord la carte : vous pourrez ensuite y joindre des fichiers.' }));
    return { noeud: bloc, lire: null };
  }
  var ul = creer('ul', { classe: 'w-pj__liste', attrs: { 'aria-label': 'Fichiers : ' + lib } });
  var dessiner = function () {
    vider(ul);
    var ids = idsPJ(carte.valeurs[ch.col]);
    if (!ids.length) { ul.appendChild(creer('li', { classe: 'w-mention', texte: 'Aucun fichier.' })); }
    ids.forEach(function (fid) {
      var meta = etat.pjMeta[fid] || { nom: 'Fichier ' + fid, taille: 0 };
      var apercu = PJ_IMAGES.indexOf(extensionDe(meta.nom)) !== -1 || extensionDe(meta.nom) === 'pdf';
      ul.appendChild(creer('li', { classe: 'w-pj__fichier' }, [
        creer('span', { classe: iconePJ(meta.nom), attrs: { 'aria-hidden': 'true' } }),
        creer('span', { classe: 'w-pj__nom', texte: meta.nom }),
        creer('span', { classe: 'w-pj__taille', texte: formaterTaille(meta.taille) }),
        apercu ? bouton('Consulter', 'discret', 'eye-line', function () { return consulterPJ(fid); }, { petit: true, aria: 'Consulter ' + meta.nom }) : null,
        bouton('Télécharger', 'discret', 'download-line', function () { return telechargerPJ(fid); }, { petit: true, iconeSeule: true, aria: 'Télécharger ' + meta.nom }),
        modifiable ? bouton('Retirer', 'discret', 'delete-line', function () { return retirerPJ(carte, ch.col, fid, dessiner); }, { petit: true, iconeSeule: true, aria: 'Retirer ' + meta.nom }) : null
      ]));
    });
  };
  dessiner();
  bloc.appendChild(ul);
  if (modifiable) {
    var champ = creer('input', { classe: 'fr-upload', id: id + '_upload', attrs: { type: 'file', multiple: true } });
    champ.addEventListener('change', function () {
      var fichiers = Array.prototype.slice.call(champ.files || []);
      champ.value = '';
      if (fichiers.length) { relayer(envoyerPJ(carte, ch.col, fichiers, id + '_upload', dessiner), 'Envoi de pièces jointes'); }
    });
    bloc.appendChild(creer('div', { classe: 'fr-upload-group fr-mt-1w' }, [
      creer('label', { classe: 'fr-label', attrs: { 'for': id + '_upload' } }, ['Ajouter des fichiers',
        creer('span', { classe: 'fr-hint-text', texte: '20 Mo au plus par fichier. Plusieurs fichiers peuvent être choisis à la fois.' })]),
      champ]));
  } else {
    bloc.appendChild(creer('p', { classe: 'fr-hint-text', texte: 'Non modifiable' }));
  }
  return { noeud: bloc, lire: null };
}

/* === SECTION : FICHE CARTE === */
/* Liste sans valeur dans la fiche : l'agent apprend ou elle se remplit. Un
   proprietaire y va d'un clic ; les autres savent a qui s'adresser. */
function aideListeVide(ch, g, idAide, nouvelle) {
  var quoi = g === 'personne' ? 'Aucune personne proposée' : (g === 'etiquettes' ? 'Aucune étiquette proposée' : 'Aucune valeur proposée');
  var texte = etat.peutParametrer
    ? quoi + ' pour l\'instant. La liste se remplit dans les paramétrages du Kanban, étape « Les informations ».'
    : quoi + ' pour l\'instant. Seul un propriétaire du document peut en ajouter, dans les paramétrages du Kanban.';
  var p = creer('p', { classe: 'fr-hint-text fr-mt-1v', id: idAide, texte: texte });
  if (!etat.peutParametrer) { return creer('div', {}, [p]); }
  return creer('div', {}, [p, bouton('Ajouter des valeurs', 'secondaire', 'add-line', function () { return ajouterValeursDepuisFiche(ch.col, nouvelle); },
    { petit: true, classe: 'fr-mt-1v', aria: 'Ajouter des valeurs à « ' + libelleChamp(ch) + ' »' })]);
}

/* Ouvre les parametrages a l'etape "Les informations", l'information
   concernee depliee. Une carte deja creee est enregistree a la fermeture de
   sa fiche ; une nouvelle carte pas encore ajoutee est abandonnee apres
   confirmation. */
async function ajouterValeursDepuisFiche(colId, nouvelle) {
  if (!etat.peutParametrer) { return; }
  if (nouvelle) {
    var ok = await confirmerAction('Quitter la nouvelle carte ?', 'La carte n\'est pas encore ajoutée : ce que vous avez saisi ne sera pas conservé. Les paramétrages s\'ouvrent à l\'étape « Les informations ».', 'Ouvrir les paramétrages');
    if (!ok) { return; }
  }
  fermerModale();
  etat.brouillon = brouillonDepuisConfig();
  var b = etat.brouillon;
  var rang = -1;
  b.infos.forEach(function (x, k) { if (x.col === colId) { rang = k; } });
  if (rang !== -1) { b.infos[rang].ouverte = true; }
  b.etape = 3;
  afficherVue('assistant', true);
  var f = rang !== -1 ? (document.getElementById('kVal' + rang) || document.getElementById('kInfoNom' + rang)) : null;
  if (!f) { f = document.getElementById('titreVue'); }
  if (f) { f.focus(); }

/* Fiche de la carte, en panneau lateral. Une carte existante s'enregistre

  var c = etat.config;
  if (e.type === 'debut') { return c.mode === 'creation' ? 'a créé la carte' : 'début du suivi de la carte'; }
  if (e.type === 'commentaire') { return null; }
  var de = e.de || 'vide';
  var a = e.a || 'vide';
  if (e.champ === c.colEtape) { return 'a déplacé la carte de « ' + de + ' » vers « ' + a + ' »'; }
  if (e.champ === c.colTitre) { return 'a renommé la carte : « ' + de + ' » devient « ' + a + ' »'; }
  return 'a modifié ' + (colonneCartes(e.champ) ? libelleChampCol(e.champ) : e.champ) + ' : ' + de + ' → ' + a;
}

  return 'le ' + deux(d.getDate()) + '/' + deux(d.getMonth() + 1) + '/' + d.getFullYear() + ' à ' + deux(d.getHours()) + ' h ' + deux(d.getMinutes());

    selPos.disabled = !autres.length || !etat.peutModifier;
  };
  if (!nouvelle && c.colOrdreCartes && carte.cle !== CLE_NON_CLASSE) {
    selPos = creer('select', { classe: 'fr-select', id: 'fcPos' });
    majPositions();
  }
  var grille = creer('div', { classe: 'w-colonnes2' }, [
    creer('div', { classe: 'w-colonnes2__principal' }, [groupeChamp('Titre de la carte', inTitre, titreModifiable ? null : 'Non modifiable : calculé automatiquement dans votre table', titreModifiable)]),
    creer('div', { classe: 'w-colonnes2__cote' }, [groupeChamp('Colonne', selEtape), selPos ? groupeChamp('Position dans la colonne', selPos) : null])
  ]);
  var fiche = creer('div', { classe: 'w-fiche' }, [grille].concat(editeurs.map(function (x) { return x.e.noeud; })));
  if (carte && (carte.valeurs.CREE_LE || carte.valeurs.MODIFIE_LE)) {
    var m = [];
    if (carte.valeurs.CREE_LE) { m.push('Créée le ' + formaterDate(carte.valeurs.CREE_LE) + (carte.valeurs.CREE_PAR ? ' par ' + carte.valeurs.CREE_PAR : '')); }
    if (carte.valeurs.MODIFIE_LE) { m.push('modifiée le ' + formaterDate(carte.valeurs.MODIFIE_LE) + (carte.valeurs.MODIFIE_PAR ? ' par ' + carte.valeurs.MODIFIE_PAR : '')); }
    fiche.appendChild(creer('p', { classe: 'w-mention', texte: m.join(', ') + '.' }));
  }

  /* Lecture des saisies : modifications par rapport a la carte, ou premiere
     erreur rencontree. */
  var lireSaisies = function () {
    var titre = inTitre.value.trim();
    if (titreModifiable && !titre) { return { ok: false, id: 'fcTitre', message: 'Donnez un titre à la carte.' }; }
    var champsMaj = {};
    if (titreModifiable && (nouvelle || titre !== (carte.titre || ''))) { champsMaj[c.colTitre] = titre; }
    for (var i = 0; i < editeurs.length; i++) {
      if (!editeurs[i].e.lire) { continue; }
      var r = editeurs[i].e.lire();
      if (!r.ok) { return r; }
      var avant = carte ? carte.valeurs[editeurs[i].ch.col] : undefined;
      if (nouvelle || JSON.stringify(avant === undefined ? null : avant) !== JSON.stringify(r.v)) { champsMaj[editeurs[i].ch.col] = r.v; }
    }
    return { ok: true, champs: champsMaj, titre: titre };
  };

  if (nouvelle) {
    var ajouter = async function () {
      masquerErreur();
      var r = lireSaisies();
      if (!r.ok) { marquerInvalide(r.id, r.message); return; }
      var cleDest = selEtape.value;
      var champsMaj = r.champs;
      Object.keys(prerempli || {}).forEach(function (k) { if (champsMaj[k] === undefined) { champsMaj[k] = prerempli[k]; } });
      if (c.colKanban) { champsMaj[c.colKanban] = c.idKanban; }
      if (cleDest) { champsMaj[c.colEtape] = valeurEtapePourCle(cleDest); }
      if (c.colOrdreCartes) {
        var max = 0;
        cartesDeEtape(cleDest).forEach(function (x) { if (typeof x.ordre === 'number' && x.ordre > max) { max = x.ordre; } });
        champsMaj[c.colOrdreCartes] = max + ORDRE_PAS;
      }
      afficherLoader('Ajout de la carte…');
      try {
        await agir([['AddRecord', c.tableCartes, null, champsMaj]]);
        masquerLoader();
        fermerModale();
        annoncer('Carte ' + r.titre + ' ajoutée dans ' + libelleEtape(cleDest) + '.');
        await rafraichirMaintenant();
      } catch (e) {
        masquerLoader();
        afficherErreur('L\'ajout de la carte n\'a pas abouti.', e);
      }
    };
    ouvrirModale({ titre: 'Nouvelle carte', laterale: true, corps: [fiche], focus: 'fcTitre',
      pied: [creer('span', { classe: 'w-pousse' }), bouton('Annuler', 'secondaire', null, fermerModale),
        bouton('Ajouter la carte', null, 'check-line', ajouter)] });
    return;
  }

  var statut = creer('p', { classe: 'w-mention w-fiche__statut', id: 'wFicheStatut', texte: 'Les modifications sont enregistrées automatiquement.', attrs: { role: 'status' } });
  var minuterie = null;
  var enCours = false;
  var encore = false;
  var sauver = async function () {
    if (minuterie) { clearTimeout(minuterie); minuterie = null; }
    if (enCours) { encore = true; return; }
    var r = lireSaisies();
    if (!r.ok) {
      marquerInvalide(r.id, r.message, true);
      statut.textContent = 'Modification non enregistrée : ' + r.message;
      return;
    }
    if (!Object.keys(r.champs).length) { return; }
    enCours = true;
    statut.textContent = 'Enregistrement…';
    try {
      await agir([['UpdateRecord', c.tableCartes, carte.id, r.champs]]);
      Object.keys(r.champs).forEach(function (k) {
        if (k === c.colTitre) { carte.titre = r.champs[k]; } else { carte.valeurs[k] = r.champs[k]; }
      });
      var t = document.getElementById('wModaleTitre');
      if (t) { t.textContent = carte.titre || 'Sans titre'; }
      var d = new Date();
      statut.textContent = 'Enregistré à ' + d.getHours() + ' h ' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + '.';
      if (c.historique) { var fil = document.getElementById('wActFil'); if (fil) { await relireFil(carte, fil); } }
      redessinerColonnes();
    } catch (e) {
      statut.textContent = 'Modification non enregistrée.';
      afficherErreur('L\'enregistrement de la carte n\'a pas abouti.', e);
    } finally {
      enCours = false;
    }
    if (encore) { encore = false; await sauver(); }
  };
  var planifier = function () {
    if (minuterie) { clearTimeout(minuterie); }
    statut.textContent = 'Modification en cours…';
    minuterie = setTimeout(function () { relayer(sauver(), 'Enregistrement automatique'); }, 700);
  };
  fiche.addEventListener('input', function (e) {
    if (e.target === selEtape || e.target.type === 'file') { return; }
    planifier();
  });
  fiche.addEventListener('change', function (e) {
    if (e.target === selEtape || e.target.type === 'file') { return; }
    if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.type === 'date') {
      relayer(sauver(), 'Enregistrement automatique');
    }
  });
  selEtape.addEventListener('change', function () {
    relayer((async function () {
      await sauver();
      var dest = selEtape.value;
      if (!dest || dest === carte.cle) { return; }
      await deplacerCarte(carte.id, dest, cartesDeEtape(dest).filter(correspondFiltres).length, true);
      var sous = document.getElementById('wModaleSous');
      if (sous) { sous.textContent = 'Colonne : ' + libelleEtape(carte.cle); }
      majPositions();
      statut.textContent = 'Carte déplacée dans ' + libelleEtape(carte.cle) + '.';
    })(), 'Changement de colonne depuis la fiche');
  });
  if (selPos) {
    selPos.addEventListener('change', function () {
      relayer((async function () {
        await sauver();
        await deplacerCarte(carte.id, carte.cle, parseInt(selPos.value, 10) || 0, true);
        majPositions();
        selPos.focus();
        statut.textContent = 'Carte rangée en position ' + (parseInt(selPos.value, 10) + 1) + '.';
      })(), 'Changement de position depuis la fiche');
    });
  }
  var supprimer = async function () {
    var ok = await confirmerAction('Supprimer la carte ?', 'La carte « ' + (carte.titre || 'Sans titre') + ' » sera définitivement supprimée.', 'Supprimer');
    if (!ok) { return; }
    if (minuterie) { clearTimeout(minuterie); minuterie = null; }
    afficherLoader('Suppression…');
    try {
      await agir([['RemoveRecord', c.tableCartes, carte.id]]);
      masquerLoader();
      _modale.surFermeture = null;
      fermerModale();
      annoncer('Carte supprimée.');
      await rafraichirMaintenant();
    } catch (e) {
      masquerLoader();
      afficherErreur('La suppression de la carte n\'a pas abouti.', e);
    }
  };
  var activite = c.historique ? blocActivite(carte) : null;
  ouvrirModale({ titre: carte.titre || 'Sans titre', sousTitre: 'Colonne : ' + libelleEtape(carte.cle), laterale: true,
    corps: activite ? [ongletsFiche(carte, fiche, activite.noeud, !!opts.activite)] : [fiche], focus: opts.activite && activite ? 'wActTexte' : 'fcTitre',
    /* Une saisie encore en attente est enregistree a la fermeture : les
       valeurs sont lues avant que la fiche ne soit videe. */
    surFermeture: function () { relayer(sauver(), 'Enregistrement à la fermeture'); },
    fermerDehors: true,
    pied: [etat.peutModifier ? bouton('Supprimer la carte', 'discret', 'delete-line', supprimer) : null, statut] });
}

/* === SECTION : RETRAIT ET ECRANS D'ERREUR === */
/* Reordonnancement d'une liste des parametrages par glisser, poignee seule :
   les cases et boutons de la ligne restent utilisables normalement. */
function brancherTriListe(ol, surFin) {
  if (typeof Sortable === 'undefined') { return; }
  setTimeout(function () {
    if (!document.body.contains(ol)) { return; }
    etat.sortables.push(Sortable.create(ol, {
      handle: '.w-poignee', animation: 150, forceFallback: true, fallbackOnBody: true,
      onEnd: function (evt) { if (evt.oldIndex !== evt.newIndex) { relayer(surFin(evt.oldIndex, evt.newIndex), 'Réordonnancement'); } }
    }));
  }, 0);
}

async function recommencer() {
  if (enParametrage()) { await enregistrerMaintenant(); }
  var c = etat.config;
  /* Table des cartes supprimee entre-temps : seuls les reglages du Kanban
     restent a effacer. */
  var tableAbsente = !!(c && c.tableCartes && !etat.meta.tables[c.tableCartes]);
  var partagee = !!(c && c.colKanban) && !tableAbsente;
  var nb = partagee ? etat.cartes.length : 0;
  var ok = await confirmerAction('Supprimer ce Kanban ?', partagee
    ? 'Le Kanban disparaît des onglets' + (nb ? ' et ses ' + nb + ' carte' + (nb > 1 ? 's sont supprimées' : ' est supprimée') : '') + '. Les autres Kanbans du document ne sont pas touchés.'
    : (tableAbsente ? 'Le Kanban disparaît des onglets et ses réglages sont effacés. Sa table n\'existe plus dans le document.'
      : 'Le Kanban disparaît des onglets et ses réglages sont effacés. Votre table et ses lignes sont conservées.'), 'Supprimer');
  if (!ok) { return; }
  afficherLoader('Suppression du Kanban…');
  try {
    if (partagee) {
      /* Table partagee : les cartes du Kanban sont supprimees, ainsi que les
         colonnes dont aucun autre Kanban ne se sert. La table reste. */
      /* La liste des Kanbans est relue juste avant : un Kanban cree entre-temps
         par un collegue peut reutiliser une colonne, que la liste chargee a
         l'ouverture ignorait. Toutes les suppressions partent ensemble : un
         echec en cours de route ne laisse pas un Kanban a moitie supprime. */
      await chargerMeta();
      await lireTableaux();
      var d = await lireTable(c.tableCartes);
      var ids = [];
      for (var i = 0; i < d.id.length; i++) { if (colonneDe(d, c.colKanban, i) === c.idKanban) { ids.push(d.id[i]); } }
      var actions = [];
      if (ids.length) { actions.push(['BulkRemoveRecord', c.tableCartes, ids]); }
      var cols = (c.champs || []).map(function (ch) { return ch.col; });
      for (var k = 0; k < cols.length; k++) {
        if (IDS_RESERVES.indexOf(cols[k].toUpperCase()) === -1 && infoColonne(c.tableCartes, cols[k]) && !colonneUtiliseeAilleurs(c.tableCartes, cols[k])) {
          actions.push(['RemoveColumn', c.tableCartes, cols[k]]);
        }
      }
      if (etat.biblioLigne) { actions.push(['RemoveRecord', etat.biblio, etat.biblioLigne]); }
      if (actions.length) { await agir(actions); }
    } else if (etat.biblioLigne) { await agir([['RemoveRecord', etat.biblio, etat.biblioLigne]]); }
    etat.brouillon = null;
    etat.biblioLigne = null;
    etat.config = null;
    etat.tableauSession = null;
    etat.tableauMemorise = null;
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    afficherErreur('La suppression du Kanban n\'a pas abouti.', e);
  }
}

function rendreInvalide(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('Le Kanban ne trouve plus ses données'),
    creer('p', { classe: 'w-texte', texte: 'La table ou l\'une des colonnes principales du Kanban n\'existe plus dans ce document, ou a été renommée.' }),
    etat.peutParametrer ? bouton('Supprimer ce Kanban', null, 'delete-line', recommencer)
      : creer('p', { classe: 'w-texte', texte: 'Signalez-le à un propriétaire du document.' })]));
}

/* Aucun Kanban configure, et la personne ne peut pas en creer. */
function rendreAucun(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('Aucun Kanban pour l\'instant'),
    creer('p', { classe: 'w-texte', texte: 'Aucun Kanban n\'est encore configuré dans ce document. Sa création est réservée aux propriétaires du document.' })]));
}

function rendreEchec(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('Le chargement n\'a pas abouti'),
    creer('p', { classe: 'w-texte', texte: 'Le Kanban n\'a pas pu être affiché.' }),
    bouton('Réessayer', null, 'refresh-line', initialiser)]));
}

/* === SECTION : DROITS === */
/* Encart de marche a suivre pour reserver le parametrage aux proprietaires
   et figer le Kanban pour les lecteurs. */
function encartDroits() {
  var nomBib = etat.biblio || ID_BIBLIO;
  var detail = creer('div', { id: 'kDroitsDetail', attrs: { hidden: '' } }, [
    creer('p', { classe: 'w-texte', texte: 'Dans Paramètres du document, puis Permissions avancées, ajoutez sur la table ' + nomBib + ' :' }),
    creer('p', { classe: 'w-texte', texte: '1. Réserver le paramétrage aux propriétaires. Condition : user.Access != OWNER and rec.CLE == "' + CLE_ACCES_PARAMETRAGE + '". Refuser la Lecture.' }),
    creer('p', { classe: 'w-texte', texte: '2. Figer le Kanban pour les lecteurs. Condition : user.Access not in [OWNER, EDITOR] and rec.CLE == "' + CLE_ACCES_EDITION + '". Refuser la Lecture.' }),
    creer('p', { classe: 'w-texte', texte: '3. Protéger les réglages. Condition : user.Access != OWNER. Refuser Création, Modification et Suppression sur toute la table ' + nomBib + ' (la Lecture reste autorisée : sans elle, personne ne voit plus les Kanbans).' }),
    creer('p', { classe: 'w-texte', texte: 'Sans ces règles, le paramétrage reste proposé à tous, et un lecteur voit les commandes de modification jusqu\'à son premier essai, qui lui est refusé par le document. Masquer est un confort : la protection réelle vient des règles 3 et des droits du document.' })]);
  var btn = bouton('Voir la marche à suivre', 'discret', null, function () {
    var ouvert = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', ouvert ? 'false' : 'true');
    if (ouvert) { detail.setAttribute('hidden', ''); } else { detail.removeAttribute('hidden'); }
    btn.textContent = ouvert ? 'Voir la marche à suivre' : 'Masquer la marche à suivre';
  }, { petit: true });
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', 'kDroitsDetail');
  return creer('div', { classe: 'fr-alert fr-alert--info fr-alert--sm w-opt' }, [
    creer('p', { classe: 'fr-alert__title', texte: 'Réserver le paramétrage aux propriétaires' }),
    creer('p', { texte: 'Les lecteurs et les éditeurs consultent le Kanban, utilisent la recherche et les filtres. Les éditeurs déplacent et modifient les cartes. Seuls les propriétaires paramètrent, une fois les règles d\'accès posées.' }),
    btn, detail]);
}
/* Droits de la personne, deduits des lignes temoins qu'elle peut lire.
   Absentes, elles sont creees une fois par session ; la creation echoue
   sans bruit pour un lecteur, qui passe alors en lecture seule.
   Sans bibliotheque (aucun Kanban encore), rien n'est a proteger : la
   creation reste proposee. */
async function determinerDroits() {
  if (!etat.biblio) { etat.peutModifier = true; etat.peutParametrer = true; return; }
  var manque = [];
  if (!etat.temoinEdition) { manque.push(CLE_ACCES_EDITION); }
  if (!etat.temoinParam) { manque.push(CLE_ACCES_PARAMETRAGE); }
  if (manque.length && !etat.temoinsTentes) {
    etat.temoinsTentes = true;
    try {
      await gristAvecTimeout(grist.docApi.applyUserActions(manque.map(function (k) {
        return ['AddRecord', etat.biblio, null, { CLE: k, VALEUR: 'Ligne témoin des droits : ne pas modifier.', VERSION_CREATION: VERSION_WIDGET, VERSION_MODIF: VERSION_WIDGET }];
      })), DELAI_API_MS);
      await lireTableaux();
    } catch (e) {
      logSecurite('INFO', 'Lignes témoins non créées (lecture seule ou droits réservés)', e);
    }
  }
  etat.peutModifier = !!etat.temoinEdition;
  etat.peutParametrer = etat.peutModifier && !!etat.temoinParam;
}

/* === SECTION : CHARGEMENT ET RAFRAICHISSEMENT === */
/* Le chargement est en lecture seule : aucune modification de structure n'y
   est faite. La reparation des colonnes et la formule d'historique sont
   traitees au parametrage, par un proprietaire. Ecrites a chaque ouverture,
   elles echouaient pour un lecteur et ralentissaient tout le monde. */
async function chargerTout() {
  await chargerMeta();
  etat.biblio = trouverTable(ID_BIBLIO);
  await lireTableaux();
  await determinerDroits();
  choisirTableau();
  if (!etat.config) {
    if (!etat.peutParametrer) { afficherVue('aucun'); return; }
    if (!enCreation()) { ouvrirNouveauKanban(); }
    return;
  }
  if (!verifierConfig()) { afficherVue('invalide'); return; }
  await chargerDonnees();
  afficherVue('tableau');
}

/* Empreinte des donnees affichees : une relecture qui ne change rien ne
   redessine pas le Kanban (defilement et focus preserves). */
function empreinteDonnees() {
  return JSON.stringify([etat.etapes, etat.cartes.map(function (x) { return [x.id, x.titre, x.cle, x.ordre, x.valeurs]; })]);
}

async function rafraichirMaintenant(silencieux) {
  if (etat.vue !== 'tableau') { return; }
  try {
    var avant = empreinteDonnees();
    if (!silencieux) {
      if (Date.now() - etat.metaLueA > DELAI_RELECTURE_META_MS) { await chargerMeta(); }
      if (!etat.config || !verifierConfig()) {
        /* Avant de declarer le Kanban invalide, la structure est relue : une
           colonne a pu etre ajoutee ou renommee depuis la derniere lecture. */
        await chargerMeta();
        if (!etat.config || !verifierConfig()) { afficherVue('invalide'); return; }
      }
    }
    await chargerDonnees();
    etat.rafraichirEnAttente = false;
    if (silencieux && empreinteDonnees() === avant) { return; }
    if (etat.vue === 'tableau' && !etat.modaleOuverte && !etat.glisserEnCours) {
      var actif = document.activeElement;
      var idActif = actif && actif.id ? actif.id : null;
      var carteActive = actif && actif.closest ? actif.closest('.w-carte') : null;
      var idCarte = carteActive ? carteActive.getAttribute('data-id') : null;
      /* Le focus revient sur le meme controle de la carte (titre, bulle des
         commentaires, bouton Deplacer) : un rafraichissement declenche par
         l'historique ne doit pas faire perdre sa place au clavier. */
      var classeActive = null;
      if (carteActive) { ['w-carte__deplacer', 'w-carte__bulle', 'w-carte__ouvrir'].some(function (k) { if (actif.classList.contains(k)) { classeActive = k; return true; } return false; }); }
      redessinerColonnes();
      if (idCarte) {
        var base = '.w-carte[data-id="' + idCarte + '"] ';
        var n = document.querySelector(base + '.' + (classeActive || 'w-carte__ouvrir')) || document.querySelector(base + '.w-carte__ouvrir');
        if (n) { n.focus(); }
      } else if (idActif && document.getElementById(idActif)) { document.getElementById(idActif).focus(); }
    }
  } catch (e) {
    if (silencieux) { logSecurite('AVERTISSEMENT', 'Relecture automatique non aboutie', e); }
    else { afficherErreur('L\'actualisation du Kanban n\'a pas abouti.', e); }
  }
}

/* Relecture periodique, une seule minuterie : seulement quand la page est
   visible, sur la vue Kanban, sans fenetre ouverte ni glisser en cours. */
function demarrerActualisationAuto() {
  if (_minuterieActualisation) { clearInterval(_minuterieActualisation); }
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState !== 'visible' || etat.vue !== 'tableau' || etat.modaleOuverte || etat.glisserEnCours) { return; }
    relayer(rafraichirMaintenant(true), 'Relecture automatique');
  }, DELAI_ACTUALISATION_MS);
}

/* Les modifications recues pendant un glisser-deposer ou une fenetre
   ouverte sont differees : redessiner interromprait la saisie. */
function planifierRafraichissement() {
  if (etat.vue !== 'tableau') { return; }
  if (etat.modaleOuverte || etat.glisserEnCours) { etat.rafraichirEnAttente = true; return; }
  if (etat.minuterieRafraichir) { clearTimeout(etat.minuterieRafraichir); }
  etat.minuterieRafraichir = setTimeout(function () {
    etat.minuterieRafraichir = null;
    relayer(rafraichirMaintenant(), 'Rafraîchissement');
  }, 300);
}

async function detecterTableLiee() {
  try {
    etat.tableLiee = await gristAvecTimeout(grist.selectedTable.getTableId(), 5000);
  } catch (e) {
    etat.tableLiee = null;
    logSecurite('INFO', 'Table liée à la vue non déterminée', e);
  }
}

async function initialiser() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Chargement du Kanban…');
  try {
    await detecterTableLiee();
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { logSecurite('INFO', 'Nom du document non lu', e); }
    lireTableauMemorise();
    await chargerMeta();
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERREUR', 'Initialisation', e);
    afficherErreur('Le chargement n\'a pas abouti.');
    afficherVue('echec');
  } finally {
    etat.initEnCours = false;
  }
}

/* === SECTION : ECOUTEURS ET DEMARRAGE === */
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
dessinerLogo();
document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
document.getElementById('wSuccesFermer').addEventListener('click', masquerSucces);
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wVisionneuseFermer').addEventListener('click', fermerVisionneuse);
document.getElementById('wVisionneusePlein').addEventListener('click', basculerPleinEcranVisionneuse);
document.getElementById('wVisionneuseTelecharger').addEventListener('click', function () {
  if (_visionneuse.id) { relayer(telechargerPJ(_visionneuse.id), 'Téléchargement depuis la visionneuse'); }
});
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'tableau' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(true), 'Relecture au retour sur la page'); } });

grist.ready({ requiredAccess: 'full', columns: [], allowSelectBy: true });
/* Quand l'agent change la table liee a la vue, le choix du tableau est
   refait ; un tableau choisi pendant la session reste prioritaire. */
async function suivreLiaison() {
  var avant = etat.tableLiee;
  await detecterTableLiee();
  if (avant === etat.tableLiee) { return false; }
  if (['tableau', 'invalide'].indexOf(etat.vue) === -1 || etat.modaleOuverte || etat.initEnCours) { return false; }
  await chargerTout();
  return true;
}

grist.onRecords(function (records) {
  var ids = {};
  (records || []).forEach(function (r) { ids[r.id] = true; });
  etat.derniersIds = ids;
  majIdsVisibles();
  relayer(suivreLiaison().then(function (change) { if (!change) { planifierRafraichissement(); } }), 'Suivi de la liaison de la vue');
});

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) {
    logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined);
  });
}, 1500);

relayer(initialiser(), 'Initialisation');
demarrerActualisationAuto();
</script>
