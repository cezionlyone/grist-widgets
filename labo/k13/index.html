function evoqueRole(col, role) {
  var n = ' ' + normaliser(col.label + ' ' + col.colId).replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  return INDICES_ROLES[role].some(function (m) { return n.indexOf(' ' + m + ' ') !== -1; });
}

/* Propositions faites a l'arrivee sur l'etape 2, d'apres le nom et le type
   des colonnes. Un choix deja fait par l'agent n'est jamais remplace. */
function proposerAssociations(a) {
  var t = a.table;
  var score = function (c, role) {
    return (evoqueRole(c, role) ? 2 : 0) + (c.type === 'Choice' ? 1.5 : (c.type.indexOf('Ref:') === 0 ? 1 : 0));
  };
  if (!a.colEtape) {
    var etapes = colonnesEtapePossibles(t).map(function (c) { return { c: c, s: score(c, 'etape') }; })
      .filter(function (x) { return x.s >= 1; }).sort(function (x, y) { return y.s - x.s; });
    if (etapes.length) { a.colEtape = etapes[0].c.colId; }
  }
  if (!a.colTitre) {
    var titres = colonnesTitrePossibles(t).filter(function (c) { return c.colId !== a.colEtape; });
    var parNom = titres.filter(function (c) { return evoqueRole(c, 'titre'); });
    var libres = titres.filter(function (c) { return !c.formule; });
    var choix = parNom[0] || libres[0] || null;
    if (choix) { a.colTitre = choix.colId; }
  }
  var autres = colonnesDe(t).filter(function (c) { return c.colId !== a.colEtape && c.colId !== a.colTitre && IDS_META.indexOf(c.colId) === -1 && IDS_TECHNIQUES.indexOf(c.colId) === -1; });
  if (!a.colEcheance) {
    var ech = autres.filter(function (c) { return c.type === 'Date' && evoqueRole(c, 'echeance'); })[0];
    if (ech) { a.colEcheance = ech.colId; }
  }
  if (!a.colResponsable) {
    var resp = autres.filter(function (c) { return (c.type === 'Choice' || c.type === 'Text' || c.type.indexOf('Ref:') === 0) && evoqueRole(c, 'responsable'); })[0];
    if (resp) { a.colResponsable = resp.colId; }
  }
  if (!Object.keys(a.champs).length) {
    var coches = [];
    if (a.colEcheance) { coches.push(a.colEcheance); }
    if (a.colResponsable) { coches.push(a.colResponsable); }
    autres.filter(function (c) { return (c.type === 'Choice' || c.type === 'ChoiceList') && coches.indexOf(c.colId) === -1; }).slice(0, 2)
      .forEach(function (c) { coches.push(c.colId); });
    autres.filter(function (c) { return c.type === 'Attachments'; }).slice(0, 1).forEach(function (c) { coches.push(c.colId); });
    coches.slice(0, 5).forEach(function (id) { a.champs[id] = true; });
  }
  a.proposeesPour = t;
}

function annonceePropositions(a) {
  if (a.proposeesPour !== a.table) { return null; }
  return alerte('info', null, 'Le widget a fait des propositions d\'après le nom et le type de vos colonnes. Vérifiez-les : vous pouvez tout changer.');
}

/* La structure du document est relue a chaque changement d'etape : une
   colonne creee ou modifiee pendant l'assistant est prise en compte, et un
   choix devenu invalide est retire. */
/* Saut vers une etape du branchement depuis la barre d'etapes : en arriere
   directement, en avant etape par etape pour garder les controles. */
async function allerEtapeBranchement(cible) {
  var a = etat.assistant;
  if (cible < a.etape) { a.suggestion = null; a.etape = cible; afficherVue('branchement'); return; }
  while (a.etape < cible) {
    var avant = a.etape;
    await changerEtapeBranchement(1);
    if (a.etape === avant) { return; }
  }
}

async function changerEtapeBranchement(sens) {
  var a = etat.assistant;
  if (sens < 0) { a.suggestion = null; }
  try {
    await chargerMeta();
  } catch (e) {
    afficherErreur('La lecture de la structure du document n\'a pas abouti.', e);
    return;
  }
  if (a.table && tablesBranchables().indexOf(a.table) === -1) {
    a.table = null; a.colEtape = null; a.colTitre = null; a.champs = {};
  }
  if (a.table) {
    var ids = function (l) { return l.map(function (c) { return c.colId; }); };
    if (a.colEtape && ids(colonnesEtapePossibles(a.table)).indexOf(a.colEtape) === -1) { a.colEtape = null; }
    if (a.colTitre && ids(colonnesTitrePossibles(a.table)).indexOf(a.colTitre) === -1) { a.colTitre = null; }
    Object.keys(a.champs).forEach(function (k) { if (!infoColonne(a.table, k)) { delete a.champs[k]; } });
  }
  if (sens > 0 && !validerBranchement(a.etape)) { return; }
  if (sens > 0 && a.etape === 1 && a.table && a.proposeesPour !== a.table) { proposerAssociations(a); }
  a.etape = sens > 0 ? a.etape + 1 : a.etape - 1;
  afficherVue('branchement');
}

function validerBranchement(n) {
  var a = etat.assistant;
  masquerErreur();
  if (n === 1 && !a.table) { signalerSaisie('Choisissez une table pour continuer.'); return false; }
  if (n === 2) {
    if (!a.colEtape) { marquerInvalide('bColEtape', 'Choisissez la colonne qui indique l\'étape.'); return false; }
    if (!a.colTitre) { marquerInvalide('bColTitre', 'Choisissez la colonne qui sert de titre.'); return false; }
    if (a.colEtape === a.colTitre) { marquerInvalide('bColTitre', 'Le titre et l\'étape doivent être deux colonnes différentes.'); return false; }
    if (!a.triCol) { a.triCol = a.colTitre; }
  }
  return true;
}

function branchementEtape4() {
  var a = etat.assistant;
  var colE = infoColonne(a.table, a.colEtape);
  var colT = infoColonne(a.table, a.colTitre);
  var choisis = autresColonnes(a).filter(function (c) { return a.champs[c.colId]; });
  var modifs = choisis.filter(function (c) { return estModifiable(c, genreDe(c)); }).map(function (c) { return c.label; });
  var lecture = choisis.filter(function (c) { return !estModifiable(c, genreDe(c)); }).map(function (c) { return c.label; });
  var ordreExistant = colonneOrdreExistante(a.table);
  var ajout = a.ordre === 'manuel' && !ordreExistant ? nomColonneOrdreLibre(a.table) : null;
  var lignesCarte = [];
  if (modifs.length) { lignesCarte.push(modifs.join(', ') + ' (modifiables)'); }
  if (lecture.length) { lignesCarte.push(lecture.join(', ') + ' (non modifiables)'); }
  if (!lignesCarte.length) { lignesCarte.push('Le titre seulement'); }
  var tri = a.ordre === 'manuel' ? 'Rangement à la main' : 'Tri automatique par ' + (a.triCol === a.colTitre ? 'titre' : (infoColonne(a.table, a.triCol) || {}).label);
  var lib = function (colId) { var c = colId ? infoColonne(a.table, colId) : null; return c ? c.label : 'Aucune'; };
  var groupes = [
    { etape: 'La table', rang: 1, lignes: [['Table', libelleTable(a.table)]] },
    { etape: 'Les colonnes de la table', rang: 2, lignes: [['Étape', colE.label + ' (' + libelleType(colE).toLowerCase() + ')'], ['Titre', colT.label]] },
    { etape: 'La carte', rang: 3, lignes: [['Sur les cartes', lignesCarte.join(' ; ')], ['Rangement', tri], ['Échéance', lib(a.colEcheance)], ['Responsables', lib(a.colResponsable)]] }];
  return grilleParam([], '1-1', [titreColonne('Vos choix', null),
    ajout ? alerte('warning', 'Votre table ' + libelleTable(a.table) + ' va être modifiée', '1 colonne ajoutée : ' + ajout + ' (nombre), pour mémoriser le rangement des cartes. Aucune donnée existante ne sera modifiée ni supprimée.')
      : alerte('info', 'Votre table ne sera pas modifiée', 'Aucune colonne ne sera ajoutée ni modifiée dans la table ' + libelleTable(a.table) + '.'),
    blocRecapitulatif(groupes),
    creer('p', { classe: 'w-mention', texte: 'Le Kanban s\'affiche aussitôt après sa création. Toute carte déplacée met à jour la colonne ' + colE.label + ' de la ligne correspondante.' })
  ], apercuEtape('Récapitulatif'));
}

async function executerBranchement() {
  var a = etat.assistant;
  afficherLoader('Branchement du Kanban…');
  try {
    await chargerMeta();
    var colOrdre = null;
    if (a.ordre === 'manuel') {
      colOrdre = colonneOrdreExistante(a.table);
      if (!colOrdre) { colOrdre = await ajouterColonne(a.table, nomColonneOrdreLibre(a.table), 'Numeric', null); }
    }
    var colE = infoColonne(a.table, a.colEtape);
    var cible = tableCibleRef(colE.type);
    var source = colE.type === 'Choice' ? { type: 'choice' } : (cible ? { type: 'ref', table: cible, colAffichage: colAffichageRef(colE), colOrdre: colonneOrdreExistante(cible) } : { type: 'text' });
    var champs = autresColonnes(a).filter(function (c) { return a.champs[c.colId]; }).map(function (c) { return { col: c.colId, surCarte: true }; });
    await assurerBibliotheque();
    await lireTableaux();
    memoriserTableau(preparerNouveauTableau());
    await ecrireConfig({
      mode: 'branche', nom: libelleTable(a.table), description: '', tableCartes: a.table, colTitre: a.colTitre, colEtape: a.colEtape,
      sourceEtapes: source, colOrdreCartes: colOrdre, tri: a.ordre === 'auto' ? { col: a.triCol || a.colTitre, sens: a.triSens } : null,
      champs: champs, colEcheance: a.colEcheance || null, colResponsable: a.colResponsable || null, compact: false,
      recherche: true, filtres: a.colResponsable ? [a.colResponsable] : [], filtreRetard: !!a.colEcheance
    });
    etat.assistant = null;
    await chargerTout();
    masquerLoader();
    afficherSucces('Votre Kanban « ' + (etat.config.nom || '') + ' » est prêt : il affiche la table ' + libelleTable(etat.config.tableCartes) + '.');
  } catch (e) {
    masquerLoader();
    afficherErreur('Le branchement du Kanban n\'a pas abouti.', e);
  }
}

/* === SECTION : TABLEAU === */
function detruireSortables() {
  etat.sortables.forEach(function (s) { try { s.destroy(); } catch (e) { logSecurite('INFO', 'Glisser-déposer déjà détruit', e); } });
  etat.sortables = [];
}

/* Panneau lateral replie ou non (ordinateur) : choix retenu par le
   navigateur. Sur ecran etroit, le panneau s'ouvre par-dessus le Kanban. */
/* Titre de section du panneau, a la maniere DSFR : pastille bleue avec une
   icone (pas un numero : les sections ne sont pas des etapes), titre en
   gras, trait bleu France dessous. */
function titreVolet(icone, texte, id, explication) {
  var a = explication ? aide(id, texte, explication) : null;
  var tete = creer('div', { classe: 'w-volet__entete' }, [
    creer('span', { classe: 'w-volet__puce fr-icon-' + icone + ' fr-icon--sm', attrs: { 'aria-hidden': 'true' } }),
    creer('h3', { classe: 'w-volet__h', id: id, texte: texte }), a ? a.bouton : null]);
  return a ? creer('div', {}, [tete, a.panneau]) : tete;
}

function voletReplie() {
  try {
    var v = window.localStorage.getItem('kanbans.voletReplie');
    if (v !== null) { return v === '1'; }
  } catch (e) { /* stockage du navigateur indisponible : memoire de la session */ }
  return !!etat.voletReplie;
}

function basculerVolet(replier) {
  etat.voletReplie = replier;
  try { window.localStorage.setItem('kanbans.voletReplie', replier ? '1' : '0'); } catch (e) { logSecurite('INFO', 'Choix du panneau non mémorisé', e); }
  afficherVue('tableau', true);
  var f = document.getElementById('tVoletPoignee');
  if (f) { f.focus(); }
  annoncer(replier ? 'Panneau des filtres masqué.' : 'Panneau des filtres affiché.');
}

function ouvrirVoletMobile(ouvrir) {
  etat.voletMobile = ouvrir;
  afficherVue('tableau', true);
  var f = document.getElementById(ouvrir ? 'tRecherche' : 'tVoletMobile');
  if (!f && ouvrir) { f = document.getElementById('tVoletFermer'); }
  if (f) { f.focus(); }
}

function rendreTableau(zone) {
  var c = etat.config;
  var replie = voletReplie();
  /* Volet de gauche, dans l'ordre de la serie : ajouter, rechercher,
     filtrer, legende, affichage, parametrages, imprimer. */
  var volet = creer('aside', { classe: 'w-volet' + (replie ? ' w-volet--replie' : '') + (etat.voletMobile ? ' w-volet--mobile-ouvert' : ''),
    id: 'tVolet', attrs: { 'aria-label': 'Recherche et filtres' } });
  var nbActifs = nombreFiltresActifs();
  var contenu = creer('div', { classe: 'w-volet__contenu', id: 'tVoletContenu' });
  /* Titre du panneau et croix de fermeture : sur ecran etroit seulement. */
  contenu.appendChild(creer('div', { classe: 'w-volet__tete' }, [
    creer('p', { classe: 'w-volet__titre', texte: 'Recherche et filtres' }),
    bouton('Fermer le panneau', 'discret', 'close-line', function () { ouvrirVoletMobile(false); },
      { petit: true, iconeSeule: true, id: 'tVoletFermer' })]));
  var peutAjouter = etat.peutModifier && etat.etapes.length > 0;
  var ajouterCarte = function () { ouvrirCarte(null, etat.etapes[0].cle); };
  if (peutAjouter) { contenu.appendChild(ajoutVolet('Ajouter une carte', ajouterCarte, 'tAjouter')); }
  if (c.recherche !== false) {
    var rech = saisie('tRecherche', etat.recherche, { type: 'search', indice: 'Titre, contenu…' });
    rech.addEventListener('input', function () { etat.recherche = rech.value; redessinerColonnes(); majEffacerFiltres(); });
    contenu.appendChild(creer('section', { classe: 'w-volet__bloc', attrs: { 'aria-labelledby': 'tVoletRech' } }, [
      titreVolet('search-line', 'Rechercher', 'tVoletRech', 'Cherche dans le titre et le contenu des cartes, sans tenir compte des accents ni des majuscules.'),
      creer('div', { classe: 'w-outils__champ' }, [creer('label', { classe: 'fr-sr-only', attrs: { 'for': 'tRecherche' }, texte: 'Rechercher dans les cartes' }), rech])]));
  } else {
    etat.recherche = '';
  }
  var filtres = creer('section', { classe: 'w-volet__bloc', attrs: { 'aria-labelledby': 'tVoletFil' } }, [
    titreVolet('filter-line', 'Filtres', 'tVoletFil', 'N\'affiche que les cartes qui correspondent à vos choix. Les autres cartes ne sont pas supprimées : « Effacer les filtres » les fait réapparaître.')]);
  Object.keys(etat.valeursFiltres).forEach(function (k) { if (c.filtres.indexOf(k) === -1) { delete etat.valeursFiltres[k]; } });
  c.filtres.forEach(function (colId) {
    var idSel = 'tFiltre_' + cleId(colId);
    var valeurs = valeursFiltre(colId);
    var actuelle = etat.valeursFiltres[colId] || '';
    if (actuelle && actuelle !== VALEUR_VIDE && valeurs.indexOf(actuelle) === -1) { actuelle = ''; delete etat.valeursFiltres[colId]; }
    var ops = valeurs.map(function (v) { return { valeur: v, libelle: v }; });
    if (genreFiltre(colId) !== 'oui_non') { ops.push({ valeur: VALEUR_VIDE, libelle: '(Non renseigné)' }); }
    var sel = liste(idSel, ops, actuelle, { vide: 'Tous' });
    sel.addEventListener('change', function () {
      if (sel.value) { etat.valeursFiltres[colId] = sel.value; } else { delete etat.valeursFiltres[colId]; }
      redessinerColonnes();
      majEffacerFiltres();
    });
    filtres.appendChild(creer('div', { classe: 'w-outils__champ' }, [creer('label', { classe: 'fr-label', attrs: { 'for': idSel }, texte: libelleChampCol(colId) }), sel]));
  });
  if (c.filtreRetard && c.colEcheance) {
    var cbRetard = creer('input', { attrs: { type: 'checkbox', id: 'tRetard' }, coche: etat.retardSeul });
    cbRetard.addEventListener('change', function () { etat.retardSeul = cbRetard.checked; redessinerColonnes(); majEffacerFiltres(); });
    var aRet = aide('tRetard', 'En retard seulement', 'N\'affiche que les cartes dont l\'' + libelleChampCol(c.colEcheance).toLowerCase() + ' est dépassée. Les autres cartes ne sont pas supprimées : décochez pour les revoir.');
    filtres.appendChild(creer('div', { classe: 'w-champ-aide w-volet__case' }, [creer('div', { classe: 'fr-checkbox-group fr-checkbox-group--sm' }, [cbRetard,
      creer('label', { classe: 'fr-label', attrs: { 'for': 'tRetard' }, texte: 'En retard seulement' })]), aRet.bouton, aRet.panneau]));
  } else {
    etat.retardSeul = false;
  }
  if (!c.filtres.length && !(c.filtreRetard && c.colEcheance)) { filtres.appendChild(creer('p', { classe: 'w-mention', texte: 'Aucun filtre pour l\'instant.' })); }
  /* Bas du bloc : combien de cartes restent affichees, et l'effacement. */
  filtres.appendChild(creer('div', { classe: 'w-filtres__pied' }, [
    creer('p', { classe: 'w-mention', id: 'tFiltresCompte' }),
    bouton('Effacer les filtres', 'discret', null, function () {
      etat.valeursFiltres = {};
      etat.retardSeul = false;
      etat.legendeMasquee = {};
      etat.recherche = '';
      afficherVue('tableau', true);
      annoncer('Filtres effacés : toutes les cartes sont affichées.');
      var f = document.getElementById('tRecherche') || document.getElementById('titreVue');
      if (f) { f.focus(); }
    }, { petit: true, id: 'tEffacer' })]));
  contenu.appendChild(filtres);
  /* Legende de la couleur des cartes : chaque valeur affiche ou masque ses
     cartes. */
  if (c.couleur) {
    var comptes = {};
    etat.cartes.forEach(function (x) {
      if (etat.idsVisibles && !etat.idsVisibles[x.id]) { return; }
      var v = valeurCouleur(x);
      comptes[v] = (comptes[v] || 0) + 1;
    });
    Object.keys(etat.legendeMasquee).forEach(function (k) { if (!comptes[k]) { delete etat.legendeMasquee[k]; } });
    var cles = Object.keys(comptes).sort(function (a, b) { return a === '' ? 1 : (b === '' ? -1 : a.localeCompare(b, 'fr')); });
    if (cles.length) {
      contenu.appendChild(legendeFiltre('tVoletLeg', libelleChampCol(c.couleur), 'palette-line', cles.map(function (k) {
        return { cle: k, compte: comptes[k], masque: !!etat.legendeMasquee[k],
          etiquette: [k ? badge(k, couleurBadge(k)) : creer('span', { classe: 'w-legende__nom', texte: '(Non renseigné)' })] };
      }), function (k) {
        if (etat.legendeMasquee[k]) { delete etat.legendeMasquee[k]; } else { etat.legendeMasquee[k] = true; }
        afficherVue('tableau', true);
        var cible = document.querySelectorAll('#tVolet .w-legende__item')[cles.indexOf(k)];
        if (cible) { cible.focus(); }
        annoncer((k || 'Non renseigné') + (etat.legendeMasquee[k] ? ' : cartes masquées.' : ' : cartes affichées.'));
      }));
    }
  }
  contenu.appendChild(blocAffichage());
  /* Parametrages : un seul bouton ; les reglages eux-memes sont dans les
     pages de parametrage, pas dans le volet. */
  if (etat.peutParametrer) contenu.appendChild(creer('section', { classe: 'w-volet__bloc w-volet__pied', attrs: { 'aria-label': 'Paramétrages' } }, [
    bouton('Paramétrages de ce Kanban', 'secondaire', 'settings-5-line', ouvrirPersonnalisation, { petit: true, id: 'tPerso', classe: 'w-param' })]));
  contenu.appendChild(sortiesVolet([
    { libelle: 'Imprimer', icone: 'printer-line', action: imprimerVue, id: 'tImprimer' },
    { libelle: 'Enregistrer en PDF', icone: 'file-pdf-line', action: imprimerPdf, id: 'tPdf' }]));
  volet.appendChild(contenu);
  /* Poignee sur le bord droit : replie ou deplie le panneau. Repliee, elle
     porte le nombre de filtres actifs. */
  volet.appendChild(creer('button', { classe: 'w-volet__poignee', id: 'tVoletPoignee',
    attrs: { type: 'button', 'aria-expanded': replie ? 'false' : 'true', 'aria-controls': 'tVoletContenu',
      'aria-label': (replie ? 'Afficher' : 'Masquer') + ' le panneau des filtres' + (replie && nbActifs ? ', ' + nbActifs + ' filtre' + (nbActifs > 1 ? 's' : '') + ' actif' + (nbActifs > 1 ? 's' : '') : '') },
    clic: function () { basculerVolet(!voletReplie()); } }, [
    creer('span', { classe: 'w-volet__compte', id: 'tVoletCompte', texte: replie && nbActifs ? String(nbActifs) : '', attrs: { 'aria-hidden': 'true' } })]));
  volet.addEventListener('keydown', function (e) { if (e.key === 'Escape' && etat.voletMobile) { ouvrirVoletMobile(false); } });
  /* Partie droite : barre de la vue (nom, compteurs, plein ecran), puis les
     colonnes. Sur ecran etroit, l'ajout et le volet passent au-dessus. */
  var principal = creer('div', { classe: 'w-principal' });
  principal.appendChild(creer('div', { classe: 'w-barre-mobile' }, [
    peutAjouter ? bouton('Ajouter une carte', null, 'add-line', ajouterCarte, { petit: true, id: 'tAjouterMobile' }) : null,
    bouton(nbActifs ? 'Recherche et filtres (' + nbActifs + ')' : 'Recherche et filtres', 'secondaire', 'filter-line', function () { ouvrirVoletMobile(true); },
      { petit: true, id: 'tVoletMobile', attrs: { 'aria-controls': 'tVolet', 'aria-expanded': etat.voletMobile ? 'true' : 'false' } })]));
  principal.appendChild(barreVue(c.nom || 'Kanban sans nom', compteursKanban(), [boutonPleinEcran()]));
  if (c.description) { principal.appendChild(blocExplication(c.description)); }
  if (etat.regroupement) {
    principal.appendChild(alerte('info', null, 'Cartes regroupées par ' + libelleChampCol(etat.regroupement) + ' : déplacer une carte change sa valeur. Pour revenir aux étapes, choisissez « Étape » dans « Regrouper par ».'));
  }
  if (typeof Sortable === 'undefined') {
    principal.appendChild(creer('p', { classe: 'w-mention fr-mb-1w w-ecran-seul', texte: 'Le glisser-déposer n\'est pas disponible pour le moment : utilisez le bouton Déplacer de chaque carte.' }));
  }
  if (!etat.etapes.length) {
    principal.appendChild(alerte('info', 'Votre Kanban n\'a pas encore de colonne', c.sourceEtapes.type === 'text'
      ? 'Les colonnes apparaîtront dès qu\'une ligne de votre table aura une étape renseignée.'
      : 'Ajoutez une première colonne depuis « Paramétrages ».'));
  }
  principal.appendChild(creer('div', { classe: 'w-tableau' + (c.compact ? ' w-compact' : ''), id: 'tTableau' }));
  zone.appendChild(creer('div', { classe: 'w-disposition' }, [volet, principal]));
  redessinerColonnes();
  majEffacerFiltres();
}

/* Bloc Affichage du volet : trier, regrouper, couloirs. Reglages pour soi
   seul, retenus pendant la session. */
function blocAffichage() {
  var c = etat.config;
  var bloc = creer('section', { classe: 'w-volet__bloc', attrs: { 'aria-labelledby': 'tVoletAff' } }, [titreVolet('eye-line', 'Affichage', 'tVoletAff')]);
  var champ = function (id, libelle, explication, controle, sansChamp) {
    var a = aide(id, libelle, explication);
    return creer('div', { classe: 'w-outils__champ w-champ-aide' }, [
      creer('div', { classe: 'w-libelle-aide' }, [creer(sansChamp ? 'span' : 'label', { classe: 'fr-label', attrs: { 'for': sansChamp ? null : id }, texte: libelle }), a.bouton]), a.panneau].concat(controle));
  };
  var tri = triVue();
  var selTri = liste('tTri', [{ valeur: '', libelle: c.colOrdreCartes ? 'Ordre manuel' : 'Ordre du paramétrage' }].concat(colonnesTriables()), tri ? tri.col : '');
  selTri.addEventListener('change', function () {
    definirTriVue(selTri.value ? { col: selTri.value, sens: (triVue() || {}).sens || 'asc' } : null);
    afficherVue('tableau', true);
    var f = document.getElementById('tTri');
    if (f) { f.focus(); }
    var tv = triVue();
    annoncer(tv ? 'Cartes triées par ' + selTri.options[selTri.selectedIndex].text + ', ordre ' + (tv.sens === 'desc' ? 'décroissant' : 'croissant') + '.' : 'Cartes dans l\'ordre ' + (c.colOrdreCartes ? 'manuel' : 'du paramétrage') + '.');
  });
  var desc = tri && tri.sens === 'desc';
  var sens = tri ? bouton(desc ? 'Décroissant' : 'Croissant', 'discret', desc ? 'arrow-down-line' : 'arrow-up-line', function () {
    definirTriVue({ col: tri.col, sens: desc ? 'asc' : 'desc' });
    afficherVue('tableau', true);
    var f = document.getElementById('tTriSens');
    if (f) { f.focus(); }
    annoncer('Ordre ' + (desc ? 'croissant' : 'décroissant') + '.');
  }, { petit: true, id: 'tTriSens', aria: 'Sens du tri : ' + (desc ? 'décroissant' : 'croissant') + '. Inverser' }) : null;
  bloc.appendChild(champ('tTri', 'Trier', 'Change l\'ordre des cartes dans chaque colonne, pour vous seul. L\'ordre enregistré n\'est pas modifié : choisissez « ' + (c.colOrdreCartes ? 'Ordre manuel' : 'Ordre du paramétrage') + ' » pour y revenir. Les cartes sans valeur sont toujours à la fin.' + (c.colOrdreCartes ? ' Pendant un tri, le glisser-déposer change seulement la colonne d\'une carte, pas sa place dans la colonne.' : ''),
    [selTri, sens]));
  var regroupables = colonnesRegroupables();
  if (etat.regroupement && regroupables.indexOf(etat.regroupement) === -1) { etat.regroupement = null; }
  if (!regroupables.length) { return bloc; }
  var selG = liste('tRegroupe', [{ valeur: '', libelle: 'Étape (colonnes du Kanban)' }].concat(regroupables.map(function (id) { return { valeur: id, libelle: libelleChampCol(id) }; })), etat.regroupement || '');
  selG.addEventListener('change', function () {
    etat.regroupement = selG.value || null;
    afficherVue('tableau', true);
    var f = document.getElementById('tRegroupe');
    if (f) { f.focus(); }
    annoncer(etat.regroupement ? 'Cartes regroupées par ' + libelleChampCol(etat.regroupement) + '.' : 'Cartes regroupées par étape.');
  });
  bloc.appendChild(champ('tRegroupe', 'Regrouper par', 'Range les mêmes cartes dans d\'autres colonnes : par responsable, par priorité… Glisser une carte d\'une colonne à l\'autre change alors cette information. Vos étapes ne sont pas modifiées : choisissez « Étape » pour y revenir.', [selG]));
  /* Couloirs : seulement quand les colonnes sont les etapes. */
  if (etat.couloir && regroupables.indexOf(etat.couloir) === -1) { etat.couloir = null; }
  var corpsCouloir;
  if (etat.regroupement) {
    corpsCouloir = creer('p', { classe: 'w-mention fr-mb-0', texte: 'Disponible quand les colonnes sont les étapes : choisissez « Étape » dans « Regrouper par ».' });
  } else {
    corpsCouloir = liste('tCouloir', [{ valeur: '', libelle: 'Aucun' }].concat(regroupables.map(function (id) { return { valeur: id, libelle: libelleChampCol(id) }; })), etat.couloir || '');
    corpsCouloir.addEventListener('change', function () {
      etat.couloir = corpsCouloir.value || null;
      etat.couloirsReplies = {};
      afficherVue('tableau', true);
      var f = document.getElementById('tCouloir');
      if (f) { f.focus(); }
      annoncer(etat.couloir ? 'Couloirs par ' + libelleChampCol(etat.couloir) + '.' : 'Couloirs retirés.');
    });
  }
  bloc.appendChild(champ('tCouloir', 'Couloirs', 'Découpe le Kanban en bandes horizontales, une par valeur (une par responsable, par exemple), avec les mêmes colonnes d\'étape dans chaque bande. Glisser une carte d\'une bande à l\'autre change cette information. Réglage pour vous seul.', [corpsCouloir], !!etat.regroupement));
  return bloc;
}

/* Compteurs de la barre : cartes affichees, et cartes masquees par les
   filtres (hors lignes ecartees par la vue liee). */
function compteursKanban() {
  var total = etat.cartes.filter(function (x) { return !etat.idsVisibles || etat.idsVisibles[x.id]; }).length;
  var vues = etat.cartes.filter(correspondFiltres).length;
  var res = [vues + ' carte' + (vues > 1 ? 's' : '')];
  if (total > vues) { res.push((total - vues) + ' masquée' + (total - vues > 1 ? 's' : '')); }
  return res;
}

/* Impression de la vue telle qu'elle est filtree. */
function imprimerVue() { window.print(); }

/* Bas du bloc des filtres : nombre de cartes affichees sur le total, et
   effacement quand un filtre, la legende ou une recherche est pose. */
function majEffacerFiltres() {
  var n = nombreFiltresActifs();
  var b = document.getElementById('tEffacer');
  if (b) { b.hidden = n === 0; }
  var p = document.getElementById('tFiltresCompte');
  if (p) {
    var total = etat.cartes.filter(function (x) { return !etat.idsVisibles || etat.idsVisibles[x.id]; }).length;
    var vues = etat.cartes.filter(correspondFiltres).length;
    p.textContent = vues + ' sur ' + total + (total > 1 ? ' cartes' : ' carte');
  }
  var r = document.getElementById('tVoletCompte');
  if (r) { r.textContent = n && voletReplie() ? String(n) : ''; }
  var m = document.getElementById('tVoletMobile');
  if (m) { m.lastChild.textContent = n ? 'Recherche et filtres (' + n + ')' : 'Recherche et filtres'; }
  majCompteurs(compteursKanban());
}

/* Aide "i" : un bouton qui affiche une courte explication au clic (pas au
   survol : inutilisable au clavier et au toucher, et sans effet dans le
   cadre de la plateforme). Echap ou un second clic la referme. */
function aide(id, sujet, texte, aDroite) {
  var panneau = creer('p', { classe: 'w-aide__texte' + (aDroite ? ' w-aide__texte--droite' : ''), id: id + '_aide', texte: texte });
  panneau.hidden = true;
  var b = creer('button', { classe: 'w-aide', attrs: { type: 'button', 'aria-label': 'Aide : ' + sujet, 'aria-expanded': 'false', 'aria-controls': id + '_aide' } },
    [creer('span', { classe: 'w-aide__rond', texte: 'i', attrs: { 'aria-hidden': 'true' } })]);
  var basculer = function (ouvrir) {
    panneau.hidden = !ouvrir;
    b.setAttribute('aria-expanded', ouvrir ? 'true' : 'false');
  };
  b.addEventListener('click', function () { basculer(panneau.hidden); });
  b.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panneau.hidden) { e.stopPropagation(); basculer(false); } });
  return { bouton: b, panneau: panneau };
}

/* Texte d'explication du Kanban, sous son nom. Au-dela de trois lignes
   environ, il est replie avec "Lire la suite". */
function blocExplication(texte) {
  var p = creer('p', { classe: 'w-explication', id: 'tExplication', texte: texte });
  var long = texte.length > 220 || texte.split('\n').length > 3;
  if (!long) { return p; }
  p.classList.add('w-explication--repliee');
  var b = bouton('Lire la suite', 'discret', null, function () {

function libelleChampCol(colId) {
  var ch = champDe(colId);
  if (ch) { return libelleChamp(ch); }
  var col = colonneCartes(colId);
  return col ? col.label : colId;
}

function redessinerColonnes() {
  detruireSortables();
  var zone = document.getElementById('tTableau');
  if (!zone) { return; }
  var defilements = {};
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) { defilements[(l.getAttribute('data-couloir') ? l.getAttribute('data-couloir') + '|' : '') + l.getAttribute('data-cle')] = l.scrollTop; });
  var defilementX = zone.scrollLeft;
  vider(zone);
  if (etat.couloir && !etat.regroupement) {
    zone.classList.add('w-tableau--couloirs');
    redessinerCouloirs(zone, defilements);
    zone.scrollLeft = defilementX;
    return;
  }
  zone.classList.remove('w-tableau--couloirs');
  var cles;
  if (etat.regroupement) {
    cles = groupesAffiches().map(function (g) { return g.cle; });
  } else {
    cles = etat.etapes.map(function (e) { return e.cle; });
    if (etat.cartes.some(function (x) { return x.cle === CLE_NON_CLASSE; })) { cles.push(CLE_NON_CLASSE); }
  }
  cles.forEach(function (cle) { zone.appendChild(rendreColonne(cle)); });
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) {
    brancherGlisser(l, l.getAttribute('data-cle'));
    if (defilements[l.getAttribute('data-cle')]) { l.scrollTop = defilements[l.getAttribute('data-cle')]; }
  });
  zone.scrollLeft = defilementX;
  brancherGlisserColonnes(zone);
}

/* Couloirs : une bande par valeur, repliable, avec dans chacune les colonnes
   d'etape. Les colonnes vides n'y sont pas reduites, pour rester alignees
   d'une bande a l'autre. */
function redessinerCouloirs(zone, defilements) {
  var cles = etat.etapes.map(function (e) { return e.cle; });
  if (etat.cartes.some(function (x) { return x.cle === CLE_NON_CLASSE; })) { cles.push(CLE_NON_CLASSE); }
  couloirsAffiches().forEach(function (g) {
    var cartesBande = etat.cartes.filter(function (x) { return cleCouloir(x) === g.cle; });
    var visiblesBande = cartesBande.filter(correspondFiltres).length;
    if (g.cle === VALEUR_VIDE && !cartesBande.length) { return; }
    var replie = !!etat.couloirsReplies[g.cle];
    var idCorps = 'tCouloir_' + cleId(g.cle);
    var bande = creer('section', { classe: 'w-couloir' + (replie ? ' w-couloir--replie' : ''), attrs: { 'aria-labelledby': idCorps + '_t' } });
    var titre = creer('h3', { classe: 'w-couloir__titre', id: idCorps + '_t' }, [
      creer('button', { classe: 'w-couloir__bascule', attrs: { type: 'button', 'aria-expanded': replie ? 'false' : 'true', 'aria-controls': idCorps },
        clic: function () {
          etat.couloirsReplies[g.cle] = !replie;
          redessinerColonnes();
          var b = document.querySelector('#' + idCorps + '_t button');
          if (b) { b.focus(); }
        } }, [
        creer('span', { classe: (replie ? 'fr-icon-arrow-right-s-line' : 'fr-icon-arrow-down-s-line') + ' fr-icon--sm', attrs: { 'aria-hidden': 'true' } }),
        creer('span', { texte: g.libelle }),
        creer('span', { classe: 'w-couloir__compte', texte: String(cartesBande.length) + (visiblesBande !== cartesBande.length ? ' (' + visiblesBande + ' affichées)' : ''),
          attrs: { 'aria-label': cartesBande.length + ' carte' + (cartesBande.length > 1 ? 's' : '') } })])]);
    bande.appendChild(titre);
    var corps = creer('div', { classe: 'w-couloir__colonnes', id: idCorps });
    if (replie) { corps.hidden = true; }
    else { cles.forEach(function (cle) { corps.appendChild(rendreColonne(cle, g)); }); }
    bande.appendChild(corps);
    zone.appendChild(bande);
  });
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) {
    brancherGlisser(l, l.getAttribute('data-cle'));
    var k = (l.getAttribute('data-couloir') ? l.getAttribute('data-couloir') + '|' : '') + l.getAttribute('data-cle');
    if (defilements[k]) { l.scrollTop = defilements[k]; }
  });
}

function rendreColonne(cle, couloir) {
  var c = etat.config;
  var toutes = cartesColonne(cle);
  if (couloir) { toutes = toutes.filter(function (x) { return cleCouloir(x) === couloir.cle; }); }
  var visibles = toutes.filter(correspondFiltres);
  var lib = libelleColonne(cle);

     en-tete et son bouton "+ Ajouter" restent accessibles, et sa zone de
     depot reste visible pour y faire glisser une carte. */
  /* Colonne d'archives : repliee meme avec des cartes, jusqu'a ce que
     l'agent l'ouvre ; elle reste une zone de depot. */
  var archive = !etat.regroupement && !!c.colonneArchive && cle === c.colonneArchive;
  var archRepliee = archive && !etat.archivesOuvertes;

    attrs: { 'aria-labelledby': idTitre, 'data-cle': cle } });
  var ordonnable = colonnesOrdonnablesSurKanban() && cle !== CLE_NON_CLASSE;

  var tete = creer('div', { classe: 'w-colonne__tete' }, [
    ordonnable ? creer('span', { classe: 'w-poignee w-colonne__poignee w-infobulle w-infobulle--dessous-gauche fr-icon-drag-move-2-line fr-icon--sm', attrs: { 'aria-hidden': 'true', 'data-infobulle': 'Déplacer cette colonne' } }) : null,
    creer(couloir ? 'h4' : 'h3', { classe: 'w-colonne__titre', id: idTitre, texte: lib }),
    creer('span', { classe: 'w-colonne__compte', texte: compte + (visibles.length !== toutes.length ? ' (' + visibles.length + ' affichées)' : ''),
      attrs: { 'aria-label': toutes.length + ' carte' + (toutes.length > 1 ? 's' : '') } }),
    archive ? creer('button', { classe: 'w-colonne__archives w-infobulle w-infobulle--dessous', id: idArchives,
      attrs: { 'aria-expanded': archRepliee ? 'false' : 'true', 'aria-label': (archRepliee ? 'Afficher les archives, ' : 'Replier les archives, ') + toutes.length + ' carte' + (toutes.length > 1 ? 's' : ''),

      clic: function () {

    cle !== CLE_NON_CLASSE && !archive && etat.peutModifier ? creer('button', { classe: 'w-plus w-colonne__ajouter w-infobulle w-infobulle--dessous', attrs: { 'aria-label': 'Ajouter une carte dans ' + lib, 'data-infobulle': 'Ajouter une carte dans cette colonne' },
      clic: function () {
        if (etat.regroupement) { var pre = {}; pre[etat.regroupement] = valeurPourGroupe(cle); ouvrirCarte(null, etat.etapes.length ? etat.etapes[0].cle : null, pre); }
        else if (couloir) { var preC = {}; preC[etat.couloir] = valeurPourCouloir(couloir.cle); ouvrirCarte(null, cle, preC); }
        else { ouvrirCarte(null, cle); }

  ]);
  sec.appendChild(tete);
  if (cle === CLE_NON_CLASSE) {

  }
  var listeCartes = creer('div', { classe: 'w-colonne__liste', attrs: { 'data-cle': cle, 'data-couloir': couloir ? couloir.cle : '', role: 'list', 'aria-label': 'Cartes de la colonne ' + lib + (couloir ? ', couloir ' + couloir.libelle : '') } });
  if (!archRepliee) { visibles.forEach(function (x) { listeCartes.appendChild(rendreCarte(x)); }); }
  /* Colonne vide : ni message ni encadre. Sa zone de depot reste presente
