    b.addEventListener('click', function () { choisirOngletAide(o.cle); });
    b.addEventListener('keydown', function (e) {
      var j = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: ONGLETS_AIDE.length - 1 }[e.key];
      if (j === undefined) { return; }
      e.preventDefault();
      choisirOngletAide(ONGLETS_AIDE[(j + ONGLETS_AIDE.length) % ONGLETS_AIDE.length].cle);
    });
    liste.appendChild(creer('li', { attrs: { role: 'presentation' } }, [b]));
  });
  p.appendChild(liste);
  var corps = creer('div', { classe: 'w-panneau-aide__corps' });
  ONGLETS_AIDE.forEach(function (o) {
    var v = creer('div', { classe: 'w-panneau-aide__volet', id: 'wAideVolet_' + o.cle, attrs: { role: 'tabpanel', 'aria-labelledby': 'wAideOnglet_' + o.cle, tabindex: '0' } });
    v.hidden = o.cle !== courant;
    if (o.cle === courant) {
      (o.cle === 'resume' ? voletAideResume() : (o.cle === 'pas' ? voletAidePas(ctx) : voletAideQuestions())).forEach(function (n) { v.appendChild(n); });
    }
    corps.appendChild(v);
  });
  p.appendChild(corps);
  var f = actif ? document.getElementById(actif) : null;
  if (f) { f.focus(); }
  var ici = p.querySelector('.w-pas__etape--en-cours');
  if (ici) { corps.scrollTop = Math.max(0, ici.offsetTop - corps.offsetTop - 16); }
}

function voletAideResume() {
  return [creer('p', { classe: 'w-texte', texte: AIDE.resume }),
    creer('h3', { classe: 'w-panneau-aide__sous-titre', texte: 'Ce que vous pouvez faire' }),
    creer('ul', { classe: 'w-texte w-panneau-aide__liste' }, AIDE.fonctions.map(function (t) { return creer('li', { texte: t }); })),
    creer('h3', { classe: 'w-panneau-aide__sous-titre', texte: 'Avant de commencer' }),
    creer('ul', { classe: 'w-texte w-panneau-aide__liste' }, AIDE.avant.map(function (t) { return creer('li', { texte: t }); }))];
}

/* Une fiche par etape du parcours en cours : faite (coche), en cours
   (mise en evidence, ses conseils detailles) ou a venir. Sur l'ecran
   principal, toutes les fiches sont detaillees. */
function voletAidePas(ctx) {
  var res = [];
  if (ctx.repere) { res.push(creer('p', { classe: 'w-mention', texte: ctx.repere })); }
  var ol = creer('ol', { classe: 'w-pas' });
  ctx.etapes.forEach(function (nom, i) {
    var fiche = AIDE.etapes[nom] || { titre: '', points: [] };
    var etatE = ctx.courante < 0 ? 'neutre' : (i < ctx.courante ? 'faite' : (i === ctx.courante ? 'en-cours' : 'a-venir'));
    var detail = ctx.courante < 0 || etatE === 'en-cours';
    var li = creer('li', { classe: 'w-pas__etape w-pas__etape--' + etatE }, [
      creer('span', { classe: 'w-pas__num' + (etatE === 'faite' ? ' fr-icon-check-line fr-icon--sm' : ''), texte: etatE === 'faite' ? null : String(i + 1), attrs: { 'aria-hidden': 'true' } }),
      creer('div', { classe: 'w-pas__texte' }, [
        creer('p', { classe: 'w-pas__nom' }, [creer('strong', { texte: nom }), etatE === 'en-cours' ? creer('span', { classe: 'w-pas__ici', texte: ' (vous êtes ici)' }) : null,
          etatE === 'faite' ? creer('span', { classe: 'fr-sr-only', texte: ' (terminée)' }) : null, fiche.titre ? ' : ' + fiche.titre : null]),

/* === SECTION : DOCUMENT SANS KANBAN ===
   Un document qui n'a encore aucun Kanban s'ouvre directement sur l'onglet

function ouvrirNouveauKanban() {

}

/* === SECTION : SAISIES ET RECAPITULATIFS === */
/* Saisie refusee : message d'erreur du systeme de design sous le champ, relie
   par aria-describedby, focus sur le champ et annonce. Ce n'est pas une
   anomalie : journalisation au niveau INFO. */
function marquerInvalide(id, message, sansFocus) {
  var n = document.getElementById(id);
  logSecurite('INFO', 'Saisie refusée : ' + message);
  if (!n) { signalerSaisie(message); return; }
  var idMsg = id + '_erreur';
  var ancien = document.getElementById(idMsg);
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  var msg = creer('p', { classe: 'fr-error-text', id: idMsg, texte: message });
  var groupe = n.closest ? n.closest('.fr-input-group') : null;
  if (groupe) { groupe.classList.add('fr-input-group--error'); groupe.appendChild(msg); }
  else if (n.parentNode) { n.parentNode.insertBefore(msg, n.nextSibling); }
  n.setAttribute('aria-invalid', 'true');
  n.setAttribute('aria-describedby', idMsg);
  var effacer = function () {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
    if (groupe) { groupe.classList.remove('fr-input-group--error'); }
    if (msg.parentNode) { msg.parentNode.removeChild(msg); }
    n.removeEventListener('input', effacer);
    n.removeEventListener('change', effacer);
  };
  n.addEventListener('input', effacer);
  n.addEventListener('change', effacer);
  if (!sansFocus) { n.focus(); }
  annoncer(message);
}

/* Refus de saisie sans champ a designer : banniere, sans niveau ERREUR. */
function signalerSaisie(message) {
  logSecurite('INFO', 'Saisie refusée : ' + message);
  toast(message, { type: 'erreur', duree: 10000 });
}

/* === SECTION : ASSISTANT KANBAN (creation et personnalisation) ===
   Un meme parcours en six etapes sert a creer un Kanban et a le
   personnaliser. Tout se fait sur un brouillon : rien n'est ecrit dans le
   document avant la derniere etape, ou les changements sont relus puis
   enregistres en une fois. "Annuler" abandonne le brouillon. */

function uid() { etat.uidSeq = (etat.uidSeq || 0) + 1; return 'u' + etat.uidSeq; }

/* Les nombres entiers, montants et pourcentages sont des nombres : seuls le
   type et le format de la colonne les distinguent. */
function genreStocke(code) { return genreParCode(code).stocke || code; }

function genreAffiche(col, g) {
  if (g !== 'nombre' || !col) { return g; }
  var o = col.options || {};
  if (o.numMode === 'currency') { return 'montant'; }
  if (o.numMode === 'percent') { return 'pourcentage'; }
  if (col.type === 'Int') { return 'entier'; }
  return g;
}

function genreParCode(code) {
  for (var i = 0; i < GENRES.length; i++) { if (GENRES[i].code === code) { return GENRES[i]; } }
  return GENRES[0];
}

function libelleGenre(g, col) {
  for (var i = 0; i < GENRES.length; i++) { if (GENRES[i].code === g) { return GENRES[i].libelle; } }
  return col ? libelleType(col) : 'Autre';
}

function optionsChoix(valeurs) {
  return { choices: valeurs.slice() };
}

function infoVide(libelle, genre) {
  return { uid: uid(), col: null, libelle: libelle || '', libelleInitial: null, genre: genre || 'texte', valeurs: [], valeursInitiales: [],
    echeance: false, responsable: false, supprimee: false, nouvelle: true, utilisee: true, utiliseeInitiale: true,
    surCarte: genre !== 'texte_long', dansFiche: true, typeFixe: false, valeursModifiables: true, peutSupprimer: true, ouverte: false };
}

/* Brouillon a partir d'une definition (modele, Kanban repris, Kanban
   vierge) : uniquement pour la creation. */
function brouillonDepuisDefinition(def) {
  var b = { mode: 'creation', source: 'creation', etape: 1, nom: def.nom || '', description: def.description || '',
    colonnes: [], infos: [], ordreCarte: [], ordreFiche: [], compact: false, recherche: true, filtres: [], filtreRetard: false, tri: null,
    nomsInfos: true, couverture: null, couleur: null,
    colonnesModifiables: true, colonnesOrdonnables: true, origine: def.origine || null, ignores: def.ignores || [] };
  var o = def.options || {};
  def.etapes.forEach(function (n) {
    b.colonnes.push({ uid: uid(), cle: null, nom: n, nomInitial: null, supprimee: false, dest: null, nb: 0 });
  });
  var parLib = {};
  (def.champs || []).forEach(function (ch) {
    var i = infoVide(ch.libelle, ch.genre);
    i.valeurs = (ch.valeurs || []).slice();
    i.echeance = !!ch.echeance && ch.genre === 'date';
    i.responsable = !!ch.responsable;
    if (ch.surCarte !== undefined) { i.surCarte = !!ch.surCarte; }
    if (ch.dansFiche !== undefined) { i.dansFiche = ch.dansFiche !== false; }
    b.infos.push(i);
    parLib[normaliser(ch.libelle)] = i.uid;
  });
  b.ordreCarte = b.infos.map(function (i) { return i.uid; });
  var of = (o.ordreFiche || []).map(function (l) { return parLib[normaliser(l)]; }).filter(Boolean);
  b.ordreFiche = of.concat(b.ordreCarte.filter(function (u) { return of.indexOf(u) === -1; }));
  b.compact = !!o.compact;
  b.recherche = o.recherche !== false;
  b.filtreRetard = o.filtreRetard !== undefined ? !!o.filtreRetard : b.infos.some(function (i) { return i.echeance; });
  if (o.filtres) { b.filtres = o.filtres.map(function (l) { return parLib[normaliser(l)]; }).filter(Boolean); }
  else { b.filtres = b.infos.filter(function (i) { return i.responsable; }).map(function (i) { return i.uid; }); }
  return b;
}

function brouillonVierge() {
  return brouillonDepuisDefinition({ nom: '', etapes: MODELES_ETAPES[0].slice(), champs: [
    { libelle: 'Description', genre: 'texte_long', surCarte: false },
    { libelle: 'Date d\'échéance', genre: 'date', echeance: true },
    { libelle: 'Responsable', genre: 'personne', responsable: true }] });

/* Brouillon a partir du Kanban affiche, pour le personnaliser. Pour un
   Kanban branche sur une table, toutes les colonnes de la table sont
   listees ; l'agent choisit celles a utiliser, sans jamais en creer ni en
   supprimer dans sa table. */
function brouillonDepuisConfig() {
  var c = etat.config;
  var src = c.sourceEtapes;
  var creation = c.mode === 'creation';
  var b = { mode: 'personnalisation', source: creation ? 'creation' : 'branche', etape: 1, nom: c.nom || '', description: c.description || '',
    colonnes: [], infos: [], compact: !!c.compact, recherche: c.recherche !== false, filtreRetard: !!c.filtreRetard,
    nomsInfos: c.nomsInfos !== false, couverture: null, couleur: null, historique: !!c.historique, archiveUid: null,
    tri: c.colOrdreCartes ? null : (c.tri ? { col: c.tri.col, sens: c.tri.sens } : { col: c.colTitre, sens: 'asc' }),
    colonnesModifiables: src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colAffichage),
    colonnesOrdonnables: src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colOrdre) };
  etat.etapes.forEach(function (e) {
    b.colonnes.push({ uid: uid(), cle: e.cle, id: e.id, nom: e.libelle, nomInitial: e.libelle,
      supprimee: false, dest: null, nb: cartesDeEtape(e.cle).length });
  });
  var cols;
  if (creation) {
    cols = c.champs.map(function (ch) { return colonneCartes(ch.col); }).filter(Boolean);
  } else {
    cols = colonnesDe(c.tableCartes).filter(function (col) {
      return col.colId !== c.colEtape && col.colId !== c.colTitre && col.colId !== c.colOrdreCartes && IDS_META.indexOf(col.colId) === -1 && IDS_TECHNIQUES.indexOf(col.colId) === -1;
    });
  }
  var parCol = {};
  cols.forEach(function (col) {
    var ch = champDe(col.colId);
    var g = genreAffiche(col, genreDe(col, ch));
    var i = infoVide(ch && ch.libelle ? ch.libelle : col.label, g);
    i.col = col.colId;
    i.libelleInitial = i.libelle;
    i.nouvelle = false;
    i.typeFixe = true;
    i.valeurs = GENRES_A_VALEURS.indexOf(g) !== -1 ? valeursProposees(col.colId) : [];
    i.valeursInitiales = i.valeurs.slice();
    i.valeursModifiables = !col.formule && (col.type === 'Choice' || col.type === 'ChoiceList');
    i.echeance = c.colEcheance === col.colId;
    i.responsable = c.colResponsable === col.colId;
    i.utilisee = !!ch;
    i.utiliseeInitiale = i.utilisee;
    i.surCarte = ch ? !!ch.surCarte : true;
    i.dansFiche = ch ? estDansFiche(ch) : true;
    i.peutSupprimer = creation;
    i.lectureSeule = !estModifiable(col, g);
    b.infos.push(i);
    parCol[col.colId] = i.uid;
  });
  var ordreC = c.champs.map(function (ch) { return parCol[ch.col]; }).filter(Boolean);
  b.ordreCarte = ordreC.concat(b.infos.map(function (i) { return i.uid; }).filter(function (u) { return ordreC.indexOf(u) === -1; }));
  var ordreF = champsOrdreFiche().map(function (ch) { return parCol[ch.col]; }).filter(Boolean);
  b.ordreFiche = ordreF.concat(b.ordreCarte.filter(function (u) { return ordreF.indexOf(u) === -1; }));
  b.filtres = (c.filtres || []).map(function (f) { return parCol[f]; }).filter(Boolean);
  b.couverture = c.couverture ? parCol[c.couverture] || null : null;
  b.couleur = c.couleur ? parCol[c.couleur] || null : null;
  var colArch = c.colonneArchive ? b.colonnes.filter(function (x) { return x.cle === c.colonneArchive; })[0] : null;
  b.archiveUid = colArch ? colArch.uid : null;
  b.initial = JSON.stringify(etatComparable(b));
  b.initCarte = sequenceVisible(b, 'ordreCarte', 'surCarte');
  b.initFiche = sequenceVisible(b, 'ordreFiche', 'dansFiche');
  return b;
}

/* Suite des informations visibles sur la carte ou dans la fiche, dans
   l'ordre : sert a detecter un changement de contenu ou d'ordre. */
function sequenceVisible(b, cle, prop) {
  return b[cle].map(function (u) {
    for (var i = 0; i < b.infos.length; i++) { if (b.infos[i].uid === u) { var x = b.infos[i]; return infoActive(x) && x[prop] ? u : null; } }
    return null;
  }).filter(Boolean).join('|');
}

/* Les champs qui definissent le Kanban, pour savoir si quelque chose a
   change depuis l'ouverture du brouillon. */
function etatComparable(b) {
  return { nom: b.nom, description: b.description, compact: b.compact, recherche: b.recherche, filtreRetard: b.filtreRetard, tri: b.tri,
    nomsInfos: b.nomsInfos, couverture: b.couverture, couleur: b.couleur, historique: !!b.historique, archive: b.archiveUid || null,
    colonnes: b.colonnes.map(function (x) { return [x.cle, x.nom, x.supprimee, x.dest]; }),
    infos: b.infos.map(function (i) { return [i.col, i.libelle, i.genre, i.valeurs, i.echeance, i.responsable, i.supprimee, i.utilisee, i.surCarte, i.dansFiche]; }),
    ordreCarte: b.ordreCarte, ordreFiche: b.ordreFiche, filtres: b.filtres };
}

function infoParUid(u) {
  var b = etat.brouillon;
  for (var i = 0; i < b.infos.length; i++) { if (b.infos[i].uid === u) { return b.infos[i]; } }
  return null;
}

function colonneParUid(u) {
  var b = etat.brouillon;
  for (var i = 0; i < b.colonnes.length; i++) { if (b.colonnes[i].uid === u) { return b.colonnes[i]; } }
  return null;
}

function infoActive(i) { return i && !i.supprimee && i.utilisee; }
function colonnesActives() {
  var b = etat.brouillon;
  var l = b.colonnes.filter(function (x) { return !x.supprimee; });
  /* La colonne d'archives est toujours la derniere. */
  var a = l.filter(function (x) { return x.uid === b.archiveUid; })[0];
  return a ? l.filter(function (x) { return x !== a; }).concat([a]) : l;
}

/* --- Points d'entree --- */
function demarrerCreation() {
  if (!etat.peutParametrer) { return; }
  etat.brouillon = { mode: 'creation', etape: 0 };
  afficherVue('assistant');
}

function ouvrirPersonnalisation() {
  if (!etat.peutParametrer) { return; }
  etat.brouillon = brouillonDepuisConfig();
  afficherVue('assistant');
}

/* Abandon d'une creation : confirmation si une etape a ete commencee. */
async function quitterAssistant() {
  var b = etat.brouillon;
  if (b && b.etape > 0) {
    var ok = await confirmerAction('Abandonner la création ?', 'Rien n\'a été créé. Les choix faits dans ces étapes ne sont pas conservés.', 'Abandonner');
    if (!ok) { return; }
  }
  etat.brouillon = null;
  if (etat.tableaux.length) { await chargerTout(); } else { ouvrirNouveauKanban(); }
}

/* --- Rendu general --- */
function rendreAssistantKanban(zone) {
  var b = etat.brouillon;
  if (b.mode === 'creation' && b.etape === 0) { rendreDepart(zone); return; }
  var n = b.etape;
  var perso = b.mode === 'personnalisation';
  var noms = perso ? ETAPES_PARAMETRAGE : PARCOURS.modele;
  var decalage = noms.length - (perso ? ETAPES_PARAMETRAGE.length : ETAPES_ASSISTANT.length);
  b.etapeMax = Math.max(b.etapeMax || 0, n);
  /* Parametrages : enregistrement automatique, etat affiche en continu,
     retour direct au Kanban. */
  var entete = perso
    ? enteteParametrage(etat.config.nom, 'Retour au Kanban', function () { return sortirParametrages(true); }, b.statut)
    : enteteCreation('Nouveau Kanban', quitterAssistant);
  var bloc = creer('div', { classe: 'w-assistant' }, [entete, stepper(decalage + n, noms, function (r) {
    if (!perso && r <= decalage) {
      return function () { b.etape = 0; if (r === 1) { b.choixDepart = null; } afficherVue('assistant'); };
    }
    var cible = r - decalage;
    if (!perso && cible > b.etapeMax + 1) { return null; }
    return function () { if (cible > n && !validerEtape(n)) { return; } allerEtape(cible); };
  })]);
  if (b.origine && n === 1) {
    bloc.appendChild(alerte('info', null, 'Prérempli à partir ' + b.origine + '. Tout reste modifiable.'
      + (b.ignores.length ? ' Non repris, faute d\'équivalent dans un nouveau Kanban : ' + b.ignores.join(', ') + '.' : '')));
  }
  var etape = [null, etapeGeneral, etapeColonnes, etapeInformations, etapeCarte, etapeFiche, etapeFiltres, etapeRecapitulatif][n];
  if (etape) { bloc.appendChild(etape()); }
  bloc.appendChild(piedAssistant(b, noms, decalage));
  zone.appendChild(bloc);
}

/* Pied de l'etape : en creation, la premiere etape revient au choix du
   modele et la derniere porte "Créer mon Kanban". */
function piedAssistant(b, noms, decalage) {
  var n = b.etape;
  var rang = decalage + n;
  var derniere = b.mode === 'creation' ? ETAPES_ASSISTANT.length : ETAPES_PARAMETRAGE.length;
  var precedente = null;
  if (n > 1) { precedente = { libelle: noms[rang - 2], action: function () { allerEtape(n - 1); } }; }
  else if (b.mode === 'creation') { precedente = { libelle: noms[rang - 2], action: function () { b.etape = 0; afficherVue('assistant'); } }; }
  return piedEtape(precedente,
    n < derniere ? { libelle: noms[rang], action: function () { if (validerEtape(n)) { allerEtape(n + 1); } } } : null,
    b.mode === 'creation' ? { libelle: 'Créer mon Kanban', action: validerAssistant, id: 'aCreer' } : null);
}

/* Noms des etapes, ranges selon b.etape (0 : Point de départ). */
function nomsEtapes(b) {
  return ['Point de départ'].concat(b.mode === 'creation' ? ETAPES_ASSISTANT : ETAPES_PARAMETRAGE);
}

function allerEtape(n) {
  /* "Modifier" du recapitulatif du branchement : retour a l'etape. */
  if (etat.vue === 'branchement') { relayer(allerEtapeBranchement(n), 'Retour à une étape'); return; }
  var b = etat.brouillon;
  if (n < 0) { return; }
  if (n === 0 && b.mode !== 'creation') { return; }
  b.etape = n;
  afficherVue('assistant');
}

/* Rerendu d'une etape apres un changement de structure, focus repose sur
   l'element indique. */
function redessinerEtape(focusId) {
  afficherVue('assistant', true);
  var f = focusId ? document.getElementById(focusId) : null;
  if (f) { f.focus(); } else { var t = document.getElementById('titreVue'); if (t) { t.focus(); } }
}

/* Apres chaque reglage : apercu redessine ; en parametrage, enregistrement
   automatique planifie. En creation, rien n'est ecrit avant la fin. */
function majAttente() {
  var b = etat.brouillon;
  majApercu();
  if (b && b.mode === 'personnalisation') { planifierSauvegarde(); }
}

function enParametrage() {
  return etat.vue === 'assistant' && !!etat.brouillon && etat.brouillon.mode === 'personnalisation';
}

function statutSauvegarde(texte, erreur) {
  var b = etat.brouillon;
  if (b) { b.statut = texte; }
  var z = document.getElementById('aStatut');
  if (z) { z.textContent = texte; z.classList.toggle('w-statut--erreur', !!erreur); }
}

function planifierSauvegarde() {
  var b = etat.brouillon;
  clearTimeout(b.minuterie);
  statutSauvegarde('Modification en cours…');
  b.minuterie = setTimeout(function () { relayer(sauvegarderBrouillon(), 'Enregistrement automatique'); }, DELAI_AUTOSAVE_MS);
}

/* Une saisie incomplete n'est pas enregistree : la raison est affichee. */
function raisonNonEnregistrable(b) {
  if (!b.nom.trim()) { return 'le Kanban n\'a pas de nom'; }
  var vus = {};
  var act = b.colonnes.filter(function (x) { return !x.supprimee; });
  if (!act.length) { return 'le Kanban doit garder au moins une colonne'; }
  for (var i = 0; i < act.length; i++) {
    var k = normaliser(act[i].nom);
    if (!k) { return 'une colonne n\'a pas de nom'; }
    if (vus[k]) { return 'deux colonnes portent le nom « ' + act[i].nom.trim() + ' »'; }
    vus[k] = true;
  }
  var noms = { titre: true };
  var infos = b.infos.filter(infoActive);
  for (var j = 0; j < infos.length; j++) {
    var n = normaliser(infos[j].libelle);
    if (!n) { return 'une information n\'a pas de nom'; }
    if (noms[n]) { return 'deux informations portent le nom « ' + infos[j].libelle.trim() + ' »'; }
    noms[n] = true;
  }
  return null;
}

async function sauvegarderBrouillon() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'personnalisation') { return; }
  clearTimeout(b.minuterie);
  if (b.enCours) { b.encore = true; return; }
  if (!compterChangements(b)) { statutSauvegarde(b.dernier ? 'Enregistré à ' + b.dernier : 'Les modifications sont enregistrées automatiquement.'); return; }
  var raison = raisonNonEnregistrable(b);
  if (raison) { statutSauvegarde('Non enregistré : ' + raison + '.', true); return; }
  b.enCours = true;
  statutSauvegarde('Enregistrement…');
  try {
    var cles = await appliquerBrouillon();
    await chargerMeta();
    verifierConfig();
    await reparerColonnesVides(etat.config);
    if (etat.config.historique) { await assurerHistorique(etat.config); }
    await chargerDonnees();
    await lireTableaux();
    consoliderBrouillon(b, cles);
    var d = new Date();
    b.dernier = (d.getHours() < 10 ? '0' : '') + d.getHours() + ' h ' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    if (etat.brouillon === b) {
      statutSauvegarde('Enregistré à ' + b.dernier);
      var t = document.getElementById('aTitrePerso');
      if (t) { t.textContent = titreParametrage(etat.config.nom); }
      var nav = document.querySelector('.w-onglets');
      if (nav && nav.parentNode) { nav.parentNode.replaceChild(ongletsKanbans(), nav); }
    }
  } catch (e) {
    b.enCours = false;
    statutSauvegarde('L\'enregistrement n\'a pas abouti.', true);
    afficherErreur('L\'enregistrement automatique n\'a pas abouti. Les paramétrages affichés ont été relus depuis le document.', e);
    try { await chargerMeta(); verifierConfig(); await chargerDonnees(); } catch (e2) { logSecurite('ERREUR', 'Relecture après échec', e2); }
    if (etat.brouillon === b) { var nb = brouillonDepuisConfig(); nb.etape = b.etape; etat.brouillon = nb; afficherVue('assistant', true); }
    return;
  }
  b.enCours = false;
  if (b.encore && etat.brouillon === b) { b.encore = false; await sauvegarderBrouillon(); }
}

/* Enregistre tout de suite ce qui attend ; vrai si plus rien n'attend. */
async function enregistrerMaintenant() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'personnalisation') { return true; }
  clearTimeout(b.minuterie);
  /* Attente bornee : un enregistrement bloque ne fige pas la sortie. */
  var limite = Date.now() + 30000;
  while (b.enCours && Date.now() < limite) { await new Promise(function (r) { setTimeout(r, 50); }); }
  await sauvegarderBrouillon();
  return !compterChangements(b);
}

/* Sortie des parametrages (bouton Retour ou onglet) : enregistre d'abord ;
   une saisie incomplete est signalee avant d'etre abandonnee. */
async function sortirParametrages(afficher) {
  var b = etat.brouillon;
  var ok = await enregistrerMaintenant();
  if (!ok) {
    var raison = raisonNonEnregistrable(b);
    var quitter = await confirmerAction('Quitter les paramétrages ?', 'Une modification n\'a pas pu être enregistrée' + (raison ? ' : ' + raison : '') + '. Elle sera perdue.', 'Quitter');
    if (!quitter) { return false; }
  }
  etat.brouillon = null;
  if (afficher) { await chargerTout(); }
  return true;
}

/* Apres enregistrement, le brouillon devient la nouvelle reference : les
   elements supprimes disparaissent, les nouveaux recoivent leur colonne. */
function consoliderBrouillon(b, cleParUid) {
  var src = etat.config.sourceEtapes;
  b.colonnes = b.colonnes.filter(function (x) { return !x.supprimee; });
  b.colonnes.forEach(function (x) {
    if (src.type === 'choice' || src.type === 'liste') { x.cle = x.nom.trim(); }
    else if (!x.cle && cleParUid[x.uid]) { x.cle = cleParUid[x.uid]; x.id = parseInt(x.cle, 10); }
    x.nomInitial = x.nom.trim();
    x.dest = null;
    x.nb = x.cle ? cartesDeEtape(x.cle).length : 0;
  });
  var retirees = b.infos.filter(function (i) { return i.supprimee; }).map(function (i) { return i.uid; });
  var garder = function (u) { return retirees.indexOf(u) === -1; };
  b.infos = b.infos.filter(function (i) { return !i.supprimee; });
  b.ordreCarte = b.ordreCarte.filter(garder);
  b.ordreFiche = b.ordreFiche.filter(garder);
  b.filtres = b.filtres.filter(garder);
  if (b.couverture && !garder(b.couverture)) { b.couverture = null; }
  if (b.couleur && !garder(b.couleur)) { b.couleur = null; }
  b.infos.forEach(function (i) {
    i.nouvelle = false; i.typeFixe = true; i.libelleInitial = i.libelle.trim();
    i.valeursInitiales = i.valeurs.slice(); i.utiliseeInitiale = i.utilisee;
  });
  b.initial = JSON.stringify(etatComparable(b));
  b.initCarte = sequenceVisible(b, 'ordreCarte', 'surCarte');
  b.initFiche = sequenceVisible(b, 'ordreFiche', 'dansFiche');
}

function boutonsOrdre(liste, index, nom, idBase, surDeplacer, suffixe) {
  return [
    bouton('Monter', 'discret', 'arrow-up-line', function () { surDeplacer(index, -1); }, { petit: true, iconeSeule: true, aria: 'Monter ' + nom + (suffixe || ''), desactive: index === 0, id: idBase + 'H' + index }),
    bouton('Descendre', 'discret', 'arrow-down-line', function () { surDeplacer(index, 1); }, { petit: true, iconeSeule: true, aria: 'Descendre ' + nom + (suffixe || ''), desactive: index === liste.length - 1, id: idBase + 'B' + index })
  ];
}

function echanger(tab, i, j) { var t = tab[i]; tab[i] = tab[j]; tab[j] = t; }

/* Les boutons d'une ligne nomment l'element qu'ils touchent ("Monter la
   colonne En attente"). Ce nom suit la saisie : le libelle est un modele
   ou {nom} est remplace a chaque frappe. */
function preparerLibelles(racine, prefixe, nomActuel) {
  Array.prototype.forEach.call(racine.querySelectorAll('button[aria-label]'), function (bt) {
    var a = bt.getAttribute('aria-label');
    if (a.indexOf(prefixe + nomActuel) !== -1) { bt.setAttribute('data-modele', a.split(prefixe + nomActuel).join(prefixe + '{nom}')); }
  });
}

function majLibelles(racine, nom) {
  Array.prototype.forEach.call(racine.querySelectorAll('button[data-modele]'), function (bt) {
    bt.setAttribute('aria-label', bt.getAttribute('data-modele').split('{nom}').join(nom));
  });
}

/* --- Etape 1 : general --- */
function etapeGeneral() {
  var b = etat.brouillon;
  var perso = b.mode === 'personnalisation';
  var nom = saisie('kNom', b.nom, { indice: 'Préparation du séminaire annuel' });
  var desc = saisie('kDesc', b.description, { multiligne: true, lignes: 5 });
  nom.addEventListener('input', function () { b.nom = nom.value; majAttente(); });
  desc.addEventListener('input', function () { b.description = desc.value; majAttente(); });
  var principal = [titreColonne('Le Kanban', null),
    groupeChamp('Nom du Kanban', nom, 'Visible en tête du Kanban et dans son onglet.', true),
    groupeChamp('Explication pour les utilisateurs (facultatif)', desc, 'Affichée sous le nom du Kanban. Par exemple : à quoi il sert, qui le met à jour, ce que signifie chaque colonne. Laissez vide si ce n\'est pas utile.')];
  if (!perso) { return grilleParam([], '1-1', principal, apercuEtape('Général')); }
  principal.push(creer('p', { classe: 'w-mention', texte: 'Table utilisée : « ' + libelleTable(etat.config.tableCartes) + ' ».' }));
  /* Kanban branche sur une table : le fil d'activite est une option, car il
     ajoute deux colonnes techniques a la table de l'agent. */
  if (!etat.config.colKanban) {
    principal.push(optionCase('kHistorique', 'Historique et commentaires des cartes', 'Chaque carte garde le fil de ses modifications, faites dans le Kanban comme dans la table, et peut recevoir des commentaires. Deux colonnes techniques sont ajoutées à votre table : ' + COL_HISTORIQUE + ' et ' + COL_COMMENTAIRE + '.', b.historique,
      function (v) { b.historique = v; majAttente(); }));
  }
  principal.push(encartDroits(TEXTES_DROITS));
  var danger = blocSupprimer('Supprimer le Kanban', etat.config.colKanban
    ? 'Le Kanban disparaît des onglets et ses cartes sont supprimées. Les autres Kanbans du document ne sont pas touchés.'
    : 'Le Kanban disparaît des onglets. Sa table et ses lignes restent dans le document.', recommencer);
  return grilleParam([principal, [danger]], '2-1', null, apercuEtape('Général'));
}

/* --- Etape 2 : les colonnes --- */
function apercuColonnes() {
  var act = colonnesActives();
  return creer('div', { classe: 'w-apercu-etapes', attrs: { role: 'img', 'aria-label': 'Aperçu : ' + act.length + ' colonnes, ' + act.map(function (x) { return x.nom || 'sans nom'; }).join(', ') } },
    act.map(function (x) { return creer('div', { texte: x.nom || 'Sans nom' }); }));
}

/* Parametrages : la suppression d'une colonne est enregistree aussitot,
   apres confirmation ; les cartes vont dans la colonne choisie. */
async function supprimerColonneParametrage(x) {
  var autres = colonnesActives().filter(function (y) { return y !== x; });
  var nom = x.nom || 'sans nom';
  if (!x.cle) {
    etat.brouillon.colonnes = etat.brouillon.colonnes.filter(function (y) { return y !== x; });
    majAttente(); redessinerEtape('kAjoutCol'); return;
  }
  if (!x.nb) {
    var ok = await confirmerAction('Supprimer la colonne « ' + nom + ' » ?', 'Elle ne contient aucune carte. La suppression est enregistrée aussitôt.', 'Supprimer');
    if (!ok) { return; }
    x.supprimee = true;
    await enregistrerMaintenant();
    redessinerEtape('kAjoutCol');
    return;
  }
  var sel = liste('kDestModale', autres.map(function (y) { return { valeur: y.uid, libelle: y.nom || 'Sans nom' }; }), autres[0].uid);
  ouvrirModale({ titre: 'Supprimer la colonne « ' + nom + ' » ?', etroite: true, focus: 'kDestModale',
    corps: [creer('p', { classe: 'w-texte', texte: (x.nb > 1 ? 'Ses ' + x.nb + ' cartes seront déplacées' : 'Sa carte sera déplacée') + ' dans la colonne choisie ci-dessous. La suppression est enregistrée aussitôt.' }),
      groupeChamp('Déplacer les cartes dans', sel)],
    pied: [creer('span', { classe: 'w-pousse' }), bouton('Annuler', 'secondaire', null, fermerModale),
      bouton('Supprimer la colonne', null, 'delete-line', async function () {
        x.supprimee = true;
        x.dest = sel.value;
        fermerModale();
        await enregistrerMaintenant();
        redessinerEtape('kAjoutCol');
      })] });
}

function etapeColonnes() {
  var b = etat.brouillon;
  var perso = b.mode === 'personnalisation';
  var principal = [];
  if (!b.colonnesModifiables) {
    principal.push(alerte('info', null, b.source === 'branche' && etat.config.sourceEtapes.type === 'text'
      ? 'Les colonnes viennent des valeurs saisies dans votre table : leurs noms ne se modifient pas ici.'
      : 'Les noms des colonnes viennent d\'une autre table : ils ne se modifient pas ici.'));
  } else if (!b.colonnesOrdonnables) {
    principal.push(alerte('info', null, 'L\'ordre des colonnes suit celui des lignes de la table ' + libelleTable(etat.config.sourceEtapes.table) + '. Pour le changer ici, ajoutez à cette table une colonne numérique ORDRE.'));
  } else {
    /* consigne dans l'aide du titre de colonne */
  }
  var ol = creer('ol', { classe: 'w-liste', attrs: { 'aria-label': 'Colonnes du Kanban, dans l\'ordre' } });
  var deplacer = function (i, d) { echanger(b.colonnes, i, i + d); majAttente(); redessinerEtape((d < 0 ? 'kColH' : 'kColB') + (i + d)); };
  b.colonnes.forEach(function (x, i) {
    var nomAff = x.nom || 'sans nom';
    var champNom;
    if (b.colonnesModifiables) {
      champNom = saisie('kCol' + i, x.nom);
      champNom.setAttribute('aria-label', 'Nom de la colonne ' + (i + 1));
      if (x.supprimee) { champNom.setAttribute('disabled', ''); }
      champNom.addEventListener('input', function () { x.nom = champNom.value; majLibelles(li, x.nom || 'sans nom'); majAttente(); });
    } else {
      champNom = creer('span', { classe: 'w-ligne__nom', texte: x.nom });
    }
    var li = creer('li', { classe: 'w-ligne' + (x.supprimee ? ' w-ligne--supprimee' : '') }, [
      b.colonnesOrdonnables && !x.supprimee ? creer('span', { classe: 'w-poignee fr-icon-drag-move-2-line', attrs: { 'aria-hidden': 'true' } }) : null,
      creer('span', { classe: 'w-ligne__num', texte: String(i + 1), attrs: { 'aria-hidden': 'true' } }),
      champNom,
      null
    ].concat(b.colonnesOrdonnables && !x.supprimee ? boutonsOrdre(b.colonnes, i, 'la colonne ' + nomAff, 'kCol', deplacer) : [])
      .concat(b.colonnesModifiables ? [x.supprimee
        ? bouton('Annuler la suppression', 'discret', 'arrow-go-back-line', function () { x.supprimee = false; x.dest = null; majAttente(); redessinerEtape('kCol' + i); },
          { petit: true, aria: 'Annuler la suppression de la colonne ' + nomAff, id: 'kColR' + i })
        : bouton('Supprimer', 'discret', 'delete-line', function () {
          if (colonnesActives().length === 1) { signalerSaisie('Le Kanban doit garder au moins une colonne.'); return; }
          if (perso) { return supprimerColonneParametrage(x); }
          x.supprimee = true;
          var autres = colonnesActives();
          x.dest = autres.length ? autres[0].uid : null;
          majAttente();
          redessinerEtape('kColR' + i);
        }, { petit: true, iconeSeule: true, aria: 'Supprimer la colonne ' + nomAff, id: 'kColS' + i })] : []));
    preparerLibelles(li, 'la colonne ', nomAff);
    ol.appendChild(li);
    if (x.supprimee) {
      var msg = creer('li', { classe: 'w-ligne w-ligne--detail-alerte' }, [creer('span', { classe: 'fr-icon-warning-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } })]);
      if (x.cle && x.nb) {
        var autresC = colonnesActives();
        var sel = liste('kDest' + i, autresC.map(function (y) { return { valeur: y.uid, libelle: y.nom || 'Sans nom' }; }), x.dest);
        sel.addEventListener('change', function () { x.dest = sel.value; majAttente(); });
        msg.appendChild(creer('label', { attrs: { 'for': 'kDest' + i }, texte: 'Cette colonne sera supprimée. ' + (x.nb > 1 ? 'Ses ' + x.nb + ' cartes iront' : 'Sa carte ira') + ' dans' }));
        msg.appendChild(sel);
      } else {
        msg.appendChild(creer('span', { texte: 'Cette colonne sera supprimée.' }));
      }
      ol.appendChild(msg);
    }
  });
  principal.push(ol);
  if (b.colonnesModifiables) {
    principal.push(creer('div', {}, [bouton('Ajouter une colonne', 'secondaire', 'add-line', function () {
      b.colonnes.push({ uid: uid(), cle: null, nom: '', nomInitial: null, supprimee: false, dest: null, nb: 0 });
      majAttente();
      redessinerEtape('kCol' + (b.colonnes.length - 1));
    }, { petit: true, id: 'kAjoutCol' })]));
  }
  if (b.colonnesOrdonnables) {
    brancherTriListe(ol, function (de, vers) {
      /* La liste contient les lignes de detail des colonnes supprimees, qui
         ne se deplacent pas : on retrouve les colonnes par leur position
         parmi les lignes deplacables. */
      var mobiles = b.colonnes.filter(function (x) { return !x.supprimee; });
      var item = mobiles[de];
      var cible = mobiles[vers];
      var a = b.colonnes.indexOf(item);
      b.colonnes.splice(a, 1);
      b.colonnes.splice(b.colonnes.indexOf(cible) + (vers > de ? 1 : 0), 0, item);
      majAttente();
      redessinerEtape(null);
      return Promise.resolve();
    });
  }
  /* Colonne d'archives, facultative : toujours en dernier, repliee sur le
     Kanban meme quand elle contient des cartes. */
  var options = [];
  if (b.colonnesModifiables) {
    var arch = b.colonnes.filter(function (x) { return x.uid === b.archiveUid && !x.supprimee; })[0];
    options.push(optionCase('kArchive', 'Colonne Archives à la fin du Kanban', 'Pour ranger les cartes terminées sans les supprimer. Elle reste repliée sur le Kanban, même quand elle contient des cartes ; un clic l\'ouvre le temps de consulter.', !!arch,
      function (coche) {
        if (coche) {
          var existante = b.colonnes.filter(function (x) { return !x.supprimee && x.nom.trim().toLowerCase() === 'archives'; })[0];
          if (!existante) {
            existante = { uid: uid(), cle: null, nom: 'Archives', nomInitial: null, supprimee: false, dest: null, nb: 0 };
            b.colonnes.push(existante);
          }
          b.archiveUid = existante.uid;
        } else {
          var col = b.colonnes.filter(function (x) { return x.uid === b.archiveUid; })[0];
          if (col && !col.cle) { b.colonnes.splice(b.colonnes.indexOf(col), 1); }
          b.archiveUid = null;
        }
        majAttente();
        redessinerEtape('kArchive');
      }));
  }
  return ecranColonnes([
    { titre: 'Colonnes du Kanban', id: 'kAideCol', aide: b.colonnesModifiables ? 'Les colonnes sont les étapes du travail. Renommez-les directement dans la liste ; faites-les glisser par leur poignée, ou utilisez les flèches, pour changer leur ordre.' : null, contenu: principal },
    options.length ? { titre: 'Options', contenu: options } : null], 'Les colonnes');
}

/* --- Etape 3 : les informations --- */
var SUGGESTIONS_RAPIDES = [
  { libelle: 'Description', genre: 'texte_long' }, { libelle: 'Date d\'échéance', genre: 'date', echeance: true },
  { libelle: 'Responsable', genre: 'personne', responsable: true }, { libelle: 'Priorité', genre: 'choix', valeurs: ['Basse', 'Normale', 'Haute'] },
  { libelle: 'Étiquettes', genre: 'etiquettes', valeurs: ['Urgent', 'À valider'] }, { libelle: 'Pièces jointes', genre: 'pj' }];

function ajouterInfo(def) {
  var b = etat.brouillon;
  var i = infoVide(def ? def.libelle : '', def ? def.genre : 'texte');
  if (def) {
    i.valeurs = (def.valeurs || []).slice();
    if (def.echeance) { attribuerRole(i, 'echeance'); }
    if (def.responsable) { attribuerRole(i, 'responsable'); }
  }
  i.ouverte = !def;
  b.infos.push(i);
  b.ordreCarte.push(i.uid);
  b.ordreFiche.push(i.uid);
  majAttente();
  redessinerEtape(def ? 'kAjoutInfo' : 'kInfoNom' + (b.infos.length - 1));
}

/* Un role (echeance, responsable) n'appartient qu'a une information. */
function attribuerRole(info, role) {
  etat.brouillon.infos.forEach(function (x) { x[role] = false; });
  info[role] = true;
}

function roleEcheancePossible(i) { return i.genre === 'date'; }
function roleResponsablePossible(i) { return ['personne', 'choix', 'texte', 'reference'].indexOf(i.genre) !== -1; }

function etapeInformations() {
  var b = etat.brouillon;
  var branche = b.source === 'branche';
  var consigne = (branche
    ? 'Voici les colonnes de votre table. Cochez celles que le Kanban utilise ; cliquez sur Modifier pour changer le nom affiché, les valeurs possibles ou le rôle. Votre table n\'est jamais modifiée dans sa structure ; décocher une colonne la retire du Kanban, pas de votre table.'
    : 'Une information est ce que l\'on note sur chaque carte. Cliquez sur Modifier pour changer son nom, ses valeurs possibles ou son rôle.')
    + ' Le rôle Échéance signale les cartes en retard ; le rôle Responsable ajoute une icône de personne sur la carte. Ce qui s\'affiche sur la carte et dans la fiche se choisit aux étapes suivantes.';
  var principal = [];
  var ul = creer('ul', { classe: 'w-liste', attrs: { 'aria-label': 'Informations des cartes' } });
  ul.appendChild(creer('li', { classe: 'w-ligne' }, [
    creer('span', { classe: 'w-ligne__nom' }, [creer('strong', { texte: 'Titre de la carte' })]),
    creer('span', { classe: 'w-ligne__info', texte: branche ? 'Colonne ' + colonneCartes(etat.config.colTitre).label : 'Texte' }),
    creer('span', { classe: 'fr-icon-lock-line fr-icon--sm', attrs: { 'aria-hidden': 'true', title: 'Toujours présent' } }),
    creer('span', { classe: 'fr-sr-only', texte: 'Toujours présent' })]));
  b.infos.forEach(function (info, i) {
    var nom = info.libelle || 'Nouvelle information';
    var roles = [];
    if (info.echeance) { roles.push(badge('Échéance', 'info')); }
    if (info.responsable) { roles.push(badge('Responsable', 'info')); }
    /* Liste encore vide : elle le serait aussi dans les cartes. */
    if (infoActive(info) && info.valeursModifiables && GENRES_A_VALEURS.indexOf(info.genre) !== -1 && !info.valeurs.length) { roles.push(badge('Aucune valeur', 'warning')); }
    var cbUtil = null;
    if (branche) {
      cbUtil = creer('input', { attrs: { type: 'checkbox', id: 'kUtil' + i, 'aria-label': 'Utiliser ' + nom }, coche: info.utilisee });
      cbUtil.addEventListener('change', function () { info.utilisee = cbUtil.checked; majAttente(); redessinerEtape('kUtil' + i); });
    }
    var ligneInfo = creer('li', { classe: 'w-ligne' + (info.supprimee ? ' w-ligne--supprimee' : '') + (info.ouverte ? ' w-ligne--ouverte' : ''), id: 'kInfoL' + i }, [
      cbUtil,
      creer('span', { classe: 'w-ligne__nom' }, [creer('strong', { texte: nom, id: 'kInfoT' + i })]),
      creer('span', { classe: 'w-ligne__info', texte: libelleGenre(info.genre, info.col && etat.config ? colonneCartes(info.col) : null)
        + (info.lectureSeule && info.col && etat.config ? ', non modifiable (' + raisonLectureSeule(colonneCartes(info.col), info.genre).replace(/^./, function (x) { return x.toLowerCase(); }) + ')' : '') }),
      roles.length ? creer('span', { classe: 'w-carte__badges' }, roles) : null,
      info.supprimee
        ? bouton('Annuler la suppression', 'discret', 'arrow-go-back-line', function () { info.supprimee = false; majAttente(); redessinerEtape('kInfoM' + i); },
          { petit: true, aria: 'Annuler la suppression de ' + nom, id: 'kInfoR' + i })
        : bouton(info.ouverte ? 'Fermer' : 'Modifier', 'discret', info.ouverte ? 'close-line' : 'edit-line', function () {
          info.ouverte = !info.ouverte; redessinerEtape(info.ouverte ? 'kInfoNom' + i : 'kInfoM' + i);
        }, { petit: true, aria: (info.ouverte ? 'Fermer ' : 'Modifier ') + nom, id: 'kInfoM' + i })
    ]);
    var bm = ligneInfo.querySelector('#kInfoM' + i);
    if (bm) { bm.setAttribute('aria-expanded', info.ouverte ? 'true' : 'false'); bm.setAttribute('data-modele', (info.ouverte ? 'Fermer ' : 'Modifier ') + '{nom}'); }
    ul.appendChild(ligneInfo);
    if (info.ouverte && !info.supprimee) { ul.appendChild(creer('li', { classe: 'w-detail' }, [detailInformation(info, i)])); }
    if (info.supprimee) {
      ul.appendChild(creer('li', { classe: 'w-ligne w-ligne--detail-alerte' }, [creer('span', { classe: 'fr-icon-warning-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } }),
        creer('span', { texte: info.nouvelle ? 'Cette information ne sera pas créée.' : 'Cette information sera supprimée.' })]));
    }
  });
  principal.push(ul);
  var ajouts = [];
  if (!branche) {
    principal.push(bouton('Ajouter une information', 'secondaire', 'add-line', function () { ajouterInfo(null); }, { petit: true, id: 'kAjoutInfo' }));
    var presentes = b.infos.filter(function (x) { return !x.supprimee; }).map(function (x) { return normaliser(x.libelle); });
    var rapides = SUGGESTIONS_RAPIDES.filter(function (s) { return presentes.indexOf(normaliser(s.libelle)) === -1; });
    if (rapides.length) {
      ajouts.push(creer('div', { classe: 'w-volet__actions' }, rapides.map(function (s) {
        return bouton(s.libelle, 'discret', 'add-line', function () { ajouterInfo(s); }, { petit: true, aria: 'Ajouter l\'information ' + s.libelle });

/* Grille des reglages : colonnes, pied sur toute la largeur, et l'apercu

/* Personnes du document : colonnes de nom des tables de personnes

var MOTIF_TABLE_PERSONNES = /UTILISATEUR|EQUIPE|TEAM|AGENT|PERSONNE|MEMBRE|ANNUAIRE|REGISTRE|CONTACT|STAGIAIRE|PARTICIPANT/;
function sourcesPersonnes() {
  var res = [];
  Object.keys((etat.meta || {}).tables || {}).forEach(function (tid) {
    var up = normaliser(tid).toUpperCase();
    if (estTableExclue(tid) || /KANBAN|LIBRARY|BIBLIOTHEQUE/.test(up) || !MOTIF_TABLE_PERSONNES.test(up)) { return; }
    var cols = (etat.meta.colonnes[tid] || []).filter(function (c) { return /^(Text|Any|Choice)$/.test(String(c.type).split(':')[0]); });
    var nomDe = function (re) { return cols.filter(function (c) { return re.test(normaliser(c.colId + ' ' + c.label).toUpperCase()); })[0]; };
    var complet = nomDe(/NOM_COMPLET|NOM COMPLET|PRENOM_NOM|PRENOM NOM|NOM_PRENOM|FULL ?NAME|\bNAME\b|AGENT/);
    var prenom = nomDe(/\bPRENOM\b|FIRST ?NAME/), nom = cols.filter(function (c) { return /^NOM$|^NOM_DE_FAMILLE$|^LAST_?NAME$/i.test(normaliser(c.colId)); })[0];
    var lib = etat.meta.tables[tid].libelle || tid.replace(/_/g, ' ');
    if (complet) { res.push({ tableId: tid, col: complet.colId, prenom: null, libelle: lib + ' : ' + complet.label }); }
    else if (prenom && nom) { res.push({ tableId: tid, col: nom.colId, prenom: prenom.colId, libelle: lib + ' : ' + prenom.label + ' et ' + nom.label }); }
    else if (nom) { res.push({ tableId: tid, col: nom.colId, prenom: null, libelle: lib + ' : ' + nom.label }); }
  });
  return res;
}

/* --- Validation des etapes --- */
function validerEtape(n) {
  var b = etat.brouillon;
  masquerErreur();
  if (n === 1 && !b.nom.trim()) { marquerInvalide('kNom', 'Donnez un nom au Kanban pour continuer.'); return false; }
  if (n === 2) {
    var act = colonnesActives();
    if (!act.length) { signalerSaisie('Le Kanban doit garder au moins une colonne.'); return false; }
    var vus = {};
    for (var i = 0; i < b.colonnes.length; i++) {
      var x = b.colonnes[i];
      if (x.supprimee) { continue; }
      var k = normaliser(x.nom);
      if (!k) { marquerInvalide('kCol' + i, 'La colonne ' + (i + 1) + ' n\'a pas de nom.'); return false; }
      if (vus[k]) { marquerInvalide('kCol' + i, 'Deux colonnes portent le même nom : ' + x.nom + '.'); return false; }
      vus[k] = true;
    }
  }
  if (n === 3) {
    var noms = { titre: true };
    for (var j = 0; j < b.infos.length; j++) {
      var inf = b.infos[j];
      if (!infoActive(inf)) { continue; }
      var kn = normaliser(inf.libelle);
      if (!kn) { inf.ouverte = true; redessinerEtape('kInfoNom' + j); marquerInvalide('kInfoNom' + j, 'Donnez un nom à cette information.'); return false; }
      if (noms[kn]) { inf.ouverte = true; redessinerEtape('kInfoNom' + j); marquerInvalide('kInfoNom' + j, 'Une autre information porte déjà ce nom.'); return false; }
      noms[kn] = true;
    }
  }
  return true;
}

/* Fin de la creation : les etapes 1 a 3 sont controlees une derniere fois,
   puis le Kanban est cree. */
async function validerAssistant() {
  for (var n = 1; n <= 3; n++) { if (!validerEtapeSansRendu(n)) { allerEtape(n); validerEtape(n); return; } }
  return creerDepuisBrouillon();
}

function validerEtapeSansRendu(n) {
  var b = etat.brouillon;
  if (n === 1) { return !!b.nom.trim(); }
  if (n === 2) {
    var vus = {};
    var act = colonnesActives();
    if (!act.length) { return false; }
    return act.every(function (x) { var k = normaliser(x.nom); if (!k || vus[k]) { return false; } vus[k] = true; return true; });
  }
  if (n === 3) {
    var noms = { titre: true };
    return b.infos.filter(infoActive).every(function (i) { var k = normaliser(i.libelle); if (!k || noms[k]) { return false; } noms[k] = true; return true; });
  }
  return true;
}

/* --- Creation a partir du brouillon --- */

  try {
    /* Premier Kanban du document : la bibliotheque et la table des cartes
       sont creees ensemble. Ensuite, plus aucune table : chaque Kanban
       ajoute ses cartes dans la meme table, et n'y ajoute que les colonnes
       qui n'existent pas encore. */

    var tidCartes = await preparerTableCartes();
    var defs = biblioAbsente ? [{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }] : [];
    if (!tidCartes) {

    }

      infos[n].colCree = await assurerColonneInfo(tidCartes, infos[n].libelle, infos[n].genre, pris);
      if (GENRES_A_VALEURS.indexOf(infos[n].genre) !== -1) { await unirChoix(tidCartes, infos[n].colCree, infos[n].valeurs); }
    }
    await unirChoix(tidCartes, 'COLONNE', noms);
    var colDe = function (u) { var i = infoParUid(u); return infoActive(i) ? i.colCree : null; };
    var ech = infos.filter(function (i) { return i.echeance; })[0];
    var resp = infos.filter(function (i) { return i.responsable; })[0];

    memoriserTableau(cleKanban);
    await ecrireConfig({
      mode: 'creation', nom: b.nom.trim(), description: b.description.trim(),
      tableCartes: tidCartes, colTitre: 'TITRE', colEtape: 'COLONNE', colKanban: COL_KANBAN, idKanban: cleKanban, historique: true,
      sourceEtapes: { type: 'liste', valeurs: noms },
      colonneArchive: (function () { var a = actives.filter(function (x) { return x.uid === b.archiveUid; })[0]; return a ? a.nom.trim() : null; })(),
      colOrdreCartes: 'ORDRE', tri: null,
      champs: infos.map(function (i) {
        var ch = { col: i.colCree, libelle: i.libelle.trim(), genre: genreStocke(i.genre), surCarte: !!i.surCarte, dansFiche: !!i.dansFiche };
        if (GENRES_A_VALEURS.indexOf(i.genre) !== -1) { ch.valeurs = i.valeurs.slice(); }
        return ch;
      }),
      ordreFiche: b.ordreFiche.map(colDe).filter(Boolean),
      colEcheance: ech ? ech.colCree : null, colResponsable: resp ? resp.colCree : null, compact: !!b.compact,
      recherche: !!b.recherche, filtres: b.filtres.map(colDe).filter(Boolean), filtreRetard: !!b.filtreRetard && !!ech,
      nomsInfos: b.nomsInfos !== false, couverture: b.couverture ? colDe(b.couverture) : null, couleur: b.couleur ? colDe(b.couleur) : null
    });
    var nomCree = b.nom.trim();
    etat.brouillon = null;
    await chargerTout();
    masquerLoader();
    afficherSucces('Votre Kanban « ' + nomCree + ' » est prêt.');
  } catch (e) {
    masquerLoader();
    afficherErreur('La création du Kanban n\'a pas abouti. Rien n\'a été supprimé : vous pouvez réessayer.', e);
  }
}

/* --- Personnalisation : application du brouillon ---
   Ordre : nouvelles colonnes (pour pouvoir y deplacer des cartes), noms,
   ordre, deplacement des cartes des colonnes supprimees puis suppression ;
   informations creees, valeurs, suppressions ; enfin la configuration. */
async function appliquerBrouillon() {
  var b = etat.brouillon;
  var c = etat.config;
  var src = c.sourceEtapes;
  {
    var cleParUid = {};
    var actives = colonnesActives();
    b.colonnes.forEach(function (x) { if (x.cle) { cleParUid[x.uid] = x.cle; } });
    if (b.colonnesModifiables && src.type === 'ref') {
      for (var i = 0; i < actives.length; i++) {
        var x = actives[i];
        if (x.cle) { continue; }
        var champs = {};
        champs[src.colAffichage] = x.nom.trim();
        var ret = await agir([['AddRecord', src.table, null, champs]]);
        x.id = ret && ret.retValues ? ret.retValues[0] : null;
        cleParUid[x.uid] = String(x.id);
      }
      var actions = [];
      actives.forEach(function (y) {
        if (y.cle && y.nom.trim() !== y.nomInitial) { var ch = {}; ch[src.colAffichage] = y.nom.trim(); actions.push(['UpdateRecord', src.table, y.id, ch]); }
      });
      if (src.colOrdre) {
        var maj = {};
        maj[src.colOrdre] = actives.map(function (_, k) { return (k + 1) * ORDRE_PAS; });
        actions.push(['BulkUpdateRecord', src.table, actives.map(function (y) { return parseInt(cleParUid[y.uid], 10); }), maj]);
      }
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) {
          var m = {};
          m[c.colEtape] = cartes.map(function () { return parseInt(cleParUid[y.dest], 10); });
          actions.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]);
        }
        actions.push(['RemoveRecord', src.table, y.id]);
      });
      if (actions.length) { await agir(actions); }
    } else if (b.colonnesModifiables && src.type === 'choice') {
      var col = colonneCartes(c.colEtape);
      var opts = JSON.parse(JSON.stringify(col.options || {}));
      var anciennes = opts.choiceOptions || {};
      var nouvellesOpts = {};
      var acts = [];
      actives.forEach(function (y) {
        var nom = y.nom.trim();
        cleParUid[y.uid] = nom;
        if (y.cle && anciennes[y.cle]) { nouvellesOpts[nom] = anciennes[y.cle]; }
        if (y.cle && nom !== y.cle) {
          var cartes = cartesDeEtape(y.cle);
          if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return nom; }); acts.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
        }
      });
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return cleParUid[y.dest]; }); acts.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
      });
      opts.choices = actives.map(function (y) { return y.nom.trim(); });
      if (opts.choiceOptions) { opts.choiceOptions = nouvellesOpts; }
      acts.push(['UpdateRecord', '_grist_Tables_column', col.ref, { widgetOptions: JSON.stringify(opts) }]);
      await agir(acts);
    }
    if (b.colonnesModifiables && src.type === 'liste') {
      /* Colonnes du Kanban rangees dans ses reglages : un renommage ou une
         suppression ne touche que les cartes de ce Kanban. */
      var actL = [];
      actives.forEach(function (y) {
        var nom = y.nom.trim();
        cleParUid[y.uid] = nom;
        if (y.cle && nom !== y.cle) {
          var cartes = cartesDeEtape(y.cle);
          if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return nom; }); actL.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
        }
      });
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return cleParUid[y.dest]; }); actL.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
      });
      if (actL.length) { await agir(actL); }
      src.valeurs = actives.map(function (y) { return y.nom.trim(); });
      await unirChoix(c.tableCartes, c.colEtape, src.valeurs);
    }
    /* Informations */
    var partagee = !!c.colKanban;
    if (b.source === 'creation') {
      var pris = IDS_RESERVES.concat(b.infos.filter(function (i) { return i.col; }).map(function (i) { return i.col.toUpperCase(); }));
      for (var j = 0; j < b.infos.length; j++) {
        var inf = b.infos[j];
        if (inf.supprimee && !inf.nouvelle && inf.col) {
          if (partagee) {
            /* Table partagee : le contenu est efface des cartes de ce Kanban ;
               la colonne n'est supprimee que si aucun autre Kanban ne s'en sert. */
            var ids = etat.cartes.map(function (x) { return x.id; });
            if (ids.length) { var vide = {}; vide[inf.col] = ids.map(function () { return null; }); await agir([['BulkUpdateRecord', c.tableCartes, ids, vide]]); }
            if (!colonneUtiliseeAilleurs(c.tableCartes, inf.col)) { await agir([['RemoveColumn', c.tableCartes, inf.col]]); }
          } else {
            await agir([['RemoveColumn', c.tableCartes, inf.col]]);
          }
          continue;
        }
        if (inf.nouvelle && !inf.supprimee) {
          if (partagee) {
            inf.col = await assurerColonneInfo(c.tableCartes, inf.libelle, inf.genre, pris);
            if (GENRES_A_VALEURS.indexOf(inf.genre) !== -1) { await unirChoix(c.tableCartes, inf.col, inf.valeurs); }
          } else {
            var base = versIdentifiant(inf.libelle);
            var id = base;
            var k = 2;
            var tous = IDS_RESERVES.concat(colonnesDe(c.tableCartes).map(function (x) { return x.colId.toUpperCase(); }));
            while (tous.indexOf(id) !== -1) { id = base + '_' + k; k++; }
            var o = GENRES_A_VALEURS.indexOf(inf.genre) !== -1 ? optionsChoix(inf.valeurs) : (inf.genre === 'texte_long' ? { wrap: true } : (genreParCode(inf.genre).options || null));
            inf.col = await ajouterColonne(c.tableCartes, id, genreParCode(inf.genre).type, o);
          }
        }
      }
    }
    for (var v = 0; v < b.infos.length; v++) {
      var iv = b.infos[v];
      if (!infoActive(iv) || iv.nouvelle || !iv.valeursModifiables) { continue; }
      if (JSON.stringify(iv.valeurs) === JSON.stringify(iv.valeursInitiales)) { continue; }
      if (partagee && b.source === 'creation') { await unirChoix(c.tableCartes, iv.col, iv.valeurs); continue; }
      var cc = colonneCartes(iv.col);
      var op = JSON.parse(JSON.stringify(cc.options || {}));
      op.choices = iv.valeurs.slice();
      await agir([['UpdateRecord', '_grist_Tables_column', cc.ref, { widgetOptions: JSON.stringify(op) }]]);
    }
    /* Configuration */
    var colDe = function (u) { var i = infoParUid(u); return infoActive(i) ? i.col : null; };
    var ech = b.infos.filter(function (i) { return infoActive(i) && i.echeance; })[0];
    var resp = b.infos.filter(function (i) { return infoActive(i) && i.responsable; })[0];
    c.nom = b.nom.trim();
    c.description = b.description.trim();
    c.historique = c.colKanban ? true : !!b.historique;
    c.colonneArchive = b.archiveUid && cleParUid[b.archiveUid] ? String(cleParUid[b.archiveUid]) : null;
    c.compact = !!b.compact;
    c.recherche = !!b.recherche;
    c.filtreRetard = !!b.filtreRetard && !!ech;
    c.colEcheance = ech ? ech.col : null;
    c.colResponsable = resp ? resp.col : null;
    c.filtres = b.filtres.map(colDe).filter(Boolean);
    c.ordreFiche = b.ordreFiche.map(colDe).filter(Boolean);
    c.champs = b.ordreCarte.map(infoParUid).filter(infoActive).map(function (i) {
      var ch = { col: i.col, surCarte: !!i.surCarte, dansFiche: !!i.dansFiche };
      if (b.source === 'creation') {
        ch.libelle = i.libelle.trim();
        ch.genre = genreStocke(i.genre);
        if (c.colKanban && GENRES_A_VALEURS.indexOf(i.genre) !== -1) { ch.valeurs = i.valeurs.slice(); }
      }
      else if (i.libelle.trim() !== (colonneCartes(i.col) || {}).label) { ch.libelle = i.libelle.trim(); }
      return ch;
    });
    if (b.tri) { c.tri = { col: b.tri.col, sens: b.tri.sens }; }
    c.nomsInfos = b.nomsInfos !== false;
    c.couverture = b.couverture ? colDe(b.couverture) : null;
    c.couleur = b.couleur ? colDe(b.couleur) : null;
    await ecrireConfig(c);
    return cleParUid;
  }
}

/* Point de depart en une question : le document contient-il deja des
   donnees ? A l'etape 2, chaque branche commence par un Kanban vierge,
   puis propose les suggestions (avec donnees) ou les modeles et les Kanbans
   du document (sans donnees) : repartir d'un Kanban revient a s'en servir
   comme modele. */
function rendreDepart(zone) {
  var b = etat.brouillon;
  if (b.choixDepart === 'modele') { rendreChoixModele(zone); return; }
  var bloc = creer('div', { classe: 'w-assistant' });
  bloc.appendChild(enteteCreation('Nouveau Kanban', etat.tableaux.length ? quitterAssistant : null));
  bloc.appendChild(stepper(1, ['Point de départ'], null));
  var option = function (id, icone, titre, texte, libelle, action, principal) {
    return creer('section', { classe: 'w-tuile w-tuile--depart', attrs: { 'aria-labelledby': id } }, [
      creer('span', { classe: 'fr-icon-' + icone + ' fr-icon--lg w-tuile__icone', attrs: { 'aria-hidden': 'true' } }),
      creer('h3', { classe: 'fr-h5 fr-m-0', id: id, texte: titre }),
      creer('p', { classe: 'w-texte w-mention', texte: texte }),
      creer('div', { classe: 'w-tuile__bas' }, [bouton(libelle, principal ? null : 'secondaire', 'arrow-right-line', action, { id: id + 'Bouton', iconeDroite: true })])
    ]);
  };
  /* Une seule question au depart : le document contient-il deja des
     donnees ? La suite (suggestions ou parametrage libre d'une part,
     modele ou Kanban vierge d'autre part) vient a l'etape 2. */
  var aDesDonnees = tablesBranchables().length > 0;
  var nbSug = aDesDonnees ? suggestionsDeDonnees().length : 0;
  var texteDonnees = !aDesDonnees ? 'Ce document ne contient encore aucune table de données : cette possibilité sera proposée dès qu\'il en aura une.'
    : (nbSug ? 'Le widget a analysé vos tables et vous suggère ' + (nbSug > 1 ? nbSug + ' Kanbans prêts' : 'un Kanban prêt') + ' à l\'emploi. Vous pouvez aussi le paramétrer vous-même à partir de la table de votre choix.'
      : 'Le widget n\'a pas trouvé de Kanban à vous suggérer d\'après vos tables : vous le paramétrez vous-même à partir de la table de votre choix.');
  var tuileDonnees = option('dDonnees', 'table-line', 'J\'ai déjà des données', texteDonnees,
    'Partir de mes données', function () { return demarrerBranchement(); }, aDesDonnees);
  if (!aDesDonnees) { tuileDonnees.querySelector('button').disabled = true; }
  bloc.appendChild(creer('div', { classe: 'w-tuiles' }, [tuileDonnees,
    option('dSans', 'add-line', 'Je n\'ai pas encore de données', etat.tableaux.length ? 'Le widget crée tout pour vous : partez d\'un modèle prêt à l\'emploi, d\'un de vos Kanbans ou d\'un Kanban vierge.'
        : 'Le widget crée tout pour vous : partez d\'un modèle prêt à l\'emploi ou d\'un Kanban vierge.',
      'Partir d\'un modèle', function () { b.choixDepart = 'modele'; afficherVue('assistant'); }, !aDesDonnees)
  ]));
  zone.appendChild(bloc);
}

function rendreChoixModele(zone) {

      creer('p', { classe: 'w-texte w-mention', texte: m.description }),
      creer('p', { classe: 'w-mention', texte: 'Colonnes : ' + m.etapes.join(', ') }),
      creer('div', { classe: 'w-tuile__bas' }, [bouton('Utiliser ce modèle', 'secondaire', 'arrow-right-line', function () { appliquerModele(m); },
        { petit: true, aria: 'Utiliser ce modèle : ' + m.nom })])
    ]));
  });
  bloc.appendChild(creer('section', { attrs: { 'aria-labelledby': 'mTypes' } }, [creer('h3', { classe: 'fr-h6', id: 'mTypes', texte: 'Modèles prêts à l\'emploi' }), tuiles]));
  if (etat.tableaux.length) {
    var existants = creer('div', { classe: 'w-tuiles w-tuiles--grille' });
    etat.tableaux.forEach(function (t) {
      var cfg = t.config;
      var infos = (cfg.champs || []).map(function (ch) { var col = infoColonne(cfg.tableCartes, ch.col); return ch.libelle || (col ? col.label : ch.col); });
      var desc = cfg.description ? (cfg.description.length > 140 ? cfg.description.slice(0, 137) + '…' : cfg.description) : null;
      existants.appendChild(creer('section', { classe: 'w-tuile w-tuile--existant', attrs: { 'aria-label': cfg.nom || 'Sans nom' } }, [
        creer('p', { classe: 'fr-m-0' }, [badge('Kanban de ce document', 'info')]),
        creer('h4', { classe: 'fr-h6 fr-m-0' }, [creer('span', { classe: 'fr-icon-folder-2-line fr-mr-1w', attrs: { 'aria-hidden': 'true' } }), cfg.nom || 'Sans nom']),
        desc ? creer('p', { classe: 'w-texte w-mention', texte: desc }) : null,
        creer('p', { classe: 'w-mention', texte: infos.length ? 'Sur les cartes : ' + infos.join(', ') : 'Le titre seulement sur les cartes' }),
        creer('p', { classe: 'w-mention', texte: 'Reprend ses colonnes, ses informations et ses réglages, sans les cartes.' }),
        creer('div', { classe: 'w-tuile__bas' }, [bouton('Repartir de ce Kanban', 'secondaire', 'arrow-right-line', function () { return repartirDeTableau(t); },
          { petit: true, aria: 'Repartir de ce Kanban : ' + (cfg.nom || '') })])
      ]));
    });
    bloc.appendChild(creer('section', { attrs: { 'aria-labelledby': 'mVos' } }, [creer('h3', { classe: 'fr-h6', id: 'mVos', texte: 'Repartir d\'un Kanban de ce document' }), existants]));
  }
  zone.appendChild(bloc);
}

function appliquerModele(m) {
  etat.brouillon = brouillonDepuisDefinition({ nom: m.nom, description: m.description, etapes: m.etapes, champs: m.champs, options: m.options, origine: 'du modèle « ' + m.nom + ' »' });
  etat.brouillon.choixDepart = 'modele';
  afficherVue('assistant');
}

/* Reprend la structure d'un Kanban du document. Les colonnes sont lues dans
   leur source ; une information de type reference devient une liste de
   choix dont les valeurs sont les lignes visees ; les types sans equivalent
   dans un nouveau tableau sont signales et ignores. */
async function repartirDeTableau(t) {
  afficherLoader('Lecture du Kanban…');
  try {
    await chargerMeta();
    var cfg = t.config;
    var tc = cfg.tableCartes;
    if (!etat.meta.tables[tc]) { throw new Error('Table des cartes absente : ' + tc); }
    var colE = infoColonne(tc, cfg.colEtape);
    var etapes = [];
    var parCle = {};
    var cible = colE ? tableCibleRef(colE.type) : null;
    if (cfg.sourceEtapes && cfg.sourceEtapes.type === 'liste') {
      (cfg.sourceEtapes.valeurs || []).forEach(function (v) { etapes.push(v); parCle[v] = v; });
    } else if (colE && cible && colE.type.indexOf('Ref:') === 0) {
      var aff = colAffichageRef(colE) || (cfg.sourceEtapes && cfg.sourceEtapes.colAffichage);
      var ord = cfg.sourceEtapes && cfg.sourceEtapes.colOrdre;
      var e = await lireTable(cible);
      var lignes = [];
      for (var i = 0; i < e.id.length; i++) {
        lignes.push({ id: e.id[i], lib: aff ? colonneDe(e, aff, i) : null, o: ord ? colonneDe(e, ord, i) : colonneDe(e, 'manualSort', i) });
      }
      lignes.sort(function (x, y) { return (typeof x.o === 'number' ? x.o : 1e15) - (typeof y.o === 'number' ? y.o : 1e15) || x.id - y.id; });
      lignes.forEach(function (l) { if (l.lib) { etapes.push(String(l.lib)); parCle[String(l.id)] = String(l.lib); } });
    } else if (colE && colE.type === 'Choice') {
      choixDe(colE).forEach(function (v) { etapes.push(v); parCle[v] = v; });
    } else if (colE) {
      var d = await lireTable(tc);
      var vus = {};
      (d[cfg.colEtape] || []).forEach(function (v) { if (v && typeof v === 'string' && !vus[v]) { vus[v] = true; etapes.push(v); parCle[v] = v; } });
      etapes.sort(function (x, y) { return x.localeCompare(y, 'fr'); });
    }
    if (!etapes.length) { etapes = MODELES_ETAPES[0].slice(); }
    var champs = [];
    var ignores = [];
    var libParCol = {};
    for (var k = 0; k < (cfg.champs || []).length; k++) {
      var ch = cfg.champs[k];
      var col = infoColonne(tc, ch.col);
      if (!col) { continue; }
      var lib = ch.libelle || col.label;
      var g = genreAffiche(col, ch.genre || genreDe(col, null));
      var valeurs = [];
      if (g === 'reference') {
        try {
          var r = await chargerRef(tableCibleRef(col.type), colAffichageRef(col));
          valeurs = r.ids.map(function (id) { return r.libelles[id]; });
          g = 'choix';
        } catch (e2) {
          ignores.push(lib);
          continue;
        }
      } else if (['references', 'autre'].indexOf(g) !== -1) {
        ignores.push(lib);
        continue;
      } else if (GENRES_A_VALEURS.indexOf(g) !== -1) {
        valeurs = Array.isArray(ch.valeurs) ? ch.valeurs.slice() : choixDe(col);
      }
      libParCol[ch.col] = lib;
      champs.push({ libelle: lib, genre: g, valeurs: valeurs, echeance: ch.col === cfg.colEcheance, responsable: ch.col === cfg.colResponsable,
        surCarte: ch.surCarte, dansFiche: ch.dansFiche });
    }
    var parCol = function (l) { return (l || []).map(function (x) { return libParCol[x]; }).filter(Boolean); };
    etat.brouillon = brouillonDepuisDefinition({ nom: (cfg.nom || 'Tableau') + ' (copie)', description: cfg.description || '', etapes: etapes, champs: champs,

/* Contexte du panneau d'aide : etapes du parcours en cours, rang de
   l'etape courante (-1 sur l'ecran principal) et un repere. */
function contexteAide() {
  var creation = 'Rien n\'est enregistré avant « Créer mon Kanban ».';
  if (etat.vue === 'branchement' && etat.assistant) {
    return { etapes: PARCOURS.donnees, courante: etat.assistant.etape + 1, repere: creation };
  }
  var b = etat.brouillon;
  if (etat.vue === 'assistant' && b) {
    if (b.mode === 'personnalisation') { return { etapes: ETAPES_PARAMETRAGE, courante: b.etape - 1, repere: 'Les modifications sont enregistrées automatiquement.' }; }
    var decalage = PARCOURS.modele.length - ETAPES_ASSISTANT.length;
    return { etapes: PARCOURS.modele, courante: b.etape === 0 ? (b.choixDepart === 'modele' ? 1 : 0) : decalage + b.etape - 1, repere: creation };
  }
  if (etat.config) {
    return { etapes: ETAPES_PARAMETRAGE, courante: -1,
      repere: etat.peutParametrer ? 'Pour changer ces réglages : « Paramétrages de ce Kanban », en bas du panneau de gauche.' : 'Le paramétrage est réservé aux personnes qui gèrent le document.' };
  }
  return { etapes: PARCOURS.modele, courante: -1, repere: null };
}

/* --- Apercu des etapes (propre au Kanban) ---
   Avec les reglages en cours et des valeurs d'exemple, sans rien ecrire :
   en-tete du Kanban, ses colonnes, une carte, la fiche, le panneau de
   gauche. Dans le branchement, la carte montre les colonnes cochees. */
function apercuContenu(nom) {
  var boite = function (n) { return creer('div', { classe: 'w-apercu-boite' }, [n]); };
  if (etat.vue === 'branchement') {
    var a = etat.assistant;
    if (!a || !a.table) { return null; }
    if (nom === 'Les colonnes de la table') { return { contenu: creer('div', { id: 'bApercuEtape', attrs: { 'aria-live': 'polite' } }), note: 'Les colonnes du Kanban, d\'après la colonne choisie.' }; }
    if ((nom === 'La carte' || nom === 'Récapitulatif') && a.colTitre) { return { contenu: boite(apercuCarteBranchement(a)), note: 'Une carte, avec les colonnes cochées et des valeurs d\'exemple.' }; }
    return null;
  }
  var b = etat.brouillon;
  if (!b || !b.infos) { return null; }
  if (nom === 'Général') {
    return { contenu: creer('div', { classe: 'w-apercu-blanc' }, [creer('p', { classe: 'fr-h6 fr-mb-0', texte: b.nom || 'Nom du Kanban' }),
      b.description ? creer('p', { classe: 'w-mention', texte: b.description }) : null]), note: 'En tête du Kanban.' };
  }
  if (nom === 'Les colonnes') { return { contenu: apercuColonnes(), note: 'Les colonnes du Kanban, de gauche à droite.' }; }
  if (nom === 'Les informations' || nom === 'La carte') { return { contenu: boite(apercuCarte()), note: 'Une carte, avec des valeurs d\'exemple.' }; }
  if (nom === 'La fiche') { return { contenu: apercuFiche(), note: 'Les informations de la fiche, dans l\'ordre.' }; }
  if (nom === 'Affichage et filtres') { return { contenu: apercuVolet(), note: 'Le panneau de gauche du Kanban.' }; }
  if (nom === 'Récapitulatif') { return { contenu: creer('div', { classe: 'w-apercu__pile' }, [apercuColonnes(), boite(apercuCarte())]), note: 'Votre Kanban, avec une carte d\'exemple.' }; }
  return null;
}

/* Carte d'exemple du branchement : le titre, puis chaque colonne cochee
   avec une valeur d'exemple de son type. */
function apercuCarteBranchement(a) {
  var art = creer('div', { classe: 'w-carte', attrs: { 'aria-hidden': 'true' } });
  art.appendChild(creer('p', { classe: 'w-carte__titre w-apercu-titre', texte: 'Exemple de carte' }));
  var infos = creer('div', { classe: 'w-carte__infos' });
  autresColonnes(a).filter(function (c) { return a.champs[c.colId]; }).forEach(function (c) {

    infos.appendChild(creer('span', { classe: 'w-carte__info' }, [c.colId === a.colEcheance ? creer('span', { classe: 'fr-icon-calendar-line fr-icon--sm w-carte__ico', attrs: { 'aria-hidden': 'true' } }) : null,
      creer('span', { classe: 'w-carte__libelle', texte: c.label }), creer('span', { classe: 'w-carte__valeur', texte: v })]));
  });
  if (infos.childNodes.length) { art.appendChild(infos); }
  return art;

async function demarrerBranchement() {
  afficherLoader('Lecture de vos tables…');
  try {
    await chargerMeta();
    etat.assistant = nouvelAssistantBranchement(etat.tableLiee && tablesBranchables().indexOf(etat.tableLiee) !== -1 && !tableauDeTable(etat.tableLiee) ? etat.tableLiee : null);
    etat.assistant.etape = 0;
    masquerLoader();
    afficherVue('branchement');
  } catch (e) {
    masquerLoader();
    afficherErreur('La lecture des tables du document n\'a pas abouti.', e);
  }
}

function nouvelAssistantBranchement(table) {
  return { mode: 'branchement', etape: 1, table: table, colEtape: null, colTitre: null, champs: {}, ordre: 'manuel', triCol: '', triSens: 'asc',
    colEcheance: '', colResponsable: '', apercuEtapes: null };
}

/* Kanbans suggeres a partir des tables du document : pour chaque table non
   encore utilisee, le widget cherche une colonne qui ressemble a une etape
   (liste de choix ou reference, nom evoquant un statut, un etat, une
   phase...) et un titre. Les meilleures propositions sont presentees en
   premier ; aucune n'est appliquee sans validation. */
function suggestionsDeDonnees() {
  var res = [];
  tablesBranchables().forEach(function (tid) {
    if (tableauDeTable(tid)) { return; }
    var a = nouvelAssistantBranchement(tid);
    proposerAssociations(a);
    if (!a.colEtape || !a.colTitre) { return; }
    var colE = infoColonne(tid, a.colEtape);
    var score = (colE.type === 'Choice' ? 3 : (colE.type.indexOf('Ref:') === 0 ? 2 : 0)) + (evoqueRole(colE, 'etape') ? 2 : 0)
      + (a.colEcheance ? 1 : 0) + (a.colResponsable ? 1 : 0);
    res.push({ a: a, score: score, colE: colE, nom: libelleTable(tid) + ' par ' + colE.label });
  });
  return res.sort(function (x, y) { return y.score - x.score; }).slice(0, 6);
}

  var vierge = creer('div', { classe: 'w-tuiles w-tuiles--grille' }, [creer('section', { classe: 'w-tuile', attrs: { 'aria-label': 'Kanban vierge' } }, [

    creer('p', { classe: 'w-mention', texte: 'À partir de ' + (nbTables > 1 ? 'l\'une de vos ' + nbTables + ' tables' : 'votre table') }),
    creer('div', { classe: 'w-tuile__bas' }, [bouton('Partir de zéro', 'secondaire', 'arrow-right-line', function () { etat.assistant.etape = 1; afficherVue('branchement'); },
      { petit: true, id: 'sMoiMeme' })])])]);
  bloc.appendChild(creer('section', { attrs: { 'aria-labelledby': 'sVierge' } }, [creer('h3', { classe: 'fr-h6', id: 'sVierge', texte: 'Partir de zéro' }), vierge]));

        zoneCol.textContent = 'Colonnes : ' + r.ids.map(function (id) { return r.libelles[id]; }).join(', ');

function tableauDeTable(tid) {
  for (var i = 0; i < etat.tableaux.length; i++) { if (etat.tableaux[i].config.tableCartes === tid) { return etat.tableaux[i]; } }
  return null;
}

function tablesBranchables() {
  return Object.keys(etat.meta.tables).filter(function (tid) {
    var t = etat.meta.tables[tid];
    return !estTableExclue(tid) && !t.resume && tid.toUpperCase().indexOf(ID_BIBLIO) === -1 && !(tid.toUpperCase().indexOf(ID_TABLE_CARTES) === 0 && infoColonne(tid, COL_KANBAN));
  }).sort(function (x, y) { return x.localeCompare(y, 'fr'); });
}

/* Raison pour laquelle une colonne ne peut pas porter l'etape, ou null si
   elle le peut. Les raisons sont redigees pour l'agent. */
function raisonRefusEtape(c) {
  var typeOk = c.type === 'Choice' || c.type === 'Text' || c.type === 'Any' || c.type.indexOf('Ref:') === 0;
  if (c.type === 'ChoiceList') { return 'choix multiples : une carte ne peut pas être dans deux colonnes à la fois'; }
  if (!typeOk) { return null; }
  if (c.formule) { return 'colonne calculée : le Kanban ne pourrait pas y écrire l\'étape quand une carte est déplacée'; }
  if (estEcrasee(c)) { return 'sa formule de déclenchement recalcule la valeur à chaque modification : un déplacement de carte serait aussitôt annulé'; }
  return '';
}

function colonnesEtapePossibles(tid) {
  return colonnesDe(tid).filter(function (c) { return raisonRefusEtape(c) === ''; });
}

/* Colonnes qui ressemblent a une colonne d'etape mais sont ecartees. Les
   dates, nombres, cases a cocher ne sont pas listees : elles ne peuvent
   evidemment pas servir d'etape. */
function colonnesEtapeEcartees(tid) {
  return colonnesDe(tid).filter(function (c) {
    var r = raisonRefusEtape(c);
    return r !== null && r !== '' && IDS_META.indexOf(c.colId) === -1 && IDS_TECHNIQUES.indexOf(c.colId) === -1;
  });
}

function colonnesTitrePossibles(tid) {
  return colonnesDe(tid).filter(function (c) { return c.type === 'Text' || c.type === 'Any'; });
}

function rendreBranchement(zone) {
  var a = etat.assistant;
  if (a.etape === 0) { rendreSuggestions(zone); return; }
  var bloc = creer('div', { classe: 'w-assistant' });
  var noms = PARCOURS.donnees;
  var rang = a.etape + 2;
  a.etapeMax = Math.max(a.etapeMax || 0, a.etape);
  bloc.appendChild(enteteCreation('Nouveau Kanban', annulerAssistant));
  bloc.appendChild(stepper(rang, noms, function (r) {
    if (r === 1) { return function () { etat.assistant = null; demarrerCreation(); }; }
    if (r === 2) { return function () { a.suggestion = null; a.etape = 0; afficherVue('branchement'); }; }
    return r - 2 <= a.etapeMax + 1 ? function () { return allerEtapeBranchement(r - 2); } : null;
  }));
  if (a.suggestion && a.etape === 4) { bloc.appendChild(alerte('info', null, 'Suggestion « ' + a.suggestion + ' » : vérifiez les choix ci-dessous. Les boutons « Modifier » et la barre d\'étapes permettent de tout ajuster.')); }

  while (pris.indexOf(n) !== -1) { n = 'ORDRE_KANBAN_' + k; k++; }
