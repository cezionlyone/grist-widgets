}

/* Drag and drop in simulated mouse mode (forceFallback): the browser's
   native drag does not start from a button, yet the card title is one, and
   it behaves inconsistently inside an embedded frame. The 4 px tolerance
   tells a click apart from the start of a drag. */
function brancherGlisser(listeCartes, cle) {
  if (!etat.peutModifier) { return; }
  if (typeof Sortable === 'undefined') {
    if (!etat.sortableAbsent) {
      etat.sortableAbsent = true;
      logSecurite('WARNING', 'Drag and drop library not loaded: only the Move button is available');
    }
    return;
  }
  var c = etat.config;
  var s = Sortable.create(listeCartes, {
    group: { name: 'kanban', put: cle !== CLE_NON_CLASSE },
    sort: !etat.regroupement && !triVue() && !!c.colOrdreCartes && cle !== CLE_NON_CLASSE,
    animation: 150,
    forceFallback: true,
    fallbackOnBody: true,
    fallbackTolerance: 4,
    /* On touch, dragging needs a 300 ms press: a simple swipe scrolls
       the page. With the mouse, dragging is immediate. */
    delay: 300,
    delayOnTouchOnly: true,
    touchStartThreshold: 5,
    draggable: '.w-carte',
    filter: 'a',
    preventOnFilter: false,
    onStart: function () {
      etat.glisserEnCours = true;
      var t = document.getElementById('tTableau');
      if (t) { t.classList.add('w-glisser-en-cours'); }
    },
    onEnd: function (evt) {
      etat.glisserEnCours = false;
      etat.finGlisser = Date.now();
      var tt = document.getElementById('tTableau');
      if (tt) { tt.classList.remove('w-glisser-en-cours'); }
      var id = parseInt(evt.item.getAttribute('data-id'), 10);
      var dest = evt.to.getAttribute('data-cle');
      if (evt.from === evt.to && evt.oldIndex === evt.newIndex) {
        if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
        return;
      }
      if (etat.regroupement) {
        if (evt.from === evt.to) { redessinerColonnes(); return; }
        relayer(ecrireGroupe(id, dest, true), 'Value change by drag and drop');
        return;
      }
      relayer(deplacerCarte(id, dest, triVue() ? 1e9 : evt.newIndex, true), 'Move by drag and drop');
    }
  });
  etat.sortables.push(s);
}

/* Columns reorderable directly on the Kanban: view by stage, source is a
   choice list or a table with a SORT_ORDER column. Keyboard alternative:
   the arrows in step 2 of the settings. */
function colonnesOrdonnablesSurKanban() {
  var c = etat.config;
  /* Reordering columns changes the settings: reserved for people who
     can edit settings. */
  if (!c || etat.regroupement || !etat.peutParametrer) { return false; }
  var src = c.sourceEtapes;
  return src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colOrdre);
}

function brancherGlisserColonnes(zone) {
  if (typeof Sortable === 'undefined' || !colonnesOrdonnablesSurKanban()) { return; }
  etat.sortables.push(Sortable.create(zone, {
    group: 'colonnes', handle: '.w-colonne__poignee', draggable: '.w-colonne:not(.w-colonne--nonclasse)',
    animation: 150, forceFallback: true, fallbackOnBody: true, direction: 'horizontal',
    onStart: function () { etat.glisserEnCours = true; },
    onEnd: function (evt) {
      etat.glisserEnCours = false;
      etat.finGlisser = Date.now();
      if (evt.oldIndex === evt.newIndex) { return; }
      var cles = Array.prototype.map.call(zone.querySelectorAll('.w-colonne:not(.w-colonne--nonclasse)'), function (sec) { return sec.getAttribute('data-cle'); });
      relayer(ecrireOrdreColonnes(cles, evt.item.getAttribute('data-cle')), 'Column reordering');
    }
  }));
}

async function ecrireOrdreColonnes(cles, cleDeplacee) {
  var c = etat.config;
  var src = c.sourceEtapes;
  try {
    if (src.type === 'liste') {
      src.valeurs = cles.slice();
      await ecrireConfig(c);
    } else if (src.type === 'choice') {
      var col = colonneCartes(c.colEtape);
      var opts = JSON.parse(JSON.stringify(col.options || {}));
      var reste = choixDe(col).filter(function (v) { return cles.indexOf(v) === -1; });
      opts.choices = cles.concat(reste);
      await agir([['UpdateRecord', '_grist_Tables_column', col.ref, { widgetOptions: JSON.stringify(opts) }]]);
    } else {
      var maj = {};
      maj[src.colOrdre] = cles.map(function (_, i) { return (i + 1) * ORDRE_PAS; });
      await agir([['BulkUpdateRecord', src.table, cles.map(function (k) { return parseInt(k, 10); }), maj]]);
    }
    await chargerMeta();
    verifierConfig();
    await chargerDonnees();
    redessinerColonnes();
    annoncer('Column ' + libelleEtape(cleDeplacee) + ' moved to position ' + (cles.indexOf(cleDeplacee) + 1) + ' of ' + cles.length + '.');
  } catch (e) {
    afficherErreur('Moving the column failed.', e);
    redessinerColonnes();
  }
}

function carteParId(id) {
  for (var i = 0; i < etat.cartes.length; i++) { if (etat.cartes[i].id === id) { return etat.cartes[i]; } }
  return null;
}

/* Moving a card: the stage changes, and if the order is manual the whole
   destination column is renumbered (step of 10), which avoids equal or
   empty orders. Only rows whose order changes are written. The index refers
   to visible cards: it is converted into a rank among all the cards of the
   column. */
async function deplacerCarte(id, cleDest, indexVisible, parGlisser) {
  var c = etat.config;
  var carte = carteParId(id);
  if (!carte || !cleDest || cleDest === CLE_NON_CLASSE) { redessinerColonnes(); return; }
  var ids = [];
  var maj = {};
  var etapeChange = carte.cle !== cleDest;
  if (c.colOrdreCartes) {
    /* The order is re-read just before writing: a colleague may have moved
       a card in the same column since the last refresh, and the local order
       would have overwritten it. */
    try {
      var frais = await lireTable(c.tableCartes);
      for (var fi = 0; fi < frais.id.length; fi++) {
        var xf = carteParId(frais.id[fi]);
        if (xf) { xf.ordre = colonneDe(frais, c.colOrdreCartes, fi); }
      }
    } catch (eOrd) { logSecurite('WARNING', 'Card order not re-read before move', eOrd); }
    var toutes = cartesDeEtape(cleDest).filter(function (x) { return x.id !== id; });
    var visibles = toutes.filter(correspondFiltres);
    var rang = toutes.length;
    if (indexVisible < visibles.length) { rang = toutes.indexOf(visibles[indexVisible]); }
    toutes.splice(rang, 0, carte);
    toutes.forEach(function (x, i) {
      var o = (i + 1) * ORDRE_PAS;
      if (x.ordre !== o || (x.id === id && etapeChange)) { ids.push(x.id); maj[x.id] = o; }
    });
  }
  if (!ids.length && !etapeChange) { redessinerColonnes(); return; }
  var actions = [];
  if (etapeChange) {
    var champEtape = {};
    champEtape[c.colEtape] = valeurEtapePourCle(cleDest);
    actions.push(['UpdateRecord', c.tableCartes, id, champEtape]);
  }
  if (c.colOrdreCartes && ids.length) {
    var champsOrdre = {};
    champsOrdre[c.colOrdreCartes] = ids.map(function (i) { return maj[i]; });
    actions.push(['BulkUpdateRecord', c.tableCartes, ids, champsOrdre]);
  }
  try {
    await agir(actions);
    ids.forEach(function (i) { var x = carteParId(i); if (c.colOrdreCartes) { x.ordre = maj[i]; } });
    if (etapeChange) { carte.cle = cleDest; carte.brut = valeurEtapePourCle(cleDest); }
    var pos = cartesDeEtape(cleDest).indexOf(carte) + 1;
    var total = cartesDeEtape(cleDest).length;
    annoncer('Card ' + (carte.titre || 'untitled') + ' moved to ' + libelleEtape(cleDest) + ', position ' + formaterNombre(pos) + ' of ' + formaterNombre(total) + '.');
    redessinerColonnes();
    if (!parGlisser) {
      var b = document.querySelector('.w-carte[data-id="' + id + '"] .w-carte__deplacer');
      if (b) { b.focus(); }
    }
  } catch (e) {
    afficherErreur('Moving the card failed.', e);
    redessinerColonnes();
  }
  if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
}

function ouvrirDeplacement(x) {
  if (etat.regroupement) { ouvrirDeplacementGroupe(x); return; }
  var c = etat.config;
  var titre = x.titre || 'Untitled';
  var choix = { cle: x.cle === CLE_NON_CLASSE ? etat.etapes[0].cle : x.cle, pos: 0 };
  var fs = creer('fieldset', { classe: 'ui-fieldset' }, [creer('legend', { classe: 'ui-fieldset__legend', texte: 'To which column?' })]);
  var selPos = creer('select', { classe: 'ui-select', id: 'dPos' });
  var majPositions = function () {
    vider(selPos);
    var autres = cartesDeEtape(choix.cle).filter(function (y) { return y.id !== x.id && correspondFiltres(y); });
    for (var i = 0; i <= autres.length; i++) {
      var lib = i === 0 ? 'Top of the column' : (i === autres.length ? 'Bottom of the column' : 'After "' + (autres[i - 1].titre || 'Untitled') + '"');
      var o = creer('option', { texte: lib, attrs: { value: i } });
      selPos.appendChild(o);
    }
    var actuelle = cartesDeEtape(choix.cle).filter(correspondFiltres).indexOf(x);
    selPos.value = String(choix.cle === x.cle && actuelle >= 0 ? actuelle : autres.length);
  };
  etat.etapes.forEach(function (e, i) {
    var n = cartesDeEtape(e.cle).length;
    var r = creer('input', { attrs: { type: 'radio', name: 'dDest', id: 'dDest' + i }, coche: e.cle === choix.cle });
    r.addEventListener('change', function () { choix.cle = e.cle; majPositions(); });
    var lab = creer('label', { classe: 'ui-label', attrs: { 'for': 'dDest' + i } }, [e.libelle,
      creer('span', { classe: 'ui-hint-text', texte: formaterNombre(n) + ' card' + (n !== 1 ? 's' : '') + (e.cle === x.cle ? ', current column' : '') })]);
    fs.appendChild(creer('div', { classe: 'ui-fieldset__element' }, [creer('div', { classe: 'ui-radio-group' }, [r, lab])]));
  });
  majPositions();
  var corps = [fs];
  if (c.colOrdreCartes) { corps.push(groupeChamp('Position in the column', selPos)); }
  else { corps.push(creer('p', { classe: 'w-mention', texte: 'Cards in this Kanban are sorted automatically: only the column can be chosen.' })); }
  corps.push(creer('p', { classe: 'w-mention', texte: 'You can also drag the card with the mouse.' }));
  ouvrirModale({ titre: 'Move card', sousTitre: titre, etroite: true, corps: corps,
    focus: 'dDest' + Math.max(0, etat.etapes.map(function (e) { return e.cle; }).indexOf(choix.cle)),
    pied: [creer('span', { classe: 'w-pousse' }), bouton('Cancel', 'secondaire', null, fermerModale),
      bouton('Move', null, 'check-line', function () {
        var pos = c.colOrdreCartes ? parseInt(selPos.value, 10) || 0 : 0;
        fermerModale();
        return deplacerCarte(x.id, choix.cle, pos, false);
      })] });
}

/* Keyboard move in grouped mode: choose the new value. */
function ouvrirDeplacementGroupe(x) {

/* === SECTION: ATTACHMENTS ===
   Mechanism proven on the instance:
   read-only token first, then a full token if the instance refuses it (some
   instances refuse read-only tokens for files), multipart upload with the X-Requested-With header (without it,
   the server's anti-CSRF protection answers 403), no Content-Type set by
   hand (the browser computes the boundary).
   Uploading attaches nothing: the ids received are then written into the
   cell, in the format ['L', id1, id2]. Removing a file removes its
   reference; the file stays in the document storage.
   Names and sizes come from the _grist_Attachments table, read through the
   widget API. Files are fetched as Blobs: the token never appears in a link
   on the page. */
/* Cover image: first attachment whose extension is a raster image. Files
   are fetched as Blobs only once per session; the token never appears in
   the page. */
/* Icon of a card field, by type. Theme icons only. Decorative: the field
   name is still read. */
function iconeInfo(g, col) {
  var nom = { date: 'calendar-line', dateheure: 'time-line', personne: 'user-line', texte: 'file-text-line', texte_long: 'file-text-line',
    lien: 'links-line', pj: 'attachment-line', reference: 'folder-2-line', references: 'folder-2-line', choix: 'list-unordered', etiquettes: 'list-unordered',
    nombre: (col && col.options && col.options.numMode === 'currency') ? 'money-dollar-circle-line' : 'hashtag' }[g];
  return nom ? creer('span', { classe: 'ui-icon-' + nom + ' ui-icon--sm w-carte__ico', attrs: { 'aria-hidden': 'true' } }) : null;
}

function premiereImage(v) {
  var ids = idsPJ(v);
  for (var i = 0; i < ids.length; i++) {
    var m = etat.pjMeta[ids[i]];
    if (m && PJ_IMAGES.indexOf(extensionDe(m.nom)) !== -1) { return ids[i]; }
  }
  return null;
}

async function chargerCouverture(id, img) {
  etat.couvertures = etat.couvertures || {};
  if (!etat.couvertures[id]) {
    etat.couvertures[id] = recupererPJ(id).then(function (blob) {
      var ext = extensionDe(etat.pjMeta[id].nom);
      return URL.createObjectURL(new Blob([blob], { type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext) }));
    });
  }
  try {
    img.src = await etat.couvertures[id];
  } catch (e) {
    delete etat.couvertures[id];
    if (img.parentNode) { img.parentNode.removeChild(img); }
    logSecurite('WARNING', 'Cover image not loaded', e);
  }
}

function idsPJ(v) {
  return Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(function (x) { return typeof x === 'number'; }) : [];
}

async function chargerMetaPJ() {
  try {
    var d = await lireTable('_grist_Attachments');
    var m = {};
    for (var i = 0; i < d.id.length; i++) { m[d.id[i]] = { nom: colonneDe(d, 'fileName', i) || ('File ' + d.id[i]), taille: colonneDe(d, 'fileSize', i) || 0 }; }
    etat.pjMeta = m;
  } catch (e) {
    logSecurite('WARNING', 'Attachment names unreadable', e);
  }
}

/* Read-only token to view or download a file; a write token only to
   upload one. */
async function obtenirJeton(ecriture) {
  var cle = ecriture ? 'jetonEcriture' : 'jeton';
  var j = etat[cle];
  if (j && Date.now() < j.expire) { return j; }
  var r = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !ecriture }), 15000);
  etat[cle] = { token: r.token, baseUrl: r.baseUrl, expire: Date.now() + Math.max(0, (r.ttlMsecs || 60000) - 30000) };
  return etat[cle];
}

async function fetchDelai(url, options, delaiMs) {
  var ctrl = new AbortController();
  var minut = setTimeout(function () { ctrl.abort(); }, delaiMs);
  try {
    options.signal = ctrl.signal;
    return await fetch(url, options);
  } finally {
    clearTimeout(minut);
  }
}

function extensionDe(nom) {
  var m = /\.([A-Za-z0-9]+)$/.exec(String(nom || ''));
  return m ? m[1].toLowerCase() : '';
}

function formaterTaille(octets) {
  if (!octets) { return ''; }
  if (octets < 1024) { return octets + ' B'; }
  if (octets < 1024 * 1024) { return Math.round(octets / 1024) + ' KB'; }
  return (octets / (1024 * 1024)).toLocaleString(localeDoc(), { maximumFractionDigits: 1 }) + ' MB';
}

function iconePJ(nom) {
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) !== -1) { return 'ui-icon-image-line'; }
  if (ext === 'pdf') { return 'ui-icon-file-pdf-line'; }
  return 'ui-icon-file-line';
}

async function recupererPJ(id) {
  var essai = async function (complet) {
    var j = await obtenirJeton(complet);
    return fetchDelai(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token), {}, DELAI_API_MS);
  };
  var rep = await essai(etat.pjJetonComplet === true);
  /* Some Grist instances refuse a read-only token for files, even to view
     them: retry once with a full token, and keep using it for this session. */
  if ((rep.status === 401 || rep.status === 403) && etat.pjJetonComplet !== true) {
    etat.pjJetonComplet = true;
    rep = await essai(true);
  }
  if (!rep.ok) { throw new Error('Response ' + rep.status); }
  return rep.blob();
}

async function telechargerPJ(id) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'file';
  afficherLoader('Downloading…');
  try {
    var blob = await recupererPJ(id);
    var url = URL.createObjectURL(blob);
    var a = creer('a', { attrs: { href: url, download: nom } });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    masquerLoader();
  } catch (e) {
    masquerLoader();
    afficherErreur('Downloading the file failed.', e);
  }
}

var _visionneuse = { url: null, retour: null, pieger: null, id: null, pdf: null, tour: 0, plein: false };

/* pdf.js: PDFs are drawn by the widget, since the browser's built-in
   viewer is not usable everywhere inside a widget frame (Firefox downloads
   the file instead of showing it). Legacy build, pinned; each file is only
   executed after its SHA-256 hash is checked, the equivalent of the
   integrity attribute for a module loaded by script. */
var PDFJS = {
  version: '6.2.108',
  base: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/',
  lib: { fichier: 'pdf.min.mjs', empreinte: 'n6sMkQvxSEg1xcKuto9+s9/Of560NaAEUmxa+G1wiQw=' },
  worker: { fichier: 'pdf.worker.min.mjs', empreinte: 'vA0biOoLZhlrHTalisJDxtkq3+clYk4qn904G9+O9DQ=' }
};
var _pdfjsChargement = null;

async function moduleVerifie(ressource) {
  var rep = await fetchDelai(PDFJS.base + ressource.fichier, { credentials: 'omit' }, DELAI_API_MS);
  if (!rep.ok) { throw new Error('Response ' + rep.status + ' for ' + ressource.fichier); }
  var octets = await rep.arrayBuffer();
  var hache = new Uint8Array(await crypto.subtle.digest('SHA-256', octets));
  var b64 = btoa(String.fromCharCode.apply(null, Array.prototype.slice.call(hache)));
  if (b64 !== ressource.empreinte) { throw new Error('Hash mismatch for ' + ressource.fichier); }
  return URL.createObjectURL(new Blob([octets], { type: 'text/javascript' }));
}

function chargerPdfJs() {
  if (!_pdfjsChargement) {
    _pdfjsChargement = Promise.all([moduleVerifie(PDFJS.lib), moduleVerifie(PDFJS.worker)]).then(function (urls) {
      return import(urls[0]).then(function (lib) {
        lib.GlobalWorkerOptions.workerSrc = urls[1];
        return lib;
      });
    }).catch(function (e) {
      _pdfjsChargement = null;
      throw e;
    });
  }
  return _pdfjsChargement;
}

/* Draws all pages at the viewer width. A new drawing (full screen)
   interrupts the previous one. */
async function dessinerPDF() {
  var doc = _visionneuse.pdf;
  var zone = document.getElementById('wVisionneuseContenu');
  if (!doc || !zone) { return; }
  var tour = ++_visionneuse.tour;
  vider(zone);
  zone.classList.add('w-visionneuse__contenu--pdf');
  var pages = creer('div', { classe: 'w-pdf__pages' });
  zone.appendChild(pages);
  var largeur = Math.max(200, Math.min(zone.clientWidth - 48, 1400));
  var ratio = window.devicePixelRatio || 1;
  for (var n = 1; n <= doc.numPages; n++) {
    if (_visionneuse.pdf !== doc || _visionneuse.tour !== tour) { return; }
    var page = await doc.getPage(n);
    var base = page.getViewport({ scale: 1 });
    var vue = page.getViewport({ scale: (largeur / base.width) * ratio });
    var canvas = creer('canvas', { classe: 'w-pdf__page', attrs: { role: 'img', 'aria-label': 'Page ' + n + ' of ' + doc.numPages } });
    canvas.width = Math.floor(vue.width);
    canvas.height = Math.floor(vue.height);
    canvas.style.width = Math.floor(vue.width / ratio) + 'px';
    canvas.style.height = Math.floor(vue.height / ratio) + 'px';
    if (_visionneuse.pdf !== doc || _visionneuse.tour !== tour) { return; }
    pages.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vue }).promise;
  }
}

function appliquerPleinEcranVisionneuse() {
  var boite = document.querySelector('#wVisionneuse .w-dialogue--visionneuse');
  if (boite) { boite.classList.toggle('w-dialogue--plein', _visionneuse.plein); }
  var b = document.getElementById('wVisionneusePlein');
  if (b) {
    b.textContent = _visionneuse.plein ? 'Exit full screen' : 'Full screen';
    b.classList.toggle('ui-icon-zoom-in-line', !_visionneuse.plein);
    b.classList.toggle('ui-icon-zoom-out-line', _visionneuse.plein);
    b.setAttribute('aria-pressed', _visionneuse.plein ? 'true' : 'false');
  }
}

function basculerPleinEcranVisionneuse() {
  _visionneuse.plein = !_visionneuse.plein;
  appliquerPleinEcranVisionneuse();
  if (_visionneuse.pdf) { relayer(dessinerPDF(), 'PDF redraw'); }
}

async function consulterPJ(id) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'File';
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) === -1 && ext !== 'pdf') { return telechargerPJ(id); }
  var ov = document.getElementById('wVisionneuse');
  var zone = document.getElementById('wVisionneuseContenu');
  document.getElementById('wVisionneuseTitre').textContent = nom;
  _visionneuse.plein = false;
  appliquerPleinEcranVisionneuse();
  zone.classList.remove('w-visionneuse__contenu--pdf');
  vider(zone);
  zone.appendChild(creer('p', { classe: 'w-texte', texte: 'Loading file…' }));
  _visionneuse.retour = document.activeElement;
  _visionneuse.id = id;
  ov.classList.add('actif');
  void ov.offsetHeight;
  _visionneuse.pieger = fabriquerPiege(ov, fermerVisionneuse);
  ov.addEventListener('keydown', _visionneuse.pieger);
  document.getElementById('wVisionneuseFermer').focus();
  try {
    var blob = await recupererPJ(id);
    if (_visionneuse.id !== id) { return; }
    /* The Blob type is forced from the checked extension, whatever type
       the server announces. */
    var type = ext === 'pdf' ? 'application/pdf' : 'image/' + (ext === 'jpg' ? 'jpeg' : ext);
    _visionneuse.url = URL.createObjectURL(new Blob([blob], { type: type }));
    vider(zone);
    if (ext === 'pdf') {
      zone.appendChild(creer('p', { classe: 'w-texte', texte: 'Preparing preview…' }));
      var lib = await chargerPdfJs();
      var doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false, enableXfa: false }).promise;
      if (_visionneuse.id !== id) { doc.destroy(); return; }
      _visionneuse.pdf = doc;
      await dessinerPDF();
    } else {
      zone.appendChild(creer('img', { attrs: { src: _visionneuse.url, alt: nom } }));
    }
  } catch (e) {
    if (_visionneuse.id !== id) { return; }
    zone.classList.remove('w-visionneuse__contenu--pdf');
    vider(zone);
    zone.appendChild(creer('p', { classe: 'w-texte', texte: 'The preview could not be shown. You can download the file.' }));
    logSecurite('ERROR', 'Attachment preview', e);
  }
}

function fermerVisionneuse() {
  var ov = document.getElementById('wVisionneuse');
  if (!ov.classList.contains('actif')) { return; }
  ov.classList.remove('actif');
  if (_visionneuse.pieger) { ov.removeEventListener('keydown', _visionneuse.pieger); _visionneuse.pieger = null; }
  vider(document.getElementById('wVisionneuseContenu'));
  if (_visionneuse.url) { URL.revokeObjectURL(_visionneuse.url); _visionneuse.url = null; }
  if (_visionneuse.pdf) { try { _visionneuse.pdf.destroy(); } catch (e) { /* already destroyed */ } _visionneuse.pdf = null; }
  _visionneuse.plein = false;
  appliquerPleinEcranVisionneuse();
  document.getElementById('wVisionneuseContenu').classList.remove('w-visionneuse__contenu--pdf');
  _visionneuse.id = null;
  var r = _visionneuse.retour;
  _visionneuse.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
}

function validerFichierPJ(f) {
  if (!f.size) { return 'The file "' + f.name + '" is empty.'; }
  if (f.size > PJ_TAILLE_MAX) { return 'The file "' + f.name + '" exceeds 20 MB.'; }
  var ext = extensionDe(f.name);
  if (PJ_EXTENSIONS_INTERDITES.indexOf(ext) !== -1) { return '.' + ext + ' files are not accepted.'; }
  return null;
}

var _envoiPJ = false;

async function envoyerPJ(carte, colId, fichiers, idChamp, redessiner) {
  if (_envoiPJ) { signalerSaisie('An upload is already in progress.'); return; }
  for (var k = 0; k < fichiers.length; k++) {
    var err = validerFichierPJ(fichiers[k]);
    if (err) { marquerInvalide(idChamp, err); return; }
  }
  var c = etat.config;
  _envoiPJ = true;
  try {
    var j = await obtenirJeton(true);
    var nouveaux = [];
    for (var i = 0; i < fichiers.length; i++) {
      afficherLoader(fichiers.length !== 1 ? 'Uploading file ' + (i + 1) + ' of ' + fichiers.length + '…' : 'Uploading file…');
      var fd = new FormData();
      fd.append('upload', fichiers[i], fichiers[i].name);
      var rep = await fetchDelai(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token),
        { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' }, body: fd }, DELAI_ENVOI_MS);
      if (!rep.ok) { throw new Error('Response ' + rep.status); }
      var ids = await rep.json();
      if (!Array.isArray(ids) || !ids.length) { throw new Error('Unexpected upload response'); }
      nouveaux = nouveaux.concat(ids);
    }
    var maj = {};
    maj[colId] = ['L'].concat(idsPJ(carte.valeurs[colId]).concat(nouveaux));
    await agir([['UpdateRecord', c.tableCartes, carte.id, maj]]);
    carte.valeurs[colId] = maj[colId];
    await chargerMetaPJ();
    masquerLoader();
    redessiner();
    redessinerColonnes();
    annoncer(nouveaux.length > 1 ? nouveaux.length + ' files added.' : 'File added.');
  } catch (e) {
    masquerLoader();
    afficherErreur('Uploading the file failed.', e);
  } finally {
    _envoiPJ = false;
  }
}

async function retirerPJ(carte, colId, id, redessiner) {
  var nom = etat.pjMeta[id] ? etat.pjMeta[id].nom : 'this file';
  var ok = await confirmerAction('Remove "' + nom + '" from the card?', 'The file will no longer be attached to this card. It remains stored in the document.', 'Remove');
  if (!ok) { return; }
  var reste = idsPJ(carte.valeurs[colId]).filter(function (x) { return x !== id; });
  var maj = {};
  maj[colId] = reste.length ? ['L'].concat(reste) : null;
  afficherLoader('Updating…');
  try {
    await agir([['UpdateRecord', etat.config.tableCartes, carte.id, maj]]);
    carte.valeurs[colId] = maj[colId];
    masquerLoader();
    redessiner();
    redessinerColonnes();
    annoncer('File ' + nom + ' removed from the card.');
  } catch (e) {
    masquerLoader();
    afficherErreur('Removing the file failed.', e);
  }
}

/* Card details editor: list of files (view, download, remove) and
   upload. Writes are immediate, outside the autosave of the other
   fields. */
function editeurPiecesJointes(ch, carte, idx, modifiable) {
  var lib = libelleChamp(ch);
  var id = 'fc_' + idx;
  var bloc = creer('div', { classe: 'ui-input-group', id: id + '_bloc' }, [creer('p', { classe: 'ui-label ui-mb-1v', texte: lib })]);
  if (!carte) {
    bloc.appendChild(creer('p', { classe: 'ui-hint-text', texte: 'Add the card first: you can then attach files to it.' }));
    return { noeud: bloc, lire: null };
  }
  var ul = creer('ul', { classe: 'w-pj__liste', attrs: { 'aria-label': 'Files: ' + lib } });
  var dessiner = function () {
    vider(ul);
    var ids = idsPJ(carte.valeurs[ch.col]);
    if (!ids.length) { ul.appendChild(creer('li', { classe: 'w-mention', texte: 'No files.' })); }
    ids.forEach(function (fid) {
      var meta = etat.pjMeta[fid] || { nom: 'File ' + fid, taille: 0 };
      var apercu = PJ_IMAGES.indexOf(extensionDe(meta.nom)) !== -1 || extensionDe(meta.nom) === 'pdf';
      ul.appendChild(creer('li', { classe: 'w-pj__fichier' }, [
        creer('span', { classe: iconePJ(meta.nom), attrs: { 'aria-hidden': 'true' } }),
        creer('span', { classe: 'w-pj__nom', texte: meta.nom }),
        creer('span', { classe: 'w-pj__taille', texte: formaterTaille(meta.taille) }),
        apercu ? bouton('View', 'discret', 'eye-line', function () { return consulterPJ(fid); }, { petit: true, aria: 'View ' + meta.nom }) : null,
        bouton('Download', 'discret', 'download-line', function () { return telechargerPJ(fid); }, { petit: true, iconeSeule: true, aria: 'Download ' + meta.nom }),
        modifiable ? bouton('Remove', 'discret', 'delete-line', function () { return retirerPJ(carte, ch.col, fid, dessiner); }, { petit: true, iconeSeule: true, aria: 'Remove ' + meta.nom }) : null
      ]));
    });
  };
  dessiner();
  bloc.appendChild(ul);
  if (modifiable) {
    var champ = creer('input', { classe: 'ui-upload', id: id + '_upload', attrs: { type: 'file', multiple: true } });
    champ.addEventListener('change', function () {
      var fichiers = Array.prototype.slice.call(champ.files || []);
      champ.value = '';
      if (fichiers.length) { relayer(envoyerPJ(carte, ch.col, fichiers, id + '_upload', dessiner), 'Uploading attachments'); }
    });
    bloc.appendChild(creer('div', { classe: 'ui-upload-group ui-mt-1w' }, [
      creer('label', { classe: 'ui-label', attrs: { 'for': id + '_upload' } }, ['Add files',
        creer('span', { classe: 'ui-hint-text', texte: '20 MB maximum per file. Several files can be selected at once.' })]),
      champ]));
  } else {
    bloc.appendChild(creer('p', { classe: 'ui-hint-text', texte: 'Read-only' }));
  }
  return { noeud: bloc, lire: null };
}

/* === SECTION : CARD DETAILS === */
/* List with no values in the card details: the user learns where it gets

  if (champ === c.colTitre) { return 'renamed the card: "' + de + '" becomes "' + a + '"'; }

    var cible = x.e.noeud.querySelector('.ui-label, legend');
    if (ico && cible) { cible.insertBefore(ico, cible.firstChild); }
  });
  /* Position in the column: an alternative to drag and drop for ordering
     a card (keyboard, motor impairment). Offered when ordering is manual
     and the card already exists. */
  var selPos = null;
  var majPositions = function () {
    if (!selPos) { return; }
    vider(selPos);
    var visibles = cartesDeEtape(carte.cle).filter(correspondFiltres);
    var autres = visibles.filter(function (y) { return y.id !== carte.id; });
    for (var k = 0; k <= autres.length; k++) {
      selPos.appendChild(creer('option', { attrs: { value: k }, texte: k === 0 ? (autres.length ? 'Top of the column' : 'Only card in the column')
        : (k === autres.length ? 'Bottom of the column' : 'After "' + (autres[k - 1].titre || 'Untitled') + '"') }));
    }
    var actuelle = visibles.indexOf(carte);
    selPos.value = String(actuelle >= 0 ? actuelle : autres.length);
    selPos.disabled = !autres.length || !etat.peutModifier;
  };
  if (!nouvelle && c.colOrdreCartes && carte.cle !== CLE_NON_CLASSE) {
    selPos = creer('select', { classe: 'ui-select', id: 'fcPos' });
    majPositions();
  }
  var grille = creer('div', { classe: 'w-colonnes2' }, [
    creer('div', { classe: 'w-colonnes2__principal' }, [groupeChamp('Card title', inTitre, titreModifiable ? null : 'Read-only: calculated automatically in your table', titreModifiable)]),
    creer('div', { classe: 'w-colonnes2__cote' }, [groupeChamp('Column', selEtape), selPos ? groupeChamp('Position in the column', selPos) : null])
  ]);
  var fiche = creer('div', { classe: 'w-fiche' }, [grille].concat(editeurs.map(function (x) { return x.e.noeud; })));
  if (carte && (carte.valeurs.CREATED_AT || carte.valeurs.UPDATED_AT)) {
    var m = [];
    /* Date and time columns: the day is read in the column's time zone, not in UTC. */
    var jourMeta = function (k) {
      var fz = fuseauDe(colonneCartes(k));
      return formatDate('jour|' + fz, { year: 'numeric', month: 'short', day: 'numeric', timeZone: fz }).format(new Date(carte.valeurs[k] * 1000));
    };
    if (typeof carte.valeurs.CREATED_AT === 'number' && carte.valeurs.CREATED_AT) { m.push('Created on ' + jourMeta('CREATED_AT') + (carte.valeurs.CREATED_BY ? ' by ' + carte.valeurs.CREATED_BY : '')); }
    if (typeof carte.valeurs.UPDATED_AT === 'number' && carte.valeurs.UPDATED_AT) { m.push('updated on ' + jourMeta('UPDATED_AT') + (carte.valeurs.UPDATED_BY ? ' by ' + carte.valeurs.UPDATED_BY : '')); }
    if (m.length) { fiche.appendChild(creer('p', { classe: 'w-mention', texte: m.join(', ') + '.' })); }
  }

  /* Reading the inputs: changes compared with the card, or the first
     error found. */
  var lireSaisies = function () {
    var titre = inTitre.value.trim();
    if (titreModifiable && !titre) { return { ok: false, id: 'fcTitre', message: 'Give the card a title.' }; }
    var champsMaj = {};
    if (titreModifiable && (nouvelle || titre !== (carte.titre || ''))) { champsMaj[c.colTitre] = titre; }
    for (var i = 0; i < editeurs.length; i++) {
      if (!editeurs[i].e.lire) { continue; }
      var r = editeurs[i].e.lire();
      if (!r.ok) { return r; }
      var avant = carte ? carte.valeurs[editeurs[i].ch.col] : undefined;
      if (nouvelle || JSON.stringify(avant === undefined ? null : avant) !== JSON.stringify(r.v)) { champsMaj[editeurs[i].ch.col] = r.v; }
    }
    return { ok: true, champs: champsMaj, titre: titre };
  };

  if (nouvelle) {
    var ajouter = async function () {
      masquerErreur();
      var r = lireSaisies();
      if (!r.ok) { marquerInvalide(r.id, r.message); return; }
      var cleDest = selEtape.value;
      var champsMaj = r.champs;
      Object.keys(prerempli || {}).forEach(function (k) { if (champsMaj[k] === undefined) { champsMaj[k] = prerempli[k]; } });
      if (c.colKanban) { champsMaj[c.colKanban] = c.idKanban; }
      if (cleDest) { champsMaj[c.colEtape] = valeurEtapePourCle(cleDest); }
      if (c.colOrdreCartes) {
        var max = 0;
        cartesDeEtape(cleDest).forEach(function (x) { if (typeof x.ordre === 'number' && x.ordre > max) { max = x.ordre; } });
        champsMaj[c.colOrdreCartes] = max + ORDRE_PAS;
      }
      afficherLoader('Adding the card…');
      try {
        await agir([['AddRecord', c.tableCartes, null, champsMaj]]);
        masquerLoader();
        fermerModale();
        annoncer('Card ' + r.titre + ' added to ' + libelleEtape(cleDest) + '.');
        await rafraichirMaintenant();
      } catch (e) {
        masquerLoader();
        afficherErreur('The card could not be added.', e);
      }
    };
    ouvrirModale({ titre: 'New card', laterale: true, corps: [fiche], focus: 'fcTitre',
      pied: [creer('span', { classe: 'w-pousse' }), bouton('Cancel', 'secondaire', null, fermerModale),
        bouton('Add the card', null, 'check-line', ajouter)] });
    return;
  }

  var statut = creer('p', { classe: 'w-mention w-fiche__statut', id: 'wFicheStatut', texte: 'Changes are saved automatically.', attrs: { role: 'status' } });
  var minuterie = null;
  var enCours = false;
  var encore = false;
  var sauver = async function () {
    if (minuterie) { clearTimeout(minuterie); minuterie = null; }
    if (enCours) { encore = true; return; }
    var r = lireSaisies();
    if (!r.ok) {
      marquerInvalide(r.id, r.message, true);
      statut.textContent = 'Change not saved: ' + r.message;
      return;
    }
    if (!Object.keys(r.champs).length) { return; }
    enCours = true;
    statut.textContent = 'Saving…';
    try {
      await agir([['UpdateRecord', c.tableCartes, carte.id, r.champs]]);
      Object.keys(r.champs).forEach(function (k) {
        if (k === c.colTitre) { carte.titre = r.champs[k]; } else { carte.valeurs[k] = r.champs[k]; }
      });
      var t = document.getElementById('wModaleTitre');
      if (t) { t.textContent = carte.titre || 'Untitled'; }
      var d = new Date();
      statut.textContent = 'Saved at ' + heureLocale(d.getHours(), d.getMinutes()) + '.';
      if (c.historique) { var fil = document.getElementById('wActFil'); if (fil) { await relireFil(carte, fil); } }
      redessinerColonnes();
    } catch (e) {
      statut.textContent = 'Change not saved.';
      afficherErreur('The card could not be saved.', e);
    } finally {
      enCours = false;
    }
    if (encore) { encore = false; await sauver(); }
  };
  var planifier = function () {
    if (minuterie) { clearTimeout(minuterie); }
    statut.textContent = 'Editing…';
    minuterie = setTimeout(function () { relayer(sauver(), 'Autosave'); }, 700);
  };
  fiche.addEventListener('input', function (e) {
    if (e.target === selEtape || e.target.type === 'file') { return; }
    planifier();
  });
  fiche.addEventListener('change', function (e) {
    if (e.target === selEtape || e.target.type === 'file') { return; }
    if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.type === 'date') {
      relayer(sauver(), 'Autosave');
    }
  });
  selEtape.addEventListener('change', function () {
    relayer((async function () {
      await sauver();
      var dest = selEtape.value;
      if (!dest || dest === carte.cle) { return; }
      await deplacerCarte(carte.id, dest, cartesDeEtape(dest).filter(correspondFiltres).length, true);
      var sous = document.getElementById('wModaleSous');
      if (sous) { sous.textContent = 'Column: ' + libelleEtape(carte.cle); }
      majPositions();
      statut.textContent = 'Card moved to ' + libelleEtape(carte.cle) + '.';
    })(), 'Column change from card details');
  });
  if (selPos) {
    selPos.addEventListener('change', function () {
      relayer((async function () {
        await sauver();
        await deplacerCarte(carte.id, carte.cle, parseInt(selPos.value, 10) || 0, true);
        majPositions();
        selPos.focus();
        statut.textContent = 'Card placed in position ' + (parseInt(selPos.value, 10) + 1) + '.';
      })(), 'Position change from card details');
    });
  }
  var supprimer = async function () {
    var ok = await confirmerAction('Delete the card?', 'The card "' + (carte.titre || 'Untitled') + '" will be permanently deleted.', 'Delete');
    if (!ok) { return; }
    if (minuterie) { clearTimeout(minuterie); minuterie = null; }
    afficherLoader('Deleting…');
    try {
      await agir([['RemoveRecord', c.tableCartes, carte.id]]);
      masquerLoader();
      _modale.surFermeture = null;
      fermerModale();
      annoncer('Card deleted.');
      await rafraichirMaintenant();
    } catch (e) {
      masquerLoader();
      afficherErreur('The card could not be deleted.', e);
    }
  };
  var activite = c.historique ? blocActivite(carte) : null;
  ouvrirModale({ titre: carte.titre || 'Untitled', sousTitre: 'Column: ' + libelleEtape(carte.cle), laterale: true,
    corps: activite ? [ongletsFiche(carte, fiche, activite.noeud, !!opts.activite)] : [fiche], focus: opts.activite && activite ? 'wActTexte' : 'fcTitre',
    /* Any input still pending is saved on close: the values are read
       before the card details are cleared. */
    surFermeture: function () { relayer(sauver(), 'Saving on close'); },
    fermerDehors: true,
    pied: [etat.peutModifier ? bouton('Delete the card', 'discret', 'delete-line', supprimer) : null, statut] });
}

/* === SECTION : REMOVAL AND ERROR SCREENS === */
/* Reordering a settings list by dragging, handle only: the checkboxes and
   buttons of the row keep working normally. */
function brancherTriListe(ol, surFin) {
  if (typeof Sortable === 'undefined') { return; }
  setTimeout(function () {
    if (!document.body.contains(ol)) { return; }
    etat.sortables.push(Sortable.create(ol, {
      handle: '.w-poignee', animation: 150, forceFallback: true, fallbackOnBody: true,
      onEnd: function (evt) { if (evt.oldIndex !== evt.newIndex) { relayer(surFin(evt.oldIndex, evt.newIndex), 'Reordering'); } }
    }));
  }, 0);
}

async function recommencer() {
  if (enParametrage()) { await enregistrerMaintenant(); }
  var c = etat.config;
  /* Cards table deleted in the meantime: only the Kanban settings are
     left to erase. */
  var tableAbsente = !!(c && c.tableCartes && !etat.meta.tables[c.tableCartes]);
  var partagee = !!(c && c.colKanban) && !tableAbsente;
  var nb = partagee ? etat.cartes.length : 0;
  var ok = await confirmerAction('Delete this Kanban?', partagee
    ? 'The Kanban disappears from the tabs' + (nb ? ' and its ' + formaterNombre(nb) + ' card' + (nb !== 1 ? 's are deleted' : ' is deleted') : '') + '. The other Kanbans in the document are not affected.'
    : (tableAbsente ? 'The Kanban disappears from the tabs and its settings are erased. Its table no longer exists in the document.'
      : 'The Kanban disappears from the tabs and its settings are erased. Your table and its rows are kept.'), 'Delete');
  if (!ok) { return; }
  afficherLoader('Deleting the Kanban…');
  try {
    if (partagee) {
      /* Shared table: the Kanban cards are deleted, along with the columns
         no other Kanban uses. The table stays. */
      /* The list of Kanbans is re-read just before: a Kanban created in the
         meantime by a colleague may reuse a column that the list loaded at
         opening did not know about. All deletions are sent together: a
         failure midway does not leave a half-deleted Kanban. */
      await chargerMeta();
      await lireTableaux();
      var d = await lireTable(c.tableCartes);
      var ids = [];
      for (var i = 0; i < d.id.length; i++) { if (colonneDe(d, c.colKanban, i) === c.idKanban) { ids.push(d.id[i]); } }
      var actions = [];
      if (ids.length) { actions.push(['BulkRemoveRecord', c.tableCartes, ids]); }
      var cols = (c.champs || []).map(function (ch) { return ch.col; });
      for (var k = 0; k < cols.length; k++) {
        if (IDS_RESERVES.indexOf(cols[k].toUpperCase()) === -1 && infoColonne(c.tableCartes, cols[k]) && !colonneUtiliseeAilleurs(c.tableCartes, cols[k])) {
          actions.push(['RemoveColumn', c.tableCartes, cols[k]]);
        }
      }
      if (etat.biblioLigne) { actions.push(['RemoveRecord', etat.biblio, etat.biblioLigne]); }
      if (actions.length) { await agir(actions); }
    } else if (etat.biblioLigne) { await agir([['RemoveRecord', etat.biblio, etat.biblioLigne]]); }
    etat.brouillon = null;
    etat.biblioLigne = null;
    etat.config = null;
    etat.tableauSession = null;
    etat.tableauMemorise = null;
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    afficherErreur('The Kanban could not be deleted.', e);
  }
}

function rendreInvalide(zone) {
  zone.appendChild(creer('div', { classe: 'w-centre' }, [titreVue('The Kanban can no longer find its data'),
    creer('p', { classe: 'w-texte', texte: 'The table or one of the main columns of the Kanban no longer exists in this document, or has been renamed.' }),
    etat.peutParametrer ? bouton('Delete this Kanban', null, 'delete-line', recommencer)
      : creer('p', { classe: 'w-texte', texte: 'Report it to an owner of the document.' })]));

/* === SECTION : ACCESS RIGHTS === */
/* Step-by-step box to reserve the settings for owners and lock the Kanban
   for viewers. */
function encartDroits() {
  var nomBib = etat.biblio || ID_BIBLIO;
  var detail = creer('div', { id: 'kDroitsDetail', attrs: { hidden: '' } }, [
    creer('p', { classe: 'w-texte', texte: 'In Document settings, then Access rules, add on the table ' + nomBib + ':' }),
    creer('p', { classe: 'w-texte', texte: '1. Reserve the settings for owners. Condition: user.Access != OWNER and rec.KEY == "' + CLE_ACCES_PARAMETRAGE + '". Deny Read.' }),
    creer('p', { classe: 'w-texte', texte: '2. Lock the Kanban for viewers. Condition: user.Access not in [OWNER, EDITOR] and rec.KEY == "' + CLE_ACCES_EDITION + '". Deny Read.' }),
    creer('p', { classe: 'w-texte', texte: '3. Protect the settings. Condition: user.Access != OWNER. Deny Create, Update and Delete on the whole table ' + nomBib + ' (Read stays allowed: without it, nobody can see the Kanbans any more).' }),
    creer('p', { classe: 'w-texte', texte: 'Without these rules, the settings stay available to everyone, and a viewer sees the editing controls until their first attempt, which the document refuses. Hiding is a convenience: the real protection comes from rule 3 and the document permissions.' })]);
  var btn = bouton('Show the steps', 'discret', null, function () {
    var ouvert = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', ouvert ? 'false' : 'true');
    if (ouvert) { detail.setAttribute('hidden', ''); } else { detail.removeAttribute('hidden'); }
    btn.textContent = ouvert ? 'Show the steps' : 'Hide the steps';
  }, { petit: true });
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', 'kDroitsDetail');
  return creer('div', { classe: 'ui-alert ui-alert--info ui-alert--sm w-opt' }, [
    creer('p', { classe: 'ui-alert__title', texte: 'Reserve the settings for owners' }),
    creer('p', { texte: 'Viewers and editors view the Kanban and use search and filters. Editors move and edit cards. Only owners change the settings, once the access rules are in place.' }),
    btn, detail]);
}
/* The person's rights, deduced from the marker rows they can read.
   If missing, they are created once per session; creation fails silently
   for a viewer, who then switches to read-only.
   Without a library (no Kanban yet), there is nothing to protect: creation
   stays available. */
async function determinerDroits() {
  if (!etat.biblio) { etat.peutModifier = true; etat.peutParametrer = true; return; }
  var manque = [];
  if (!etat.temoinEdition) { manque.push(CLE_ACCES_EDITION); }
  if (!etat.temoinParam) { manque.push(CLE_ACCES_PARAMETRAGE); }
  if (manque.length && !etat.temoinsTentes) {
    etat.temoinsTentes = true;
    try {
      await gristAvecTimeout(grist.docApi.applyUserActions(manque.map(function (k) {
        return ['AddRecord', etat.biblio, null, { KEY: k, VALUE: 'Access rights marker row: do not edit.', VERSION_CREATED: VERSION_WIDGET, VERSION_UPDATED: VERSION_WIDGET }];
      })), DELAI_API_MS);
      await lireTableaux();
    } catch (e) {
      logSecurite('INFO', 'Marker rows not created (read-only or restricted rights)', e);
    }
  }
  etat.peutModifier = !!etat.temoinEdition;
  etat.peutParametrer = etat.peutModifier && !!etat.temoinParam;
}

/* === SECTION : LOADING AND REFRESH === */
/* Loading is read-only: no structural change is made there. Column repair
   and the history formula are handled in the settings, by an owner.
   Written at every opening, they failed for a viewer and slowed everyone
   down. */
async function chargerTout() {
  await chargerMeta();
  etat.biblio = trouverTable(ID_BIBLIO);
  await lireTableaux();
  await determinerDroits();
  choisirTableau();
  if (!etat.config) {
    if (!etat.peutParametrer) { afficherVue('aucun'); return; }
    if (!enCreation()) { ouvrirNouveauKanban(); }
    return;
  }
  if (!verifierConfig()) { afficherVue('invalide'); return; }
  await chargerDonnees();
  afficherVue('tableau');
}

/* Fingerprint of the displayed data: a re-read that changes nothing does
   not redraw the Kanban (scroll and focus preserved). */
function empreinteDonnees() {
  return JSON.stringify([etat.etapes, etat.cartes.map(function (x) { return [x.id, x.titre, x.cle, x.ordre, x.valeurs]; })]);
}

async function rafraichirMaintenant(silencieux, apresRelecture) {
  if (etat.vue !== 'tableau') { return; }
  try {
    var avant = empreinteDonnees();
    if (!silencieux) {
      if (Date.now() - etat.metaLueA > DELAI_RELECTURE_META_MS) { await chargerMeta(); }
      if (!etat.config || !verifierConfig()) {
        /* Before declaring the Kanban invalid, the structure is re-read: a
           column may have been added or renamed since the last read. */
        await chargerMeta();
        if (!etat.config || !verifierConfig()) { afficherVue('invalide'); return; }
      }
    }
    /* Settings changed by someone else (columns, fields, name, another
       Kanban): the library is re-read, so that the Kanban shows them and a
       later write from this widget never puts back an outdated
       configuration. */
    var nomsTableaux = function () { return JSON.stringify(etat.tableaux.map(function (t) { return [t.cle, t.config.nom]; })); };
    var bruteAvant = etat.configBrute;
    var nomsAvant = nomsTableaux();
    await lireTableaux();
    choisirTableau();
    if (!etat.config) { await chargerTout(); return; }
    var reglagesChanges = etat.configBrute !== bruteAvant || nomsTableaux() !== nomsAvant;
    if (reglagesChanges) { await chargerMeta(); }
    if (!verifierConfig()) {
      await chargerMeta();
      if (!verifierConfig()) { afficherVue('invalide'); return; }
    }
    await chargerDonnees();
    etat.rafraichirEnAttente = false;
    if (silencieux && !reglagesChanges && empreinteDonnees() === avant) { return; }
    if (etat.vue === 'tableau' && !etat.modaleOuverte && !etat.glisserEnCours) {
      var actif = document.activeElement;
      var idActif = actif && actif.id ? actif.id : null;
      var carteActive = actif && actif.closest ? actif.closest('.w-carte') : null;
      var idCarte = carteActive ? carteActive.getAttribute('data-id') : null;
      /* Focus returns to the same control of the card (title, comments
         bubble, Move button): a refresh triggered by the history must not
         make keyboard users lose their place. */
      var classeActive = null;
      if (carteActive) { ['w-carte__deplacer', 'w-carte__bulle', 'w-carte__ouvrir'].some(function (k) { if (actif.classList.contains(k)) { classeActive = k; return true; } return false; }); }
      var colActive = carteActive && carteActive.closest ? carteActive.closest('.w-colonne') : null;
      var cleColActive = colActive ? colActive.getAttribute('data-cle') : null;
      if (reglagesChanges) { afficherVue('tableau', true); } else { redessinerColonnes(); }
      if (idCarte) {
        var base = '.w-carte[data-id="' + idCarte + '"] ';
        var n = document.querySelector(base + '.' + (classeActive || 'w-carte__ouvrir')) || document.querySelector(base + '.w-carte__ouvrir');
        /* Card gone (deleted): focus goes to its column, not to the page. */
        if (!n) { n = (cleColActive !== null && document.getElementById('tAjout_' + cleId(cleColActive))) || document.getElementById('titreVue'); }
        if (n) { n.focus(); }
      } else if (idActif && document.getElementById(idActif)) { document.getElementById(idActif).focus(); }
    }
  } catch (e) {
    /* Table or column renamed in Grist since the structure was last read:
       the structure is re-read once and the refresh tried again. */
    if (!apresRelecture) {
      var relue = false;
      try { await chargerMeta(); relue = true; } catch (e3) { logSecurite('INFO', 'Structure not re-read', e3); }
      if (relue) { return rafraichirMaintenant(silencieux, true); }
    }
    if (silencieux) { logSecurite('WARNING', 'Automatic re-read failed', e); }
    else { afficherErreur('The Kanban could not be refreshed.', e); }
  }
}

/* Periodic re-read, a single timer: only when the page is visible, on the
   Kanban view, with no window open and no drag in progress. */
function demarrerActualisationAuto() {
  if (_minuterieActualisation) { clearInterval(_minuterieActualisation); }
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState !== 'visible' || etat.vue !== 'tableau' || etat.modaleOuverte || etat.glisserEnCours) { return; }
    relayer(rafraichirMaintenant(true), 'Automatic re-read');
  }, DELAI_ACTUALISATION_MS);
}

/* Changes received during a drag and drop or while a window is open are
   deferred: redrawing would interrupt the input. */
function planifierRafraichissement() {
  if (etat.vue !== 'tableau') { return; }
  if (etat.modaleOuverte || etat.glisserEnCours) { etat.rafraichirEnAttente = true; return; }
  if (etat.minuterieRafraichir) { clearTimeout(etat.minuterieRafraichir); }
  etat.minuterieRafraichir = setTimeout(function () {
    etat.minuterieRafraichir = null;
    relayer(rafraichirMaintenant(), 'Refresh');
  }, 300);
}

async function detecterTableLiee() {
  try {
    etat.tableLiee = await gristAvecTimeout(grist.selectedTable.getTableId(), 5000);
  } catch (e) {
    etat.tableLiee = null;
    logSecurite('INFO', 'Table linked to the view could not be determined', e);
  }
}

async function initializer() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Loading the Kanban…');
  try {
    await detecterTableLiee();
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { logSecurite('INFO', 'Document name not read', e); }
    lireTableauMemorise();
    await chargerMeta();
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERROR', 'Initialisation', e);
    afficherErreur('Loading failed.');
    afficherVue('echec');
  } finally {
    etat.initEnCours = false;
  }
}

/* === SECTION : LISTENERS AND STARTUP === */
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
dessinerLogo();
document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
document.getElementById('wSuccesFermer').addEventListener('click', masquerSucces);
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wVisionneuseFermer').addEventListener('click', fermerVisionneuse);
document.getElementById('wVisionneusePlein').addEventListener('click', basculerPleinEcranVisionneuse);
document.getElementById('wVisionneuseTelecharger').addEventListener('click', function () {
  if (_visionneuse.id) { relayer(telechargerPJ(_visionneuse.id), 'Download from the viewer'); }
});
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'tableau' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(true), 'Re-read on returning to the page'); } });

grist.ready({ requiredAccess: 'full', columns: [], allowSelectBy: true });
/* When the user changes the table linked to the view, the Kanban choice
   is made again; a Kanban chosen during the session keeps priority. */
async function suivreLiaison() {
  var avant = etat.tableLiee;
  await detecterTableLiee();
  if (avant === etat.tableLiee) { return false; }
  if (['tableau', 'invalide'].indexOf(etat.vue) === -1 || etat.modaleOuverte || etat.initEnCours) { return false; }
  await chargerTout();
  return true;
}

grist.onRecords(function (records) {
  var ids = {};
  (records || []).forEach(function (r) { ids[r.id] = true; });
  etat.derniersIds = ids;
  majIdsVisibles();
  relayer(suivreLiaison().then(function (change) { if (!change) { planifierRafraichissement(); } }), 'Tracking the view link');
});

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) {
    logSecurite('ERROR', 'Unhandled rejected promise', evt ? evt.reason : undefined);
  });
}, 1500);

relayer(initializer(), 'Initialisation');
demarrerActualisationAuto();
</script>
</body>
</html>
