<!DOCTYPE html>
<!--
  ============================================================================
  READ ME - Gristkanban
  ============================================================================
  Version     : 1.0.0-en
  Date        : 29/10/2026
  Author      : madeXcé
  License     : MIT
  Platform    : Grist (custom widget)
  Compliance  : WCAG 2.1 AA (Section 508) | OWASP
  ============================================================================

  DESCRIPTION
  -----------
  Gristkanban: a Kanban widget for everyone, no technical knowledge needed.
  One widget hosts all the Kanbans of a document, shown as tabs; the last
  tab, "New Kanban", creates another one.

  Creation is guided by a clickable step bar (no button at the bottom of
  the page); nothing is written to the document before "Create my Kanban".
  A single question to start with:
  - I already have data in this document: Kanbans suggested from the
    document's tables (stage column, title, due date, owner), or free
    settings; the existing table is never restructured, apart from the
    announced addition of a SORT_ORDER column;
  - I don't have any data yet: a blank Kanban, one of the eleven
    ready-made templates (Support requests, Project management,
    Recruitment, Event planning, Content calendar, Customer support
    tickets, Sales pipeline, Training sessions, Bug tracking, Contracts,
    Risk management), or the structure of a Kanban of the document
    (without its cards).
  Common steps: the Kanban (name, optional description), the columns, the
  card fields, the card and card details, filters and search, review.

  Settings of an existing Kanban: same steps, automatic saving (about 1 s
  after the last change), status shown at all times, deletions confirmed
  on the spot, direct return to the Kanban.

  Day to day:
  - columns scroll on their own, the page stays fixed; empty columns
    collapsed;
  - drag and drop of cards and columns; alternatives without dragging:
    Move button, column and position in card details, arrows in the
    settings (WCAG 2.5.7);
  - side panel for card details with automatic saving, attachments;
  - search, filters, "Group by" (owner, priority, reference, yes/no);
  - card display: chosen and ordered fields, field names shown or not,
    cover image, color based on a value, compact mode, overdue due dates
    flagged;
  - automatic refresh: platform notifications, re-read every 20 s while
    the page is visible, re-read when returning to the page; the screen is
    redrawn only if the data has changed.

  COLUMN TYPES
  ------------
  Displayed and editable: text (including multi-line and links), number,
  integer, amount, percentage (column formats respected), yes/no, date,
  date and time (in the column's time zone), choice list, multiple choice,
  reference and reference list (search beyond 30 rows), attachments.
  Not editable, reason shown: formula columns, columns updated on every
  change, metadata fields, undefined type.
  An invalid value is shown, flagged and kept.
  At creation, all these types are offered except references.

  HISTORY
  -------
  1.0.0-en - 29/10/2026 - madeXcé - English international edition: English interface, madeXcé theme instead of the French government design system, English table and column identifiers, international templates.
  1.0.0 - 29/10/2026 - madeXcé - First public version.

  DEPENDENCIES
  ------------
  - Styling: self-contained madeXcé theme (Palm Springs palette on a
    Grist-like base; ui-* classes and design tokens on :root), no external
    stylesheet or web font.
  - Icons: Remix Icon (https://remixicon.com), embedded as SVG masks.
  - SortableJS v1.15.6 (drag and drop of cards and columns)
  - Grist Plugin API (grist-plugin-api.js), loaded from
    docs.getgrist.com: origin required by the platform, unversioned URL,
    so not covered by an SRI hash
  - pdf.js v6.2.108, legacy build (PDF preview), loaded on demand

  RESOURCE INTEGRITY (SRI)
  ------------------------
  Each CDN resource with a pinned version carries an
  integrity="sha256-..." hash and crossorigin="anonymous".
  Not covered: grist-plugin-api.js, unversioned URL.
  pdf.js (pdf.min.mjs and pdf.worker.min.mjs) is loaded by the script,
  which cannot carry an integrity attribute: each file is downloaded, its
  SHA-256 hash compared with the value pinned in PDFJS, and it is executed
  only if they match.

  AUTO-CREATED TABLES
  -------------------
  📋 KANBAN LIBRARY ⚡ (KANBAN_LIBRARY_ after renaming): technical
  settings table, one row per Kanban (KEY = CONFIG:<identifier>) whose
  VALUE column holds the configuration as JSON. Created with the first
  Kanban. Excluded from table lists by estTableExclue().
  KANBAN_CARDS: a single card table for all the Kanbans created by the
  widget ("Start from scratch" and "Use this template" paths), created
  with the first of them. No other table is created afterwards. Each card
  carries the identifier of its Kanban (KANBAN), its title (TITLE), its
  column (COLUMN, choice list) and its rank (SORT_ORDER), then the chosen
  fields. A new Kanban reuses an existing column with the same name and
  type and only adds the missing ones; the offered values (people,
  priorities...) stay specific to each Kanban. Deleting a Kanban deletes
  its cards and the columns no other Kanban uses; the table remains.
  KANBAN_HISTORY and KANBAN_COMMENT: technical columns of the activity
  feed. KANBAN_HISTORY is a trigger formula (recalculated on every change
  to the row) generated by the widget from the tracked fields: it compares
  the previous state of the card (variable value) with its current state
  and appends the differences, with user.Name and NOW(), to a JSON
  {"etat", "journal", "com"} limited to 300 events. The widget puts each
  comment in KANBAN_COMMENT; the formula adds it to the feed. For a Kanban
  connected to an existing table, these two columns are added to that
  table only if the option is ticked.
  Field identifiers in upper case. Each table carries the four metadata
  fields CREATED_AT, CREATED_BY, UPDATED_AT, UPDATED_BY. The pages created
  automatically with the tables are deleted straight away: the widget is
  the only intended interface.

  METADATA FIELDS
  ---------------
  CREATED_AT, CREATED_BY, UPDATED_AT and UPDATED_BY are trigger formula
  columns, filled by the platform and never by this widget.

  CONFIGURATION AND SINGLE SOURCE
  -------------------------------
  Kanbans created by the widget: their columns (To do, In progress...) and
  their order are stored in their configuration. Kanbans connected to an
  existing table: the columns are read from their source on every load
  (rows of the referenced table, or values of a choice column). No call to
  setOption: the configuration lives in the library. The last Kanban
  viewed is remembered by the browser (localStorage), per document.

  CHANGES TO EXISTING TABLES
  --------------------------
  "Use my data" path: only one structural change is possible, the addition
  of a numeric SORT_ORDER column (or KANBAN_SORT_ORDER if the name is
  taken) to remember the manual order of the cards; it is announced at the
  review step. No column is ever retyped or deleted: a column removed from
  the Kanban stays in the table. The values of a choice list used as the
  stage can be renamed, added, reordered or deleted from the settings
  (cards updated accordingly).

  REFRESH AND LINKING
  -------------------
  Data is read with fetchTable. When the custom view is linked to the card
  table, filters and selection by another view are respected (identifiers
  received through onRecords), and opening a card moves the cursor to the
  matching row. Any update received during a drag and drop or while card
  details are open is deferred until they close. A single timer drives the
  automatic re-read.

  REQUIRED RIGHTS
  ---------------
  Full access to the document: the widget creates tables and columns and
  writes to cards. A person with read-only access sees the Kanbans; their
  write attempts are refused by the platform.

  SECURITY
  --------
  - No dynamic code execution, no access to the parent frame
  - No data is inserted as HTML: the DOM is built with textContent and
    setAttribute; Markdown is shown as plain text.
    echapperHTML() is part of the shared base and remains available, with
    no call in this version
  - Logo drawn element by element (createElementNS): no markup is inserted
  - Attachments and cover images: files fetched as Blobs, the access token
    appears in no link on the page; preview limited to raster images and
    PDFs, type enforced from the extension; 20 MB maximum, executables
    refused
  - Links: only the http and https schemes are made clickable, with
    rel="noopener noreferrer"
  - Logging via logSecurite(), neutral error messages
  - Confirmations through HTML modals, listeners set with addEventListener

  ACCESS TOKEN IN REST CALLS
  --------------------------
  Downloading attachments passes the access token as a URL parameter of
  the fetch call. The expected form would be the Authorization header, but
  it does not work on the platform: the widget runs in a frame whose
  origin differs from the API's, and that header requires a preflight
  check that the server refuses. The token appears in no link or attribute
  of the page, but it may appear in server logs.
  Mitigations: token requested at the time of the call, limited to the
  current document only, renewed before expiry, never stored outside the
  page's memory and never logged.

  RIGHTS AND RECOMMENDED ACL SETUP
  --------------------------------
  Three levels: viewers (viewing, search, filters, card details read-only),
  editors (in addition: adding, editing, moving and deleting cards,
  comments), owners (in addition: settings, creating and deleting Kanbans,
  column order).
  The widget reads two marker rows of KANBAN_LIBRARY (KEY equal to
  EDIT_ACCESS and SETTINGS_ACCESS), which it creates once. An access rule
  makes them unreadable to those who must not edit or change settings;
  the procedure is shown in the settings.
  Without these rules, a refused write switches the interface to
  read-only. Hiding is a convenience: real protection comes from the
  access rules and the document's rights.
  Loading writes nothing: column repairs and the history formula are done
  in the settings, by an owner.

  ACCESSIBILITY
  -------------
  Step bar and tabs usable with the keyboard, state of steps and of saving
  announced to screen readers, accessible names containing the visible
  text, color never the only carrier of information, targets of at least
  24 px, alternatives to drag and drop.

  THEME
  -----
  data-ui-theme="light": the widget stays in the light theme, for
  consistency with the host application shown around the frame.
-->

  /* === SECTION : BASE === */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey);
      font-family: var(--font-ui); font-size: 1rem; }
    #skipLink:focus { position: fixed; top: 0; left: 0; z-index: 9999; padding: .5rem 1rem; clip: auto; width: auto; height: auto;
      overflow: visible; white-space: nowrap; font-size: .875rem;
      background: var(--background-default-grey); color: var(--text-action-high-primary); }
    main[hidden], div[hidden], section[hidden], p[hidden], button[hidden], .ui-btn[hidden] { display: none; }
    .w-contenu { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 1.75rem; color: var(--text-default-grey); }
    .w-titre-vue { margin: 0 0 .25rem; }
    .w-mention { color: var(--text-mention-grey); font-size: .8125rem; margin: 0; }
    .w-texte { font-size: .875rem; line-height: 1.55; margin: 0; color: var(--text-default-grey); }

  /* SECTION : BANNER */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-primary);white-space:nowrap;margin:0;line-height:1}
    .w-bandeau__version{font-size:.75rem;color:var(--text-mention-grey);font-weight:400;margin-left:.5rem;white-space:nowrap}
    /* madeXcé logo: colors read from the design tokens */
    .w-logo{display:block;width:100%;height:auto}
    .w-logo__made{fill:var(--text-mention-grey);font-weight:400}
    .w-logo__x{fill:var(--text-label-accent-pink);font-weight:700}
    .w-logo__ce{fill:var(--text-title-primary);font-weight:800}

  /* === SECTION : LOADER AND BANNERS === */
    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Overlay veil: the only hard-coded color allowed, since the
         --background-overlap-grey token designates an opaque surface. */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }

    .w-carte__infos { display: flex; flex-direction: column; gap: .1875rem; font-size: .8125rem; color: var(--text-default-grey); }

    .w-carte--c-rose { border-left-color: #d6336c; }

    /* Tab row stuck at the top when the page scrolls (creation, settings).

    .w-onglets { position: sticky; top: -1rem; z-index: 5; background: var(--background-default-grey); padding-top: .25rem; color: var(--text-default-grey); }

    .w-activite { display: flex; flex-direction: column; gap: .75rem; }

    .w-activite__entete { margin: 0; font-size: .75rem; color: var(--text-mention-grey); }

  /* === SECTION : BANNER ADJUSTMENTS ===
     Rules added after those of the shared banner, without changing them: a

    .w-bandeau__marque { min-width: 0; flex-shrink: 1; }

  /* === SECTION : STEP BAR === */
    .w-stepper .ui-stepper__title { margin-bottom: .75rem; }

    .w-etapes__item { display: flex; flex-direction: column; gap: .375rem; min-width: 0; }
    .w-etapes__segment { display: block; height: .375rem; background: var(--background-contrast-grey); color: var(--text-default-grey); }

  /* === SECTION : KANBAN SETUP WIZARD === */
    .w-assistant__tete { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }

    .w-detail { list-style: none; }
    .w-puces { list-style: none; margin: .25rem 0 .5rem; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
    .w-puce { display: inline-flex; align-items: center; gap: .25rem; padding: .125rem .25rem .125rem .75rem; font-size: .875rem;

    .w-c3--serre { grid-template-columns: minmax(14rem, 20rem) minmax(12rem, 16rem) minmax(18rem, 24rem); gap: 0; justify-content: start; }

    .w-c3__apercu { min-width: 0; position: sticky; top: .5rem; display: flex; flex-direction: column; gap: .75rem; }

    @media (max-width: 62em) { .w-c3, .w-c3--serre { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .w-c3--serre > div { padding: 0; } .w-c3--serre > div + div { border-left: 0; } .w-c3__apercu { grid-column: 1 / -1; position: static; } .w-c3--deux .w-c3__apercu { grid-column: auto; } }
    @media (max-width: 48em) { .w-c3, .w-c3--deux { grid-template-columns: minmax(0, 1fr); } .w-c3__apercu { grid-column: auto; } }
    .w-apercu-volet { display: flex; flex-direction: column; align-items: flex-start; gap: .375rem; padding: .75rem 1rem; font-size: .8125rem; background: var(--background-default-grey); border-left: .25rem solid var(--border-action-high-primary); color: var(--text-default-grey); }
    .w-apercu-volet__titre { margin: .5rem 0 0; font-weight: 700; color: var(--text-title-grey); }
    .w-apercu-volet__titre:first-child { margin-top: 0; }

    .w-apercu-volet__bouton { padding: .125rem .5rem; color: var(--text-action-high-primary); border: 1px solid var(--border-action-high-primary); }
    .w-apercu-volet .w-apercu-champ { align-self: stretch; }
    .w-apercu-champ { font-size: .75rem; color: var(--text-mention-grey); padding: .375rem .625rem; background: var(--background-contrast-grey);

    .w-recap__alerte { color: var(--text-default-warning); }

  /* === SECTION : KANBAN TABS === */
    .w-onglets { margin-bottom: 1rem; }

<script>

  { id: 'CREATED_AT', type: 'DateTime:America/New_York', label: 'CREATED_AT', formula: 'NOW()', recalcWhen: 0 },
  { id: 'CREATED_BY', type: 'Text', label: 'CREATED_BY', formula: 'user.Email', recalcWhen: 0 },

/** Logging. Allowed levels: 'ERROR', 'WARNING', 'INFO'. */
function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERROR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'WARNING') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('WARNING', 'Loading overlay hidden automatically after 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Loading…'; }
  /* The overlay only appears past the threshold: a short operation no
     longer makes the screen flicker. masquerLoader cancels this delay, so
     the overlay is never shown for a quick operation. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight forces a reflow before the class is removed. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('WARNING', quoi, e); });
  }
  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';
  var div = document.createElement('div');
  div.textContent = String(texte);
  /* Quotes are escaped as well as angle brackets: the output also feeds
     attribute values (title, data-*, value), where an unescaped quote would
     allow breaking out of the attribute. */
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if ((up.indexOf('LIBRARY') !== -1 || up.indexOf('BIBLIOTHEQUE') !== -1) && brut.charAt(brut.length - 1) === '_') { return true; }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

  texte.setAttribute('x', '2');

  texte.setAttribute('textLength', '96');

/* === SECTION : DOM UTILITIES ===
   The DOM is built with textContent: no data is ever inserted as HTML. */
function creer(tag, o, enfants) {
  var n = document.createElement(tag);
  o = o || {};
  if (o.classe) { n.className = o.classe; }
  if (o.id) { n.id = o.id; }
  if (o.texte !== undefined && o.texte !== null) { n.textContent = String(o.texte); }
  if (o.attrs) {
    Object.keys(o.attrs).forEach(function (k) {
      var v = o.attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      n.setAttribute(k, v === true ? '' : String(v));
    });
  }
  if (tag === 'button' && !n.hasAttribute('type')) { n.setAttribute('type', 'button'); }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') { n.setAttribute('autocomplete', 'off'); }
  if (o.valeur !== undefined && o.valeur !== null) { n.value = String(o.valeur); }
  if (o.coche) { n.checked = true; }
  if (o.clic) { n.addEventListener('click', o.clic); }
  if (o.change) { n.addEventListener('change', o.change); }
  if (o.saisie) { n.addEventListener('input', o.saisie); }
  (enfants || []).forEach(function (e) {
    if (e === null || e === undefined || e === false) { return; }
    n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
  });
  return n;
}

function bouton(libelle, variante, icone, clic, o) {
  o = o || {};
  var classes = ['ui-btn'];
  if (variante === 'secondaire') { classes.push('ui-btn--secondary'); }
  if (variante === 'tertiaire') { classes.push('ui-btn--tertiary'); }
  if (variante === 'discret') { classes.push('ui-btn--tertiary-no-outline'); }
  if (o.petit) { classes.push('ui-btn--sm'); }
  if (icone) { classes.push('ui-icon-' + icone); classes.push(o.iconeSeule ? 'ui-btn--icon-only' : (o.iconeDroite ? 'ui-btn--icon-right' : 'ui-btn--icon-left')); }
  if (o.classe) { classes.push(o.classe); }
  /* Icon-only button: its label is read only by screen readers, never
     displayed, whatever the styling. */
  var b = creer('button', { classe: classes.join(' '), texte: o.iconeSeule ? null : libelle, id: o.id,
    attrs: { 'aria-label': o.aria || null, disabled: o.desactive || null } }, o.iconeSeule ? [creer('span', { classe: 'ui-sr-only', texte: libelle })] : null);
  if (o.attrs) { Object.keys(o.attrs).forEach(function (k) { b.setAttribute(k, o.attrs[k]); }); }
  if (clic) {
    b.addEventListener('click', function (e) {
      var r = clic(e);
      if (r && typeof r.then === 'function') { relayer(r, 'Action: ' + libelle); }
