    bouton(actionFinale.libelle, null, 'check-line', actionFinale.action, { id: actionFinale.id, classe: 'w-etapes-action' })]) : ol);
  return d;
}

/* === SECTION: DOCUMENT WITHOUT A KANBAN ===
   A document that has no Kanban yet opens directly on the "New Kanban"
   tab: step bar and choice of the starting point. */
function ouvrirNouveauKanban() {
  if (!etat.peutParametrer) { afficherVue('aucun'); return; }
  etat.brouillon = { mode: 'creation', etape: 0 };
  afficherVue('assistant');
}

/* === SECTION: INPUTS AND SUMMARIES === */
/* Rejected input: design system error message below the field, linked
   with aria-describedby, focus on the field and announcement. This is not
   an anomaly: logged at INFO level. */
function marquerInvalide(id, message, sansFocus) {
  var n = document.getElementById(id);
  logSecurite('INFO', 'Input rejected: ' + message);
  if (!n) { signalerSaisie(message); return; }
  var idMsg = id + '_erreur';
  var ancien = document.getElementById(idMsg);
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  var msg = creer('p', { classe: 'ui-error-text', id: idMsg, texte: message });
  var groupe = n.closest ? n.closest('.ui-input-group') : null;
  if (groupe) { groupe.classList.add('ui-input-group--error'); groupe.appendChild(msg); }
  else if (n.parentNode) { n.parentNode.insertBefore(msg, n.nextSibling); }
  n.setAttribute('aria-invalid', 'true');
  n.setAttribute('aria-describedby', idMsg);
  var effacer = function () {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
    if (groupe) { groupe.classList.remove('ui-input-group--error'); }
    if (msg.parentNode) { msg.parentNode.removeChild(msg); }
    n.removeEventListener('input', effacer);
    n.removeEventListener('change', effacer);
  };
  n.addEventListener('input', effacer);
  n.addEventListener('change', effacer);
  if (!sansFocus) { n.focus(); }
  annoncer(message);
}

/* Rejected input with no field to point to: banner, without ERROR level. */
function signalerSaisie(message) {
  logSecurite('INFO', 'Input rejected: ' + message);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function recap(titre, lignes, allerA) {
  return creer('section', { classe: 'w-recap', attrs: { 'aria-label': titre } }, [
    creer('div', { classe: 'w-recap__tete' }, [creer('h3', { texte: titre }),
      allerA ? bouton('Edit', 'discret', 'edit-line', allerA, { petit: true, aria: 'Edit: ' + titre }) : null]),
    creer('ul', {}, lignes.map(function (l) { return creer('li', { texte: l }); }))
  ]);
}

/* === SECTION: KANBAN SETUP WIZARD (creation and customisation) ===
   The same six-step path is used to create a Kanban and to customize it.
   Everything happens on a draft: nothing is written to the document before
   the last step, where the changes are reviewed then saved in one go.
   "Cancel" discards the draft. */

function uid() { etat.uidSeq = (etat.uidSeq || 0) + 1; return 'u' + etat.uidSeq; }

/* Integers, amounts and percentages are numbers: only the column type and
   format tell them apart. */
function genreStocke(code) { return genreParCode(code).stocke || code; }

function genreAffiche(col, g) {
  if (g !== 'nombre' || !col) { return g; }
  var o = col.options || {};
  if (o.numMode === 'currency') { return 'montant'; }
  if (o.numMode === 'percent') { return 'pourcentage'; }
  if (col.type === 'Int') { return 'entier'; }
  return g;
}

function genreParCode(code) {
  for (var i = 0; i < GENRES.length; i++) { if (GENRES[i].code === code) { return GENRES[i]; } }
  return GENRES[0];
}

function libelleGenre(g, col) {
  for (var i = 0; i < GENRES.length; i++) { if (GENRES[i].code === g) { return GENRES[i].libelle; } }
  return col ? libelleType(col) : 'Other';
}

function optionsChoix(valeurs) {
  return { choices: valeurs.slice() };
}

function infoVide(libelle, genre) {
  return { uid: uid(), col: null, libelle: libelle || '', libelleInitial: null, genre: genre || 'texte', valeurs: [], valeursInitiales: [],
    echeance: false, responsable: false, supprimee: false, nouvelle: true, utilisee: true, utiliseeInitiale: true,
    surCarte: genre !== 'texte_long', dansFiche: true, typeFixe: false, valeursModifiables: true, peutSupprimer: true, ouverte: false };
}

/* Draft built from a definition (template, reused Kanban, blank Kanban):
   for creation only. */
function brouillonDepuisDefinition(def) {
  var b = { mode: 'creation', source: 'creation', etape: 1, nom: def.nom || '', description: def.description || '',
    colonnes: [], infos: [], ordreCarte: [], ordreFiche: [], compact: false, recherche: true, filtres: [], filtreRetard: false, tri: null,
    nomsInfos: true, couverture: null, couleur: null,
    colonnesModifiables: true, colonnesOrdonnables: true, origine: def.origine || null, ignores: def.ignores || [] };
  var o = def.options || {};
  def.etapes.forEach(function (n) {
    b.colonnes.push({ uid: uid(), cle: null, nom: n, nomInitial: null, supprimee: false, dest: null, nb: 0 });
  });
  var parLib = {};
  (def.champs || []).forEach(function (ch) {
    var i = infoVide(ch.libelle, ch.genre);
    i.valeurs = (ch.valeurs || []).slice();
    i.echeance = !!ch.echeance && ch.genre === 'date';
    i.responsable = !!ch.responsable;
    if (ch.surCarte !== undefined) { i.surCarte = !!ch.surCarte; }
    if (ch.dansFiche !== undefined) { i.dansFiche = ch.dansFiche !== false; }
    b.infos.push(i);
    parLib[normalizer(ch.libelle)] = i.uid;
  });
  b.ordreCarte = b.infos.map(function (i) { return i.uid; });
  var of = (o.ordreFiche || []).map(function (l) { return parLib[normalizer(l)]; }).filter(Boolean);
  b.ordreFiche = of.concat(b.ordreCarte.filter(function (u) { return of.indexOf(u) === -1; }));
  b.compact = !!o.compact;
  b.recherche = o.recherche !== false;
  b.filtreRetard = o.filtreRetard !== undefined ? !!o.filtreRetard : b.infos.some(function (i) { return i.echeance; });
  if (o.filtres) { b.filtres = o.filtres.map(function (l) { return parLib[normalizer(l)]; }).filter(Boolean); }
  else { b.filtres = b.infos.filter(function (i) { return i.responsable; }).map(function (i) { return i.uid; }); }
  return b;
}

function brouillonVierge() {
  return brouillonDepuisDefinition({ nom: '', etapes: MODELES_ETAPES[0].slice(), champs: [
    { libelle: 'Description', genre: 'texte_long', surCarte: false },
    { libelle: 'Due date', genre: 'date', echeance: true },
    { libelle: 'Owner', genre: 'personne', responsable: true }] });
}

/* Draft built from the Kanban shown, to customize it. For a Kanban
   connected to a table, all the columns of the table are listed; the user
   chooses which ones to use, without ever creating or deleting any in
   their table. */
function brouillonDepuisConfig() {
  var c = etat.config;
  var src = c.sourceEtapes;
  var creation = c.mode === 'creation';
  var b = { mode: 'personnalisation', source: creation ? 'creation' : 'branche', etape: 1, nom: c.nom || '', description: c.description || '',
    colonnes: [], infos: [], compact: !!c.compact, recherche: c.recherche !== false, filtreRetard: !!c.filtreRetard,
    nomsInfos: c.nomsInfos !== false, couverture: null, couleur: null, historique: !!c.historique, archiveUid: null,
    tri: c.colOrdreCartes ? null : (c.tri ? { col: c.tri.col, sens: c.tri.sens } : { col: c.colTitre, sens: 'asc' }),
    colonnesModifiables: src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colAffichage),
    colonnesOrdonnables: src.type === 'choice' || src.type === 'liste' || (src.type === 'ref' && !!src.colOrdre) };
  etat.etapes.forEach(function (e) {
    b.colonnes.push({ uid: uid(), cle: e.cle, id: e.id, nom: e.libelle, nomInitial: e.libelle,
      supprimee: false, dest: null, nb: cartesDeEtape(e.cle).length });
  });
  var cols;
  if (creation) {
    cols = c.champs.map(function (ch) { return colonneCartes(ch.col); }).filter(Boolean);
  } else {
    cols = colonnesDe(c.tableCartes).filter(function (col) {
      return col.colId !== c.colEtape && col.colId !== c.colTitre && col.colId !== c.colOrdreCartes && IDS_META.indexOf(col.colId) === -1 && !estColonneTechnique(c.tableCartes, col.colId);
    });
  }
  var parCol = {};
  cols.forEach(function (col) {
    var ch = champDe(col.colId);
    var g = genreAffiche(col, genreDe(col, ch));
    var i = infoVide(ch && ch.libelle ? ch.libelle : col.label, g);
    i.col = col.colId;
    i.libelleInitial = i.libelle;
    i.nouvelle = false;
    i.typeFixe = true;
    i.valeurs = GENRES_A_VALEURS.indexOf(g) !== -1 ? valeursProposees(col.colId) : [];
    i.valeursInitiales = i.valeurs.slice();
    i.valeursModifiables = !col.formule && (col.type === 'Choice' || col.type === 'ChoiceList');
    i.echeance = c.colEcheance === col.colId;
    i.responsable = c.colResponsable === col.colId;
    i.utilisee = !!ch;
    i.utiliseeInitiale = i.utilisee;
    i.surCarte = ch ? !!ch.surCarte : true;
    i.dansFiche = ch ? estDansFiche(ch) : true;
    i.peutSupprimer = creation;
    i.lectureSeule = !estModifiable(col, g);
    b.infos.push(i);
    parCol[col.colId] = i.uid;
  });
  var ordreC = c.champs.map(function (ch) { return parCol[ch.col]; }).filter(Boolean);
  b.ordreCarte = ordreC.concat(b.infos.map(function (i) { return i.uid; }).filter(function (u) { return ordreC.indexOf(u) === -1; }));
  var ordreF = champsOrdreFiche().map(function (ch) { return parCol[ch.col]; }).filter(Boolean);
  b.ordreFiche = ordreF.concat(b.ordreCarte.filter(function (u) { return ordreF.indexOf(u) === -1; }));
  b.filtres = (c.filtres || []).map(function (f) { return parCol[f]; }).filter(Boolean);
  b.couverture = c.couverture ? parCol[c.couverture] || null : null;
  b.couleur = c.couleur ? parCol[c.couleur] || null : null;
  var colArch = c.colonneArchive ? b.colonnes.filter(function (x) { return x.cle === c.colonneArchive; })[0] : null;
  b.archiveUid = colArch ? colArch.uid : null;
  b.initial = JSON.stringify(etatComparable(b));
  b.initCarte = sequenceVisible(b, 'ordreCarte', 'surCarte');
  b.initFiche = sequenceVisible(b, 'ordreFiche', 'dansFiche');
  return b;
}

/* Sequence of the fields visible on the card or in the card details, in
   order: used to detect a change of content or order. */
function sequenceVisible(b, cle, prop) {
  return b[cle].map(function (u) {
    for (var i = 0; i < b.infos.length; i++) { if (b.infos[i].uid === u) { var x = b.infos[i]; return infoActive(x) && x[prop] ? u : null; } }
    return null;
  }).filter(Boolean).join('|');
}

/* The properties that define the Kanban, to know whether anything has
   changed since the draft was opened. */
function etatComparable(b) {
  return { nom: b.nom, description: b.description, compact: b.compact, recherche: b.recherche, filtreRetard: b.filtreRetard, tri: b.tri,
    nomsInfos: b.nomsInfos, couverture: b.couverture, couleur: b.couleur, historique: !!b.historique, archive: b.archiveUid || null,
    colonnes: b.colonnes.map(function (x) { return [x.cle, x.nom, x.supprimee, x.dest]; }),
    infos: b.infos.map(function (i) { return [i.col, i.libelle, i.genre, i.valeurs, i.echeance, i.responsable, i.supprimee, i.utilisee, i.surCarte, i.dansFiche]; }),
    ordreCarte: b.ordreCarte, ordreFiche: b.ordreFiche, filtres: b.filtres };
}

function infoParUid(u) {
  var b = etat.brouillon;
  for (var i = 0; i < b.infos.length; i++) { if (b.infos[i].uid === u) { return b.infos[i]; } }
  return null;
}

function colonneParUid(u) {
  var b = etat.brouillon;
  for (var i = 0; i < b.colonnes.length; i++) { if (b.colonnes[i].uid === u) { return b.colonnes[i]; } }
  return null;
}

function infoActive(i) { return i && !i.supprimee && i.utilisee; }
function colonnesActives() {
  var b = etat.brouillon;
  var l = b.colonnes.filter(function (x) { return !x.supprimee; });
  /* The archive column is always the last one. */
  var a = l.filter(function (x) { return x.uid === b.archiveUid; })[0];
  return a ? l.filter(function (x) { return x !== a; }).concat([a]) : l;
}

/* --- Entry points --- */
function demarrerCreation() {
  if (!etat.peutParametrer) { return; }
  etat.brouillon = { mode: 'creation', etape: 0 };
  afficherVue('assistant');
}

function ouvrirPersonnalisation() {
  if (!etat.peutParametrer) { return; }
  etat.brouillon = brouillonDepuisConfig();
  afficherVue('assistant');
}

/* Abandoning a creation: confirmation if a step has been started. */
async function quitterAssistant() {
  var b = etat.brouillon;
  if (b && b.etape > 0) {
    var ok = await confirmerAction('Discard the new Kanban?', 'Nothing has been created. The choices made in these steps are not kept.', 'Discard');
    if (!ok) { return; }
  }
  etat.brouillon = null;
  if (etat.tableaux.length) { await chargerTout(); } else { ouvrirNouveauKanban(); }
}

/* --- General rendering --- */
function rendreAssistantKanban(zone) {
  var b = etat.brouillon;
  if (b.mode === 'creation' && b.etape === 0) { rendreDepart(zone); return; }
  var bloc = creer('div', { classe: 'w-assistant' });
  var n = b.etape;
  var noms = b.mode === 'creation' ? PARCOURS.modele : ETAPES_PARAMETRAGE;
  var decalage = b.mode === 'creation' ? noms.length - ETAPES_ASSISTANT.length : 0;
  var rang = decalage + n;
  b.etapeMax = Math.max(b.etapeMax || 0, n);
  var finale = b.mode === 'creation' && n === ETAPES_ASSISTANT.length ? { libelle: 'Create my Kanban', action: validerAssistant, id: 'kValider' } : null;
  var tete = creer('div', { classe: 'w-assistant__tete' }, [stepper(rang, noms, function (r) {
    if (b.mode === 'creation' && r <= decalage) {
      return function () { b.etape = 0; if (r === 1) { b.choixDepart = null; } afficherVue('assistant'); };
    }
    var cible = r - decalage;
    if (b.mode === 'creation' && cible > b.etapeMax + 1) { return null; }
    return function () { if (cible > n && !validerEtape(n)) { return; } allerEtape(cible); };
  }, finale)]);
  var cote = creer('div', { classe: 'w-assistant__etat' });
  if (b.mode === 'personnalisation') {
    /* Settings: automatic saving, status shown continuously, direct return
       to the Kanban. */
    cote.appendChild(creer('p', { classe: 'w-mention', id: 'kTitrePerso', texte: 'Settings for "' + (etat.config.nom || '') + '"' }));
    cote.appendChild(creer('p', { classe: 'w-mention w-statut', id: 'kStatut', attrs: { role: 'status' },
      texte: b.statut || 'Changes are saved automatically.' }));
    cote.appendChild(bouton('Back to the Kanban', 'secondaire', 'arrow-left-line', function () { return sortirParametrages(true); }, { petit: true, id: 'navRetour' }));
  } else {
    cote.appendChild(bouton('Cancel creation', 'tertiaire', 'close-line', quitterAssistant, { petit: true, id: 'navAnnuler' }));
  }
  tete.appendChild(cote);
  bloc.appendChild(tete);
  if (b.origine && n === 1) {
    bloc.appendChild(alerte('info', null, 'Prefilled from ' + b.origine + '. Everything can still be edited.'
      + (b.ignores.length ? ' Not carried over, as a new Kanban has no equivalent: ' + b.ignores.join(', ') + '.' : '')));
  }
  if (n === 1) { bloc.appendChild(etapeKanban()); }
  if (n === 2) { bloc.appendChild(etapeColonnes()); }
  if (n === 3) { bloc.appendChild(etapeInformations()); }
  if (n === 4) { bloc.appendChild(etapeCarte()); }
  if (n === 5) { bloc.appendChild(etapeFiche()); }
  if (n === 6) { bloc.appendChild(etapeFiltres()); }
  if (n === 7) { bloc.appendChild(etapeVerifier()); }
  zone.appendChild(bloc);
}

function allerEtape(n) {
  var b = etat.brouillon;
  if (n < 0) { return; }
  if (n === 0 && b.mode !== 'creation') { return; }
  b.etape = n;
  afficherVue('assistant');
}

/* Re-render of a step after a structural change, focus put back on the
   given element. */
function redessinerEtape(focusId) {
  afficherVue('assistant', true);
  var f = focusId ? document.getElementById(focusId) : null;
  if (f) { f.focus(); } else { var t = document.getElementById('titreVue'); if (t) { t.focus(); } }
}

/* Any change in the settings triggers a delayed automatic save. During
   creation, nothing is written before the end. */
function majAttente() {
  var b = etat.brouillon;
  if (b && b.mode === 'personnalisation') { planifierSauvegarde(); }
}

function enParametrage() {
  return etat.vue === 'assistant' && !!etat.brouillon && etat.brouillon.mode === 'personnalisation';
}

function statutSauvegarde(texte, erreur) {
  var b = etat.brouillon;
  if (b) { b.statut = texte; }
  var z = document.getElementById('kStatut');
  if (z) { z.textContent = texte; z.classList.toggle('w-statut--erreur', !!erreur); }
}

function planifierSauvegarde() {
  var b = etat.brouillon;
  clearTimeout(b.minuterie);
  statutSauvegarde('Unsaved changes…');
  b.minuterie = setTimeout(function () { relayer(sauvegarderBrouillon(), 'Automatic save'); }, DELAI_AUTOSAVE_MS);
}

/* Incomplete input is not saved: the reason is shown. */
function raisonNonEnregistrable(b) {
  if (!b.nom.trim()) { return 'the Kanban has no name'; }
  var vus = Object.create(null);
  var act = b.colonnes.filter(function (x) { return !x.supprimee; });
  if (!act.length) { return 'the Kanban must keep at least one column'; }
  for (var i = 0; i < act.length; i++) {
    var k = normalizer(act[i].nom);
    if (!k) { return 'a column has no name'; }
    if (vus[k]) { return 'two columns are named "' + act[i].nom.trim() + '"'; }
    vus[k] = true;
  }
  var noms = Object.create(null);
  noms.titre = true;
  var infos = b.infos.filter(infoActive);
  for (var j = 0; j < infos.length; j++) {
    var n = normalizer(infos[j].libelle);
    if (!n) { return 'a field has no name'; }
    if (noms[n]) { return 'two fields are named "' + infos[j].libelle.trim() + '"'; }
    noms[n] = true;
  }
  return null;
}

async function sauvegarderBrouillon() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'personnalisation') { return; }
  clearTimeout(b.minuterie);
  if (b.enCours) { b.encore = true; return; }
  if (!compterChangements(b)) { statutSauvegarde(b.dernier ? 'Saved at ' + b.dernier : 'Changes are saved automatically.'); return; }
  var raison = raisonNonEnregistrable(b);
  if (raison) { statutSauvegarde('Not saved: ' + raison + '.', true); return; }
  b.enCours = true;
  statutSauvegarde('Saving…');
  try {
    var cles = await appliquerBrouillon();
    await chargerMeta();
    verifierConfig();
    await reparerColonnesVides(etat.config);
    if (etat.config.historique) { await assurerHistorique(etat.config); }
    await chargerDonnees();
    await lireTableaux();
    consoliderBrouillon(b, cles);
    var d = new Date();
    b.dernier = heureLocale(d.getHours(), d.getMinutes());
    if (etat.brouillon === b) {
      statutSauvegarde('Saved at ' + b.dernier);
      var t = document.getElementById('kTitrePerso');
      if (t) { t.textContent = 'Settings for "' + (etat.config.nom || '') + '"'; }
      var nav = document.querySelector('.w-onglets');
      if (nav && nav.parentNode) { nav.parentNode.replaceChild(ongletsKanbans(), nav); }
    }
  } catch (e) {
    b.enCours = false;
    statutSauvegarde('The save did not go through.', true);
    afficherErreur('The automatic save did not go through. The settings shown have been reloaded from the document.', e);
    try { await chargerMeta(); verifierConfig(); await chargerDonnees(); } catch (e2) { logSecurite('ERROR', 'Reload after failure', e2); }
    if (etat.brouillon === b) { var nb = brouillonDepuisConfig(); nb.etape = b.etape; etat.brouillon = nb; afficherVue('assistant', true); }
    return;
  }
  b.enCours = false;
  if (b.encore && etat.brouillon === b) { b.encore = false; await sauvegarderBrouillon(); }
}

/* Saves whatever is pending right away; true if nothing is pending any more. */
async function enregistrerMaintenant() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'personnalisation') { return true; }
  clearTimeout(b.minuterie);
  /* Bounded wait: a stuck save does not freeze the exit. */
  var limite = Date.now() + 30000;
  while (b.enCours && Date.now() < limite) { await new Promise(function (r) { setTimeout(r, 50); }); }
  await sauvegarderBrouillon();
  return !compterChangements(b);
}

/* Leaving the settings (Back button or tab): saves first; incomplete input
   is reported before being discarded. */
async function sortirParametrages(afficher) {
  var b = etat.brouillon;
  var ok = await enregistrerMaintenant();
  if (!ok) {
    var raison = raisonNonEnregistrable(b);
    var quitter = await confirmerAction('Leave the settings?', 'A change could not be saved' + (raison ? ': ' + raison : '') + '. It will be lost.', 'Leave');
    if (!quitter) { return false; }
  }
  etat.brouillon = null;
  if (afficher) { await chargerTout(); }
  return true;
}

/* After saving, the draft becomes the new reference: deleted items
   disappear, new ones get their column. */
function consoliderBrouillon(b, cleParUid) {
  var src = etat.config.sourceEtapes;
  b.colonnes = b.colonnes.filter(function (x) { return !x.supprimee; });
  b.colonnes.forEach(function (x) {
    if (src.type === 'choice' || src.type === 'liste') { x.cle = x.nom.trim(); }
    else if (!x.cle && cleParUid[x.uid]) { x.cle = cleParUid[x.uid]; x.id = parseInt(x.cle, 10); }
    x.nomInitial = x.nom.trim();
    x.dest = null;
    x.nb = x.cle ? cartesDeEtape(x.cle).length : 0;
  });
  var retirees = b.infos.filter(function (i) { return i.supprimee; }).map(function (i) { return i.uid; });
  var garder = function (u) { return retirees.indexOf(u) === -1; };
  b.infos = b.infos.filter(function (i) { return !i.supprimee; });
  b.ordreCarte = b.ordreCarte.filter(garder);
  b.ordreFiche = b.ordreFiche.filter(garder);
  b.filtres = b.filtres.filter(garder);
  if (b.couverture && !garder(b.couverture)) { b.couverture = null; }
  if (b.couleur && !garder(b.couleur)) { b.couleur = null; }
  b.infos.forEach(function (i) {
    i.nouvelle = false; i.typeFixe = true; i.libelleInitial = i.libelle.trim();
    i.valeursInitiales = i.valeurs.slice(); i.utiliseeInitiale = i.utilisee;
  });
  b.initial = JSON.stringify(etatComparable(b));
  b.initCarte = sequenceVisible(b, 'ordreCarte', 'surCarte');
  b.initFiche = sequenceVisible(b, 'ordreFiche', 'dansFiche');
}

function boutonsOrdre(liste, index, nom, idBase, surDeplacer, suffixe) {

    bouton('Move down', 'discret', 'arrow-down-line', function () { surDeplacer(index, 1); }, { petit: true, iconeSeule: true, aria: 'Move down ' + nom + (suffixe || ''), desactive: index === liste.length - 1, id: idBase + 'B' + index })

function echanger(tab, i, j) { var t = tab[i]; tab[i] = tab[j]; tab[j] = t; }

/* The buttons of a row name the item they act on ("Move up the column On
   hold"). This name follows the input: the label is a template where
   {nom} is replaced on each keystroke. */
function preparerLibelles(racine, prefixe, nomActuel) {
  Array.prototype.forEach.call(racine.querySelectorAll('button[aria-label]'), function (bt) {
    var a = bt.getAttribute('aria-label');
    if (a.indexOf(prefixe + nomActuel) !== -1) { bt.setAttribute('data-modele', a.split(prefixe + nomActuel).join(prefixe + '{nom}')); }

function majLibelles(racine, nom) {
  Array.prototype.forEach.call(racine.querySelectorAll('button[data-modele]'), function (bt) {
    bt.setAttribute('aria-label', bt.getAttribute('data-modele').split('{nom}').join(nom));
  });

/* Settings: deleting a column is saved immediately, after confirmation;
   the cards go to the chosen column. */
async function supprimerColonneParametrage(x) {
  var autres = colonnesActives().filter(function (y) { return y !== x; });
  var nom = x.nom || 'untitled';
  if (!x.cle) {
    etat.brouillon.colonnes = etat.brouillon.colonnes.filter(function (y) { return y !== x; });
    majAttente(); redessinerEtape('kAjoutCol'); return;
  }
  if (!x.nb) {
    var ok = await confirmerAction('Delete the column "' + nom + '"?', 'It contains no cards. The deletion is saved immediately.', 'Delete');
    if (!ok) { return; }
    x.supprimee = true;
    await enregistrerMaintenant();
    redessinerEtape('kAjoutCol');
    return;
  }
  var sel = liste('kDestModale', autres.map(function (y) { return { valeur: y.uid, libelle: y.nom || 'Untitled' }; }), autres[0].uid);
  ouvrirModale({ titre: 'Delete the column "' + nom + '"?', etroite: true, focus: 'kDestModale',
    corps: [creer('p', { classe: 'w-texte', texte: (x.nb !== 1 ? 'Its ' + formaterNombre(x.nb) + ' cards will be moved' : 'Its card will be moved') + ' to the column chosen below. The deletion is saved immediately.' }),
      groupeChamp('Move the cards to', sel)],
    pied: [creer('span', { classe: 'w-pousse' }), bouton('Cancel', 'secondaire', null, fermerModale),
      bouton('Delete the column', null, 'delete-line', async function () {
        x.supprimee = true;
        x.dest = sel.value;
        fermerModale();
        await enregistrerMaintenant();
        redessinerEtape('kAjoutCol');
      })] });
}
function etapeColonnes() {
  var b = etat.brouillon;
  var perso = b.mode === 'personnalisation';
  var principal = [];
  if (!b.colonnesModifiables) {
    principal.push(alerte('info', null, b.source === 'branche' && etat.config.sourceEtapes.type === 'text'

      : 'The column names come from another table: they cannot be edited here.'));
  } else if (!b.colonnesOrdonnables) {
    principal.push(alerte('info', null, 'The column order follows the row order of the table ' + libelleTable(etat.config.sourceEtapes.table) + '. To change it here, add a numeric SORT_ORDER column to that table.'));
  } else {
    /* instructions are in the help of the column heading */
  }
  var ol = creer('ol', { classe: 'w-liste', attrs: { 'aria-label': 'Kanban columns, in order' } });
  var deplacer = function (i, d) { echanger(b.colonnes, i, i + d); majAttente(); redessinerEtape((d < 0 ? 'kColH' : 'kColB') + (i + d)); };
  b.colonnes.forEach(function (x, i) {
    var nomAff = x.nom || 'unnamed';
    var champNom;
    if (b.colonnesModifiables) {
      champNom = saisie('kCol' + i, x.nom);
      champNom.setAttribute('aria-label', 'Name of column ' + (i + 1));
      if (x.supprimee) { champNom.setAttribute('disabled', ''); }
      champNom.addEventListener('input', function () { x.nom = champNom.value; majLibelles(li, x.nom || 'unnamed'); majApercuColonnes(); majAttente(); });
    } else {
      champNom = creer('span', { classe: 'w-ligne__nom', texte: x.nom });
    }
    var li = creer('li', { classe: 'w-ligne' + (x.supprimee ? ' w-ligne--supprimee' : '') }, [
      b.colonnesOrdonnables && !x.supprimee ? creer('span', { classe: 'w-poignee ui-icon-drag-move-2-line', attrs: { 'aria-hidden': 'true' } }) : null,
      creer('span', { classe: 'w-ligne__num', texte: String(i + 1), attrs: { 'aria-hidden': 'true' } }),
      champNom,
      null
    ].concat(b.colonnesOrdonnables && !x.supprimee ? boutonsOrdre(b.colonnes, i, 'column ' + nomAff, 'kCol', deplacer) : [])
      .concat(b.colonnesModifiables ? [x.supprimee
        ? bouton('Undo delete', 'discret', 'arrow-go-back-line', function () { x.supprimee = false; x.dest = null; majAttente(); redessinerEtape('kCol' + i); },
          { petit: true, aria: 'Undo delete of column ' + nomAff, id: 'kColR' + i })
        : bouton('Delete', 'discret', 'delete-line', function () {
          if (colonnesActives().length === 1) { signalerSaisie('The Kanban must keep at least one column.'); return; }
          if (perso) { return supprimerColonneParametrage(x); }
          x.supprimee = true;
          var autres = colonnesActives();
          x.dest = autres.length ? autres[0].uid : null;

          redessinerEtape('kColR' + i);
        }, { petit: true, iconeSeule: true, aria: 'Delete column ' + nomAff, id: 'kColS' + i })] : []));
    preparerLibelles(li, 'column ', nomAff);
    ol.appendChild(li);
    if (x.supprimee) {
      var msg = creer('li', { classe: 'w-ligne w-ligne--detail-alerte' }, [creer('span', { classe: 'ui-icon-warning-line ui-icon--sm', attrs: { 'aria-hidden': 'true' } })]);
      if (x.cle && x.nb) {
        var autresC = colonnesActives();
        var sel = liste('kDest' + i, autresC.map(function (y) { return { valeur: y.uid, libelle: y.nom || 'Unnamed' }; }), x.dest);
        sel.addEventListener('change', function () { x.dest = sel.value; majAttente(); });
        msg.appendChild(creer('label', { attrs: { 'for': 'kDest' + i }, texte: 'This column will be deleted. ' + (x.nb !== 1 ? 'Its ' + formaterNombre(x.nb) + ' cards will go' : 'Its card will go') + ' to' }));
        msg.appendChild(sel);
      } else {
        msg.appendChild(creer('span', { texte: 'This column will be deleted.' }));
      }
      ol.appendChild(msg);
    }
  });
  principal.push(ol);
  if (b.colonnesModifiables) {
    principal.push(creer('div', {}, [bouton('Add a column', 'secondaire', 'add-line', function () {
      b.colonnes.push({ uid: uid(), cle: null, nom: '', nomInitial: null, limite: null, supprimee: false, dest: null, nb: 0 });

    }, { petit: true, id: 'kAjoutCol' })]));
  }
  if (b.colonnesOrdonnables) {
    brancherTriListe(ol, function (de, vers) {
      /* The list also holds the detail rows of deleted columns, which
         do not move: columns are found by their position among the
         movable rows. */
      var mobiles = b.colonnes.filter(function (x) { return !x.supprimee; });
      var item = mobiles[de];
      var cible = mobiles[vers];
      var a = b.colonnes.indexOf(item);
      b.colonnes.splice(a, 1);
      b.colonnes.splice(b.colonnes.indexOf(cible) + (vers > de ? 1 : 0), 0, item);
      majAttente();
      redessinerEtape(null);
      return Promise.resolve();
    });
  }
  /* Optional archive column: always last, collapsed on the Kanban
     even when it holds cards. */
  var options = [];
  if (b.colonnesModifiables) {
    var arch = b.colonnes.filter(function (x) { return x.uid === b.archiveUid && !x.supprimee; })[0];
    options.push(optionCase('kArchive', 'Archive column at the end of the Kanban', 'To store finished cards without deleting them. It stays collapsed on the Kanban, even when it holds cards; one click opens it for viewing.', !!arch,
      function (coche) {

        } else {
          var col = b.colonnes.filter(function (x) { return x.uid === b.archiveUid; })[0];

        redessinerEtape('kArchive');

  }
  return ecranColonnes([
    { titre: 'Kanban columns', id: 'kAideCol', aide: b.colonnesModifiables ? 'Columns are the stages of the work. Rename them directly in the list; drag them by their handle, or use the arrows, to change their order.' : null, contenu: principal },
    options.length ? { titre: 'Options', contenu: options } : null],
    { titre: 'Kanban preview', noeud: apercuColonnes() });
}

  cand.forEach(function (info, i) {
    var cb = creer('input', { attrs: { type: 'checkbox', id: 'kFil' + i }, coche: b.filtres.indexOf(info.uid) !== -1 });
    cb.addEventListener('change', function () {
      if (cb.checked) { b.filtres.push(info.uid); } else { b.filtres = b.filtres.filter(function (u) { return u !== info.uid; }); }
      maj('kFil' + i);
    });
    filtres.push(creer('div', { classe: 'ui-checkbox-group ui-checkbox-group--sm' }, [cb, creer('label', { classe: 'ui-label', attrs: { 'for': 'kFil' + i }, texte: info.libelle })]));
  });
  var recherche = [optionCase('kRech', 'Search', 'In the title and content of the cards, ignoring accents and capital letters.', b.recherche,
    function (v) { b.recherche = v; maj('kRech'); })];
  return ecranColonnes([
    { titre: 'Filters', id: 'kAideFiltres', aide: 'The filters offered in the Kanban panel, in the order you tick them. Choice lists, tags, people, references, yes/no and text fields can be used as filters. A "Clear filters" button appears as soon as a filter is set.', contenu: filtres },
    { titre: 'Search', contenu: recherche }],

}

/* --- Step 6: review --- */
function changementsParEtape(b) {
  var g = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
  var perso = b.mode === 'personnalisation';
  var c = etat.config;
  var cfgVisibles = function (u) { return infoActive(infoParUid(u)); };
  if (!perso) {
    g[1].push({ t: 'Name: ' + b.nom.trim() });
    if (b.description.trim()) { g[1].push({ t: 'Description: ' + b.description.trim() }); }
    colonnesActives().forEach(function (x) { g[2].push({ t: x.nom.trim() }); });
    b.infos.filter(infoActive).forEach(function (i) {
      g[3].push({ t: i.libelle + ': ' + libelleGenre(i.genre).toLowerCase() + (i.valeurs.length ? ' (' + i.valeurs.join(', ') + ')' : '')
        + (i.echeance ? ', due date' : '') + (i.responsable ? ', owner' : '') });
      if (GENRES_A_VALEURS.indexOf(i.genre) !== -1 && !i.valeurs.length) {
        g[3].push({ t: i.libelle + ': no values offered. Its list will stay empty in the cards until you add some.', alerte: true });
      }
    });
    var surC = b.ordreCarte.filter(cfgVisibles).map(infoParUid).filter(function (i) { return i.surCarte; }).map(function (i) { return i.libelle; });
    var dansF = b.ordreFiche.filter(cfgVisibles).map(infoParUid).filter(function (i) { return i.dansFiche; }).map(function (i) { return i.libelle; });
    g[4].push({ t: 'On the card: ' + (surC.length ? surC.join(', ') : 'the title only') + (b.compact ? ' (compact mode)' : '') });
    g[5].push({ t: 'In the card details: ' + (dansF.length ? dansF.join(', ') : 'the title and column only') });
    if (!b.nomsInfos) { g[4].push({ t: 'Field names hidden on the cards' }); }
    if (b.couverture && infoActive(infoParUid(b.couverture))) { g[4].push({ t: 'Cover image: ' + infoParUid(b.couverture).libelle }); }
    if (b.couleur && infoActive(infoParUid(b.couleur))) { g[4].push({ t: 'Card color based on: ' + infoParUid(b.couleur).libelle }); }
    var outils = [];
    if (b.recherche) { outils.push('search'); }
    b.filtres.map(infoParUid).filter(infoActive).forEach(function (i) { outils.push('filter ' + i.libelle); });
    if (b.filtreRetard) { outils.push('overdue only'); }
    g[6].push({ t: outils.length ? outils.join(', ') : 'No search tools' });
    return g;
  }
  if (b.nom.trim() !== (c.nom || '')) { g[1].push({ t: 'Name: "' + b.nom.trim() + '"' }); }
  if (b.description.trim() !== (c.description || '')) { g[1].push({ t: 'Description changed' }); }
  if (!!b.historique !== !!c.historique) { g[1].push({ t: b.historique ? 'History and comments turned on' : 'History and comments turned off' }); }
  var actives = colonnesActives();
  b.colonnes.forEach(function (x) {
    if (x.supprimee && x.cle) {
      var d = colonneParUid(x.dest);
      g[2].push({ t: '"' + x.nomInitial + '" deleted' + (x.nb ? ': ' + (x.nb !== 1 ? 'its ' + formaterNombre(x.nb) + ' cards will go' : 'its card will go') + ' to "' + (d ? d.nom : '') + '"' : ''), alerte: true });
    } else if (!x.supprimee && !x.cle) {
      g[2].push({ t: 'New column "' + x.nom.trim() + '"' });
    } else if (!x.supprimee) {
      if (x.nom.trim() !== x.nomInitial) { g[2].push({ t: '"' + x.nomInitial + '" renamed to "' + x.nom.trim() + '"' }); }
    }
  });
  var ordreInit = etat.etapes.map(function (e) { return e.cle; }).join('|');
  var ordreNouv = actives.filter(function (x) { return x.cle; }).map(function (x) { return x.cle; });
  var ordreInitFiltre = etat.etapes.map(function (e) { return e.cle; }).filter(function (k) { return ordreNouv.indexOf(k) !== -1; }).join('|');
  if (ordreNouv.join('|') !== ordreInitFiltre && ordreInit) { g[2].push({ t: 'Column order changed' }); }
  b.infos.forEach(function (i) {
    if (i.nouvelle && !i.supprimee) { g[3].push({ t: 'New field "' + i.libelle.trim() + '" (' + libelleGenre(i.genre).toLowerCase() + ')' }); return; }
    if (i.nouvelle) { return; }
    if (i.supprimee) { g[3].push({ t: '"' + i.libelleInitial + '" deleted: its content will be erased from all cards', alerte: true }); return; }
    if (i.utilisee !== i.utiliseeInitiale) { g[3].push({ t: (i.utilisee ? 'Column "' + i.libelle + '" used' : 'Column "' + i.libelle + '" removed from the Kanban (it stays in your table)') }); }
    if (i.libelle.trim() !== i.libelleInitial) { g[3].push({ t: '"' + i.libelleInitial + '" renamed to "' + i.libelle.trim() + '"' }); }
    var ajout = i.valeurs.filter(function (v) { return i.valeursInitiales.indexOf(v) === -1; });
    var retrait = i.valeursInitiales.filter(function (v) { return i.valeurs.indexOf(v) === -1; });
    if (ajout.length) { g[3].push({ t: i.libelle + ': ' + (ajout.length !== 1 ? 'values' : 'value') + ' added' + (ajout.length !== 1 ? '' : '') + ' (' + ajout.join(', ') + ')' }); }
    if (retrait.length) { g[3].push({ t: i.libelle + ': ' + (retrait.length !== 1 ? 'values' : 'value') + ' removed' + (retrait.length !== 1 ? '' : '') + ' (' + retrait.join(', ') + ')' }); }
  });
  var ech = b.infos.filter(function (i) { return infoActive(i) && i.echeance; })[0];
  var resp = b.infos.filter(function (i) { return infoActive(i) && i.responsable; })[0];
  if ((ech ? ech.col || ech.uid : null) !== (c.colEcheance || null)) { g[3].push({ t: ech ? 'Due date: "' + ech.libelle + '"' : 'No more due date field' }); }
  if ((resp ? resp.col || resp.uid : null) !== (c.colResponsable || null)) { g[3].push({ t: resp ? 'Owner: "' + resp.libelle + '"' : 'No more owner field' }); }
  var init = JSON.parse(b.initial);
  if (sequenceVisible(b, 'ordreCarte', 'surCarte') !== b.initCarte) { g[4].push({ t: 'Card content or order changed' }); }
  if (sequenceVisible(b, 'ordreFiche', 'dansFiche') !== b.initFiche) { g[5].push({ t: 'Card details content or order changed' }); }
  if (b.compact !== init.compact) { g[4].push({ t: b.compact ? 'Compact mode turned on' : 'Compact mode turned off' }); }
  if (b.nomsInfos !== init.nomsInfos) { g[4].push({ t: b.nomsInfos ? 'Field names shown on the cards' : 'Field names hidden on the cards' }); }
  if (b.couverture !== init.couverture) { var ic = infoParUid(b.couverture); g[4].push({ t: ic ? 'Cover image: "' + ic.libelle + '"' : 'No more cover image' }); }
  if (b.couleur !== init.couleur) { var il = infoParUid(b.couleur); g[4].push({ t: il ? 'Card color based on "' + il.libelle + '"' : 'No more card color' }); }
  if (JSON.stringify(b.tri) !== JSON.stringify(init.tri)) { g[4].push({ t: 'Card sorting changed' }); }
  if (b.recherche !== init.recherche) { g[6].push({ t: b.recherche ? 'Search offered' : 'Search removed' }); }
  if (b.filtreRetard !== init.filtreRetard) { g[6].push({ t: b.filtreRetard ? '"Overdue only" filter offered' : '"Overdue only" filter removed' }); }
  var fAv = init.filtres.join('|');
  var fAp = b.filtres.filter(function (u) { return infoActive(infoParUid(u)); }).join('|');
  if (fAv !== fAp) {
    var nouv = b.filtres.filter(function (u) { return init.filtres.indexOf(u) === -1 && infoActive(infoParUid(u)); }).map(function (u) { return infoParUid(u).libelle; });
    var ret = init.filtres.filter(function (u) { return b.filtres.indexOf(u) === -1 || !infoActive(infoParUid(u)); }).map(function (u) { var i = infoParUid(u); return i ? i.libelleInitial || i.libelle : ''; });
    if (nouv.length) { g[6].push({ t: 'Filter' + (nouv.length !== 1 ? 's' : '') + ' added' + (nouv.length !== 1 ? '' : '') + ': ' + nouv.join(', ') }); }
    if (ret.length) { g[6].push({ t: 'Filter' + (ret.length !== 1 ? 's' : '') + ' removed' + (ret.length !== 1 ? '' : '') + ': ' + ret.join(', ') }); }
    if (!nouv.length && !ret.length) { g[6].push({ t: 'Filter order changed' }); }
  }
  return g;
}

function compterChangements(b) {
  if (!b || b.mode !== 'personnalisation') { return 0; }
  var g = changementsParEtape(b);
  return Object.keys(g).reduce(function (s, k) { return s + g[k].length; }, 0);
}

/* Last step of creation: summary of the Kanban to create. */
function etapeVerifier() {
  var b = etat.brouillon;

      }))]));

/* --- Step validation --- */
function validerEtape(n) {
  var b = etat.brouillon;
  masquerErreur();
  if (n === 1 && !b.nom.trim()) { marquerInvalide('kNom', 'Give the Kanban a name to continue.'); return false; }
  if (n === 2) {
    var act = colonnesActives();
    if (!act.length) { signalerSaisie('The Kanban must keep at least one column.'); return false; }
    var vus = Object.create(null);
    for (var i = 0; i < b.colonnes.length; i++) {
      var x = b.colonnes[i];
      if (x.supprimee) { continue; }
      var k = normalizer(x.nom);
      if (!k) { marquerInvalide('kCol' + i, 'Column ' + (i + 1) + ' has no name.'); return false; }
      if (vus[k]) { marquerInvalide('kCol' + i, 'Two columns have the same name: ' + x.nom + '.'); return false; }
      vus[k] = true;
    }
  }
  if (n === 3) {
    var noms = Object.create(null);
    noms.titre = true; noms.title = true;
    for (var j = 0; j < b.infos.length; j++) {
      var inf = b.infos[j];
      if (!infoActive(inf)) { continue; }
      var kn = normalizer(inf.libelle);
      if (!kn) { inf.ouverte = true; redessinerEtape('kInfoNom' + j); marquerInvalide('kInfoNom' + j, 'Give this field a name.'); return false; }
      if (noms[kn]) { inf.ouverte = true; redessinerEtape('kInfoNom' + j); marquerInvalide('kInfoNom' + j, 'Another field already has this name.'); return false; }
      noms[kn] = true;
    }
  }
  return true;
}

/* End of creation: steps 1 to 3 are checked one last time,
   then the Kanban is created. */
async function validerAssistant() {
  for (var n = 1; n <= 3; n++) { if (!validerEtapeSansRendu(n)) { allerEtape(n); validerEtape(n); return; } }
  return creerDepuisBrouillon();
}

function validerEtapeSansRendu(n) {
  var b = etat.brouillon;
  if (n === 1) { return !!b.nom.trim(); }
  if (n === 2) {
    var vus = Object.create(null);
    var act = colonnesActives();
    if (!act.length) { return false; }
    return act.every(function (x) { var k = normalizer(x.nom); if (!k || vus[k]) { return false; } vus[k] = true; return true; });
  }
  if (n === 3) {
    var noms = Object.create(null);
    noms.titre = true; noms.title = true;
    return b.infos.filter(infoActive).every(function (i) { var k = normalizer(i.libelle); if (!k || noms[k]) { return false; } noms[k] = true; return true; });
  }
  return true;
}

/* --- Creation from the draft --- */
async function creerDepuisBrouillon() {
  var b = etat.brouillon;
  var actives = colonnesActives();
  var infos = b.ordreCarte.map(infoParUid).filter(infoActive);
  afficherLoader('Preparing your Kanban…');
  try {
    /* First Kanban of the document: the library and the cards table are
       created together. After that, no more tables: each Kanban adds its
       cards to the same table, and only adds the columns that do not
       exist yet. */
    await chargerMeta();
    await lireTableaux();
    var biblioAbsente = !trouverTable(ID_BIBLIO);
    var tidCartes = await preparerTableCartes();
    var defs = biblioAbsente ? [{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }] : [];
    if (!tidCartes) {
      defs.push({ id: idTableLibre(ID_TABLE_CARTES), colonnes: [{ id: 'TITLE', type: 'Text' }, { id: COL_KANBAN, type: 'Text' },
        { id: 'COLUMN', type: 'Choice' }, { id: 'SORT_ORDER', type: 'Numeric' }, { id: COL_COMMENTAIRE, type: 'Text' }, { id: COL_HISTORIQUE, type: 'Text' }].concat(COLONNES_META) });
    }
    if (defs.length) {
      var tids = await creerTables(defs);
      if (biblioAbsente) { await finaliserBibliotheque(tids[0]); }
      if (!tidCartes) { tidCartes = tids[tids.length - 1]; }
      await chargerMeta();
    }
    var noms = actives.map(function (x) { return x.nom.trim(); });
    /* Main and feed columns of the shared table, renamed or not by the
       user: never reused for a field. */
    var principales = colonnesTableCartes(tidCartes);
    var suiviCartes = colonnesSuivi(tidCartes);
    var pris = IDS_RESERVES.concat([principales.titre, principales.etape, principales.ordre, principales.kanban, suiviCartes.historique, suiviCartes.commentaire]
      .map(function (x) { return String(x).toUpperCase(); }));
    for (var n = 0; n < infos.length; n++) {
      infos[n].colCree = await assurerColonneInfo(tidCartes, infos[n].libelle, infos[n].genre, pris);
      if (GENRES_A_VALEURS.indexOf(infos[n].genre) !== -1) { await unirChoix(tidCartes, infos[n].colCree, infos[n].valeurs); }
    }
    await unirChoix(tidCartes, principales.etape, noms);
    var colDe = function (u) { var i = infoParUid(u); return infoActive(i) ? i.colCree : null; };
    var ech = infos.filter(function (i) { return i.echeance; })[0];
    var resp = infos.filter(function (i) { return i.responsable; })[0];
    await assurerBibliotheque();
    await lireTableaux();
    var cleKanban = preparerNouveauTableau();
    memoriserTableau(cleKanban);
    await ecrireConfig({
      mode: 'creation', nom: b.nom.trim(), description: b.description.trim(),
      tableCartes: tidCartes, colTitre: principales.titre, colEtape: principales.etape, colKanban: principales.kanban, idKanban: cleKanban, historique: true,
      sourceEtapes: { type: 'liste', valeurs: noms },
      colonneArchive: (function () { var a = actives.filter(function (x) { return x.uid === b.archiveUid; })[0]; return a ? a.nom.trim() : null; })(),
      colOrdreCartes: principales.ordre, tri: null,
      champs: infos.map(function (i) {
        var ch = { col: i.colCree, libelle: i.libelle.trim(), genre: genreStocke(i.genre), surCarte: !!i.surCarte, dansFiche: !!i.dansFiche };
        if (GENRES_A_VALEURS.indexOf(i.genre) !== -1) { ch.valeurs = i.valeurs.slice(); }
        return ch;
      }),
      ordreFiche: b.ordreFiche.map(colDe).filter(Boolean),
      colEcheance: ech ? ech.colCree : null, colResponsable: resp ? resp.colCree : null, limites: {}, compact: !!b.compact,
      recherche: !!b.recherche, filtres: b.filtres.map(colDe).filter(Boolean), filtreRetard: !!b.filtreRetard && !!ech,
      nomsInfos: b.nomsInfos !== false, couverture: b.couverture ? colDe(b.couverture) : null, couleur: b.couleur ? colDe(b.couleur) : null
    });
    /* The activity feed formula is set right away: without it, comments
       and changes would not be recorded until the settings are saved once. */
    await chargerMeta();
    await assurerHistorique(etat.config);
    var nomCree = b.nom.trim();
    etat.brouillon = null;
    await chargerTout();
    masquerLoader();
    afficherSucces('Your Kanban "' + nomCree + '" is ready.');
  } catch (e) {
    masquerLoader();
    afficherErreur('The Kanban could not be created. Nothing was deleted: you can try again.', e);
  }
}

/* --- Settings: applying the draft ---
   Order: new columns (so cards can be moved into them), names, order,
   moving the cards of deleted columns then deleting them; new fields,
   values, deletions; finally the configuration. */
async function appliquerBrouillon() {
  var b = etat.brouillon;
  var c = etat.config;
  var src = c.sourceEtapes;
  {
    var cleParUid = {};
    var actives = colonnesActives();
    b.colonnes.forEach(function (x) { if (x.cle) { cleParUid[x.uid] = x.cle; } });
    if (b.colonnesModifiables && src.type === 'ref') {
      for (var i = 0; i < actives.length; i++) {
        var x = actives[i];
        if (x.cle) { continue; }
        var champs = {};
        champs[src.colAffichage] = x.nom.trim();
        var ret = await agir([['AddRecord', src.table, null, champs]]);
        x.id = ret && ret.retValues ? ret.retValues[0] : null;
        cleParUid[x.uid] = String(x.id);
      }
      var actions = [];
      actives.forEach(function (y) {
        if (y.cle && y.nom.trim() !== y.nomInitial) { var ch = {}; ch[src.colAffichage] = y.nom.trim(); actions.push(['UpdateRecord', src.table, y.id, ch]); }
      });
      if (src.colOrdre) {
        var maj = {};
        maj[src.colOrdre] = actives.map(function (_, k) { return (k + 1) * ORDRE_PAS; });
        actions.push(['BulkUpdateRecord', src.table, actives.map(function (y) { return parseInt(cleParUid[y.uid], 10); }), maj]);
      }
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) {
          var m = {};
          m[c.colEtape] = cartes.map(function () { return parseInt(cleParUid[y.dest], 10); });
          actions.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]);
        }
        actions.push(['RemoveRecord', src.table, y.id]);
      });
      if (actions.length) { await agir(actions); }
    } else if (b.colonnesModifiables && src.type === 'choice') {
      var col = colonneCartes(c.colEtape);
      var opts = JSON.parse(JSON.stringify(col.options || {}));
      var anciennes = opts.choiceOptions || {};
      var nouvellesOpts = Object.create(null);
      var acts = [];
      actives.forEach(function (y) {
        var nom = y.nom.trim();
        cleParUid[y.uid] = nom;
        if (y.cle && Object.prototype.hasOwnProperty.call(anciennes, y.cle) && anciennes[y.cle]) { nouvellesOpts[nom] = anciennes[y.cle]; }
        if (y.cle && nom !== y.cle) {
          var cartes = cartesDeEtape(y.cle);
          if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return nom; }); acts.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
        }
      });
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return cleParUid[y.dest]; }); acts.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
      });
      opts.choices = actives.map(function (y) { return y.nom.trim(); });
      if (opts.choiceOptions) { opts.choiceOptions = nouvellesOpts; }
      acts.push(['UpdateRecord', '_grist_Tables_column', col.ref, { widgetOptions: JSON.stringify(opts) }]);
      await agir(acts);
    }
    if (b.colonnesModifiables && src.type === 'liste') {
      /* Kanban columns stored in its settings: a rename or a deletion
         only affects the cards of this Kanban. */
      var actL = [];
      actives.forEach(function (y) {
        var nom = y.nom.trim();
        cleParUid[y.uid] = nom;
        if (y.cle && nom !== y.cle) {
          var cartes = cartesDeEtape(y.cle);
          if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return nom; }); actL.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
        }
      });
      b.colonnes.forEach(function (y) {
        if (!y.supprimee || !y.cle) { return; }
        var cartes = cartesDeEtape(y.cle);
        if (cartes.length) { var m = {}; m[c.colEtape] = cartes.map(function () { return cleParUid[y.dest]; }); actL.push(['BulkUpdateRecord', c.tableCartes, cartes.map(function (k) { return k.id; }), m]); }
      });
      if (actL.length) { await agir(actL); }
      src.valeurs = actives.map(function (y) { return y.nom.trim(); });
      await unirChoix(c.tableCartes, c.colEtape, src.valeurs);
    }
    /* Fields */
    var partagee = !!c.colKanban;
    if (b.source === 'creation') {
      var suiviP = colonnesSuivi(c.tableCartes);
      var pris = IDS_RESERVES.concat(b.infos.filter(function (i) { return i.col; }).map(function (i) { return i.col.toUpperCase(); }),
        [c.colTitre, c.colEtape, c.colOrdreCartes, c.colKanban, suiviP.historique, suiviP.commentaire].filter(Boolean).map(function (x) { return String(x).toUpperCase(); }));
      for (var j = 0; j < b.infos.length; j++) {
        var inf = b.infos[j];
        if (inf.supprimee && !inf.nouvelle && inf.col) {
          if (partagee) {
            /* Shared table: the content is erased from the cards of this Kanban;
               the column is deleted only if no other Kanban uses it. */
            var ids = etat.cartes.map(function (x) { return x.id; });
            if (ids.length) { var vide = {}; vide[inf.col] = ids.map(function () { return null; }); await agir([['BulkUpdateRecord', c.tableCartes, ids, vide]]); }
            if (!colonneUtiliseeAilleurs(c.tableCartes, inf.col)) { await agir([['RemoveColumn', c.tableCartes, inf.col]]); }
          } else {
            await agir([['RemoveColumn', c.tableCartes, inf.col]]);
          }
          continue;
        }
        if (inf.nouvelle && !inf.supprimee) {
          if (partagee) {
            inf.col = await assurerColonneInfo(c.tableCartes, inf.libelle, inf.genre, pris);
            if (GENRES_A_VALEURS.indexOf(inf.genre) !== -1) { await unirChoix(c.tableCartes, inf.col, inf.valeurs); }
          } else {
            var base = versIdentifiant(inf.libelle);
            var id = base;
            var k = 2;
            var tous = IDS_RESERVES.concat(colonnesDe(c.tableCartes).map(function (x) { return x.colId.toUpperCase(); }));
            while (tous.indexOf(id) !== -1) { id = base + '_' + k; k++; }
            var o = GENRES_A_VALEURS.indexOf(inf.genre) !== -1 ? optionsChoix(inf.valeurs) : (inf.genre === 'texte_long' ? { wrap: true } : (genreParCode(inf.genre).options || null));
            inf.col = await ajouterColonne(c.tableCartes, id, genreParCode(inf.genre).type, o);
          }
        }
      }
    }
    for (var v = 0; v < b.infos.length; v++) {
      var iv = b.infos[v];
      if (!infoActive(iv) || iv.nouvelle || !iv.valeursModifiables) { continue; }
      if (JSON.stringify(iv.valeurs) === JSON.stringify(iv.valeursInitiales)) { continue; }
      if (partagee && b.source === 'creation') { await unirChoix(c.tableCartes, iv.col, iv.valeurs); continue; }
      var cc = colonneCartes(iv.col);
      var op = JSON.parse(JSON.stringify(cc.options || {}));
      op.choices = iv.valeurs.slice();
      await agir([['UpdateRecord', '_grist_Tables_column', cc.ref, { widgetOptions: JSON.stringify(op) }]]);
    }

    var colDe = function (u) { var i = infoParUid(u); return infoActive(i) ? i.col : null; };
    var ech = b.infos.filter(function (i) { return infoActive(i) && i.echeance; })[0];
    var resp = b.infos.filter(function (i) { return infoActive(i) && i.responsable; })[0];
    c.nom = b.nom.trim();
    c.description = b.description.trim();
    c.historique = c.colKanban ? true : !!b.historique;
    c.colonneArchive = b.archiveUid && cleParUid[b.archiveUid] ? String(cleParUid[b.archiveUid]) : null;
    c.compact = !!b.compact;
    c.recherche = !!b.recherche;
    c.filtreRetard = !!b.filtreRetard && !!ech;
    c.limites = {};
    c.colEcheance = ech ? ech.col : null;
    c.colResponsable = resp ? resp.col : null;
    c.filtres = b.filtres.map(colDe).filter(Boolean);
    c.ordreFiche = b.ordreFiche.map(colDe).filter(Boolean);
    c.champs = b.ordreCarte.map(infoParUid).filter(infoActive).map(function (i) {
      var ch = { col: i.col, surCarte: !!i.surCarte, dansFiche: !!i.dansFiche };
      if (b.source === 'creation') {
        ch.libelle = i.libelle.trim();
        ch.genre = genreStocke(i.genre);
        if (c.colKanban && GENRES_A_VALEURS.indexOf(i.genre) !== -1) { ch.valeurs = i.valeurs.slice(); }
      }
      else if (i.libelle.trim() !== (colonneCartes(i.col) || {}).label) { ch.libelle = i.libelle.trim(); }
      return ch;
    });
    if (b.tri) { c.tri = { col: b.tri.col, sens: b.tri.sens }; }
    c.nomsInfos = b.nomsInfos !== false;
    c.couverture = b.couverture ? colDe(b.couverture) : null;
    c.couleur = b.couleur ? colDe(b.couleur) : null;
    await ecrireConfig(c);
    return cleParUid;
  }
}

/* Reuses the structure of a Kanban in the document. The columns are read
   from their source; a reference field becomes a choice list whose values
   are the referenced rows; types with no equivalent in a new Kanban are
   reported and skipped. */
async function repartirDeTableau(t) {
  afficherLoader('Reading the Kanban…');
  try {
    await chargerMeta();
    var cfg = t.config;
    var tc = cfg.tableCartes;
    if (!etat.meta.tables[tc]) { throw new Error('Cards table missing: ' + tc); }
    var colE = infoColonne(tc, cfg.colEtape);
    var etapes = [];
    var parCle = Object.create(null);
    var cible = colE ? tableCibleRef(colE.type) : null;
    if (cfg.sourceEtapes && cfg.sourceEtapes.type === 'liste') {
      (cfg.sourceEtapes.valeurs || []).forEach(function (v) { etapes.push(v); parCle[v] = v; });
    } else if (colE && cible && colE.type.indexOf('Ref:') === 0) {
      var aff = colAffichageRef(colE) || (cfg.sourceEtapes && cfg.sourceEtapes.colAffichage);
      var ord = cfg.sourceEtapes && cfg.sourceEtapes.colOrdre;
      var e = await lireTable(cible);
      var lignes = [];
      for (var i = 0; i < e.id.length; i++) {
        lignes.push({ id: e.id[i], lib: aff ? colonneDe(e, aff, i) : null, o: ord ? colonneDe(e, ord, i) : colonneDe(e, 'manualSort', i) });
      }
      lignes.sort(function (x, y) { return (typeof x.o === 'number' ? x.o : 1e15) - (typeof y.o === 'number' ? y.o : 1e15) || x.id - y.id; });
      lignes.forEach(function (l) { if (l.lib) { etapes.push(String(l.lib)); parCle[String(l.id)] = String(l.lib); } });
    } else if (colE && colE.type === 'Choice') {
      choixDe(colE).forEach(function (v) { etapes.push(v); parCle[v] = v; });
    } else if (colE) {
      var d = await lireTable(tc);
      var vus = Object.create(null);
      (d[cfg.colEtape] || []).forEach(function (v) { if (v && typeof v === 'string' && !vus[v]) { vus[v] = true; etapes.push(v); parCle[v] = v; } });
      etapes.sort(function (x, y) { return x.localeCompare(y, localeDoc()); });
    }
    if (!etapes.length) { etapes = MODELES_ETAPES[0].slice(); }
    var champs = [];
    var ignores = [];
    var libParCol = {};
    for (var k = 0; k < (cfg.champs || []).length; k++) {
      var ch = cfg.champs[k];
      var col = infoColonne(tc, ch.col);
      if (!col) { continue; }
      var lib = ch.libelle || col.label;
      var g = genreAffiche(col, ch.genre || genreDe(col, null));
      var valeurs = [];
      if (g === 'reference') {
        try {
          var r = await chargerRef(tableCibleRef(col.type), colAffichageRef(col));
          valeurs = r.ids.map(function (id) { return r.libelles[id]; });
          g = 'choix';
        } catch (e2) {
          ignores.push(lib);
          continue;
        }
      } else if (['references', 'autre'].indexOf(g) !== -1) {
        ignores.push(lib);
        continue;
      } else if (GENRES_A_VALEURS.indexOf(g) !== -1) {
        valeurs = Array.isArray(ch.valeurs) ? ch.valeurs.slice() : choixDe(col);
      }
      libParCol[ch.col] = lib;
      champs.push({ libelle: lib, genre: g, valeurs: valeurs, echeance: ch.col === cfg.colEcheance, responsable: ch.col === cfg.colResponsable,
        surCarte: ch.surCarte, dansFiche: ch.dansFiche });
    }
    var parCol = function (l) { return (l || []).map(function (x) { return libParCol[x]; }).filter(Boolean); };
    etat.brouillon = brouillonDepuisDefinition({ nom: (cfg.nom || 'Kanban') + ' (copy)', description: cfg.description || '', etapes: etapes, champs: champs,
      options: { filtres: parCol(cfg.filtres), filtreRetard: !!cfg.filtreRetard, ordreFiche: parCol(cfg.ordreFiche),
        compact: !!cfg.compact, recherche: cfg.recherche !== false },
      origine: 'the "' + (cfg.nom || 'Untitled') + '" Kanban', ignores: ignores });
    etat.brouillon.choixDepart = 'modele';
    masquerLoader();
    afficherVue('assistant');
  } catch (e) {
    masquerLoader();
    afficherErreur('Reading this Kanban failed.', e);
  }
}

/* === SECTION: PATH 2, CONNECTING TO EXISTING DATA === */
async function demarrerBranchement() {
  afficherLoader('Reading your tables…');
  try {
    await chargerMeta();
    etat.assistant = nouvelAssistantBranchement(etat.tableLiee && tablesBranchables().indexOf(etat.tableLiee) !== -1 && !tableauDeTable(etat.tableLiee) ? etat.tableLiee : null);
    etat.assistant.etape = 0;
    masquerLoader();
    afficherVue('branchement');
  } catch (e) {
    masquerLoader();
    afficherErreur('Reading the document tables failed.', e);
  }
}

function nouvelAssistantBranchement(table) {
  return { mode: 'branchement', etape: 1, table: table, colEtape: null, colTitre: null, champs: {}, ordre: 'manuel', triCol: '', triSens: 'asc',
    colEcheance: '', colResponsable: '', apercuEtapes: null };
}

/* Kanbans suggested from the document tables: for each table not yet
   used, the widget looks for a column that looks like a stage (choice
   list or reference, name suggesting a status, a state, a phase...) and
   a title. The best suggestions come first; none is applied without
   confirmation. */
function suggestionsDeDonnees() {
  var res = [];
  tablesBranchables().forEach(function (tid) {
    if (tableauDeTable(tid)) { return; }
    var a = nouvelAssistantBranchement(tid);
    proposerAssociations(a);
    if (!a.colEtape || !a.colTitre) { return; }
    var colE = infoColonne(tid, a.colEtape);
    var score = (colE.type === 'Choice' ? 3 : (colE.type.indexOf('Ref:') === 0 ? 2 : 0)) + (evoqueRole(colE, 'etape') ? 2 : 0)
      + (a.colEcheance ? 1 : 0) + (a.colResponsable ? 1 : 0);
    res.push({ a: a, score: score, colE: colE, nom: libelleTable(tid) + ' by ' + colE.label });
  });
  return res.sort(function (x, y) { return y.score - x.score; }).slice(0, 6);
}

  var vierge = creer('div', { classe: 'w-tuiles w-tuiles--grille' }, [creer('section', { classe: 'w-tuile', attrs: { 'aria-label': 'Blank Kanban' } }, [

  var autres = colonnesDe(t).filter(function (c) { return c.colId !== a.colEtape && c.colId !== a.colTitre && IDS_META.indexOf(c.colId) === -1 && !estColonneTechnique(t, c.colId); });
  if (!a.colEcheance) {

  var lecture = choisis.filter(function (c) { return !estModifiable(c, genreDe(c)); }).map(function (c) { return c.label; });

async function executerBranchement() {
  var a = etat.assistant;
  afficherLoader('Connecting the Kanban…');
  try {
    await chargerMeta();
    var colOrdre = null;
    if (a.ordre === 'manuel') {
      colOrdre = colonneOrdreExistante(a.table);
      if (!colOrdre) { colOrdre = await ajouterColonne(a.table, nomColonneOrdreLibre(a.table), 'Numeric', null); }
    }
    var colE = infoColonne(a.table, a.colEtape);
    var cible = tableCibleRef(colE.type);
    var source = colE.type === 'Choice' ? { type: 'choice' } : (cible ? { type: 'ref', table: cible, colAffichage: colAffichageRef(colE), colOrdre: colonneOrdreExistante(cible) } : { type: 'text' });
    var champs = autresColonnes(a).filter(function (c) { return a.champs[c.colId]; }).map(function (c) { return { col: c.colId, surCarte: true }; });
    await assurerBibliotheque();
    await lireTableaux();
    memoriserTableau(preparerNouveauTableau());
    await ecrireConfig({
      mode: 'branche', nom: libelleTable(a.table), description: '', tableCartes: a.table, colTitre: a.colTitre, colEtape: a.colEtape,
      sourceEtapes: source, colOrdreCartes: colOrdre, tri: a.ordre === 'auto' ? { col: a.triCol || a.colTitre, sens: a.triSens } : null,
      champs: champs, colEcheance: a.colEcheance || null, colResponsable: a.colResponsable || null, limites: {}, compact: false,
      recherche: true, filtres: a.colResponsable ? [a.colResponsable] : [], filtreRetard: !!a.colEcheance
    });
    etat.assistant = null;
    await chargerTout();
    masquerLoader();
    afficherSucces('Your Kanban "' + (etat.config.nom || '') + '" is ready: it shows the table ' + libelleTable(etat.config.tableCartes) + '.');
  } catch (e) {
    masquerLoader();
    afficherErreur('Connecting the Kanban failed.', e);
  }
}

/* "i" help: a button that shows a short explanation on click (not on
   hover: unusable with keyboard and touch, and ineffective inside the
   platform frame). Escape or a second click closes it. */
function aide(id, sujet, texte, aDroite) {
  var panneau = creer('p', { classe: 'w-aide__texte' + (aDroite ? ' w-aide__texte--droite' : ''), id: id + '_aide', texte: texte });
  panneau.hidden = true;
  var b = creer('button', { classe: 'w-aide', attrs: { type: 'button', 'aria-label': 'Help: ' + sujet, 'aria-expanded': 'false', 'aria-controls': id + '_aide' } },
    [creer('span', { classe: 'w-aide__rond', texte: 'i', attrs: { 'aria-hidden': 'true' } })]);
  var basculer = function (ouvrir) {
    panneau.hidden = !ouvrir;
    b.setAttribute('aria-expanded', ouvrir ? 'true' : 'false');
  };
  b.addEventListener('click', function () { basculer(panneau.hidden); });
  b.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panneau.hidden) { e.stopPropagation(); basculer(false); } });
  return { bouton: b, panneau: panneau };
}

/* Kanban description text, under its name. Beyond about three lines,
   it is collapsed with "Read more". */
function blocExplication(texte) {
  var p = creer('p', { classe: 'w-explication', id: 'tExplication', texte: texte });
  var long = texte.length > 220 || texte.split('\n').length > 3;
  if (!long) { return p; }
  p.classList.add('w-explication--repliee');
  var b = bouton('Read more', 'discret', null, function () {
    var replie = p.classList.toggle('w-explication--repliee');
    b.textContent = replie ? 'Read more' : 'Show less';
    b.setAttribute('aria-expanded', replie ? 'false' : 'true');
  }, { petit: true, id: 'tLireSuite' });
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-controls', 'tExplication');
  return creer('div', {}, [p, b]);
}

function libelleChampCol(colId) {
  var ch = champDe(colId);
  if (ch) { return libelleChamp(ch); }
  var col = colonneCartes(colId);
  return col ? col.label : colId;
}

function redessinerColonnes() {
  detruireSortables();
  var zone = document.getElementById('tTableau');
  if (!zone) { return; }
  var defilements = Object.create(null);
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) { defilements[l.getAttribute('data-cle')] = l.scrollTop; });
  var defilementX = zone.scrollLeft;
  vider(zone);
  var cles;
  if (etat.regroupement) {
    cles = groupesAffiches().map(function (g) { return g.cle; });
  } else {
    cles = etat.etapes.map(function (e) { return e.cle; });
    if (etat.cartes.some(function (x) { return x.cle === CLE_NON_CLASSE; })) { cles.push(CLE_NON_CLASSE); }
  }
  cles.forEach(function (cle) { zone.appendChild(rendreColonne(cle)); });
  Array.prototype.forEach.call(zone.querySelectorAll('.w-colonne__liste'), function (l) {
    brancherGlisser(l, l.getAttribute('data-cle'));
    if (defilements[l.getAttribute('data-cle')]) { l.scrollTop = defilements[l.getAttribute('data-cle')]; }
  });
  zone.scrollLeft = defilementX;
  brancherGlisserColonnes(zone);
}

function rendreColonne(cle) {
  var c = etat.config;
  var toutes = cartesColonne(cle);
  var visibles = toutes.filter(correspondFiltres);
  var lib = libelleColonne(cle);
  var depasse = false;
  /* Column with no card shown: reduced in width and height, its header
     and its "+ Add" button stay accessible, and its drop zone stays
     visible so a card can be dragged into it. */
  /* Archive column: collapsed even when it has cards, until the user
     opens it; it remains a drop zone. */
  var archive = !etat.regroupement && !!c.colonneArchive && cle === c.colonneArchive;
  var archRepliee = archive && !etat.archivesOuvertes;
  var vide = (!visibles.length || archRepliee) && cle !== CLE_NON_CLASSE;
  var sec = creer('section', { classe: 'w-colonne' + (depasse ? ' w-colonne--alerte' : '') + (vide ? ' w-colonne--vide' : '') + (archive ? ' w-colonne--archive' : '') + (cle === CLE_NON_CLASSE ? ' w-colonne--nonclasse' : ''),
    attrs: { 'aria-labelledby': 'tCol_' + cleId(cle), 'data-cle': cle } });
  var ordonnable = colonnesOrdonnablesSurKanban() && cle !== CLE_NON_CLASSE;
  var compte = formaterNombre(toutes.length);
  var tete = creer('div', { classe: 'w-colonne__tete' }, [

function cleId(cle) { return String(cle).replace(/[^A-Za-z0-9_-]/g, '_'); }

function rendreCarte(x) {
  var c = etat.config;
  var art = creer('div', { classe: 'w-carte', attrs: { 'data-id': x.id, role: 'listitem' } });
  /* A click anywhere on the card opens its card details. With the keyboard,
     the title button opens it: the card itself is not an extra tab stop.
     A click that closely follows a drag is ignored. */
  art.addEventListener('click', function (e) {
    if (Date.now() - etat.finGlisser < 400) { return; }
    if (e.target.closest && e.target.closest('button, a, input, select, textarea')) { return; }
    ouvrirCarte(x, x.cle);
  });
  var titre = x.titre ? String(x.titre) : 'Untitled';
  art.appendChild(creer('h4', { classe: 'w-carte__titre' }, [creer('button', { classe: 'w-carte__ouvrir', texte: titre,
    attrs: { 'aria-label': 'Open card ' + titre }, clic: function () { ouvrirCarte(x, x.cle); } })]));
  /* A single flow of fields, in the order chosen in the settings:
     badges, texts and values are not grouped by kind. */
  var infos = creer('div', { classe: 'w-carte__infos' });
  var noms = c.nomsInfos !== false;
  /* Field name (small, subtle) followed by its value; without names,
     the value alone. The ": " separator is still read by screen
     readers. */
  var avecNom = function (lib, valeur) {
    if (!noms) { return [creer('span', { classe: 'ui-sr-only', texte: lib + ': ' }), creer('span', { classe: 'w-carte__valeur', texte: valeur })]; }
    return [creer('span', { classe: 'w-carte__libelle', texte: lib }), creer('span', { classe: 'ui-sr-only', texte: ': ' }), creer('span', { classe: 'w-carte__valeur', texte: valeur })];
  };
  var champs = c.champs.filter(function (ch) { return ch.surCarte; });
  if (c.compact) { champs = champs.filter(function (ch) { return ch.col === c.colEcheance || ch.col === c.colResponsable; }); }
  if (c.couverture && !c.compact) {
    var image = premiereImage(x.valeurs[c.couverture]);
    if (image) {
      var img = creer('img', { classe: 'w-carte__couverture', attrs: { alt: '', loading: 'lazy' } });
      art.insertBefore(img, art.firstChild);
      relayer(chargerCouverture(image, img), 'Cover image');
    }
  }
  if (c.couleur) {
    var vc = texteValeur(c.couleur, x.valeurs[c.couleur]);
    if (vc) { art.classList.add('w-carte--couleur'); art.classList.add('w-carte--c-' + couleurBadge(vc)); }
  }
  champs.forEach(function (ch) {
    var col = colonneCartes(ch.col);
    var g = genreDe(col, ch);
    var v = x.valeurs[ch.col];
    var t = texteValeur(ch.col, v);
    var lib = libelleChamp(ch);
    /* Empty field: shown by its name alone when names are displayed,
       to flag what is missing;
       hidden otherwise. */
    if (!t && g !== 'oui_non') {
      if (noms) {
        infos.appendChild(creer('span', { classe: 'w-carte__info w-carte__info--vide' }, [iconeInfo(g, col), creer('span', { classe: 'w-carte__libelle', texte: lib }),
          creer('span', { classe: 'ui-sr-only', texte: ': not filled in' })]));
      }
      return;
    }
    if (ch.col === c.colEcheance) {
      var retard = estEnRetard(x);
      infos.appendChild(creer('span', { classe: 'w-carte__info' + (retard ? ' w-carte__retard' : '') }, [
        creer('span', { classe: (retard ? 'ui-icon-warning-line' : 'ui-icon-calendar-line') + ' ui-icon--sm w-carte__ico', attrs: { 'aria-hidden': 'true' } })]
        .concat(avecNom(retard ? 'Overdue' : lib, t))));
    } else if (g === 'personne' || ch.col === c.colResponsable) {
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo('personne')].concat(avecNom(lib, t))));
    } else if (g === 'choix') {
      infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [iconeInfo(g, col), noms ? creer('span', { classe: 'w-carte__libelle', texte: lib }) : creer('span', { classe: 'ui-sr-only', texte: lib + ': ' }),
        badge(t, couleurBadge(t))]));
    } else if (g === 'etiquettes') {
      infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [iconeInfo(g, col), noms ? creer('span', { classe: 'w-carte__libelle', texte: lib }) : creer('span', { classe: 'ui-sr-only', texte: lib + ': ' })]
        .concat((Array.isArray(v) ? v.slice(1) : []).map(function (e) { return badge(String(e), couleurBadge(e)); }))));
    } else if (g === 'references') {
      infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [iconeInfo(g, col), noms ? creer('span', { classe: 'w-carte__libelle', texte: lib }) : creer('span', { classe: 'ui-sr-only', texte: lib + ': ' })]
        .concat(t.split(', ').map(function (e) { return badge(e); }))));
    } else if (estValeurInvalide(g, v)) {
      infos.appendChild(creer('span', { classe: 'w-carte__info w-carte__invalide' }, [creer('span', { classe: 'ui-icon-warning-line ui-icon--sm', attrs: { 'aria-hidden': 'true' } })].concat(avecNom(lib, t))));
    } else if (g === 'oui_non') {
      /* Yes/no: the name, like the others, then a green check mark. */
      if (v !== true && noms) { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [creer('span', { classe: 'w-carte__libelle', texte: lib }), creer('span', { classe: 'ui-sr-only', texte: ': no' })])); }
      if (v === true) { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [creer('span', { classe: 'w-carte__libelle', texte: lib }),
        creer('span', { classe: 'ui-icon-check-line ui-icon--sm w-carte__coche', attrs: { 'aria-hidden': 'true' } }), creer('span', { classe: 'ui-sr-only', texte: ': yes' })])); }
    } else if (g === 'lien') {
      var lk = lienDepuisTexte(t);
      if (lk) {
        var texteLien = lk.libelle !== lk.url ? lk.libelle : lib;
        infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo(g, col), creer('a', { classe: 'ui-link ui-link--sm', texte: texteLien, attrs: { href: lk.url, target: '_blank', rel: 'noopener noreferrer', title: texteLien + ' - new window' } })]));
      } else { infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo(g, col)].concat(avecNom(lib, t)))); }
    } else if (g === 'pj') {
      var nb = idsPJ(v).length;
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo('pj')]
        .concat(noms ? [creer('span', { classe: 'w-carte__libelle', texte: lib })] : [])
        .concat([creer('span', { classe: 'w-carte__valeur', texte: String(nb), attrs: { 'aria-hidden': 'true' } }), creer('span', { classe: 'ui-sr-only', texte: lib + ': ' + t })])));
    } else if (g === 'texte_long') {
      infos.appendChild(creer('p', { classe: 'w-carte__texte' }, (noms ? [iconeInfo(g, col), creer('span', { classe: 'w-carte__libelle', texte: lib }), creer('span', { classe: 'ui-sr-only', texte: ': ' })] : [creer('span', { classe: 'ui-sr-only', texte: lib + ': ' })])
        .concat([t.length > 120 ? t.slice(0, 117) + '…' : t])));
    } else {
      infos.appendChild(creer('span', { classe: 'w-carte__info' }, [iconeInfo(g, col)].concat(avecNom(lib, t.length > 60 ? t.slice(0, 57) + '…' : t))));
    }
  });
  var echeanceAffichee = champs.some(function (ch) { return ch.col === c.colEcheance; });
  if (c.colEcheance && !echeanceAffichee && estEnRetard(x)) {
    infos.appendChild(creer('span', { classe: 'w-carte__info w-carte__retard' }, avecNom('Overdue', texteValeur(c.colEcheance, x.valeurs[c.colEcheance]))));
  }
  /* Color never carries information on its own: if the field that
     colors the card is not shown on it, its value is added. */
  if (c.couleur && !champs.some(function (ch) { return ch.col === c.couleur; })) {
    var vcl = texteValeur(c.couleur, x.valeurs[c.couleur]);
    if (vcl) { infos.appendChild(creer('span', { classe: 'w-carte__groupe' }, [creer('span', { classe: noms ? 'w-carte__libelle' : 'ui-sr-only', texte: libelleChampCol(c.couleur) + (noms ? '' : ': ') }), badge(vcl, couleurBadge(vcl))])); }
  }
  if (infos.childNodes.length) { art.appendChild(infos); }
  if (x.cle !== CLE_NON_CLASSE || etat.etapes.length) {
    var nbCom = c.historique ? nbCommentaires(x) : 0;
    var bulle = c.historique ? creer('button', { classe: 'ui-btn ui-btn--tertiary-no-outline ui-btn--sm w-carte__bulle w-infobulle',
      attrs: { 'aria-label': 'Activity and comments for card ' + titre + (nbCom ? ', ' + nbCom + ' comment' + (nbCom !== 1 ? 's' : '') : ''), 'data-infobulle': 'Activity and comments' },
      clic: function () { if (Date.now() - etat.finGlisser < 400) { return; } ouvrirCarte(x, null, null, { activite: true }); } }, [
      creer('span', { classe: 'ui-icon-chat-3-line ui-icon--sm', attrs: { 'aria-hidden': 'true' } }),
      nbCom ? creer('span', { classe: 'w-carte__nbcom', texte: String(nbCom), attrs: { 'aria-hidden': 'true' } }) : null]) : null;
    art.appendChild(creer('div', { classe: 'w-carte__pied' }, [bulle, !etat.peutModifier ? null : bouton('Move', 'discret', 'drag-move-2-line', function () { if (Date.now() - etat.finGlisser < 400) { return; } ouvrirDeplacement(x); },
      { petit: true, iconeSeule: true, aria: 'Move card ' + titre, classe: 'w-carte__deplacer w-infobulle', attrs: { 'data-infobulle': 'Move this card' } })]));
