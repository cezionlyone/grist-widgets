}

function piedDuModele(cfg, rc) {
  var l = (cfg.blocks || []).filter(function (b) { return b.type === 'footer' && conditionRemplie(b.cond, rc); });
  return l[0] || null;
}

/* Splits a unit that does not fit: trailing rows go to a continuation on
   the next page. Returns the continuation, or null if the unit should move
   as a whole. */
function couperUnite(u, tient) {
  var c = u.coupe;
  var cont = c.conteneur;
  var queue = c.queue && c.queue.parentNode ? c.queue : null;
  var parentQueue = queue ? queue.parentNode : null;
  if (queue) { parentQueue.removeChild(queue); }
  var total = cont.children.length;
  var reste = [];
  while (!tient(u.el) && cont.children.length > 0) {
    reste.unshift(cont.lastElementChild);
    cont.removeChild(cont.lastElementChild);
  }
  var gardees = cont.children.length;
  var min = Math.min(c.minimum || 1, total);
  if (!gardees || gardees < min || !tient(u.el)) {
    reste.forEach(function (r) { cont.appendChild(r); });
    if (queue) { parentQueue.appendChild(queue); }
    return null;
  }
  /* Totals never stand alone at the top of a page: the last row goes with
     them. */
  if (queue && !reste.length && gardees > min) {
    reste.unshift(cont.lastElementChild);
    cont.removeChild(cont.lastElementChild);
  }
  var s = c.coquille();
  reste.forEach(function (r) { s.conteneur.appendChild(r); });
  if (queue) { s.el.appendChild(queue); }
  return { el: s.el, coupe: { conteneur: s.conteneur, queue: queue, coquille: c.coquille, minimum: c.minimum } };
}

/* One document (one row) as pages, appended to "cible". opts.envelopper
   wraps each page (preview with zoom). Pages must be in the displayed DOM
   to be measured: the print container sits off screen, not hidden. */
function paginerDocument(cfg, rc, cible, opts) {
  opts = opts || {};
  var geo = geometrie(cfg);
  var pied = piedDuModele(cfg, rc);
  var unites = [];
  (cfg.blocks || []).forEach(function (b) { if (b.type !== 'footer') { unites = unites.concat(unitesBloc(b, rc)); } });
  var pages = [];
  var page = null, corps = null;
  var ouvrir = function () {
    page = nouvellePage(cfg, geo);
    cible.appendChild(opts.envelopper ? opts.envelopper(page, geo) : page);
    corps = creer('div', { classe: 'p-body' });
    corps.style.top = geo.m + 'px'; corps.style.left = geo.m + 'px'; corps.style.right = geo.m + 'px';
    var bas = geo.m;
    if (pied) {
      var p = construirePied(pied, rc, geo);
      page.appendChild(p);
      bas = Math.max(geo.m, Math.max(22, Math.round(geo.m * 0.5)) + p.offsetHeight + 14);
    }
    corps.style.bottom = bas + 'px';
    if ((cfg.page || {}).vcenter) { corps.classList.add('p-body--centre'); }
    page.appendChild(corps);
    pages.push(page);
  };
  var tient = function (el) { return el.offsetTop + el.offsetHeight <= corps.clientHeight + 0.5; };
  ouvrir();
  for (var k = 0; k < unites.length; k++) {
    var u = unites[k];
    if (u.saut) { if (corps.childNodes.length) { ouvrir(); } continue; }
    if (u.garder) { u.el.setAttribute('data-garder', '1'); }
    corps.appendChild(u.el);
    if (tient(u.el)) { continue; }
    if (u.coupe && (corps.childNodes.length === 1 || u.deplacee || u.coupe.queue || u.coupe.minimum)) {
      var suite = couperUnite(u, tient);
      if (suite) { ouvrir(); unites.splice(k + 1, 0, suite); continue; }
    }
    if (corps.childNodes.length > 1 && !u.deplacee) {
      corps.removeChild(u.el);
      var avec = [];
      var prec = corps.lastChild;
      while (prec && prec.getAttribute && prec.getAttribute('data-garder') === '1' && corps.childNodes.length > 1) {
        avec.unshift(prec); corps.removeChild(prec); prec = corps.lastChild;
      }
      ouvrir();
      avec.forEach(function (e) { corps.appendChild(e); });
      u.deplacee = true;
      k--;
      continue;
    }
    /* Alone and still too tall: kept (cut at the bottom margin). */
  }
  pages.forEach(function (p, n) {
    Array.prototype.forEach.call(p.querySelectorAll('[data-pn]'), function (s) { s.textContent = s.getAttribute('data-pn') === 'page' ? String(n + 1) : String(pages.length); });
    p.setAttribute('aria-label', (opts.nomDoc ? opts.nomDoc + ', page ' : 'Page ') + (n + 1) + ' of ' + pages.length);
  });
  return pages;
}

/* Labels and badges: several rows per page, in a grid of cards. */
function paginerEtiquettes(cfg, rcBase, lignes, cible, opts) {
  opts = opts || {};
  var geo = geometrie(cfg);
  var g = GRILLES_ETIQUETTES[(cfg.page || {}).labels] || GRILLES_ETIQUETTES['2x4'];
  var parPage = g.cols * g.rangs;
  var nbPages = Math.max(1, Math.ceil(lignes.length / parPage));
  var pages = [];
  for (var p = 0; p < nbPages; p++) {
    var page = nouvellePage(cfg, geo);
    cible.appendChild(opts.envelopper ? opts.envelopper(page, geo) : page);
    var grille = creer('div', { classe: 'p-grid' + ((cfg.page || {}).guides === false ? '' : ' p-grid--guides') });
    grille.style.top = geo.m + 'px'; grille.style.left = geo.m + 'px'; grille.style.right = geo.m + 'px'; grille.style.bottom = geo.m + 'px';
    grille.style.gridTemplateColumns = 'repeat(' + g.cols + ', minmax(0, 1fr))';
    grille.style.gridTemplateRows = 'repeat(' + g.rangs + ', minmax(0, 1fr))';
    for (var k = 0; k < parPage; k++) {
      var i = lignes[p * parPage + k];
      var carte = creer('div', { classe: 'p-card' + (i === undefined ? ' p-card--vide' : '') });
      if (i !== undefined) {
        var rc = { cfg: cfg, tid: rcBase.tid, i: i, apercu: rcBase.apercu, editeur: rcBase.editeur, logoUrl: rcBase.logoUrl };
        (cfg.blocks || []).forEach(function (b) {
          if (b.type === 'footer' || b.type === 'items' || b.type === 'pagebreak') { return; }
          unitesBloc(b, rc).forEach(function (u) { if (u.el) { carte.appendChild(u.el); } });
        });
      }
      grille.appendChild(carte);
    }
    page.appendChild(grille);
    page.setAttribute('aria-label', 'Page ' + (p + 1) + ' of ' + nbPages);
    pages.push(page);
  }
  return pages;
}

/* --- Preview with zoom: each page in a wrapper of its scaled size --- */
function enveloppeApercu(page, geo) {
  var w = creer('div', { classe: 'p-wrap', attrs: { 'data-w': geo.w, 'data-h': geo.h } });
  w.appendChild(page);
  return w;
}

function appliquerZoom(zone, z) {
  Array.prototype.forEach.call(zone.querySelectorAll('.p-wrap'), function (w) {
    var gw = Number(w.getAttribute('data-w')), gh = Number(w.getAttribute('data-h'));
    w.style.width = Math.round(gw * z) + 'px';
    w.style.height = Math.round(gh * z) + 'px';
    var p = w.firstChild;
    if (p) { p.style.transform = 'scale(' + z + ')'; }
  });
}

function zoomAjuste(zone, cfg) {
  var geo = geometrie(cfg);
  var largeur = (zone && zone.clientWidth ? zone.clientWidth : 800) - 40;
  return Math.max(0.25, Math.min(1.1, largeur / geo.w));
}

/* Renders documents for a list of rows into "zone". Returns the number of
   pages. */
function rendreDocuments(zone, cfg, lignes, base, opts) {
  opts = opts || {};
  var n = 0;
  if (cfg.layout === 'labels') {
    n += paginerEtiquettes(cfg, base, lignes, zone, opts).length;
    return n;
  }
  lignes.forEach(function (i, k) {
    var rc = { cfg: cfg, tid: base.tid, i: i, apercu: base.apercu, editeur: base.editeur, logoUrl: base.logoUrl };
    var cible = zone;
    if (opts.groupes) { cible = creer('div', { classe: 'w-pages__doc', attrs: { role: 'group', 'aria-label': 'Document ' + (k + 1) + ': ' + libelleLigne(cfg, i) } }); zone.appendChild(cible); }
    n += paginerDocument(cfg, rc, cible, { envelopper: opts.envelopper, nomDoc: opts.groupes ? libelleLigne(cfg, i) : null }).length;
  });
  return n;
}

/* Thumbnail: a real page, scaled down. */
function vignette(cfg, rc, largeur, lignesEtiquettes) {
  var geo = geometrie(cfg);
  var z = largeur / geo.w;
  var hauteur = Math.round(geo.h * z);
  var maxH = 176;
  if (hauteur > maxH) { z = maxH / geo.h; hauteur = maxH; }
  var v = creer('div', { classe: 'w-vignette', attrs: { 'aria-hidden': 'true' } });
  v.style.width = Math.round(geo.w * z) + 'px';
  v.style.height = hauteur + 'px';
  return {
    el: v,
    dessiner: function () {
      try {
        var pages;
        if (cfg.layout === 'labels') { pages = paginerEtiquettes(cfg, rc, lignesEtiquettes || [rc.i], v, {}); }
        else { pages = paginerDocument(cfg, rc, v, {}); }
        pages.forEach(function (p, k) { if (k > 0) { v.removeChild(p); } else { p.style.transform = 'scale(' + z + ')'; } });
      } catch (e) { logSecurite('WARNING', 'Thumbnail not drawn', e); }
    }
  };
}

/* === SECTION : TEMPLATE CHECK ON LOAD ===
   Missing columns are never recreated: a field whose column has
   disappeared prints nothing (and is flagged in the editor). */
function normaliserConfig(cfg) {
  cfg.page = cfg.page || {};
  var p = cfg.page;
  /* Own keys only: a value such as "constructor" read from the settings
     row must not match an inherited property. */
  var propre = function (o, k) { return typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k); };
  if (!propre(PAPIERS, p.size)) { p.size = formatPapier() === 'letter' ? 'letter' : 'a4'; }
  if (['portrait', 'landscape'].indexOf(p.orientation) === -1) { p.orientation = 'portrait'; }
  if (!propre(MARGES, p.margins)) { p.margins = 'normal'; }
  p.color = couleurValide(p.color);
  if (['sans', 'serif'].indexOf(p.font) === -1) { p.font = 'sans'; }
  if (['left', 'center', 'right'].indexOf(p.logoPos) === -1) { p.logoPos = 'left'; }
  if (['S', 'M', 'L', 'XL'].indexOf(p.logoSize) === -1) { p.logoSize = 'M'; }
  if (['none', 'thin', 'double'].indexOf(p.border) === -1) { p.border = 'none'; }
  if (!propre(GRILLES_ETIQUETTES, p.labels)) { p.labels = '2x4'; }
  cfg.blocks = Array.isArray(cfg.blocks) ? cfg.blocks : [];
  cfg.writeBack = cfg.writeBack || { enabled: false, col: null };
  return cfg;
}

/* Table or column renamed in Grist: the identifier follows the label
   ("Invoices" renamed "Sales invoices" becomes Sales_invoices). A template
   keeps the internal references of its tables and columns, which never
   change, and finds them again under their new identifiers, fields written
   in its texts ({Client.Address}) included. The new identifiers are used at
   once, and written to the settings row with the next save. */
function reecrireChamps(s, f) {
  /* Same reading as analyserTexte: a backslash keeps the next character,
     {path|options} is a field; only the path is replaced. */
  s = String(s);
  var out = '';
  var i = 0;
  while (i < s.length) {
    var c = s.charAt(i);
    if (c === '\\' && i + 1 < s.length) { out += s.substr(i, 2); i += 2; continue; }
    if (c === '{') {
      var j = s.indexOf('}', i + 1);
      var dedans = j > i + 1 ? s.slice(i + 1, j) : '';
      if (dedans && dedans.indexOf('{') === -1 && dedans.indexOf('\n') === -1 && dedans.length <= 160) {
        var morceaux = dedans.split('|');
        var ch = morceaux[0].trim();
        var n = f(ch);
        if (typeof n === 'string' && n && n !== ch && dedans.length - morceaux[0].length + n.length <= 160) { morceaux[0] = n; }
        out += '{' + morceaux.join('|') + '}';
        i = j + 1;
        continue;
      }
    }
    out += c;
    i += 1;
  }
  return out;
}

/* Every column reference of a template, as (table, path): f returns the
   path to keep. Paths of the line items are relative to their table. */
function parcourirCheminsConfig(cfg, f) {
  var tp = cfg.table;
  if (cfg.labelCol) { cfg.labelCol = f(tp, cfg.labelCol); }
  if (cfg.writeBack && cfg.writeBack.col) { cfg.writeBack.col = f(tp, cfg.writeBack.col); }
  parcourirBlocs(cfg.blocks, function (b) {
    if (!b || typeof b !== 'object') { return; }
    ['text', 'name', 'caption'].forEach(function (k) { if (typeof b[k] === 'string') { b[k] = reecrireChamps(b[k], function (ch) { return f(tp, ch); }); } });
    if (Array.isArray(b.items)) { b.items.forEach(function (it) { if (it && typeof it.path === 'string' && it.path) { it.path = f(tp, it.path); } }); }
    if (b.type === 'image' && typeof b.col === 'string' && b.col) { b.col = f(tp, b.col); }
    if (typeof b.imageCol === 'string' && b.imageCol) { b.imageCol = f(tp, b.imageCol); }
    if (b.cond && typeof b.cond.path === 'string' && b.cond.path) { b.cond.path = f(tp, b.cond.path); }
    if (b.type === 'items' && b.table) {
      ['ref', 'sort', 'amount'].forEach(function (k) { if (typeof b[k] === 'string' && b[k]) { b[k] = f(b.table, b[k]); } });
      if (Array.isArray(b.columns)) { b.columns.forEach(function (c) { if (c && typeof c.col === 'string' && c.col) { c.col = f(b.table, c.col); } }); }
    }
  });
}

/* Each segment of a path ("Client.Address") is looked up in the table
   reached so far: key "<table ref>:<column id>". */
function parcourirChemin(tid, chemin, f) {
  var parts = String(chemin || '').split('.');
  var t = tid;
  for (var k = 0; k < parts.length && t && etat.meta.tables[t]; k++) {
    var col = f(t, parts[k], k);
    if (!col) { return; }
    t = tableCibleRef(col.type);
  }
}

function noterReferencesConfig(cfg) {
  if (!cfg || !etat.meta || !etat.meta.tables[cfg.table]) { return; }
  cfg.tableRef = etat.meta.tables[cfg.table].ref;
  var refs = {};
  parcourirBlocs(cfg.blocks, function (b) {
    if (b && b.type === 'items' && b.table && etat.meta.tables[b.table]) { b.tableRef = etat.meta.tables[b.table].ref; }
  });
  parcourirCheminsConfig(cfg, function (tid, chemin) {
    parcourirChemin(tid, chemin, function (t, seg) {
      var col = infoColonne(t, String(seg).trim());
      if (col) { refs[etat.meta.tables[t].ref + ':' + col.colId] = col.ref; }
      return col;
    });
    return chemin;
  });
  cfg.colRefs = refs;
}

function tableRenommee(tid, ref) {
  if (!tid || etat.meta.tables[tid] || typeof ref !== 'number') { return tid; }
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) {
    if (etat.meta.tables[ids[i]].ref === ref) { logSecurite('INFO', 'Table renamed: ' + tid + ' is now ' + ids[i]); return ids[i]; }
  }
  return tid;
}

function retrouverRenommages(cfg) {
  if (!cfg || !cfg.table || !etat.meta || !etat.meta.tables) { return; }
  cfg.table = tableRenommee(cfg.table, cfg.tableRef);
  parcourirBlocs(cfg.blocks, function (b) {
    if (b && b.type === 'items' && b.table) { b.table = tableRenommee(b.table, b.tableRef); }
  });
  var refs = cfg.colRefs && typeof cfg.colRefs === 'object' ? cfg.colRefs : null;
  if (refs && etat.meta.colParRef) {
    parcourirCheminsConfig(cfg, function (tid, chemin) {
      var parts = String(chemin).split('.');
      var change = false;
      parcourirChemin(tid, chemin, function (t, seg, k) {
        var id = String(seg).trim();
        var cle = etat.meta.tables[t].ref + ':' + id;
        /* The stored reference wins: a column renamed, then another one
           given its former name, keeps the template on the first one. */
        if (Object.prototype.hasOwnProperty.call(refs, cle)) {
          var c = etat.meta.colParRef[refs[cle]];
          if (c && c.tableId === t && c.colId !== id) { parts[k] = c.colId; change = true; return c; }
        }
        return infoColonne(t, id);
      });
      return change ? parts.join('.') : chemin;
    });
  }
  noterReferencesConfig(cfg);
}

function verifierConfig(cfg) {
  if (cfg) { retrouverRenommages(cfg); }
  if (!cfg || !cfg.table || !etat.meta.tables[cfg.table]) { return false; }
  normaliserConfig(cfg);
  if (!cfg.labelCol || !infoColonne(cfg.table, cfg.labelCol)) { cfg.labelCol = deviner(cfg.table).nom || null; }
  parcourirBlocs(cfg.blocks, function (b) {
    if (b.type === 'items' && b.table && !etat.meta.tables[b.table]) { logSecurite('WARNING', 'Line items table has disappeared: ' + b.table); }
  });
  return true;
}

/* === SECTION : DATA OF THE TEMPLATE SHOWN === */
async function chargerDonnees(cfg) {
  var tables = tablesNecessaires(cfg);
  etat.indexEnfants = {};
  for (var i = 0; i < tables.length; i++) { await chargerTableDonnees(tables[i]); }
  if (besoinPJ(cfg)) { await chargerMetaPJ(); }
}

function besoinPJ(cfg) {
  var oui = !!cfg.logo;
  parcourirBlocs(cfg.blocks, function (b) {
    if (b.type === 'image' || (b.type === 'signature' && b.imageCol)) { oui = true; }
  });
  if (!oui) {
    colonnesDe(cfg.table).forEach(function (c) { if (c.type === 'Attachments') { oui = true; } });
  }

}

function empreinteDonnees() {
  var cfg = etat.config;

/* Rows of the template's table, in the table's order. */
function toutesLignes() { return etat.config ? ordreLignes(etat.config.table) : []; }

function estLieeAuModele() { return !!etat.config && !!etat.tableLiee && etat.tableLiee === etat.config.table; }

function colonneSousTitre(cfg) {

function colonneImprime(cfg) {

function estImprimee(cfg, i) {
  var col = colonneImprime(cfg);

/* Rows matching the search, the column filter and "not printed yet". */
function lignesFiltrees() {
  var cfg = etat.config;

  var col = etat.filtreCol ? infoColonne(cfg.table, etat.filtreCol) : null;
  return toutesLignes().filter(function (i) {
    if (q) {
      var t = normalizer(libelleLigne(cfg, i) + ' ' + (sous ? valeurChemin(cfg.table, i, sous, []).texte : ''));
      if (t.indexOf(q) === -1) { return false; }

      if (etat.filtreVal === '__VIDE__' ? v !== '' : v !== etat.filtreVal) { return false; }

/* Row shown in "One row" mode: the Grist selection when linked and

  if (estLieeAuModele() && etat.suivreCurseur && etat.idCurseur) {

/* === SECTION : PRINTING ===
   window.print() on a dedicated container: the browser's own print, so
   "Save as PDF" keeps real text. Several rows: one document per row, each
   starting on a new page, in a single print job. */
function pause() { return new Promise(function (r) { setTimeout(r, 0); }); }

async function imagesChargees(zone, delaiMs) {
  var imgs = Array.prototype.slice.call(zone.querySelectorAll('img'));
  var attente = imgs.map(function (img) {
    if (img.complete && img.naturalWidth) { return Promise.resolve(); }
    return new Promise(function (ok) { img.addEventListener('load', ok); img.addEventListener('error', ok); });
  });
  await Promise.race([Promise.all(attente), new Promise(function (ok) { setTimeout(ok, delaiMs || 15000); })]);
}

async function preparerImpression(lignes) {
  var cfg = etat.config;
  var zone = document.getElementById('pPrint');
  vider(zone);
  appliquerStylePage(cfg);
  var base = { tid: cfg.table, apercu: false, editeur: false };
  if (cfg.layout === 'labels') {
    paginerEtiquettes(cfg, base, lignes, zone, {});
  } else {
    for (var k = 0; k < lignes.length; k++) {
      paginerDocument(cfg, { cfg: cfg, tid: cfg.table, i: lignes[k] }, zone, {});
      if (lignes.length > 10 && k % 10 === 9) {
        afficherLoader('Preparing the documents: ' + formaterNombre(k + 1) + ' of ' + formaterNombre(lignes.length) + '…');
        await pause();
      }
    }
  }
  await imagesChargees(zone);
  return zone.querySelectorAll('.p-page').length;
}

function nomFichier(cfg, lignes) {
  var base = cfg.name || 'Document';
  if (lignes.length === 1) { base += ' - ' + libelleLigne(cfg, lignes[0]); }
  return base.replace(/[\\/:*?"<>|]+/g, ' ').trim();
}

var _apresImpression = null;

/* Some browsers never fire afterprint. Once the person is back in the
   widget after the print dialog (focus, page visible again, a click or a
   key), the print is considered finished: the Print button and the
   automatic refresh are never left blocked. Not during the preparation of
   the documents, only once the dialog has been asked for. */
var _minuterieRetourImpression = null;
function annulerRetourImpression() {
  if (_minuterieRetourImpression) { clearTimeout(_minuterieRetourImpression); _minuterieRetourImpression = null; }
}
function retourApresImpression() {
  if (!etat.impressionEnCours || !etat.impressionLancee) { return; }
  annulerRetourImpression();
  _minuterieRetourImpression = setTimeout(function () {
    _minuterieRetourImpression = null;
    if (etat.impressionEnCours && etat.impressionLancee) { logSecurite('INFO', 'No afterprint event from the browser: printing considered finished'); finImpression(); }
  }, 1500);
}

function lancerImpression(titre, apres) {
  etat.titreAvant = document.title;
  document.title = titre;
  etat.impressionEnCours = true;
  annulerRetourImpression();
  etat.impressionLancee = true;
  _apresImpression = apres || null;
  try {
    window.print();
  } catch (e) {
    afficherErreur('The browser did not open its print dialog.', e);
    finImpression();
  }
}

/* afterprint: interface restored, container emptied, then the optional
   "mark as printed" question. */
function finImpression() {
  if (!etat.impressionEnCours) { return; }
  etat.impressionEnCours = false;
  etat.impressionLancee = false;
  annulerRetourImpression();
  if (etat.titreAvant) { document.title = etat.titreAvant; }
  var zone = document.getElementById('pPrint');
  setTimeout(function () { if (!etat.impressionEnCours && zone) { vider(zone); } }, 300);
  var f = _apresImpression;
  _apresImpression = null;
  if (f) { relayer(Promise.resolve().then(f), 'After printing'); }
}

async function imprimer() {
  var cfg = etat.config;
  if (!cfg || etat.impressionEnCours) { return; }
  var lignes = lignesAImprimer();
  if (!lignes.length) { signalerSaisie(etat.mode === 'plusieurs' ? 'Tick at least one row to print.' : 'There is no row to print yet.'); return; }
  /* Rows are kept by id: a refresh (a row deleted by someone else) may
     shift the positions while the confirmation is open. */
  var ids = lignes.map(function (i) { return idDe(cfg.table, i); });
  if (lignes.length > SEUIL_LOT) {
    var ok = await confirmerAction('Print ' + formaterNombre(lignes.length) + ' documents?', 'Preparing this many documents may take a while, and the print job will be long. You can also print in smaller batches with the search and filters.', 'Print them all');
    if (!ok) { return; }
    if (etat.impressionEnCours || cfg !== etat.config) { return; }
  }
  lignes = ids.map(function (id) { return indexDe(cfg.table, id); }).filter(function (i) { return i >= 0; });
  ids = lignes.map(function (i) { return idDe(cfg.table, i); });
  if (!lignes.length) { signalerSaisie('These rows no longer exist.'); return; }
  if (etat.mode === 'plusieurs' && etat.unParUn && cfg.layout !== 'labels' && lignes.length > 1) { demarrerUnParUn(lignes); return; }
  /* No refresh while the documents are prepared: the row positions stay
     valid until the print dialog opens. */
  etat.impressionEnCours = true;
  afficherLoader(lignes.length > 1 ? 'Preparing ' + formaterNombre(lignes.length) + ' documents…' : 'Preparing the document…');
  try {
    var n = await preparerImpression(lignes);
    masquerLoader();
    annoncer('Print dialog opened: ' + pluriel(n, 'page') + '.');
    lancerImpression(nomFichier(cfg, lignes), function () { return proposerMarquage(ids); });
  } catch (e) {
    etat.impressionEnCours = false;
    masquerLoader();
    afficherErreur('The documents could not be prepared for printing.', e);
  }
}

/* "Print one by one": one print dialog per document, so that each can be
   saved as its own PDF (a browser cannot split one print job into several
   files). Each document is printed on a click, in a small dialog. */
function demarrerUnParUn(lignes) {
  etat.fileUnParUn = { lignes: lignes, k: 0, faits: [] };
  etapeUnParUn();
}

function etapeUnParUn() {
  var f = etat.fileUnParUn;
  var cfg = etat.config;
  if (!f) { return; }
  if (f.k >= f.lignes.length) {
    fermerModale();
    var faits = f.faits.slice();
    etat.fileUnParUn = null;
    afficherSucces('Done: ' + pluriel(faits.length, 'document') + ' sent to the print dialog.');
    if (faits.length) { relayer(proposerMarquage(faits), 'Mark as printed'); }
    return;
  }
  var i = f.lignes[f.k];
  ouvrirModale({
    titre: 'Print one by one', sousTitre: 'Document ' + formaterNombre(f.k + 1) + ' of ' + formaterNombre(f.lignes.length), etroite: true,
    corps: [creer('p', { classe: 'w-texte' }, [creer('strong', { texte: libelleLigne(cfg, i) })]),
      creer('p', { classe: 'w-texte w-mention', texte: 'Tip: in the print dialog, choose "Save as PDF". The file name is suggested from the document: ' + nomFichier(cfg, [i]) + '.' })],
    pied: [bouton('Stop', 'tertiaire', 'close-line', function () { var faits = f.faits.slice(); etat.fileUnParUn = null; fermerModale(); if (faits.length) { relayer(proposerMarquage(faits), 'Mark as printed'); } }, { id: 'pUnStop' }),
      creer('span', { classe: 'w-pousse' }),
      bouton('Skip', 'secondaire', 'arrow-right-line', function () { f.k++; etapeUnParUn(); }, { id: 'pUnPasser' }),
      bouton('Print this document', null, 'printer-line', async function () {
        afficherLoader('Preparing the document…');
        try {
          await preparerImpression([i]);
          masquerLoader();
          lancerImpression(nomFichier(cfg, [i]), function () { f.faits.push(idDe(cfg.table, i)); f.k++; etapeUnParUn(); });
        } catch (e) { masquerLoader(); afficherErreur('This document could not be prepared.', e); }
      }, { id: 'pUnImprimer' })],
    focus: 'pUnImprimer'
  });
}

/* Optional write-back, editors only, after a confirmation: ticks the
   chosen yes/no column, or sets the chosen date column to today. */

    (col.type === 'Bool' ? 'The column "' + col.label + '" will be ticked' : 'The column "' + col.label + '" will be set to today\'s date') + ' for the rows you just printed. Choose Cancel if the printing was cancelled.', 'Mark as printed');
  if (!ok) { return; }

/* Ctrl+P or the browser menu: prints the same as the Print button (all

function avantImpression() {
  if (etat.impressionEnCours) { return; }
  var zone = document.getElementById('pPrint');
  if (!zone) { return; }
  var cfg = etat.vue === 'assistant' && etat.brouillon && etat.brouillon.table ? normaliserConfig(cfgBrouillon(etat.brouillon)) : etat.config;
  var source = etat.vue === 'assistant' ? '#pApercuB .p-page' : '#pPages .p-page';
  var pages = document.querySelectorAll(source);

  vider(zone);
  appliquerStylePage(cfg);
  var lignes = etat.vue === 'document' && etat.mode === 'plusieurs' ? lignesAImprimer() : null;
  try {
    if (lignes && lignes.length) {
      if (cfg.layout === 'labels') { paginerEtiquettes(cfg, { tid: cfg.table }, lignes, zone, {}); }
      else { lignes.forEach(function (i) { paginerDocument(cfg, { cfg: cfg, tid: cfg.table, i: i }, zone, {}); }); }
    } else {

    }

async function copierTexte() {
  var pages = document.querySelectorAll('#pPages .p-page');
  var texte = Array.prototype.map.call(pages, function (p) { return (p.innerText || p.textContent || '').trim(); }).join('\n\n');
  if (!texte) { signalerSaisie('There is no text to copy.'); return; }
  var ac = etat.apercuCompte || { montres: 0, total: 0 };
  var unite = etat.config && etat.config.layout === 'labels' ? 'row' : 'document';
  var message = etat.mode === 'plusieurs'
    ? 'Copied: the text of the ' + pluriel(ac.montres, unite) + ' shown in the preview.' + (ac.total > ac.montres ? ' The other ' + formaterNombre(ac.total - ac.montres) + ' selected are printed, not copied.' : '')
    : 'The text of the document has been copied.';
  try {
    await navigator.clipboard.writeText(texte);
    afficherSucces(message);
  } catch (e) {
    var t = creer('textarea', { valeur: texte, attrs: { 'aria-hidden': 'true', readonly: '' } });
    t.style.position = 'fixed'; t.style.left = '-10000px';
    document.body.appendChild(t);
    t.select();
    var reussi = false;
    try { reussi = document.execCommand('copy'); } catch (e2) { reussi = false; }
    document.body.removeChild(t);
    if (reussi) { afficherSucces(message); }
    else { afficherErreur('The browser did not allow copying. Select the text in the preview and copy it.', e); }
  }
}

/* === SECTION : SETUP WIZARD ===
   Steps: starting point, table and sample row, layout, content, page
   setup, review. Everything happens on a draft: nothing is written to the
   document before "Create my document" (or "Save changes" when editing),
   except the tables of a ready-made template, created after a
   confirmation. The same wizard edits an existing template (owners). */
var ETAPES = ['Starting point', 'Table and sample row', 'Layout', 'Content', 'Page setup', 'Review'];

function demarrerCreation() {
  if (!etat.peutParametrer) { afficherVue('aucun'); return; }
  etat.brouillon = { mode: 'creation', etape: 1, etapeMax: 1, depart: null };
  afficherVue('assistant');
}

function cfgBrouillon(b) {
  return { name: b.name, table: b.table, labelCol: b.labelCol, layout: b.layout, blocks: b.blocks, page: b.page, writeBack: b.writeBack, logo: b.logo || null, sampleId: b.sampleId || null };
}

function nomAuto(layout, tid) { return layout === 'record' ? libelleTable(tid) + ' sheet' : nomMiseEnPage(layout); }

/* Draft built from a table and a layout (template, suggestion or a table
   picked by the person). */
function nouveauBrouillon(tid, layout, enfant, opts, origine) {
  var g = deviner(tid);
  var labelCol = g.numero || g.nom || null;
  var colImp = g.imprime && TYPES_ROLES.marque(infoColonne(tid, g.imprime)) ? g.imprime : null;
  return { mode: 'creation', etape: 2, etapeMax: 2, depart: etat.brouillon ? etat.brouillon.depart : null,
    name: nomAuto(layout, tid), table: tid, labelCol: labelCol, sampleId: null, layout: layout, enfant: enfant, opts: opts || {},
    blocks: genererBlocs(layout, tid, enfant, opts, labelCol), page: pageDeMiseEnPage(layout, {}),
    writeBack: { enabled: false, col: colImp }, logo: null, logoFichier: null, logoUrl: null, creees: [], origine: origine || null, touche: false };
}

async function assurerDonneesBrouillon(relire) {
  var b = etat.brouillon;
  if (!b || !b.table || !etat.meta.tables[b.table]) { return; }
  var cfg = cfgBrouillon(b);
  var tables = tablesNecessaires(cfg);
  tablesEnfants(b.table).forEach(function (e) { if (tables.indexOf(e.table) === -1 && etat.meta.tables[e.table]) { tables.push(e.table); } });
  for (var i = 0; i < tables.length; i++) {
    if (relire || !etat.donnees[tables[i]]) { await chargerTableDonnees(tables[i]); }
  }
  etat.indexEnfants = {};
  if (besoinPJ(cfg)) { await chargerMetaPJ(); }
  if (!b.sampleId || indexDe(b.table, b.sampleId) < 0) {
    var l = ordreLignes(b.table);
    b.sampleId = l.length ? idDe(b.table, l[0]) : null;
  }
}

/* --- General rendering --- */
function rendreAssistant(zone) {
  var b = etat.brouillon;
  if (b.mode === 'creation' && b.etape === 1) { rendreDepart(zone); return; }
  var bloc = creer('div', { classe: 'w-assistant' });
  var noms = b.mode === 'creation' ? ETAPES : ETAPES.slice(1);
  var rang = b.mode === 'creation' ? b.etape : b.etape - 1;
  var aller = function (r) {
    var cible = b.mode === 'creation' ? r : r + 1;
    if (cible === b.etape) { return null; }
    if (b.mode === 'creation' && cible === 1) { return function () { return quitterVersDepart(); }; }
    if (b.mode === 'creation' && cible > b.etapeMax + 1) { return null; }
    return function () { return allerEtape(cible); };
  };
  var finale = b.etape === 6 ? { libelle: b.mode === 'creation' ? 'Create my document' : 'Save changes', action: enregistrerBrouillon, id: 'pCreerHaut' } : null;
  var cote = creer('div', { classe: 'w-tete-assistant__etat' });
  if (b.mode === 'edition') {
    cote.appendChild(creer('p', { classe: 'w-mention', texte: 'Editing "' + (b.name || '') + '"' }));
    cote.appendChild(creer('p', { classe: 'w-mention w-statut', id: 'pStatut', attrs: { role: 'status' }, texte: modifie(b) ? 'Unsaved changes' : 'No changes yet' }));
    cote.appendChild(creer('div', { classe: 'w-liens' }, [
      bouton('Cancel', 'tertiaire', 'close-line', function () { return quitterEdition(true); }, { petit: true, id: 'pAnnulerEdition' }),
      finale ? null : bouton('Save changes', null, 'check-line', enregistrerBrouillon, { petit: true, id: 'pEnregistrer' })]));
  } else {
    cote.appendChild(bouton('Cancel creation', 'tertiaire', 'close-line', quitterAssistant, { petit: true, id: 'pAnnuler' }));
  }
  bloc.appendChild(creer('div', { classe: 'w-tete-assistant' }, [stepper(rang, noms, aller, finale), cote]));
  if (b.origine && b.etape === 2) {
    bloc.appendChild(alerte('info', null, 'Prefilled from ' + b.origine + '. Everything can still be changed, step by step.'));
  }
  if (b.etape === 2) { bloc.appendChild(etapeTable()); }
  if (b.etape === 3) { bloc.appendChild(etapeMiseEnPage()); }
  if (b.etape === 4) { bloc.appendChild(etapeContenu()); }
  if (b.etape === 5) { bloc.appendChild(etapePage()); }
  if (b.etape === 6) { bloc.appendChild(etapeVerifier()); }
  bloc.appendChild(barreNav(b));
  zone.appendChild(bloc);
  setTimeout(function () {
    if (document.getElementById('pApercuB')) { rendreApercuBrouillon(); }
    if (b.etape === 3) { dessinerVignettesEnAttente(); }
  }, 0);
}

function barreNav(b) {
  var premier = b.mode === 'creation' ? 1 : 2;
  var items = [];
  if (b.mode === 'edition') { items.push(bouton('Delete this document', 'danger', 'delete-bin-line', supprimerDocument, { id: 'pSupprimer', classe: 'w-pousse' })); }

/* --- Saving --- */
async function envoyerLogo(f, urlApercu) {
  var j = await obtenirJeton(true);
  var fd = new FormData();
  fd.append('upload', f, f.name);
  var rep = await fetchDelai(j.baseUrl + '/attachments?auth=' + encodeURIComponent(j.token),
    { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' }, body: fd }, 120000);
  if (!rep.ok) { throw new Error('Response ' + rep.status); }
  var ids = await rep.json();
  if (!Array.isArray(ids) || !ids.length || typeof ids[0] !== 'number') { throw new Error('Unexpected upload response'); }
  await chargerMetaPJ();
  if (urlApercu) { var pr = Promise.resolve(urlApercu); pr.url = urlApercu; etat.blobs[ids[0]] = pr; }
  return ids[0];
}

async function enregistrerBrouillon() {
  var b = etat.brouillon;
  if (!b) { return; }
  for (var n = 2; n <= 4; n++) { if (!validerEtapeSilencieuse(n)) { await allerEtape(n); validerEtape(n); return; } }
  var creation = b.mode === 'creation';
  afficherLoader(creation ? 'Creating your document…' : 'Saving…');
  try {
    await chargerMeta();
    if (!trouverTable(ID_BIBLIO)) {
      var t = await creerTables([{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }]);
      await finaliserBibliotheque(t[0]);
    } else {
      await assurerBibliotheque();
    }
    await chargerMeta();
    if (b.logoFichier) {
      try { b.logo = await envoyerLogo(b.logoFichier, b.logoUrl); b.logoFichier = null; }
      catch (e) { masquerLoader(); afficherErreur('The logo could not be uploaded. Remove it in Page setup or try again; nothing was saved.', e); return; }
    }
    var cfg = JSON.parse(JSON.stringify(cfgBrouillon(b)));
    cfg.name = String(cfg.name || '').trim();
    var r = await ecrireConfig(cfg, creation ? null : b.ligne, creation ? null : b.cle);
    memoriserTableau(r.cle);
    etat.brouillon = null;
    if (creation) { reinitialiserVue(); }
    await chargerTout();
    masquerLoader();
    afficherSucces(creation ? 'Your document "' + cfg.name + '" is ready. Saved.' : 'Saved.');
    annoncer(creation ? 'Document created and saved.' : 'Changes saved.');
  } catch (e) {
    masquerLoader();
    afficherErreur(creation ? 'The document could not be created. Nothing was deleted: you can try again.' : 'The changes could not be saved. You can try again.', e);
  }
}

function validerEtapeSilencieuse(n) {
  var b = etat.brouillon;
  if (n === 2) { return !!b.table && !!etat.meta.tables[b.table] && !!String(b.name || '').trim(); }
  if (n === 4) { return (b.blocks || []).length > 0; }
  return true;

/* Abandoning a creation: confirmation once a step has been started; the
   tables of a template can then be deleted. */
async function abandonnerCreation() {
  var b = etat.brouillon;
  if (!b || b.mode !== 'creation') { return true; }
  var commence = b.etape > 1 || (b.creees && b.creees.length);
  if (commence && !(await confirmerAction('Abandon the new document?', 'Nothing has been saved. The choices made in these steps are not kept.', 'Abandon'))) { return false; }
  if (b.creees && b.creees.length) {
    await chargerMeta();
    var restantes = b.creees.filter(function (t) { return etat.meta.tables[t]; });
    if (restantes.length) {
      var suppr = await confirmerAction('Delete the tables created for this template?', 'The widget created ' + restantes.map(libelleTable).join(', ') + ' for this template. Delete them, with their rows, or keep them in your document.', 'Delete the tables', undefined, 'Keep them');
      if (suppr) {
        try {
          await agir(restantes.slice().reverse().map(function (t) { return ['RemoveTable', t]; }));
          afficherSucces('Tables deleted: ' + restantes.join(', ') + '.');
        } catch (e) { afficherErreur('The tables could not be deleted. You can delete them from Raw data in Grist.', e); }
      }
    }

  if (b.logoUrl) { try { URL.revokeObjectURL(b.logoUrl); } catch (e) { logSecurite('INFO', 'Preview URL not released', e); } }
  return true;
}

  if (b && b.logoUrl && b.logoFichier) { try { URL.revokeObjectURL(b.logoUrl); } catch (e) { logSecurite('INFO', 'Preview URL not released', e); } }

/* === SECTION : BLOCK EDITOR ===
   A controlled editor: the document is a list of blocks, each edited with
   ordinary form fields (no rich text area, no HTML). Texts use a small
   markup with field chips {Column}, inserted from a picker. Every change
   redraws the live preview. */
function typeBloc(t) { for (var i = 0; i < TYPES_BLOCS.length; i++) { if (TYPES_BLOCS[i].type === t) { return TYPES_BLOCS[i]; } } return TYPES_BLOCS[1]; }

function etapeContenu() {
  var b = etat.brouillon;
  b.ouverts = b.ouverts || {};
  var col = creer('div', { classe: 'w-editeur__col' }, [
    creer('p', { classe: 'w-texte w-mention', texte: 'Blocks are printed from top to bottom. Open a block to change it. Fields are written {Column}: each row gets its own values. Use the arrows to reorder.' }),
    listeBlocs(b.blocks, false),
    paletteBlocs(b.blocks, false, 'pPalette')]);
  return creer('div', { classe: 'w-deux' }, [col, panneauApercuBrouillon()]);
}

function changeBloc() { marquerTouche(); majApercuBrouillon(); }

function rafraichirBlocs(focusId) {
  var ancien = document.getElementById('pBlocs');
  if (!ancien) { redessinerEtape(focusId); return; }
  var b = etat.brouillon;
  ancien.parentNode.replaceChild(listeBlocs(b.blocks, false), ancien);
  var pal = document.getElementById('pPalette');
  if (pal) { pal.parentNode.replaceChild(paletteBlocs(b.blocks, false, 'pPalette'), pal); }
  var f = focusId ? document.getElementById(focusId) : null;
  if (f) { f.focus({ preventScroll: false }); }
  majApercuBrouillon();
}

function listeBlocs(liste, dedans) {
  var ul = creer('ul', { classe: 'w-blocs', id: dedans ? null : 'pBlocs', attrs: { 'aria-label': dedans ? 'Blocks of this column' : 'Blocks of the document' } });
  liste.forEach(function (bl, k) { ul.appendChild(carteBloc(liste, k, dedans)); });
  if (!liste.length) { ul.appendChild(creer('li', { classe: 'w-indice', texte: dedans ? 'Empty column.' : 'No block yet: add one below.' })); }
  return ul;
}

function resumeBloc(bl) {
  var b = etat.brouillon;
  var court = function (s) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > 70 ? s.slice(0, 67) + '…' : s; };
  switch (bl.type) {
    case 'heading': case 'paragraph': case 'footer': return court(bl.text) || 'Empty';
    case 'fields': return court((bl.items || []).map(function (it) { return it.label || libelleChemin(b.table, it.path); }).join(', ')) || 'No field';
    case 'image': return bl.source === 'logo' ? 'Document logo' : (bl.col ? 'Images from ' + libelleChemin(b.table, bl.col) : 'Choose a column');
    case 'items': return bl.table && etat.meta.tables[bl.table] ? 'Rows of ' + libelleTable(bl.table) : 'Choose the table of lines';
    case 'columns': return 'Left: ' + pluriel((bl.left || []).length, 'block') + ' · Right: ' + pluriel((bl.right || []).length, 'block');
    case 'signature': return court(bl.name) || 'Signature line';
    case 'divider': return { thin: 'Thin line', thick: 'Thick line', brand: 'Brand color line', short: 'Short centered line', band: 'Color band' }[bl.style] || 'Thin line';
    case 'spacer': return 'Size ' + (bl.size || 'M');
    case 'pagebreak': return 'Next block on a new page';
    default: return '';
  }
}

function carteBloc(liste, k, dedans) {
  var b = etat.brouillon;
  var bl = liste[k];
  var def = typeBloc(bl.type);
  var ouvert = !!b.ouverts[bl.id];
  var nom = def.nom + (resumeBloc(bl) ? ': ' + resumeBloc(bl) : '');
  var idCorps = 'pCorps' + bl.id;
  var resume = creer('span', { classe: 'w-bloc__resume', id: 'pResume' + bl.id, texte: resumeBloc(bl) });
  var titre = creer('button', { classe: 'w-bloc__titre', id: 'pBloc' + bl.id, attrs: { 'aria-expanded': ouvert ? 'true' : 'false', 'aria-controls': idCorps } }, [
    creer('span', { classe: 'w-bloc__ico ui-icon-' + def.icone, attrs: { 'aria-hidden': 'true' } }),
    creer('span', { classe: 'w-bloc__type', texte: def.nom }), resume,
    bl.cond && bl.cond.op ? creer('span', { classe: 'w-badge-cond' }, [badge('Conditional', 'warning')]) : null,
    creer('span', { classe: 'w-bloc__chevron ' + (ouvert ? 'ui-icon-arrow-up-s-line' : 'ui-icon-arrow-down-s-line'), attrs: { 'aria-hidden': 'true' } })]);
  titre.addEventListener('click', function () {
    if (b.ouverts[bl.id]) { delete b.ouverts[bl.id]; } else { b.ouverts[bl.id] = true; }
    rafraichirBlocs('pBloc' + bl.id);
  });
  var deplacer = function (sens) {
    var j = k + sens;
    if (j < 0 || j >= liste.length) { return; }
    var t = liste[k]; liste[k] = liste[j]; liste[j] = t;
    changeBloc();
    rafraichirBlocs((sens < 0 ? 'pHaut' : 'pBas') + bl.id);
    var f = document.getElementById((sens < 0 ? 'pHaut' : 'pBas') + bl.id);
    if (f && f.disabled) { var t2 = document.getElementById('pBloc' + bl.id); if (t2) { t2.focus(); } }
    annoncer(def.nom + ' moved to position ' + (j + 1) + ' of ' + liste.length + '.');
  };
  var actions = [
    bouton('Move up', 'discret', 'arrow-up-line', function () { deplacer(-1); }, { petit: true, iconeSeule: true, aria: 'Move up: ' + nom, desactive: k === 0, id: 'pHaut' + bl.id }),
    bouton('Move down', 'discret', 'arrow-down-line', function () { deplacer(1); }, { petit: true, iconeSeule: true, aria: 'Move down: ' + nom, desactive: k === liste.length - 1, id: 'pBas' + bl.id }),
    bl.type !== 'footer' ? bouton('Duplicate', 'discret', 'file-copy-line', function () {
      var copie = JSON.parse(JSON.stringify(bl));
      renouvelerIds(copie);
      liste.splice(k + 1, 0, copie);
      b.ouverts[copie.id] = true;
      changeBloc();
      rafraichirBlocs('pBloc' + copie.id);
      annoncer(def.nom + ' duplicated.');
    }, { petit: true, iconeSeule: true, aria: 'Duplicate: ' + nom, id: 'pDup' + bl.id }) : null,
    bouton('Delete', 'discret', 'delete-bin-line', async function () {
      var vide = (bl.type === 'columns' && !(bl.left || []).length && !(bl.right || []).length) || ['divider', 'spacer', 'pagebreak'].indexOf(bl.type) !== -1;
      if (!vide && !(await confirmerAction('Delete this block?', def.nom + ': ' + (resumeBloc(bl) || '') + '. You can still cancel the whole edit until you save.', 'Delete'))) { return; }
      liste.splice(k, 1);
      changeBloc();
      var suivant = liste[Math.min(k, liste.length - 1)];
      rafraichirBlocs(suivant ? 'pBloc' + suivant.id : null);
      annoncer(def.nom + ' deleted.');
    }, { petit: true, iconeSeule: true, aria: 'Delete: ' + nom, id: 'pSuppr' + bl.id })];
  var li = creer('li', { classe: 'w-bloc' + (ouvert ? ' w-bloc--ouvert' : ''), attrs: { 'data-id': bl.id } }, [
    creer('div', { classe: 'w-bloc__tete' }, [titre].concat(actions))]);
  if (ouvert) { li.appendChild(creer('div', { classe: 'w-bloc__corps', id: idCorps }, editeurBloc(bl, dedans))); }
  return li;
}

function renouvelerIds(bl) {
  bl.id = blocId();
  (bl.left || []).forEach(renouvelerIds);
  (bl.right || []).forEach(renouvelerIds);
}

function majResume(bl) {
  var r = document.getElementById('pResume' + bl.id);
  if (r) { r.textContent = resumeBloc(bl); }
}

/* --- Palette: add a block after the open one, or at the end --- */
function paletteBlocs(liste, dedans, id) {
  var b = etat.brouillon;
  var aPied = (b.blocks || []).some(function (x) { return x.type === 'footer'; });
  var types = TYPES_BLOCS.filter(function (t) { return !dedans || t.dedans; });
  if (b.layout === 'labels' && !dedans) { types = types.filter(function (t) { return ['items', 'pagebreak', 'footer'].indexOf(t.type) === -1; }); }
  var grille = creer('div', { classe: 'w-palette' + (dedans ? ' w-palette--petite' : '') });

    grille.appendChild(bouton(t.nom, 'secondaire', t.icone, function () { return ajouterBloc(liste, t.type); },
      { petit: true, aria: 'Add a block: ' + t.nom + (dedans ? ', in this column' : ''), desactive: t.type === 'footer' && aPied, id: id ? id + t.type : null }));

    !dedans && aPied ? creer('p', { classe: 'w-indice', texte: 'The document already has a footer: it is repeated at the bottom of each page.' }) : null]);

function nouveauBloc(type) {
  var b = etat.brouillon;
  var cols = colonnesUtiles(b.table);
  switch (type) {
    case 'heading': return B('heading', { level: 2, text: 'New heading', color: 'ink' });
    case 'paragraph': return B('paragraph', { text: 'Write your text here.' + (b.labelCol ? ' Fields like ' + F(b.labelCol) + ' are replaced by the values of each row.' : '') });
    case 'fields': return B('fields', { items: cols.filter(function (c) { return c.type !== 'Attachments'; }).slice(0, 4).map(function (c) { return { path: c.colId, label: c.label }; }), columns: 1, style: 'grid' });
    case 'image': return B('image', { source: 'logo', align: 'page' });
    case 'items':
      var ctx = contexteGeneration(b.table);
      return blocLignes(ctx, b.layout === 'packing' ? 'packing' : 'invoice', {}) || B('items', { table: null, ref: null, columns: [], totals: 'none', emptyText: 'No items.' });
    case 'columns': return B('columns', { ratio: '50', left: [B('paragraph', { text: 'Left column' })], right: [B('paragraph', { text: 'Right column' })] });
    case 'signature': return B('signature', { name: 'Your Name', caption: 'Your title', align: 'left' });

async function ajouterBloc(liste, type) {
  var b = etat.brouillon;
  var nb = nouveauBloc(type);
  var pos = liste.length;
  for (var k = liste.length - 1; k >= 0; k--) { if (b.ouverts[liste[k].id]) { pos = k + 1; break; } }
  if (type === 'footer') { pos = liste.length; }
  liste.splice(pos, 0, nb);
  b.ouverts[nb.id] = true;
  marquerTouche();
  if (type === 'items') { try { await assurerDonneesBrouillon(); } catch (e) { logSecurite('WARNING', 'Line items data', e); } }
  rafraichirBlocs('pBloc' + nb.id);
  /* Opening a nested block keeps its parent open. */

/* --- Form helpers of the editor --- */
function idEd(bl, cle) { return 'e' + bl.id + '_' + cle; }

function choixListe(bl, cle, libelle, options, aide, surChange) {
  var s = liste(idEd(bl, cle), options, bl[cle] === undefined || bl[cle] === null ? '' : bl[cle]);
  s.addEventListener('change', function () {
    var v = s.value;
    bl[cle] = /^-?\d+$/.test(v) && cle === 'level' ? Number(v) : v;

}

function segmentAlign(bl, cle, avecPage) {
  var opts = [{ v: 'left', nom: 'Left', ico: 'align-left' }, { v: 'center', nom: 'Center', ico: 'align-center' }, { v: 'right', nom: 'Right', ico: 'align-right' }];

  opts.forEach(function (o) {

    btn.addEventListener('click', function () {

/* Fields offered in the pickers: the columns of the table, then for each
   reference the columns of the referenced table (Client › Address). */
function optionsChamps(tid, speciaux) {
  var groupes = [];
  var cols = colonnesUtiles(tid);
  groupes.push({ nom: 'Fields of ' + libelleTable(tid), options: cols.map(function (c) { return { valeur: c.colId, libelle: c.label }; }) });
  cols.forEach(function (c) {
    if (String(c.type).indexOf('Ref:') !== 0 && String(c.type).indexOf('RefList:') !== 0) { return; }
    var cible = tableCibleRef(c.type);
    if (!etat.meta.tables[cible]) { return; }
    groupes.push({ nom: c.label + ' (from ' + libelleTable(cible) + ')', options: colonnesUtiles(cible).map(function (x) { return { valeur: c.colId + '.' + x.colId, libelle: c.label + ' › ' + x.label }; }) });
  });
  if (speciaux) { groupes.push({ nom: 'Other', options: [{ valeur: 'today', libelle: 'Today\'s date' }, { valeur: 'page', libelle: 'Page number' }, { valeur: 'pages', libelle: 'Number of pages' }] }); }
  return groupes;
}

function selectChamps(id, tid, valeur, speciaux, vide) {
  var s = creer('select', { classe: 'ui-select', id: id });
  if (vide) { s.appendChild(creer('option', { texte: vide, attrs: { value: '' } })); }
  var trouve = false;
  optionsChamps(tid, speciaux).forEach(function (g) {
    var og = creer('optgroup', { attrs: { label: g.nom } });
    g.options.forEach(function (o) {
      var opt = creer('option', { texte: o.libelle, attrs: { value: o.valeur } });
      if (o.valeur === valeur) { opt.selected = true; trouve = true; }
      og.appendChild(opt);
    });
    s.appendChild(og);
  });
  if (valeur && !trouve) {
    var manq = creer('option', { texte: valeur + ' (missing column)', attrs: { value: valeur } });
    manq.selected = true;
    s.insertBefore(manq, s.firstChild);
  }
  return s;
}

function insererDans(champ, texte, selection) {
  var d = typeof champ.selectionStart === 'number' ? champ.selectionStart : champ.value.length;
  var f = typeof champ.selectionEnd === 'number' ? champ.selectionEnd : d;
  champ.value = champ.value.slice(0, d) + texte + champ.value.slice(f);
  champ.focus();
  if (selection) { champ.setSelectionRange(d + selection[0], d + selection[1]); } else { champ.setSelectionRange(d + texte.length, d + texte.length); }
  champ.dispatchEvent(new Event('input'));
}

function entourer(champ, marque) {
  var d = typeof champ.selectionStart === 'number' ? champ.selectionStart : champ.value.length;
  var f = typeof champ.selectionEnd === 'number' ? champ.selectionEnd : d;
  var sel = champ.value.slice(d, f) || 'text';
  insererDans(champ, marque + sel + marque, [marque.length, marque.length + sel.length]);
}

/* Text input with its toolbar: bold, italic, underline, insert a field. */
function champTexteRiche(bl, cle, libelle, o) {
  o = o || {};
  var b = etat.brouillon;
  var tid = o.table || b.table;
  var id = idEd(bl, cle);
  var champ = o.multiligne === false ? saisie(id, bl[cle] || '', { indice: o.indice }) : saisie(id, bl[cle] || '', { multiligne: true, lignes: o.lignes || 3, indice: o.indice });
  champ.addEventListener('input', function () { bl[cle] = champ.value; majResume(bl); majAlerteChamps(); changeBloc(); });
  var picker = selectChamps(id + 'Champ', tid, '', o.speciaux !== false, 'Choose a field…');
  picker.setAttribute('aria-label', 'Field to insert in ' + libelle);
  var outils = creer('div', { classe: 'w-outils-texte', attrs: { role: 'toolbar', 'aria-label': 'Formatting of ' + libelle } }, [
    bouton('Bold', 'discret', 'bold', function () { entourer(champ, '**'); }, { petit: true, iconeSeule: true, aria: 'Bold', classe: 'w-infobulle w-infobulle--dessous-gauche', attrs: { 'data-infobulle': 'Bold: **text**' } }),
    bouton('Italic', 'discret', 'italic', function () { entourer(champ, '*'); }, { petit: true, iconeSeule: true, aria: 'Italic', classe: 'w-infobulle w-infobulle--dessous-gauche', attrs: { 'data-infobulle': 'Italic: *text*' } }),
    bouton('Underline', 'discret', 'underline', function () { entourer(champ, '__'); }, { petit: true, iconeSeule: true, aria: 'Underline', classe: 'w-infobulle w-infobulle--dessous-gauche', attrs: { 'data-infobulle': 'Underline: __text__' } }),
    creer('span', { classe: 'w-sep', attrs: { 'aria-hidden': 'true' } }),
    picker,
    bouton('Insert field', 'secondaire', 'add-line', function () {
      if (!picker.value) { picker.focus(); annoncer('Choose a field to insert first.'); return; }
      insererDans(champ, F(picker.value));
      annoncer('Field ' + libelleChemin(tid, picker.value) + ' inserted.');
    }, { petit: true, id: id + 'Inserer' })]);
  picker.addEventListener('keydown', function (e) { if (e.key === 'Enter' && picker.value) { e.preventDefault(); insererDans(champ, F(picker.value)); } });
  var alerteChamps = creer('p', { classe: 'w-alerte-champ ui-icon-error-warning-line', id: id + 'Alerte', attrs: { hidden: '' } });
  var majAlerteChamps = function () {
    var manquants = [];
    analyserTexte(champ.value).forEach(function (t) {
      if (t.t !== 'f') { return; }
      var lc = t.chemin.toLowerCase();
      if (lc !== 'today' && lc !== 'page' && lc !== 'pages' && !colonneChemin(tid, t.chemin)) { manquants.push('{' + t.chemin + '}'); }
    });
    alerteChamps.textContent = manquants.length ? 'Unknown field: ' + manquants.join(', ') + '. Check the column name.' : '';
    if (manquants.length) { alerteChamps.removeAttribute('hidden'); } else { alerteChamps.setAttribute('hidden', ''); }
  };
  majAlerteChamps();
  return creer('div', { classe: 'ui-input-group' }, [creer('label', { classe: 'ui-label', attrs: { 'for': id } }, [libelle, o.aide ? creer('span', { classe: 'ui-hint-text', texte: o.aide }) : null]),
    creer('div', { classe: 'ui-mt-1v' }, [outils]), champ, alerteChamps]);
}

var TAILLES = [{ valeur: 'S', libelle: 'Small' }, { valeur: 'M', libelle: 'Medium' }, { valeur: 'L', libelle: 'Large' }, { valeur: 'XL', libelle: 'Extra large' }];
var COULEURS_TEXTE = [{ valeur: 'ink', libelle: 'Dark' }, { valeur: 'brand', libelle: 'Brand color' }, { valeur: 'muted', libelle: 'Grey' }];

/* --- Block settings, by type --- */
function editeurBloc(bl, dedans) {
  var l = [];
  var b = etat.brouillon;
  switch (bl.type) {
    case 'heading':
      l.push(champTexteRiche(bl, 'text', 'Text', { lignes: 2 }));
      l.push(creer('div', { classe: 'w-ligne2' }, [
        choixListe(bl, 'level', 'Level', [{ valeur: 1, libelle: 'Title' }, { valeur: 2, libelle: 'Section title' }, { valeur: 3, libelle: 'Small title' }]),
        choixListe(bl, 'size', 'Size', TAILLES), choixListe(bl, 'color', 'Color', COULEURS_TEXTE)]));
      l.push(creer('div', { classe: 'w-ligne2' }, [segmentAlign(bl, 'align'), caseBloc(bl, 'spaced', 'Wide letter spacing')]));
      break;
    case 'paragraph':
      l.push(champTexteRiche(bl, 'text', 'Text', { lignes: 5, aide: 'A blank line starts a new paragraph. A line made only of empty fields is skipped. {Date field|long} gives a long date.' }));
      l.push(creer('div', { classe: 'w-ligne2' }, [choixListe(bl, 'size', 'Size', TAILLES.slice(0, 3)), choixListe(bl, 'color', 'Color', COULEURS_TEXTE), segmentAlign(bl, 'align')]));
      break;
    case 'fields': l = l.concat(editeurChamps(bl)); break;
    case 'image': l = l.concat(editeurImage(bl)); break;
    case 'items': l = l.concat(editeurLignes(bl)); break;
    case 'columns': l = l.concat(editeurColonnes(bl)); break;
    case 'signature':
      l.push(champTexteRiche(bl, 'name', 'Name under the line', { multiligne: false }));
      l.push(champTexteRiche(bl, 'caption', 'Caption', { multiligne: false }));
      var pjs = colonnesUtiles(b.table).filter(function (c) { return c.type === 'Attachments'; });
      l.push(creer('div', { classe: 'w-ligne2' }, [segmentAlign(bl, 'align'),
        pjs.length ? choixListe(bl, 'imageCol', 'Signature image (optional)', [{ valeur: '', libelle: 'None' }].concat(pjs.map(function (c) { return { valeur: c.colId, libelle: c.label }; }))) : null]));
      break;
    case 'divider':
      l.push(choixListe(bl, 'style', 'Style', [{ valeur: 'thin', libelle: 'Thin line' }, { valeur: 'thick', libelle: 'Thick line' }, { valeur: 'brand', libelle: 'Brand color line' },
        { valeur: 'short', libelle: 'Short centered line' }, { valeur: 'band', libelle: 'Color band' }]));
      break;
    case 'spacer': l.push(choixListe(bl, 'size', 'Height', TAILLES)); break;
    case 'pagebreak': l.push(creer('p', { classe: 'w-texte w-mention', texte: 'The next block starts on a new page. In "Print several", each document always starts on a new page.' })); break;
    case 'footer':

/* === SECTION : SMART COLUMN GUESSING ===
   Roles of the columns (name, number, date, client, address...) guessed
   from their name and type, English and French words. A guess is only a
   starting point: everything stays editable in the wizard. */
function motsDe(texte) { return ' ' + normalizer(texte).replace(/[^a-z0-9]+/g, ' ').trim() + ' '; }

function evoque(col, role) {
  var n = motsDe(col.label + ' ' + col.colId);
  return (INDICES[role] || []).some(function (m) { return n.indexOf(' ' + m + ' ') !== -1; });
}

function scoreRole(col, role) {
  var lab = motsDe(col.label);
  var tout = motsDe(col.label + ' ' + col.colId);
  var best = 0;
  (INDICES[role] || []).forEach(function (m, k) {
    var bonus = (role === 'nom' && k < 5) ? 0.5 : 0;
    if (lab === ' ' + m + ' ') { best = Math.max(best, 3 + bonus); }
    else if (tout.indexOf(' ' + m + ' ') !== -1) { best = Math.max(best, 2 + m.split(' ').length * 0.1 + bonus); }
  });
  return best;
}

function tableEvoque(tid, role) {
  var n = motsDe(libelleTable(tid) + ' ' + tid);
  return (INDICES[role] || []).some(function (m) { return n.indexOf(' ' + m + ' ') !== -1; });
}

var TYPES_ROLES = {
  texte: function (c) { return c.type === 'Text' || c.type === 'Any' || c.type === 'Choice'; },
  num: function (c) { return c.type === 'Numeric' || c.type === 'Int'; },
  date: function (c) { return c.type === 'Date' || String(c.type).indexOf('DateTime') === 0; },
  ref: function (c) { return c.type === 'Text' || c.type === 'Choice' || String(c.type).indexOf('Ref:') === 0; },
  marque: function (c) { return !c.formule && (c.type === 'Bool' || c.type === 'Date' || String(c.type).indexOf('DateTime') === 0); }
};
var ORDRE_ROLES = [
  ['numero', function (c) { return TYPES_ROLES.texte(c) || TYPES_ROLES.num(c); }], ['nom', TYPES_ROLES.texte], ['client', TYPES_ROLES.ref],
  ['date', TYPES_ROLES.date], ['echeance', TYPES_ROLES.date], ['achevement', TYPES_ROLES.date], ['expedition', TYPES_ROLES.date],
  ['email', TYPES_ROLES.texte], ['adresse', TYPES_ROLES.texte], ['telephone', TYPES_ROLES.texte], ['salutation', TYPES_ROLES.texte],
  ['societe', TYPES_ROLES.ref], ['fonction', TYPES_ROLES.texte], ['cours', TYPES_ROLES.ref], ['heures', TYPES_ROLES.num], ['formateur', TYPES_ROLES.ref],
  ['notes', TYPES_ROLES.texte], ['statut', TYPES_ROLES.texte], ['transporteur', TYPES_ROLES.texte], ['suivi', TYPES_ROLES.texte],
  ['designation', TYPES_ROLES.texte], ['quantite', TYPES_ROLES.num], ['prix', TYPES_ROLES.num], ['montant', TYPES_ROLES.num], ['sku', TYPES_ROLES.texte],
  ['imprime', TYPES_ROLES.marque]
];

function colonnesUtiles(tid) {
  return colonnesDe(tid).filter(function (c) { return IDS_META.indexOf(c.colId) === -1 && c.colId !== 'manualSort' && c.colId.indexOf('gristHelper_') !== 0; });
}

/* Roles of a table's columns. A column takes one role only, except the
   date of completion, which may also be the only date. */
function deviner(tid) {
  var cols = colonnesUtiles(tid);
  var pris = Object.create(null);
  var g = {};
  ORDRE_ROLES.forEach(function (r) {
    var role = r[0], typeOk = r[1];
    var meilleur = null, score = 0;
    cols.forEach(function (c) {
      if (pris[c.colId] || !typeOk(c)) { return; }
      var s = scoreRole(c, role);
      if (role === 'numero' && TYPES_ROLES.num(c) && s < 3) { s = 0; }
      if (role === 'nom' && c.type === 'Choice') { s = 0; }
      if (role === 'statut' && c.type === 'Choice') { s += 0.5; }
      if (s > score) { score = s; meilleur = c; }
    });
    if (meilleur && score >= 2) {
      g[role] = meilleur.colId;
      if (['designation', 'quantite', 'prix', 'montant', 'sku'].indexOf(role) === -1) { pris[meilleur.colId] = true; }
    }
  });
  if (!g.nom) {
    var t = cols.filter(function (c) { return c.type === 'Text' && !pris[c.colId]; })[0] || cols.filter(function (c) { return c.type === 'Text'; })[0];
    if (t) { g.nom = t.colId; }
  }
  if (!g.designation) {
    var d = cols.filter(function (c) { return c.type === 'Text'; })[0];
    if (d) { g.designation = d.colId; }
  }
  if (!g.achevement && g.date) { g.achevement = g.date; }
  /* A text column "Company" is both the client of an invoice and the
     company of a person. */
  if (!g.societe && g.client) {
    var cc = infoColonne(tid, g.client);
    if (cc && String(cc.type).indexOf('Ref:') !== 0 && evoque(cc, 'societe')) { g.societe = g.client; }
  }
  return g;
}

/* Tables of the document a document can be built from. */
function tablesConnectables() {
  return Object.keys(etat.meta.tables).filter(function (tid) {
    var t = etat.meta.tables[tid];
    return !estTableExclue(tid) && !t.resume && !t.virtuelle && tid.toUpperCase().indexOf(ID_BIBLIO) === -1;
  }).sort(function (x, y) { return libelleTable(x).localeCompare(libelleTable(y), localeFormat()); });

function modeleParId(id) { for (var i = 0; i < MODELES.length; i++) { if (MODELES[i].id === id) { return MODELES[i]; } } return null; }

function valeurExemple(v, ids) {
  if (v && typeof v === 'object' && v.jours !== undefined) { return aujourdhuiDoc() + v.jours * 86400; }
  if (v && typeof v === 'object' && v.ref) { var l = ids[v.ref[0]] || []; return l.length ? l[v.ref[1] % l.length] : 0; }
  return v;
}

function typeResolu(type, tids) { return String(type).replace(/^(Ref|RefList):@(\w+)$/, function (_, k, cle) { return k + ':' + tids[cle]; }); }

/* An earlier table with the same name and the same columns (created by a
   previous template) is reused instead of creating Clients2. */
function tableReutilisable(def) {
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) {
    if (ids[i].toUpperCase() !== def.id.toUpperCase()) { continue; }
    var ok = def.colonnes.every(function (c) { var x = infoColonne(ids[i], c.id); return x && x.type === c.type; });
    if (ok) { return ids[i]; }
  }
  return null;
}

/* Creates the tables of a template, in a single call, then formulas,
   display columns of references and sample rows. */
async function creerTablesModele(m, avecExemples) {
  await chargerMeta();
  var tids = {};
  var reserves = [];
  var reutilisees = {};
  m.tables.forEach(function (t) {
    var ex = t.reutiliser ? tableReutilisable(t) : null;
    if (ex) { tids[t.cle] = ex; reutilisees[t.cle] = true; return; }
    var id = idTableLibre(t.id, reserves);
    reserves.push(id);
    tids[t.cle] = id;
  });
  var defs = [];
  m.tables.forEach(function (t) {
    if (reutilisees[t.cle]) { return; }
    defs.push({ cle: t.cle, id: tids[t.cle], garderPage: true, colonnes: t.colonnes.map(function (c) {
      return { id: c.id, label: c.label || c.id.replace(/_/g, ' '), type: typeResolu(c.type, tids), formula: c.formula, isFormula: !!c.formula, widgetOptions: c.options || null };
    }) });
  });
  var crees = defs.length ? await creerTables(defs) : [];
  defs.forEach(function (d, k) { tids[d.cle] = crees[k]; });
  await chargerMeta();
  /* Display column of each reference, so that Grist and the documents show
     the name of the client rather than a row number. */
  var affichages = [];
  m.tables.forEach(function (t) {
    if (reutilisees[t.cle]) { return; }
    t.colonnes.forEach(function (c) {
      if (!c.affichage) { return; }
      var cible = tableCibleRef(typeResolu(c.type, tids));
      var colCible = infoColonne(cible, c.affichage);
      var colRef = infoColonne(tids[t.cle], c.id);
      if (colCible && colRef) {
        affichages.push(['ModifyColumn', tids[t.cle], c.id, { visibleCol: colCible.ref }]);
        affichages.push(['SetDisplayFormula', tids[t.cle], null, colRef.ref, '$' + c.id + '.' + c.affichage]);
      }
    });
  });
  if (affichages.length) {
    try { await agir(affichages); } catch (e) { logSecurite('WARNING', 'Display columns of references not set', e); }
  }
  if (avecExemples) {
    var ids = {};
    for (var k = 0; k < m.tables.length; k++) {
      var t = m.tables[k];
      var tid = tids[t.cle];
      if (reutilisees[t.cle]) {
        var d = await lireTable(tid);
        if (d.id.length) { ids[t.cle] = d.id.slice(); continue; }
      }
      var cols = t.colonnes.filter(function (c) { return !c.formula; }).map(function (c) { return c.id; });
      var valeurs = {};
      cols.forEach(function (c) { valeurs[c] = t.lignes.map(function (l) { return valeurExemple(l[c] === undefined ? null : l[c], ids); }); });
      var ret = await agir([['BulkAddRecord', tid, t.lignes.map(function () { return null; }), valeurs]]);
      ids[t.cle] = ret && ret.retValues && Array.isArray(ret.retValues[0]) ? ret.retValues[0] : [];
    }
  }
  await chargerMeta();
  return { tids: tids, principale: tids[m.principale], creees: defs.map(function (d) { return tids[d.cle]; }) };
}

/* Thumbnails of the templates before anything is created: their tables
   and sample rows are registered in memory only, under names no real
   table can have, and drawn with the same generators. */
function enregistrerModeleVirtuel(m) {
  var prefixe = '§' + m.id + '_';
  var tids = {};
  m.tables.forEach(function (t) { tids[t.cle] = prefixe + t.id; });
  var refSeq = 800000;
  m.tables.forEach(function (t) {
    var tid = tids[t.cle];
    etat.meta.tables[tid] = { ref: ++refSeq, tableId: tid, libelle: t.id.replace(/_/g, ' '), virtuelle: true, resume: false };
    etat.meta.colonnes[tid] = t.colonnes.map(function (c, k) {
      var info = { ref: ++refSeq, tableId: tid, colId: c.id, type: typeResolu(c.type, tids), label: c.label || c.id.replace(/_/g, ' '),
        formule: !!c.formula, formula: c.formula || '', options: c.options || {}, visibleCol: 0, pos: k };
      etat.meta.colParRef[info.ref] = info;
      return info;
    });
  });
  m.tables.forEach(function (t) {
    t.colonnes.forEach(function (c) {
      if (!c.affichage) { return; }
      var col = infoColonne(tids[t.cle], c.id);
      var cible = infoColonne(tableCibleRef(col.type), c.affichage);
      if (col && cible) { col.visibleCol = cible.ref; }
    });
  });
  var ids = {};
  m.tables.forEach(function (t) {
    var tid = tids[t.cle];
    var d = { id: [], manualSort: [] };
    t.colonnes.forEach(function (c) { d[c.id] = []; });
    t.lignes.forEach(function (l, n) {
      d.id.push(n + 1); d.manualSort.push(n + 1);
      t.colonnes.forEach(function (c) {
        var v = valeurExemple(l[c.id] === undefined ? null : l[c.id], ids);
        var f = /^\$(\w+) \* \$(\w+)$/.exec(c.formula || '');
        if (f) { v = (Number(l[f[1]]) || 0) * (Number(l[f[2]]) || 0); }
        d[c.id].push(v);
      });
    });
    ids[t.cle] = d.id.slice();
    var idx = {};
    d.id.forEach(function (id, i) { idx[id] = i; });
    etat.donnees[tid] = { d: d, idx: idx };
  });
  return { principale: tids[m.principale], tids: tids };
}

/* === SECTION : SUGGESTIONS FROM EXISTING TABLES ===
   For each table: a table of lines referencing it, with numbers, gives an
   invoice style document (a quote if the table is about quotes, a packing
   slip without prices); person-like columns give a letter, a certificate
   or badges; otherwise a record sheet. The best ones first. */
function suggestions() {
  var res = [];
  var tables = tablesConnectables();
  tables.forEach(function (tid) {
    var g = deviner(tid);
    var enf = tablesEnfants(tid).filter(function (e) { return tables.indexOf(e.table) !== -1; });
    var deja = etat.tableaux.some(function (t) { return t.config.table === tid; }) ? -6 : 0;
    var nb = res.length;
    if (enf.length && enf[0].nbNum > 0) {
      var e = enf[0];
      var ge = deviner(e.table);
      var avecPrix = !!(ge.prix || ge.montant);
      var kind = !avecPrix ? 'packing' : (tableEvoque(tid, 'devis') ? 'quote' : 'invoice');
      res.push({ tid: tid, layout: kind, enfant: e, score: 12 + deja, raison: 'Line items from ' + libelleTable(e.table) });
    }
    var personne = !!g.nom && !!(g.email || g.adresse || g.societe || g.salutation || g.fonction);
    if (g.nom && (g.cours || g.heures || g.formateur || (g.achevement && tableEvoque(tid, 'evenement')))) {
      res.push({ tid: tid, layout: 'certificate', score: 9 + deja, raison: 'People with ' + sansVides([g.cours ? 'a course' : null, g.achevement ? 'a date' : null, g.heures ? 'hours' : null]).join(', ') });
    }
    if (personne && (g.adresse || g.salutation)) {
      res.push({ tid: tid, layout: 'letter', score: 8 + deja, raison: 'People with ' + sansVides([g.adresse ? 'an address' : null, g.salutation ? 'a salutation' : null, g.societe ? 'a company' : null]).join(', ') });
    }
    if (g.nom && (tableEvoque(tid, 'evenement') || (g.societe && g.fonction && !g.adresse))) {
      res.push({ tid: tid, layout: 'labels', score: 7 + deja, raison: 'People with ' + sansVides([g.societe ? 'a company' : null, g.fonction ? 'a role' : null]).join(' and ') + ': badges' });
    }
    var estDesLignes = tableEvoque(tid, 'lignes') && colonnesDe(tid).some(function (c) { return tableCibleRef(c.type) && tables.indexOf(tableCibleRef(c.type)) !== -1; });
    if (res.length === nb && !estDesLignes) {
      res.push({ tid: tid, layout: 'record', score: 3 + deja, raison: pluriel(colonnesUtiles(tid).length, 'field') + ', one page per row' });
    }
  });
  return res.sort(function (a, b) { return b.score - a.score; }).slice(0, 6);
}

/* === SECTION : LOADING AND REFRESH ===
   Loading is read-only. The document view is redrawn only when the data
   has changed; the person's view (row, selection, zoom, scroll) is kept. */
async function chargerTout() {
  await chargerMeta();
  etat.biblio = trouverTable(ID_BIBLIO);
  await lireTableaux();
  await determinerDroits();
  choisirTableau();
  if (!etat.config) {
    if (!etat.peutParametrer) { afficherVue('aucun'); return; }
    if (!enCreation()) { demarrerCreation(); }
    return;
  }
  if (!verifierConfig(etat.config)) { afficherVue('invalide'); return; }
  await chargerDonnees(etat.config);
  etat.empreinte = empreinteDonnees();
  afficherVue('document');
}

async function rafraichirMaintenant(silencieux) {
  if (etat.vue !== 'document' || etat.impressionEnCours) { return; }
  try {
    if (Date.now() - etat.metaLueA > DELAI_RELECTURE_META_MS || !silencieux) {
      await chargerMeta();
      if (!verifierConfig(etat.config)) { afficherVue('invalide'); return; }
    }
    await chargerDonnees(etat.config);
    var e = empreinteDonnees();
    etat.rafraichirEnAttente = false;
    if (silencieux && e === etat.empreinte) { return; }
    etat.empreinte = e;
    if (etat.vue !== 'document' || etat.modaleOuverte) { etat.rafraichirEnAttente = true; return; }
    var actif = document.activeElement;
    var idActif = actif && actif.id ? actif.id : null;
    var ap = document.getElementById('pApercu');
    var haut = ap ? ap.scrollTop : 0;
    var liste = document.getElementById('pListe');
    var hautListe = liste ? liste.parentNode.scrollTop : 0;
    var volet = document.getElementById('pVolet');
    if (volet) { remplirVolet(volet); }
    majListe();
    rendreApercuPrincipal();
    var info = document.getElementById('pInfo');
    if (info && info.lastChild && etat.mode === 'un') { info.lastChild.textContent = libelleTable(etat.config.table) + ' · ' + pluriel(toutesLignes().length, 'row'); }
    if (ap) { ap.scrollTop = haut; }
    if (liste && document.getElementById('pListe')) { document.getElementById('pListe').parentNode.scrollTop = hautListe; }
    if (idActif && document.getElementById(idActif)) { document.getElementById(idActif).focus({ preventScroll: true }); }
  } catch (e) {
    if (silencieux) { logSecurite('WARNING', 'Automatic re-read failed', e); }
    else { afficherErreur('The documents could not be refreshed.', e); }
  }
}

function demarrerActualisationAuto() {
  if (_minuterieActualisation) { clearInterval(_minuterieActualisation); }
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState !== 'visible' || etat.vue !== 'document' || etat.modaleOuverte || etat.impressionEnCours) { return; }
    relayer(rafraichirMaintenant(true), 'Automatic re-read');
  }, DELAI_ACTUALISATION_MS);
}

function planifierRafraichissement() {
  if (etat.vue !== 'document') { return; }
  if (etat.modaleOuverte) { etat.rafraichirEnAttente = true; return; }
  if (etat.minuterieRafraichir) { clearTimeout(etat.minuterieRafraichir); }
  etat.minuterieRafraichir = setTimeout(function () {
    etat.minuterieRafraichir = null;
    relayer(rafraichirMaintenant(true), 'Refresh');
  }, 400);
}

async function detecterTableLiee() {
  try {
    etat.tableLiee = await gristAvecTimeout(grist.selectedTable.getTableId(), 5000);
  } catch (e) {
    etat.tableLiee = null;
    logSecurite('INFO', 'Table linked to the view could not be determined', e);
  }
}

async function initialiser() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Loading the documents…');
  try {
    await detecterTableLiee();
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { logSecurite('INFO', 'Document name not read', e); }
    etat.tableauMemorise = lireStockage('last');
    var z = lireStockage('zoom');
    etat.zoom = z && z !== 'fit' && Number(z) > 0 ? Number(z) : 'fit';
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERROR', 'Initialisation', e);
    afficherErreur('Loading failed.');
    afficherVue('echec');
  } finally {
    etat.initEnCours = false;
  }
}

/* When the widget is linked to a table ("Select widget" / "SELECT BY" in
   Grist), onRecords gives the rows shown by the linked view, filters
   included, in its order; onRecord gives the selected row. */
async function suivreLiaison() {
  var avant = etat.tableLiee;
  await detecterTableLiee();
  return avant !== etat.tableLiee;
}

grist.onRecords(function (records) {
  etat.idsVisibles = (records || []).map(function (r) { return r.id; });
  relayer(suivreLiaison().then(function (change) {
    if (etat.vue !== 'document') { return; }
    if (change) { var v = document.getElementById('pVolet'); if (v) { remplirVolet(v); } }
    if (etat.mode === 'plusieurs' && etat.sourceLot === 'vue') { majListe(); rendreApercuPrincipal(); }
    planifierRafraichissement();
  }), 'Tracking the view link');
});

if (typeof grist.onRecord === 'function') {
  grist.onRecord(function (record) {
    if (!record || typeof record.id !== 'number') { return; }
    etat.idCurseur = record.id;
    if (etat.vue === 'document' && etat.mode === 'un' && etat.suivreCurseur && estLieeAuModele()) {
      majListe();
      rendreApercuPrincipal();
    }
  });
}

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) {
    logSecurite('ERROR', 'Unhandled rejected promise', evt ? evt.reason : undefined);
  });
}, 1500);

relayer(initialiser(), 'Initialisation');
demarrerActualisationAuto();
