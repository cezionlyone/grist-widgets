<!DOCTYPE html>
<!--
  ============================================================================
  READ ME - Gristprint
  ============================================================================
  Version     : 1.0.0
  Date        : 2026-10-29
  Author      : madeXcé
  License     : MIT
  Platform    : Grist (custom widget)
  Compliance  : WCAG 2.1 AA | OWASP
  ============================================================================

  DESCRIPTION
  -----------
  Gristprint: printable documents from your Grist rows, without writing
  HTML. Invoices, quotes, packing slips, letters, certificates, record
  sheets and badges: pick a template, place your fields, print or save as
  PDF with the browser's own print dialog (real, selectable vector text).

  One widget hosts all the document templates of a Grist document, shown
  as tabs; the last tab, "New document", creates another one. A template is
  tied to one table; several templates can use the same table.

  Creation is guided by a step bar: starting point, table and sample row,
  layout, content, page setup, review. Nothing is written to the document
  before "Create my document", except the tables of a ready-made template,
  created after a confirmation and offered for deletion if the creation is
  abandoned.
  Two ways to start:
  - I don't have any data yet: seven ready-made templates (Invoice, Quote,
    Packing slip, Letter, Certificate of completion, Record sheet, Badges),
    which create their tables, with columns, choice lists and sample rows;
  - I already have data: documents suggested from the document's tables
    (a table referenced by a table of lines with numbers gives an invoice
    style document; person-like columns give a letter, a certificate or
    badges; otherwise a record sheet), or any table of your choice, with
    smart column guessing (English and French column names).

  A template is a list of blocks stored as JSON, never as HTML: heading,
  paragraph (with fields, bold, italic, underline, alignment, size), field
  list, image (document logo or attachments column), line items (rows of
  another table that reference this row, with totals, tax and grand total),
  two columns, signature, divider, spacer, page break, footer (with page
  numbers). Any block can be shown only if a field is filled, empty, equal
  to a value or checked. Pages are built element by element with
  createElement and textContent.

  Day to day:
  - current row: follows the row selected in Grist when the widget is
    linked to the table, otherwise a searchable row list;
  - print several: rows picked with checkboxes (search, filter by a column
    value, "not printed yet"), or exactly the rows shown in the linked
    Grist view; one document per row, each starting on a new page, in ONE
    print job; option "Print one by one" (one print dialog per row, for one
    PDF per row);
  - WYSIWYG page preview at real proportions, with zoom;
  - optional write-back after printing (editors only, off by default):
    tick a yes/no column or set a date column for the printed rows, after
    a confirmation;
  - automatic refresh when the document changes.

  HISTORY
  -------
  1.0.0 - 2026-10-29 - madeXcé - First public version.

  DEPENDENCIES
  ------------
  - Styling: self-contained madeXcé theme (Palm Springs palette on a
    Grist-like base; ui-* classes and design tokens on :root), no external
    stylesheet or web font.
  - Icons: Remix Icon (https://remixicon.com), embedded as SVG masks.
  - Grist Plugin API (grist-plugin-api.js), loaded from docs.getgrist.com:
    origin required by the platform, unversioned URL, so not covered by an
    SRI hash.
  No other library: no PDF library, no canvas capture. Printing uses the
  browser's native print, so "Save as PDF" keeps vector text, tables and
  images sharp and searchable.

  WHAT THE WIDGET WRITES IN THE DOCUMENT
  --------------------------------------
  🖨️ PRINT LIBRARY ⚡ (PRINT_LIBRARY_ after renaming): technical settings
  table, created with the first document template. One row per template
  (KEY = CONFIG:<identifier>, VALUE = the template as JSON, FILES = the
  logo uploaded in Page setup, so the platform keeps the file), plus two
  access marker rows (KEY = EDIT_ACCESS and SETTINGS_ACCESS). Columns KEY,
  VALUE, FILES, VERSION_CREATED, VERSION_UPDATED and the four metadata
  columns CREATED_AT, CREATED_BY, UPDATED_AT, UPDATED_BY (trigger
  formulas, filled by the platform). Its page is removed right after
  creation. Excluded from table lists by estTableExclue().
  Ready-made templates only: their data tables (for example Clients,
  Invoices and Invoice lines), with columns, choice lists, a calculated
  line total and optional sample rows. Their pages are kept: that is where
  you fill them in.
  Your own tables are read only. The single exception is the optional
  write-back after printing, into the yes/no or date column you choose.
  No column is ever created, retyped or deleted in your tables.

  FORMATS
  -------
  Dates, numbers and currency follow the document settings (locale,
  currency, time zone); each column keeps its own Grist format (date
  format, number of decimals, currency, percentage). English words with the
  conventions of the document's country. Default paper size: US Letter in
  the United States, Canada and Mexico, A4 elsewhere.

  REQUIRED RIGHTS
  ---------------
  Full access to the document. Viewers see and print the documents;
  editors also use the "mark as printed" write-back; owners create, edit
  and delete document templates once the access rules are in place.

  SECURITY
  --------
  - No dynamic code execution, no access to the parent frame, no inline
    event handler; no data or template text is ever inserted as HTML: the
    DOM is built with createElement and textContent. The template markup
    (**bold**, *italic*, __underline__, {Field}) is parsed by the widget
    itself into text nodes; field values are never parsed.
    echapperHTML() is part of the shared base and remains available, with
    no call in this version.
  - The @page rule is written from validated values only (paper sizes from
    a fixed list); the brand color is checked against #rrggbb.
  - Images: only raster images (png, jpg, gif, webp, bmp), fetched as Blobs;
    the access token appears in no link on the page. Logo upload limited to
    5 MB and to those image types.
  - Logging via logSecurite(), neutral error messages.

  ACCESS TOKEN IN REST CALLS
  --------------------------
  Downloading attachments passes the access token as a URL parameter of
  the fetch call (the Authorization header requires a preflight that the
  server refuses from the widget frame). The token is requested at the time
  of the call, limited to the current document, renewed before expiry,
  never stored outside the page's memory and never logged.

  ACCESSIBILITY
  -------------
  Tabs, step bar, block editor and row list usable with the keyboard;
  visible focus; saves and state changes announced to screen readers; the
  page preview is real text (not an image); color never the only carrier of
  information; prefers-reduced-motion respected.

  THEME
  -----
  The widget stays in the light theme, for consistency with the printed
  page it shows.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gristprint</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style id="pPageStyle">@page { size: auto; margin: 0; }</style>
  <style>
  /* === SECTION : DESIGN TOKENS AND BASE COMPONENTS ===
     Self-contained neutral theme: no external stylesheet, no web font.
     The ui-* classes cover only the components this widget uses.
     [EDITABLE] colors below (keep text contrast at 4.5:1 or more). */
    :root {
      /* Base, in the spirit of Grist's own interface */
      --background-default-grey: #ffffff; --background-default-grey-hover: #f2f2f5; --background-alt-grey: #f7f7f9;
      --background-contrast-grey: #efeff3; --text-default-grey: #262633; --text-title-grey: #262633; --text-mention-grey: #6b6b7b;
      --text-inverted-grey: #ffffff; --border-default-grey: #d9d9e0; --border-plain-grey: #9d9dab;
      /* madeXcé signature, Palm Springs: turquoise for every action */
      --text-title-primary: #0e7490; --text-action-high-primary: #0e7490; --text-active-primary: #0b5a70; --text-inverted-primary: #ffffff;
      --background-action-high-primary: #0e7490; --background-action-high-primary-hover: #0b5a70; --background-action-low-primary: #e0f4f8;
      --background-alt-primary: #f0fafc; --background-active-primary: #0e7490; --border-action-high-primary: #0e7490; --border-active-primary: #0e7490;
      --background-alt-accent: #fff8e1;
      /* Accents: flamingo (logo X, urgent) and lemon (small highlights only, never text) */
      --text-label-accent-pink: #d6336c; --accent-flamingo: #d6336c; --accent-lemon: #ffc93c;
      --text-default-error: #c9191e; --border-plain-error: #c9191e; --background-contrast-error: #fdecec;
      --text-default-warning: #b34000; --border-plain-warning: #b34000; --background-contrast-warning: #fff1e6;
      /* Success: a darker Grist green, readable on white */
      --text-default-success: #12805c; --text-inverted-success: #ffffff; --background-flat-success: #12805c;
      --focus-ring: #0e7490;
      --radius-control: 6px; --radius-card: 10px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html { font-family: var(--font-ui); line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .ui-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .ui-h4 { font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: var(--text-title-grey); margin: 0 0 1rem; }
    .ui-h6 { font-size: 1.125rem; line-height: 1.5rem; font-weight: 700; color: var(--text-title-grey); margin: 0 0 .75rem; }
    .ui-text--regular { font-weight: 400; }
    .ui-mt-1v { margin-top: .25rem !important; } .ui-mt-1w { margin-top: .5rem !important; } .ui-mt-2w { margin-top: 1rem !important; }
    .ui-mt-3w { margin-top: 1.5rem !important; } .ui-mb-0 { margin-bottom: 0 !important; } .ui-mb-1w { margin-bottom: .5rem !important; }

    /* Buttons */
    .ui-btn { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.5rem; padding: .5rem 1rem; border: 0; border-radius: var(--radius-control);
      background: var(--background-action-high-primary); color: var(--text-inverted-primary); font-size: 1rem; font-weight: 500; line-height: 1.5rem;
      cursor: pointer; text-align: left; text-decoration: none; }
    .ui-btn:hover { background: var(--background-action-high-primary-hover); }
    .ui-btn--sm { min-height: 2rem; padding: .25rem .75rem; font-size: .875rem; line-height: 1.5rem; }
    .ui-btn--secondary { background: var(--background-default-grey); color: var(--text-action-high-primary); box-shadow: inset 0 0 0 1px var(--border-default-grey); font-weight: 600; }
    .ui-btn--tertiary { background: var(--background-default-grey); color: var(--text-action-high-primary); box-shadow: inset 0 0 0 1px var(--border-default-grey); }
    .ui-btn--tertiary-no-outline { background: transparent; color: var(--text-action-high-primary); }
    .ui-btn--secondary:hover, .ui-btn--tertiary:hover, .ui-btn--tertiary-no-outline:hover { background: var(--background-default-grey-hover); }
    .ui-btn:disabled, .ui-btn[disabled] { background: #e5e5e5; color: #757575; box-shadow: none; cursor: not-allowed; }
    .ui-btn--secondary:disabled, .ui-btn--tertiary:disabled, .ui-btn--tertiary-no-outline:disabled { background: transparent; color: #929292; box-shadow: inset 0 0 0 1px #e5e5e5; }
    .ui-btn--icon-only { justify-content: center; width: 2.5rem; padding: 0; }
    .ui-btn--icon-only.ui-btn--sm { width: 2rem; }
    .ui-btn--icon-right { flex-direction: row-reverse; }

    /* Icons (Remix Icon, drawn as masks in the current text color) */
    [class*="ui-icon-"]::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.5rem; height: 1.5rem; vertical-align: -.375rem;
      background-color: currentColor; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .ui-btn[class*="ui-icon-"]::before, .ui-icon--sm::before { width: 1rem; height: 1rem; vertical-align: -.125rem; }
    .ui-btn:not(.ui-btn--sm)[class*="ui-icon-"]::before { width: 1.25rem; height: 1.25rem; }

    /* Form fields */
    .ui-label { display: block; color: var(--text-title-grey); font-size: 1rem; line-height: 1.5rem; }
    .ui-hint-text { display: block; color: var(--text-mention-grey); font-size: .75rem; line-height: 1.25rem; font-weight: 400; }
    .ui-input-group { margin-bottom: 1rem; }
    .ui-input, .ui-select { display: block; width: 100%; margin-top: .375rem; padding: .375rem .625rem; border: 1px solid var(--border-default-grey); border-radius: var(--radius-control);
      background: var(--background-default-grey); color: var(--text-default-grey); font-size: .9375rem; line-height: 1.5rem; }
    .ui-input:focus, .ui-select:focus { outline: none; border-color: var(--border-action-high-primary); box-shadow: 0 0 0 3px var(--background-action-low-primary); }
    .ui-select { appearance: auto; }
    .ui-fieldset { border: 0; margin: 0 0 1rem; padding: 0; min-width: 0; }
    .ui-fieldset__legend { font-weight: 700; color: var(--text-title-grey); padding: 0; margin-bottom: .5rem; }
    .ui-checkbox-group, .ui-radio-group { display: flex; align-items: flex-start; gap: .5rem; margin-bottom: .5rem; }
    .ui-checkbox-group input, .ui-radio-group input { flex: 0 0 auto; width: 1.125rem; height: 1.125rem; margin: .1875rem 0 0; accent-color: var(--background-action-high-primary); }
    .ui-checkbox-group--sm input, .ui-radio-group--sm input { width: 1rem; height: 1rem; margin-top: .125rem; }
    .ui-checkbox-group--sm .ui-label, .ui-radio-group--sm .ui-label { font-size: .875rem; line-height: 1.25rem; }

    /* Alerts */
    .ui-alert { position: relative; padding: .75rem 1rem .75rem 1.25rem; border: 1px solid var(--border-default-grey); border-left: 4px solid var(--text-mention-grey); border-radius: 8px;
      background: var(--background-default-grey); color: var(--text-default-grey); }
    .ui-alert p { margin: 0; }
    .ui-alert--sm { padding: .5rem .75rem .5rem 1rem; font-size: .875rem; }
    .ui-alert__title { margin: 0 0 .25rem; font-size: 1rem; font-weight: 700; color: var(--text-title-grey); }
    .ui-alert--success { border-left-color: var(--text-default-success); }
    .ui-alert--error { border-left-color: var(--text-default-error); }
    .ui-alert--warning { border-left-color: var(--text-default-warning); }
    .ui-alert--info { border-left-color: var(--text-action-high-primary); }

    /* Tables */
    .ui-table { margin-bottom: 1rem; }
    .ui-table__wrapper, .ui-table__container { overflow-x: auto; }
    .ui-table table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .ui-table th, .ui-table td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid var(--border-default-grey); vertical-align: top; }
    .ui-table thead th { background: var(--background-alt-grey); color: var(--text-title-grey); font-weight: 700; }
    .ui-table--sm th, .ui-table--sm td { padding: .25rem .5rem; }

    /* Tabs, stepper */
    .ui-tabs__list { display: flex; flex-wrap: wrap; gap: .25rem; margin: 0; padding: 0; list-style: none; }
    .ui-tabs__tab { padding: .5rem 1rem; border: 0; border-radius: 0; background: transparent; color: var(--text-default-grey); font-size: .9375rem; font-weight: 500; cursor: pointer; box-shadow: inset 0 -1px 0 var(--border-default-grey); }
    .ui-tabs__tab:hover { background: var(--background-default-grey-hover); }
    .ui-tabs__tab[aria-selected="true"] { color: var(--text-action-high-primary); font-weight: 700; box-shadow: inset 0 -2px 0 var(--border-active-primary); background: transparent; }
    .ui-stepper { margin-bottom: 1.5rem; }
    .ui-stepper__title { margin: 0; font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; color: var(--text-title-grey); }
    .ui-stepper__state { display: block; margin-top: .25rem; font-size: .875rem; font-weight: 400; color: var(--text-mention-grey); }

    /* Badges */
    .ui-badge { display: inline-flex; align-items: center; max-width: 100%; padding: 0 .625rem; border-radius: 999px; background: #efeff3; color: #494957;
      font-size: .8125rem; line-height: 1.5rem; font-weight: 700; overflow-wrap: anywhere; }
    .ui-badge--sm { font-size: .75rem; line-height: 1.25rem; padding: 0 .375rem; }
    .ui-badge--success { background: #ddf3ea; color: #0e6b4d; } .ui-badge--error { background: #fce4ec; color: #a61e4d; }
    .ui-badge--warning { background: #fff3c4; color: #7a5b00; } .ui-badge--info { background: #e0f4f8; color: #0b5a70; }
    .ui-badge--new { background: #feebd0; color: #695240; }
    .ui-badge--mint { background: #bafaee; color: #009081; } .ui-badge--ocean { background: #e9edfe; color: #465f9d; }
    .ui-badge--wisteria { background: #fee7fc; color: #6e445a; } .ui-badge--terracotta { background: #fee9e5; color: #755348; }
    .ui-badge--rose { background: #fee9e7; color: #a94645; } .ui-badge--sunflower { background: #feecc2; color: #716043; }
    .ui-badge--caramel { background: #f7ebe5; color: #845d48; } .ui-badge--lagoon { background: #c7f6fc; color: #006a6f; }

    .ui-m-0 { margin: 0 !important; } .ui-mb-1v { margin-bottom: .25rem !important; } .ui-mr-1w { margin-right: .5rem !important; } .ui-ml-4w { margin-left: 2rem !important; }
    .ui-h5 { font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; color: var(--text-title-grey); margin: 0 0 .75rem; }
    .ui-text--md { font-size: 1rem; line-height: 1.5rem; } .ui-text--bold { font-weight: 700; }
    .ui-link { color: var(--text-action-high-primary); text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
    .ui-link--sm { font-size: .875rem; }
    .ui-icon--lg::before { width: 2rem; height: 2rem; }
    .ui-fieldset__element { margin-bottom: .5rem; } .ui-fieldset__element--inline { display: inline-block; margin-right: 1.25rem; }
    .ui-input-group--error .ui-input, .ui-input-group--error .ui-select { border-color: var(--border-plain-error); }
    .ui-input-group--error .ui-label { color: var(--text-default-error); }
    .ui-error-text, .ui-message--warning { display: flex; gap: .25rem; margin-top: .25rem; font-size: .75rem; line-height: 1.25rem; }
    .ui-error-text { color: var(--text-default-error); } .ui-message--warning { color: var(--text-default-warning); }
    .ui-upload-group .ui-label { margin-bottom: .375rem; }
    .ui-upload { display: block; font-size: .875rem; color: var(--text-default-grey); }
    .ui-tabs__tab--icon-left { display: inline-flex; align-items: center; gap: .375rem; }

  /* === SECTION : BASE === */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey);
      font-family: var(--font-ui); font-size: 1rem; }
    #skipLink:focus { position: fixed; top: 0; left: 0; z-index: 9999; padding: .5rem 1rem; clip: auto; width: auto; height: auto;
      overflow: visible; white-space: nowrap; font-size: .875rem;
      background: var(--background-default-grey); color: var(--text-action-high-primary); }
    main[hidden], div[hidden], section[hidden], p[hidden], button[hidden], .ui-btn[hidden] { display: none; }
    .w-contenu { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 1.75rem; color: var(--text-default-grey); }
    .w-titre-vue { margin: 0 0 .25rem; }
    .w-mention { color: var(--text-mention-grey); font-size: .8125rem; margin: 0; }
    .w-texte { font-size: .875rem; line-height: 1.55; margin: 0; color: var(--text-default-grey); }

  /* SECTION : BANNER */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-primary);white-space:nowrap;margin:0;line-height:1}
    .w-bandeau__version{font-size:.75rem;color:var(--text-mention-grey);font-weight:400;margin-left:.5rem;white-space:nowrap}
    /* madeXcé logo: colors read from the design tokens */
    .w-logo{display:block;width:100%;height:auto}
    .w-logo__made{fill:var(--text-mention-grey);font-weight:400}
    .w-logo__x{fill:var(--text-label-accent-pink);font-weight:700}
    .w-logo__ce{fill:var(--text-title-primary);font-weight:800}

  /* === SECTION : LOADER AND BANNERS === */
    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Overlay veil: the only hard-coded color allowed, since the
         --background-overlap-grey token designates an opaque surface. */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }
    .w-loader.actif { display: flex; }
    .w-loader__spinner { width: 32px; height: 32px; border: 3px solid var(--border-default-grey);
      border-top-color: var(--background-action-high-primary); border-radius: 50%; animation: wSpin .8s linear infinite; }
    @keyframes wSpin { to { transform: rotate(360deg); } }
    .w-loader__texte { font-size: .875rem; color: var(--text-inverted-grey); }
    .w-erreur, .w-succes { display: none; flex-shrink: 0; }
    .w-erreur.actif, .w-succes.actif { display: block; }

  /* === SECTION : MODALS === */
    .w-overlay { display: none; position: fixed; inset: 0; z-index: 9990;
      /* Overlay veil: documented exception, see .w-loader */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); align-items: center; justify-content: center; padding: 1rem; }
    .w-overlay.actif { display: flex; }
    .w-overlay--haut { z-index: 9995; }
    .w-dialogue { background: var(--background-default-grey); color: var(--text-default-grey); width: 100%; max-width: 42rem;
      max-height: 100%; display: flex; flex-direction: column; }
    .w-dialogue--etroit { max-width: 30rem; }
    /* Card details: side panel sliding in from the right, full height,
       like a record you look at next to the board. */
    .w-overlay--lateral { justify-content: flex-end; align-items: stretch; padding: 0; }
    .w-dialogue--lateral { max-width: 42rem; height: 100%; animation: wGlisse .2s ease-out; }
    .w-dialogue--lateral .w-dialogue__corps { flex: 1; }
    @keyframes wGlisse { from { transform: translateX(2rem); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .w-dialogue--lateral { animation: none; } }
    .w-fiche { display: flex; flex-direction: column; gap: 1rem; }
    .w-overlay--visionneuse { z-index: 9993; }
    /* Viewer: window at 85% of the height, can be enlarged to full screen. */

  /* === SECTION : PRINTED PAGE ===
     Styles of the document pages, identical on screen and on paper: the

    .p-page { --p-brand: #0e7490; --p-brand-l: #0e749014; --p-ink: #20212b; --p-muted: #5c5f6e; --p-line: #e2e2e8;

    .p-h--2 { font-size: calc(14.5pt * var(--k)); }

/** Logging. Allowed levels: 'ERROR', 'WARNING', 'INFO'. */
function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERROR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'WARNING') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('WARNING', 'Loading overlay hidden automatically after 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Loading…'; }
  /* The overlay only appears past the threshold: a short operation no
     longer makes the screen flicker. masquerLoader cancels this delay, so
     the overlay is never shown for a quick operation. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight forces a reflow before the class is removed. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

var _minuterieErreur = null;

function afficherErreur(message, erreur) {
  logSecurite('ERROR', message, erreur);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message || 'An error occurred.'; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function masquerErreur() {
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); _minuterieErreur = null; }
  var bandeau = document.getElementById('wErreur');
  if (bandeau) { bandeau.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('WARNING', quoi, e); });
  }
  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';
  var div = document.createElement('div');
  div.textContent = String(texte);
  /* Quotes are escaped as well as angle brackets: the output also feeds
     attribute values (title, data-*, value), where an unescaped quote would
     allow breaking out of the attribute. */
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function libelleTable(tid) {

/* Display kind of a column: the one chosen at creation if any, otherwise

/* === SECTION : TABLE CREATION (canonical sequence) === */
async function poserFormules(tid, colonnes) {

    var col = colonnes[i];
    if (!col.formula) { continue; }
    try {
      /* A calculated column (isFormula: true) or a trigger formula (data
         column with a formula applied on creation or update). */
      await agir([['ModifyColumn', tid, col.id, col.isFormula ? { isFormula: true, formula: col.formula }
        : { isFormula: false, formula: col.formula, recalcWhen: col.recalcWhen === undefined ? 0 : col.recalcWhen, recalcDeps: null }]]);
    } catch (e) {

   created in a single call. The actual identifier is always read back. */

  var id = base;

  return id;

  var vues = [];

  if (entreTemps) {
    etat.biblio = entreTemps;
    await reparerSchemaBiblio();

  annoncer(message);
}

/* Rejected input with no field to point to: banner, without ERROR level. */
function signalerSaisie(message) {
  logSecurite('INFO', 'Input rejected: ' + message);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

async function chargerMetaPJ() {
  try {
    var d = await lireTable('_grist_Attachments');
    var m = {};
    for (var i = 0; i < d.id.length; i++) { m[d.id[i]] = { nom: colonneDe(d, 'fileName', i) || ('File ' + d.id[i]), taille: colonneDe(d, 'fileSize', i) || 0 }; }
    etat.pjMeta = m;
  } catch (e) {
    logSecurite('WARNING', 'Attachment names unreadable', e);
  }
}

/* Access token: read-only to view the images, with write access only to
   upload the logo. */
async function obtenirJeton(ecriture) {
  var cle = ecriture ? 'jetonEcriture' : 'jeton';
  var j = etat[cle];
  if (j && Date.now() < j.expire) { return j; }
  var r = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !ecriture }), 15000);
  etat[cle] = { token: r.token, baseUrl: r.baseUrl, expire: Date.now() + Math.max(0, (r.ttlMsecs || 60000) - 30000) };
  return etat[cle];
}

async function fetchDelai(url, options, delaiMs) {
  var ctrl = new AbortController();
  var minut = setTimeout(function () { ctrl.abort(); }, delaiMs);
  try {
    options.signal = ctrl.signal;
    return await fetch(url, options);
  } finally {
    clearTimeout(minut);
  }
}

function extensionDe(nom) {
  var m = /\.([A-Za-z0-9]+)$/.exec(String(nom || ''));
  return m ? m[1].toLowerCase() : '';
}

function formaterTaille(octets) {
  if (!octets) { return ''; }
  if (octets < 1024) { return octets + ' B'; }
  if (octets < 1024 * 1024) { return Math.round(octets / 1024) + ' KB'; }
  return (octets / (1024 * 1024)).toLocaleString(localeDoc(), { maximumFractionDigits: 1 }) + ' MB';
}

function iconePJ(nom) {
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) !== -1) { return 'ui-icon-image-line'; }
  if (ext === 'pdf') { return 'ui-icon-file-pdf-line'; }
  return 'ui-icon-file-line';
}

async function recupererPJ(id) {
  var essai = async function (complet) {
    var j = await obtenirJeton(complet);
    return fetchDelai(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token), {}, DELAI_API_MS);
  };
  var rep = await essai(etat.pjJetonComplet === true);
  /* Some Grist instances refuse a read-only token for files, even to view
     them: retry once with a full token, and keep using it for this session. */
  if ((rep.status === 401 || rep.status === 403) && etat.pjJetonComplet !== true) {
    etat.pjJetonComplet = true;
    rep = await essai(true);
  }
  if (!rep.ok) { throw new Error('Response ' + rep.status); }
  return rep.blob();
}

/* === SECTION : DOCUMENT TEMPLATES IN THE LIBRARY ===
   Several templates per document: one settings row per template, with key
   CONFIG:<identifier>. The list is read into a local variable then
   assigned in one go: a parallel refresh never finds it half read. */
async function lireTableaux() {
  if (!etat.biblio) { etat.tableaux = []; return []; }
  var d = await lireTable(etat.biblio);
  var l = [];
  var temE = false, temP = false;
  for (var i = 0; i < d.id.length; i++) {
    var cle = colonneDe(d, 'KEY', i);
    if (cle === CLE_ACCES_EDITION) { temE = true; continue; }
    if (cle === CLE_ACCES_PARAMETRAGE) { temP = true; continue; }
    if (!(typeof cle === 'string' && cle.indexOf(CLE_CONFIG + ':') === 0)) { continue; }
    try {
      var cfg = JSON.parse(colonneDe(d, 'VALUE', i) || '{}');
      if (cfg && cfg.table && Array.isArray(cfg.blocks)) {
        /* Renamed table: found again before choosing the template shown. */
        try { if (etat.meta) { retrouverRenommages(cfg); } } catch (e2) { logSecurite('WARNING', 'Template references not checked: ' + cle, e2); }
        l.push({ cle: cle, ligne: d.id[i], config: cfg });
      }
    } catch (e) {
      logSecurite('WARNING', 'Unreadable template settings: ' + cle, e);
    }
  }
  l.sort(function (a, b) { return a.ligne - b.ligne; });
  etat.tableaux = l;
  etat.temoinEdition = temE;
  etat.temoinParam = temP;
  return l;
}

/* Template shown on opening, in this order: the one chosen during the
   session, the last one viewed in this browser if it uses the table linked
   to the view, one whose table is linked to the view (another widget of the
   document, on another table, shares the browser memory), the last one
   viewed, otherwise the first one created. */
function choisirTableau() {
  var l = etat.tableaux;
  var t = null;
  var chercher = function (f) { for (var i = 0; i < l.length; i++) { if (f(l[i])) { return l[i]; } } return null; };
  if (etat.tableauSession) { t = chercher(function (x) { return x.cle === etat.tableauSession; }); }
  if (!t && etat.tableauMemorise) { t = chercher(function (x) { return x.cle === etat.tableauMemorise && (!etat.tableLiee || x.config.table === etat.tableLiee); }); }
  if (!t && etat.tableLiee) { t = chercher(function (x) { return x.config.table === etat.tableLiee; }); }
  if (!t && etat.tableauMemorise) { t = chercher(function (x) { return x.cle === etat.tableauMemorise; }); }
  if (!t && l.length) { t = l[0]; }
  etat.config = t ? t.config : null;
  etat.biblioLigne = t ? t.ligne : null;
  etat.cleConfig = t ? t.cle : null;
  return t;
}

/* Per-viewer conveniences, remembered by the browser for this document:
   last template viewed, zoom. If storage is unavailable, defaults apply. */
function cleStockage(quoi) { return 'gristprint:' + (etat.nomDoc || 'document') + ':' + quoi; }
function lireStockage(quoi) { try { return window.localStorage.getItem(cleStockage(quoi)); } catch (e) { return null; } }
function ecrireStockage(quoi, valeur) {
  try { window.localStorage.setItem(cleStockage(quoi), String(valeur)); } catch (e) { logSecurite('INFO', 'Preference not remembered by the browser', e); }
}

function memoriserTableau(cle) {
  etat.tableauSession = cle;
  etat.tableauMemorise = cle;
  ecrireStockage('last', cle);
}

function nouvelleCleConfig() {
  return CLE_CONFIG + ':' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}

/* Writes a template. A new template adds a row; an existing one replaces
   its row. The logo attachment is kept in FILES. */
async function ecrireConfig(cfg, ligne, cle) {
  cfg.version = VERSION_CONFIG;
  noterReferencesConfig(cfg);
  var valeur = JSON.stringify(cfg);
  var fichiers = cfg.logo ? ['L', cfg.logo] : null;
  var aFichiers = !!infoColonne(etat.biblio, 'FILES');
  if (ligne) {
    var maj = { VALUE: valeur, VERSION_UPDATED: VERSION_WIDGET };
    if (aFichiers) { maj.FILES = fichiers; }
    await agir([['UpdateRecord', etat.biblio, ligne, maj]]);
    return { ligne: ligne, cle: cle };
  }
  cle = cle || nouvelleCleConfig();
  var rec = { KEY: cle, VALUE: valeur, VERSION_CREATED: VERSION_WIDGET, VERSION_UPDATED: VERSION_WIDGET };
  if (aFichiers) { rec.FILES = fichiers; }
  var ret = await agir([['AddRecord', etat.biblio, null, rec]]);
  return { ligne: ret && ret.retValues ? ret.retValues[0] : null, cle: cle };
}

/* === SECTION : TABS ===
   One tab per template in the document, then the "New document" tab,
   always last. Left and right arrows, Home and End go through the tabs. */
function enCreation() { return etat.vue === 'assistant' && !!etat.brouillon && etat.brouillon.mode === 'creation'; }
function enParametrage() { return etat.vue === 'assistant' && !!etat.brouillon && etat.brouillon.mode === 'edition'; }

function ongletsDocuments() {
  var ul = creer('ul', { classe: 'ui-tabs__list', attrs: { role: 'tablist', 'aria-label': 'Document templates in this document' } });
  var onglets = [];
  var activer = [];
  var creation = enCreation();
  etat.tableaux.forEach(function (t, i) {
    var actif = !creation && t.cle === etat.cleConfig;
    var b = creer('button', { classe: 'ui-tabs__tab w-onglet', id: 'pOnglet' + i, texte: t.config.name || 'Untitled document',
      attrs: { role: 'tab', 'aria-selected': actif ? 'true' : 'false', 'aria-controls': 'pPanneau', tabindex: actif ? '0' : '-1' } });
    activer.push(function () { return allerAuDocument(t.cle); });
    onglets.push(b);
  });
  if (etat.peutParametrer) {
    onglets.push(creer('button', { classe: 'ui-tabs__tab ui-tabs__tab--icon-left ui-icon-add-line w-onglet', id: 'pOngletNouveau', texte: 'New document',
      attrs: { role: 'tab', 'aria-selected': creation ? 'true' : 'false', 'aria-controls': 'pPanneau', tabindex: creation ? '0' : '-1' } }));
    activer.push(async function () {
      if (enCreation()) { return; }
      if (enParametrage() && !(await quitterEdition(false))) { return; }
      demarrerCreation();
      var f = document.getElementById('pOngletNouveau');
      if (f) { f.focus(); }
      annoncer('New document: choose where to start.');
    });
  }
  onglets.forEach(function (b, i) {
    b.addEventListener('click', function () { relayer(activer[i](), 'Tab change'); });
    b.addEventListener('keydown', function (e) {
      var k = null;
      var n = onglets.length;
      if (e.key === 'ArrowRight') { k = (i + 1) % n; }
      if (e.key === 'ArrowLeft') { k = (i + n - 1) % n; }
      if (e.key === 'Home') { k = 0; }
      if (e.key === 'End') { k = n - 1; }
      if (k !== null) { e.preventDefault(); onglets[k].focus(); relayer(activer[k](), 'Tab change'); }
    });
    ul.appendChild(creer('li', { attrs: { role: 'presentation' } }, [b]));
  });
  return creer('nav', { classe: 'tab-nav w-onglets', attrs: { 'aria-label': 'Navigation between document templates' } }, [ul]);
}

function envelopperOnglets(zone) {
  var actif = 'pOngletNouveau';
  if (!enCreation()) { etat.tableaux.forEach(function (t, i) { if (t.cle === etat.cleConfig) { actif = 'pOnglet' + i; } }); }
  var p = creer('div', { id: 'pPanneau', attrs: { role: 'tabpanel', 'aria-labelledby': actif } });
  while (zone.firstChild) { p.appendChild(zone.firstChild); }
  zone.appendChild(ongletsDocuments());
  zone.appendChild(p);
}

async function allerAuDocument(cle) {
  if (enParametrage()) {
    var sorti = await quitterEdition(cle === etat.cleConfig);
    if (!sorti || cle === etat.cleConfig) { return; }
  }
  if (enCreation() && etat.brouillon.etape > 1) {
    if (!(await abandonnerCreation())) {
      var f = document.getElementById('pOngletNouveau');
      if (f) { f.focus(); }
      return;
    }
  }
  etat.brouillon = null;
  memoriserTableau(cle);
  reinitialiserVue();
  await chargerTout();
  var n = 0;
  etat.tableaux.forEach(function (t, i) { if (t.cle === etat.cleConfig) { n = i; } });
  annoncer('Document ' + (etat.config ? etat.config.name : '') + ' shown, ' + (n + 1) + ' of ' + etat.tableaux.length + '.');
  var o = document.getElementById('pOnglet' + n);
  if (o) { o.focus(); }
}

/* Viewer state reset when another template is shown. */
function reinitialiserVue() {
  etat.idCourant = null; etat.selection = {}; etat.recherche = ''; etat.filtreCol = ''; etat.filtreVal = ''; etat.nonImprimes = false;
  etat.sourceLot = 'choix'; etat.mode = 'un'; etat.suivreCurseur = true;
}

/* === SECTION : ACCESS RIGHTS ===
   The person's rights: read-only access (viewer, document opened
   read-only) is told by Grist's access token; finer rights are deduced
   from the marker rows they can read. If missing, the markers are created
   once per session by someone who can write; creation fails silently for
   anyone else, who then switches to read-only. */
/* Reads the payload of a JWT token (middle part, base64url). */
function contenuJeton(jeton) {
  var p = String(jeton || '').split('.')[1];
  if (!p) { return null; }
  p = p.replace(/-/g, '+').replace(/_/g, '/');
  while (p.length % 4) { p += '='; }
  var bin = atob(p);
  var octets = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { octets[i] = bin.charCodeAt(i); }
  return JSON.parse(new TextDecoder().decode(octets));
}
/* Right to write to the document: Grist gives the widget an access token,
   which it marks "read-only" for a viewer (or a document opened
   read-only). Nothing is written. Unknown: the controls stay offered, and
   Grist refuses what is not allowed. */
async function sonderEcriture() {
  try {
    var j = await gristAvecTimeout(obtenirJeton(true), 5000);
    var c = contenuJeton(j && j.token);
    if (c && typeof c.readOnly === 'boolean') { return !c.readOnly; }
    logSecurite('INFO', 'Access token without rights information');
  } catch (e) {
    logSecurite('INFO', 'Write rights not determined', e);
  }
  return true;
}

async function determinerDroits() {
  var ecriture = await sonderEcriture();
  if (!etat.biblio) { etat.peutModifier = ecriture; etat.peutParametrer = ecriture; return; }
  var manque = [];
  if (!etat.temoinEdition) { manque.push(CLE_ACCES_EDITION); }
  if (!etat.temoinParam) { manque.push(CLE_ACCES_PARAMETRAGE); }
  if (manque.length && ecriture && !etat.temoinsTentes) {
    etat.temoinsTentes = true;
    try {
      await gristAvecTimeout(grist.docApi.applyUserActions(manque.map(function (k) {
        return ['AddRecord', etat.biblio, null, { KEY: k, VALUE: 'Access rights marker row: do not edit.', VERSION_CREATED: VERSION_WIDGET, VERSION_UPDATED: VERSION_WIDGET }];
      })), DELAI_API_MS);
      await lireTableaux();
    } catch (e) {
      logSecurite('INFO', 'Marker rows not created (read-only or restricted rights)', e);
    }
  }
  etat.peutModifier = ecriture && !!etat.temoinEdition;
  etat.peutParametrer = etat.peutModifier && !!etat.temoinParam;
}

/* Step-by-step box to reserve the settings for owners and printing marks
   for editors, with Grist's own English labels. */
function encartDroits() {
  var nomBib = etat.biblio || (ID_BIBLIO + '_');
  var detail = creer('div', { id: 'pDroitsDetail', classe: 'w-droits', attrs: { hidden: '' } }, [
    creer('p', { classe: 'w-texte', texte: 'In Grist, open Raw data or the page menu, then Access rules, and add rules on the table ' + nomBib + ':' }),
    creer('p', { classe: 'w-texte', texte: '1. Reserve the settings for owners. Condition: user.Access != OWNER and rec.KEY == "' + CLE_ACCES_PARAMETRAGE + '". Deny Read.' }),
    creer('p', { classe: 'w-texte', texte: '2. Keep "mark as printed" for editors. Condition: user.Access not in [OWNER, EDITOR] and rec.KEY == "' + CLE_ACCES_EDITION + '". Deny Read.' }),
    creer('p', { classe: 'w-texte', texte: '3. Protect the templates. Condition: user.Access != OWNER. Deny Create, Update and Delete on the whole table ' + nomBib + ' (keep Read allowed: without it, nobody can print any more).' }),
    creer('p', { classe: 'w-texte', texte: 'Without these rules, everyone who can edit the document can also change the templates. Hiding is a convenience: the real protection comes from rule 3 and the document permissions.' })]);
  var btn = bouton('Show the steps', 'discret', null, function () {
    var ouvert = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', ouvert ? 'false' : 'true');
    if (ouvert) { detail.setAttribute('hidden', ''); } else { detail.removeAttribute('hidden'); }
    btn.textContent = ouvert ? 'Show the steps' : 'Hide the steps';
  }, { petit: true });
  btn.setAttribute('aria-expanded', 'false');
  btn.setAttribute('aria-controls', 'pDroitsDetail');
  return creer('div', { classe: 'ui-alert ui-alert--info ui-alert--sm w-droits' }, [
    creer('p', { classe: 'ui-alert__title', texte: 'Who can do what' }),
    creer('p', { classe: 'w-texte', texte: 'Viewers see and print the documents. Editors can also mark rows as printed. Only owners change the templates, once the access rules are in place.' }),
    btn, detail]);
}

/* === SECTION : DATA OF THE DOCUMENT ===
   Tables are read with fetchTable (one call per table, never per row) and
   kept with an index from row id to position. */
async function chargerTableDonnees(tid) {
  var d = await lireTable(tid);
  var idx = {};
  for (var i = 0; i < d.id.length; i++) { idx[d.id[i]] = i; }
  etat.donnees[tid] = { d: d, idx: idx };
  return etat.donnees[tid];
}

function cellule(tid, i, colId) {
  var t = etat.donnees[tid];
  if (!t || typeof i !== 'number' || i < 0) { return undefined; }
  var c = t.d[colId];
  return c ? valeurCellule(c[i]) : undefined;
}

function indexDe(tid, id) {
  var t = etat.donnees[tid];
  return t && t.idx[id] !== undefined ? t.idx[id] : -1;
}

function idDe(tid, i) { var t = etat.donnees[tid]; return t && i >= 0 ? t.d.id[i] : null; }

/* Row positions in the table's own order (manual order, then id). */
function ordreLignes(tid) {
  var t = etat.donnees[tid];
  if (!t) { return []; }
  var d = t.d;
  var pos = d.id.map(function (_, i) { return i; });
  var ms = d.manualSort;
  pos.sort(function (a, b) {
    var x = ms ? ms[a] : null, y = ms ? ms[b] : null;
    if (typeof x === 'number' && typeof y === 'number' && x !== y) { return x - y; }
    return d.id[a] - d.id[b];
  });
  return pos;
}

/* Display column of a reference: the one chosen in Grist ("SHOW COLUMN"),
   otherwise the first text column of the referenced table. A reference is
   never shown as a bare row id when a name exists. */
function colAffichage(col) {
  var c = colAffichageRef(col);
  if (c) { return c; }
  var cible = tableCibleRef(col && col.type);
  if (!cible) { return null; }
  var l = colonnesDe(cible).filter(function (x) { return x.type === 'Text' && IDS_META.indexOf(x.colId) === -1; });
  var parNom = l.filter(function (x) { return evoque(x, 'nom') || evoque(x, 'numero'); });
  return (parNom[0] || l[0] || {}).colId || null;
}

/* Tables needed to show a reference column (its target), followed one
   level further when the display column is itself a reference. */
function tablesPourColonne(col, acc, prof) {
  var cible = tableCibleRef(col && col.type);
  if (!cible || acc.indexOf(cible) !== -1 || !etat.meta.tables[cible]) { return; }
  acc.push(cible);
  if ((prof || 0) < 1) {
    var aff = infoColonne(cible, colAffichage(col));
    if (aff) { tablesPourColonne(aff, acc, (prof || 0) + 1); }
  }
}

/* === SECTION : VALUES, IN THE COLUMN'S OWN FORMAT ===
   Dates in the column's Grist format, numbers and currency with the
   column options and the document locale, references through their
   display column, choice lists joined with ", ", yes/no in words. */
var MOTS_OUI_NON = ['Yes', 'No'];

function dateLongue(sec, fuseau) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  return formatDate('long|' + (fuseau || 'UTC'), { year: 'numeric', month: 'long', day: 'numeric', timeZone: fuseau || 'UTC' }).format(new Date(sec * 1000));
}
function dateCourte(sec, fuseau) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  return formatDate('court|' + (fuseau || 'UTC'), { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: fuseau || 'UTC' }).format(new Date(sec * 1000));
}
/* Today, as a calendar date in the document's time zone (UTC midnight, the
   way Grist stores Date cells). */
function aujourdhuiDoc() {
  try {
    var p = partiesDansFuseau(Date.now() / 1000, fuseauDoc());
    return Date.UTC(p.a, p.m - 1, p.j) / 1000;
  } catch (e) { return aujourdhuiSec(); }
}

function formaterValeur(v, col, mods, prof) {
  mods = mods || [];
  prof = prof || 0;
  if (v === null || v === undefined || v === '') { return ''; }
  if (Array.isArray(v) && v[0] === 'E') { return ''; }
  var t = col ? String(col.type || 'Any') : 'Any';
  if (t.indexOf('Ref:') === 0) {
    if (typeof v !== 'number') { return String(v); }
    return texteLigneRef(tableCibleRef(t), v, colAffichage(col), prof);
  }
  if (t.indexOf('RefList:') === 0) {
    var ids = Array.isArray(v) && v[0] === 'L' ? v.slice(1) : [];
    var aff = colAffichage(col), cib = tableCibleRef(t);
    return ids.map(function (id) { return texteLigneRef(cib, id, aff, prof); }).filter(Boolean).join(', ');
  }
  if (t === 'Bool') {
    var oui = mods.length > 0 ? mods[0] : MOTS_OUI_NON[0];
    var non = mods.length > 1 ? mods[1] : (mods.length ? '' : MOTS_OUI_NON[1]);
    return v === true ? oui : (v === false ? non : String(v));
  }
  if (t === 'Date' || t.indexOf('DateTime') === 0) {
    if (typeof v !== 'number') { return String(v); }
    var fz = t === 'Date' ? 'UTC' : fuseauDe(col);
    if (mods[0] === 'long') { return dateLongue(v, fz); }
    if (mods[0] === 'short') { return dateCourte(v, fz); }
    return formaterDateCol(v, col);
  }
  if (t === 'Numeric' || t === 'Int') { return typeof v === 'number' ? formaterNombreCol(v, col) : String(v); }
  if (t === 'Attachments') {
    var pj = Array.isArray(v) && v[0] === 'L' ? v.slice(1) : [];
    return pj.map(function (id) { return etat.pjMeta[id] ? etat.pjMeta[id].nom : ''; }).filter(Boolean).join(', ');
  }
  if (t === 'ChoiceList' || (Array.isArray(v) && v[0] === 'L')) {
    return Array.isArray(v) ? v.slice(v[0] === 'L' ? 1 : 0).map(String).join(', ') : String(v);
  }
  if (typeof v === 'number') { return formaterNombre(v); }
  if (typeof v === 'boolean') { return v ? MOTS_OUI_NON[0] : MOTS_OUI_NON[1]; }
  if (typeof v === 'object') { return ''; }
  return String(v);
}

function texteLigneRef(tid, id, colAff, prof) {
  if (!id || !tid) { return ''; }
  var i = indexDe(tid, id);
  if (i < 0 || !colAff) { return i < 0 ? '' : libelleTable(tid) + ' ' + id; }
  if (prof > 2) { return ''; }
  return formaterValeur(cellule(tid, i, colAff), infoColonne(tid, colAff), [], prof + 1);
}

/* Value of a field path for a row: "Column" or "RefColumn.Column" (one
   column of the referenced row). ok = false when the column does not
   exist (renamed or deleted). */
function valeurChemin(tid, i, chemin, mods) {
  var parts = String(chemin || '').split('.');
  var col = infoColonne(tid, parts[0].trim());
  if (!col) { return { ok: false, texte: '' }; }
  var v = cellule(tid, i, col.colId);
  if (parts.length === 1) { return { ok: true, texte: formaterValeur(v, col, mods), brut: v, col: col }; }
  var cible = tableCibleRef(col.type);
  var reste = parts.slice(1).join('.');
  if (!cible) { return { ok: false, texte: '' }; }
  var existe = !!infoColonne(cible, parts[1].trim());
  if (col.type.indexOf('RefList:') === 0) {
    var ids = Array.isArray(v) && v[0] === 'L' ? v.slice(1) : [];
    var textes = ids.map(function (id) { return valeurChemin(cible, indexDe(cible, id), reste, mods).texte; }).filter(Boolean);
    return { ok: existe, texte: textes.join(', '), brut: v, col: infoColonne(cible, parts[1].trim()) };
  }
  var j = typeof v === 'number' && v ? indexDe(cible, v) : -1;
  if (j < 0) { return { ok: existe, texte: '', brut: null, col: infoColonne(cible, parts[1].trim()) }; }
  return valeurChemin(cible, j, reste, mods);
}

/* Column at the end of a path (for its type and label). */
function colonneChemin(tid, chemin) {
  var parts = String(chemin || '').split('.');
  var col = infoColonne(tid, parts[0].trim());
  if (!col || parts.length === 1) { return col; }
  var cible = tableCibleRef(col.type);
  return cible ? colonneChemin(cible, parts.slice(1).join('.')) : null;
}

function libelleChemin(tid, chemin) {
  var c = String(chemin || '');
  var lc = infoColonne(tid, c) ? '' : c.toLowerCase();
  if (lc === 'today') { return 'Today\'s date'; }
  if (lc === 'page') { return 'Page number'; }
  if (lc === 'pages') { return 'Number of pages'; }
  var parts = c.split('.');
  var col = infoColonne(tid, parts[0]);
  if (!col) { return c; }
  if (parts.length === 1) { return col.label; }
  var cible = tableCibleRef(col.type);
  var sous = cible ? infoColonne(cible, parts[1]) : null;
  return col.label + ' › ' + (sous ? sous.label : parts[1]);
}

/* Tables to read for a template: the main table, the line item tables, and
   the targets of every reference shown. */
function tablesNecessaires(cfg) {
  var acc = [];
  if (!cfg || !etat.meta.tables[cfg.table]) { return acc; }
  acc.push(cfg.table);
  var visiter = function (tid, chemin) {
    var parts = String(chemin || '').split('.');
    var col = infoColonne(tid, parts[0].trim());
    if (!col) { return; }
    if (tableCibleRef(col.type)) {
      tablesPourColonne(col, acc, 0);
      if (parts.length > 1) {
        var cible = tableCibleRef(col.type);
        var sous = infoColonne(cible, parts[1].trim());
        if (sous) { tablesPourColonne(sous, acc, 1); }
      }
    }
  };
  parcourirBlocs(cfg.blocks, function (b) {
    cheminsDuBloc(b).forEach(function (ch) { visiter(cfg.table, ch); });
    if (b.type === 'items' && b.table && etat.meta.tables[b.table]) {
      if (acc.indexOf(b.table) === -1) { acc.push(b.table); }
      (b.columns || []).forEach(function (c) { visiter(b.table, c.col); });
    }
  });
  return acc;
}

/* Every block, including those inside two columns. */
function parcourirBlocs(blocs, f) {
  (blocs || []).forEach(function (b) {
    f(b);
    if (b.type === 'columns') { parcourirBlocs(b.left, f); parcourirBlocs(b.right, f); }
  });
}

/* Field paths used by a block (texts, field list, image, condition). */
function cheminsDuBloc(b) {
  var l = [];
  ['text', 'name', 'caption'].forEach(function (k) {
    if (typeof b[k] === 'string') { analyserTexte(b[k]).forEach(function (t) { if (t.t === 'f') { l.push(t.chemin); } }); }
  });
  (b.items || []).forEach(function (it) { if (it.path) { l.push(it.path); } });
  if (b.type === 'image' && b.source === 'column' && b.col) { l.push(b.col); }
  if (b.cond && b.cond.path) { l.push(b.cond.path); }
  return l;
}

/* === SECTION : TEMPLATE TEXT ===
   The text of a heading, paragraph, signature or footer is plain text with
   a small markup, parsed here and never inserted as HTML:
   {Column} or {Ref.Column} a field, {today} today's date, {page} and
   {pages} page numbers; {Date column|long} a long date; {Yes/no column|text
   if yes|text if no}; **bold**, *italic*, __underline__; a backslash keeps
   the next character as is. Field values are inserted as text and are
   never parsed. */
function analyserTexte(s) {
  s = String(s === null || s === undefined ? '' : s);
  var out = [];
  var buf = '';
  var vider = function () { if (buf) { out.push({ t: 'txt', v: buf }); buf = ''; } };
  var i = 0;
  while (i < s.length) {
    var c = s.charAt(i);
    if (c === '\\' && i + 1 < s.length) { buf += s.charAt(i + 1); i += 2; continue; }
    if (c === '*' && s.charAt(i + 1) === '*') { vider(); out.push({ t: 'b' }); i += 2; continue; }
    if (c === '_' && s.charAt(i + 1) === '_') { vider(); out.push({ t: 'u' }); i += 2; continue; }
    if (c === '*') { vider(); out.push({ t: 'i' }); i += 1; continue; }
    if (c === '\n') { vider(); out.push({ t: 'br' }); i += 1; continue; }
    if (c === '{') {
      var j = s.indexOf('}', i + 1);
      var dedans = j > i + 1 ? s.slice(i + 1, j) : '';
      if (dedans && dedans.indexOf('{') === -1 && dedans.indexOf('\n') === -1 && dedans.length <= 160) {
        vider();
        var morceaux = dedans.split('|');
        out.push({ t: 'f', chemin: morceaux[0].trim(), mods: morceaux.slice(1) });
        i = j + 1;
        continue;
      }
    }
    buf += c;
    i += 1;
  }
  vider();
  return out;
}

function valeurJeton(t, rc) {
  /* A column named exactly like a special field (Pages, Page, Today) keeps
     its own value. */
  var lc = infoColonne(rc.tid, t.chemin) ? '' : t.chemin.toLowerCase();
  if (lc === 'today') {
    var a = aujourdhuiDoc();
    return { ok: true, texte: t.mods[0] === 'short' ? dateCourte(a, 'UTC') : dateLongue(a, 'UTC') };
  }
  if (lc === 'page' || lc === 'pages') { return { ok: true, texte: '', pn: lc }; }
  if (typeof rc.i !== 'number' || rc.i < 0) { return { ok: !!colonneChemin(rc.tid, t.chemin), texte: '' }; }
  return valeurChemin(rc.tid, rc.i, t.chemin, t.mods);
}

function ajouterTexteMarque(parent, texte, st) {
  if (!texte) { return; }
  var lignes = String(texte).split('\n');
  var cible = parent;
  if (st.b || st.i || st.u) {
    cible = creer('span', { classe: [st.b ? 'p-b' : '', st.i ? 'p-i' : '', st.u ? 'p-s' : ''].join(' ').trim() });
    parent.appendChild(cible);
  }
  lignes.forEach(function (l, k) {
    if (k > 0) { cible.appendChild(document.createElement('br')); }
    if (l) { cible.appendChild(document.createTextNode(l)); }
  });
}

/* Renders a template text into parent. A line made only of fields that are
   all empty is skipped (an address without its second line, an empty
   email), so no blank line is left behind. Returns true if anything was
   written. */
function rendreRiche(parent, texte, rc) {
  var toks = analyserTexte(texte);
  var lignes = [[]];
  toks.forEach(function (t) { if (t.t === 'br') { lignes.push([]); } else { lignes[lignes.length - 1].push(t); } });
  var st = { b: false, i: false, u: false };
  var premiere = true;
  var ecrit = false;
  lignes.forEach(function (lg) {
    var aChamp = false, aTexte = false, tousVides = true;
    var morceaux = lg.map(function (t) {
      if (t.t === 'f') {
        aChamp = true;
        var r = valeurJeton(t, rc);
        if (r.texte || r.pn || (!r.ok && rc.apercu)) { tousVides = false; }
        return { t: 'f', r: r, chemin: t.chemin };
      }
      if (t.t === 'txt' && t.v.trim()) { aTexte = true; }
      return t;
    });
    if (aChamp && !aTexte && tousVides) {
      lg.forEach(function (t) { if (t.t === 'b' || t.t === 'i' || t.t === 'u') { st[t.t] = !st[t.t]; } });
      return;
    }
    if (!premiere) { parent.appendChild(document.createElement('br')); }
    premiere = false;
    morceaux.forEach(function (m) {
      if (m.t === 'b' || m.t === 'i' || m.t === 'u') { st[m.t] = !st[m.t]; return; }
      if (m.t === 'txt') { ajouterTexteMarque(parent, m.v, st); ecrit = ecrit || !!m.v.trim(); return; }
      if (m.r.pn) {
        parent.appendChild(creer('span', { classe: 'p-pn', attrs: { 'data-pn': m.r.pn } }));
        ecrit = true;
        return;
      }
      if (!m.r.ok && rc.apercu) {
        parent.appendChild(creer('span', { classe: 'p-manque', texte: '{' + m.chemin + '}', attrs: { title: 'Unknown field' } }));
        ecrit = true;
        return;
      }
      ajouterTexteMarque(parent, m.r.texte, st);
      ecrit = ecrit || !!m.r.texte;
    });
  });
  return ecrit;
}

/* Plain text of a template text for a row (lists, summaries, tab titles). */
function texteBrut(texte, rc) {
  var d = document.createElement('div');
  rendreRiche(d, texte, rc);
  return d.textContent;
}

/* Shown only if...: condition of a block, evaluated for the row. */
function conditionRemplie(cond, rc) {
  if (!cond || !cond.op || !cond.path) { return true; }
  if (typeof rc.i !== 'number' || rc.i < 0) { return true; }
  var r = valeurChemin(rc.tid, rc.i, cond.path, []);
  var estBool = r.col && r.col.type === 'Bool';
  var rempli = estBool ? r.brut === true : String(r.texte || '').trim() !== '';
  var egal = normalizer(r.texte) === normalizer(cond.value) || (r.brut !== null && r.brut !== undefined && normalizer(String(r.brut)) === normalizer(cond.value));
  switch (cond.op) {
    case 'filled': return rempli;
    case 'empty': return !rempli;
    case 'checked': return r.brut === true;
    case 'unchecked': return r.brut !== true;
    case 'equals': return egal;
    case 'differs': return !egal;
    default: return true;
  }
}

/* Name of a row in lists: the template's row name column, or the first
   text column. */
function libelleLigne(cfg, i) {
  var col = cfg.labelCol && infoColonne(cfg.table, cfg.labelCol) ? cfg.labelCol : null;
  var t = col ? valeurChemin(cfg.table, i, col, []).texte : '';
  return t || ('Row ' + idDe(cfg.table, i));
}

/* === SECTION : PAGE RENDERER ===
   A template is turned into pages, element by element (createElement and
   textContent only). Pagination is done by the widget itself: blocks are
   placed one after the other, a block that does not fit goes to the next
   page, line items and field lists are split between pages (the table
   header is repeated, totals stay with the last rows), a heading always
   stays with what follows. So page numbers ("Page 1 of 2") are exact, and
   the preview is exactly what is printed. */
function geometrie(cfg) {
  var p = (cfg && cfg.page) || {};
  var pap = PAPIERS[p.size] || PAPIERS[formatPapier() === 'letter' ? 'letter' : 'a4'];
  var paysage = p.orientation === 'landscape';
  var m = (MARGES[p.margins] || MARGES.normal).px;
  return { w: paysage ? pap.h : pap.w, h: paysage ? pap.w : pap.h, m: m, css: paysage ? [pap.css[1], pap.css[0]] : pap.css.slice() };
}

function couleurValide(c) { return /^#[0-9a-fA-F]{6}$/.test(String(c || '')) ? String(c).toLowerCase() : '#0e7490'; }

/* The @page size of the template in use: written from the fixed list of
   paper sizes only. */
function appliquerStylePage(cfg) {
  var geo = geometrie(cfg);
  var s = document.getElementById('pPageStyle');
  if (s) { s.textContent = '@page { size: ' + geo.css[0] + ' ' + geo.css[1] + '; margin: 0; }'; }
}

function nouvellePage(cfg, geo) {
  var p = cfg.page || {};
  var page = creer('div', { classe: 'p-page' + (p.font === 'serif' ? ' p-page--serif' : ''), attrs: { role: 'group' } });
  page.style.width = geo.w + 'px';
  page.style.height = geo.h + 'px';
  var c = couleurValide(p.color);
  page.style.setProperty('--p-brand', c);
  page.style.setProperty('--p-brand-l', c + '14');
  if (p.border === 'thin' || p.border === 'double') {
    var f = creer('div', { classe: 'p-frame p-frame--' + p.border, attrs: { 'aria-hidden': 'true' } });
    var e = Math.round(geo.m * 0.45);
    f.style.top = e + 'px'; f.style.left = e + 'px'; f.style.right = e + 'px'; f.style.bottom = e + 'px';
    page.appendChild(f);
  }
  return page;
}

function valeurDans(v, liste, defaut) { return liste.indexOf(v) !== -1 ? v : defaut; }

/* --- Images: fetched once as Blobs, URL kept for the session --- */
function urlImage(id) {
  if (!etat.blobs[id]) {
    etat.blobs[id] = recupererPJ(id).then(function (blob) {
      var ext = extensionDe(etat.pjMeta[id] ? etat.pjMeta[id].nom : 'image.png');
      if (PJ_IMAGES.indexOf(ext) === -1) { throw new Error('Not an image'); }
      var url = URL.createObjectURL(new Blob([blob], { type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext) }));
      etat.blobs[id].url = url;
      return url;
    });
    /* A failed download is not kept: the next drawing tries again. */
    var essai = etat.blobs[id];
    essai.catch(function (e) { if (etat.blobs[id] === essai) { delete etat.blobs[id]; } logSecurite('WARNING', 'Image not loaded', e); });
  }
  return etat.blobs[id];
}

function imageVers(img, id) {
  var p = urlImage(id);
  if (p.url) { img.src = p.url; return; }
  p.then(function (url) { img.src = url; }).catch(function () { if (img.parentNode) { img.parentNode.removeChild(img); } });
}

function estImagePJ(id) {
  var m = etat.pjMeta[id];
  return !!m && PJ_IMAGES.indexOf(extensionDe(m.nom)) !== -1;
}

/* --- Block builders: each returns a list of units to place --- */
function classes() { return Array.prototype.filter.call(arguments, Boolean).join(' '); }

function unitesBloc(b, rc) {
  if (!b || !conditionRemplie(b.cond, rc)) { return []; }
  switch (b.type) {
    case 'heading': return uniteTitre(b, rc);
    case 'paragraph': return unitesParagraphe(b, rc);
    case 'fields': return uniteChamps(b, rc);
    case 'image': return uniteImage(b, rc);
    case 'items': return uniteLignes(b, rc);
    case 'columns': return uniteColonnes(b, rc);
    case 'signature': return uniteSignature(b, rc);
    case 'divider': return [{ el: creer('hr', { classe: 'p-u p-hr p-hr--' + valeurDans(b.style, ['thin', 'thick', 'brand', 'short', 'band'], 'thin') }) }];
    case 'spacer': return [{ el: creer('div', { classe: 'p-u p-sp p-sp--' + valeurDans(b.size, ['S', 'M', 'L', 'XL'], 'M'), attrs: { 'aria-hidden': 'true' } }) }];
    case 'pagebreak': return [{ saut: true }];
    default: return [];
  }
}

function uniteTitre(b, rc) {
  var n = valeurDans(Number(b.level), [1, 2, 3], 2);
  var el = creer('div', { classe: classes('p-u p-h p-h--' + n, 'p-k--' + valeurDans(b.size, ['S', 'M', 'L', 'XL'], 'M'), 'p-a--' + valeurDans(b.align, ['left', 'center', 'right'], 'left'),
    'p-c--' + valeurDans(b.color, ['ink', 'brand', 'muted'], 'ink'), b.spaced ? 'p-h--espace' : ''), attrs: { role: 'heading', 'aria-level': String(n + 2) } });
  if (!rendreRiche(el, b.text, rc)) { return []; }
  return [{ el: el, garder: true }];
}

function unitesParagraphe(b, rc) {
  var morceaux = String(b.text || '').split(/\n[ \t]*\n/);
  var l = [];
  morceaux.forEach(function (m) {
    var el = creer('p', { classe: classes('p-u p-t', 'p-k--' + valeurDans(b.size, ['S', 'M', 'L', 'XL'], 'M'), 'p-a--' + valeurDans(b.align, ['left', 'center', 'right'], 'left'),
      'p-c--' + valeurDans(b.color, ['ink', 'brand', 'muted'], 'ink')) });
    if (rendreRiche(el, m, rc)) { l.push({ el: el }); }
  });
  return l;
}

function uniteChamps(b, rc) {
  var style = valeurDans(b.style, ['grid', 'lines', 'stacked'], 'grid');
  var align = valeurDans(b.align, ['left', 'center', 'right'], 'left');
  var cont = creer('div', { classe: classes('p-u p-fields', Number(b.columns) === 2 && align === 'left' ? 'p-fields--2' : '',
    style === 'lines' ? 'p-fields--lignes' : '', style === 'stacked' ? 'p-fields--empile' : '', align === 'right' ? 'p-fields--droite' : '', align === 'center' ? 'p-fields--centre' : '') });
  (b.items || []).forEach(function (it) {
    if (!it || !it.path) { return; }
    var col = colonneChemin(rc.tid, it.path);
    var mods = col && col.type === 'Bool' && (it.yes || it.no) ? [it.yes || 'Yes', it.no || 'No'] : [];
    var r = typeof rc.i === 'number' && rc.i >= 0 ? valeurChemin(rc.tid, rc.i, it.path, mods) : { ok: !!col, texte: '' };
    if (!r.ok && !rc.apercu) { return; }
    if (r.ok && !String(r.texte).trim() && !b.showEmpty) { return; }
    var v = creer('div', { classe: 'p-f__v' });
    if (!r.ok) { v.appendChild(creer('span', { classe: 'p-manque', texte: '{' + it.path + '}' })); } else { ajouterTexteMarque(v, r.texte || '', {}); }
    cont.appendChild(creer('div', { classe: 'p-f' }, [creer('div', { classe: 'p-f__l', texte: it.label !== undefined && it.label !== null && it.label !== '' ? it.label : libelleChemin(rc.tid, it.path) }), v]));
  });
  if (!cont.firstChild) { return []; }
  return [{ el: cont, coupe: { conteneur: cont, coquille: function () { var c = cont.cloneNode(false); return { el: c, conteneur: c }; }, minimum: 2 } }];
}

function uniteImage(b, rc) {
  var taille = valeurDans(b.size, ['S', 'M', 'L', 'XL'], 'M');
  if (b.source === 'logo') {
    var p = rc.cfg.page || {};
    var al = b.align && b.align !== 'page' ? b.align : (p.logoPos || 'left');
    var bl = creer('div', { classe: classes('p-u p-img', 'p-img--' + valeurDans(p.logoSize || taille, ['S', 'M', 'L', 'XL'], 'M'), 'p-img--' + valeurDans(al, ['left', 'center', 'right'], 'left')) });
    if (rc.logoUrl) {
      bl.appendChild(creer('img', { attrs: { src: rc.logoUrl, alt: 'Logo' } }));
    } else if (rc.cfg.logo) {
      var img = creer('img', { attrs: { alt: 'Logo' } });
      imageVers(img, rc.cfg.logo);
      bl.appendChild(img);
    } else if (rc.editeur) {
      bl.appendChild(creer('div', { classe: 'p-ph', texte: 'Your logo here: add it in Page setup' }));
    } else { return []; }
    return [{ el: bl }];
  }
  var cont = creer('div', { classe: classes('p-u p-img p-img--multi', 'p-img--' + taille, 'p-img--' + valeurDans(b.align, ['left', 'center', 'right'], 'left')) });
  var v = typeof rc.i === 'number' && rc.i >= 0 && b.col ? cellule(rc.tid, rc.i, String(b.col).split('.')[0]) : null;
  var ids = Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(estImagePJ).slice(0, b.all ? 4 : 1) : [];
  ids.forEach(function (id) {
    var img = creer('img', { attrs: { alt: etat.pjMeta[id] ? etat.pjMeta[id].nom : 'Image' } });
    imageVers(img, id);
    cont.appendChild(img);
  });
  if (!ids.length) {
    if (!rc.editeur) { return []; }
    cont.appendChild(creer('div', { classe: 'p-ph', texte: b.col ? 'No image in this row' : 'Choose an attachments column' }));
  }
  return [{ el: cont }];
}

/* Line items: rows of another table that reference this row. Index built
   once per data load. */
function lignesEnfants(tidE, colRef, idParent, tri) {
  var cle = tidE + '|' + colRef;
  etat.indexEnfants = etat.indexEnfants || {};
  if (!etat.indexEnfants[cle]) {
    var m = {};
    var t = etat.donnees[tidE];
    if (t) {
      var refs = t.d[colRef] || [];
      var estListe = (infoColonne(tidE, colRef) || {}).type && String(infoColonne(tidE, colRef).type).indexOf('RefList:') === 0;
      ordreLignes(tidE).forEach(function (j) {
        var v = refs[j];
        var ids = estListe ? (Array.isArray(v) && v[0] === 'L' ? v.slice(1) : []) : [v];
        ids.forEach(function (id) { if (typeof id === 'number' && id) { (m[id] = m[id] || []).push(j); } });
      });
    }
    etat.indexEnfants[cle] = m;
  }
  var l = (etat.indexEnfants[cle][idParent] || []).slice();
  if (tri && infoColonne(tidE, tri)) {
    var d = etat.donnees[tidE].d[tri] || [];
    l.sort(function (a, b) {
      var x = d[a], y = d[b];
      if (typeof x === 'number' && typeof y === 'number') { return x - y; }
      return String(x === null || x === undefined ? '' : x).localeCompare(String(y === null || y === undefined ? '' : y), localeFormat(), { numeric: true });
    });
  }
  return l;
}

function estNumerique(col) { return !!col && (col.type === 'Numeric' || col.type === 'Int'); }

function uniteLignes(b, rc) {
  var tidE = b.table;
  if (!tidE || !etat.donnees[tidE] || !infoColonne(tidE, b.ref)) {
    if (!rc.editeur) { return []; }
    return [{ el: creer('div', { classe: 'p-u p-ph', texte: 'Line items: choose the table of lines in the block settings', attrs: { style: 'width:100%;height:3rem' } }) }];
  }
  var cols = (b.columns || []).filter(function (c) { return c && colonneChemin(tidE, c.col); });
  var idP = typeof rc.i === 'number' && rc.i >= 0 ? idDe(rc.tid, rc.i) : null;
  var lignes = idP ? lignesEnfants(tidE, b.ref, idP, b.sort) : [];
  var aligner = function (c) {
    if (c.align === 'right') { return 'p-num'; }
    if (c.align === 'center') { return 'p-cen'; }
    if (c.align === 'left') { return null; }
    return estNumerique(colonneChemin(tidE, c.col)) ? 'p-num' : null;
  };
  var entete = function () {
    return creer('thead', {}, [creer('tr', {}, cols.map(function (c) {
      return creer('th', { classe: aligner(c), texte: c.label || libelleChemin(tidE, c.col), attrs: { scope: 'col' } });
    }))]);
  };
  var coquille = function () {
    var corps = creer('tbody');
    var el = creer('div', { classe: 'p-u p-items' }, [creer('table', {}, [entete(), corps])]);
    return { el: el, conteneur: corps };
  };
  var s = coquille();
  lignes.forEach(function (j) {
    s.conteneur.appendChild(creer('tr', {}, cols.map(function (c) {
      var td = creer('td', { classe: aligner(c) });
      ajouterTexteMarque(td, valeurChemin(tidE, j, c.col, []).texte, {});
      return td;
    })));
  });
  if (!lignes.length) {
    s.conteneur.appendChild(creer('tr', { classe: 'p-items__vide' }, [creer('td', { texte: b.emptyText || 'No items.', attrs: { colspan: String(Math.max(1, cols.length)) } })]));
  }
  var queue = totauxLignes(b, tidE, lignes);
  if (queue) { s.el.appendChild(queue); }
  return [{ el: s.el, coupe: { conteneur: s.conteneur, queue: queue, coquille: coquille, minimum: 2 } }];
}

/* Totals: sum of the amount column; optional tax rate and grand total, in
   the amount column's format (currency of the document when the column has
   no currency of its own). */
function totauxLignes(b, tidE, lignes) {
  var mode = valeurDans(b.totals, ['none', 'sum', 'invoice'], 'none');
  var colM = b.amount ? infoColonne(tidE, b.amount) : null;
  if (mode === 'none' || !colM) { return null; }
  var somme = 0;
  var d = etat.donnees[tidE].d[b.amount] || [];
  lignes.forEach(function (j) { var v = valeurCellule(d[j]); if (typeof v === 'number' && isFinite(v)) { somme += v; } });
  var fmt = colM;
  if (mode === 'invoice' && !(colM.options && colM.options.numMode === 'currency')) { fmt = { type: 'Numeric', options: { numMode: 'currency' } }; }
  /* Amounts rounded to the decimals shown (half away from zero, without
     binary drift: 1.005 gives 1.01), so that subtotal + tax = total as
     printed. */
  var dec = Math.min(10, Math.max(0, Number(formatNombreDe(fmt).maximumFractionDigits) || 0));
  var arrondi = function (v) { var p = Math.pow(10, dec); return (v < 0 ? -1 : 1) * Math.round(Number((Math.abs(v) * p).toPrecision(15))) / p; };
  var f = function (v) { return formaterNombreCol(arrondi(v), fmt); };
  somme = arrondi(somme);
  var g = creer('div', { classe: 'p-totals' });
  var ligne = function (lib, val, grand) {
    g.appendChild(creer('div', { classe: 'p-totals__l' + (grand ? ' p-totals__l--grand' : ''), texte: lib }));
    g.appendChild(creer('div', { classe: 'p-totals__v' + (grand ? ' p-totals__v--grand' : ''), texte: val }));
  };
  if (mode === 'sum') {
    ligne(b.totalLabel || 'Total', f(somme), true);
    return g;
  }
  var taux = typeof b.taxRate === 'number' && isFinite(b.taxRate) ? b.taxRate : 0;
  if (taux > 0) {
    var taxe = arrondi(somme * taux / 100);
    ligne(b.subtotalLabel || 'Subtotal', f(somme));
    ligne((b.taxLabel || 'Tax') + ' (' + nombreLocale(taux, 3) + '%)', f(taxe));
    ligne(b.totalLabel || 'Total', f(somme + taxe), true);
  } else {
    ligne(b.totalLabel || 'Total', f(somme), true);
  }
  return g;
}

var RATIOS = { '50': ['1fr', '1fr'], '60': ['3fr', '2fr'], '40': ['2fr', '3fr'], '67': ['2fr', '1fr'], '33': ['1fr', '2fr'] };

function uniteColonnes(b, rc) {
  var r = RATIOS[b.ratio] || RATIOS['50'];
  var el = creer('div', { classe: 'p-u p-cols' });
  el.style.gridTemplateColumns = 'minmax(0, ' + r[0] + ') minmax(0, ' + r[1] + ')';
  var rempli = false;
  [b.left || [], b.right || []].forEach(function (liste) {
    var col = creer('div', { classe: 'p-col' });
    liste.forEach(function (sb) {
      if (sb.type === 'columns' || sb.type === 'items' || sb.type === 'pagebreak' || sb.type === 'footer') { return; }
      unitesBloc(sb, rc).forEach(function (u) { if (u.el) { col.appendChild(u.el); rempli = true; } });
    });
    el.appendChild(col);
  });
  return rempli ? [{ el: el }] : [];
}

function uniteSignature(b, rc) {

  var el = creer('div', { classe: 'p-u p-sig p-sig--' + al });

      ligne.style.marginTop = '4pt';

function construirePied(b, rc, geo) {
  var al = valeurDans(b.align, ['left', 'center', 'right'], 'left');
  var pied = creer('div', { classe: 'p-foot' + (al !== 'left' ? ' p-foot--' + al : '') });
  var txt = creer('div', { classe: 'p-foot__txt' });
  rendreRiche(txt, b.text, rc);
  pied.appendChild(txt);
  if (b.pageNumbers !== false) {
    pied.appendChild(creer('div', { classe: 'p-foot__num' }, ['Page ', creer('span', { classe: 'p-pn', attrs: { 'data-pn': 'page' } }), ' of ', creer('span', { classe: 'p-pn', attrs: { 'data-pn': 'pages' } })]));
  }

  pied.style.right = geo.m + 'px';
