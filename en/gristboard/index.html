<!DOCTYPE html>
<!--
  ============================================================================
  READ ME - Gristboard
  ============================================================================
  Version     : 1.0.0
  Date        : 2026-10-29
  Author      : madeXcé
  License     : MIT
  Platform    : Grist (custom widget)
  Compliance  : WCAG 2.1 AA (Section 508) | OWASP
  ============================================================================

  DESCRIPTION
  -----------
  Gristboard: dashboards in a few clicks. Indicators suggested from your
  tables, no summary tables, no formulas.
  One widget hosts all the dashboards of a document, shown as tabs; the
  last tab, "New dashboard", creates another one.

  A dashboard is READ-ONLY on your data: it never writes in your tables.
  Every figure is computed by the widget, in memory, from the rows it reads
  (fetchTable), once per refresh and cached per table.

  Creation is guided by a step bar: 1. Starting point, 2. Name and
  filters, 3. Tiles, 4. Review. Nothing is written to the document before
  "Create my dashboard", except the tables of a ready-made template, which
  are created only after confirmation (and offered for deletion if the
  wizard is abandoned). Two ways to start:
  - I already have data: dashboards suggested from the document's tables
    (a count, the sum of the main amount, a bar chart by the most useful
    choice column, a line over time, a donut, the latest rows), or connect
    to any table with smart column guessing (English and French names);
  - I don't have any data yet: six ready-made templates (Sales pipeline,
    Support tickets, Project portfolio health, Inventory, Event
    registrations, Budget tracking) that create their tables with sample
    rows, then a ready dashboard. Or a blank dashboard.
  Owners then edit directly in "Edit dashboard" mode: add, edit (side
  panel with live preview), duplicate, resize, reorder (drag and drop, or
  Move earlier / Move later buttons) and delete tiles; Undo.

  TILES
  -----
  KPI (count, sum, average, min, max, distinct count, sum of a product,
  average time between two dates, share of rows; filter, comparison with
  the previous period (to date while a period is in progress), target,
  prefix and suffix), KPI grid (one small
  indicator per category, colored against a target with words too), bar
  chart (vertical or horizontal, grouped or stacked by a second column),
  line or area chart over time (day, week, month, quarter, year;
  cumulative), donut ("Other" after N slices), radar (one axis per
  category or per numeric column, up to 3 series), table (top N rows, or a
  pivot), progress list (one bar per category against a target), text or
  heading, latest rows.
  Charts are drawn in plain SVG by the widget: axes, gridlines, value
  labels, tooltips on hover and on keyboard focus. Each tile has a "View
  data" table alternative and a CSV export. A click on a bar, a slice or a
  point lists the matching rows in a side panel (read-only).

  FILTERS
  -------
  A global filters row: period on a chosen date column (This week, This
  month, This quarter, This year, a given year, Last 12 months, Custom, All
  time) and up to 3 choice filters. A global filter applies to every tile
  whose table has a column with the same identifier. Each tile can add its
  own filters.

  HISTORY
  -------
  1.0.0 - 2026-10-29 - madeXcé - First public version.

  DEPENDENCIES
  ------------
  - Styling: self-contained madeXcé theme (Palm Springs palette on a
    Grist-like base; ui-* classes and design tokens on :root), no external
    stylesheet or web font.
  - Icons: Remix Icon (https://remixicon.com), embedded as SVG masks.
  - Charts: drawn by the widget in SVG, no chart library.
  - Grist Plugin API (grist-plugin-api.js), loaded from docs.getgrist.com:
    origin required by the platform, unversioned URL, so not covered by an
    SRI hash. No other external script.

  WHAT THE WIDGET WRITES IN THE DOCUMENT
  --------------------------------------
  📊 BOARD LIBRARY ⚡ (BOARD_LIBRARY_ after renaming): technical settings
  table, created with the first dashboard. One row per dashboard
  (KEY = CONFIG:<identifier>, VALUE = the configuration as JSON), plus two
  access marker rows (EDIT_ACCESS, SETTINGS_ACCESS). Columns KEY, VALUE,
  VERSION_CREATED, VERSION_UPDATED and the trigger formula metadata
  CREATED_AT, CREATED_BY, UPDATED_AT, UPDATED_BY (filled by Grist). It is
  excluded from the table lists.
  Template tables (Deals, Tickets, Projects, Items, Registrations,
  Expenses and Budget), only when the user picks a template and confirms.
  Nothing else: the user's tables are never written to, retyped or
  restructured. The pages Grist creates along with new tables are removed.

  FORMATS
  -------
  Dates, times, numbers and currency follow the document settings
  (_grist_DocInfo: time zone, locale, currency). Numbers and amounts use
  the document's own locale (de-DE: 8.008,00 €), with K, M, B and T as short
  forms; dates keep English month and day names in the order of the
  document's country. Typed numbers accept the locale's separators. Each
  date column keeps its own Grist format; number columns keep theirs
  (currency, percent, decimals). Periods (week, month...) start from today
  in the document time zone; a Date and time value falls in the period of
  the day its cell shows (the column's own time zone). Weeks start on
  Monday, or Sunday in the countries
  that use it (US, Canada, Mexico, Japan, Brazil...). Printing uses US Letter
  in North America, A4 elsewhere, landscape. CSV exports use ';' where the
  decimal separator is ','.

  RIGHTS AND RECOMMENDED ACCESS RULES
  -----------------------------------
  Viewers and editors view the dashboards, use the filters, open the data
  views and export. Owners create, edit and delete dashboards, once the
  access rules are in place (explained in the dashboard settings). The
  widget reads two marker rows of BOARD_LIBRARY (KEY equal to EDIT_ACCESS
  and SETTINGS_ACCESS); an access rule makes them unreadable to those who
  must not change the settings. Hiding is a convenience: real protection
  comes from the access rules and the document permissions.

  SECURITY
  --------
  - No dynamic code execution, no access to the parent frame.
  - No data is inserted as HTML: the DOM and the SVG charts are built with
    createElement(NS) and textContent.
  - Links in text tiles: only http, https and mailto, opened with
    rel="noopener noreferrer".
  - CSV export: cells starting with = + - @ are prefixed with an apostrophe
    (formula injection in spreadsheets).
  - Every API call has a timeout; errors are shown in plain words and
    logged with logSecurite().

  ACCESSIBILITY
  -------------
  Step bar, tabs, tiles and chart marks usable with the keyboard (arrow
  keys on line charts), tooltips on focus as on hover, a data table for
  every chart, announcements to screen readers, color never the only
  carrier of information (values, words and icons), keyboard alternative
  to drag and drop, prefers-reduced-motion respected, targets of 24 px or
  more.

  THEME
  -----
  The widget stays in the light theme, for consistency with the host
  application shown around the frame.
-->

/** Logging. Allowed levels: 'ERROR', 'WARNING', 'INFO'. */
function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERROR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'WARNING') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('WARNING', 'Loading overlay hidden automatically after 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Loading…'; }
  /* The overlay only appears past the threshold: a short operation no
     longer makes the screen flicker. masquerLoader cancels this delay, so
     the overlay is never shown for a quick operation. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight forces a reflow before the class is removed. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

var _minuterieErreur = null;

function afficherErreur(message, erreur) {
  logSecurite('ERROR', message, erreur);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message || 'An error occurred.'; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function masquerErreur() {
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); _minuterieErreur = null; }
  var bandeau = document.getElementById('wErreur');
  if (bandeau) { bandeau.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('WARNING', quoi, e); });
  }
  return promesse;
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if ((up.indexOf('LIBRARY') !== -1 || up.indexOf('BIBLIOTHEQUE') !== -1) && brut.charAt(brut.length - 1) === '_') { return true; }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

/* === SECTION : HEADER LOGO [EDITABLE : text and colors] ===

function dessinerLogo() {
  var c = document.getElementById('bandeau-logo');
  if (!c) { return; }
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 100 40');
  svg.setAttribute('class', 'w-logo');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'madeXcé');
  svg.setAttribute('focusable', 'false');
  var texte = document.createElementNS(ns, 'text');
  texte.setAttribute('x', '2');
  texte.setAttribute('y', '27');
  texte.setAttribute('font-size', '19');
  texte.setAttribute('textLength', '96');
  texte.setAttribute('lengthAdjust', 'spacingAndGlyphs');
  [['made', 'w-logo__made'], ['X', 'w-logo__x'], ['Cé', 'w-logo__ce']].forEach(function (morceau) {
    var t = document.createElementNS(ns, 'tspan');
    t.setAttribute('class', morceau[1]);
    t.textContent = morceau[0];
    texte.appendChild(t);
  });
  svg.appendChild(texte);
  c.textContent = '';
  c.appendChild(svg);
}

/* === SECTION : DOM UTILITIES ===
   The DOM is built with textContent: no data is ever inserted as HTML. */
function creer(tag, o, enfants) {
  var n = document.createElement(tag);
  o = o || {};
  if (o.classe) { n.className = o.classe; }
  if (o.id) { n.id = o.id; }
  if (o.texte !== undefined && o.texte !== null) { n.textContent = String(o.texte); }
  if (o.attrs) {
    Object.keys(o.attrs).forEach(function (k) {
      var v = o.attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      n.setAttribute(k, v === true ? '' : String(v));
    });
  }
  if (tag === 'button' && !n.hasAttribute('type')) { n.setAttribute('type', 'button'); }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') { n.setAttribute('autocomplete', 'off'); }
  if (o.valeur !== undefined && o.valeur !== null) { n.value = String(o.valeur); }
  if (o.coche) { n.checked = true; }
  if (o.clic) { n.addEventListener('click', o.clic); }
  if (o.change) { n.addEventListener('change', o.change); }
  if (o.saisie) { n.addEventListener('input', o.saisie); }
  (enfants || []).forEach(function (e) {
    if (e === null || e === undefined || e === false) { return; }
    n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
  });
  return n;
}

function bouton(libelle, variante, icone, clic, o) {
  o = o || {};
  var classes = ['ui-btn'];
  if (variante === 'secondaire') { classes.push('ui-btn--secondary'); }
  if (variante === 'tertiaire') { classes.push('ui-btn--tertiary'); }
  if (variante === 'discret') { classes.push('ui-btn--tertiary-no-outline'); }
  if (o.petit) { classes.push('ui-btn--sm'); }
  if (icone) { classes.push('ui-icon-' + icone); classes.push(o.iconeSeule ? 'ui-btn--icon-only' : (o.iconeDroite ? 'ui-btn--icon-right' : 'ui-btn--icon-left')); }
  if (o.classe) { classes.push(o.classe); }
  /* Icon-only button: its label is read only by screen readers, never
     displayed, whatever the styling. */
  var b = creer('button', { classe: classes.join(' '), texte: o.iconeSeule ? null : libelle, id: o.id,
    attrs: { 'aria-label': o.aria || null, disabled: o.desactive || null } }, o.iconeSeule ? [creer('span', { classe: 'ui-sr-only', texte: libelle })] : null);
  if (o.attrs) { Object.keys(o.attrs).forEach(function (k) { b.setAttribute(k, o.attrs[k]); }); }
  if (clic) {
    b.addEventListener('click', function (e) {
      var r = clic(e);
      if (r && typeof r.then === 'function') { relayer(r, 'Action: ' + libelle); }
    });
  }
  return b;
}

function badge(texte, variante) {
  return creer('span', { classe: 'ui-badge ui-badge--sm ui-badge--no-icon' + (variante ? ' ui-badge--' + variante : ''), texte: texte });
}

function groupeChamp(libelle, champ, aide, obligatoire) {
  var id = champ.id;
  var lab = creer('label', { classe: 'ui-label', attrs: { 'for': id } }, [libelle]);
  if (obligatoire) {
    lab.appendChild(document.createTextNode(' '));
    lab.appendChild(creer('span', { texte: '(required)', classe: 'w-mention', attrs: { 'aria-hidden': 'true' } }));
    champ.setAttribute('aria-required', 'true');
  }
  if (aide) { lab.appendChild(creer('span', { classe: 'ui-hint-text', texte: aide })); }
  return creer('div', { classe: 'ui-input-group' }, [lab, champ]);
}

function saisie(id, valeur, o) {
  o = o || {};
  if (o.multiligne) {
    return creer('textarea', { classe: 'ui-input', id: id, valeur: valeur || '', attrs: { rows: o.lignes || 3, placeholder: o.indice || null } });
  }
  return creer('input', { classe: 'ui-input', id: id, valeur: valeur || '',
    attrs: { type: o.type || 'text', placeholder: o.indice || null, inputmode: o.clavier || null } });
}

function liste(id, options, valeur, o) {
  o = o || {};
  var s = creer('select', { classe: 'ui-select', id: id });
  if (o.vide !== undefined) { s.appendChild(creer('option', { texte: o.vide, attrs: { value: '' } })); }
  options.forEach(function (op) {
    var opt = creer('option', { texte: op.libelle, attrs: { value: op.valeur } });
    if (String(op.valeur) === String(valeur)) { opt.selected = true; }
    s.appendChild(opt);
  });
  return s;
}

function choixDe(col) {

/* === SECTION : TABLE CREATION (canonical sequence) === */
async function poserFormules(tid, colonnes) {
  for (var i = 0; i < colonnes.length; i++) {
    var col = colonnes[i];
    if (!col.formula) { continue; }
    try {
      await agir([['ModifyColumn', tid, col.id, { isFormula: false, formula: col.formula,
        recalcWhen: col.recalcWhen === undefined ? 0 : col.recalcWhen, recalcDeps: null }]]);
    } catch (e) {

    }
  }

/* Free table identifier, computed the way the platform does it (numeric
   suffix starting at 2), so that tables referencing each other can be
   created in a single call. The actual identifier is always read back. */
function idTableLibre(base, reserves) {
  var pris = Object.keys(etat.meta.tables).concat(reserves || []).map(function (x) { return x.toUpperCase(); });
  var id = base;
  var n = 2;
  while (pris.indexOf(id.toUpperCase()) !== -1) { id = base + n; n++; }
  return id;
}

/* Creation sequence: tables created in a single call with id, type and
   label only; the pages the platform creates along with them are removed
   right away, in a single call, before any other preparation, so they only
   show for an instant; then formulas one by one and column options. */
async function creerTables(defs) {
  var ret = await agir(defs.map(function (d) {
    return ['AddTable', d.id, d.colonnes.map(function (c) { return { id: c.id, type: typeAvecFuseau(c.type), label: c.label || c.id }; })];
  }));
  var rv = ret && ret.retValues ? ret.retValues : [];
  var tids = defs.map(function (d, i) { return rv[i] && rv[i].table_id ? rv[i].table_id : d.id; });
  var vues = [];
  rv.forEach(function (r) { if (r && Array.isArray(r.views)) { r.views.forEach(function (v) { if (v && v.id) { vues.push(v.id); } }); } });
  if (!vues.length) {
    await chargerMeta();
    tids.forEach(function (t) { var m = etat.meta.tables[t]; if (m && m.primaryViewId) { vues.push(m.primaryViewId); } });
  }
  if (vues.length) {
    try {
      await agir(vues.map(function (v) { return ['RemoveRecord', '_grist_Views', v]; }));
    } catch (e) {
      logSecurite('INFO', 'Could not remove the auto-created pages', e);
    }
  }
  for (var i = 0; i < defs.length; i++) {
    await poserFormules(tids[i], defs[i].colonnes);
    for (var k = 0; k < defs[i].colonnes.length; k++) {
      var c = defs[i].colonnes[k];
      if (!c.widgetOptions) { continue; }
      try {
        await agir([['ModifyColumn', tids[i], c.id, { widgetOptions: JSON.stringify(c.widgetOptions) }]]);
      } catch (e) {
        logSecurite('WARNING', 'Options not set on ' + c.id, e);
      }
    }
  }
  return tids;
}

/* Adding a column in two steps: created bare, then typed. Each step is
   protected separately. The actual identifier is read back after creation. */
async function ajouterColonne(tid, colId, type, widgetOptions) {
  var ret = await agir([['AddColumn', tid, colId, {}]]);
  var reel = colId;
  if (ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId) { reel = ret.retValues[0].colId; }
  /* isFormula: false is required: without it, the platform leaves the added

    await agir([['ModifyColumn', tid, reel, propr]]);
  } catch (e) {
    logSecurite('WARNING', 'Column ' + reel + ' created but not typed', e);

/* === SECTION : BOARD LIBRARY === */
async function reparerSchemaBiblio() {
  if (!etat.biblio) { return; }
  try {
    await chargerMeta();
    for (var k = 0; k < COLONNES_BIBLIO.length; k++) {
      var col = COLONNES_BIBLIO[k];
      var ex = infoColonne(etat.biblio, col.id);
      if (!ex) {
        var creee = false;
        try { await agir([['AddColumn', etat.biblio, col.id, {}]]); creee = true; } catch (e) { logSecurite('INFO', 'Column ' + col.id + ' not added', e); }
        if (creee) {
          var propr = { type: typeAvecFuseau(col.type), label: col.label, isFormula: false };
          if (col.formula) { propr.formula = col.formula; propr.recalcWhen = col.recalcWhen; propr.recalcDeps = null; }
          try { await agir([['ModifyColumn', etat.biblio, col.id, propr]]); } catch (e2) { logSecurite('INFO', 'Column ' + col.id + ' not typed', e2); }
        }
      } else if (col.formula && String(ex.formula).trim() !== col.formula) {

        } catch (e3) { logSecurite('INFO', 'Formula not restored on ' + col.id, e3); }

async function assurerBibliotheque() {
  await chargerMeta();
  var trouvee = trouverTable(ID_BIBLIO);
  if (trouvee) {
    etat.biblio = trouvee;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  await chargerMeta();
  var entreTemps = trouverTable(ID_BIBLIO);
  if (entreTemps) {
    etat.biblio = entreTemps;
    await reparerSchemaBiblio();
    return etat.biblio;
  }

/* After creation, the library gets its display name; its identifier is
   read back, since renaming may change it. */
async function finaliserBibliotheque(tid) {
  etat.biblio = tid;
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    if (t && t.rawViewSectionRef) {
      await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { title: LABEL_BIBLIO }]]);
    }
    await chargerMeta();
    var relu = trouverTable(ID_BIBLIO);
    if (relu) { etat.biblio = relu; }

/* === SECTION: MODALS ===

function elementsFocusables(racine) {

    function (n) { return !n.disabled && n.offsetParent !== null; });
}

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    var premier = f[0];
    var dernier = f[f.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }

/* Step bar: one segment per step, its name below. Blue for completed steps

    creer('span', { classe: 'ui-stepper__state', texte: connu ? 'Step ' + n + ' of ' + noms.length : 'Step ' + n })]));

        creer('span', { classe: 'w-etapes__nom', texte: nom })]),

      suivante ? creer('span', { classe: 'w-etapes__appel' }, ['Continue', creer('span', { classe: 'ui-icon-arrow-right-line ui-icon--sm', attrs: { 'aria-hidden': 'true' } })]) : null];
    var li = creer('li', { classe: 'w-etapes__item w-etapes__item--' + etatEtape + (action ? ' w-etapes__item--lien' : '') + (suivante ? ' w-etapes__item--suivante' : '') },

/* Rejected input: design system error message below the field, linked
   with aria-describedby, focus on the field and announcement. This is not
   an anomaly: logged at INFO level. */
function marquerInvalide(id, message, sansFocus) {
  var n = document.getElementById(id);
  logSecurite('INFO', 'Input rejected: ' + message);
  if (!n) { signalerSaisie(message); return; }
  var idMsg = id + '_erreur';
  var ancien = document.getElementById(idMsg);
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  var msg = creer('p', { classe: 'ui-error-text', id: idMsg, texte: message });
  var groupe = n.closest ? n.closest('.ui-input-group') : null;
  if (groupe) { groupe.classList.add('ui-input-group--error'); groupe.appendChild(msg); }
  else if (n.parentNode) { n.parentNode.insertBefore(msg, n.nextSibling); }
  n.setAttribute('aria-invalid', 'true');
  n.setAttribute('aria-describedby', idMsg);
  var effacer = function () {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
    if (groupe) { groupe.classList.remove('ui-input-group--error'); }
    if (msg.parentNode) { msg.parentNode.removeChild(msg); }
    n.removeEventListener('input', effacer);
    n.removeEventListener('change', effacer);
  };
  n.addEventListener('input', effacer);
  n.addEventListener('change', effacer);
  if (!sansFocus) { n.focus(); }
  annoncer(message);
}

/* === SECTION: AGGREGATION ENGINE [DO NOT EDIT] ===
   Everything is computed in the widget, in memory, from the rows read with
   fetchTable: no summary table, no formula. Tables are read once per
   refresh and cached (etat.donnees); readers, row selections and groupings
   are cached for the duration of one refresh (etat.calc), so a dashboard of
   ten tiles on 50,000 rows stays smooth. Nothing is ever written. */

function nouveauCalcul() { etat.calc = { lecteurs: {}, selections: {}, refs: {} }; }

/* Kind of a column, for the engine. */
function genreCol(col) {
  if (!col) { return 'autre'; }
  var t = String(col.type || '');
  if (t === 'Numeric' || t === 'Int') { return 'num'; }
  if (t === 'Bool') { return 'bool'; }
  if (t === 'Date') { return 'date'; }
  if (t.indexOf('DateTime') === 0) { return 'datetime'; }
  if (t === 'Choice') { return 'choice'; }
  if (t === 'ChoiceList') { return 'choicelist'; }
  if (t.indexOf('Ref:') === 0) { return 'ref'; }
  if (t.indexOf('RefList:') === 0) { return 'reflist'; }
  if (t === 'Text' || t === 'Any') { return 'text'; }
  return 'autre';
}
function estDate(col) { var g = genreCol(col); return g === 'date' || g === 'datetime'; }
function estNum(col) { return genreCol(col) === 'num'; }
function estCategorie(col) { return ['choice', 'choicelist', 'ref', 'reflist', 'text', 'bool'].indexOf(genreCol(col)) !== -1; }
function estListe(col) { var g = genreCol(col); return g === 'choicelist' || g === 'reflist'; }

/* Columns a user can pick: no hidden helpers, no attachments. */
function colonnesUtiles(tid) {
  return colonnesDe(tid).filter(function (c) { return genreCol(c) !== 'autre' && c.colId !== 'id'; });
}
function libCol(tid, colId) { var c = infoColonne(tid, colId); return c ? (c.label || c.colId) : String(colId || ''); }

function nbLignes(tid) { var d = etat.donnees[tid]; return d && d.id ? d.id.length : 0; }

/* Display values of a referenced table (visible column). */
function carteRef(col) {
  var cible = tableCibleRef(col.type);
  var aff = colAffichageRef(col);
  var cle = cible + '|' + (aff || '');
  if (etat.calc.refs[cle]) { return etat.calc.refs[cle]; }

/* Fingerprint of the data read: a re-read that changes nothing does not

    var d = etat.donnees[tid];

    Object.keys(d).sort().forEach(function (c) {

    var stamp = document.getElementById('gStamp');

    if (etat.empreinte === avant && !manuel && !renomme) { return; }
    if (etat.vue === 'tableau' && !etat.modaleOuverte) {
      var actif = document.activeElement;
      var idActif = actif && actif.id ? actif.id : null;
      afficherVue('tableau', true);
      if (idActif && document.getElementById(idActif)) { document.getElementById(idActif).focus({ preventScroll: true }); }
      if (manuel) { annoncer('Dashboard refreshed.'); }

/* Creates the tables of a template, with or without sample rows, using
   the canonical sequence; returns the actual table identifiers. */
async function creerTablesModele(m, avecExemples) {
  await chargerMeta();
  var reserves = [];
  var defs = m.tables.map(function (t) { var id = idTableLibre(t.id, reserves); reserves.push(id); return { id: id, colonnes: t.colonnes }; });
  var tids = await creerTables(defs);
  var T = {};
  m.tables.forEach(function (t, i) { T[t.id] = tids[i]; });
  if (avecExemples) {
    var r = aleatoire(20261029);
    var t0 = aujourdhuiLocal();
    var actions = [];
    m.tables.forEach(function (t, i) {
      var lignes = t.lignes(r, t0);
      if (!lignes.length) { return; }
      var cols = {};
      t.colonnes.forEach(function (c) { cols[c.id] = lignes.map(function (l) { return l[c.id] === undefined ? null : l[c.id]; }); });
      actions.push(['BulkAddRecord', tids[i], lignes.map(function () { return null; }), cols]);
    });
    if (actions.length) { await agir(actions); }
  }
  await chargerMeta();
  return T;
}

/* === SECTION: SETUP WIZARD ===
   Lighter than a Kanban's, because the dashboard editor itself is the main
   configuration surface: 1. Starting point, 2. Name and filters, 3. Tiles,
   4. Review. Everything happens on a draft: nothing is written before
   "Create my dashboard", except the tables of a template (confirmed first,
   offered for deletion if the wizard is abandoned). Settings reopen the
   same steps on a copy of the dashboard. */
var ETAPES_CREATION = ['Starting point', 'Name and filters', 'Tiles', 'Review'];
var ETAPES_PARAMETRAGE = ['Name and filters', 'Tiles', 'Review'];

function demarrerCreation() {
  if (!etat.peutParametrer) { return; }
  etat.filtres = null;
  etat.brouillon = { mode: 'creation', etape: 1, choix: null, cfg: null, tablesCreees: [], annuler: [], etapeMax: 1 };
  afficherVue('assistant');
}
function ouvrirParametrage() {
  if (!etat.peutParametrer || !etat.config) { return; }
  var cfg = cloner(etat.config);
  etat.filtres = null;
  etat.edition = false;
  etat.brouillon = { mode: 'parametrage', etape: 1, cfg: cfg, tablesCreees: [], annuler: [], etapeMax: 3, initial: JSON.stringify(cfg) };
  afficherVue('assistant');
}
function etapesBrouillon(b) { return b.mode === 'creation' ? ETAPES_CREATION : ETAPES_PARAMETRAGE; }
/* Step code: the same screens in both paths, shifted by one in settings. */
function codeEtape(b) { var n = b.mode === 'creation' ? b.etape : b.etape + 1; return ['', 'depart', 'nom', 'tuiles', 'verifier'][n]; }

/* Leaving the wizard. Returns true if it was left. */
async function quitterAssistant(versAutre) {
  var b = etat.brouillon;
  if (!b) { return true; }
  if (b.mode === 'parametrage') {
    if (JSON.stringify(b.cfg) !== b.initial) {
      var ok0 = await confirmerAction('Leave without saving?', 'Your changes to the settings of this dashboard will not be kept.', 'Leave without saving');
      if (!ok0) { return false; }
    }
  } else if (b.cfg || b.tablesCreees.length) {
    var ok = await confirmerAction('Abandon the new dashboard?', 'Nothing has been saved for this dashboard. The choices made in these steps are not kept.', 'Abandon');
    if (!ok) { return false; }
    if (b.tablesCreees.length) {
      var noms = b.tablesCreees.map(libelleTable).join(', ');
      var sup = await confirmerAction('Also delete the template tables?', 'The widget created ' + (b.tablesCreees.length > 1 ? 'the tables ' : 'the table ') + noms + ' for this template. Delete ' + (b.tablesCreees.length > 1 ? 'them' : 'it') + ' with their rows? Choose Cancel to keep ' + (b.tablesCreees.length > 1 ? 'them' : 'it') + '.', 'Delete the tables');
      if (sup) {
        try { await agir(b.tablesCreees.map(function (t) { return ['RemoveTable', t]; })); annoncer('Template tables deleted.'); }
        catch (e) { afficherErreur('The template tables could not be deleted. You can delete them in Raw data.', e); }
      }
    }
  }
  etat.brouillon = null;
  if (!versAutre) {
    afficherLoader('Loading…');
    try { await chargerTout(); } finally { masquerLoader(); }
  }
  return true;
}

function rendreAssistant(zone) {
  var b = etat.brouillon;
  var noms = etapesBrouillon(b);
  var code = codeEtape(b);
  var bloc = creer('div', { classe: 'w-assistant' });
  var finale = code === 'verifier' ? { libelle: b.mode === 'creation' ? 'Create my dashboard' : 'Save changes', action: b.mode === 'creation' ? creerTableau : enregistrerParametrage, id: 'gValider' } : null;
  var tete = creer('div', { classe: 'w-assistant__tete' }, [stepper(b.etape, noms, function (r) {
    if (r > b.etapeMax + (b.mode === 'creation' ? 0 : 1)) { return null; }
    if (b.mode === 'creation' && r > 1 && !b.cfg) { return null; }
    return function () { if (r > b.etape && !validerEtape()) { return; } return allerEtape(r); };
  }, finale)]);
  var cote = creer('div', { classe: 'w-assistant__etat' });

  if (code === 'depart') { rendreDepart(bloc); }

  afficherLoader('Deleting the dashboard…');
  try {
    if (etat.biblioLigne) { await agir([['RemoveRecord', etat.biblio, etat.biblioLigne]]); }
    etat.brouillon = null;
    etat.config = null; etat.biblioLigne = null; etat.tableauSession = null; etat.tableauMemorise = null;
    ecrireStockage('', null);
    await chargerTout();
    masquerLoader();
    afficherSucces('Dashboard "' + nom + '" deleted.');
  } catch (e) {
    masquerLoader();
    afficherErreur('The dashboard could not be deleted.', e);
  }
}

/* === SECTION: LISTENERS AND STARTUP === */
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
dessinerLogo();
document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
document.getElementById('contenu').addEventListener('scroll', cacherBulle, { passive: true });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.vue === 'tableau' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(true), 'Re-read on returning to the page'); }
});
window.addEventListener('beforeprint', function () { cacherBulle(); });

grist.ready({ requiredAccess: 'full', columns: [], allowSelectBy: true });
/* Changes to the table linked to the view are notified: a debounced
   re-read follows. Other tables are re-read every 20 seconds. */
grist.onRecords(function () { planifierRafraichissement(); });

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) {
    logSecurite('ERROR', 'Unhandled rejected promise', evt ? evt.reason : undefined);
  });
}, 1500);

relayer(initializer(), 'Initialisation');
demarrerActualisationAuto();

</script>
