<!DOCTYPE html>
<!--
  ============================================================================
  READ ME - Gristverse
  ============================================================================
  Version     : 2.0.0-en
  Date        : 30/10/2026

  Compliance  : WCAG 2.1 AA (Section 508) | OWASP

  DESCRIPTION
  -----------
  Gristverse is the team's virtual office, drawn in pixel art (top-down
  view) from the tables of the document. It is self-contained: it is
  installed and set up directly in the widget, without touching the code.
  Everything specific to a team (sites, people, desk layout, rooms shown,
  chat channel) is stored in its settings, not in the code.

  SEVERAL VERSES (TABS)
  - One widget hosts several verses, one tab each (a department, a
    subsidiary, a site...); the last tab, "New verse" (owners), adds one.
  - Each verse has its own settings row: buildings, desk layouts, rooms,
    chat channel, fun extras, display. The tables are shared: a verse is a
    filter on the team (a column of the Team table and one or more values,
    or everyone). Presence, tasks and activities follow its people.
  - Meetings: all of them in a verse without filter or without a
    participants column; otherwise a meeting shows when at least one
    participant belongs to the verse (by reference, or by name or emoji in
    a text column), and a meeting without participants shows everywhere.
  - Resources and projects: shared, or limited in a verse to the rows whose
    chosen column has one of the ticked values ("The rooms" step).
  - A new verse starts from the existing tables (default) with a "Who is in
    this verse?" step and a live count, or with new tables (a fully
    independent verse). "Delete this verse" erases only its settings (and
    its plant, dog and trophies), never a table. The last tab viewed is
    remembered on this browser.
  - A 1.x installation becomes the first verse ("Everyone"): nothing to redo.

  PEOPLE
  - Each person has a little pixel art character (skin tone, hairstyle,
    hair and clothes colors chosen from their row id) and their first name
    below ("Sam B." when two people share a first name). The emoji is
    optional: a badge next to the first name, or alone, depending on the
    verse setting "Show people as".
  - Rides, desks, trophies and Avane's "last fed by" are attached to the
    team row id: changing a name or an emoji loses nothing (1.x settings,
    keyed by emoji or name, are carried over once, automatically).

  LARGE TEAMS
  - A map square never gets smaller than TUILE_MIN_PX: beyond that, the map
    keeps its size and the content area scrolls (its scrollbar gutter is
    always reserved, so the map never "zooms").
  - Beyond about MAISONS_PAR_RANGEE houses (and islands) per row, they wrap
    onto several rows, each with its walkway; office wings grow wider
    rather than ever deeper.

  THE PLAN
  - One building per site, with one desk per person in the building of
    their usual site; desk layout automatic or set square by square.
  - The common area: reception, meeting room, project library.
  - Outside: one house per person (working remotely) and one island per
    person (absence).
  - Each person has their name at their three places, grayed out where
    they are not: a click on their greyed-out name declares them there,
    and the character walks over (with their ride: on foot, bike or
    scooter).

  THE ROOMS (each optional, linked to a table of the document)
  - Each person's desk: where they work, day by day or by period; their
    tasks (desk flipchart), to tick off or add; their activities (hours
    per project or non-project) and their monthly timesheet; their
    meetings.
  - Meeting room: today's meetings on the board, the meetings week by
    week in the room, reminder 15 minutes before, video call button, TV
    that opens the chat channel.
  - Resources: books on the reception shelves, search, pinned first,
    link opened in a new tab.
  - Project library: one shelf per status, one binder per project, one
    project card per project, the whole library from the room name;
    schedule board (project timeline, one row per person).
  - Reception: "who is where" schedule, with the total per site and per
    day.

  MANAGING EVERYTHING FROM THE WIDGET (editors)
  Everything Gristverse shows can be created, edited and deleted from the
  widget, without going to the tables:
  - meetings ("New meeting" in the meeting room and in each desk; Edit and
    Delete on each meeting);
  - the team ("Add a person" at reception; "Edit details" and "Remove from
    the team" in each desk; ride and desk are stored in the settings);
  - tasks (add, tick, edit, delete), resources and projects (new, edit,
    delete), activities (add, edit, delete), presence (a day, a period:
    declare, edit, delete; "Clear" a day).
  Forms are built from the columns each room is connected to; calculated
  columns are never written; only the fields that changed are written.
  Every deletion is confirmed and deletes only the row named; nothing else
  is deleted automatically (removing a person keeps their presence,
  tasks, meetings and activities). Attachments stay managed in Grist.
  Viewers, and editors whose write is refused, see no editing control.

  INSTALLATION (setup wizard, full access only)
  1. The template: two sites, one site or custom; rooms shown; optional
     sample data.
  2. The team: sites (with the display name of each building) and people
     (name, emoji, site, ride); an existing table can be reused.
  3. The rooms: for each one, a table created by Gristverse or a table of
     the document (columns suggested from their name, type and content);
     chat channel; location of the schedule.
  4. The desks: desk layout of each site (clickable grid and equivalent
     keyboard-friendly table).
  5. Ready: summary, then "Open Gristverse".
  "Settings" reopens the same steps.

  TABLES CREATED BY GRISTVERSE (depending on the rooms chosen)
  - 👥 Team (TEAM): NAME, EMOJI, SITE (usual site).
  - 📍 Presence (PRESENCE): PERSON (reference), FROM_DATE, TO_DATE,
    LOCATION, NOTE.
    Locations: the sites, Remote, Absent. Without a declaration, everyone is at their usual
    site; the shortest declaration wins (a specific day wins over a
    period).
  - 📺 Meetings, 📝 Tasks, 📚 Resources, 🗄️ Projects, 🗂️ Activities: created
    only if the room is chosen without an existing table.
  - 🌐 GRISTVERSE LIBRARY ⚡ (GRISTVERSE_LIBRARY_): one settings row per
    verse (KEY = CONFIG:<id>, VALUE = JSON; the first verse of a 1.x
    install keeps CONFIG:GRISTVERSE), and the small shared states of the
    Fun extras of each verse (KEY = PLANT:<id>, DOG:<id>, TROPHIES:<id>).
    Technical table, never offered as a data table.
  Existing tables are never restructured: the widget only creates, edits
  and deletes rows in the connected tables (when someone does it from the
  widget), and never changes their columns.

  ACTIVITY TIMESHEET
  Always a full month: total per project in hours and in days
  (HEURES_PAR_JOUR), running total per project since the start, day by
  day detail. Duplicates flagged "duplicate", never deleted automatically.
  "PDF timesheet": A4 sheet (US Letter in North America) in the person's name, printed through the
  browser's print dialog ("Save as PDF"). The "Contract holder" line comes
  from the optional EMPLOYER column of the Team table; the "Work carried
  out for" line comes from MISSION_POUR (empty by default). A line without
  a value is not written.

  DEPENDENCIES
  ------------
  - Styling: self-contained neutral theme (ui-* classes, design tokens on
    :root), no external stylesheet or web font.
  - Icons: Remix Icon (https://remixicon.com), embedded as SVG masks.
  - Grist Plugin API (grist-plugin-api.js), origin imposed by the
    platform, unversioned URL, so not covered by an SRI hash
  - pdf.js v6.2.108, legacy build (preview of attached PDFs), loaded on
    demand: each file is only executed after its SHA-256 hash has been
    checked (the equivalent of the integrity attribute)

  SECURITY
  --------
  - Content inserted with textContent only; logo drawn element by
    element (createElementNS).
  - Attachments: read-only; files fetched as Blob, access token never in
    a link of the page; preview limited to raster images and PDFs, type
    forced from the extension.
  - Links: http and https only (javascript:, data:, file:... are never
    opened), opened through a temporary link with noopener and noreferrer
    (no window.open).
  - Access level granted read through grist.onOptions: without full
    access, read-only mode is announced and any write is refused.
  - Fine-grained rights (who edits which rows) are set through the
    document's access rules (ACL).
  - Logging through logSecurite(), neutral error messages.

  ACCESSIBILITY
  - Each desk and each room is a keyboard-accessible button (Tab, Enter)
    with a full name (person, place, tasks...).
  - "List": text alternative to the plan.
  - Desk layout: table equivalent to the clickable grid.
  - Side panels with focus trap, Escape to close.
  - Animations turned off when the user agent requests reduced motion.

  DOCUMENTED EXCEPTIONS TO THE STYLE GUIDE
  - The plan is an illustration: its colors (drawings, labels and
    bubbles placed on the plan) are hard-coded. Information is never
    conveyed by color alone.
  - Plan labels follow the zoom: their text size is computed (clamp)
    from the size of a square.
  - Emojis in the schedule are enlarged to stay readable.
  - The PDF timesheet sheet uses print units (pt, mm) and its own
    colors.

  GUIDE TO EDITING THE CODE
  -------------------------
  [EDITABLE]    : settings that can be changed safely (colors, texts,
                  thresholds, drawings).
  [DO NOT EDIT] : widget mechanics, not to be modified.

  FUN EXTRAS (Settings, step "The template": on by default, each one can be turned off)
  - Decor through the day and seasons: the map follows the time of day in the
    document's time zone (dawn, day, dusk, night, lit windows) and the season
    (snow, autumn leaves, spring blossoms; opposite seasons in the southern
    hemisphere); a beach umbrella and a deckchair at reception on the last
    working day afternoon (Thursday where the weekend is Friday and Saturday).
  - Team plant: in the project library's reading corner (at reception
    without that room); each editor can water it once a day (the watering
    can); it grows over the weeks, and droops a little when forgotten
    (never dies). Nobody is asked who they are: "me" is the person last
    clicked on the map to declare a presence on this browser.
  - Office dog: Avane wanders around reception, waits by her bowl, naps next to
    the desk of the last person who fed her. Editors can feed her as often as they like.
    She lives in one verse (by default the first one), always at the same size.
  - Celebrations: confetti when a task is ticked, a trophy on the desk when all
    of a person's tasks are done.
  - A hidden surprise.
  No text on the map: screen readers get the same information through the
  accessible names and announcements. Shared states are stored in the
  settings table, per verse (rows KEY = PLANT:<id>, DOG:<id>, TROPHIES:<id>). The office dog is called
  Avane, in memory of a beige Labrador puppy who was part of the team.

  HISTORY
  -------
  2.0.0 - 2026-10-30 - madeXcé - Several verses as tabs (one per department, subsidiary or site), people shown by first name with an optional emoji, settings attached to each person, maps that stay readable for large teams.
  1.4.0 - 2026-10-30 - madeXcé - Fun extras: day and night, seasons, Friday afternoon, the team plant, task confetti and trophy, Avane the office dog and Avane's bowl, varied houses and islands, a hidden surprise. The map toolbar moves into the header bar on wide screens (more height for the map).
  1.3.0 - 2026-10-30 - madeXcé - Manage everything from the widget: meetings, team, tasks, resources, projects, activities and presence periods (create, edit, delete).
  1.2.0-en - 29/10/2026 - madeXcé - English international edition: English interface, madeXcé theme (Palm Springs on a Grist-like base) instead of the French government design system, English table and column identifiers.
  1.2.0 - 29/10/2026 - madeXcé - Attachments.
          - Project card: an "Attachments" column chosen among the card
            fields shows its files (before: numbers).
          - Reception resources: new optional "Attached file" column; its
            files are shown under the resource.
          - Viewer: preview of images and PDFs (rendered by pdf.js, also in
            Firefox), full screen, download of other files. Read-only.
          - Tables created by Gristverse: FILE column (Resources) and
            DOCUMENTS column (Projects, shown in the project card).
  1.1.0 - 29/10/2026 - madeXcé - Absences, timesheet and opening.
          - Desk, "Where I work" tab: list of all recorded periods
            (working days, past, ongoing or upcoming), duplicates flagged
            "duplicate"; an identical period is no longer recorded.
          - Monthly timesheet: absence days count for HEURES_PAR_JOUR
            hours; the total is compared with the working days of the month
            (weekends and public holidays removed), with the missing days; an
            absence day with activities is flagged. Absences also in the
            copy, the CSV and the PDF timesheet.
          - Empty map fixed: if the table referenced by the task owner
            column cannot be read (access rules), everything is still
            shown and tasks are matched by name or emoji.
          - Opening robust to Grist slowness: the map is shown as soon as
            the light tables are read, projects and resources arrive next;
            a slow read is no longer retried in a loop; the project library
            is drawn on opening.
          - Tasks sorted by status everywhere (in progress, to do, others,
            on hold), then by due date.
  1.0.0 - 29/10/2026 - madeXcé - First public release.

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gristverse</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
  /* === SECTION : DESIGN TOKENS AND BASE COMPONENTS ===
     Self-contained neutral theme: no external stylesheet, no web font.
     The ui-* classes cover only the components this widget uses.
     [EDITABLE] colors below (keep text contrast at 4.5:1 or more). */
    :root {
      /* Base, in the spirit of Grist's own interface */
      --background-default-grey: #ffffff; --background-default-grey-hover: #f2f2f5; --background-alt-grey: #f7f7f9;
      --background-contrast-grey: #efeff3; --text-default-grey: #262633; --text-title-grey: #262633; --text-mention-grey: #6b6b7b;
      --text-inverted-grey: #ffffff; --border-default-grey: #d9d9e0; --border-plain-grey: #9d9dab;
      /* madeXcé signature, Palm Springs: turquoise for every action */
      --text-title-primary: #0e7490; --text-action-high-primary: #0e7490; --text-active-primary: #0b5a70; --text-inverted-primary: #ffffff;
      --background-action-high-primary: #0e7490; --background-action-high-primary-hover: #0b5a70; --background-action-low-primary: #e0f4f8;
      --background-alt-primary: #f0fafc; --background-active-primary: #0e7490; --border-action-high-primary: #0e7490; --border-active-primary: #0e7490;
      --background-alt-accent: #fff8e1;
      /* Accents: flamingo (logo X, urgent) and lemon (small highlights only, never text) */
      --text-label-accent-pink: #d6336c; --accent-flamingo: #d6336c; --accent-lemon: #ffc93c;
      --text-default-error: #c9191e; --border-plain-error: #c9191e; --background-contrast-error: #fdecec;
      --text-default-warning: #b34000; --border-plain-warning: #b34000; --background-contrast-warning: #fff1e6;
      /* Success: a darker Grist green, readable on white */
      --text-default-success: #12805c; --background-flat-success: #12805c;
      --focus-ring: #0e7490;
      --radius-control: 6px; --radius-card: 10px;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html { font-family: var(--font-ui); line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .ui-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .ui-h4 { font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: var(--text-title-grey); margin: 0 0 1rem; }
    .ui-h6 { font-size: 1.125rem; line-height: 1.5rem; font-weight: 700; color: var(--text-title-grey); margin: 0 0 .75rem; }
    .ui-text--regular { font-weight: 400; }
    .ui-mt-1v { margin-top: .25rem !important; } .ui-mt-1w { margin-top: .5rem !important; } .ui-mt-2w { margin-top: 1rem !important; }
    .ui-mt-3w { margin-top: 1.5rem !important; } .ui-mb-0 { margin-bottom: 0 !important; } .ui-mb-1w { margin-bottom: .5rem !important; }

    /* Buttons */
    .ui-btn { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.5rem; padding: .5rem 1rem; border: 0; border-radius: var(--radius-control);
      background: var(--background-action-high-primary); color: var(--text-inverted-primary); font-size: 1rem; font-weight: 500; line-height: 1.5rem;
      cursor: pointer; text-align: left; text-decoration: none; }
    .ui-btn:hover { background: var(--background-action-high-primary-hover); }
    .ui-btn--sm { min-height: 2rem; padding: .25rem .75rem; font-size: .875rem; line-height: 1.5rem; }
    .ui-btn--secondary { background: var(--background-default-grey); color: var(--text-action-high-primary); box-shadow: inset 0 0 0 1px var(--border-default-grey); font-weight: 600; }
    .ui-btn--tertiary { background: var(--background-default-grey); color: var(--text-action-high-primary); box-shadow: inset 0 0 0 1px var(--border-default-grey); }
    .ui-btn--tertiary-no-outline { background: transparent; color: var(--text-action-high-primary); }
    .ui-btn--secondary:hover, .ui-btn--tertiary:hover, .ui-btn--tertiary-no-outline:hover { background: var(--background-default-grey-hover); }
    .ui-btn:disabled, .ui-btn[disabled] { background: #e5e5e5; color: #757575; box-shadow: none; cursor: not-allowed; }
    .ui-btn--secondary:disabled, .ui-btn--tertiary:disabled, .ui-btn--tertiary-no-outline:disabled { background: transparent; color: #929292; box-shadow: inset 0 0 0 1px #e5e5e5; }
    .ui-btn--icon-only { justify-content: center; width: 2.5rem; padding: 0; }
    .ui-btn--icon-only.ui-btn--sm { width: 2rem; }
    .ui-btn--icon-right { flex-direction: row-reverse; }

    /* Icons (Remix Icon, drawn as masks in the current text color) */
    [class*="ui-icon-"]::before { content: ""; display: inline-block; flex: 0 0 auto; width: 1.5rem; height: 1.5rem; vertical-align: -.375rem;
      background-color: currentColor; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .ui-btn[class*="ui-icon-"]::before, .ui-icon--sm::before { width: 1rem; height: 1rem; vertical-align: -.125rem; }
    .ui-btn:not(.ui-btn--sm)[class*="ui-icon-"]::before { width: 1.25rem; height: 1.25rem; }

    /* Form fields */
    .ui-label { display: block; color: var(--text-title-grey); font-size: 1rem; line-height: 1.5rem; }
    .ui-hint-text { display: block; color: var(--text-mention-grey); font-size: .75rem; line-height: 1.25rem; font-weight: 400; }
    .ui-input-group { margin-bottom: 1rem; }
    .ui-input, .ui-select { display: block; width: 100%; margin-top: .375rem; padding: .375rem .625rem; border: 1px solid var(--border-default-grey); border-radius: var(--radius-control);
      background: var(--background-default-grey); color: var(--text-default-grey); font-size: .9375rem; line-height: 1.5rem; }
    .ui-input:focus, .ui-select:focus { outline: none; border-color: var(--border-action-high-primary); box-shadow: 0 0 0 3px var(--background-action-low-primary); }
    .ui-select { appearance: auto; }
    .ui-fieldset { border: 0; margin: 0 0 1rem; padding: 0; min-width: 0; }
    .ui-fieldset__legend { font-weight: 700; color: var(--text-title-grey); padding: 0; margin-bottom: .5rem; }
    .ui-checkbox-group, .ui-radio-group { display: flex; align-items: flex-start; gap: .5rem; margin-bottom: .5rem; }
    .ui-checkbox-group input, .ui-radio-group input { flex: 0 0 auto; width: 1.125rem; height: 1.125rem; margin: .1875rem 0 0; accent-color: var(--background-action-high-primary); }
    .ui-checkbox-group--sm input, .ui-radio-group--sm input { width: 1rem; height: 1rem; margin-top: .125rem; }
    .ui-checkbox-group--sm .ui-label, .ui-radio-group--sm .ui-label { font-size: .875rem; line-height: 1.25rem; }

    /* Alerts */
    .ui-alert { position: relative; padding: .75rem 1rem .75rem 1.25rem; border: 1px solid var(--border-default-grey); border-left: 4px solid var(--text-mention-grey); border-radius: 8px;
      background: var(--background-default-grey); color: var(--text-default-grey); }
    .ui-alert p { margin: 0; }
    .ui-alert--sm { padding: .5rem .75rem .5rem 1rem; font-size: .875rem; }
    .ui-alert__title { margin: 0 0 .25rem; font-size: 1rem; font-weight: 700; color: var(--text-title-grey); }
    .ui-alert--success { border-left-color: var(--text-default-success); }
    .ui-alert--error { border-left-color: var(--text-default-error); }
    .ui-alert--warning { border-left-color: var(--text-default-warning); }
    .ui-alert--info { border-left-color: var(--text-action-high-primary); }

    /* Tables */
    .ui-table { margin-bottom: 1rem; }
    .ui-table__wrapper, .ui-table__container { overflow-x: auto; }
    .ui-table table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .ui-table th, .ui-table td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid var(--border-default-grey); vertical-align: top; }
    .ui-table thead th { background: var(--background-alt-grey); color: var(--text-title-grey); font-weight: 700; }
    .ui-table--sm th, .ui-table--sm td { padding: .25rem .5rem; }

    /* Tabs, stepper */
    .ui-tabs__list { display: flex; flex-wrap: wrap; gap: .25rem; margin: 0; padding: 0; list-style: none; }
    .ui-tabs__tab { padding: .5rem 1rem; border: 0; border-radius: 0; background: transparent; color: var(--text-default-grey); font-size: .9375rem; font-weight: 500; cursor: pointer; box-shadow: inset 0 -1px 0 var(--border-default-grey); }
    .ui-tabs__tab:hover { background: var(--background-default-grey-hover); }
    .ui-tabs__tab[aria-selected="true"] { color: var(--text-action-high-primary); font-weight: 700; box-shadow: inset 0 -2px 0 var(--border-active-primary); background: transparent; }
    .ui-stepper { margin-bottom: 1.5rem; }
    .ui-stepper__title { margin: 0; font-size: 1.25rem; line-height: 1.75rem; font-weight: 700; color: var(--text-title-grey); }
    .ui-stepper__state { display: block; margin-top: .25rem; font-size: .875rem; font-weight: 400; color: var(--text-mention-grey); }

    /* Badges */
    .ui-badge { display: inline-flex; align-items: center; max-width: 100%; padding: 0 .625rem; border-radius: 999px; background: #efeff3; color: #494957;
      font-size: .8125rem; line-height: 1.5rem; font-weight: 700; overflow-wrap: anywhere; }
    .ui-badge--sm { font-size: .75rem; line-height: 1.25rem; padding: 0 .375rem; }
    .ui-badge--success { background: #ddf3ea; color: #0e6b4d; } .ui-badge--error { background: #fce4ec; color: #a61e4d; }
    .ui-badge--warning { background: #fff3c4; color: #7a5b00; } .ui-badge--info { background: #e0f4f8; color: #0b5a70; }
    .ui-badge--new { background: #feebd0; color: #695240; }
    .ui-badge--mint { background: #bafaee; color: #009081; } .ui-badge--ocean { background: #e9edfe; color: #465f9d; }
    .ui-badge--wisteria { background: #fee7fc; color: #6e445a; } .ui-badge--terracotta { background: #fee9e5; color: #755348; }

  /* === SECTION : BASE === */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey);
      font-family: var(--font-ui); font-size: 1rem; }
    #skipLink:focus { position: fixed; top: 0; left: 0; z-index: 9999; padding: .5rem 1rem; clip: auto; width: auto; height: auto;
      overflow: visible; white-space: nowrap; font-size: .875rem;
      background: var(--background-default-grey); color: var(--text-action-high-primary); }
    main[hidden], div[hidden], section[hidden], p[hidden], button[hidden], .ui-btn[hidden] { display: none; }
    .w-contenu { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 1.75rem; color: var(--text-default-grey); }
    /* The scrollbar space is always reserved: a scrollbar appearing (large map, long
       settings page) never changes the width, so the map never "zooms" (see dv-sans-defilement). */
    .w-contenu { scrollbar-gutter: stable; }
    .dv-carte--grande { flex: none; }
    .dv-onglets-verses { margin-bottom: .75rem; }
    .dv-etape-verse { max-width: 46rem; }
    .dv-etape-verse > .ui-input-group { margin-top: 1rem; }
    #dvVerseCompte { font-weight: 600; color: var(--text-default-grey); }
    .dv-onglets-verses .ui-tabs__tab.w-onglet { display: inline-flex; align-items: center; gap: .4rem; }
    .dv-onglets-verses .ui-tabs__tab::before { --icon-size: 1rem; flex: none; }
    .w-titre-vue { margin: 0 0 .25rem; }
    .w-mention { color: var(--text-mention-grey); font-size: .8125rem; margin: 0; }
    .w-texte { font-size: .875rem; line-height: 1.55; margin: 0; color: var(--text-default-grey); }

  /* SECTION : HEADER BAR */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
    .w-bandeau__logo-wrap{width:100%}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-primary);white-space:nowrap;margin:0;line-height:1}
    .w-bandeau__version{font-size:.75rem;color:var(--text-mention-grey);font-weight:400;margin-left:.5rem;white-space:nowrap}
    /* madeXcé logo: colors read from the design tokens */
    .w-logo{display:block;width:100%;height:auto}
    .w-logo__made{fill:var(--text-mention-grey);font-weight:400}
    .w-logo__x{fill:var(--text-label-accent-pink);font-weight:700}
    .w-logo__ce{fill:var(--text-title-primary);font-weight:800}

  /* === SECTION : LOADER AND BANNERS === */
    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Overlay veil: the only hard-coded color allowed, since the
         --background-overlap-grey token stands for an opaque surface. */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }
    .w-loader.actif { display: flex; }
    .w-loader__spinner { width: 32px; height: 32px; border: 3px solid var(--border-default-grey);
      border-top-color: var(--background-action-high-primary); border-radius: 50%; animation: wSpin .8s linear infinite; }
    @keyframes wSpin { to { transform: rotate(360deg); } }
    .w-loader__texte { font-size: .875rem; color: var(--text-inverted-grey); }
    .w-erreur, .w-succes { display: none; flex-shrink: 0; }
    .w-erreur.actif, .w-succes.actif { display: block; }

  /* === SECTION : MODALS === */
    .w-overlay { display: none; position: fixed; inset: 0; z-index: 9990;
      /* Overlay veil: documented exception, see .w-loader */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); align-items: center; justify-content: center; padding: 1rem; }
    .w-overlay.actif { display: flex; }
    .w-overlay--haut { z-index: 9995; }
    .w-dialogue { background: var(--background-default-grey); color: var(--text-default-grey); width: 100%; max-width: 42rem;
      max-height: 100%; display: flex; flex-direction: column; }
    .w-dialogue--etroit { max-width: 30rem; }
    /* Building card: side panel sliding in from the right, full height,
       like a card you look at next to the board. */
    .w-overlay--lateral { justify-content: flex-end; align-items: stretch; padding: 0; }
    .w-dialogue--lateral { max-width: 42rem; height: 100%; animation: wGlisse .2s ease-out; }
    .w-dialogue--lateral .w-dialogue__corps { flex: 1; }
    /* Attachments: file list and viewer (images, PDF) */
    .w-overlay--visionneuse { z-index: 9993; }
    /* Viewer: window at 85% of the height, can be expanded to full screen. */
    .w-dialogue--visionneuse { max-width: 72rem; height: 85vh; }
    .w-dialogue--visionneuse.w-dialogue--plein { position: fixed; inset: 0; max-width: none; height: 100%; max-height: none; }
    .w-visionneuse__contenu.w-visionneuse__contenu--pdf { display: block; overflow: auto; padding: 0; background: var(--background-contrast-grey); color: var(--text-default-grey); }

    .dv-membres { border-collapse: collapse; width: 100%; }
    .dv-membres th { text-align: left; font-size: .8125rem; font-weight: 500; padding: .25rem; color: var(--text-default-grey); }
    .dv-membres td { padding: .25rem; }
    .dv-emoji { max-width: 5rem; }
    .dv-recap { list-style: none; padding: 0; }
    .dv-recap li { padding: .25rem 0; }

    /* Meeting room TV screen: it shows "Teams" and opens the team chat channel */
    .dv-tele { position: absolute; pointer-events: auto; cursor: pointer; margin: 0; padding: 0; border: 0; background: transparent; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; font-family: inherit; font-weight: 700; white-space: nowrap;
      font-size: clamp(9px, calc(var(--tuile, 24px) * .6), 20px); line-height: 1; }
    .dv-tele:hover { background: rgba(255,255,255,.15); }
    .dv-tele:focus-visible { outline: 3px solid #0A76F6; outline-offset: 2px; }
    .dv-tele.dv-info::before { bottom: auto; top: calc(100% + 6px); }

    /* Save confirmation in the date bar: zero base width, it takes the
       free space without ever pushing the buttons onto a new line;
       text too long: cut with "…" (full text on hover) */
    .dv-confirmation { flex: 1 1 0; min-width: 0; margin: 0; align-self: center; height: 1.5rem; line-height: 1.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-default-success, #18753C); font-weight: 700; opacity: 0; transition: opacity .3s; }
    .dv-confirmation.actif { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .dv-confirmation { transition: none; } }
    /* Screen reader announcement: invisible on screen even if the ui-* styles do not apply */
    #annonce { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    /* Map shown in full: no page scrolling (open windows still scroll) */
    html.dv-sans-defilement .w-contenu { overflow-y: hidden; }   /* the content area does not scroll: its width never changes */
    /* Top bar (date, alert, labels, buttons) ALWAYS ON ONE LINE: its height
       never changes, so neither does the map size. When space runs out, the
       chips of people without a declaration that do not fit fold into "+N" (never cut). [DO NOT EDIT] */
    .dv-identite { flex-wrap: nowrap; align-items: center; }
    .dv-identite > .w-identite__texte { flex: none; }
    .dv-date { flex-wrap: nowrap; }
    .dv-date .w-titre-vue { white-space: nowrap; }
    .dv-actions { flex-wrap: nowrap; flex: 0 1 auto; min-width: 0; }
    .dv-actions > * { flex: none; }
    .dv-actions > .dv-nd { flex: 0 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
    /* A chip is never cut ("Antoin"): whole first names, the others fold into "+N" */
    .dv-nd__tag { flex: none; white-space: nowrap; }
    .dv-actions > .dv-nd { gap: .15rem; }
    /* Narrow screen (phone): the bar may wrap onto two lines */
    @media (max-width: 47.99em) { .dv-identite, .dv-actions { flex-wrap: wrap; } }
    /* Wide screens: the map toolbar is in the right part of the header bar, on one line,
       without making the bar taller (date 1rem bold, small buttons) */
    .w-bandeau__outils { flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-end; align-items: center; }
    .w-bandeau__outils:empty { display: none; }
    .w-bandeau__outils .dv-identite { margin: 0; flex: 0 1 auto; min-width: 0; justify-content: flex-end; gap: .75rem; }
    .w-bandeau__outils .w-identite__texte { max-width: none; }
    .w-bandeau__outils .dv-date .w-titre-vue { font-size: 1rem; line-height: 1.5rem; font-weight: 700; margin: 0; }
    .w-bandeau__outils .dv-confirmation { flex: 0 1 auto; max-width: 18rem; }
    .w-bandeau__outils .dv-actions { gap: .375rem; }
    .dv-outils-haut .w-bandeau__marque { flex-shrink: 0; }
    /* Medium widths: the three buttons keep only their icon (their name stays for screen readers) */
    @media (max-width: 80em) {
      .w-bandeau__outils .dv-actions > .ui-btn[class*="ui-icon-"] { font-size: 0; padding-left: .5rem; padding-right: .5rem; gap: 0; }
      .w-bandeau__outils .dv-actions > .ui-btn[class*="ui-icon-"]::before { margin: 0; }
    }
    /* ---------- Setup wizard: rooms and desk layout editor [EDITABLE: colors and sizes] ---------- */
    .dv-piece, .dv-am { border-top: 1px solid var(--border-default-grey); padding-top: 1rem; }
    .dv-details summary { cursor: pointer; font-weight: 500; padding: .25rem 0; }
    .dv-details .w-liste-cases { max-height: 16rem; overflow-y: auto; }
    .dv-am__taille { display: flex; gap: 1rem; flex-wrap: wrap; }
    .dv-am__taille .ui-input-group { max-width: 11rem; margin: 0; }
    .dv-am__num { max-width: 5rem; }
    /* The grid: wooden floor, one square = one tile; desk, chair, reserved squares hatched */
    .dv-grille-cadre { display: inline-block; max-width: 100%; overflow-x: auto; padding: .5rem; background: #B98150; border-radius: 0; }
    .dv-grille { --case: 2rem; display: grid; gap: 2px; }
    .dv-grille .dv-case { width: var(--case); height: var(--case); margin: 0; padding: 0; border: 1px solid rgba(0,0,0,.15); border-radius: 0; background: #E9C79A;
      font-family: inherit; font-size: 1rem; line-height: 1; cursor: pointer; }
    .dv-grille .dv-case:hover { outline: 2px solid #0E7490; outline-offset: -2px; }
    .dv-grille .dv-case--bureau { background: #8A5A33; }
    .dv-grille .dv-case--siege { background: #9FB0D6; }
    .dv-grille .dv-case--reserve { background: repeating-linear-gradient(45deg, #E9C79A 0 4px, #CFA471 4px 8px); font-size: .8125rem; cursor: not-allowed; }
    /* === PDF TIMESHEET [EDITABLE for appearance] ===
       The sheet only exists while printing and stays invisible on screen.
       When printing, the rest of the page is hidden: only the sheet is output. */
    #dvFeuille { display: none; }
    @page { size: A4; margin: 15mm 15mm 18mm; @bottom-right { content: "Page " counter(page) " / " counter(pages); font: 8pt -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #666666; } }
    @media print {
      html, html body { height: auto; overflow: visible; display: block; background: #FFFFFF; }
      html body > :not(#dvFeuille) { display: none; }
      html body > #dvFeuille { display: block; color: #161616; font: 10pt/1.4 var(--font-ui); }
      .dv-f-titre { margin: 0; font-size: 18pt; font-weight: 700; color: #0E7490; }
      .dv-f-sous-titre { margin: 0 0 6mm; font-size: 12pt; font-weight: 500; }
      .dv-f-identite { display: grid; grid-template-columns: 45mm 1fr; gap: 1.5mm 4mm; margin: 0 0 7mm; padding: 4mm; border-left: 1mm solid #0E7490; background: #F6F6F6; }
      .dv-f-identite dt { color: #3A3A3A; } .dv-f-identite dd { margin: 0; font-weight: 700; }
      .dv-f-table { width: 100%; border-collapse: collapse; margin: 0 0 7mm; page-break-inside: auto; }
      .dv-f-table caption { text-align: left; font-weight: 700; font-size: 11pt; margin-bottom: 2mm; }
      .dv-f-table th, .dv-f-table td { border: 0.3mm solid #CECECE; padding: 1.5mm 2mm; text-align: left; vertical-align: top; }
      .dv-f-table thead th { background: #EEEEEE; }
      .dv-f-table tr { page-break-inside: avoid; }
      .dv-f-table tfoot th, .dv-f-table tfoot td { font-weight: 700; background: #F6F6F6; }
      .dv-f-table .dv-f-nombre { text-align: center; white-space: nowrap; }
      .dv-f-semaine { page-break-inside: avoid; }
      .dv-f-semaine__titre th { background: #E0F4F8; color: #0E7490; font-weight: 700; }
      .dv-f-semaine__total td { font-weight: 700; background: #F6F6F6; }
      .dv-f-note { font-size: 8.5pt; color: #3A3A3A; margin: 0 0 8mm; }
      .dv-f-signature { margin-left: auto; width: 75mm; min-height: 35mm; padding: 3mm; border: 0.3mm solid #929292; page-break-inside: avoid; }
      .dv-f-signature p { margin: 0 0 1.5mm; } .dv-f-signature__nom { font-weight: 700; } .dv-f-signature__fait { margin-top: 3mm; }
    }
  </style>
</head>
<body>

    </div>
    <!-- On wide screens, the map toolbar (date, people without a declaration, buttons) sits here -->
    <div class="w-bandeau__outils" id="bandeauOutils"></div>

  <div class="w-erreur ui-alert ui-alert--error ui-alert--sm" id="wErreur" role="alert"><p id="wErreurMsg"></p><button type="button" class="ui-btn ui-btn--sm ui-btn--tertiary ui-mt-1v" id="wErreurFermer">Close</button></div>

  <p class="ui-sr-only" id="annonce" role="status" aria-live="polite"></p>

<script>
'use strict';

/* ==========================================================================
   SECTION 1: CONSTANTS [EDITABLE where indicated]
   All constants are declared here, at top level and before any function:
   initializer() may be triggered by the first onRecords before the script
   has finished evaluating.
   ========================================================================== */

// [EDITABLE] Version number: increment on every delivery.
var VERSION_WIDGET = '2.0.0';
var NOM_WIDGET = 'Gristverse';

/* [DO NOT EDIT] Gristverse library: technical settings table, created
   with Gristverse. Its name ends with an underscore: other widgets ignore it. */
var ID_BIBLIO = 'GRISTVERSE_LIBRARY_';
var LABEL_BIBLIO = '🌐 GRISTVERSE LIBRARY ⚡';
var CLE_CONFIG = 'CONFIG:GRISTVERSE';   // the settings row of 1.x: it becomes the first verse, unchanged
var PREFIXE_CONFIG = 'CONFIG:';          // one settings row per verse: KEY = CONFIG:<id>
// [EDITABLE] Name of the first verse when the settings do not give one (installs from 1.x)
var NOM_VERSE_DEFAUT = 'Everyone';
/* [EDITABLE] Large teams: smallest size of a map square, in CSS pixels. When the
   whole map would make squares smaller, the map keeps this size and the
   content area scrolls. */
var TUILE_MIN_PX = 18;
// [EDITABLE] Houses (and islands) per row before they wrap onto a new row
var MAISONS_PAR_RANGEE = 10;
// [EDITABLE labels] "Show people as" (setting of each verse)
var AFFICHAGES = [{ valeur: 'les_deux', libelle: 'First name and character, with the emoji as a badge' }, { valeur: 'prenom', libelle: 'First name and character' }, { valeur: 'emoji', libelle: 'Emoji (first name when there is none)' }];
var DELAI_API_MS = 30000;
/* No automatic re-reading at regular intervals: the map updates when Grist
   signals a change (onRecords) and after each action done in the widget.
   Only the clock is checked (meeting reminder, new day): see cleHorloge. */

var COLONNES_META = [
  { id: 'CREATED_AT', type: 'DateTime:America/New_York', label: 'CREATED_AT', formula: 'NOW()', recalcWhen: 0 },
  { id: 'CREATED_BY', type: 'Text', label: 'CREATED_BY', formula: 'user.Email', recalcWhen: 0 },
  { id: 'UPDATED_AT', type: 'DateTime:America/New_York', label: 'UPDATED_AT', formula: 'NOW()', recalcWhen: 2 },
  { id: 'UPDATED_BY', type: 'Text', label: 'UPDATED_BY', formula: 'user.Email', recalcWhen: 2 }
];
var COLONNES_BIBLIO = [
  { id: 'KEY', type: 'Text', label: 'KEY' },
  { id: 'VALUE', type: 'Text', label: 'VALUE' },
  { id: 'VERSION_CREATED', type: 'Text', label: 'VERSION_CREATED' },
  { id: 'VERSION_UPDATED', type: 'Text', label: 'VERSION_UPDATED' }
].concat(COLONNES_META);
var IDS_META = ['CREATED_AT', 'CREATED_BY', 'UPDATED_AT', 'UPDATED_BY'];
var GENRES_MODIFIABLES = ['texte', 'texte_long', 'date', 'dateheure', 'nombre', 'oui_non', 'choix', 'etiquettes', 'personne', 'lien', 'reference', 'references', 'autre'];
var MOIS_COURTS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Full month names: used in long-form dates (map title, dialogs, messages)
var MOIS_LONGS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var JOURS_COURTS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var JOURS_LONGS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
/* [EDITABLE] Attachments: only raster images and PDFs are shown in the
   viewer. SVG files and HTML pages could contain code: they are
   downloaded instead. */
var PJ_IMAGES = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'];
var COULEURS_BADGES = ['mint', 'ocean', 'wisteria', 'terracotta', 'rose',
  'sunflower', 'caramel', 'lagoon'];

/* --------------------------------------------------------------------------
   [EDITABLE] TABLES CREATED BY GRISTVERSE
   The team (one row per person) and presence (one row per declaration:
   FROM_DATE, TO_DATE, LOCATION). The ids become the table and column ids
   in Grist: change them only with care.
   -------------------------------------------------------------------------- */
var TABLE_EQUIPE = { id: 'TEAM', titre: '👥 Team' };
var TABLE_PRESENCES = { id: 'PRESENCE', titre: '📍 Presence' };
// [EDITABLE] Sites offered at creation (the first one is the default site)
var SITES_DEFAUT = ['Site 1', 'Site 2'];
// [EDITABLE] Emoji for each known site (other sites get 🏢)
var EMOJIS_SITES = { 'Paris': '🗼', 'Nantes': '🏰', 'Lyon': '🦁', 'Bordeaux': '🍷', 'Marseille': '⛵', 'Lille': '🧇', 'London': '🎡', 'New York': '🗽', 'Berlin': '🐻', 'Madrid': '☀️', 'Brussels': '🍟' };
var LIEU_TELETRAVAIL = 'Remote';
var LIEU_ABSENT = 'Absent';
// [DO NOT EDIT] Computed states, never written to the presence table
var LIEU_NON_DECLARE = 'Not declared';
var LIEU_WEEKEND = 'Weekend';
// [EDITABLE] Days shown in the presence schedules
var JOURS_OUVRES = [1, 2, 3, 4, 5];
// [EDITABLE] Desk scaling (furniture and characters): 1 = normal size
var ECHELLE_BUREAUX = 1.45;

/* --------------------------------------------------------------------------
   [DO NOT EDIT] SETTINGS VERSION
   EVERYTHING specific to a team (building names, desk layout, rooms shown,
   chat channel, rides, project columns) is stored in the settings (table
   "🌐 GRISTVERSE LIBRARY ⚡") and is changed in Settings. The code contains
   nothing specific to a team.
   -------------------------------------------------------------------------- */
var VERSION_REGLAGES = 2;

/* --------------------------------------------------------------------------
   [EDITABLE labels] OPTIONAL ROOMS AND ITEMS
   Reception and desks are always there; the rest is ticked in Settings
   (step "The template"). The order is the display order.
   -------------------------------------------------------------------------- */
var PIECES_OPTIONNELLES = [
  { cle: 'reunion', titre: '📺 Meeting room', aide: 'Today\'s meetings on a big board, a reminder 15 minutes before, the video call link.' },
  { cle: 'paperboards', titre: '📝 Desk flipcharts', aide: 'Everyone\'s tasks, on the desk and on one flipchart per desk.' },
  { cle: 'ressources', titre: '📚 Resources at reception', aide: 'Documents and useful links, as books on the reception shelves.' },
  { cle: 'projets', titre: '🗄️ Project library', aide: 'One shelf per status, one binder per project, one project card per project.' },
  { cle: 'planning', titre: '📅 Schedule board', aide: 'The project timeline, one row per person (requires the project library).' },
  { cle: 'tele', titre: '💬 Chat channel TV', aide: 'The meeting room TV opens your channel (Teams, Slack...).' },
  { cle: 'activites', titre: '🗂️ Activity declaration', aide: 'In each desk, a tab to log your hours per project.' }
];

/* --------------------------------------------------------------------------
   [EDITABLE labels] TEMPLATES OFFERED AT INSTALLATION
   A template pre-fills the sites and rooms; everything can be changed later.
   -------------------------------------------------------------------------- */
var MODELES = [
  { cle: 'deux_sites', titre: '🏢🏢 Team on two sites', aide: 'Two office buildings, reception, the meeting room, the project library and all the rooms.',
    sites: ['Site 1', 'Site 2'], pieces: { reunion: true, paperboards: true, ressources: true, projets: true, planning: true, tele: true, activites: true } },
  { cle: 'un_site', titre: '🏢 Team on one site', aide: 'A single office building, with the same common rooms.',
    sites: ['Office'], pieces: { reunion: true, paperboards: true, ressources: true, projets: true, planning: true, tele: true, activites: true } },
  { cle: 'sur_mesure', titre: '🧩 Custom', aide: 'You choose the rooms to show one by one.',
    sites: ['Office'], pieces: { reunion: true, paperboards: true, ressources: false, projets: false, planning: false, tele: false, activites: false } }
];
// [EDITABLE] Rides for going home (the character runs through the building, then gets on the ride outside)
var MONTURES_LIBELLES = [{ valeur: '', libelle: '🏃 On foot' }, { valeur: 'velo', libelle: '🚲 Bike' }, { valeur: 'trottinette', libelle: '🛴 Scooter' }];

/* --------------------------------------------------------------------------
   [EDITABLE labels] TABLES GRISTVERSE CAN CREATE (room by room)
   Uppercase ids, plain-language labels. Choices marked TEAM receive the
   team names at creation. "colonnes" gives the room settings once the
   table is created; "exemples" fills the table when sample data is
   requested (dates: offset in days).
   -------------------------------------------------------------------------- */
var TABLES_PIECES = {
  reunions: { id: 'MEETINGS', titre: '📺 Meetings', colonnes: [
      { id: 'SUBJECT', type: 'Text', label: 'Subject' }, { id: 'START', type: 'DateTime:America/New_York', label: 'Start' }, { id: 'END', type: 'DateTime:America/New_York', label: 'End' },
      { id: 'LOCATION', type: 'Text', label: 'Location' }, { id: 'VIDEO_LINK', type: 'Text', label: 'Video call link' }, { id: 'PARTICIPANTS', type: 'Text', label: 'Participants' },
      { id: 'STATUS', type: 'Choice', label: 'Status', widgetOptions: { choices: ['Scheduled', 'Canceled'] } }],
    reglages: { colObjet: 'SUBJECT', colDebut: 'START', colFin: 'END', colLieu: 'LOCATION', colVisio: 'VIDEO_LINK', colParticipants: 'PARTICIPANTS', colStatut: 'STATUS', exclus: ['Canceled'] },
    exemples: [{ SUBJECT: 'Team check-in', jour: 0, heure: 9.5, duree: 0.5, LOCATION: 'Meeting room', STATUS: 'Scheduled' },
      { SUBJECT: 'Workshop', jour: 1, heure: 14, duree: 1.5, LOCATION: 'Video call', STATUS: 'Scheduled' },
      { SUBJECT: 'Weekly review', jour: 3, heure: 11, duree: 1, LOCATION: 'Meeting room', STATUS: 'Scheduled' }] },
  taches: { id: 'TASKS', titre: '📝 Tasks', colonnes: [
      { id: 'DESCRIPTION', type: 'Text', label: 'Description' }, { id: 'OWNER', type: 'Choice', label: 'Owner', widgetOptions: { choices: 'TEAM' } },
      { id: 'STATUS', type: 'Choice', label: 'Status', widgetOptions: { choices: ['To do', 'In progress', 'Done'] } },
      { id: 'DUE_DATE', type: 'Date', label: 'Due date' }, { id: 'PRIORITY', type: 'Choice', label: 'Priority', widgetOptions: { choices: ['Normal', 'Urgent'] } }],
    reglages: { colDescription: 'DESCRIPTION', colResponsable: 'OWNER', colStatut: 'STATUS', colEcheance: 'DUE_DATE', colPriorite: 'PRIORITY', finis: ['Done'] },
    exemples: [{ DESCRIPTION: 'Prepare the team check-in', qui: 0, STATUS: 'To do', jour: 1, PRIORITY: 'Normal' },
      { DESCRIPTION: 'Review the documentation', qui: 1, STATUS: 'In progress', jour: 3, PRIORITY: 'Urgent' },
      { DESCRIPTION: 'Update the schedule', qui: 0, STATUS: 'To do', jour: 5, PRIORITY: 'Normal' }] },
  ressources: { id: 'RESOURCES', titre: '📚 Resources', colonnes: [
      { id: 'NAME', type: 'Text', label: 'Name' }, { id: 'LINK', type: 'Text', label: 'Link' },

function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERROR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'WARNING') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('WARNING', 'Loading overlay hidden automatically after 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Loading…'; }
  /* The overlay only appears past the threshold: a short operation no
     longer makes the screen flicker. masquerLoader cancels this delay, so
     the overlay is never shown for a quick operation. */

}

function estTableExclue(tid) {

  if ((up.indexOf('LIBRARY') !== -1 || up.indexOf('BIBLIOTHEQUE') !== -1) && brut.charAt(brut.length - 1) === '_') { return true; }

      try { await agir([['UpdateRecord', '_grist_Views_section', meta.rawViewSectionRef, { title: liste[i][1] }]]); }

    Object.keys(etat.meta.tables).forEach(function (t) { if (etat.meta.tables[t].ref === refs[ancien]) { res[ancien] = t; } });

/* A column is added in two steps: created bare, then typed. Each step is
   protected separately. The actual identifier is read back after creation. */
async function ajouterColonne(tid, colId, type, widgetOptions) {
  var ret = await agir([['AddColumn', tid, colId, {}]]);
  var reel = colId;
  if (ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId) { reel = ret.retValues[0].colId; }
  /* isFormula: false is required: without it, the platform leaves the
     added column as an empty formula, where nothing can be written. */

  if (widgetOptions) { propr.widgetOptions = JSON.stringify(widgetOptions); }
  try {
    await agir([['ModifyColumn', tid, reel, propr]]);
  } catch (e) {
    logSecurite('WARNING', 'Column ' + reel + ' created but not typed', e);

/* === SECTION : SETTINGS LIBRARY ===
   Technical settings table: one configuration row (KEY =
   CONFIG:xxx), configuration as JSON in VALUE. */
async function reparerSchemaBiblio() {
  if (!etat.biblio) { return; }
  try {
    await chargerMeta();
    for (var k = 0; k < COLONNES_BIBLIO.length; k++) {
      var col = COLONNES_BIBLIO[k];
      var ex = infoColonne(etat.biblio, col.id);
      if (!ex) {
        var creee = false;
        try { await agir([['AddColumn', etat.biblio, col.id, {}]]); creee = true; } catch (e) { logSecurite('INFO', 'Column ' + col.id + ' not added', e); }
        if (creee) {
          var propr = { type: typeAvecFuseau(col.type), label: col.label, isFormula: false };
          if (col.formula) { propr.formula = col.formula; propr.recalcWhen = col.recalcWhen; propr.recalcDeps = null; }
          try { await agir([['ModifyColumn', etat.biblio, col.id, propr]]); } catch (e2) { logSecurite('INFO', 'Column ' + col.id + ' not typed', e2); }
        }
      } else if (col.formula && String(ex.formula).trim() !== col.formula) {
        try {
          await agir([['ModifyColumn', etat.biblio, col.id, { isFormula: false, formula: col.formula, recalcWhen: col.recalcWhen, recalcDeps: null }]]);
        } catch (e3) { logSecurite('INFO', 'Formula not restored on ' + col.id, e3); }
      }
    }
  } catch (e) {
    logSecurite('WARNING', 'Could not check the library schema', e);
  }
}

async function assurerBibliotheque() {
  await chargerMeta();
  var trouvee = trouverTable(ID_BIBLIO);
  if (trouvee) {
    etat.biblio = trouvee;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  await chargerMeta();
  var entreTemps = trouverTable(ID_BIBLIO);
  if (entreTemps) {
    etat.biblio = entreTemps;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  return finaliserBibliotheque((await creerTables([{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }]))[0]);
}

/* After creation, the library gets its display name; its identifier is
   read back, since renaming may change it. */
async function finaliserBibliotheque(tid) {
  etat.biblio = tid;
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    if (t && t.rawViewSectionRef) {
      await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { title: LABEL_BIBLIO }]]);
    }
    await chargerMeta();
    var relu = trouverTable(ID_BIBLIO);
    if (relu) { etat.biblio = relu; }
  } catch (e) {
    logSecurite('WARNING', 'Library renaming did not complete', e);

  await reparerSchemaBiblio();
  return etat.biblio;
}

  var c = { bureau: {}, tele: 0, absent: 0, nd: 0, weekend: 0 };
  etat.donnees.membres.forEach(function (m) {
    var e = etatDe(m, plan.ou[m.id]);

    // A connected room without its key columns is not kept (it would not be shown)
    Object.keys(PIECES_TABLES).forEach(function (k) {
      var p = c[k];
      if (p && (!p.table || PIECES_TABLES[k].cles.some(function (x) { return !p[x]; }))) { c[k] = null; }
    });
    c.version = VERSION_REGLAGES;
    etape = 'saving the settings';
    // A new verse (from the existing tables): its settings row is created here, under its own key
    if (b.nouveauVerse) { etat.cleConfig = b.cleNouvelle; etat.cleLigne = b.ligneNouvelle || null; }
    await ecrireConfig(c);
    if (b.nouveauVerse) { memoriserVerse(b.cleNouvelle); }
  } catch (e) {
    masquerLoader();
    afficherErreur(estRefusDroits(e) ? 'Your access rights do not allow finishing the setup (creating tables or settings).' : 'The setup failed at the "' + etape + '" step.' + detailErreur(e), e);
    return;
  }
  masquerLoader();
  etat.brouillon = null;
  etat.cadrage = null;
  await chargerTout();
  afficherSucces('🌐 Welcome to Gristverse!');
}
// Sample dates: working day n days from today (weekends move to Monday)
function jourExemple(n) {
  var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n);
  while (d.getDay() === 0 || d.getDay() === 6) { d.setDate(d.getDate() + 1); }
  return d;
}
function dateExemple(n) { var d = jourExemple(n); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000; }            // Date column
function dateHeureExemple(n, h) { var d = jourExemple(n); return epochDansFuseau(d.getFullYear(), d.getMonth() + 1, d.getDate(), Math.floor(h), Math.round((h % 1) * 60), fuseauDoc()); }   // DateTime column (document time zone, like the column)
// Fills the freshly created tables with the sample data from TABLES_PIECES
async function remplirExemples(c, ks, equipe) {
  var qui = function (n) { return equipe.length ? equipe[n % equipe.length] : ''; };
  for (var i = 0; i < ks.length; i++) {
    var k = ks[i], T = TABLES_PIECES[k], tid = c[k].table, lignes = T.exemples || [];
    if (!lignes.length) { continue; }
    var champs = {};
    var ajouter = function (col, v) { (champs[col] = champs[col] || []).push(v); };
    lignes.forEach(function (x) {
      if (k === 'reunions') { ajouter('SUBJECT', x.SUBJECT); ajouter('START', dateHeureExemple(x.jour, x.heure)); ajouter('END', dateHeureExemple(x.jour, x.heure + x.duree)); ajouter('LOCATION', x.LOCATION); ajouter('STATUS', x.STATUS); }
      if (k === 'taches') { ajouter('DESCRIPTION', x.DESCRIPTION); ajouter('OWNER', qui(x.qui)); ajouter('STATUS', x.STATUS); ajouter('DUE_DATE', dateExemple(x.jour)); ajouter('PRIORITY', x.PRIORITY); }
      if (k === 'ressources') { ajouter('NAME', x.NAME); ajouter('LINK', x.LINK); ajouter('TYPE', x.TYPE); ajouter('PINNED', x.PINNED); }
      if (k === 'projets') { ajouter('NUMBER', x.NUMBER); ajouter('NAME', x.NAME); ajouter('STATUS', x.STATUS); ajouter('DEV', qui(x.qui)); ajouter('START', dateExemple(x.debut)); ajouter('END', dateExemple(x.fin)); ajouter('SUBJECT', x.SUBJECT); }
    });
    try { await agir([['BulkAddRecord', tid, lignes.map(function () { return null; }), champs]]); }
    catch (e) { logSecurite('WARNING', 'Sample data not added in ' + tid, e); }
  }
}

/* ==========================================================================
   SECTION 7: LOADING, REFRESH AND STARTUP [DO NOT EDIT]
   ========================================================================== */
async function chargerTout() {
  // On opening, the document description has just been read by initializer(): do not read it again
  if (etat.metaFraiche) { etat.metaFraiche = false; } else { await chargerMeta(); }
  await lireConfig();
  // Settings in an old format that were upgraded: save them once (without full access, use them without writing)
  if (etat.reglagesAEnregistrer && etat.config && accesComplet()) {
    etat.reglagesAEnregistrer = false;
    try { await ecrireConfig(etat.config); logSecurite('INFO', 'v1 settings carried over to v2'); }
    catch (e) { logSecurite('WARNING', 'Carried-over settings not saved', e); }
  }
  // Viewers (or a document opened read-only) get no editing buttons from the start
  etat.peutModifier = accesComplet() && await sonderEcriture();
  etat.peutParametrer = etat.peutModifier;
  if (!etat.config || !etat.config.equipe || !etat.meta.tables[etat.config.equipe]) {
    if (etat.peutParametrer) { if (!etat.brouillon) { ouvrirAssistant(1); } return; }
    afficherVue('aucun');
    return;
  }
  // The map is shown with the light tables; projects, contractors and resources follow in the background
  await chargerDonnees({ sansLourdes: true });
  /* 2.0: rides and desks were stored by emoji (or name); they are carried over once to the
     team row ids, so a change of name or emoji loses nothing. Saved by owners; otherwise
     used in memory. Only when the team could be read (never on an empty reading). */
  if (etat.donnees && etat.donnees.equipeLue && migrerClesPersonnes(etat.config, etat.donnees.tousMembres) && etat.peutParametrer) {
    try { await ecrireConfig(etat.config); logSecurite('INFO', 'Rides and desks carried over to row ids'); } catch (e) { logSecurite('WARNING', 'Rides and desks not carried over', e); }
  }
  await funMigrerLignes();
  if (!etat.brouillon) { afficherVue('plan'); }   // during the wizard, do not leave it
  relayer(chargerLourdesEnFond(), 'Reading projects and resources');
}

/* Re-read: the plan is redrawn, unless a window is open (it is updated
   when it closes). */
async function rafraichirMaintenant() {
  if (etat.vue !== 'plan' || !etat.config) { return; }
  try {
    // Re-read only the light tables; if nothing changed (for example the echo of
    // our own declaration, already shown), the map is not redrawn
    await chargerDonnees();
    if (!carteAJour() || etat.rafraichirEnAttente) { /* to redraw */ } else { return; }
    // Window open or character running: redraw later
    if (etat.modaleOuverte || etat.enRoute) { etat.rafraichirEnAttente = true; return; }
    etat.rafraichirEnAttente = false;
    redessinerPlan();
  } catch (e) { logSecurite('WARNING', 'Re-read failed', e); }
}
/* Redraws the map and gives the focus back to the same control (found by its id,
   otherwise by its accessible name): a refresh never sends the keyboard back to the top. */
function redessinerPlan() {
  var actif = document.activeElement, idA = actif && actif.id ? actif.id : null, libelle = actif && actif.getAttribute ? actif.getAttribute('aria-label') : null;
  afficherVue('plan');
  var n = (idA && $(idA)) || (libelle && contenu().querySelector('[aria-label="' + CSS.escape(libelle) + '"]')) || null;
  if (n && actif !== document.body) { n.focus(); }
}
/* Time-based states (the reminder RAPPEL_MINUTES before a meeting, a meeting starting or
   ending, a new day): checked every 30 seconds WITHOUT reading Grist; the map is redrawn
   only when one of them has changed since it was drawn. */
var DELAI_HORLOGE_MS = 30000;   // [EDITABLE] check interval, in milliseconds
function cleHorloge() {
  if (!etat.donnees || !etat.config) { return ''; }
  var es = etatSalleReunion(), imm = es.imminente;
  return [aujourdhui(), imm ? imm.id + ':' + Math.ceil((imm.debut - Date.now() / 1000) / 60) : '', es.enCours ? es.enCours.id : '', es.duJour.filter(function (x) { return x.passee; }).length, funCleHorloge()].join('|');
}
setInterval(function () {
  if (document.visibilityState === 'hidden' || etat.vue !== 'plan' || !etat.donnees || cleHorloge() === etat.cleHorlogeDessinee) { return; }
  if (etat.modaleOuverte || etat.enRoute) { etat.rafraichirEnAttente = true; return; }
  redessinerPlan();
}, DELAI_HORLOGE_MS);
// Does the map shown reflect the latest data read?
function carteAJour() { return etat.empreinteDessinee === etat.empreinteDonnees; }
var _minuterieRafraichir = null;
function planifierRafraichissement() {
  if (_minuterieRafraichir) { clearTimeout(_minuterieRafraichir); }
  _minuterieRafraichir = setTimeout(function () { _minuterieRafraichir = null; relayer(rafraichirMaintenant(), 'Refresh'); }, 400);
}

async function initializer() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Opening Gristverse…');
  try {
    await attendreAcces();
    // Gristverse settings are read AT THE SAME TIME as the document description
    _prelectureBiblio = lireTable(ID_BIBLIO).catch(function () { return null; });
    // Document name: the last verse viewed is remembered per document on this browser
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 3000); } catch (e) { logSecurite('INFO', 'Document name not read', e); }
    lireVerseMemorise();
    await chargerMeta();
    etat.metaFraiche = true;   // chargerTout() will not read it again
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERROR', 'Initialisation', e);
    // Without full access the document cannot be read: explain how to grant it
    if (!accesComplet()) { afficherVue('aucun'); return; }
    afficherErreur('Loading failed.');
    afficherVue('echec');
  } finally {
    etat.initEnCours = false;
  }
}

/* === LISTENERS AND STARTUP === */
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
dessinerLogo();
document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
document.getElementById('wVisionneuseFermer').addEventListener('click', fermerVisionneuse);
document.getElementById('wVisionneusePlein').addEventListener('click', basculerPleinEcranVisionneuse);
document.getElementById('wVisionneuseTelecharger').addEventListener('click', function () {
  if (_visionneuse.id) { relayer(telechargerPJ(_visionneuse.id), 'Download from the viewer'); }
});
document.getElementById('wSuccesFermer').addEventListener('click', masquerSucces);
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
/* Escape closes the open window, even when focus was lost after its
   content was redrawn (unless a confirmation is shown). */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape' || !etat.modaleOuverte) { return; }
  var vis = document.getElementById('wVisionneuse');
  if (vis && (vis.classList.contains('actif') || (e.target && vis.contains(e.target)))) { return; }
  var conf = document.getElementById('wConfirmOverlay');
  if (conf && conf.classList.contains('actif')) { return; }
  fermerModale();
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.vue === 'plan' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(), 'Re-read on returning to the page'); }
});

grist.ready({ requiredAccess: 'full', columns: [] });

/* Access level actually granted to the widget ('none', 'read table', 'full').
   Without full access, Gristverse switches to read-only and says so. */
var _accesRecu = null;
var _promesseAcces = new Promise(function (ok) { _accesRecu = ok; });
function accesComplet() { return etat.niveauAcces === 'full'; }
grist.onOptions(function (options, interaction) {
  var avant = etat.niveauAcces;
  etat.niveauAcces = interaction && interaction.accessLevel ? interaction.accessLevel : null;
  _accesRecu();
  if (avant !== null && avant !== etat.niveauAcces && !etat.initEnCours) { relayer(chargerTout(), 'Access level change'); }
});
function attendreAcces() { return Promise.race([_promesseAcces, new Promise(function (ok) { setTimeout(ok, 3000); })]); }
grist.onRecords(function () { if (!etat.initEnCours) { planifierRafraichissement(); } });

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) { logSecurite('ERROR', 'Uncaught rejected promise', evt ? evt.reason : undefined); });
}, 1500);

relayer(initializer(), 'Initialisation');

</script>
