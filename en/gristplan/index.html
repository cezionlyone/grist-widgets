<!--

  READ ME - Gristplan
  ============================================================================
  Version     : 1.0.0

  Compliance  : WCAG 2.1 AA (Section 508) | OWASP
  ============================================================================

  DESCRIPTION
  -----------
  Gristplan: timelines and Gantt charts for everyone, ready-made plans or
  plans suggested from your tables, without any setup pain.
  One widget hosts all the plans of a document, shown as tabs; the last
  tab, "New plan", creates another one.

  Creation is guided by a step bar: Starting point, Dates, Bars, Lanes,
  Links and details, Filters, Review. A live preview of the timeline is
  shown from the Dates step on. Nothing is written to the document before
  "Create my plan", except the tables of a template, created after a
  confirmation (and offered for deletion if the creation is abandoned).
  Two ways to start:
  - I don't have any data yet: seven ready-made templates (Project plan,
    Product roadmap, Event planning, Room and equipment booking, Content
    calendar, Team rotation, Hiring plan). The widget creates the tables,
    their columns and choice lists, with optional sample rows whose dates
    are computed from today.
  - I already have data: plans suggested from the document's tables (date
    columns, title, lane, status), or any table of the document with smart
    column guessing (English and French column names). The user's tables
    are never restructured, retyped or copied.

  Day to day:
  - timeline with lanes (group by a choice, reference, text column; a
    reference list or multiple choice puts the item in each of its lanes),
    collapsible groups, zoom Day / Week / Month / Quarter / Semester / Year
    and Fit all, two-level header with week numbers, weekends shaded or
    hidden ("Working days only"), Today line, Ctrl + mouse wheel zoom;
  - colors from the Grist choice colors (or the madeXcé palette), legend,
    progress fill, dependency arrows with conflicts flagged, overdue items
    and overlapping bookings flagged;
  - editors drag bars to move them, drag their edges to resize them,
    double-click to add an item; details panel saved automatically, with
    "Move by" buttons as a keyboard alternative and Undo of the last move;
  - search and filters (lane, color value, period, overdue, hide done),
    sortable list view with a summary, Print / PDF of the visible period
    and CSV export of the visible items;
  - automatic refresh: platform notifications, re-read every 20 s while
    the page is visible; the view state is kept.

  HISTORY
  -------
  1.0.0 - 2026-10-29 - madeXcé - First public version.

  DEPENDENCIES
  ------------
  - Styling: self-contained madeXcé theme (Palm Springs palette on a
    Grist-like base; ui-* classes and design tokens on :root), no external
    stylesheet or web font.
  - Icons: Remix Icon (https://remixicon.com), embedded as SVG masks.
  - Grist Plugin API (grist-plugin-api.js), loaded from
    docs.getgrist.com: origin required by the platform, unversioned URL,
    so not covered by an SRI hash.
  - No other library: the timeline is drawn by the widget itself.

  WHAT THE WIDGET WRITES IN THE DOCUMENT
  --------------------------------------
  📅 PLAN LIBRARY ⚡ (PLAN_LIBRARY_ after renaming): technical settings
  table, one row per plan (KEY = CONFIG:<identifier>, VALUE = settings as
  JSON), plus two access marker rows (EDIT_ACCESS, SETTINGS_ACCESS).
  Columns: KEY, VALUE, VERSION_CREATED, VERSION_UPDATED and the four
  metadata fields CREATED_AT, CREATED_BY, UPDATED_AT, UPDATED_BY (trigger
  formulas filled by the platform, never by the widget). Created with the
  first plan. Excluded from table lists.
  Templates: their tables (for example Tasks and Team), created only after
  a confirmation. Plans connected to existing tables: no structural change
  at all; only the values the user edits (dates, fields) are written.

  CONFIGURATION
  -------------
  No call to setOption: the settings live in the library. Per viewer
  conveniences (last plan, zoom, view, collapsed lanes, panel) are kept by
  the browser (localStorage), keyed by widget name and document.

  SECURITY
  --------
  - No dynamic code execution, no access to the parent frame.
  - No data is inserted as HTML: the DOM is built with textContent and
    setAttribute (creer helper); SVG built with createElementNS.
  - Links: only http, https and mailto, with rel="noopener noreferrer".
  - Attachments: fetched as Blobs, the access token appears in no link on
    the page; only raster images are previewed, other files downloaded.
  - Every API call has a timeout; errors are shown in plain words and
    logged with logSecurite().

  RIGHTS AND RECOMMENDED ACL SETUP
  --------------------------------
  Viewers read; editors also move, resize, add, edit and delete items;
  owners also change the settings, create and delete plans once the
  access rules are in place (procedure shown in the settings).

  ACCESSIBILITY
  -------------
  Keyboard operable (roving focus between bars, Enter opens details, + and
  - zoom), visible focus, announcements to screen readers, list view as
  an accessible alternative to the timeline, "Move by" buttons as an
  alternative to dragging, color never the only carrier of information,
  prefers-reduced-motion respected.
-->

  /* === SECTION : BASE === */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey);
      font-family: var(--font-ui); font-size: 1rem; }
    #skipLink:focus { position: fixed; top: 0; left: 0; z-index: 9999; padding: .5rem 1rem; clip: auto; width: auto; height: auto;
      overflow: visible; white-space: nowrap; font-size: .875rem;
      background: var(--background-default-grey); color: var(--text-action-high-primary); }
    main[hidden], div[hidden], section[hidden], p[hidden], button[hidden], .ui-btn[hidden] { display: none; }
    .w-contenu { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 1.75rem; color: var(--text-default-grey); }
    .w-titre-vue { margin: 0 0 .25rem; }
    .w-mention { color: var(--text-mention-grey); font-size: .8125rem; margin: 0; }
    .w-texte { font-size: .875rem; line-height: 1.55; margin: 0; color: var(--text-default-grey); }

  /* SECTION : BANNER */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-primary);white-space:nowrap;margin:0;line-height:1}
    .w-bandeau__version{font-size:.75rem;color:var(--text-mention-grey);font-weight:400;margin-left:.5rem;white-space:nowrap}
    /* madeXcé logo: colors read from the design tokens */
    .w-logo{display:block;width:100%;height:auto}
    .w-logo__made{fill:var(--text-mention-grey);font-weight:400}
    .w-logo__x{fill:var(--text-label-accent-pink);font-weight:700}
    .w-logo__ce{fill:var(--text-title-primary);font-weight:800}

  /* === SECTION : LOADER AND BANNERS === */
    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Overlay veil: the only hard-coded color allowed, since the
         --background-overlap-grey token designates an opaque surface. */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }
    .w-loader.actif { display: flex; }
    .w-loader__spinner { width: 32px; height: 32px; border: 3px solid var(--border-default-grey);
      border-top-color: var(--background-action-high-primary); border-radius: 50%; animation: wSpin .8s linear infinite; }
    @keyframes wSpin { to { transform: rotate(360deg); } }
    .w-loader__texte { font-size: .875rem; color: var(--text-inverted-grey); }
    .w-erreur, .w-succes { display: none; flex-shrink: 0; }
    .w-erreur.actif, .w-succes.actif { display: block; }

  /* === SECTION : MODALS === */
    .w-overlay { display: none; position: fixed; inset: 0; z-index: 9990;
      /* Overlay veil: documented exception, see .w-loader */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); align-items: center; justify-content: center; padding: 1rem; }
    .w-overlay.actif { display: flex; }
    .w-overlay--haut { z-index: 9995; }
    .w-dialogue { background: var(--background-default-grey); color: var(--text-default-grey); width: 100%; max-width: 42rem;
      max-height: 100%; display: flex; flex-direction: column; }
    .w-dialogue--etroit { max-width: 30rem; }
    /* Card details: side panel sliding in from the right, full height,
       like a record you look at next to the board. */
    .w-overlay--lateral { justify-content: flex-end; align-items: stretch; padding: 0; }
    .w-dialogue--lateral { max-width: 42rem; height: 100%; animation: wGlisse .2s ease-out; }
    .w-dialogue--lateral .w-dialogue__corps { flex: 1; }
    @keyframes wGlisse { from { transform: translateX(2rem); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .w-dialogue--lateral { animation: none; } }
    .w-fiche { display: flex; flex-direction: column; gap: 1rem; }
    .w-overlay--visionneuse { z-index: 9993; }
    /* Viewer: window at 85% of the height, can be enlarged to full screen. */
    .w-dialogue--visionneuse { max-width: 72rem; height: 85vh; }
    .w-dialogue--visionneuse.w-dialogue--plein { position: fixed; inset: 0; max-width: none; height: 100%; max-height: none; }
    .w-visionneuse__contenu.w-visionneuse__contenu--pdf { display: block; overflow: auto; padding: 0; background: var(--background-contrast-grey); color: var(--text-default-grey); }
    .w-pdf__pages { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 1rem 0; }
    .w-pdf__page { background: var(--background-default-grey); color: var(--text-default-grey); border: 1px solid var(--border-default-grey); }
    .w-visionneuse__contenu { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 1.5rem 1.5rem;
      background: var(--background-alt-grey); color: var(--text-default-grey); }
    .w-visionneuse__contenu img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .w-visionneuse__contenu iframe { width: 100%; height: 100%; border: 0; background: var(--background-default-grey); color: var(--text-default-grey); }
    .w-pj__liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .375rem; }
    .w-pj__fichier { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .5rem .75rem;
      border: 1px solid var(--border-default-grey); background: var(--background-default-grey); color: var(--text-default-grey); }
    .w-pj__nom { flex: 1; min-width: 8rem; font-size: .875rem; overflow-wrap: anywhere; }
    .w-pj__taille { font-size: .75rem; color: var(--text-mention-grey); }
    .w-fiche__statut { margin: 0; }
    .w-dialogue__tete { display: flex; align-items: flex-start; gap: .75rem; padding: 1.25rem 1.5rem .5rem; }
    .w-dialogue__tete > div { flex: 1; }
    .w-dialogue__titre { margin: 0; }
    .w-dialogue__corps { padding: .5rem 1.5rem 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .w-dialogue__pied { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-default-grey); }
    .w-dialogue__pied .w-pousse { margin-left: auto; }

  /* === SECTION : SETUP WIZARD === */
    /* Fluid layout: every screen takes the full width of the frame and
       blocks wrap below one another as it shrinks. */
    .w-assistant { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; }

    .tab-nav .ui-tabs__list { border-bottom: none; margin: 0; padding: 0; display: flex; list-style: none; gap: .25rem; flex-wrap: wrap; }
    .tab-nav .ui-tabs__list li { margin: 0; padding: 0; }

  /* === SECTION : PLAN VIEW ===
     [EDITABLE] spacing and sizes; colors come from the design tokens. */
    .w-contenu--plan { display: flex; flex-direction: column; overflow: hidden; padding-bottom: .75rem; }
    .w-contenu--plan #pPanneau { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .w-contenu--plan .w-principal { gap: .5rem; }
    .w-assistant__pied { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .75rem; padding-top: 1rem; border-top: 1px solid var(--border-default-grey); }
    .w-assistant__pied .w-pousse-g { margin-right: auto; }
    .gp-identite { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; }
    .gp-identite__texte { min-width: 0; flex: 1 1 18rem; }
    .gp-identite .w-titre-vue { margin: 0; font-size: 1.375rem; line-height: 1.875rem; }
    .gp-resume { display: flex; flex-wrap: wrap; gap: .375rem; align-items: center; justify-content: flex-end; margin: .25rem 0 0; padding: 0; list-style: none; }
    .gp-resume .ui-badge { font-weight: 600; }
    .gp-resume [class*="ui-icon-"]::before { width: .875rem; height: .875rem; margin-right: .25rem; vertical-align: -.125rem; }
    .gp-outils { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .gp-outils__groupe { display: flex; align-items: center; gap: .375rem; flex-wrap: wrap; }
    .gp-pousse { margin-left: auto; }
    /* Segmented control (zoom, view): one pressed button at a time. */
    .gp-seg { display: inline-flex; flex-wrap: nowrap; border: 1px solid var(--border-default-grey); border-radius: var(--radius-control); overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey); }
    .gp-seg button { display: inline-flex; align-items: center; gap: .25rem; border: 0; border-left: 1px solid var(--border-default-grey); background: transparent;
      padding: .25rem .625rem; min-height: 2rem; font-size: .8125rem; font-weight: 500; color: var(--text-default-grey); cursor: pointer; white-space: nowrap; }
    .gp-seg button:first-child { border-left: 0; }
    .gp-seg button:hover { background: var(--background-default-grey-hover); }
    .gp-seg button[aria-pressed="true"] { background: var(--background-action-low-primary); color: var(--text-active-primary); font-weight: 700; }
    .gp-seg button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
    .gp-seg [class*="ui-icon-"]::before { width: 1rem; height: 1rem; }
    .gp-legende { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem 1rem; font-size: .8125rem; margin: 0; padding: 0; list-style: none; color: var(--text-default-grey); }
    .gp-legende__titre { font-weight: 700; color: var(--text-mention-grey); font-size: .75rem; }
    .gp-legende li { display: inline-flex; align-items: center; gap: .375rem; }
    .gp-legende__n { color: var(--text-mention-grey); font-size: .75rem; }
    .gp-pastille { display: inline-block; flex: 0 0 auto; width: .875rem; height: .875rem; border-radius: 3px; border: 1px solid; border-left-width: 4px; }
    .gp-pastille--jalon { width: .625rem; height: .625rem; border-left-width: 1px; transform: rotate(45deg); border-radius: 1px; margin: 0 .125rem; }
    .gp-signe { display: inline-flex; align-items: center; gap: .25rem; color: var(--text-default-grey); }
    .gp-signe [class*="ui-icon-"]::before { width: 1rem; height: 1rem; }
    .gp-signe--alerte { color: #a61e4d; }
    .gp-note { margin: 0; font-size: .8125rem; color: var(--text-mention-grey); display: flex; align-items: center; gap: .375rem; flex-wrap: wrap; }

  /* Step numbers in the step bar (completed steps show a check instead). */
    .w-etapes__num { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 1.125rem; height: 1.125rem; margin-top: .0625rem; border-radius: 50%;
      font-size: .6875rem; font-weight: 700; line-height: 1; background: var(--background-contrast-grey); color: var(--text-mention-grey); }
    .w-etapes__item--en-cours .w-etapes__num { background: var(--background-action-high-primary); color: var(--text-inverted-primary); }
    .w-etapes__item--suivante .w-etapes__num { background: var(--background-action-low-primary); color: var(--text-active-primary); }
    .w-etapes__ligne { align-items: center; }

  /* === SECTION : TIMELINE ===
     One scroll container (both axes). Lane names stay on the left and the
     time scale stays on top while scrolling (position: sticky). */
    .gp-tl { --gp-lane-w: 15rem; --gp-row-h: 34px; position: relative; flex: 1 1 auto; min-height: 14rem; overflow: auto; overscroll-behavior: contain;
      border: 1px solid var(--border-default-grey); border-radius: var(--radius-card); background: var(--background-default-grey); color: var(--text-default-grey); }
    .gp-tl:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .gp-tl--apercu { flex: 0 0 auto; min-height: 0; max-height: 26rem; }
    .gp-tl__toile { position: relative; min-height: 100%; }
    .gp-tl__tete { position: sticky; top: 0; z-index: 8; display: flex; height: 3.25rem; background: var(--background-alt-grey); color: var(--text-default-grey);
      border-bottom: 1px solid var(--border-default-grey); }
    .gp-tl__coin { position: sticky; left: 0; z-index: 9; flex: 0 0 var(--gp-lane-w); width: var(--gp-lane-w); display: flex; align-items: flex-end; padding: .375rem .75rem;
      background: var(--background-alt-grey); color: var(--text-mention-grey); border-right: 1px solid var(--border-default-grey);
      font-size: .75rem; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .gp-tl__echelle { position: relative; flex: 0 0 auto; height: 100%; }
    .gp-ech__rang { position: absolute; left: 0; right: 0; }
    .gp-ech__rang--haut { top: 0; height: 1.5rem; border-bottom: 1px solid var(--border-default-grey); }
    .gp-ech__rang--bas { top: 1.5rem; bottom: 0; }
    .gp-ech__c { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border-default-grey); font-size: .75rem; white-space: nowrap; overflow: clip; color: var(--text-default-grey); }
    .gp-ech__rang--haut .gp-ech__c { font-weight: 700; line-height: 1.5rem; }
    .gp-ech__rang--haut .gp-ech__c > span { position: sticky; left: calc(var(--gp-lane-w) + .5rem); padding: 0 .5rem; display: inline-block; }
    .gp-ech__rang--bas .gp-ech__c { text-align: center; line-height: 1.75rem; color: var(--text-mention-grey); }
    .gp-ech__c--we { background: var(--background-contrast-grey); }
    .gp-ech__c--auj { color: #a61e4d; font-weight: 700; }
    .gp-ech__sem { font-size: .75rem; font-weight: 400; color: var(--text-mention-grey); margin-left: .375rem; }
    .gp-auj__pastille { position: absolute; top: 3px; z-index: 3; padding: 0 .375rem; border-radius: 999px; font-size: .75rem; line-height: 1.125rem;
      font-weight: 700; background: var(--accent-flamingo); color: var(--text-inverted-grey); pointer-events: none; white-space: nowrap; box-shadow: 0 0 0 2px var(--background-alt-grey); }
    .gp-auj--tete { z-index: 2; }
    .gp-tl__corps { position: relative; }
    .gp-tl__fond { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
    .gp-fond__c { position: absolute; top: 0; bottom: 0; border-left: 1px solid #ececf1; }
    .gp-fond__c--maj { border-left-color: #d9d9e0; }
    .gp-fond__c--we { background: #f5f5f8; }
    .gp-auj { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; z-index: 5; background: var(--accent-flamingo); pointer-events: none; }
    .gp-ligne { position: absolute; left: 0; display: flex; height: var(--gp-row-h); }
    .gp-ligne > .gp-ligne__nom, .gp-ligne > .gp-ligne__zone { border-bottom: 1px solid #f0f0f4; }
    .gp-ligne--groupe > .gp-ligne__nom, .gp-ligne--groupe > .gp-ligne__zone { border-bottom-color: var(--border-default-grey); }
    .gp-ligne--premiere > .gp-ligne__nom, .gp-ligne--premiere > .gp-ligne__zone { border-top: 1px solid #d9d9e0; }
    .gp-ligne__nom { position: sticky; left: 0; z-index: 6; flex: 0 0 var(--gp-lane-w); width: var(--gp-lane-w); display: flex; align-items: center; gap: .375rem; min-width: 0;
      padding: 0 .75rem; font-size: .8125rem; background: var(--background-default-grey); color: var(--text-default-grey); border-right: 1px solid var(--border-default-grey); }
    .gp-ligne__nom > span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
    .gp-ligne__nom .gp-ligne__sous { flex: 0 0 auto; margin-left: auto; font-size: .75rem; color: var(--text-mention-grey); }
    .gp-ligne__zone { position: relative; flex: 0 0 auto; }
    .gp-ligne--groupe { height: 32px; background: var(--background-alt-grey); color: var(--text-default-grey); }
    .gp-ligne--groupe .gp-ligne__nom { background: var(--background-alt-grey); padding: 0 .375rem; font-weight: 700; }
    .gp-groupe__bouton { display: flex; align-items: center; gap: .25rem; width: 100%; min-width: 0; min-height: 1.75rem; padding: 0 .25rem; border: 0; border-radius: var(--radius-control);
      background: transparent; color: var(--text-title-grey); font: inherit; font-weight: 700; cursor: pointer; text-align: left; }
    .gp-groupe__bouton:hover { background: var(--background-contrast-grey); }
    .gp-groupe__bouton:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
    .gp-groupe__bouton > .gp-groupe__nom { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
    .gp-groupe__bouton > .gp-groupe__n { flex: 0 0 auto; margin-left: auto; font-size: .75rem; font-weight: 400; color: var(--text-mention-grey); }
    .gp-groupe__bouton [class*="ui-icon-"]::before { width: 1.125rem; height: 1.125rem; }
    .gp-groupe__etendue { position: absolute; top: 13px; height: 6px; border-radius: 3px; background: #c9c9d3; pointer-events: none; }
    /* Bars: light tint of the series color, colored left edge, dark text
       (contrast at least 4.5:1 on every tint). */
    .gp-barre { position: absolute; top: 5px; height: calc(var(--gp-row-h) - 10px); z-index: 2; display: flex; align-items: center; min-width: 6px; padding: 0 .375rem 0 .4375rem;
      margin: 0; border: 1px solid; border-left-width: 4px; border-radius: 5px; overflow: hidden; white-space: nowrap; cursor: pointer; text-align: left;
      font: inherit; font-size: .75rem; font-weight: 600; line-height: 1; color: var(--text-default-grey); touch-action: none; user-select: none; -webkit-user-select: none; }
    .gp-barre--fixe { cursor: pointer; }
    .gp-barre--mobile { cursor: grab; }
    .gp-barre:hover { box-shadow: 0 1px 4px rgba(38, 38, 51, .22); z-index: 4; }
    .gp-barre:focus-visible { outline: 2px solid var(--text-default-grey); outline-offset: 2px; z-index: 7; }
    .gp-barre__prog { position: absolute; left: 0; top: 0; bottom: 0; pointer-events: none; }
    .gp-barre__txt { position: relative; display: flex; align-items: center; gap: .375rem; min-width: 0; overflow: hidden; }
    .gp-barre__titre { overflow: hidden; text-overflow: ellipsis; }
    .gp-barre__sous { font-weight: 400; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
    .gp-barre [class*="ui-icon-"]::before { width: .875rem; height: .875rem; vertical-align: 0; }
    .gp-barre__ico { flex: 0 0 auto; color: #a61e4d; display: inline-flex; }
    .gp-barre__ico--partage { color: var(--text-mention-grey); }
    .gp-barre--retard { box-shadow: 0 0 0 2px var(--accent-flamingo); }
    .gp-barre--retard:hover { box-shadow: 0 0 0 2px var(--accent-flamingo), 0 1px 4px rgba(38, 38, 51, .22); }
    .gp-barre--conflit { border-style: dashed; border-left-style: solid; }
    .gp-barre--glisse { cursor: grabbing; z-index: 7; opacity: .92; box-shadow: 0 6px 16px rgba(38, 38, 51, .25); }
    .gp-barre--selection { outline: 2px solid var(--text-action-high-primary); outline-offset: 2px; }
    .gp-barre__poignee { position: absolute; top: 0; bottom: 0; width: 8px; z-index: 3; cursor: ew-resize; }
    .gp-barre__poignee--deb { left: -4px; }
    .gp-barre__poignee--fin { right: 0; }
    /* Label outside a bar too narrow to hold it. */
    .gp-barre__dehors { position: absolute; top: 0; z-index: 2; line-height: var(--gp-row-h); font-size: .75rem; font-weight: 600; white-space: nowrap; pointer-events: none;
      color: var(--text-default-grey); }
    .gp-barre__dehors .gp-barre__sous { font-weight: 400; color: var(--text-mention-grey); opacity: 1; }
    /* Milestone: diamond, label on the right. The whole is one button. */
    .gp-jalon { position: absolute; top: 4px; height: calc(var(--gp-row-h) - 8px); z-index: 2; display: flex; align-items: center; gap: .5rem; padding: 0 .375rem 0 0; margin: 0;
      border: 0; border-radius: 4px; background: transparent; color: var(--text-default-grey); font: inherit; font-size: .75rem; font-weight: 600; white-space: nowrap; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    .gp-jalon__losange { flex: 0 0 auto; width: 14px; height: 14px; margin-left: 2px; transform: rotate(45deg); border: 2px solid; border-radius: 2px; }
    .gp-jalon:focus-visible { outline: 2px solid var(--text-default-grey); outline-offset: 1px; z-index: 7; }
    .gp-jalon:hover .gp-jalon__losange { box-shadow: 0 1px 4px rgba(38, 38, 51, .3); }
    .gp-jalon--retard .gp-jalon__losange { box-shadow: 0 0 0 2px var(--accent-flamingo); }
    .gp-jalon--mobile { cursor: grab; }
    .gp-fleches { position: absolute; top: 0; z-index: 1; overflow: visible; pointer-events: none; }
    .gp-tl--sans-couloir .gp-ligne__nom, .gp-tl--sans-couloir .gp-tl__coin { display: none; }
    .gp-tl__vide { position: absolute; left: var(--gp-lane-w); right: 0; top: 4rem; text-align: center; color: var(--text-mention-grey); font-size: .875rem; }
    .gp-tl__indice { position: sticky; left: 0; display: block; padding: .5rem .75rem; font-size: .75rem; color: var(--text-mention-grey); }
    /* Tooltip of a bar: shown on hover and keyboard focus. */
    .gp-bulle { position: fixed; z-index: 9989; max-width: 22rem; padding: .5rem .75rem; border: 1px solid var(--border-plain-grey); border-radius: 8px; pointer-events: none;
      background: var(--background-default-grey); color: var(--text-default-grey); box-shadow: 0 6px 20px rgba(38, 38, 51, .18); font-size: .8125rem; line-height: 1.4; }
    .gp-bulle[hidden] { display: none; }
    .gp-bulle__titre { margin: 0 0 .25rem; font-weight: 700; color: var(--text-title-grey); overflow-wrap: anywhere; }
    .gp-bulle__l { margin: 0; color: var(--text-default-grey); overflow-wrap: anywhere; }
    .gp-bulle__l b { font-weight: 600; color: var(--text-mention-grey); }
    .gp-bulle__alerte { margin: .25rem 0 0; color: #a61e4d; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { .gp-tl { scroll-behavior: auto; } }

  /* === SECTION : LIST VIEW === */
    .gp-liste { flex: 1 1 auto; min-height: 10rem; overflow: auto; border: 1px solid var(--border-default-grey); border-radius: var(--radius-card); background: var(--background-default-grey); color: var(--text-default-grey); }
    .gp-liste table { width: 100%; border-collapse: collapse; font-size: .8125rem; }
    .gp-liste th, .gp-liste td { padding: .4375rem .75rem; text-align: left; border-bottom: 1px solid var(--border-default-grey); vertical-align: middle; }
    .gp-liste thead th { position: sticky; top: 0; z-index: 2; background: var(--background-alt-grey); color: var(--text-title-grey); font-weight: 700; padding: 0; white-space: nowrap; }
    .gp-liste thead th > span, .gp-tri { display: flex; align-items: center; gap: .25rem; width: 100%; padding: .5rem .75rem; border: 0; background: transparent; font: inherit; font-weight: 700; color: inherit; text-align: left; cursor: pointer; }
    .gp-tri:hover { background: var(--background-contrast-grey); }
    .gp-tri:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
    .gp-tri [class*="ui-icon-"]::before { width: .875rem; height: .875rem; }
    .gp-liste tbody tr:hover { background: var(--background-alt-grey); }
    .gp-liste td.gp-num { text-align: right; font-variant-numeric: tabular-nums; }
    .gp-liste .gp-ouvrir { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text-action-high-primary); text-align: left; cursor: pointer; }
    .gp-liste .gp-ouvrir:hover { text-decoration: underline; }
    .gp-liste .gp-ouvrir:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .gp-liste .gp-sansdate { color: var(--text-mention-grey); font-style: italic; }

  /* === SECTION : WIZARD PREVIEW AND SUGGESTIONS === */
    .gp-apercu { display: flex; flex-direction: column; gap: .5rem; }
    .gp-apercu .gp-tl { --gp-lane-w: 8.5rem; --gp-row-h: 28px; }
    .gp-apercu .gp-tl__tete { height: 2.75rem; }
    .gp-apercu .gp-ech__rang--haut { height: 1.25rem; }
    .gp-apercu .gp-ech__rang--haut .gp-ech__c { line-height: 1.25rem; }
    .gp-apercu .gp-ech__rang--bas { top: 1.25rem; }
    .gp-apercu .gp-ech__rang--bas .gp-ech__c { line-height: 1.5rem; }
    .gp-apercu .gp-barre, .gp-apercu .gp-jalon { cursor: default; }
    .gp-mini { position: relative; height: 4.25rem; border-radius: 6px; background: var(--background-alt-grey); color: var(--text-default-grey); overflow: hidden; }
    .gp-mini__b { position: absolute; height: 7px; border-radius: 4px; }
    .gp-mini__auj { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent-flamingo); }
    .gp-tuile-tete { display: flex; align-items: center; gap: .5rem; }
    .gp-tuile-tete .ui-h6 { flex: 1; min-width: 0; }
    .gp-faits { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .125rem; font-size: .8125rem; color: var(--text-default-grey); }
    .gp-faits b { font-weight: 600; color: var(--text-mention-grey); }
    .gp-nuancier { display: flex; flex-wrap: wrap; gap: .375rem; }
    .gp-nuance { width: 2rem; height: 2rem; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .gp-nuance[aria-pressed="true"] { border-color: var(--text-default-grey); box-shadow: inset 0 0 0 2px #fff; }
    .gp-nuance:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .gp-cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .25rem 1rem; }
    .gp-deplacer { display: flex; flex-wrap: wrap; gap: .375rem; align-items: center; }
    .gp-deplacer__libelle { font-size: .8125rem; color: var(--text-mention-grey); margin-right: .25rem; }
    .gp-alertes { display: flex; flex-direction: column; gap: .5rem; }
    .gp-recaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(21rem, 100%), 1fr)); gap: 1rem; align-items: start; }
    .w-recap--info { background: var(--background-alt-primary); border-color: var(--background-action-low-primary); color: var(--text-default-grey); }
    /* Feedback as toasts at the bottom: the timeline does not jump when a
       message appears, and an open details panel stays readable. */
    .w-erreur.actif, .w-succes.actif { position: fixed; left: 1rem; bottom: 1rem; z-index: 9996; width: auto; max-width: min(38rem, calc(100% - 2rem));
      box-shadow: 0 8px 28px rgba(38, 38, 51, .22); background: var(--background-default-grey); color: var(--text-default-grey); }
    .w-erreur.actif { bottom: 1rem; }
    .w-erreur.actif + .w-succes.actif { bottom: 7rem; }
    .w-succes__actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .gp-tl-aide { margin: 0; font-size: .75rem; color: var(--text-mention-grey); }

  /* === SECTION : NARROW SCREENS (plan) === */
    .gp-seul-etroit { display: none; }
    @media (max-width: 48em) {
      .gp-tl { --gp-lane-w: 8.5rem; }
      .w-contenu--plan { overflow-y: auto; display: block; }
      .w-contenu--plan #pPanneau, .w-contenu--plan .w-disposition, .w-contenu--plan .w-principal { display: block; }
      .w-contenu--plan .w-principal > * + * { margin-top: .5rem; }
      .gp-tl, .gp-liste { height: 72vh; min-height: 20rem; }
      .gp-seul-etroit { display: block; }
      .gp-seul-etroit.ui-select { width: auto; margin-top: 0; }
      .gp-resume { justify-content: flex-start; }
      .gp-pousse { margin-left: 0; }
      .gp-outils { gap: .375rem; }
      .gp-masque-etroit { display: none; }
    }

  /* === SECTION : PRINT ===
     Print / PDF: the plan title, its summary, the legend and the timeline
     of the visible period, on landscape paper (the size is set by the
     script: US Letter in North America, A4 elsewhere). */
    .gp-impression-titre { display: none; }
    @media print {
      html, body { height: auto; overflow: visible; display: block; background: #fff; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #skipLink, .w-bandeau, .w-onglets, .w-volet, .w-volet-mobile, .gp-outils, .w-erreur, .w-succes, .w-loader, .w-overlay, .gp-bulle, .gp-ecran { display: none !important; }
      .w-contenu, .w-contenu--plan { overflow: visible; padding: 0; display: block; }
      .w-disposition, .w-principal, #pPanneau { display: block; }

function fabriquerPiege(racine, fermer) {

/* Step bar: one segment per step, its name below. Blue for completed steps

function stepper(n, noms, aller, actionFinale) {
  var d = creer('div', { classe: 'ui-stepper w-stepper' });
  var connu = noms.length > 1;
  d.appendChild(creer('h2', { classe: 'ui-stepper__title', attrs: { tabindex: '-1', id: 'titreVue' } }, [noms[n - 1],
    creer('span', { classe: 'ui-stepper__state', texte: connu ? 'Step ' + n + ' of ' + noms.length : 'Step ' + n })]));
  var liste = noms.slice();

  liste.forEach(function (nom, i) {

    var action = rang !== n && aller ? aller(rang) : null;

      suivante ? creer('span', { classe: 'w-etapes__appel' }, ['Continue', creer('span', { classe: 'ui-icon-arrow-right-line ui-icon--sm', attrs: { 'aria-hidden': 'true' } })]) : null];
    var li = creer('li', { classe: 'w-etapes__item w-etapes__item--' + etatEtape + (action ? ' w-etapes__item--lien' : '') + (suivante ? ' w-etapes__item--suivante' : '') },

/* Rejected input: design system error message below the field, linked
   with aria-describedby, focus on the field and announcement. This is not
   an anomaly: logged at INFO level. */
function marquerInvalide(id, message, sansFocus) {
  var n = document.getElementById(id);
  logSecurite('INFO', 'Input rejected: ' + message);
  if (!n) { signalerSaisie(message); return; }
  var idMsg = id + '_erreur';
  var ancien = document.getElementById(idMsg);
  if (ancien) { ancien.parentNode.removeChild(ancien); }
  var msg = creer('p', { classe: 'ui-error-text', id: idMsg, texte: message });
  var groupe = n.closest ? n.closest('.ui-input-group') : null;
  if (groupe) { groupe.classList.add('ui-input-group--error'); groupe.appendChild(msg); }
  else if (n.parentNode) { n.parentNode.insertBefore(msg, n.nextSibling); }
  n.setAttribute('aria-invalid', 'true');
  n.setAttribute('aria-describedby', idMsg);
  var effacer = function () {
    n.removeAttribute('aria-invalid');
    n.removeAttribute('aria-describedby');
    if (groupe) { groupe.classList.remove('ui-input-group--error'); }
    if (msg.parentNode) { msg.parentNode.removeChild(msg); }
    n.removeEventListener('input', effacer);
    n.removeEventListener('change', effacer);
  };
  n.addEventListener('input', effacer);
  n.addEventListener('change', effacer);
  if (!sansFocus) { n.focus(); }
  annoncer(message);
}

/* Rejected input with no field to point to: banner, without ERROR level. */

async function obtenirJeton(complet) {

  var r = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: !complet }), 15000);

async function fetchDelai(url, options, delaiMs) {
  var ctrl = new AbortController();
  var minut = setTimeout(function () { ctrl.abort(); }, delaiMs);
  try {
    options.signal = ctrl.signal;
    return await fetch(url, options);
  } finally {
    clearTimeout(minut);
  }

function extensionDe(nom) {
  var m = /\.([A-Za-z0-9]+)$/.exec(String(nom || ''));
  return m ? m[1].toLowerCase() : '';
}

function formaterTaille(octets) {
  if (!octets) { return ''; }
  if (octets < 1024) { return octets + ' B'; }
  if (octets < 1024 * 1024) { return Math.round(octets / 1024) + ' KB'; }
  return (octets / (1024 * 1024)).toLocaleString(localeNombre(), { maximumFractionDigits: 1 }) + ' MB';
}

function iconePJ(nom) {
  var ext = extensionDe(nom);
  if (PJ_IMAGES.indexOf(ext) !== -1) { return 'ui-icon-image-line'; }
  if (ext === 'pdf') { return 'ui-icon-file-pdf-line'; }
  return 'ui-icon-file-line';

async function recupererPJ(id) {
  var essai = async function (complet) {
    var j = await obtenirJeton(complet);
    return fetchDelai(j.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(j.token), {}, DELAI_API_MS);

  if (!rep.ok) { throw new Error('Response ' + rep.status); }

async function telechargerPJ(id) {

/* The person's rights, deduced from the marker rows they can read.

async function determinerDroits() {

  var manque = [];
  if (!etat.temoinEdition) { manque.push(CLE_ACCES_EDITION); }
  if (!etat.temoinParam) { manque.push(CLE_ACCES_PARAMETRAGE); }
  if (manque.length && !etat.temoinsTentes) {

    try {
      await gristAvecTimeout(grist.docApi.applyUserActions(manque.map(function (k) {

      })), DELAI_API_MS);

/* === SECTION : PLAN LIBRARY (one settings row per plan) [DO NOT EDIT] ===
   Several plans per document: one configuration row per plan, with key

async function lirePlans() {
  if (!etat.biblio) { etat.plans = []; return []; }
  var d = await lireTable(etat.biblio);
  var l = [];
  var temE = false, temP = false;
  for (var i = 0; i < d.id.length; i++) {
    var cle = colonneDe(d, 'KEY', i);
    if (cle === CLE_ACCES_EDITION) { temE = true; continue; }
    if (cle === CLE_ACCES_PARAMETRAGE) { temP = true; continue; }
    if (!(typeof cle === 'string' && cle.indexOf(CLE_CONFIG + ':') === 0)) { continue; }
    try {
      var cfg = JSON.parse(colonneDe(d, 'VALUE', i) || '{}');
      /* Renamed table: the plan is still found from the table linked to the view. */
      if (cfg && cfg.table) { retrouverRenommages(cfg); l.push({ cle: cle, ligne: d.id[i], config: cfg }); }
    } catch (e) {
      logSecurite('WARNING', 'Unreadable configuration: ' + cle, e);
    }
  }
  l.sort(function (a, b) { return a.ligne - b.ligne; });

  if (!t && etat.planMemorise) { t = chercher(function (x) { return x.cle === etat.planMemorise; }); }

  var j = (e - s) / JOUR;
  if (dt && j < 1) {
    var h = Math.round((e - s) / 60) / 60;
    return nombreLocale(h, 2) + ' hour' + (h !== 1 ? 's' : '');

  var r = Math.round(j * 10) / 10;
  return nombreLocale(r, 1) + ' day' + (r !== 1 ? 's' : '');

/* === SECTION : PLAN DATA === */
async function chargerDonnees() {
  var c = etat.config;
  var d = await lireTable(c.table);
  /* References: labels of the lanes, colors, labels and details. */
  var cols = [c.colTitle, c.colLane, c.colColor, c.colStatus].concat(c.labels || [], c.details || []);
  var vues = {};
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i] ? infoColonne(c.table, cols[i]) : null;
    var cible = col ? tableCibleRef(col.type) : null;
    if (!cible || cible === c.table) { continue; }
    var k = cible + '|' + (colAffichage(col) || '');
    if (vues[k]) { continue; }
    vues[k] = true;
    delete etat.refs[k];
    try { await chargerRef(cible, colAffichage(col)); } catch (e) { logSecurite('WARNING', 'Referenced table unreadable: ' + cible, e); }
  }
  if (c.colAttach || (c.details || []).some(function (x) { var cc = infoColonne(c.table, x); return cc && cc.type === 'Attachments'; })) { await chargerMetaPJ(); }
  etat.donnees = d;
  construireItems();
}

function valeurLigne(i, colId) { return colId && etat.donnees ? colonneDe(etat.donnees, colId, i) : undefined; }

function clesCouloir(v, col) {
  v = valeurCellule(v);
  var t = col ? String(col.type) : '';
  if (t.indexOf('RefList:') === 0 || t === 'ChoiceList') {
    var l = Array.isArray(v) && v[0] === 'L' ? v.slice(1).filter(function (x) { return x !== null && x !== '' && x !== 0; }).map(String) : [];
    return l.length ? l : [CLE_SANS];
  }
  if (t.indexOf('Ref:') === 0) { return typeof v === 'number' && v ? [String(v)] : [CLE_SANS]; }
  if (t === 'Bool') { return [v === true ? 'true' : 'false']; }
  if (v === null || v === undefined || v === '' || Array.isArray(v)) { return [CLE_SANS]; }
  return [String(v)];
}

function libelleCle(cle, col) {
  if (cle === CLE_SANS) { return 'No ' + (col ? String(col.label).toLowerCase() : 'value'); }
  var t = col ? String(col.type) : '';
  if (t.indexOf('Ref') === 0) {
    var r = refDeColonne(col);
    return r && r.libelles[cle] ? r.libelles[cle] : 'Row ' + cle;
  }
  if (t === 'Bool') { return cle === 'true' ? 'Yes' : 'No'; }
  return cle;
}

function estFaitValeur(v) {
  var c = etat.config;
  if (v === null || v === undefined || v === '') { return false; }
  var col = infoColonne(c.table, c.colStatus);
  if (col && col.type === 'Bool') { return v === true; }
  var texte = String(col && String(col.type).indexOf('Ref:') === 0 ? libelleCle(String(v), col) : v);
  var n = normalizer(texte);
  return (c.doneValues || []).some(function (x) { return normalizer(x) === n; });
}

/* Builds the items of the plan from the rows: dates on the wall clock
   axis, lanes, color key, progress, done, overdue, dependencies, then the
   conflicts (dependencies, overlaps). */
function construireItems() {
  var c = etat.config;
  var d = etat.donnees;
  var t = c.table;
  var colS = infoColonne(t, c.colStart);
  var colE = c.dateMode === 'range' ? infoColonne(t, c.colEnd) : null;
  var colD = c.dateMode === 'duration' ? infoColonne(t, c.colDuration) : null;
  var colL = c.colLane ? infoColonne(t, c.colLane) : null;
  var colC = c.colorMode === 'choice' && c.colColor ? infoColonne(t, c.colColor) : null;
  var colP = c.colProgress ? infoColonne(t, c.colProgress) : null;
  var colT = infoColonne(t, c.colTitle);
  var dt = estDateTime(colS);
  var tz = fuseauPlan(c);
  var maintenant = maintenantMur(tz);
  var auj = aujourdhuiMur(tz);
  var items = [];
  var parId = {};
  for (var i = 0; i < d.id.length; i++) {
    var id = d.id[i];
    if (etat.idsLies && !etat.idsLies[id]) { continue; }
    var it = { id: id, i: i, titre: texteCellule(valeurLigne(i, c.colTitle), colT) || 'Untitled', s: null, e: null, jalon: false, jx: null, inverse: false,
      couloirs: [CLE_SANS], couleur: null, prog: null, fait: false, retard: false, deps: [], conflits: [], chevauche: [], partage: false };
    var s = murDe(valeurLigne(i, c.colStart), colS);
    var e = null;
    if (colE) {
      e = murDe(valeurLigne(i, c.colEnd), colE);
      if (e !== null && !estDateTime(colE)) { e += JOUR; }
    } else if (colD && s !== null) {
      var du = valeurCellule(valeurLigne(i, c.colDuration));
      if (typeof du === 'number' && isFinite(du) && du > 0) { e = s + du * JOUR; }
    }
    if (s === null && e !== null) { s = e - (colE && !estDateTime(colE) ? JOUR : 0); it.jalon = true; }
    var jalonCol = c.colMilestone ? valeurCellule(valeurLigne(i, c.colMilestone)) === true : false;
    if (c.dateMode === 'milestone' || e === null || jalonCol) { it.jalon = true; }
    if (s !== null && e !== null && e < s) { it.inverse = true; it.jalon = true; }
    if (s !== null) {
      if (it.jalon) {
        var jour = jalonCol && e !== null && !it.inverse ? (colE && !estDateTime(colE) ? e - JOUR : e) : s;
        it.s = jour;
        it.e = dt && !jalonCol ? jour : jour + (dt ? 0 : JOUR);
        it.jx = dt ? jour : jour + JOUR / 2;
      } else {
        it.s = s;
        it.e = Math.max(e, s + (dt ? 60 : JOUR));
      }
    }
    if (colL) {
      it.couloirs = clesCouloir(valeurLigne(i, c.colLane), colL);
      it.partage = it.couloirs.length > 1;
    }
    if (c.colorMode === 'choice' && colC) {
      var vc = valeurCellule(valeurLigne(i, c.colColor));
      it.couleur = vc === null || vc === undefined || vc === '' || vc === 0 ? CLE_SANS : (typeof vc === 'boolean' ? String(vc) : String(vc));
    } else if (c.colorMode === 'lane') { it.couleur = it.couloirs[0]; }
    if (colP) {
      var p = valeurCellule(valeurLigne(i, c.colProgress));
      if (typeof p === 'number' && isFinite(p)) {
        var f = colP.options && colP.options.numMode === 'percent' ? p : (p > 1 ? p / 100 : p);
        it.prog = Math.max(0, Math.min(1, f));
      }
    }
    if (c.colStatus) { it.fait = estFaitValeur(valeurCellule(valeurLigne(i, c.colStatus))); }
    if (it.prog !== null && it.prog >= 1) { it.fait = true; }
    /* Overdue only when the plan can tell what is done (status or progress). */
    if (it.s !== null && !it.fait && (c.colStatus || c.colProgress)) {
      var finRef = it.jalon ? (dt ? it.s : it.s + JOUR) : it.e;
      it.retard = dt ? finRef < maintenant : finRef <= auj;
    }
    if (c.colDeps) {
      var vd = valeurCellule(valeurLigne(i, c.colDeps));
      if (Array.isArray(vd) && vd[0] === 'L') { it.deps = vd.slice(1).filter(function (x) { return typeof x === 'number' && x; }); }
      else if (typeof vd === 'number' && vd) { it.deps = [vd]; }
    }
    items.push(it);
    parId[id] = it;
  }
  /* Dependency conflict: the item starts before its predecessor ends. */
  items.forEach(function (it) {
    it.deps.forEach(function (pid) {
      var p = parId[pid];
      if (p && p.s !== null && it.s !== null && p.id !== it.id && it.s < (p.jalon ? p.s + (dt ? 0 : JOUR) : p.e) - 1) { it.conflits.push(pid); }
    });
  });
  /* Overlaps in the same lane (bookings, shifts). */
  if (c.overlapCheck) {
    var parCouloir = Object.create(null);
    items.forEach(function (it) {
      if (it.s === null || it.jalon) { return; }
      it.couloirs.forEach(function (k) { if (k !== CLE_SANS) { (parCouloir[k] = parCouloir[k] || []).push(it); } });
    });
    Object.keys(parCouloir).forEach(function (k) {
      var l = parCouloir[k].sort(function (a, b) { return a.s - b.s; });
      var actifs = [];
      l.forEach(function (it) {
        actifs = actifs.filter(function (x) { return x.e > it.s; });
        actifs.forEach(function (x) {
          if (x.chevauche.indexOf(it.id) === -1) { x.chevauche.push(it.id); }
          if (it.chevauche.indexOf(x.id) === -1) { it.chevauche.push(x.id); }
        });
        actifs.push(it);
      });
    });
  }
  etat.items = items;
  etat.parId = parId;
}

/* === SECTION : LANES AND COLORS === */
function colCouloir() { return etat.config.colLane ? infoColonne(etat.config.table, etat.config.colLane) : null; }
function colCouleur() {
  var c = etat.config;
  if (c.colorMode === 'lane') { return colCouloir(); }
  return c.colorMode === 'choice' && c.colColor ? infoColonne(c.table, c.colColor) : null;
}

/* Ordered keys of a column used for lanes or colors: choice list order,
   referenced table order, Yes/No, otherwise alphabetical; empty last. */
function ordreCles(col, presentes, alphabetique) {
  var t = col ? String(col.type) : '';
  var l = [];
  var vu = Object.create(null);
  var ajouter = function (k) { k = String(k); if (!vu[k] && presentes[k]) { vu[k] = true; l.push(k); } };
  if (t === 'Choice' || t === 'ChoiceList') { choixDe(col).forEach(ajouter); }
  else if (t.indexOf('Ref') === 0) { var r = refDeColonne(col); if (r) { r.ids.forEach(ajouter); } }
  else if (t === 'Bool') { ['true', 'false'].forEach(ajouter); }
  var alpha = function (a, b) { return libelleCle(a, col).localeCompare(libelleCle(b, col), localeDoc(), { numeric: true }); };
  var reste = Object.keys(presentes).filter(function (k) { return !vu[k] && k !== CLE_SANS; }).sort(alpha);
  l = l.concat(reste);
  if (alphabetique) { l.sort(alpha); }
  if (presentes[CLE_SANS]) { l.push(CLE_SANS); }
  return l;
}

function hexVersRgb(h) {

  return rgbVersHex([0, 1, 2].map(function (k) { return x[k] * (1 - part) + y[k] * part; }));

function texteSur(fond) { return contraste(fond, '#ffffff') >= 4.5 ? '#ffffff' : '#262633'; }

/* Bar style from a color. Dark or saturated color: light tint, colored
   edge, dark text. Light color (a Grist choice fill): the fill itself,
   with its text color when readable. */
function styleCouleur(fond, texte) {
  var encre = '#262633';
  if (!hexVersRgb(fond)) { fond = PALETTE[0].c; }
  if (luminance(fond) > 0.45) {
    var t = texte && hexVersRgb(texte) && contraste(fond, texte) >= 4.5 ? texte : encre;
    return { fond: fond, texte: t, bord: melanger(fond, encre, 0.42), prog: melanger(fond, encre, 0.13), plein: melanger(fond, encre, 0.42) };
  }
  return { fond: melanger(fond, '#ffffff', 0.82), texte: encre, bord: fond, prog: melanger(fond, '#ffffff', 0.55), plein: fond };

function paletteParId(id) { for (var i = 0; i < PALETTE.length; i++) { if (PALETTE[i].id === id) { return PALETTE[i]; } } return PALETTE[0]; }

/* Colors of the plan: key to style and label, in legend order. */
function couleursPlan() {
  var c = etat.config;
  var res = { ordre: [], styles: Object.create(null), libelles: Object.create(null), n: Object.create(null) };
  if (c.colorMode === 'single' || !colCouleur()) {
    res.unique = styleCouleur(paletteParId(c.color || 'turquoise').c);
    return res;
  }
  var col = colCouleur();
  var presentes = Object.create(null);
  etat.items.forEach(function (it) {
    var ks = c.colorMode === 'lane' ? it.couloirs : [it.couleur || CLE_SANS];
    ks.forEach(function (k) { presentes[k] = true; res.n[k] = (res.n[k] || 0) + 1; });
  });
  if (col.type === 'Choice') { choixDe(col).forEach(function (k) { presentes[k] = true; }); }
  var ordre = ordreCles(col, presentes);
  var opts = col.options && col.options.choiceOptions ? col.options.choiceOptions : {};
  var rang = 0;
  ordre.forEach(function (k) {
    var o = opts[k] || null;
    var st;
    if (k === CLE_SANS) { st = styleCouleur('#9d9dab'); }
    else if (o && o.fillColor) { st = styleCouleur(o.fillColor, o.textColor); rang++; }
    else { st = styleCouleur(PALETTE[rang % PALETTE.length].c); rang++; }
    res.styles[k] = st;
    res.libelles[k] = libelleCle(k, col);

function styleItem(it, couleurs, cleLigne) {
  if (couleurs.unique) { return couleurs.unique; }
  var parCouloir = etat.config.colorMode === 'lane';
  var k = parCouloir ? (cleLigne && it.couloirs.indexOf(cleLigne) !== -1 ? cleLigne : it.couloirs[0]) : (it.couleur || CLE_SANS);
  return couleurs.styles[k] || styleCouleur('#9d9dab');
}

/* === SECTION : FILTERS === */
function periodeFiltre() {
  var f = etat.v.filtres;
  var tz = fuseauPlan(etat.config);
  var auj = aujourdhuiMur(tz);
  var d = new Date(auj * 1000);
  var a = d.getUTCFullYear(), m = d.getUTCMonth();
  var mois = function (an, mo) { return Date.UTC(an, mo, 1) / 1000; };
  if (f.periode === 'week') { var dow = (jourSemaine(auj) - debutSemaineJour() + 7) % 7; return [auj - dow * JOUR, auj + (7 - dow) * JOUR]; }
  if (f.periode === 'month') { return [mois(a, m), mois(a, m + 1)]; }
  if (f.periode === 'next3') { return [auj, mois(a, m + 3) + (d.getUTCDate() - 1) * JOUR]; }
  if (f.periode === 'quarter') { var q = Math.floor(m / 3) * 3; return [mois(a, q), mois(a, q + 3)]; }
  if (f.periode === 'year') { return [mois(a, 0), mois(a + 1, 0)]; }
  if (f.periode === 'custom') {
    var du = saisieVersDate(f.du), au = saisieVersDate(f.au);
    if (du === null && au === null) { return null; }
    return [du === null ? -1e12 : du, au === null ? 1e12 : au + JOUR];
  }
  return null;
}

function texteRecherche(it) {
  var c = etat.config;
  if (it._rech !== undefined) { return it._rech; }
  var morceaux = [it.titre];
  (c.labels || []).forEach(function (col) { morceaux.push(texteCellule(valeurLigne(it.i, col), infoColonne(c.table, col))); });
  if (c.colLane) { it.couloirs.forEach(function (k) { if (k !== CLE_SANS) { morceaux.push(libelleCle(k, colCouloir())); } }); }
  if (c.colorMode === 'choice' && it.couleur && it.couleur !== CLE_SANS) { morceaux.push(libelleCle(it.couleur, colCouleur())); }
  it._rech = normalizer(morceaux.join(' '));
  return it._rech;
}

function correspond(it) {
  var f = etat.v.filtres;
  if (f.recherche) {
    var mots = normalizer(f.recherche).split(/\s+/).filter(Boolean);
    var t = texteRecherche(it);
    if (!mots.every(function (m) { return t.indexOf(m) !== -1; })) { return false; }
  }
  if (f.couloir && it.couloirs.indexOf(f.couloir) === -1) { return false; }
  if (f.couleur) {
    var k = etat.config.colorMode === 'lane' ? it.couloirs : [it.couleur || CLE_SANS];
    if (k.indexOf(f.couleur) === -1) { return false; }
  }
  if (f.retard && !it.retard) { return false; }
  if (f.masquerFaits && it.fait) { return false; }
  var p = periodeFiltre();
  /* End dates are exclusive (a bar ending on the 31st stops at the 1st, 0:00):
     an item that ends exactly where the period starts is outside it. */
  if (p && (it.s === null || it.s >= p[1] || (it.e > it.s ? it.e <= p[0] : it.s < p[0]))) { return false; }
  return true;
}

function itemsVisibles() { return etat.items.filter(correspond); }

function nombreFiltresActifs() {
  var f = etat.v.filtres;
  var n = 0;
  if (f.recherche) { n++; }
  if (f.couloir) { n++; }
  if (f.couleur) { n++; }
  if (f.periode && periodeFiltre()) { n++; }
  if (f.retard) { n++; }
  if (f.masquerFaits) { n++; }
  return n;
}

function pourcentLocale(f) {
  try { return new Intl.NumberFormat(localeNombre(), { style: 'percent', maximumFractionDigits: 0 }).format(f); } catch (e) { return Math.round(f * 100) + ' %'; }
}
/* Counts use the grouping of the document locale (5,000 / 5.000). */
function pluriel(n, mot, motPluriel) { return (typeof n === 'number' ? formaterNombre(n) : n) + ' ' + (n === 1 ? mot : (motPluriel || mot + 's')); }

/* === SECTION : LAYOUT ===

   then one row per item (Gantt) or items packed on as few rows as possible
   (timeline). An item with several lanes appears in each of them. */
function trierItems(l) {
  var c = etat.config;
  var tri = c.sortBy || 'start';
  return l.slice().sort(function (a, b) {
    if (tri === 'title') { return a.titre.localeCompare(b.titre, localeDoc(), { numeric: true }) || a.i - b.i; }
    if (tri === 'table') { return a.i - b.i; }
    return (a.s === null ? 1e15 : a.s) - (b.s === null ? 1e15 : b.s) || (a.e || 0) - (b.e || 0) || a.i - b.i;

function disposer(items, ech, largeurTexte) {
  var c = etat.config;
  var col = colCouloir();
  var avecDates = items.filter(function (it) { return it.s !== null; });
  var groupes = [];
  if (col) {
    var parCle = Object.create(null);
    var presentes = Object.create(null);
    avecDates.forEach(function (it) { it.couloirs.forEach(function (k) { (parCle[k] = parCle[k] || []).push(it); presentes[k] = true; }); });
    if (col.type === 'Choice' && !(etat.v.filtres.couloir || etat.v.filtres.recherche || nombreFiltresActifs())) {
      choixDe(col).forEach(function (k) { presentes[k] = true; });
    }
    ordreCles(col, presentes, c.laneOrder === 'alpha').forEach(function (k) { groupes.push({ cle: k, libelle: libelleCle(k, col), items: trierItems(parCle[k] || []) }); });
  } else {
    groupes.push({ cle: null, libelle: '', items: trierItems(avecDates) });
  }
  var lignes = [];
  groupes.forEach(function (g) {
    var replie = g.cle !== null && !!etat.v.replies[g.cle];
    var s = null, e = null;
    g.items.forEach(function (it) { s = s === null ? it.s : Math.min(s, it.s); e = e === null ? it.e : Math.max(e, it.e); });
    if (g.cle !== null) { lignes.push({ type: 'groupe', cle: g.cle, libelle: g.libelle, n: g.items.length, replie: replie, s: s, e: e }); }
    if (replie) { return; }
    if (c.layout === 'packed') {
      var rangs = [];
      g.items.forEach(function (it) {
        var x1 = ech ? ech.x(it.jalon ? it.jx : it.s) : 0;
        var x2 = ech ? (it.jalon ? x1 + 22 : ech.x(it.e)) : 0;
        if (ech && largeurTexte) { var lt = largeurTexte(it); if (x2 - x1 < lt) { x2 = x1 + lt + (it.jalon ? 26 : 12); } }
        var r = null;
        for (var k = 0; k < rangs.length; k++) { if (rangs[k].fin <= x1 - 4) { r = rangs[k]; break; } }
        if (!r) { r = { fin: -1e12, items: [] }; rangs.push(r); }
        r.items.push(it);
        r.fin = x2;
      });
      if (!rangs.length) { lignes.push({ type: 'items', cle: g.cle, items: [], vide: true }); }
      rangs.forEach(function (r) { lignes.push({ type: 'items', cle: g.cle, items: r.items }); });
    } else {
      if (!g.items.length && g.cle !== null) { lignes.push({ type: 'items', cle: g.cle, items: [], vide: true }); }
      g.items.forEach(function (it) { lignes.push({ type: 'items', cle: g.cle, items: [it] }); });
    }
  });
  return lignes;
}

/* Summary of the plan: number of items, overdue, period covered. */

  var n = items.length;
  var retard = items.filter(function (it) { return it.retard; }).length;
  var faits = items.filter(function (it) { return it.fait; }).length;

/* Draws the rows near the visible part (all of them for print, the
   preview and small plans), and removes those far away. */
function rendreLignes(tl, force) {
  var geo = tl.geo || [];
  var r = tl.racine;
  var tout = tl.apercu || tl.impression || geo.length <= 160;
  var haut = r.scrollTop - 52, bas = haut + (r.clientHeight || 800);
  var a = tout ? -1e9 : haut - 700, b = tout ? 1e9 : bas + 700;

  var garder = {};
  for (var i = 0; i < geo.length; i++) {
    var g = geo[i];
    if (g.y + g.h < a) { continue; }
    if (g.y > b) { break; }
    garder[i] = true;
    if (!tl.rangees[i]) {
      var el = construireLigne(tl, g, i);
      tl.rangees[i] = el;
      tl.el.corps.appendChild(el.noeud);
    }
  }
  Object.keys(tl.rangees).forEach(function (k) {
    if (!garder[k]) {
      var n = tl.rangees[k].noeud;
      if (n.contains(document.activeElement)) { return; }
      if (n.parentNode) { n.parentNode.removeChild(n); }
      delete tl.rangees[k];

  tl.barres = [];
  Object.keys(tl.rangees).forEach(function (k) { tl.barres = tl.barres.concat(tl.rangees[k].barres); });
}

/* Header cells and background lines of the visible part only: the
   timeline can be very wide (a year at the hour scale). */
function rendreVisible(tl, force) {
  if (!tl.ech || !tl.el) { return; }
  var r = tl.racine;
  var ech = tl.ech;
  var L = ech.largeur;
  var bloc = 1200;
  var b = Math.floor(r.scrollLeft / bloc);
  var cle = tl.rendu + ':' + b + ':' + Math.round(r.clientWidth / 100);
  if (!force && tl.fenetre === cle) { return; }
  tl.fenetre = cle;
  var xa = Math.max(0, (b - 1) * bloc), xb = Math.min(L, (b + 2) * bloc + r.clientWidth);
  if (tl.impression) { xa = 0; xb = L; }
  var wa = ech.w(xa), wb = ech.w(xb);
  var niv = tl.niv;
  var el = tl.el;
  vider(el.rangH); vider(el.rangB); vider(el.fond);
  var tz = fuseauPlan(etat.config);
  var auj = aujourdhuiMur(tz);
  var limite = 4000;
  /* Top row */
  var u = debutUnite(niv.haut, wa, 1);
  var n = 0;
  var majeures = {};
  while (u < wb && n++ < limite) {
    var suiv = uniteSuivante(niv.haut, u, 1);
    var x1 = ech.x(u), x2 = ech.x(suiv);
    majeures[Math.round(x1)] = true;
    var c1 = Math.max(0, x1), c2 = Math.min(L, x2);
    if (c2 - c1 >= 0.5) {
      var texteH = libelleUnite(niv.haut, u, c2 - c1, true);
      if (largeurTexteBrut(texteH) + 20 > c2 - c1) { texteH = libelleCourt(niv.haut, u); }
      if (largeurTexteBrut(texteH) + 20 > c2 - c1 && niv.haut === 'mois') { texteH = fmtMur('mcc', { month: 'short' }, u); }
      if (largeurTexteBrut(texteH) + 14 > c2 - c1) { texteH = ''; }
      var lib = creer('span', { texte: texteH });
      if ((niv.haut === 'jour' || niv.haut === 'semaine') && texteH && c2 - c1 > largeurTexteBrut(texteH) + 90) { lib.appendChild(creer('span', { classe: 'gp-ech__sem', texte: 'Week ' + numeroSemaine(u + (niv.haut === 'semaine' ? 3 * JOUR : 0)) })); }
      var ch = creer('div', { classe: 'gp-ech__c' + (niv.haut === 'jour' && niv.weekend && estWeekEnd(u) ? ' gp-ech__c--we' : '') }, [lib]);
      ch.style.left = c1 + 'px';

      var we = niv.weekend && !ech.ouvres && estWeekEnd(u);
      var estAuj = (niv.bas === 'jour' && u === auj);
      var cb = creer('div', { classe: 'gp-ech__c' + (we ? ' gp-ech__c--we' : '') + (estAuj ? ' gp-ech__c--auj' : ''), texte: libelleUnite(niv.bas, u, a2 - a1, false) });
      cb.style.left = a1 + 'px';
      cb.style.width = (a2 - a1) + 'px';
      el.rangB.appendChild(cb);
      var fc = creer('div', { classe: 'gp-fond__c' + (majeures[Math.round(a1)] ? ' gp-fond__c--maj' : '') + (we ? ' gp-fond__c--we' : '') });
      fc.style.left = a1 + 'px';
      fc.style.width = (a2 - a1) + 'px';
      el.fond.appendChild(fc);
    }

   Double-click in an empty place: new item at that date. */
function brancherItem(tl, el, it, cap, dehors) {
  el.addEventListener('pointerenter', function () { if (!etat.glisserEnCours) { montrerBulle(el, it); } });
  el.addEventListener('pointerleave', function () { if (!etat.glisserEnCours) { masquerBulle(); } });
  el.addEventListener('focus', function () {
    Array.prototype.forEach.call(tl.racine.querySelectorAll('.gp-barre[tabindex="0"], .gp-jalon[tabindex="0"]'), function (n) { if (n !== el) { n.setAttribute('tabindex', '-1'); } });
    el.setAttribute('tabindex', '0');
    tl.focusId = it.id;
    montrerBulle(el, it);
  });
  el.addEventListener('blur', masquerBulle);
  el.addEventListener('click', function (e) {
    if (tl.clicBloque) { e.preventDefault(); tl.clicBloque = false; return; }
    masquerBulle();
    ouvrirItem(it);
  });
  el.addEventListener('dblclick', function (e) { e.stopPropagation(); });
  if (!cap.deplacer && !cap.debut && !cap.fin) { return; }
  el.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || etat.glisserEnCours) { return; }

    var mode = bord === 'debut' && cap.debut ? 'debut' : (bord === 'fin' && cap.fin ? 'fin' : (cap.deplacer ? 'deplacer' : null));
    if (!mode) { return; }

    }
    calculerGlisse(tl, g, dx);
    var ech = tl.ech;
    if (it.jalon) {

    } else {
      var x1 = ech.x(g.ns), x2 = ech.x(g.ne);
      el.style.left = x1 + 'px';
      el.style.width = Math.max(6, x2 - x1) + 'px';
      if (g.dehors) { g.dehors.style.left = (Math.max(x1 + 6, x2) + 6) + 'px'; }

    try { el.releasePointerCapture(g.id); } catch (err) { /* already released */ }
    if (!g.actif) { return; }
    tl.clicBloque = true;
    setTimeout(function () { tl.clicBloque = false; }, 400);
    el.classList.remove('gp-barre--glisse');
    etat.glisserEnCours = false;
    masquerBulle();
    if (annule || (g.ns === it.s && g.ne === it.e)) { redessinerTimeline(true); if (etat.rafraichirEnAttente) { planifierRafraichissement(); } return; }

  el.addEventListener('pointercancel', function (e) { finir(e, true); });
  el.addEventListener('keydown', function (e) {

}

function pasAccroche(tl) { return planDateHeure(etat.config) && tl.ech.ppj >= 300 ? HEURE : JOUR; }
function accrocher(w, pas) { return Math.round(w / pas) * pas; }

function calculerGlisse(tl, g, dx) {
  var it = g.it;
  var ech = tl.ech;
  var pas = pasAccroche(tl);
  /* Shortest length after a resize. With times, never more than the
     current length: a shift of a few hours resized in Week zoom (day
     snap) must not grow to a whole day as soon as the edge is touched. */
  var min = planDateHeure(etat.config) ? Math.min(pas, Math.max(60, it.e - it.s)) : JOUR;
  var decale = function (base) { var cible = ech.w(ech.x(base) + dx); return Math.round((cible - base) / pas) * pas; };
  if (g.mode === 'deplacer') {
    var delta = decale(it.jalon ? it.jx : it.s);
    g.ns = it.s + delta;
    g.ne = it.e + delta;
  } else if (g.mode === 'debut') {
    g.ns = Math.min(it.s + decale(it.s), it.e - min);
    g.ne = it.e;
  } else {
    g.ne = Math.max(it.e + decale(it.e), it.s + min);
    g.ns = it.s;
  }
}

function texteNouvellesDates(it, ns, ne) {
  var dt = planDateHeure(etat.config);
  if (it.jalon) { return texteMur(ns, dt); }
  var fin = dt ? ne : ne - JOUR;
  return texteMur(ns, dt) + ' - ' + texteMur(fin, dt) + ' (' + texteDuree(ns, ne, dt) + ')';
}

/* Arrow keys go from bar to bar; + and - zoom. */
function clavierTimeline(tl, e) {
  var cible = e.target;
  if (cible && /INPUT|SELECT|TEXTAREA/.test(cible.tagName)) { return; }
  if ((e.key === '+' || e.key === '=') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); zoomerAutour(tl, null, tl.ech.ppj * 1.5); return; }
  if ((e.key === '-' || e.key === '_') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); zoomerAutour(tl, null, tl.ech.ppj / 1.5); return; }
  var n = tl.ordre.length;
  if (!n) { return; }
  var id = cible && cible.getAttribute ? parseInt(cible.getAttribute('data-id'), 10) : NaN;
  var li = cible && cible.getAttribute ? parseInt(cible.getAttribute('data-ligne'), 10) : NaN;
  var i = -1;
  for (var q = 0; q < n; q++) { if (tl.ordre[q].id === id && tl.ordre[q].i === li) { i = q; break; } }
  var k = null;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { k = i < 0 ? 0 : Math.min(n - 1, i + 1); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { k = i < 0 ? 0 : Math.max(0, i - 1); }
  if (e.key === 'Home') { k = 0; }
  if (e.key === 'End') { k = n - 1; }
  if (k === null || (i < 0 && cible !== tl.racine)) { return; }
  e.preventDefault();
  focaliserItem(tl, k);
}

function montrerDansVue(tl, el) {
  var r = tl.racine;
  var lw = largeurCouloirs(tl);
  var x = parseFloat(el.style.left) || 0;
  var w = el.offsetWidth;
  var vueG = r.scrollLeft, vueD = r.scrollLeft + r.clientWidth - lw;
  if (x < vueG + 8 || x + Math.min(w, 200) > vueD - 8) { r.scrollLeft = Math.max(0, x - 40); }
  var ligne = el.closest ? el.closest('.gp-ligne') : null;
  if (ligne) {
    var top = ligne.offsetTop + 52, h = ligne.offsetHeight;
    if (top - 52 < r.scrollTop) { r.scrollTop = Math.max(0, top - 60); }
    else if (top + h > r.scrollTop + r.clientHeight) { r.scrollTop = top + h - r.clientHeight + 8; }
  }
}

function doubleClicTimeline(tl, e) {
  if (!etat.peutModifier || tl.apercu) { return; }
  var zone = e.target && e.target.closest ? e.target.closest('.gp-ligne__zone') : null;
  if (!zone || e.target.closest('.gp-barre, .gp-jalon')) { return; }

}

/* Zoom keeping the date under the pointer (or the center) in place. */
function zoomerAutour(tl, clientX, ppj) {
  ppj = Math.max(PPJ_MIN, Math.min(PPJ_MAX, ppj));
  var r = tl.racine;
  var lw = largeurCouloirs(tl);
  var rect = r.getBoundingClientRect();

  var ancre = tl.ech.w(r.scrollLeft + dx);

  etat.v.ppj = ppj;
  memoriserEtatVue();
  redessinerTimeline(false, { ancre: ancre, dx: dx });
  majBoutonsZoom();

function redessinerTimeline(garder, opt) {
  var tl = etat.tl;
  if (!tl || etat.vue !== 'plan' || etat.v.mode !== 'timeline') { return; }
  var r = tl.racine;
  var st = r.scrollTop;

  dessinerTimeline(tl, contexteTimeline());

  rendreVisible(tl, true);
  majTextesCollants(tl);

    var n = r.querySelector('[data-id="' + cssEchapper(focusId) + '"]');

/* First display of the timeline: Fit all starts at the beginning,
   the other zooms around today. */
function apresRenduPlan() {
  majPrincipal();
  var tl = etat.tl;
  if (!tl || !tl.ech) { return; }
  if (etat.v.scrollFait) { return; }
  etat.v.scrollFait = true;
  if (etat.v.zoom === 'fit') { tl.racine.scrollLeft = 0; rendreVisible(tl, true); return; }
  if (tl.ech.ppj >= 300 && tl.xAuj !== null) {
    /* Day zoom: the working day of today, from 7 in the morning. */
    var matin = tl.ech.x(aujourdhuiMur(fuseauPlan(etat.config)) + 7 * HEURE);
    tl.racine.scrollLeft = Math.max(0, matin);
    rendreVisible(tl, true);
    majTextesCollants(tl);
    return;
  }
  allerAujourdhui(false);
}

function allerAujourdhui(annonce) {
  var tl = etat.tl;
  if (!tl || !tl.ech) { return; }
  var r = tl.racine;
  var lw = largeurCouloirs(tl);
  if (tl.xAuj === null) {
    if (annonce) { annoncer('Today is outside the dates of this plan.'); afficherSucces('Today is outside the dates of this plan: use the zoom or the period filter to see it.'); }
    return;
  }
  var cible = tl.xAuj - (r.clientWidth - lw) * (planDateHeure(etat.config) && tl.ech.ppj >= 300 ? 0.15 : 0.3);
  r.scrollLeft = Math.max(0, cible);
  rendreVisible(tl, true);
  majTextesCollants(tl);
  if (annonce) { annoncer('Timeline moved to today.'); }
}

/* With a period filter, the timeline moves to its start. */

  var tl = etat.tl;
  var p = periodeFiltre();
  if (!tl || !tl.ech || !p) { return; }
  var x = tl.ech.x(Math.max(p[0], tl.debut));
  tl.racine.scrollLeft = Math.max(0, x - 16);
  rendreVisible(tl, true);
}

/* === SECTION : LIST VIEW (accessible alternative to the timeline) === */
function valeurTri(it, col) {
  var c = etat.config;
  if (col === 'titre') { return it.titre; }
  if (col === 'couloir') { return it.couloirs.map(function (k) { return libelleCle(k, colCouloir()); }).join(', '); }
  if (col === 'debut') { return it.s; }
  if (col === 'fin') { return it.s === null ? null : (it.jalon ? it.s : it.e); }
  if (col === 'duree') { return it.s === null || it.jalon ? null : it.e - it.s; }
  if (col === 'couleur') { return it.couleur && it.couleur !== CLE_SANS ? libelleCle(it.couleur, colCouleur()) : ''; }
  if (col === 'statut') { return texteCellule(valeurLigne(it.i, c.colStatus), infoColonne(c.table, c.colStatus)); }
  if (col === 'prog') { return it.prog; }
  if (col === 'alertes') { return alertesItem(it).length; }
  return null;
}

function rendreListe(items) {
  var c = etat.config;
  var v = etat.v;
  var dt = planDateHeure(c);
  var colonnes = [{ id: 'titre', libelle: libelleCol(c.colTitle) }];
  if (c.colLane) { colonnes.push({ id: 'couloir', libelle: colCouloir().label }); }
  colonnes.push({ id: 'debut', libelle: c.dateMode === 'milestone' ? libelleCol(c.colStart) : libelleCol(c.colStart) });
  if (c.dateMode !== 'milestone') { colonnes.push({ id: 'fin', libelle: c.dateMode === 'range' ? libelleCol(c.colEnd) : 'End' }); colonnes.push({ id: 'duree', libelle: 'Duration', num: true }); }
  if (c.colorMode === 'choice' && c.colColor && c.colColor !== c.colLane) { colonnes.push({ id: 'couleur', libelle: libelleCol(c.colColor) }); }
  if (c.colStatus && c.colStatus !== c.colColor) { colonnes.push({ id: 'statut', libelle: libelleCol(c.colStatus) }); }
  if (c.colProgress) { colonnes.push({ id: 'prog', libelle: 'Progress', num: true }); }
  colonnes.push({ id: 'alertes', libelle: 'Flags' });
  var tri = v.tri || { col: 'debut', sens: 'asc' };
  var sens = tri.sens === 'desc' ? -1 : 1;
  var cles = {};
  items.forEach(function (it) { cles[it.id] = valeurTri(it, tri.col); });
  var tries = items.slice().sort(function (a, b) {
    var x = cles[a.id], y = cles[b.id];
    var vx = x === null || x === undefined || x === '', vy = y === null || y === undefined || y === '';
    if (vx && vy) { return a.i - b.i; }
    if (vx) { return 1; }
    if (vy) { return -1; }
    var r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), localeDoc(), { numeric: true });
    return r * sens || a.i - b.i;
  });
  var res = resumePlan(items);
  var resume = pluriel(res.n, 'item') + (c.colStatus || c.colProgress ? ', ' + formaterNombre(res.retard) + ' overdue, ' + formaterNombre(res.faits) + ' done' : '') + ', period covered: ' + textePeriode(res.s, res.e)
    + (res.sansDate ? ', ' + res.sansDate + ' without dates' : '') + '.';
  var thead = creer('tr', {}, colonnes.map(function (col) {

function valeurPourCle(cle, col) {
  if (!cle || cle === CLE_SANS || !col) { return null; }
  var t = String(col.type);
  if (t.indexOf('RefList:') === 0) { return ['L', parseInt(cle, 10)]; }
  if (t === 'ChoiceList') { return ['L', cle]; }
  if (t.indexOf('Ref:') === 0) { return parseInt(cle, 10); }
  if (t === 'Bool') { return cle === 'true'; }
  if (t === 'Numeric' || t === 'Int') { var n = Number(cle); return isFinite(n) ? n : null; }
  return cle;
}

function ouvrirItem(it, focusId) {

  corps.push(fiche);
  var meta = [];
  var vca = valeurLigne(it.i, 'CREATED_AT'), vua = valeurLigne(it.i, 'UPDATED_AT');
  if (dateValide(vca) !== null) { meta.push('Created on ' + formaterDate(vca) + (valeurLigne(it.i, 'CREATED_BY') ? ' by ' + valeurLigne(it.i, 'CREATED_BY') : '')); }
  if (dateValide(vua) !== null) { meta.push('updated on ' + formaterDate(vua) + (valeurLigne(it.i, 'UPDATED_BY') ? ' by ' + valeurLigne(it.i, 'UPDATED_BY') : '')); }
  corps.push(creer('p', { classe: 'w-mention', texte: 'Row ' + it.id + ' of the table ' + libelleTable(c.table) + (meta.length ? '. ' + meta.join(', ') : '') + '.' }));

  /* What each editor reads before any change: only the fields the user

  var base = editeurs.map(function (x) { var r0 = x.e.lire(); return r0.ok ? JSON.stringify(r0.v) : null; });
  var lire = function () {
    var champs = {};
    for (var i = 0; i < editeurs.length; i++) {

    }

      editeurs.forEach(function (x, i) { if (Object.prototype.hasOwnProperty.call(r.champs, x.col)) { base[i] = JSON.stringify(r.champs[x.col]); } });

      annoncer('Saved.');
      construireItems();

        if (vueF) { vueF.focus({ preventScroll: true }); }

  var sous = [];
  if (c.colLane) { sous.push(it.couloirs.map(function (k) { return libelleCle(k, colCouloir()); }).join(', ')); }
  sous.push(datesItem(it) || 'No dates');
  ouvrirModale({ titre: it.titre, sousTitre: sous.join(' · '), laterale: true, corps: corps, focus: focusId || null, fermerDehors: true,
    surFermeture: function () {

/* New item: from the Add button or a double-click at a date, in a lane. */
function ouvrirNouvelItem(jourMur, cleCouloir, heureMur) {
  if (!etat.peutModifier) { return; }
  var c = etat.config;
  var tz = fuseauPlan(c);
  var dt = planDateHeure(c);
  var tl = etat.tl;
  var auj = aujourdhuiMur(tz);
  var debut = jourMur !== null && jourMur !== undefined ? jourMur : auj;
  if (dt) { debut = heureMur !== null && heureMur !== undefined ? heureMur : (jourMur !== null && jourMur !== undefined ? jourMur + 9 * HEURE : Math.ceil(maintenantMur(tz) / HEURE) * HEURE); }
  var long = tl && tl.ech && tl.ech.ppj < 40 ? 7 : 1;
  var fin = dt ? debut + HEURE : debut + (long - 1) * JOUR;
  var pre = {};
  var colS = infoColonne(c.table, c.colStart);
  pre[c.colStart] = valeurDeMur(debut, colS);
  if (c.dateMode === 'range') { pre[c.colEnd] = valeurDeMur(fin, infoColonne(c.table, c.colEnd)); }
  if (c.dateMode === 'duration') { pre[c.colDuration] = dt ? 1 / 24 : long; }
  if (c.colLane && cleCouloir && cleCouloir !== CLE_SANS) { pre[c.colLane] = valeurPourCle(cleCouloir, colCouloir()); }
  var cols = colonnesFiche().filter(function (x) { var col = infoColonne(c.table, x); return col && col.type !== 'Attachments'; });
  var editeurs = [];

  });
  var ajouter = async function () {

/* === SECTION : WRITING DATES AND UNDO === */
function majDates(it, ns, ne) {
  var c = etat.config;
  var t = c.table;
  var colS = infoColonne(t, c.colStart);
  var colE = c.dateMode === 'range' ? infoColonne(t, c.colEnd) : null;
  var maj = {};
  var brutS = dateValide(valeurLigne(it.i, c.colStart));
  var brutE = colE ? dateValide(valeurLigne(it.i, c.colEnd)) : null;
  if (it.jalon) {
    var delta = ns - it.s;
    if (!delta) { return maj; }
    if (brutS !== null) { maj[c.colStart] = valeurDeMur(murDe(brutS, colS) + delta, colS); }
    if (brutE !== null) { maj[c.colEnd] = valeurDeMur(murDe(brutE, colE) + delta, colE); }
    return maj;
  }
  if (ns !== it.s) { maj[c.colStart] = valeurDeMur(ns, colS); }
  if (colE && ne !== it.e) { maj[c.colEnd] = valeurDeMur(estDateTime(colE) ? ne : ne - JOUR, colE); }
  if (c.dateMode === 'duration' && (ne - ns) !== (it.e - it.s)) {
    var colD = infoColonne(t, c.colDuration);
    var du = (ne - ns) / JOUR;
    maj[c.colDuration] = colD && colD.type === 'Int' ? Math.max(1, Math.round(du)) : Math.round(du * 10000) / 10000;
  }
  return maj;
}

async function ecrireDates(it, ns, ne, verbe) {
  var c = etat.config;
  var maj = majDates(it, ns, ne);
  if (!Object.keys(maj).length) { redessinerTimeline(true); return; }
  var avant = {};
  Object.keys(maj).forEach(function (k) { var v = valeurCellule(valeurLigne(it.i, k)); avant[k] = v === undefined ? null : v; });
  try {
    await agir([['UpdateRecord', c.table, it.id, maj]]);
    etat.annulations.push({ id: it.id, avant: avant, apres: maj, titre: it.titre, table: c.table });
    if (etat.annulations.length > 20) { etat.annulations.shift(); }
    Object.keys(maj).forEach(function (k) { if (etat.donnees[k]) { etat.donnees[k][it.i] = maj[k]; } });
    construireItems();
    if (etat.vue === 'plan') { majPrincipal(); }
    var dt = planDateHeure(c);
    var msg = '"' + it.titre + '" ' + verbe + ': ' + texteNouvellesDates(it, ns, ne) + '.';
    afficherSuccesAnnulable(msg);
    annoncer(msg);
    if (etat.rafraichirEnAttente) { planifierRafraichissement(); }
    void dt;
  } catch (e) {
    afficherErreur('The new dates could not be saved. Your permissions may not allow it.', e);
    redessinerTimeline(true);
  }
}

async function decalerItem(it, jours, focusId) {
  var nv = etat.parId[it.id] || it;
  await ecrireDates(nv, nv.s + jours * JOUR, nv.e + jours * JOUR, 'moved');
  var apres = etat.parId[it.id];
  if (apres && etat.modaleOuverte) { _modale.surFermeture = null; fermerModale(); ouvrirItem(apres, focusId); }
}

function afficherSuccesAnnulable(message) {

  var b = document.getElementById('wSuccesAnnuler');

/* === SECTION : SETUP WIZARD (creation and settings) ===

function ouvrirParametrage(n) {

    try { if (!etat.cacheTables[etat.config.table]) { etat.cacheTables[etat.config.table] = await lireTable(etat.config.table); } }
    catch (e) { logSecurite('WARNING', 'Table not read for the preview', e); }
    var cfg = JSON.parse(JSON.stringify(etat.config));
    /* Columns deleted since the setup are left empty: the steps ask for

    if (etat.meta.tables[cfg.table]) {

    var ok = await confirmerAction('Leave without saving?', 'Your changes to the settings are not saved yet. Leave them?', 'Leave without saving');
    if (!ok) { return false; }

  await chargerTout();
  return true;

async function annulerCreation() {

    var ok = await confirmerAction('Abandon the creation?', b.tablesCreees ? 'The plan is not created. The choices made for the new plan are not kept.'
      : 'Nothing has been created. The choices made for the new plan are not kept.', 'Abandon');
    if (!ok) { return; }

/* Tables created for a template and then left aside: Gristplan offers to

  if (!l.length) { if (b) { b.tablesCreees = null; } return; }
  var noms = l.map(function (t) { return '"' + libelleTable(t) + '"'; }).join(' and ');
  var ok = await confirmerAction('Delete the created tables?', 'The table' + (l.length > 1 ? 's ' : ' ') + noms + (l.length > 1 ? ' were' : ' was')
    + ' created for the template you chose. Delete ' + (l.length > 1 ? 'them' : 'it') + '? Any rows entered in ' + (l.length > 1 ? 'them' : 'it') + ' will be lost.', 'Delete the tables');
  if (ok) {

/* --- Step 1: starting point --- */
