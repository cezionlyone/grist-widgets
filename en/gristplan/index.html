/* Small picture of a template: its sample bars. */
function miniModele(m) {
  var t = m.tables.filter(function (x) { return x.cle === 'main'; })[0];
  var iS = t.colonnes.indexOf(m.config.colStart), iE = m.config.colEnd ? t.colonnes.indexOf(m.config.colEnd) : -1;
  var iC = m.config.colColor ? t.colonnes.indexOf(m.config.colColor) : (m.config.colLane ? t.colonnes.indexOf(m.config.colLane) : -1);
  var colC = iC >= 0 ? t.cols.filter(function (c) { return c.id === t.colonnes[iC]; })[0] : null;
  var pos = function (v) { return Array.isArray(v) ? v[0] + v[1] / 24 : v; };
  var ex = t.exemples.slice(0, 8);
  var min = 1e9, max = -1e9;
  ex.forEach(function (r) { var s = pos(r[iS]), e = iE >= 0 ? pos(r[iE]) + (Array.isArray(r[iE]) ? 0 : 1) : s + 1; min = Math.min(min, s); max = Math.max(max, e); });
  var box = creer('div', { classe: 'gp-mini', attrs: { 'aria-hidden': 'true' } });
  ex.forEach(function (r, k) {
    var s = pos(r[iS]), e = iE >= 0 ? pos(r[iE]) + (Array.isArray(r[iE]) ? 0 : 1) : s + 1;
    var bar = creer('span', { classe: 'gp-mini__b' });
    var couleur = PALETTE[0].c;
    if (colC && colC.choix) { var idx = colC.choix.indexOf(typeof r[iC] === 'number' ? colC.choix[r[iC]] : r[iC]); if (idx >= 0 && colC.couleurs) { couleur = paletteParId(colC.couleurs[idx]).c; } }
    else if (typeof r[iC] === 'number') { couleur = PALETTE[r[iC] % PALETTE.length].c; }
    bar.style.background = couleur;
    bar.style.left = (4 + (s - min) / (max - min) * 92) + '%';
    bar.style.width = Math.max(2.5, (e - s) / (max - min) * 92) + '%';
    bar.style.top = (6 + k * 7.4) + 'px';
    if (e - s <= 1 && iE < 0) { bar.style.width = '7px'; bar.style.transform = 'rotate(45deg)'; bar.style.borderRadius = '1px'; }
    box.appendChild(bar);
  });
  if (min < 0 && max > 0) { var a = creer('span', { classe: 'gp-mini__auj' }); a.style.left = (4 + (0 - min) / (max - min) * 92) + '%'; box.appendChild(a); }
  return box;
}

    for (var i = 0; i < tables.length; i++) {

/* Plans suggested from the document tables: dates (two dates = start and
   end), a likely title, a lane, a status for the colors. */
function suggestionsDeDonnees() {
  var res = [];
  tablesBranchables().forEach(function (tid) {
    if (planDeTable(tid) || !colonnesDates(tid).length) { return; }
    var d = etat.cacheTables[tid];

    var n = d ? d.id.length : 0;

/* --- Validation --- */
function validerEtape(n) {
  var b = etat.brouillon;
  var c = b.cfg;
  masquerErreur();
  if (n === 1 && !c) { signalerSaisie('Choose a starting point to continue.'); return false; }
  if (n === 1 && !etat.meta.tables[c.table]) { signalerSaisie('The table of this plan no longer exists: choose a table to continue.'); return false; }
  if (n === 2) {
    if (!c.colStart) { marquerInvalide('aDebut', 'Choose the date column.'); return false; }
    if (c.dateMode === 'range' && !c.colEnd) { marquerInvalide('aFin', 'Choose the end date column.'); return false; }
    if (c.dateMode === 'range' && c.colEnd === c.colStart) { marquerInvalide('aFin', 'The end date must be another column.'); return false; }
    if (c.dateMode === 'duration' && !c.colDuration) { marquerInvalide('aDuree', 'Choose the duration column.'); return false; }
  }
  if (n === 3) {
    if (!c.colTitle) { marquerInvalide('aTitre', 'Choose the title column.'); return false; }
    if (c.colorMode === 'choice' && !c.colColor) { marquerInvalide('aCouleur', 'Choose the column that gives the colors.'); return false; }
  }
  if (n === 7 && !String(c.name || '').trim()) { marquerInvalide('aNom', 'Give the plan a name.'); return false; }
  return true;
}
function premiereEtapeInvalide() {
  var c = etat.brouillon.cfg;
  if (!c || !etat.meta.tables[c.table]) { return 1; }
  if (!c.colStart || (c.dateMode === 'range' && (!c.colEnd || c.colEnd === c.colStart)) || (c.dateMode === 'duration' && !c.colDuration)) { return 2; }
  if (!c.colTitle || (c.colorMode === 'choice' && !c.colColor)) { return 3; }
  if (!String(c.name || '').trim()) { return 7; }
  return 0;
}

function nettoyerCfg(c) {
  var cfg = JSON.parse(JSON.stringify(c));
  cfg.name = String(cfg.name || '').trim();
  cfg.description = String(cfg.description || '').trim();
  if (cfg.dateMode !== 'range') { cfg.colEnd = null; }
  if (cfg.dateMode !== 'duration') { cfg.colDuration = null; }
  if (cfg.dateMode === 'milestone') { cfg.colMilestone = null; }
  if (cfg.colorMode !== 'choice') { cfg.colColor = null; }
  if (!cfg.colLane) { cfg.overlapCheck = false; }
  return cfg;
}

async function creerPlan() {
  var k = premiereEtapeInvalide();
  if (k) { allerEtape(k); validerEtape(k); return; }
  var b = etat.brouillon;
  afficherLoader('Creating your plan…');
  try {
    await chargerMeta();
    await assurerBibliotheque();
    await lirePlans();
    etat.biblioLigne = null;
    etat.cleConfig = nouvelleCleConfig();
    var cfg = nettoyerCfg(b.cfg);
    await ecrireConfig(cfg);
    memoriserPlan(etat.cleConfig);
    etat.brouillon = null;
    etat.v = null;
    etat.temoinsTentes = false;
    await chargerTout();
    masquerLoader();
    afficherSucces('Your plan "' + cfg.name + '" is ready.');
  } catch (e) {
    masquerLoader();
    afficherErreur('The plan could not be created. Nothing was deleted: you can try again.', e);
  }
}

/* === SECTION : LOADING AND REFRESH [DO NOT EDIT] ===
   Loading is read-only: no structural change is made there. */
async function chargerTout() {
  await chargerMeta();
  etat.biblio = trouverTable(ID_BIBLIO);
  await lirePlans();
  await determinerDroits();
  if (etat.niveauAcces && etat.niveauAcces !== 'full') { etat.peutModifier = false; etat.peutParametrer = false; }
  choisirPlan();
  if (!etat.config) {
    if (!etat.peutParametrer) { afficherVue('aucun'); return; }
    if (!enCreation()) { demarrerCreation(); }
    return;
  }
  if (!verifierConfig(etat.config)) { afficherVue('invalide'); return; }
  if (!etat.v) { chargerEtatVue(); }
  majIdsLies();
  await chargerDonnees();
  etat.empreinte = empreinteDonnees();
  afficherVue('plan');
}

/* Fingerprint of the data shown: a re-read that changes nothing does not
   redraw the plan (scroll, focus and open lanes preserved). */

  try { return JSON.stringify(etat.donnees) + '|' + JSON.stringify(etat.idsLies ? Object.keys(etat.idsLies) : null); } catch (e) { return String(Date.now()); }
}

  etat.idsLies = etat.tableLiee && etat.config && etat.tableLiee === etat.config.table && etat.derniersIds ? etat.derniersIds : null;

async function rafraichirMaintenant(silencieux) {
  if (etat.vue !== 'plan') { return; }
  if (etat.modaleOuverte || etat.glisserEnCours) { etat.rafraichirEnAttente = true; return; }
  try {
    if (!silencieux || Date.now() - etat.metaLueA > DELAI_RELECTURE_META_MS) {
      await chargerMeta();
      if (!etat.config || !verifierConfig(etat.config)) { afficherVue('invalide'); return; }
    }
    majIdsLies();
    await chargerDonnees();
    etat.rafraichirEnAttente = false;
    var e = empreinteDonnees();
    if (silencieux && e === etat.empreinte) { return; }
    etat.empreinte = e;
    if (etat.vue === 'plan' && !etat.modaleOuverte && !etat.glisserEnCours) {
      etat.couleurs = couleursPlan();
      majPrincipal();
    }
  } catch (err) {
    if (silencieux) { logSecurite('WARNING', 'Automatic re-read failed', err); }
    else { afficherErreur('The plan could not be refreshed.', err); }
  }
}

function demarrerActualisationAuto() {
  if (_minuterieActualisation) { clearInterval(_minuterieActualisation); }
  _minuterieActualisation = setInterval(function () {
    if (document.visibilityState !== 'visible' || etat.vue !== 'plan' || etat.modaleOuverte || etat.glisserEnCours || etat.impressionEnCours) { return; }
    relayer(rafraichirMaintenant(true), 'Automatic re-read');
  }, DELAI_ACTUALISATION_MS);
}

  if (etat.vue !== 'plan') { return; }
  if (etat.modaleOuverte || etat.glisserEnCours) { etat.rafraichirEnAttente = true; return; }
  if (etat.minuterieRafraichir) { clearTimeout(etat.minuterieRafraichir); }
  etat.minuterieRafraichir = setTimeout(function () {
    etat.minuterieRafraichir = null;
    relayer(rafraichirMaintenant(true), 'Refresh');
  }, 300);
}

async function detecterTableLiee() {
  try { etat.tableLiee = await gristAvecTimeout(grist.selectedTable.getTableId(), 5000); }
  catch (e) { etat.tableLiee = null; logSecurite('INFO', 'Table linked to the view could not be determined', e); }
}

/* Access level granted to the widget ('none', 'read table' or 'full'),
   read from the platform before the first load (never used to store
   settings). */
var _accesRecu = null;
var _promesseAcces = new Promise(function (ok) { _accesRecu = ok; });
function accesComplet() { return !etat.niveauAcces || etat.niveauAcces === 'full'; }
function accesRefuse() { return etat.niveauAcces === 'none' || etat.niveauAcces === 'read table'; }
function attendreAcces() { return Promise.race([_promesseAcces, new Promise(function (ok) { setTimeout(ok, 3000); })]); }

async function initialiser() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Loading Gristplan…');
  try {
    await attendreAcces();
    if (accesRefuse()) { masquerLoader(); afficherVue('acces'); return; }
    await detecterTableLiee();
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 5000); } catch (e) { logSecurite('INFO', 'Document name not read', e); }
    lirePlanMemorise();
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERROR', 'Initialisation', e);
    afficherErreur('Loading failed.');
    afficherVue('echec');
  } finally {
    etat.initEnCours = false;
  }
}

/* === SECTION : LISTENERS AND STARTUP === */
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
dessinerLogo();
document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
document.getElementById('wSuccesFermer').addEventListener('click', masquerSucces);
document.getElementById('wSuccesAnnuler').addEventListener('click', function () { relayer(annulerDernier(), 'Undo'); });
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wVisionneuseFermer').addEventListener('click', fermerVisionneuse);
document.getElementById('wVisionneuseTelecharger').addEventListener('click', function () { if (_visionneuse.id) { relayer(telechargerPJ(_visionneuse.id), 'Download from the viewer'); } });
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && etat.vue === 'plan' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(true), 'Re-read on returning to the page'); } });
/* Escape closes the open panel even when the focus has left it. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape' || e.defaultPrevented) { return; }
  if (document.getElementById('wConfirmOverlay').classList.contains('actif')) { terminerConfirmation(false); return; }
  if (document.getElementById('wVisionneuse').classList.contains('actif')) { fermerVisionneuse(); return; }
  if (etat.modaleOuverte) { fermerModale(); }
});
window.addEventListener('beforeprint', preparerImpression);
window.addEventListener('afterprint', finirImpression);
var _minuterieTaille = null;
window.addEventListener('resize', function () {
  if (_minuterieTaille) { clearTimeout(_minuterieTaille); }
  _minuterieTaille = setTimeout(function () { if (etat.vue === 'plan' && !etat.impressionEnCours) { redessinerTimeline(true); } }, 150);
});

grist.ready({ requiredAccess: 'full', columns: [], allowSelectBy: true });
grist.onOptions(function (options, interaction) {
  var avant = etat.niveauAcces;
  etat.niveauAcces = interaction && interaction.accessLevel ? interaction.accessLevel : null;
  _accesRecu();
  if (avant !== null && avant !== etat.niveauAcces && !etat.initEnCours) { relayer(initialiser(), 'Access level change'); }
});
grist.onRecords(function (records) {
  var ids = {};
  (records || []).forEach(function (r) { if (r && typeof r.id === 'number') { ids[r.id] = true; } });
  etat.derniersIds = ids;
  relayer((async function () {
    var avant = etat.tableLiee;
    await detecterTableLiee();
    if (avant !== etat.tableLiee && etat.vue === 'plan' && !etat.modaleOuverte && !etat.initEnCours) { etat.planSession = null; await chargerTout(); return; }
    planifierRafraichissement();
  })(), 'Tracking the view link');
});

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) { logSecurite('ERROR', 'Unhandled rejected promise', evt ? evt.reason : undefined); });
}, 1500);

relayer(initialiser(), 'Initialisation');
demarrerActualisationAuto();
</script>
</body>
</html>
