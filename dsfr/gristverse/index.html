<!--
  ============================================================================
  READ ME - Gristverse
  ============================================================================
  Version     : 2.0.0
  Date        : 30/10/2026
  Auteur      : madeXcé

  Plateforme  : Grist (widget personnalisé)
  Conformité  : DSFR v1.13.1 | RGAA 4.1.2 | OWASP/ANSSI

  DESCRIPTION
  -----------
  Gristverse est le bureau virtuel de l'équipe, dessiné en pixel art (vue de
  dessus) à partir des tables du document. Il est autoporteur : il
  s'installe et se paramètre directement dans le widget, sans toucher au
  code. Tout ce qui est propre à une équipe (sites, personnes, aménagement
  des bureaux, pièces affichées, canal de discussion) est enregistré dans
  ses réglages, pas dans le code.

  PLUSIEURS VERSES (ONGLETS)
  - Un même widget accueille plusieurs verses, un onglet chacun (un
    service, une filiale, un site...) ; le dernier onglet, « Nouveau
    verse » (propriétaires), en ajoute un.
  - Chaque verse a sa ligne de réglages : bâtiments, aménagement des
    bureaux, pièces, canal de discussion, petits extras, affichage. Les
    tables sont partagées : un verse est un filtre sur l'équipe (une
    colonne de la table Équipe et une ou plusieurs valeurs, ou tout le
    monde). Présences, tâches et activités suivent ses personnes.
  - Réunions : toutes dans un verse sans filtre ou sans colonne des
    participants ; sinon une réunion s'affiche dès qu'un participant fait
    partie du verse (par référence, ou par nom ou emoji dans une colonne de
    texte), et une réunion sans participant s'affiche partout.
  - Ressources et projets : partagés, ou limités dans un verse aux lignes
    dont la colonne choisie a l'une des valeurs cochées (étape « Les
    pièces »).
  - Un nouveau verse part des tables existantes (par défaut) avec une
    étape « Qui fait partie de ce verse ? » et un décompte en direct, ou de
    nouvelles tables (un verse entièrement indépendant). « Supprimer ce
    verse » n'efface que ses réglages (et sa plante, son chien, ses
    trophées), jamais une table. Le dernier onglet consulté est retenu sur
    ce navigateur.
  - Une installation 1.x devient le premier verse (« Tout le monde ») :
    rien à refaire.

  LES PERSONNES
  - Chaque personne a son petit personnage en pixel art (teint, coiffure,
    couleurs des cheveux et des vêtements choisis d'après l'identifiant de
    sa ligne) et son prénom en dessous (« Camille B. » quand deux personnes
    ont le même prénom). L'emoji est facultatif : une pastille à côté du
    prénom, ou seul, selon le réglage du verse « Afficher les personnes
    par ».
  - Montures, bureaux, trophées et « dernière personne qui a nourri
    Avane » sont rattachés à l'identifiant de la ligne de l'équipe :
    changer un nom ou un emoji ne fait rien perdre (les réglages 1.x,
    rangés par emoji ou par nom, sont repris une fois, automatiquement).

  LES GRANDES ÉQUIPES
  - Une case du plan n'est jamais plus petite que TUILE_MIN_PX : au-delà,
    le plan garde sa taille et la zone de contenu défile (la place de sa
    barre de défilement est toujours réservée : le plan ne « zoome »
    jamais).
  - Au-delà d'environ MAISONS_PAR_RANGEE maisons (et îles) par rangée,
    elles passent sur plusieurs rangées, chacune avec son allée ; les ailes
    de bureaux s'élargissent plutôt que de s'allonger sans fin.

  LE PLAN
  - Un bâtiment par site, avec un bureau par personne dans le bâtiment de
    son site habituel ; aménagement automatique ou réglé case par case.
  - L'espace commun : accueil, salle de réunion, bibliothèque des projets.
  - Dehors : une maison par personne (télétravail) et une île par personne
    (absence, jamais de motif).
  - Chaque personne a son prénom à ses trois places, grisé là où elle
    n'est pas : un clic sur son prénom grisé l'y déclare, et le personnage s'y
    rend (avec sa monture : à pied, vélo ou trottinette).

  LES PIÈCES (chacune facultative, branchée sur une table du document)
  - Bureau de chacun : où il travaille, jour par jour ou par période ; ses
    tâches (paperboard du bureau), à cocher ou à ajouter ; ses activités
    (heures par projet ou hors projet) et son relevé mensuel ; ses réunions.
  - Salle de réunion : réunions du jour sur le tableau, les réunions
    semaine par semaine dans la salle, rappel 15 minutes avant, bouton de
    la visio, télé qui ouvre le canal de discussion.
  - Ressources : livres sur les étagères de l'accueil, recherche,
    épinglées d'abord, lien ouvert dans un nouvel onglet.
  - Bibliothèque des projets : une étagère par statut, un classeur par
    projet, une fiche par projet, toute la bibliothèque depuis le nom de la
    salle ; tableau du planning (frise des projets, une ligne par personne).
  - Accueil : planning « qui est où », avec le total par site et par jour.

  TOUT GÉRER DEPUIS LE WIDGET (personnes qui peuvent modifier)
  Tout ce que Gristverse affiche se crée, se modifie et se supprime depuis
  le widget, sans passer par les tables :
  - les réunions (« Nouvelle réunion » dans la salle de réunion et dans
    chaque bureau ; Modifier et Supprimer sur chaque réunion) ;
  - l'équipe (« Ajouter une personne » à l'accueil ; « Modifier la fiche »
    et « Retirer de l'équipe » dans chaque bureau ; monture et bureau sont
    enregistrés dans les réglages) ;
  - les tâches (ajouter, cocher, modifier, supprimer), les ressources et
    les projets (nouveau, modifier, supprimer), les activités (ajouter,
    modifier, supprimer), les présences (un jour, une période : déclarer,
    modifier, supprimer ; « Effacer » un jour).
  Les formulaires sont construits d'après les colonnes branchées sur chaque
  pièce ; une colonne calculée n'est jamais écrite ; seuls les champs
  modifiés sont écrits. Chaque suppression est confirmée et ne supprime que
  la ligne nommée ; rien d'autre n'est supprimé automatiquement (retirer
  une personne garde ses présences, tâches, réunions et activités). Les
  pièces jointes restent gérées dans Grist.
  Les lecteurs, et les personnes dont l'écriture est refusée, ne voient
  aucun bouton de modification.

  INSTALLATION (assistant, réservé à l'accès complet)
  1. Le modèle : deux sites, un site ou sur mesure ; pièces affichées ;
     données d'exemple facultatives.
  2. L'équipe : sites (avec le nom affiché de chaque bâtiment) et
     personnes (nom, emoji, site, monture) ; reprise possible d'une table
     existante.
  3. Les pièces : pour chacune, table créée par Gristverse ou table du
     document (colonnes proposées d'après leur nom, leur type et leur
     contenu) ; canal de discussion ; emplacement du planning.
  4. Les bureaux : aménagement de chaque site (grille cliquable et tableau
     équivalent au clavier).
  5. C'est prêt : récapitulatif, puis « Ouvrir Gristverse ».
  « Paramétrer » rouvre les mêmes étapes.

  TABLES CRÉÉES PAR GRISTVERSE (selon les pièces choisies)
  - 👥 Équipe (EQUIPE) : NOM, EMOJI, SITE (site habituel).
  - 📍 Présences (PRESENCES) : PERSONNE (référence), DU, AU, LIEU, NOTE.
    Lieux : les sites, Télétravail, Absent. Le motif d'une absence n'est
    jamais demandé (RGPD). Sans déclaration, chacun est à son site habituel ;
    la déclaration la plus courte l'emporte (un jour précis l'emporte sur
    une période).
  - 📺 Réunions, 📝 Tâches, 📚 Ressources, 🗄️ Projets, 🗂️ Activités : créées
    seulement si la pièce est choisie sans table existante.
  - 🌐 BIBLIOTHÈQUE GRISTVERSE ⚡ (BIBLIOTHEQUE_GRISTVERSE_) : une ligne de
    réglages par verse (CLE = CONFIG:<id>, VALEUR = JSON ; le premier verse
    d'une installation 1.x garde CONFIG:GRISTVERSE), et les petits états
    partagés des petits extras de chaque verse (CLE = PLANTE:<id>,
    CHIEN:<id>, TROPHEES:<id>). Table technique, jamais proposée comme
    table de données.
  Les tables existantes ne sont jamais restructurées : le widget n'y fait
  que créer, modifier et supprimer des lignes (quand quelqu'un le fait
  depuis le widget), sans jamais changer leurs colonnes.

  RELEVÉ D'ACTIVITÉ
  Toujours un mois entier : total par projet en heures et en jours
  (HEURES_PAR_JOUR), cumul par projet depuis le début, détail jour par jour.
  Doublons signalés « en double », jamais supprimés automatiquement.
  « Relevé PDF » : feuille A4 au nom de la personne, imprimée par la
  fenêtre d'impression du navigateur (« Enregistrer au format PDF »). La
  ligne « Titulaire » vient de la colonne facultative EMPLOYEUR de la table
  Équipe ; la ligne « Mission réalisée pour » vient de MISSION_POUR (vide
  par défaut). Une ligne sans valeur n'est pas écrite.

  DÉPENDANCES
  ------------
  - DSFR v1.13.1 (dsfr.min.css, utility.min.css)
  - Grist Plugin API (grist-plugin-api.js), origine imposée par la
    plateforme, URL non versionnée, donc non couverte par une empreinte SRI
  - pdf.js v6.2.108, version legacy (aperçu des PDF joints), chargé à la
    demande : chaque fichier n'est exécuté qu'après vérification de son
    empreinte SHA-256 (l'équivalent de l'attribut integrity)
  Aucune police externe.
  Le Système de design de l'État (DSFR) est réservé par ses modalités
  d'utilisation aux sites de l'État : vérifiez qu'elles s'appliquent à
  votre usage avant de déployer ce widget.

  SÉCURITÉ
  ---------
  - Contenus insérés par textContent uniquement ; logo dessiné élément par
    élément (createElementNS).
  - Pièces jointes : consultation seule ; fichiers récupérés en Blob, jeton
    d'accès jamais dans un lien de la page ; aperçu limité aux images
    matricielles et aux PDF, type imposé d'après l'extension.
  - Liens : adresses web seulement (https ou http ; javascript:, data:,
    file:... jamais ouverts), ouverts par un lien temporaire avec noopener
    et noreferrer (pas de window.open). Les formulaires n'acceptent que des
    adresses en https ou http.
  - Niveau d'accès accordé lu par grist.onOptions : sans accès complet,
    consultation seule annoncée, et toute écriture est refusée.
  - Droit d'écriture sondé à l'ouverture : le jeton d'accès que Grist remet
    au widget dit s'il est en lecture seule (lecteur, document ouvert en
    consultation). Dans ce cas, aucun bouton de modification n'est affiché.
    Rien n'est écrit pour ce sondage.
  - Les droits fins (qui modifie quelles lignes) se règlent par les règles
    d'accès (ACL) du document.
  - Journalisation via logSecurite(), messages d'erreur neutres.

  ACCESSIBILITÉ
  - Chaque bureau et chaque salle est un bouton accessible au clavier
    (Tab, Entrée) avec un nom complet (personne, lieu, tâches...).
  - « Liste » : alternative textuelle au plan.
  - Aménagement des bureaux : tableau équivalent à la grille cliquable.
  - Fenêtres latérales avec piège du focus, Échap pour fermer.
  - Animations coupées quand l'agent limite les animations.

  EXCEPTIONS DOCUMENTÉES À LA CHARTE
  - Le plan est une illustration : ses couleurs (dessins, étiquettes et
    bulles posées sur le plan) sont écrites en dur. L'information n'est
    jamais portée par la couleur seule.
  - Les étiquettes du plan suivent le zoom : leur taille de texte est
    calculée (clamp) à partir de la taille d'une case.
  - Les emojis du planning sont agrandis pour rester lisibles.
  - La feuille du relevé PDF utilise des unités d'impression (pt, mm) et
    ses propres couleurs.

  REPÈRES POUR MODIFIER LE CODE
  -----------------------------
  [MODIFIABLE]  : réglages que l'on peut changer sans risque (couleurs,
                  textes, seuils, dessins).
  [INTOUCHABLE] : mécanique du widget, à ne pas modifier.

  PETITS EXTRAS (Paramétrer, étape « Le modèle » : actifs par défaut,
  chacun se désactive)
  - Le décor au fil du jour et des saisons : le plan suit l'heure du
    fuseau du document (Europe/Paris par défaut) : aube, jour, crépuscule,
    nuit, fenêtres allumées ; et la saison : neige, feuilles d'automne,
    fleurs du printemps (saisons inversées dans l'hémisphère sud) ; un
    parasol et une chaise longue à l'accueil le vendredi après-midi, dernier
    jour ouvré (le jeudi là où le week-end tombe le vendredi et le samedi).
  - La plante commune : dans le coin lecture de la bibliothèque des
    projets, près du canapé rouge (à l'accueil sans cette pièce) ; chaque
    personne qui peut modifier l'arrose une fois par jour (l'arrosoir) ;
    elle grandit au fil des semaines et penche un peu quand on l'oublie
    (elle ne meurt jamais). Personne n'a à dire qui il est : « moi », c'est
    la dernière personne dont on a cliqué le nom sur le plan pour la
    déclarer, sur ce navigateur.
  - Le chien de bureau : Avane se promène à l'accueil, attend près de sa
    gamelle et fait la sieste près du bureau de la dernière personne qui
    l'a nourrie. On peut la nourrir autant de fois qu'on veut. Elle vit
    dans un verse (le premier par défaut), toujours à la même taille.
  - Les fêtes : des confettis quand une tâche est cochée, un trophée sur
    le bureau quand toutes les tâches d'une personne sont faites.
  - Une surprise cachée.
  Aucun texte sur le plan : les lecteurs d'écran reçoivent les mêmes
  informations par les noms accessibles et les annonces. Les états
  partagés sont gardés dans la table des réglages, par verse (lignes
  CLE = PLANTE:<id>, CHIEN:<id>, TROPHEES:<id>).
  Le chien du bureau s'appelle Avane, en souvenir d'un chiot labrador
  beige qui faisait partie de l'équipe.

<html lang="fr" data-fr-scheme="light" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gristverse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.min.css" integrity="sha256-PoTduNA12Ef0KCwFjv+8sWmCz4NgPhVDfR+3xUpKSIU=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/utility/utility.min.css" integrity="sha256-AtMKjo1PePyobCHKvBH8mkAGxX17BDtX9+yJ44JxWnU=" crossorigin="anonymous">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
  /* === SECTION : BASE === */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--background-default-grey); color: var(--text-default-grey);
      font-family: Marianne, arial, sans-serif; font-size: 1rem; }
    #skipLink:focus { position: fixed; top: 0; left: 0; z-index: 9999; padding: .5rem 1rem; clip: auto; width: auto; height: auto;
      overflow: visible; white-space: nowrap; font-size: .875rem;
      background: var(--background-default-grey); color: var(--text-action-high-blue-france); }
    main[hidden], div[hidden], section[hidden], p[hidden], button[hidden], .fr-btn[hidden] { display: none; }
    .w-contenu { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem 1.75rem; color: var(--text-default-grey); }
    /* La place de la barre de défilement est toujours réservée : une barre qui apparaît (grand
       plan, longue page de réglages) ne change jamais la largeur, le plan ne « zoome » donc jamais (voir dv-sans-defilement). */
    .w-contenu { scrollbar-gutter: stable; }
    .dv-carte--grande { flex: none; }
    .dv-onglets-verses { margin-bottom: .75rem; }
    .dv-etape-verse { max-width: 46rem; }
    .dv-etape-verse > .fr-input-group { margin-top: 1rem; }
    #dvVerseCompte { font-weight: 600; color: var(--text-default-grey); }
    .dv-onglets-verses .fr-tabs__tab.w-onglet { display: inline-flex; align-items: center; gap: .4rem; }
    .dv-onglets-verses .fr-tabs__tab::before { --icon-size: 1rem; flex: none; }
    .w-titre-vue { margin: 0 0 .25rem; }
    .w-mention { color: var(--text-mention-grey); font-size: .8125rem; margin: 0; }
    .w-texte { font-size: .875rem; line-height: 1.55; margin: 0; color: var(--text-default-grey); }

  /* SECTION : BANDEAU */
    .w-bandeau{display:flex;align-items:center;gap:.625rem;padding:.5rem .75rem;background:var(--background-default-grey);border-bottom:1px solid var(--border-default-grey);flex-shrink:0;color:var(--text-default-grey)}
    #bandeau-logo{width:80px;flex-shrink:0}
    .w-bandeau__logo-wrap{width:100%}
        .w-bandeau__marque{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .w-bandeau__sep{width:1px;align-self:stretch;margin:.25rem 0;background:var(--border-default-grey);flex-shrink:0; color: var(--text-default-grey); }
    .w-bandeau__titre{font-size:2rem;font-weight:600;color:var(--text-title-blue-france);white-space:nowrap;margin:0;line-height:1}
    .w-bandeau__version{font-size:.75rem;color:var(--text-mention-grey);font-weight:400;margin-left:.5rem;white-space:nowrap}
    /* Logo madeXcé : couleurs lues dans les jetons DSFR */
    .w-logo{display:block;width:100%;height:auto}
    .w-logo__made{fill:var(--text-mention-grey);font-weight:400}
    .w-logo__x{fill:var(--text-label-pink-tuile);font-weight:700}
    .w-logo__ce{fill:var(--text-title-blue-france);font-weight:800}

  /* === SECTION : LOADER ET BANNIERES === */
    .w-loader { display: none; position: fixed; inset: 0; z-index: 9998;
      /* Voile de superposition : seule couleur ecrite en dur admise, le jeton
         --background-overlap-grey designant une surface opaque. */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); flex-direction: column; align-items: center; justify-content: center; gap: .75rem; }
    .w-loader.actif { display: flex; }
    .w-loader__spinner { width: 32px; height: 32px; border: 3px solid var(--border-default-grey);
      border-top-color: var(--background-action-high-blue-france); border-radius: 50%; animation: wSpin .8s linear infinite; }
    @keyframes wSpin { to { transform: rotate(360deg); } }
    .w-loader__texte { font-size: .875rem; color: var(--text-inverted-grey); }
    .w-erreur, .w-succes { display: none; flex-shrink: 0; }
    .w-erreur.actif, .w-succes.actif { display: block; }

  /* === SECTION : MODALES === */
    .w-overlay { display: none; position: fixed; inset: 0; z-index: 9990;
      /* Voile de superposition : derogation documentee, voir .w-loader */
      background: rgba(0,0,0,.5); color: var(--text-inverted-grey); align-items: center; justify-content: center; padding: 1rem; }
    .w-overlay.actif { display: flex; }
    .w-overlay--haut { z-index: 9995; }
    .w-dialogue { background: var(--background-default-grey); color: var(--text-default-grey); width: 100%; max-width: 42rem;
      max-height: 100%; display: flex; flex-direction: column; }
    .w-dialogue--etroit { max-width: 30rem; }
    /* Fiche de l immeuble : panneau lateral qui glisse depuis la droite, sur
       toute la hauteur, comme une fiche que l'on consulte a cote du tableau. */
    .w-overlay--lateral { justify-content: flex-end; align-items: stretch; padding: 0; }
    .w-dialogue--lateral { max-width: 42rem; height: 100%; animation: wGlisse .2s ease-out; }
    .w-dialogue--lateral .w-dialogue__corps { flex: 1; }
    /* Pièces jointes : liste des fichiers et visionneuse (images, PDF) */
    .w-overlay--visionneuse { z-index: 9993; }
    /* Visionneuse : fenetre de 85 % de la hauteur, agrandissable en plein ecran. */

    /* Bouton d'aide "i" : cible de 24 px, rond fin bleu France. */

    .w-aide { width: 1.5rem; height: 1.5rem; flex-shrink: 0; padding: 0; margin: -.5rem 0 0 -.25rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;

  /* === SECTION : BARRE D'ETAPES === */

    .dv-form__duo { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: .75rem; }
    .dv-form__duo .fr-label { font-size: .8125rem; color: var(--text-mention-grey); }
    .dv-form__apercu { margin-top: .25rem; }
    .dv-form__case { margin-bottom: 1rem; }
    .dv-form__cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 0 .75rem; max-height: 14rem; overflow-y: auto;
      margin-top: .375rem; padding: .5rem .625rem 0; border: 1px solid var(--border-default-grey); }
    .dv-form__err { margin: .25rem 0 0; color: var(--text-default-error); font-size: .8125rem; font-weight: 600; }

    .w-dialogue__pied .dv-statut { flex: 1 1 12rem; min-width: 0; }
    @media (max-width: 30em) { .dv-form__duo { grid-template-columns: 1fr; } }
    /* Salle des idées */
    .dv-ressources { list-style: none; padding: 0; margin: 0; }
    .dv-ressource { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .375rem 0; border-bottom: 1px solid var(--border-default-grey); }
    .dv-ressource__nom { flex: 1 1 12rem; }
    .dv-ressource__fichiers { flex: 1 1 100%; }
    /* Accueil */
    .dv-nav-semaine { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .dv-nav-semaine__titre { margin: 0; font-weight: 700; }
    .dv-accueil { margin: 0; }
    .dv-case { text-align: center; }
    .dv-synthese th, .dv-synthese td { font-size: .8125rem; color: var(--text-mention-grey); }
    /* Assistant */
    .dv-sites { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; }
    .dv-sites .fr-input-group { margin: 0; }
    .dv-membres { border-collapse: collapse; width: 100%; }
    .dv-membres th { text-align: left; font-size: .8125rem; font-weight: 500; padding: .25rem; color: var(--text-default-grey); }
    .dv-membres td { padding: .25rem; }
    .dv-emoji { max-width: 5rem; }
    .dv-recap { list-style: none; padding: 0; }
    .dv-recap li { padding: .25rem 0; }

    /* Écran de la télé de la salle de réunion : il affiche « Tchap » et ouvre le canal de l'équipe */
    .dv-tele { position: absolute; pointer-events: auto; cursor: pointer; margin: 0; padding: 0; border: 0; background: transparent; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; font-family: inherit; font-weight: 700; white-space: nowrap;
      font-size: clamp(9px, calc(var(--tuile, 24px) * .6), 20px); line-height: 1; }
    .dv-tele:hover { background: rgba(255,255,255,.15); }
    .dv-tele:focus-visible { outline: 3px solid #0A76F6; outline-offset: 2px; }
    .dv-tele.dv-info::before { bottom: auto; top: calc(100% + 6px); }

    /* Confirmation d'enregistrement dans le bandeau de la date : largeur de base nulle,
       elle prend la place libre sans jamais faire passer les boutons à la ligne ;
       texte trop long : coupé avec « … » (le texte complet au survol) */
    .dv-confirmation { flex: 1 1 0; min-width: 0; margin: 0; align-self: center; height: 1.5rem; line-height: 1.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-default-success, #18753C); font-weight: 700; opacity: 0; transition: opacity .3s; }
    .dv-confirmation.actif { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .dv-confirmation { transition: none; } }
    /* Annonce pour lecteurs d'écran : invisible à l'écran même si le style du DSFR ne se charge pas */
    #annonce { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    /* Carte affichée en entier : pas de défilement de la page (les fenêtres ouvertes défilent toujours) */
    html.dv-sans-defilement .w-contenu { overflow-y: hidden; }   /* la zone de contenu ne défile pas : sa largeur ne change jamais */
    /* Bandeau du haut (date, alerte, étiquettes, boutons) TOUJOURS SUR UNE LIGNE : sa hauteur
       ne change jamais, donc la taille de la carte non plus. S'il manque de place, les
       pastilles des non-déclarés qui ne tiennent pas se replient en « +N » (jamais coupées). [INTOUCHABLE] */
    .dv-identite { flex-wrap: nowrap; align-items: center; }
    .dv-identite > .w-identite__texte { flex: none; }
    .dv-date { flex-wrap: nowrap; }
    .dv-date .w-titre-vue { white-space: nowrap; }
    .dv-actions { flex-wrap: nowrap; flex: 0 1 auto; min-width: 0; }
    .dv-actions > * { flex: none; }
    .dv-actions > .dv-nd { flex: 0 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
    /* Une pastille n'est jamais coupée (« Antoin ») : des prénoms entiers, les autres se replient en « +N » */
    .dv-nd__tag { flex: none; white-space: nowrap; }
    .dv-actions > .dv-nd { gap: .15rem; }
    /* Écran étroit (téléphone) : le bandeau peut passer sur deux lignes */
    @media (max-width: 47.99em) { .dv-identite, .dv-actions { flex-wrap: wrap; } .dv-date .w-titre-vue { white-space: normal; } }   /* petit écran : la date passe à la ligne plutôt que d'être coupée */
    /* Grands écrans : la barre d'outils du plan est dans la partie droite du bandeau, sur une ligne,
       sans rendre le bandeau plus haut (date en 1rem gras, petits boutons) */
    .w-bandeau__outils { flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-end; align-items: center; }
    .w-bandeau__outils:empty { display: none; }
    .w-bandeau__outils .dv-identite { margin: 0; flex: 0 1 auto; min-width: 0; justify-content: flex-end; gap: .75rem; }
    .w-bandeau__outils .w-identite__texte { max-width: none; }
    /* Exception documentée : !important car la classe DSFR fr-h4 impose sa taille de texte */
    .w-bandeau__outils .dv-date .w-titre-vue { font-size: 1rem !important; line-height: 1.5rem !important; font-weight: 700; margin: 0; }
    .w-bandeau__outils .dv-confirmation { flex: 0 1 auto; max-width: 18rem; }
    .w-bandeau__outils .dv-actions { gap: .375rem; }
    .dv-outils-haut .w-bandeau__marque { flex-shrink: 0; }
    /* Largeurs moyennes : les trois boutons ne gardent que leur icône (leur nom reste pour les lecteurs d'écran) */
    @media (max-width: 80em) {
      .w-bandeau__outils .dv-actions > .fr-btn[class*="fr-icon-"] { font-size: 0; padding-left: .5rem; padding-right: .5rem; gap: 0; }
      .w-bandeau__outils .dv-actions > .fr-btn[class*="fr-icon-"]::before { margin: 0; }
    }
    /* ---------- Assistant : pièces et éditeur d'aménagement [MODIFIABLE : couleurs et tailles] ---------- */
    .dv-piece, .dv-am { border-top: 1px solid var(--border-default-grey); padding-top: 1rem; }
    .dv-details summary { cursor: pointer; font-weight: 500; padding: .25rem 0; }
    .dv-details .w-liste-cases { max-height: 16rem; overflow-y: auto; }
    .dv-am__taille { display: flex; gap: 1rem; flex-wrap: wrap; }
    .dv-am__taille .fr-input-group { max-width: 11rem; margin: 0; }
    .dv-am__num { max-width: 5rem; }
    /* La grille : le sol en bois, une case = un carreau ; bureau, chaise, cases réservées hachurées */
    .dv-grille-cadre { display: inline-block; max-width: 100%; overflow-x: auto; padding: .5rem; background: #B98150; border-radius: 0; }
    .dv-grille { --case: 2rem; display: grid; gap: 2px; }
    .dv-grille .dv-case { width: var(--case); height: var(--case); margin: 0; padding: 0; border: 1px solid rgba(0,0,0,.15); border-radius: 0; background: #E9C79A;
      font-family: inherit; font-size: 1rem; line-height: 1; cursor: pointer; }
    .dv-grille .dv-case:hover { outline: 2px solid #000091; outline-offset: -2px; }
    .dv-grille .dv-case--bureau { background: #8A5A33; }
    .dv-grille .dv-case--siege { background: #9FB0D6; }
    .dv-grille .dv-case--reserve { background: repeating-linear-gradient(45deg, #E9C79A 0 4px, #CFA471 4px 8px); font-size: .8125rem; cursor: not-allowed; }
    /* === RELEVÉ PDF [MODIFIABLE pour l'apparence] ===
       La feuille n'existe que le temps de l'impression et reste invisible à l'écran.
       À l'impression, tout le reste de la page est masqué : seule la feuille sort. */
    #dvFeuille { display: none; }
    @page { size: A4; margin: 15mm 15mm 18mm; @bottom-right { content: "Page " counter(page) " / " counter(pages); font: 8pt Marianne, arial, sans-serif; color: #666666; } }
    @media print {
      html, html body { height: auto; overflow: visible; display: block; background: #FFFFFF; }
      html body > :not(#dvFeuille) { display: none; }
      html body > #dvFeuille { display: block; color: #161616; font: 10pt/1.4 Marianne, arial, sans-serif; }
      .dv-f-titre { margin: 0; font-size: 18pt; font-weight: 700; color: #000091; }
      .dv-f-sous-titre { margin: 0 0 6mm; font-size: 12pt; font-weight: 500; }
      .dv-f-identite { display: grid; grid-template-columns: 45mm 1fr; gap: 1.5mm 4mm; margin: 0 0 7mm; padding: 4mm; border-left: 1mm solid #000091; background: #F6F6F6; }
      .dv-f-identite dt { color: #3A3A3A; } .dv-f-identite dd { margin: 0; font-weight: 700; }
      .dv-f-table { width: 100%; border-collapse: collapse; margin: 0 0 7mm; page-break-inside: auto; }
      .dv-f-table caption { text-align: left; font-weight: 700; font-size: 11pt; margin-bottom: 2mm; }
      .dv-f-table th, .dv-f-table td { border: 0.3mm solid #CECECE; padding: 1.5mm 2mm; text-align: left; vertical-align: top; }
      .dv-f-table thead th { background: #EEEEEE; }
      .dv-f-table tr { page-break-inside: avoid; }
      .dv-f-table tfoot th, .dv-f-table tfoot td { font-weight: 700; background: #F6F6F6; }
      .dv-f-table .dv-f-nombre { text-align: center; white-space: nowrap; }
      .dv-f-semaine { page-break-inside: avoid; }
      .dv-f-semaine__titre th { background: #E3E3FD; color: #000091; font-weight: 700; }
      .dv-f-semaine__total td { font-weight: 700; background: #F6F6F6; }
      .dv-f-note { font-size: 8.5pt; color: #3A3A3A; margin: 0 0 8mm; }
      .dv-f-signature { margin-left: auto; width: 75mm; min-height: 35mm; padding: 3mm; border: 0.3mm solid #929292; page-break-inside: avoid; }
      .dv-f-signature p { margin: 0 0 1.5mm; } .dv-f-signature__nom { font-weight: 700; } .dv-f-signature__fait { margin-top: 3mm; }
    }
  </style>
</head>
<body>
  <a href="#contenu" class="fr-sr-only" id="skipLink">Aller au contenu</a>

    </div>
    <!-- Sur grand écran, la barre d'outils du plan (date, personnes non déclarées, boutons) se place ici -->

  <main class="w-contenu" id="contenu" tabindex="-1"></main>

<script>
'use strict';

/* ==========================================================================
   SECTION 1 : CONSTANTES [MODIFIABLE la ou c'est indique]

   fonction : initialiser() peut etre declenchee par le premier onRecords

var NOM_VERSE_DEFAUT = 'Tout le monde';
/* [MODIFIABLE] Grandes équipes : plus petite taille d'une case du plan, en pixels CSS.

var TUILE_MIN_PX = 12;

var MAISONS_PAR_RANGEE = 10;

var AFFICHAGES = [{ valeur: 'les_deux', libelle: 'Prénom et personnage, avec l\'emoji en pastille' }, { valeur: 'prenom', libelle: 'Prénom et personnage' }, { valeur: 'emoji', libelle: 'Emoji (le prénom quand il n\'y en a pas)' }];
var DELAI_API_MS = 30000;
/* Pas de relecture automatique à intervalles réguliers : la carte se met à jour quand

var COLONNES_META = [
  { id: 'CREE_LE', type: 'DateTime:Europe/Paris', label: 'CREE_LE', formula: 'NOW()', recalcWhen: 0 },

  { id: 'MODIFIE_LE', type: 'DateTime:Europe/Paris', label: 'MODIFIE_LE', formula: 'NOW()', recalcWhen: 2 },

var COLONNES_BIBLIO = [
  { id: 'CLE', type: 'Text', label: 'CLE' },
  { id: 'VALEUR', type: 'Text', label: 'VALEUR' },
  { id: 'VERSION_CREATION', type: 'Text', label: 'VERSION_CREATION' },

].concat(COLONNES_META);
var IDS_META = ['CREE_LE', 'CREE_PAR', 'MODIFIE_LE', 'MODIFIE_PAR'];
var GENRES_MODIFIABLES = ['texte', 'texte_long', 'date', 'dateheure', 'nombre', 'oui_non', 'choix', 'etiquettes', 'personne', 'lien', 'reference', 'references', 'autre'];
var MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
// Mois en toutes lettres : dans les dates écrites en long (titre de la carte, fenêtres, messages)
var MOIS_LONGS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var JOURS_COURTS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
var JOURS_LONGS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
/* [MODIFIABLE] Pièces jointes : seuls les images matricielles et les PDF
   s'affichent dans la visionneuse. Les SVG et pages HTML pourraient contenir
   du code : ils se téléchargent. */
var PJ_IMAGES = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'];
var COULEURS_BADGES = ['green-menthe', 'blue-ecume', 'purple-glycine', 'orange-terre-battue', 'pink-tuile',
  'yellow-tournesol', 'brown-caramel', 'green-archipel'];

/* --------------------------------------------------------------------------
   [MODIFIABLE] TABLES CREEES PAR GRISTVERSE
   L'equipe (une ligne par personne) et les presences (une ligne par
   declaration : du, au, lieu). Les identifiants deviennent ceux des tables
   et des colonnes dans Grist : a ne changer qu'avec prudence.
   On ne demande jamais le motif d'une absence (RGPD) : « Absent », point.

var TABLE_EQUIPE = { id: 'EQUIPE', titre: '👥 Équipe' };
var TABLE_PRESENCES = { id: 'PRESENCES', titre: '📍 Présences' };
// [MODIFIABLE] Sites proposés à la création (le premier est le site par défaut)
var SITES_DEFAUT = ['Site 1', 'Site 2'];
// [MODIFIABLE] Emoji de chaque site connu (les autres sites ont 🏢)
var EMOJIS_SITES = { 'Paris': '🗼', 'Nantes': '🏰', 'Lyon': '🦁', 'Bordeaux': '🍷', 'Marseille': '⛵', 'Lille': '🧇' };
var LIEU_TELETRAVAIL = 'Télétravail';
var LIEU_ABSENT = 'Absent';
// [INTOUCHABLE] États calculés, jamais écrits dans la table des présences
var LIEU_NON_DECLARE = 'Non déclaré';

// [MODIFIABLE] Jours affichés dans les plannings de présence
var JOURS_OUVRES = [1, 2, 3, 4, 5];

var VERSION_REGLAGES = 2;

/* --------------------------------------------------------------------------
   [MODIFIABLE libellés] PIÈCES ET ÉLÉMENTS OPTIONNELS

var PIECES_OPTIONNELLES = [
  { cle: 'reunion', titre: '📺 Salle de réunion', aide: 'Les réunions du jour sur un grand tableau, le rappel 15 minutes avant, le lien de visio.' },

function logSecurite(niveau, message, details) {
  var ligne = '[' + new Date().toISOString() + '] [' + niveau + '] ' + message;
  if (niveau === 'ERREUR') {
    if (details !== undefined) { console.error(ligne, details); } else { console.error(ligne); }
  } else if (niveau === 'AVERTISSEMENT') {
    if (details !== undefined) { console.warn(ligne, details); } else { console.warn(ligne); }
  } else {
    if (details !== undefined) { console.log(ligne, details); } else { console.log(ligne); }
  }
}

var _loaderTimeout = null;
var _loaderDelai = null;

function afficherLoader(message) {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); }
  _loaderTimeout = setTimeout(function () {
    masquerLoader();
    logSecurite('AVERTISSEMENT', 'Voile de chargement masque automatiquement apres 60 s');
  }, 60000);
  var texte = document.getElementById('loaderMessage');
  if (texte) { texte.textContent = message || 'Chargement…'; }
  /* Le voile n'apparait qu'au-dela du seuil : une operation breve ne
     provoque plus de clignotement de l'ecran. masquerLoader annule ce
     delai, donc le voile n'est jamais pose pour une operation rapide. */
  var voileEnCours = document.getElementById('loader');
  if (voileEnCours && voileEnCours.classList.contains('actif')) { return; }
  if (_loaderDelai) { return; }
  _loaderDelai = setTimeout(function () {
    _loaderDelai = null;
    var voile = document.getElementById('loader');
    if (voile) { voile.classList.add('actif'); }
  }, 250);
}

/* void offsetHeight force un reflow avant le retrait de la classe. */
function masquerLoader() {
  if (_loaderTimeout) { clearTimeout(_loaderTimeout); _loaderTimeout = null; }
  if (_loaderDelai) { clearTimeout(_loaderDelai); _loaderDelai = null; }
  var voile = document.getElementById('loader');
  if (voile) { void voile.offsetHeight; voile.classList.remove('actif'); }
}

var _minuterieErreur = null;

function afficherErreur(message, erreur) {
  // Un échec est journalisé en erreur ; un message sur ce qu'a saisi la personne (sans exception) seulement en avertissement
  logSecurite(erreur ? 'ERREUR' : 'AVERTISSEMENT', message, erreur);
  var bandeau = document.getElementById('wErreur');
  var texte = document.getElementById('wErreurMsg');
  if (texte) { texte.textContent = message || 'Une erreur est survenue.'; }
  if (bandeau) { bandeau.classList.add('actif'); }
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); }
  _minuterieErreur = setTimeout(masquerErreur, 10000);
}

function masquerErreur() {
  if (_minuterieErreur) { clearTimeout(_minuterieErreur); _minuterieErreur = null; }
  var bandeau = document.getElementById('wErreur');
  if (bandeau) { bandeau.classList.remove('actif'); }
}

function relayer(promesse, quoi) {
  if (promesse && typeof promesse.catch === 'function') {
    promesse.catch(function (e) { logSecurite('AVERTISSEMENT', quoi, e); });
  }
  return promesse;
}

function echapperHTML(texte) {
  if (!texte && texte !== 0) return '';
  var div = document.createElement('div');
  div.textContent = String(texte);
  /* Les guillemets sont echappes en plus des chevrons : la sortie alimente
     aussi des valeurs d'attributs (title, data-*, value), ou un guillemet
     non echappe permettrait de sortir de l'attribut. */
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function estTableExclue(tid) {
  if (!tid) { return true; }
  var brut = String(tid);
  var up = brut.toUpperCase();
  if (brut.indexOf('_grist') === 0) { return true; }
  if (brut.indexOf('GristHidden_') === 0) { return true; }
  if (brut === 'GristDocTour') { return true; }
  if (up === 'BIBLIOTHEQUE_CENTRALE') { return true; }
  if (up.indexOf('BIBLIOTHEQUE') !== -1 && brut.charAt(brut.length - 1) === '_') { return true; }
  /* Bibliothèques de réglages des widgets : leurs lignes sont des
     réglages techniques (CLE = CONFIG:xxx, VALEUR = texte JSON), jamais des
     données à dessiner. */
  if (up.indexOf('BIBLIOTHEQUE') === 0) { return true; }
  if (etat.biblio && brut === etat.biblio) { return true; }
  if (etat.meta && etat.meta.colonnes && etat.meta.colonnes[brut]) {
    var ids = etat.meta.colonnes[brut].map(function (c) { return c.colId; });
    if (ids.indexOf('CLE') !== -1 && ids.indexOf('VALEUR') !== -1) { return true; }
  }
  if (up.indexOf('ONLY') !== -1) { return true; }
  if (up.indexOf('_SUMMARY_') !== -1 || up.indexOf('GRISTSUMMARY_') !== -1) { return true; }
  return false;
}

   .w-logo__* (jetons DSFR). */
function dessinerLogo() {
  var c = document.getElementById('bandeau-logo');
  if (!c) { return; }
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 100 40');
  svg.setAttribute('class', 'w-logo');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'madeXcé');
  svg.setAttribute('focusable', 'false');
  var texte = document.createElementNS(ns, 'text');
  texte.setAttribute('x', '2');
  texte.setAttribute('y', '27');
  texte.setAttribute('font-size', '19');
  texte.setAttribute('textLength', '96');
  texte.setAttribute('lengthAdjust', 'spacingAndGlyphs');
  [['made', 'w-logo__made'], ['X', 'w-logo__x'], ['Cé', 'w-logo__ce']].forEach(function (morceau) {
    var t = document.createElementNS(ns, 'tspan');
    t.setAttribute('class', morceau[1]);
    t.textContent = morceau[0];
    texte.appendChild(t);
  });
  svg.appendChild(texte);
  c.textContent = '';
  c.appendChild(svg);
}

/* === SECTION : UTILITAIRES DOM ===
   Le DOM est construit par textContent : aucune donnee n'est jamais inseree
   comme HTML. */
function creer(tag, o, enfants) {
  var n = document.createElement(tag);
  o = o || {};
  if (o.classe) { n.className = o.classe; }
  if (o.id) { n.id = o.id; }
  if (o.texte !== undefined && o.texte !== null) { n.textContent = String(o.texte); }
  if (o.attrs) {
    Object.keys(o.attrs).forEach(function (k) {
      var v = o.attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      n.setAttribute(k, v === true ? '' : String(v));
    });
  }
  if (tag === 'button' && !n.hasAttribute('type')) { n.setAttribute('type', 'button'); }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') { n.setAttribute('autocomplete', 'off'); }
  if (o.valeur !== undefined && o.valeur !== null) { n.value = String(o.valeur); }
  if (o.coche) { n.checked = true; }
  if (o.clic) { n.addEventListener('click', o.clic); }
  if (o.change) { n.addEventListener('change', o.change); }
  if (o.saisie) { n.addEventListener('input', o.saisie); }
  (enfants || []).forEach(function (e) {
    if (e === null || e === undefined || e === false) { return; }
    n.appendChild(typeof e === 'string' ? document.createTextNode(e) : e);
  });
  return n;
}

function bouton(libelle, variante, icone, clic, o) {
  o = o || {};
  var classes = ['fr-btn'];
  if (variante === 'secondaire') { classes.push('fr-btn--secondary'); }
  if (variante === 'tertiaire') { classes.push('fr-btn--tertiary'); }
  if (variante === 'discret') { classes.push('fr-btn--tertiary-no-outline'); }
  if (o.petit) { classes.push('fr-btn--sm'); }
  if (icone) { classes.push('fr-icon-' + icone); classes.push(o.iconeSeule ? 'fr-btn--icon-only' : (o.iconeDroite ? 'fr-btn--icon-right' : 'fr-btn--icon-left')); }
  if (o.classe) { classes.push(o.classe); }
  /* Bouton a icone seule : son libelle n'est lu que par les lecteurs
     d'ecran, jamais affiche, quelle que soit la version du DSFR. */
  var b = creer('button', { classe: classes.join(' '), texte: o.iconeSeule ? null : libelle, id: o.id,
    attrs: { 'aria-label': o.aria || null, disabled: o.desactive || null } }, o.iconeSeule ? [creer('span', { classe: 'fr-sr-only', texte: libelle })] : null);
  if (o.attrs) { Object.keys(o.attrs).forEach(function (k) { b.setAttribute(k, o.attrs[k]); }); }
  if (clic) {
    b.addEventListener('click', function (e) {
      var r = clic(e);
      if (r && typeof r.then === 'function') { relayer(r, 'Action : ' + libelle); }
    });
  }
  return b;
}

function badge(texte, variante) {

}

function couleurBadge(texte) {
  var s = String(texte || '');
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 997; }
  return COULEURS_BADGES[h % COULEURS_BADGES.length];
}

function groupeChamp(libelle, champ, aide, obligatoire) {
  // Champ composé (liste avec recherche) : le libellé vise son champ de saisie
  var interne = !champ.id && champ.querySelector ? champ.querySelector('input, select, textarea') : null;
  var id = interne ? interne.id : champ.id;
  if (interne && obligatoire) { interne.setAttribute('aria-required', 'true'); }
  var lab = creer('label', { classe: 'fr-label', attrs: { 'for': id } }, [libelle]);
  if (obligatoire) {
    lab.appendChild(document.createTextNode(' '));
    lab.appendChild(creer('span', { texte: '(obligatoire)', classe: 'w-mention', attrs: { 'aria-hidden': 'true' } }));
    champ.setAttribute('aria-required', 'true');
  }
  if (aide) { lab.appendChild(creer('span', { classe: 'fr-hint-text', texte: aide })); }
  return creer('div', { classe: 'fr-input-group' }, [lab, champ]);
}

function saisie(id, valeur, o) {
  o = o || {};
  if (o.multiligne) {
    return creer('textarea', { classe: 'fr-input', id: id, valeur: valeur || '', attrs: { rows: o.lignes || 3, placeholder: o.indice || null } });
  }
  return creer('input', { classe: 'fr-input', id: id, valeur: valeur || '',
    attrs: { type: o.type || 'text', placeholder: o.indice || null, inputmode: o.clavier || null } });
}

function liste(id, options, valeur, o) {
  o = o || {};
  var s = creer('select', { classe: 'fr-select', id: id });
  if (o.vide !== undefined) { s.appendChild(creer('option', { texte: o.vide, attrs: { value: '' } })); }
  options.forEach(function (op) {
    var opt = creer('option', { texte: op.libelle, attrs: { value: op.valeur } });
    if (String(op.valeur) === String(valeur)) { opt.selected = true; }
    s.appendChild(opt);
  });
  return s;
}

function alerte(type, titre, texte) {

  if (titre) { a.appendChild(creer('h3', { classe: 'fr-alert__title', texte: titre })); }
  if (texte) { a.appendChild(typeof texte === 'string' ? creer('p', { texte: texte }) : texte); }
  return a;
}

function vider(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

function normaliser(s) {
  return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

/* Identifiant technique en majuscules, sans accent, derive d'un libelle. */
function versIdentifiant(libelle) {
  var s = String(libelle || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if (!s) { s = 'INFO'; }
  if (/^[0-9]/.test(s)) { s = 'C_' + s; }
  return s;
}

/* === SECTION : DATES ET NOMBRES ===
   Dates : timestamps Unix en secondes, convertis en UTC pour ne pas decaler
   le jour civil en heure d'ete. Zero designe une date vide. */
function formaterDate(sec) {
  if (sec === null || sec === undefined || sec === '' || typeof sec !== 'number' || sec === 0) { return ''; }
  var d = new Date(sec * 1000);
  return d.getUTCDate() + ' ' + MOIS_COURTS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function dateVersSaisie(sec) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var d = new Date(sec * 1000);
  var m = d.getUTCMonth() + 1;
  var j = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (j < 10 ? '0' : '') + j;
}

function saisieVersDate(texte) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(texte || ''));
  if (!m) { return null; }
  var a = parseInt(m[1], 10);
  var mo = parseInt(m[2], 10);
  var j = parseInt(m[3], 10);
  if (mo < 1 || mo > 12 || j < 1 || j > 31) { return null; }
  return Date.UTC(a, mo - 1, j) / 1000;
}

/* === Dates et heures ===
   Une colonne "Date et heure" porte son fuseau dans son type
   ("DateTime:Europe/Paris"). L'affichage et la saisie se font dans ce
   fuseau, jamais dans celui du navigateur ni en temps universel. */
function fuseauDe(col) {
  var t = col && col.type ? String(col.type) : '';
  var f = t.indexOf('DateTime:') === 0 ? t.slice(9) : '';
  try { new Intl.DateTimeFormat('fr-FR', { timeZone: f || 'Europe/Paris' }); return f || 'Europe/Paris'; } catch (e) { return 'Europe/Paris'; }
}

function partiesDansFuseau(sec, fuseau) {
  var parts = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: fuseau, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date(sec * 1000)).forEach(function (x) { parts[x.type] = x.value; });
  return { a: parseInt(parts.year, 10), m: parseInt(parts.month, 10), j: parseInt(parts.day, 10), h: parseInt(parts.hour, 10) % 24, mi: parseInt(parts.minute, 10) };
}

function formaterDateHeure(sec, fuseau) {
  if (typeof sec !== 'number' || !sec) { return ''; }
  var p = partiesDansFuseau(sec, fuseau);
  return p.j + ' ' + MOIS_COURTS[p.m - 1] + ' ' + p.a + ', ' + (p.h < 10 ? '0' : '') + p.h + ' h ' + (p.mi < 10 ? '0' : '') + p.mi;
}

/* Heure locale d'un fuseau vers timestamp : on part de l'heure lue comme
   universelle, puis on corrige du decalage du fuseau a cet instant, deux
   fois pour les changements d'heure. */
function epochDansFuseau(a, m, j, h, mi, fuseau) {
  var cible = Date.UTC(a, m - 1, j, h, mi) / 1000;
  var t = cible;
  for (var k = 0; k < 2; k++) {
    var p = partiesDansFuseau(t, fuseau);
    var lu = Date.UTC(p.a, p.m - 1, p.j, p.h, p.mi) / 1000;
    t = t + (cible - lu);
  }
  return t;
}

/* === Nombres ===
   Les formats de la colonne sont respectes : pourcentage, monnaie, nombre
   de decimales. */
function formatNombreDe(col) {
  var o = col && col.options ? col.options : {};
  var f = { style: 'decimal', maximumFractionDigits: 10 };
  if (o.numMode === 'percent') { f.style = 'percent'; f.maximumFractionDigits = 2; }
  if (o.numMode === 'currency') { f.style = 'currency'; f.currency = o.currency || 'EUR'; f.minimumFractionDigits = 2; f.maximumFractionDigits = 2; }
  if (typeof o.decimals === 'number') { f.minimumFractionDigits = o.decimals; if (f.maximumFractionDigits < o.decimals) { f.maximumFractionDigits = o.decimals; } }
  if (typeof o.maxDecimals === 'number') { f.maximumFractionDigits = Math.max(o.maxDecimals, f.minimumFractionDigits || 0); }
  if (col && col.type === 'Int' && f.style !== 'percent') { f.maximumFractionDigits = 0; f.minimumFractionDigits = 0; }
  return f;
}

function formaterNombreCol(v, col) {
  if (typeof v !== 'number' || !isFinite(v)) { return ''; }
  try { return new Intl.NumberFormat('fr-FR', formatNombreDe(col)).format(v); } catch (e) { return formaterNombre(v); }
}

/* Valeur non valide : texte saisi dans une colonne d'un autre type (la

}

function lienDepuisTexte(t) {

  return m ? { libelle: m[1] || m[2], url: m[2] } : null;
}

/* Raison affichee pour une information non modifiable. */
function raisonLectureSeule(col, genre) {
  if (!etat.peutModifier) { return 'Vos droits sur ce document permettent la consultation seulement'; }
  if (!col) { return 'Information introuvable'; }
  if (IDS_META.indexOf(col.colId) !== -1) { return 'Renseignée automatiquement'; }
  if (col.formule) { return 'Calculée automatiquement : elle ne se modifie pas'; }
  if (estEcrasee(col)) { return 'Mise à jour automatiquement à chaque modification de la carte'; }
  return 'Ce type d\'information ne se modifie pas ici';
}

function aujourdhuiSec() {
  var d = new Date();
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
}

function formaterNombre(v) {
  if (typeof v !== 'number' || !isFinite(v)) { return ''; }
  return v.toLocaleString('fr-FR');
}

function validerNombre(valeur, min, max, defaut) {
  var n = parseFloat(valeur);
  if (isNaN(n) || !isFinite(n)) return defaut;
  if (n < min) return min;
  if (n > max) return max;
  return n;
}

function lireNombreSaisi(texte) {
  var t = String(texte || '').replace(/\s/g, '').replace(',', '.');
  if (t === '') { return null; }
  if (!/^-?\d+(\.\d+)?$/.test(t)) { return undefined; }
  return validerNombre(t, -1e15, 1e15, null);
}

/* === SECTION : ACCES A L'API === */
function gristAvecTimeout(promesse, delaiMs) {
  return Promise.race([promesse, new Promise(function (_, rejeter) {
    setTimeout(function () { rejeter(new Error('Délai dépassé')); }, delaiMs);
  })]);
}

/* Lecture d'une table [INTOUCHABLE]
   Une demande de lecture partie n'est JAMAIS abandonnée :
   - si Grist n'a pas répondu au bout de DELAI_RELANCE_MS (30 s), une seconde demande part
     (cas du message perdu au démarrage), et la première reste attendue ;
   - la première réponse arrivée, de l'une ou de l'autre, est prise ;
   - un vrai refus (droits, erreur) est retenté une fois, 1 s plus tard ;
   - jamais plus de 2 demandes pour une même table ; au-delà de DELAI_LECTURE_MAX_MS (3 min)
     sans réponse, la lecture est signalée en échec (« Délai dépassé »), comme avant.
   Avant : chaque nouvel essai jetait la réponse de l'essai précédent, même arrivée une seconde
   plus tard, et une grosse table était lue trois fois de suite (30 s perdues à l'ouverture).
   Les écritures ne sont jamais rejouées. */
/* La seconde demande ne sert qu'au tout début (message perdu avant que le lien avec
   Grist soit établi). Dès que Grist a répondu une fois, le lien marche : une lecture lente est
   seulement attendue, sans la doubler (une seconde demande ne ferait que charger Grist). */
var _gristARepondu = false;
var DELAI_RELANCE_MS = 30000;        // [MODIFIABLE] attente avant d'envoyer la seconde demande (30 s, Grist peut être lent)
var DELAI_LECTURE_MAX_MS = 180000;   // [MODIFIABLE] attente totale maximale pour une table (3 min, au lieu de 60 s)
function lireTable(tid) {
  return new Promise(function (resolve, reject) {
    var fini = false, envoyees = 0, echecs = 0, derniere = null, minuteries = [];
    // Fin de la lecture : une seule fois, et toutes les minuteries sont arrêtées
    var terminer = function (ok, valeur) {
      if (fini) { return; }
      fini = true;
      minuteries.forEach(function (m) { clearTimeout(m); });
      if (ok) { resolve(valeur); } else { reject(valeur); }
    };
    var envoyer = function () {
      envoyees++;
      var p;
      try { p = Promise.resolve(grist.docApi.fetchTable(tid)); } catch (e) { p = Promise.reject(e); }
      p.then(function (d) { _gristARepondu = true; terminer(true, d); }, function (e) {
        derniere = e; echecs++;
        if (fini) { return; }
        logSecurite('AVERTISSEMENT', 'Lecture de ' + tid + ' en échec', e);
        if (envoyees < 2) { minuteries.push(setTimeout(function () { if (!fini && envoyees < 2) { envoyer(); } }, 1000)); }   // un nouvel essai, 1 s plus tard (jamais plus de 2 demandes)
        else if (echecs >= envoyees) { terminer(false, derniere); }                                           // les deux demandes ont échoué
      });
    };
    envoyer();
    // Pas de réponse au bout de 30 s : une seconde demande, la première reste attendue
    minuteries.push(setTimeout(function () {
      if (!fini && envoyees < 2 && !_gristARepondu) { logSecurite('AVERTISSEMENT', 'Lecture de ' + tid + ' lente : seconde demande envoyée, la première reste attendue'); envoyer(); }
    }, DELAI_RELANCE_MS));
    minuteries.push(setTimeout(function () { terminer(false, derniere || new Error('Délai dépassé')); }, DELAI_LECTURE_MAX_MS));
  });
}

/* Refus pour droits insuffisants : la personne consulte en lecture seule
   alors que son interface proposait la modification (regles d'acces non
   posees). L'interface bascule en lecture seule pour la suite. */
function estRefusDroits(e) {
  var m = String((e && (e.message || e)) || '');
  return /blocked by|access rules|acl_deny|permission|not allowed|insufficient|read.?only|viewer/i.test(m);
}
async function agir(actions) {
  /* Écriture seulement si l'accès complet a été accordé au widget (sinon refus
     explicite : l'agent n'a pas l'illusion d'une sauvegarde). */
  if (!accesComplet()) { throw new Error('Accès complet non accordé au widget : écriture refusée'); }
  try {
    return await gristAvecTimeout(grist.docApi.applyUserActions(actions), DELAI_API_MS);
  } catch (e) {
    if (estRefusDroits(e) && etat.peutModifier && !enParametrage()) {
      etat.peutModifier = false;
      etat.peutParametrer = false;
      logSecurite('INFO', 'Écriture refusée : passage en lecture seule', e);
    }
    throw e;
  }
}

/* Une cellule en erreur arrive sous la forme ['E', ...] : elle vaut vide. */
function valeurCellule(v) {
  if (Array.isArray(v) && v[0] === 'E') { return ''; }
  return v;
}

function colonneDe(donnees, col, i) {
  return donnees && donnees[col] ? valeurCellule(donnees[col][i]) : undefined;
}

/* === SECTION : DROITS D'ECRITURE === */
function contenuJeton(jeton) {
  var p = String(jeton || '').split('.')[1];
  if (!p) { return null; }
  p = p.replace(/-/g, '+').replace(/_/g, '/');
  while (p.length % 4) { p += '='; }
  var bin = atob(p);
  var octets = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { octets[i] = bin.charCodeAt(i); }
  return JSON.parse(new TextDecoder().decode(octets));
}
/* Droit d'écrire dans le document : Grist remet au widget un jeton
   d'accès, qu'il marque « lecture seule » pour un lecteur (ou un document
   ouvert en consultation). Rien n'est écrit, rien n'est envoyé aux autres
   personnes connectées, aucune copie du document n'est déclenchée. */
async function sonderEcriture() {
  try {
    var j = await gristAvecTimeout(grist.docApi.getAccessToken({ readOnly: false }), DELAI_API_MS);
    var c = contenuJeton(j && j.token);
    if (c && typeof c.readOnly === 'boolean') { return !c.readOnly; }
    logSecurite('AVERTISSEMENT', 'Jeton d\'accès sans information sur les droits');
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Droits d\'écriture non déterminés', e);
  }
  // Inconnu : la modification reste proposée ; Grist refusera ce qui n'est pas
  // permis et le widget retirera alors l'action refusée.
  return true;
}

/* === SECTION : METADONNEES DU DOCUMENT === */
async function chargerMeta() {
  etat.metaLueA = Date.now();
  /* Les quatre tables de description partent en même temps, au lieu de l'une après
     l'autre. Chaque échec est traité plus bas (les deux premières obligatoires, les
     noms de pages facultatifs). */
  var pT = lireTable('_grist_Tables'), pC = lireTable('_grist_Tables_column'), pVS = lireTable('_grist_Views_section'), pV = lireTable('_grist_Views');
  [pT, pC, pVS, pV].forEach(function (p) { p.catch(function () {}); });   // évite une alerte « rejet non capturé » pendant l'attente
  var t = await pT;
  var c = await pC;

  var parRef = {};
  for (var i = 0; i < t.id.length; i++) {
    var tid = t.tableId[i];
    tables[tid] = { ref: t.id[i], tableId: tid, primaryViewId: t.primaryViewId ? t.primaryViewId[i] : 0,
      rawViewSectionRef: t.rawViewSectionRef ? t.rawViewSectionRef[i] : 0,
      resume: t.summarySourceTable ? !!t.summarySourceTable[i] : false };
    parRef[t.id[i]] = tid;
  }
  var colonnes = {};
  var colParRef = {};
  for (var j = 0; j < c.id.length; j++) {
    var tidC = parRef[c.parentId[j]];
    if (!tidC) { continue; }
    var opts = {};
    try { opts = c.widgetOptions[j] ? JSON.parse(c.widgetOptions[j]) : {}; } catch (e) { opts = {}; }
    var info = { ref: c.id[j], tableId: tidC, colId: c.colId[j], type: c.type[j] || 'Any', label: c.label ? (c.label[j] || c.colId[j]) : c.colId[j],
      formule: Boolean(c.isFormula[j]) && Boolean(c.formula[j]), formula: c.formula[j] || '',
      /* Colonne a formule vide : sans contenu possible, toute ecriture est refusee. */
      formuleVide: Boolean(c.isFormula[j]) && !c.formula[j],
      declencheur: !c.isFormula[j] && Boolean(c.formula[j]), options: opts,
      recalcWhen: c.recalcWhen ? c.recalcWhen[j] : 0, recalcDeps: c.recalcDeps ? c.recalcDeps[j] : null,
      visibleCol: c.visibleCol ? c.visibleCol[j] : 0, pos: c.parentPos ? c.parentPos[j] : j };
    colParRef[c.id[j]] = info;

  Object.keys(colonnes).forEach(function (k) { colonnes[k].sort(function (a, b) { return a.pos - b.pos; }); });

     donne a la table), sinon nom de sa page, sinon identifiant sans
     soulignes. L'identifiant technique n'est jamais montre tel quel. */
  try {
    var vs = await pVS;
    var titres = {};
    for (var v = 0; v < vs.id.length; v++) { titres[vs.id[v]] = vs.title ? vs.title[v] : ''; }
    var vues = {};
    try { var vw = await pV; for (var w = 0; w < vw.id.length; w++) { vues[vw.id[w]] = vw.name ? vw.name[w] : ''; } } catch (e2) { vues = {}; }
    Object.keys(tables).forEach(function (k) { tables[k].libelle = titres[tables[k].rawViewSectionRef] || vues[tables[k].primaryViewId] || ''; });
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Noms des tables illisibles : identifiants affichés sans soulignés', e);
  }

}

function libelleTable(tid) {
  var t = etat.meta && etat.meta.tables ? etat.meta.tables[tid] : null;
  return (t && t.libelle) || String(tid || '').replace(/_/g, ' ');
}

function colonnesDe(tid) {
  return (etat.meta.colonnes[tid] || []).filter(function (c) {
    return c.colId !== 'manualSort' && c.colId.indexOf('gristHelper_') !== 0;
  });
}

function infoColonne(tid, colId) {
  var l = etat.meta.colonnes[tid] || [];
  for (var i = 0; i < l.length; i++) { if (l[i].colId === colId) { return l[i]; } }
  return null;
}

function tableCibleRef(type) {
  var t = String(type || '');
  if (t.indexOf('Ref:') === 0) { return t.slice(4); }
  if (t.indexOf('RefList:') === 0) { return t.slice(8); }
  return null;
}

function colAffichageRef(col) {
  if (!col || !col.visibleCol) { return null; }
  var v = etat.meta.colParRef[col.visibleCol];
  return v ? v.colId : null;
}

function trouverTable(motif) {
  var up = motif.toUpperCase();
  var ids = Object.keys(etat.meta.tables);
  for (var i = 0; i < ids.length; i++) { if (ids[i].toUpperCase().indexOf(up) !== -1) { return ids[i]; } }
  return null;
}

/* Genre d'affichage d'une colonne : celui choisi a la creation s'il existe,
   sinon deduit de son type. */
function genreDe(col, champ) {
  if (champ && champ.genre) { return champ.genre; }
  if (!col) { return 'autre'; }
  var t = col.type;
  if (t === 'Text') { return col.options && col.options.widget === 'HyperLink' ? 'lien' : (col.options && col.options.wrap ? 'texte_long' : 'texte'); }
  if (t === 'Numeric' || t === 'Int') { return 'nombre'; }
  if (t === 'Bool') { return 'oui_non'; }
  if (t === 'Date') { return 'date'; }
  if (t.indexOf('DateTime') === 0) { return 'dateheure'; }
  if (t === 'Choice') { return 'choix'; }
  if (t === 'ChoiceList') { return 'etiquettes'; }
  if (t.indexOf('Ref:') === 0) { return 'reference'; }
  if (t.indexOf('RefList:') === 0) { return 'references'; }
  if (t === 'Attachments') { return 'pj'; }
  return 'autre';
}

function libelleType(col) {
  var g = genreDe(col, null);
  var noms = { texte: 'Texte', texte_long: 'Texte', nombre: 'Nombre', oui_non: 'Oui ou non', date: 'Date', dateheure: 'Date et heure',
    choix: 'Liste de choix', etiquettes: 'Choix multiples', reference: 'Référence', references: 'Liste de références',
    pj: 'Pièces jointes', autre: 'Autre' };
  var n = noms[g] || 'Autre';
  if (g === 'reference' || g === 'references') { n += ' vers ' + libelleTable(tableCibleRef(col.type)); }
  if (col.formule) { n += ' (calculée)'; }
  if (col.options && col.options.numMode === 'percent') { n += ' (pourcentage)'; }
  if (col.options && col.options.numMode === 'currency') { n += ' (montant)'; }
  return n;
}

/* Formule de declenchement qui ecraserait aussitot une valeur ecrite par le
   widget : recalcul a chaque modification de la ligne (recalcWhen 2), ou a
   chaque modification de la colonne elle-meme (recalcWhen 1 avec la colonne
   dans ses dependances). Une valeur par defaut a la creation (recalcWhen 0)
   n'empeche pas l'ecriture. */
function estEcrasee(col) {
  if (!col || !col.declencheur) { return false; }
  if (col.recalcWhen === 2) { return true; }
  if (col.recalcWhen === 1) {
    var deps = Array.isArray(col.recalcDeps) ? col.recalcDeps.slice(1) : [];
    return deps.indexOf(col.ref) !== -1;
  }
  return false;
}

function estModifiable(col, genre) {
  if (!etat.peutModifier) { return false; }
  if (!col || col.formule || col.formuleVide || estEcrasee(col)) { return false; }
  if (IDS_META.indexOf(col.colId) !== -1) { return false; }
  return GENRES_MODIFIABLES.indexOf(genre) !== -1;
}

/* Valeurs proposees par une liste de choix. */
function choixDe(col) {
  return col && col.options && Array.isArray(col.options.choices) ? col.options.choices.slice() : [];
}

/* === SECTION : CREATION DE TABLE (sequence canonique) === */
async function poserFormules(tid, colonnes) {
  for (var i = 0; i < colonnes.length; i++) {
    var col = colonnes[i];
    if (!col.formula) { continue; }
    try {
      await agir([['ModifyColumn', tid, col.id, { isFormula: false, formula: col.formula,
        recalcWhen: col.recalcWhen === undefined ? 0 : col.recalcWhen, recalcDeps: null }]]);
    } catch (e) {

    }

/* Identifiant de table libre, calcule comme le fait la plateforme
   (suffixe numerique a partir de 2), pour pouvoir creer en un seul envoi
   des tables qui se referencent. L'identifiant reel est toujours relu. */
function idTableLibre(base, reserves) {
  var pris = Object.keys(etat.meta.tables).concat(reserves || []).map(function (x) { return x.toUpperCase(); });
  var id = base;
  var n = 2;
  while (pris.indexOf(id.toUpperCase()) !== -1) { id = base + n; n++; }
  return id;
}

/* Sequence de creation : tables creees en un seul envoi avec id, type et
   label seulement ; les pages que la plateforme cree avec elles sont
   supprimees aussitot, en un seul envoi, avant toute autre preparation, si
   bien qu'elles n'apparaissent qu'un instant ; puis formules une par une et
   options de colonnes. */
async function creerTables(defs) {
  var ret = await agir(defs.map(function (d) {
    return ['AddTable', d.id, d.colonnes.map(function (c) { return { id: c.id, type: c.type, label: c.label || c.id }; })];
  }));
  var rv = ret && ret.retValues ? ret.retValues : [];
  var tids = defs.map(function (d, i) { return rv[i] && rv[i].table_id ? rv[i].table_id : d.id; });

  }

      await agir(vues.map(function (v) { return ['RemoveRecord', '_grist_Views', v]; }));
    } catch (e) {
      logSecurite('INFO', 'Suppression des pages auto-créées non possible', e);
    }

    await poserFormules(tids[i], defs[i].colonnes);
    for (var k = 0; k < defs[i].colonnes.length; k++) {
