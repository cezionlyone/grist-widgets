        await agir([['ModifyColumn', tids[i], c.id, { widgetOptions: JSON.stringify(c.widgetOptions) }]]);
      } catch (e) {
        logSecurite('AVERTISSEMENT', 'Options non posées sur ' + c.id, e);
      }
    }
  }
  return tids;
}

/* Renommage des tables (nom affiché de la vue brute). ATTENTION : dans
   Grist, renommer la vue brute renomme aussi l'identifiant de la table
   (« 👥 Équipe » devient « Equipe »). On renomme donc en dernier, puis on
   relit les identifiants par la référence interne des tables, qui, elle, ne
   change pas. Retourne { ancienIdentifiant: nouvelIdentifiant }. */
async function renommerTables(liste) {
  await chargerMeta();
  var refs = {};
  for (var i = 0; i < liste.length; i++) {
    var meta = etat.meta.tables[liste[i][0]];
    if (!meta) { continue; }
    refs[liste[i][0]] = meta.ref;
    if (meta.rawViewSectionRef) {
      try { await agir([['UpdateRecord', '_grist_Views_section', meta.rawViewSectionRef, { title: liste[i][1] }]]); }
      catch (e) { logSecurite('INFO', 'Nom affiché non posé sur ' + liste[i][0], e); }
    }
  }
  await chargerMeta();
  var res = {};
  Object.keys(refs).forEach(function (ancien) {
    res[ancien] = ancien;
    Object.keys(etat.meta.tables).forEach(function (t) { if (etat.meta.tables[t].ref === refs[ancien]) { res[ancien] = t; } });
  });
  return res;
}

/* Ajout d'une colonne en deux temps : creee nue, puis typee. Les deux temps
   sont proteges separement. L'identifiant reel est relu apres creation. */
async function ajouterColonne(tid, colId, type, widgetOptions) {
  var ret = await agir([['AddColumn', tid, colId, {}]]);
  var reel = colId;
  if (ret && ret.retValues && ret.retValues[0] && ret.retValues[0].colId) { reel = ret.retValues[0].colId; }
  /* isFormula: false indispensable : sans lui, la plateforme laisse la
     colonne ajoutee en formule vide, ou rien ne peut etre ecrit. */
  var propr = { type: type, label: reel, isFormula: false };
  if (widgetOptions) { propr.widgetOptions = JSON.stringify(widgetOptions); }
  try {
    await agir([['ModifyColumn', tid, reel, propr]]);
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Colonne ' + reel + ' créée mais non typée', e);
    throw e;
  }
  return reel;
}

/* === SECTION : BIBLIOTHEQUE DE REGLAGES ===
   Table technique de parametrage : une ligne de configuration (CLE =
   CONFIG:xxx), configuration en JSON dans VALEUR. */
async function reparerSchemaBiblio() {
  if (!etat.biblio) { return; }
  try {
    await chargerMeta();
    for (var k = 0; k < COLONNES_BIBLIO.length; k++) {
      var col = COLONNES_BIBLIO[k];
      var ex = infoColonne(etat.biblio, col.id);
      if (!ex) {
        var creee = false;
        try { await agir([['AddColumn', etat.biblio, col.id, {}]]); creee = true; } catch (e) { logSecurite('INFO', 'Colonne ' + col.id + ' non ajoutée', e); }
        if (creee) {
          var propr = { type: col.type, label: col.label, isFormula: false };
          if (col.formula) { propr.formula = col.formula; propr.recalcWhen = col.recalcWhen; propr.recalcDeps = null; }
          try { await agir([['ModifyColumn', etat.biblio, col.id, propr]]); } catch (e2) { logSecurite('INFO', 'Colonne ' + col.id + ' non typée', e2); }
        }
      } else if (col.formula && String(ex.formula).trim() !== col.formula) {
        try {
          await agir([['ModifyColumn', etat.biblio, col.id, { isFormula: false, formula: col.formula, recalcWhen: col.recalcWhen, recalcDeps: null }]]);
        } catch (e3) { logSecurite('INFO', 'Formule non rétablie sur ' + col.id, e3); }
      }
    }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Vérification du schéma de la bibliothèque impossible', e);
  }
}

async function assurerBibliotheque() {
  await chargerMeta();
  var trouvee = trouverTable(ID_BIBLIO);
  if (trouvee) {
    etat.biblio = trouvee;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  await chargerMeta();
  var entreTemps = trouverTable(ID_BIBLIO);
  if (entreTemps) {
    etat.biblio = entreTemps;
    await reparerSchemaBiblio();
    return etat.biblio;
  }
  return finaliserBibliotheque((await creerTables([{ id: ID_BIBLIO, colonnes: COLONNES_BIBLIO }]))[0]);
}

/* Apres sa creation, la bibliotheque recoit son nom affiche ; son
   identifiant est relu, le renommage pouvant le changer. */
async function finaliserBibliotheque(tid) {
  etat.biblio = tid;
  try {
    await chargerMeta();
    var t = etat.meta.tables[tid];
    if (t && t.rawViewSectionRef) {
      await agir([['UpdateRecord', '_grist_Views_section', t.rawViewSectionRef, { title: LABEL_BIBLIO }]]);
    }
    await chargerMeta();
    var relu = trouverTable(ID_BIBLIO);
    if (relu) { etat.biblio = relu; }
  } catch (e) {
    logSecurite('AVERTISSEMENT', 'Renommage de la bibliothèque non abouti', e);
  }
  await reparerSchemaBiblio();
  return etat.biblio;
}

/* Plusieurs tableaux par document : une ligne de configuration par tableau,
   de cle CONFIG:<identifiant>. La ligne CONFIG des versions anterieures est
   lue comme un tableau, sans conversion. La liste est lue dans une variable
   locale puis affectee d'un seul coup : un rafraichissement parallele ne la
   trouve jamais videe en cours de lecture. */
function elementsFocusables(racine) {
  return Array.prototype.filter.call(racine.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
    function (n) { return !n.disabled && n.offsetParent !== null; });
}

function fabriquerPiege(racine, fermer) {
  return function (e) {
    if (e.key === 'Escape') { e.preventDefault(); fermer(); return; }
    if (e.key !== 'Tab') { return; }
    var f = elementsFocusables(racine);
    if (!f.length) { return; }
    var premier = f[0];
    var dernier = f[f.length - 1];
    if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
    else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
  };
}

function ouvrirModale(o) {
  var ov = document.getElementById('wModale');
  var boite = document.getElementById('wModaleBoite');
  boite.className = 'w-dialogue' + (o.etroite ? ' w-dialogue--etroit' : '') + (o.laterale ? ' w-dialogue--lateral' : '');
  ov.classList.toggle('w-overlay--lateral', !!o.laterale);
  document.getElementById('wModaleTitre').textContent = o.titre;
  var sous = document.getElementById('wModaleSous');
  sous.textContent = o.sousTitre || '';
  sous.hidden = !o.sousTitre;
  var corps = document.getElementById('wModaleCorps');
  vider(corps);
  (o.corps || []).forEach(function (n) { if (n) { corps.appendChild(n); } });
  var pied = document.getElementById('wModalePied');
  vider(pied);
  (o.pied || []).forEach(function (n) { if (n) { pied.appendChild(n); } });
  if (!etat.modaleOuverte) { _modale.retour = document.activeElement; }
  _modale.surFermeture = o.surFermeture || null;
  _modale.fermerDehors = !!o.fermerDehors;
  /* Clic en dehors de la fenetre : fermeture, si le clic commence et se
     termine en dehors (une selection de texte qui deborde ne ferme rien). */
  if (!_modale.dehorsBranche) {
    _modale.dehorsBranche = true;
    ov.addEventListener('mousedown', function (e) { _modale.departDehors = e.target === ov; });
    ov.addEventListener('click', function (e) {
      if (_modale.fermerDehors && _modale.departDehors && e.target === ov) { fermerModale(); }
      _modale.departDehors = false;
    });
  }
  etat.modaleOuverte = true;
  ov.classList.add('actif');
  void ov.offsetHeight;
  if (_modale.pieger) { ov.removeEventListener('keydown', _modale.pieger); }
  _modale.pieger = fabriquerPiege(boite, fermerModale);
  ov.addEventListener('keydown', _modale.pieger);
  var cible = o.focus ? document.getElementById(o.focus) : null;
  var f = cible || elementsFocusables(corps)[0] || document.getElementById('wModaleFermer');
  if (f) { f.focus(); }
}

function fermerModale() {
  var ov = document.getElementById('wModale');
  if (!ov.classList.contains('actif')) { return; }
  ov.classList.remove('actif');
  if (_modale.pieger) { ov.removeEventListener('keydown', _modale.pieger); _modale.pieger = null; }
  etat.modaleOuverte = false;
  var rappel = _modale.surFermeture;
  _modale.surFermeture = null;
  if (rappel) { rappel(); }
  var r = _modale.retour;
  _modale.retour = null;
  /* À la fermeture d'une fenêtre : la carte est redessinée si les données ont changé
     pendant qu'elle était ouverte. Les données sont déjà lues (la relecture faite pendant
     que la fenêtre était ouverte n'a fait qu'attendre) : on redessine sans relire les tables. */
  if (etat.rafraichirEnAttente || (etat.vue === 'plan' && typeof carteAJour === 'function' && !carteAJour())) {
    etat.rafraichirEnAttente = false;
    if (etat.vue === 'plan' && !etat.enRoute) {
      // Le bouton qui avait ouvert la fenêtre est recréé par le dessin : on retrouve le nouveau par son identifiant ou son libellé
      var idR = r && r.id, libR = r && r.getAttribute ? r.getAttribute('aria-label') : null;
      afficherVue('plan');
      r = (idR && document.getElementById(idR)) || (libR && document.querySelector('[aria-label="' + CSS.escape(libR) + '"]')) || null;
    } else { planifierRafraichissement(); }
  }
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
}

/* Confirmation ou saisie courte. Resout true/false, ou le texte saisi. */
function confirmerAction(titre, message, libelleOui, saisieInitiale) {
  return new Promise(function (resolve) {
    var ov = document.getElementById('wConfirmOverlay');
    if (!ov) { resolve(false); return; }
    if (_confirm.resolution) { _confirm.resolution(false); }
    _confirm.resolution = resolve;
    document.getElementById('wConfirmTitre').textContent = titre;
    document.getElementById('wConfirmMsg').textContent = message || '';
    var zone = document.getElementById('wConfirmChamp');
    vider(zone);
    var champ = null;
    if (saisieInitiale !== undefined) {
      champ = saisie('wConfirmSaisie', saisieInitiale);
      zone.appendChild(groupeChamp('Nouveau nom', champ, null, true));
    }
    document.getElementById('wConfirmOui').textContent = libelleOui || 'Confirmer';
    _confirm.retour = document.activeElement;
    ov.classList.add('actif');
    void ov.offsetHeight;
    _confirm.pieger = fabriquerPiege(ov, function () { terminerConfirmation(false); });
    ov.addEventListener('keydown', _confirm.pieger);
    if (champ) {
      champ.focus();
      champ.select();
      champ.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); terminerConfirmation(true); } });
    } else {
      document.getElementById('wConfirmOui').focus();
    }
  });
}

function terminerConfirmation(oui) {
  var ov = document.getElementById('wConfirmOverlay');
  var champ = document.getElementById('wConfirmSaisie');
  var valeur = oui ? (champ ? champ.value.trim() : true) : false;
  ov.classList.remove('actif');
  if (_confirm.pieger) { ov.removeEventListener('keydown', _confirm.pieger); _confirm.pieger = null; }
  var r = _confirm.retour;
  _confirm.retour = null;
  if (r && document.body.contains(r) && typeof r.focus === 'function') { r.focus(); }
  var res = _confirm.resolution;
  _confirm.resolution = null;
  if (res) { res(valeur); }
}

function aide(id, sujet, texte, aDroite) {
  var panneau = creer('p', { classe: 'w-aide__texte' + (aDroite ? ' w-aide__texte--droite' : ''), id: id + '_aide', texte: texte });
  panneau.hidden = true;
  var b = creer('button', { classe: 'w-aide', attrs: { type: 'button', 'aria-label': 'Aide : ' + sujet, 'aria-expanded': 'false', 'aria-controls': id + '_aide' } },
    [creer('span', { classe: 'w-aide__rond', texte: 'i', attrs: { 'aria-hidden': 'true' } })]);
  var basculer = function (ouvrir) {
    panneau.hidden = !ouvrir;
    b.setAttribute('aria-expanded', ouvrir ? 'true' : 'false');
  };
  b.addEventListener('click', function () { basculer(panneau.hidden); });
  b.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panneau.hidden) { e.stopPropagation(); basculer(false); } });
  return { bouton: b, panneau: panneau };
}

/* Texte d'explication de la ville, sous son nom. Au-dela de trois lignes
   environ, il est replie avec "Lire la suite". */
function blocExplication(texte) {
  var p = creer('p', { classe: 'w-explication', id: 'tExplication', texte: texte });
  var long = texte.length > 220 || texte.split('\n').length > 3;
  if (!long) { return p; }
  p.classList.add('w-explication--repliee');
  var b = bouton('Lire la suite', 'discret', null, function () {
    var replie = p.classList.toggle('w-explication--repliee');
    b.textContent = replie ? 'Lire la suite' : 'Réduire';
    b.setAttribute('aria-expanded', replie ? 'false' : 'true');
  }, { petit: true, id: 'tLireSuite' });
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-controls', 'tExplication');
  return creer('div', {}, [p, b]);
}


/* Barre d'etapes : un segment par etape, son nom en dessous. Bleu pour les
   etapes faites et l'etape en cours (en gras), gris pour les etapes a
   venir : tout le parcours se lit d'un coup d'oeil. Les lecteurs d'ecran
   entendent l'etat de chaque etape. Sans parcours connu (point de depart
   pas encore choisi), la suite est annoncee "selon votre choix". */
function stepper(n, noms, aller, actionFinale) {
  var d = creer('div', { classe: 'fr-stepper w-stepper' });
  var connu = noms.length > 1;
  d.appendChild(creer('h2', { classe: 'fr-stepper__title', attrs: { tabindex: '-1', id: 'titreVue' } }, [noms[n - 1],
    creer('span', { classe: 'fr-stepper__state', texte: connu ? 'Étape ' + n + ' sur ' + noms.length : 'Étape ' + n })]));
  var liste = noms.slice();
  if (!connu) { liste.push('Suite selon votre choix'); }
  var ol = creer('ol', { classe: 'w-etapes', attrs: { 'aria-label': 'Étapes' } });
  liste.forEach(function (nom, i) {
    var rang = i + 1;
    var etatEtape = rang < n ? 'faite' : (rang === n ? 'en-cours' : 'a-venir');
    /* Une etape deja atteinte (ou toutes, dans les parametrages) se rejoint
       d'un clic ; l'etape en cours et les etapes jamais atteintes ne sont
       pas des liens. */
    var action = rang !== n && aller ? aller(rang) : null;
    var suivante = !!action && rang === n + 1;
    /* Etape juste avant : invitation "Retour", symetrique de "Continuer",
       pour revenir en arriere sans chercher. [MODIFIABLE : le libelle] */
    var precedente = !!action && rang === n - 1;
    /* Etape faite : coche verte devant son nom. Etape suivante : invitation
       "Continuer". La coche s'ajoute au texte, l'etat reste lu par les
       lecteurs d'ecran. */
    var contenu = [
      creer('span', { classe: 'w-etapes__segment', attrs: { 'aria-hidden': 'true' } }),
      creer('span', { classe: 'w-etapes__ligne' }, [
        etatEtape === 'faite' ? creer('span', { classe: 'fr-icon-checkbox-circle-fill w-etapes__coche', attrs: { 'aria-hidden': 'true' } }) : null,
        creer('span', { classe: 'w-etapes__nom', texte: nom })]),
      creer('span', { classe: 'fr-sr-only', texte: etatEtape === 'faite' ? ' (terminée)' : (etatEtape === 'en-cours' ? ' (en cours)' : ' (à venir)') }),
      suivante ? creer('span', { classe: 'w-etapes__appel' }, ['Continuer', creer('span', { classe: 'fr-icon-arrow-right-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } })]) : null,
      precedente ? creer('span', { classe: 'w-etapes__appel w-etapes__appel--retour' }, [creer('span', { classe: 'fr-icon-arrow-left-line fr-icon--sm', attrs: { 'aria-hidden': 'true' } }), 'Retour']) : null];
    var li = creer('li', { classe: 'w-etapes__item w-etapes__item--' + etatEtape + (action ? ' w-etapes__item--lien' : '') + (suivante ? ' w-etapes__item--suivante' : '') + (precedente ? ' w-etapes__item--precedente' : '') },
      action ? [creer('button', { classe: 'w-etapes__bouton', id: 'kEtape' + rang, attrs: { type: 'button' }, clic: action }, contenu)] : contenu);
    if (etatEtape === 'en-cours') { li.setAttribute('aria-current', 'step'); }
    ol.appendChild(li);
  });
  /* A la derniere etape, l'action finale (creer, brancher, enregistrer)
     prend place au bout de la ligne des etapes, la ou se trouve d'habitude
     "Continuer". */
  d.appendChild(actionFinale ? creer('div', { classe: 'w-etapes-rangee' }, [ol,
    bouton(actionFinale.libelle, null, 'check-line', actionFinale.action, { id: actionFinale.id, classe: 'w-etapes-action' })]) : ol);
  return d;
}

/* ==========================================================================
   SECTION 2 : LA CARTE EN PIXEL ART [INTOUCHABLE sauf couleurs et décor]
   La carte est une grille de tuiles de 16 x 16 pixels, dessinée par le code
   sur un canvas puis agrandie sans flou (image-rendering: pixelated).
   Rien n'est importé : tous les dessins sont originaux.
   Par-dessus le dessin, une couche HTML porte les emojis et les noms des
   salles : ce sont de vrais boutons (clic, clavier, lecteurs d'écran).
   DEROGATION PALETTE : les couleurs écrites en dur sont celles d'une
   illustration, pas de l'interface ; l'information est toujours portée par
   un texte (emoji et nom accessible des boutons).
   ========================================================================== */
function $(id) { return document.getElementById(id); }
// Valeur d'une clé propre à l'objet, jamais d'une clé héritée (« constructor », « __proto__ »...) : undefined sinon
function propre(o, k) { return o && typeof o === 'object' && Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined; }
function accord(n, singulier, pluriel) { return compteLocal(n) + ' ' + (n >= 2 ? (pluriel || singulier + 's') : singulier); }
// Un nombre d'éléments écrit en français : « 1 500 »
function compteLocal(n) { try { return typeof n === 'number' ? n.toLocaleString('fr-FR') : String(n); } catch (e) { return String(n); } }

var T = 16;   // [INTOUCHABLE] taille d'une tuile en pixels
var _px = null;   // contexte de dessin en cours
function r(x, y, w, h, c) { _px.fillStyle = c; _px.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
// Hasard reproductible : la même carte est dessinée à chaque fois (touffes d'herbe, livres...)
function graine(n) { var s = n; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
var alea = graine(7);
/* [MODIFIABLE] Chaque personne a son petit personnage, le même pour tout le monde et
   à chaque rafraîchissement (choisi d'après l'identifiant de sa ligne) : teint du plus
   clair au plus foncé, couleur des cheveux, coiffure (courte, longue, chignon, frisée,
   rasée, foulard) et couleur des vêtements. */
var PEAUX = ['#F6D2B5', '#F1C7A3', '#E3B48F', '#C98E66', '#A86F4C', '#8A5A3B', '#6B4630', '#4E3324'];
var CHEVEUX = ['#2B2B2B', '#3B2A20', '#6B4A2B', '#B5793A', '#8A3B2E', '#D9B26A', '#1E1E28', '#9A9A9A'];
var HAUTS = ['#3E9A4E', '#E07B39', '#3F7FE0', '#8A5CD6', '#C94F4F', '#2C9C9A', '#E8B03B', '#D6336C', '#465F9D', '#009081'];
var FOULARDS = ['#0E7490', '#D6336C', '#A558A0', '#465F9D', '#E4794A', '#009081'];
var NB_COIFFURES = 6;   // 0 courte, 1 longue, 2 chignon, 3 frisée, 4 rasée, 5 foulard
function allure(m) {
  var k = funHash(m);
  return { peau: PEAUX[k % PEAUX.length], cheveux: CHEVEUX[(k >>> 3) % CHEVEUX.length], haut: HAUTS[(k >>> 6) % HAUTS.length],
    coiffure: (k >>> 10) % NB_COIFFURES, foulard: FOULARDS[(k >>> 13) % FOULARDS.length] };
}
/* Cheveux (ou foulard) d'un personnage, dessinés autour d'une tête de 6 x 6 dont le coin
   haut gauche est (hx, hy). vue : 'face' (on voit le visage), 'dos' (de dos), 'profil'
   (tourné vers la droite). f(x, y, w, h, couleur) dessine un rectangle dans le même repère que la tête. */
var COIFFURES = {
  face: [[[0, 0, 6, 2], [-1, 0, 1, 3], [6, 0, 1, 3]], [[0, 0, 6, 2], [-1, 0, 1, 7], [6, 0, 1, 7]], [[0, 0, 6, 2], [1, -2, 4, 2], [-1, 1, 1, 2], [6, 1, 1, 2]],
    [[-1, -1, 8, 3], [-2, 0, 1, 4], [7, 0, 1, 4]], [[0, 0, 6, 1]], [[-1, -1, 8, 2], [-1, 1, 1, 6], [6, 1, 1, 6], [0, 6, 6, 1]]],
  dos: [[[0, 0, 6, 6], [-1, 1, 1, 3], [6, 1, 1, 3]], [[0, 0, 6, 7], [-1, 1, 1, 7], [6, 1, 1, 7]], [[0, 0, 6, 6], [1, -2, 4, 2]],
    [[-1, -1, 8, 7], [-2, 0, 1, 5], [7, 0, 1, 5]], [[0, 0, 6, 2]], [[-1, -1, 8, 8]]],
  profil: [[[0, 0, 6, 2], [-1, 0, 1, 5]], [[0, 0, 6, 2], [-1, 0, 1, 8], [0, 6, 1, 2]], [[0, 0, 6, 2], [-1, 0, 1, 4], [-3, -1, 2, 2]],
    [[-1, -1, 7, 3], [-2, 0, 2, 5]], [[0, 0, 6, 1]], [[-1, -1, 7, 2], [-1, 1, 3, 7], [0, 7, 6, 1]]]
};
function coiffure(f, hx, hy, a, vue) {
  var c = a.coiffure === 5 ? a.foulard : a.cheveux;
  (COIFFURES[vue][a.coiffure || 0] || COIFFURES[vue][0]).forEach(function (q) { f(hx + q[0], hy + q[1], q[2], q[3], c); });
}
// Outil : des rectangles relatifs à un point, sur le contexte de dessin du plan
function fMap(px, py) { return function (x, y, w, h, c) { r(px + x, py + y, w, h, c); }; }

/* ---------- Sols ---------- */
function parquet(tx, ty) {

/* --------------------------------------------------------------------------

  var piste = creer('div', { classe: 'dv-frise__piste' });

    sec.appendChild(bouton('Ajouter une colonne « Lien visio » à cette table', 'tertiaire', 'add-line', async function () {
      try { p.colVisio = await ajouterColonne(p.table, 'LIEN_VISIO', 'Text'); await chargerMeta(); redessiner('dv_reunions_colVisio'); afficherSucces('Colonne « Lien visio » ajoutée : collez-y le lien de chaque réunion.'); }
      catch (e) { afficherErreur('La colonne n\'a pas pu être ajoutée.', e); }
    }, { petit: true, id: 'dvAjoutVisio' }));
  }
}
function completerTaches(sec, p) {
  var col = p.colStatut ? infoColonne(p.table, p.colStatut) : null;
  if (col && choixDe(col).length) {
    sec.appendChild(casesValeurs('Statuts d\'une tâche finie (non comptée ; le premier coché sert quand on coche une tâche)', 'dvFini', choixDe(col), p.finis || [], function (x, v) { p.finis = (p.finis || []).filter(function (y) { return y !== x; }); if (v) { p.finis.push(x); } }));
  }
}
// Projets : colonnes de liens (un bouton par lien dans la fiche) et autres champs de la fiche
function completerProjets(sec, p) {
  var cols = colonnesDe(p.table).filter(function (c) { return IDS_META.indexOf(c.colId) === -1 && c.colId.indexOf('gristHelper_') !== 0 && c.colId !== 'manualSort'; });
  var lib = function (c) { return (p.libelles && p.libelles[c.colId]) || nomColonne(c); };
  var liens = cols.filter(TYPES.texte);
  var d1 = creer('details', { classe: 'dv-details fr-mt-2w' }, [creer('summary', { texte: '🔗 Liens de la fiche (' + (p.colLiens || []).length + ')' })]);
  d1.appendChild(casesValeurs('Colonnes qui contiennent un lien (un bouton par lien dans la fiche)', 'dvLien', liens.map(lib), (p.colLiens || []).map(function (id) { var c = infoColonne(p.table, id); return c ? lib(c) : id; }), function (x, v) {
    var c = liens.filter(function (y) { return lib(y) === x; })[0]; if (!c) { return; }
    p.colLiens = (p.colLiens || []).filter(function (id) { return id !== c.colId; }); if (v) { p.colLiens.push(c.colId); }
  }));
  var d2 = creer('details', { classe: 'dv-details fr-mt-1w' }, [creer('summary', { texte: '🗂️ Autres champs de la fiche (' + (p.champsFiche || []).length + ')' })]);
  d2.appendChild(creer('p', { classe: 'w-mention', texte: 'Une colonne « Pièces jointes » s\'affiche avec la liste de ses fichiers, à consulter ou télécharger.' }));
  d2.appendChild(casesValeurs('Champs affichés dans la fiche du projet, en plus du statut, du dev et des dates', 'dvChamp', cols.map(lib), (p.champsFiche || []).map(function (id) { var c = infoColonne(p.table, id); return c ? lib(c) : id; }), function (x, v) {
    var c = cols.filter(function (y) { return lib(y) === x; })[0]; if (!c) { return; }
    p.champsFiche = (p.champsFiche || []).filter(function (id) { return id !== c.colId; }); if (v) { p.champsFiche.push(c.colId); }
  }));
  sec.appendChild(d1);
  sec.appendChild(d2);
}

/* --------------------------------------------------------------------------
   Étape 5 : c'est prêt
   -------------------------------------------------------------------------- */
function etapePrete(b) {
  var c = b.cfg;
  var etatPiece = function (k) {
    if (!pieceTableUtile(c, k)) { return 'pas affichée'; }
    if (b.modes[k] === 'creer') { return 'table « ' + TABLES_PIECES[k].titre + ' » à créer' + (b.exemples ? ', avec des exemples' : ''); }
    var p = c[k];
    return p && p.table && PIECES_TABLES[k].cles.every(function (x) { return p[x]; }) ? 'table « ' + nomTable(p.table) + ' »' : 'table ou colonnes à choisir (sinon la pièce n\'est pas affichée)';
  };
  var modele = MODELES.filter(function (m) { return m.cle === c.modele; })[0];
  var lignes = [];
  if (b.verse) {
    var fV = filtreValide(c.filtre, c.equipe);
    lignes.push(['🌐 Le verse', (c.nom || '') + ' · ' + (b.nouveauVerse && b.mode === 'nouvelles' ? 'nouvelles tables' : (fV ? nomColonne(infoColonne(c.equipe, fV.col)) + ' : ' + fV.valeurs.map(function (v) { return (fV.libelles && propre(fV.libelles, v)) || v; }).join(', ') : 'tout le monde')), 0]);
  }
  lignes = lignes.concat([['🧩 Le modèle', (modele ? modele.titre : 'Sur mesure') + ' · ' + accord(PIECES_OPTIONNELLES.filter(function (p) { return c.pieces[p.cle] !== false; }).length, 'pièce cochée', 'pièces cochées'), 1],
    ['👥 L\'équipe', c.equipe ? nomTable(c.equipe) + ' · ' + ordreDe(c).map(function (s) { return propre(c.nomsSites, s) || s; }).join(', ') : 'à créer', 2]]);
  Object.keys(PIECES_TABLES).forEach(function (k) { lignes.push([PIECES_TABLES[k].titre, etatPiece(k), 3]); });
  lignes.push(['🪑 Les bureaux', c.sites.map(function (s) { return (propre(c.nomsSites, s) || s) + ' : ' + (propre(c.amenagements, s) ? 'placés' : 'disposition automatique'); }).join(' · '), 4]);
  lignes.push(['✨ Petits extras', funResume(c), 1]);
  var ul = creer('ul', { classe: 'dv-recap' });
  lignes.forEach(function (x) { ul.appendChild(creer('li', {}, [creer('strong', { texte: x[0] }), ' : ' + x[1] + ' ', bouton('Modifier', 'discret', null, function () { allerEtape(x[2]); }, { petit: true, aria: 'Modifier : ' + x[0] })])); });
  return creer('div', { classe: 'w-assistant__corps' }, [creer('p', { classe: 'w-texte', texte: '🎉 Tout est prêt. Gristverse crée les tables qui manquent, puis s\'ouvre sur le plan de vos bureaux.' }), ul,
    bouton('Ouvrir Gristverse', null, 'check-line', terminerAssistant, { id: 'dvTerminerBas' })]);
}

/* Fin de l'assistant : création des tables demandées (en un seul envoi), exemples,
   puis enregistrement des réglages. Chaque étape a son message en cas d'échec. */
async function terminerAssistant() {
  var b = etat.brouillon, c = b.cfg, etape = 'préparation';
  if (b.verse) { var pbV = problemeVerse(b); if (pbV) { allerEtape(0); afficherErreur(pbV.message); return; } }
  afficherLoader('Préparation de Gristverse…');
  try {
    await chargerMeta();
    var aCreer = Object.keys(PIECES_TABLES).filter(function (k) { return pieceTableUtile(c, k) && b.modes[k] === 'creer'; });
    if (aCreer.length) {
      etape = 'création des tables';
      // Les choix « EQUIPE » reçoivent les noms de l'équipe
      // (2.0 : par nom, puisque l'emoji est facultatif)
      var equipe = (etat.donnees ? (etat.donnees.tousMembres || etat.donnees.membres) : []).map(function (m) { return m.nom || m.emoji; }).filter(Boolean);
      var pris = [];
      var defs = aCreer.map(function (k) {
        var T = TABLES_PIECES[k], id = idTableLibre(T.id, pris);
        pris.push(id);
        return { id: id, colonnes: T.colonnes.map(function (col) {
          var x = cloner(col);
          if (x.widgetOptions && x.widgetOptions.choices === 'EQUIPE') { x.widgetOptions.choices = equipe.slice(); }
          return x;
        }) };
      });
      var tids = await creerTables(defs);
      await chargerMeta();
      etape = 'noms des tables';
      var ids = await renommerTables(aCreer.map(function (k, i) { return [tids[i], TABLES_PIECES[k].titre + (c.suffixeTables || '')]; }));
      aCreer.forEach(function (k, i) { c[k] = cloner(TABLES_PIECES[k].reglages); c[k].table = ids[tids[i]] || tids[i]; b.modes[k] = 'existante'; });
      await chargerMeta();
      if (b.exemples) { etape = 'ajout des exemples'; await remplirExemples(c, aCreer, equipe); }
    }
    // Une pièce branchée sans ses colonnes clés n'est pas gardée (elle ne s'afficherait pas)
    Object.keys(PIECES_TABLES).forEach(function (k) {
      var p = c[k];
      if (p && (!p.table || PIECES_TABLES[k].cles.some(function (x) { return !p[x]; }))) { c[k] = null; }
    });
    c.version = VERSION_REGLAGES;
    etape = 'enregistrement des réglages';
    // Un nouveau verse (à partir des tables existantes) : sa ligne de réglages est créée ici, sous sa propre clé
    if (b.nouveauVerse) { etat.cleConfig = b.cleNouvelle; etat.cleLigne = b.ligneNouvelle || null; }
    await ecrireConfig(c);
    if (b.nouveauVerse) { memoriserVerse(b.cleNouvelle); }
  } catch (e) {
    masquerLoader();
    afficherErreur(estRefusDroits(e) ? 'Vos droits ne permettent pas de terminer le paramétrage (création de tables ou réglages).' : 'Le paramétrage n\'a pas abouti à l\'étape « ' + etape + ' ».' + detailErreur(e), e);
    return;
  }
  masquerLoader();
  etat.brouillon = null;
  etat.cadrage = null;
  await chargerTout();
  afficherSucces('🌐 Bienvenue dans Gristverse !');
}
// Dates des exemples : jour ouvré à n jours d'aujourd'hui (le week-end passe au lundi)
function jourExemple(n) {
  var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n);
  while (d.getDay() === 0 || d.getDay() === 6) { d.setDate(d.getDate() + 1); }
  return d;
}
function dateExemple(n) { var d = jourExemple(n); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000; }            // colonne Date
function dateHeureExemple(n, h) { var d = jourExemple(n); return epochDansFuseau(d.getFullYear(), d.getMonth() + 1, d.getDate(), Math.floor(h), Math.round((h % 1) * 60), 'Europe/Paris'); }   // colonne DateTime (fuseau Europe/Paris, celui des colonnes créées par Gristverse)
// Remplit les tables tout juste créées avec les exemples de TABLES_PIECES
async function remplirExemples(c, ks, equipe) {
  var qui = function (n) { return equipe.length ? equipe[n % equipe.length] : ''; };
  for (var i = 0; i < ks.length; i++) {
    var k = ks[i], T = TABLES_PIECES[k], tid = c[k].table, lignes = T.exemples || [];
    if (!lignes.length) { continue; }
    var champs = {};
    var ajouter = function (col, v) { (champs[col] = champs[col] || []).push(v); };
    lignes.forEach(function (x) {
      if (k === 'reunions') { ajouter('OBJET', x.OBJET); ajouter('DEBUT', dateHeureExemple(x.jour, x.heure)); ajouter('FIN', dateHeureExemple(x.jour, x.heure + x.duree)); ajouter('LIEU', x.LIEU); ajouter('STATUT', x.STATUT); }
      if (k === 'taches') { ajouter('DESCRIPTION', x.DESCRIPTION); ajouter('RESPONSABLE', qui(x.qui)); ajouter('STATUT', x.STATUT); ajouter('ECHEANCE', dateExemple(x.jour)); ajouter('PRIORITE', x.PRIORITE); }
      if (k === 'ressources') { ajouter('NOM', x.NOM); ajouter('LIEN', x.LIEN); ajouter('TYPE', x.TYPE); ajouter('EPINGLEE', x.EPINGLEE); }
      if (k === 'projets') { ajouter('NUMERO', x.NUMERO); ajouter('NOM', x.NOM); ajouter('STATUT', x.STATUT); ajouter('DEV', qui(x.qui)); ajouter('DEBUT', dateExemple(x.debut)); ajouter('FIN', dateExemple(x.fin)); ajouter('OBJET', x.OBJET); }
    });
    try { await agir([['BulkAddRecord', tid, lignes.map(function () { return null; }), champs]]); }
    catch (e) { logSecurite('AVERTISSEMENT', 'Exemples non ajoutés dans ' + tid, e); }
  }
}

/* ==========================================================================
   SECTION 7 : CHARGEMENT, RAFRAICHISSEMENT ET DEMARRAGE [INTOUCHABLE]
   ========================================================================== */
async function chargerTout() {
  // À l'ouverture, la description du document vient d'être lue par initialiser() : on ne la relit pas
  if (etat.metaFraiche) { etat.metaFraiche = false; } else { await chargerMeta(); }
  await lireConfig();
  // Réglages d'un ancien format mis à niveau : on les enregistre une fois (sans accès complet, on s'en sert sans les écrire)
  if (etat.reglagesAEnregistrer && etat.config && accesComplet()) {
    etat.reglagesAEnregistrer = false;
    try { await ecrireConfig(etat.config); logSecurite('INFO', 'Réglages de la v1 repris en v2'); }
    catch (e) { logSecurite('AVERTISSEMENT', 'Réglages repris non enregistrés', e); }
  }
  // Lecteurs (ou document ouvert en consultation) : aucun bouton de modification dès l'ouverture
  etat.peutModifier = accesComplet() && await sonderEcriture();
  etat.peutParametrer = etat.peutModifier;
  if (!etat.config || !etat.config.equipe || !etat.meta.tables[etat.config.equipe]) {
    if (etat.peutParametrer) { if (!etat.brouillon) { ouvrirAssistant(1); } return; }
    afficherVue('aucun');
    return;
  }
  // La carte s'affiche avec les tables légères ; projets, prestataires et ressources suivent en arrière-plan
  await chargerDonnees({ sansLourdes: true });
  /* 2.0 : les montures et les bureaux étaient enregistrés par emoji (ou par nom) ; ils sont
     repris une fois sous les identifiants de ligne de l'équipe, pour qu'un changement de nom
     ou d'emoji ne fasse rien perdre. Enregistré par les propriétaires ; sinon utilisé en
     mémoire. Seulement quand l'équipe a pu être lue (jamais sur une lecture vide). */
  if (etat.donnees && etat.donnees.equipeLue && migrerClesPersonnes(etat.config, etat.donnees.tousMembres) && etat.peutParametrer) {
    try { await ecrireConfig(etat.config); logSecurite('INFO', 'Montures et bureaux repris sous les identifiants de ligne'); } catch (e) { logSecurite('AVERTISSEMENT', 'Montures et bureaux non repris', e); }
  }
  await funMigrerLignes();
  await funLireFuseau();   // fuseau du document pour le décor (petits extras), lu une seule fois
  if (!etat.brouillon) { afficherVue('plan'); }   // pendant l'assistant, on ne le quitte pas
  relayer(chargerLourdesEnFond(), 'Lecture des projets et ressources');
}

/* Relecture : le plan est redessiné, sauf si une fenêtre est ouverte (elle
   se met à jour à sa fermeture). */
async function rafraichirMaintenant() {
  if (etat.vue !== 'plan' || !etat.config) { return; }
  try {
    // Relecture des seules tables légères ; si rien n'a changé (par exemple l'écho de
    // notre propre déclaration, déjà affichée), la carte n'est pas redessinée
    await chargerDonnees();
    if (!carteAJour() || etat.rafraichirEnAttente) { /* à redessiner */ } else { return; }
    // Fenêtre ouverte ou personnage en train de courir : on redessinera après
    if (etat.modaleOuverte || etat.enRoute) { etat.rafraichirEnAttente = true; return; }
    etat.rafraichirEnAttente = false;
    redessinerPlan();
  } catch (e) { logSecurite('AVERTISSEMENT', 'Relecture non aboutie', e); }
}
/* Redessine la carte et rend le focus au même élément (retrouvé par son identifiant,
   sinon par son nom accessible) : un rafraîchissement ne renvoie jamais le clavier en haut de page. */
function redessinerPlan() {
  var actif = document.activeElement, idA = actif && actif.id ? actif.id : null, libelle = actif && actif.getAttribute ? actif.getAttribute('aria-label') : null;
  afficherVue('plan');
  var n = (idA && $(idA)) || (libelle && contenu().querySelector('[aria-label="' + CSS.escape(libelle) + '"]')) || null;
  if (n && actif !== document.body) { n.focus(); }
}
/* [INTOUCHABLE] États qui dépendent de l'heure (le rappel RAPPEL_MINUTES avant une réunion, une
   réunion qui commence ou se termine, un nouveau jour) : vérifiés toutes les 30 secondes SANS
   lire Grist ; la carte n'est redessinée que si l'un d'eux a changé depuis son dessin. */
var DELAI_HORLOGE_MS = 30000;   // [MODIFIABLE] intervalle de vérification, en millisecondes
function cleHorloge() {
  if (!etat.donnees || !etat.config) { return ''; }
  var es = etatSalleReunion(), imm = es.imminente;
  return [aujourdhui(), imm ? imm.id + ':' + Math.ceil((imm.debut - Date.now() / 1000) / 60) : '', es.enCours ? es.enCours.id : '', es.duJour.filter(function (x) { return x.passee; }).length, funCleHorloge()].join('|');
}
setInterval(function () {
  if (document.visibilityState === 'hidden' || etat.vue !== 'plan' || !etat.donnees || cleHorloge() === etat.cleHorlogeDessinee) { return; }
  if (etat.modaleOuverte || etat.enRoute) { etat.rafraichirEnAttente = true; return; }
  redessinerPlan();
}, DELAI_HORLOGE_MS);
// La carte affichée montre-t-elle les dernières données lues ?
function carteAJour() { return etat.empreinteDessinee === etat.empreinteDonnees; }
var _minuterieRafraichir = null;
function planifierRafraichissement() {
  if (_minuterieRafraichir) { clearTimeout(_minuterieRafraichir); }
  _minuterieRafraichir = setTimeout(function () { _minuterieRafraichir = null; relayer(rafraichirMaintenant(), 'Rafraîchissement'); }, 400);
}

async function initialiser() {
  if (etat.initEnCours) { return; }
  etat.initEnCours = true;
  afficherLoader('Ouverture de Gristverse…');
  try {
    await attendreAcces();
    // Les réglages de Gristverse sont lus EN MÊME TEMPS que la description du document
    _prelectureBiblio = lireTable(ID_BIBLIO).catch(function () { return null; });
    // Nom du document : le dernier verse consulté est retenu par document sur ce navigateur
    try { etat.nomDoc = await gristAvecTimeout(grist.docApi.getDocName(), 3000); } catch (e) { logSecurite('INFO', 'Nom du document non lu', e); }
    lireVerseMemorise();
    await chargerMeta();
    etat.metaFraiche = true;   // chargerTout() ne la relira pas
    await chargerTout();
    masquerLoader();
  } catch (e) {
    masquerLoader();
    logSecurite('ERREUR', 'Initialisation', e);
    // Sans accès complet, le document ne peut pas être lu : on explique comment l'accorder
    if (!accesComplet()) { afficherVue('aucun'); return; }
    afficherErreur('Le chargement n\'a pas abouti.');
    afficherVue('echec');
  } finally {
    etat.initEnCours = false;
  }
}

/* === ECOUTEURS ET DEMARRAGE === */
document.getElementById('bandeauVersion').textContent = 'v' + VERSION_WIDGET;
dessinerLogo();
document.getElementById('wErreurFermer').addEventListener('click', masquerErreur);
document.getElementById('wVisionneuseFermer').addEventListener('click', fermerVisionneuse);
document.getElementById('wVisionneusePlein').addEventListener('click', basculerPleinEcranVisionneuse);
document.getElementById('wVisionneuseTelecharger').addEventListener('click', function () {
  if (_visionneuse.id) { relayer(telechargerPJ(_visionneuse.id), 'Téléchargement depuis la visionneuse'); }
});
document.getElementById('wSuccesFermer').addEventListener('click', masquerSucces);
document.getElementById('wModaleFermer').addEventListener('click', fermerModale);
document.getElementById('wConfirmOui').addEventListener('click', function () { terminerConfirmation(true); });
document.getElementById('wConfirmNon').addEventListener('click', function () { terminerConfirmation(false); });
/* Échap ferme la fenêtre ouverte, même quand le focus a été perdu après un
   redessin de son contenu (sauf si une confirmation est affichée). */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape' || !etat.modaleOuverte) { return; }
  var vis = document.getElementById('wVisionneuse');
  if (vis && (vis.classList.contains('actif') || (e.target && vis.contains(e.target)))) { return; }
  var conf = document.getElementById('wConfirmOverlay');
  if (conf && conf.classList.contains('actif')) { return; }
  fermerModale();
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && etat.vue === 'plan' && !etat.modaleOuverte) { relayer(rafraichirMaintenant(), 'Relecture au retour sur la page'); }
});

grist.ready({ requiredAccess: 'full', columns: [] });

/* Niveau d'accès réellement accordé au widget ('none', 'read table', 'full').
   Sans accès complet, Gristverse passe en consultation seule et le dit. */
var _accesRecu = null;
var _promesseAcces = new Promise(function (ok) { _accesRecu = ok; });
function accesComplet() { return etat.niveauAcces === 'full'; }
grist.onOptions(function (options, interaction) {
  var avant = etat.niveauAcces;
  etat.niveauAcces = interaction && interaction.accessLevel ? interaction.accessLevel : null;
  _accesRecu();
  if (avant !== null && avant !== etat.niveauAcces && !etat.initEnCours) { relayer(chargerTout(), 'Changement du niveau d\'accès'); }
});
function attendreAcces() { return Promise.race([_promesseAcces, new Promise(function (ok) { setTimeout(ok, 3000); })]); }
grist.onRecords(function () { if (!etat.initEnCours) { planifierRafraichissement(); } });

setTimeout(function () {
  window.addEventListener('unhandledrejection', function (evt) { logSecurite('ERREUR', 'Promesse rejetée non capturée', evt ? evt.reason : undefined); });
}, 1500);

relayer(initialiser(), 'Initialisation');

</script>
