<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>w</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>:root {
  --sable: #F7F7F7;
  --sable2: #EFEFEF;
  --encre: #262633;
  --gris: #666666;
  --trait: #D9D9D9;
  --blanc: #FFFFFF;
  --vert: #16B378;
  --vert-moyen: #009058;
  --orange: #F9AE41;
  --ecume: #DCF4EB;
  --ecume-f: #007548;
  --flamant: #FDE5E7;
  --flamant-f: #D0021B;
  --citron: #FFF6E6;
  --citron-f: #8A5A00;
  --peche: #FDE7CF;
  --peche-f: #9A4A00;
  --lavande: #E3ECFD;
  --lavande-f: #1D4ED8;
  --menthe: #E3F1DF;
  --menthe-f: #2E6B1F;
  --coucher: var(--blanc);
  --ombre: 0 1px 2px rgba(38, 38, 51, .06);
  --ombre-forte: 0 2px 18px rgba(31, 37, 50, .31), 0 0 1px rgba(76, 86, 103, .24);
  --voile: rgba(38, 38, 51, .5);
  --r-s: 4px;
  --r-m: 6px;
  --r-l: 8px;
  --r-xl: 8px;
  --police:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Liberation Sans",
    Helvetica,
    Arial,
    sans-serif,
    "Apple Color Emoji",
    "Segoe UI Emoji",
    "Segoe UI Symbol";
  --mono:
    "Monaco",
    "Menlo",
    "Ubuntu Mono",
    "Consolas",
    "source-code-pro",
    monospace;
  --focus: 2px solid var(--vert-moyen);
  --fab: 60px;
  --fab-bas: 22px;
  --fab-reserve: calc(var(--fab) + var(--fab-bas) + 28px + env(safe-area-inset-bottom, 0px));
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
}
body {
  background: var(--sable);
  color: var(--encre);
  font-family: var(--police);
  font-size: 14px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
h1,
h2,
h3 {
  margin: 0;
  line-height: 1.2;
}
p {
  margin: 0;
}
a {
  color: var(--ecume-f);
}
button,
input,
select,
textarea {
  font-family: inherit;
  font-size: 14px;
  color: var(--encre);
}
:focus-visible {
  outline: var(--focus);
  outline-offset: 2px;
}
.cache,
[hidden],
.btn[hidden],
.fab[hidden],
.pil[hidden],
.btn-icone[hidden],
.bandeau[hidden],
.choix[hidden],
.carte[hidden] {
  display: none;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.mini {
  font-size: 13px;
  color: var(--gris);
}
.gras {
  font-weight: 600;
}
.loader {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  place-items: center;
  background: var(--sable);
  color: var(--gris);
}
.loader.actif {
  display: grid;
}
.loader .rond {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 4px solid var(--sable2);
  border-top-color: var(--vert);
  animation: tourne .9s linear infinite;
  margin: 0 auto 10px;
}
@keyframes tourne {
  to {
    transform: rotate(360deg);
  }
}
.page {
  padding: 16px 16px var(--fab-reserve);
  width: 100%;
}
.lisible {
  max-width: 75ch;
}
.barre {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.barre .titre {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}
.barre h1 {
  font-size: 22px;
  font-weight: 600;
}
.barre .marque {
  font-size: 13px;
  color: var(--gris);
  font-weight: 600;
}
.barre .actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.grille {
  display: grid;
  gap: 14px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 700px) {
  .page {
    padding: 20px 20px var(--fab-reserve);
  }
  .grille.g2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1100px) {
  .page {
    padding: 24px 24px var(--fab-reserve);
  }
  .grille.g3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
@media (min-width: 1500px) {
  .grille.g2 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grille.g3 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
@media (min-width: 1850px) {
  .grille.g3 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .grille.g3,
  .grille.g4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.carte {
  background: var(--blanc);
  border: 1px solid var(--trait);
  border-radius: var(--r-m);
  box-shadow: var(--ombre);
  padding: 16px;
  min-width: 0;
}
.carte.douce {
  background: var(--sable);
  box-shadow: none;
}
.carte h2 {
  font-size: 17px;
  font-weight: 600;
}
.hero {
  background: var(--blanc);
  border: 1px solid var(--trait);
  border-top: 3px solid var(--vert);
  border-radius: var(--r-m);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  color: var(--encre);
}
.hero h2 {
  font-size: 20px;
  font-weight: 600;
}
.hero p {
  color: var(--gris);
  font-size: 14px;
  margin-top: 4px;
}
.btn {
  min-height: 44px;
  border: 1px solid transparent;
  border-radius: var(--r-s);
  padding: 10px 20px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--ecume-f);
  color: var(--blanc);
  text-decoration: none;
}
.btn:hover {
  background: #00613b;
}
.btn.sec {
  background: var(--blanc);
  color: var(--ecume-f);
  border-color: var(--vert);
}
.btn.sec:hover,
.btn.lien:hover {
  background: var(--ecume);
}
.btn.doux {
  background: var(--blanc);
  color: var(--encre);
  border-color: var(--trait);
}
.btn.doux:hover {
  background: var(--sable);
}
.btn.danger {
  background: var(--flamant-f);
  color: var(--blanc);
}
.btn.danger:hover {
  background: #a10000;
}
.btn.lien {
  background: transparent;
  color: var(--ecume-f);
  padding: 10px 12px;
}
.btn.plein {
  width: 100%;
}
.btn[disabled] {
  opacity: .55;
  cursor: not-allowed;
}
.btn-icone {
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--trait);
  border-radius: var(--r-s);
  background: var(--blanc);
  color: var(--encre);
  cursor: pointer;
  display: inline-grid;
  place-items: center;
  font-size: 17px;
  padding: 0 10px;
}
.pil {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 3px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  border: 0;
  background: var(--sable2);
  color: var(--encre);
}
button.pil {
  min-height: 44px;
  padding: 6px 14px;
  cursor: pointer;
}
.t-ecume {
  background: var(--ecume);
  color: var(--ecume-f);
}
.t-flamant {
  background: var(--flamant);
  color: var(--flamant-f);
}
.t-citron {
  background: var(--citron);
  color: var(--citron-f);
}
.t-peche {
  background: var(--peche);
  color: var(--peche-f);
}
.t-lavande {
  background: var(--lavande);
  color: var(--lavande-f);
}
.t-menthe {
  background: var(--menthe);
  color: var(--menthe-f);
}
.t-sable {
  background: var(--sable2);
  color: var(--gris);
}
.t-vert {
  background: var(--vert);
  color: var(--blanc);
}
.choix {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.choix button {
  min-height: 44px;
  min-width: 48px;
  border: 1px solid var(--trait);
  border-radius: var(--r-s);
  padding: 0 16px;
  font-weight: 600;
  background: var(--blanc);
  color: var(--encre);
  cursor: pointer;
}
.choix button[aria-pressed=true] {
  background: var(--ecume-f);
  border-color: var(--ecume-f);
  color: var(--blanc);
}
.onglets {
  position: relative;
  display: flex;
  gap: 4px;
  background: var(--blanc);
  border-radius: var(--r-m);
  padding: 4px;
  border: 1px solid var(--trait);
  overflow-x: auto;
  margin-bottom: 16px;
  max-width: 100%;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  scroll-padding: 0 36px;
  -webkit-overflow-scrolling: touch;
}
.onglets::-webkit-scrollbar {
  display: none;
}
.onglets button {
  flex: none;
  min-height: 44px;
  border: 0;
  border-radius: var(--r-s);
  padding: 0 16px;
  background: transparent;
  color: var(--gris);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  scroll-snap-align: start;
}
.onglets-cadre {
  position: relative;
  margin-bottom: 16px;
}
.onglets-cadre > .onglets {
  margin-bottom: 0;
}
.onglets-cadre:before,
.onglets-cadre:after {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 46px;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  display: grid;
  align-items: center;
  color: var(--ecume-f);
  font-weight: 600;
  font-size: 22px;
}
.onglets-cadre:before {
  content: "‹";
  left: 0;
  justify-items: start;
  padding-left: 10px;
  border-radius: var(--r-m) 0 0 var(--r-m);
  background:
    linear-gradient(
      90deg,
      var(--blanc) 45%,
      rgba(255, 255, 255, 0));
}
.onglets-cadre:after {
  content: "›";
  right: 0;
  justify-items: end;
  padding-right: 10px;
  border-radius: 0 var(--r-m) var(--r-m) 0;
  background:
    linear-gradient(
      270deg,
      var(--blanc) 45%,
      rgba(255, 255, 255, 0));
}
.onglets-cadre.g:before,
.onglets-cadre.d:after {
  opacity: 1;
}
.onglets button[aria-selected=true] {
  background: var(--ecume-f);
  color: var(--blanc);
}
@media (max-width: 520px) {
  .onglets button {
    padding: 0 12px;
  }
}
.jauge {
  height: 8px;
  border-radius: var(--r-s);
  background: var(--sable2);
  overflow: hidden;
}
.jauge > i {
  display: block;
  height: 100%;
  border-radius: var(--r-s);
  background: var(--vert);
}
.jauge.alerte > i {
  background: var(--flamant-f);
}
.lignes-jauge {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.lignes-jauge .jauge {
  flex: 1;
  min-width: 120px;
}
.champ {
  margin-bottom: 14px;
}
.champ > label,
.champ > .lib {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}
.champ input[type=text],
.champ input[type=number],
.champ input[type=date],
.champ input[type=url],
.champ select,
.champ textarea {
  width: 100%;
  min-height: 44px;
  border-radius: var(--r-s);
  border: 1px solid var(--trait);
  background: var(--blanc);
  padding: 8px 12px;
}
.champ textarea {
  min-height: 80px;
  resize: vertical;
}
.champ input:focus-visible,
.champ select:focus-visible,
.champ textarea:focus-visible {
  border-color: var(--vert);
  outline: var(--focus);
  outline-offset: 0;
}
.champ .aide {
  font-size: 13px;
  color: var(--gris);
  margin-top: 4px;
}
.champ > label.photo-btn,
.photo-btn {
  display: flex;
  margin-bottom: 0;
  font-size: 14px;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  border-radius: var(--r-s);
  background: var(--blanc);
  border: 1px solid var(--trait);
  padding: 0 14px;
  color: var(--ecume-f);
  font-weight: 600;
  cursor: pointer;
}
.photo-btn input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.photo-btn:focus-within {
  outline: var(--focus);
  outline-offset: 2px;
}
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--fab-bas) + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  width: var(--fab);
  height: var(--fab);
  border-radius: 50%;
  border: 0;
  background: var(--ecume-f);
  color: var(--blanc);
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 2px 8px #26263340;
  display: grid;
  place-items: center;
}
dialog.feuille {
  border: 0;
  padding: 0;
  background: var(--blanc);
  color: var(--encre);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 40px);
  border-radius: var(--r-xl);
  box-shadow: var(--ombre-forte);
}
dialog.feuille::backdrop {
  background: var(--voile);
}
dialog.feuille .corps {
  padding: 12px 20px 22px;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
}
dialog.feuille > .fermer-x {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 3;
  border-color: transparent;
}
dialog.feuille h2 {
  padding-right: 48px;
}
dialog.feuille .poignee {
  width: 44px;
  height: 4px;
  border-radius: 2px;
  background: var(--trait);
  margin: 10px auto 6px;
}
dialog.feuille h2 {
  font-size: 19px;
  font-weight: 600;
  margin: 4px 0 14px;
}
dialog.feuille .pied {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 10px;
}
@media (max-width: 699px) {
  dialog.feuille {
    width: 100vw;
    max-width: 100vw;
    margin: auto 0 0;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    max-height: 92vh;
  }
  dialog.feuille .corps {
    max-height: calc(92vh - 24px);
  }
  dialog.feuille .pied .btn {
    flex: 1;
  }
}
@media (min-width: 700px) {
  dialog.feuille .poignee {
    display: none;
  }
}
.toasts {
  position: fixed;
  left: 50%;
  transform: translate(-50%);
  bottom: 96px;
  z-index: 95;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(440px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  background: #040404;
  color: var(--blanc);
  border-radius: var(--r-s);
  padding: 12px 16px;
  font-weight: 600;
  box-shadow: var(--ombre-forte);
}
.toast.ok {
  background: var(--ecume-f);
}
.toast.err {
  background: var(--flamant-f);
}
.bandeau {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-radius: var(--r-s);
  border: 1px solid rgba(38, 38, 51, .08);
  padding: 12px 16px;
  margin-bottom: 14px;
}
.bandeau .txt {
  flex: 1;
  min-width: 200px;
}
.vide {
  text-align: center;
  padding: 28px 16px;
  color: var(--gris);
}
.vide .gros {
  font-size: 40px;
}
.av {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
}
.av.grand {
  width: 84px;
  height: 84px;
  font-size: 40px;
}
.ligne {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--trait);
  min-width: 0;
}
.ligne .x {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.capot-grille {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 1800px) {
  .capot-grille {
    grid-template-columns: minmax(880px, 1.1fr) minmax(0, 1fr);
    align-items: start;
  }
}
.schema-svg {
  width: 100%;
  max-width: 880px;
  height: auto;
  display: block;
}
.schema-svg .boite-fond {
  fill: var(--blanc);
  stroke: var(--trait);
  stroke-width: 1;
}
.schema-svg text {
  font-family: var(--police);
  font-size: 13px;
  fill: var(--encre);
}
.schema-svg .type {
  fill: var(--gris);
  font-size: 12px;
}
.schema-svg .ent {
  font-weight: 600;
  font-size: 14px;
}
.schema-svg .champ-l {
  cursor: pointer;
}
.schema-svg .champ-l:focus-visible rect.surv,
.schema-svg .champ-l:hover rect.surv {
  fill: var(--ecume);
  stroke: var(--vert-moyen);
  stroke-width: 2;
}
.schema-svg .lien {
  fill: none;
  stroke: var(--vert);
  stroke-width: 2;
}
.schema-svg .lien-txt {
  fill: var(--gris);
  font-size: 11px;
}
.schema-mobile details {
  border-radius: var(--r-s);
  background: var(--blanc);
  border: 1px solid var(--trait);
  margin-bottom: 10px;
}
.schema-mobile summary {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--r-s);
}
.schema-mobile ul {
  list-style: none;
  margin: 0;
  padding: 0 14px 10px;
}
.schema-mobile li button {
  width: 100%;
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  border: 0;
  background: transparent;
  border-top: 1px solid var(--trait);
  padding: 6px 0;
  text-align: left;
  cursor: pointer;
}
.schema-mobile .fleche {
  color: var(--ecume-f);
  font-size: 13px;
  font-weight: 600;
}
.vue-bureau {
  display: none;
}
@media (min-width: 1100px) {
  .vue-bureau {
    display: block;
  }
  .vue-mobile {
    display: none;
  }
}
.fiche-champ {
  border-radius: var(--r-s);
  padding: 14px;
  background: var(--sable);
  border: 1px solid var(--trait);
}
.fiche-champ h3 {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.fiche-champ .ex {
  margin-top: 8px;
  font-size: 13px;
}
.fiche-champ.active {
  border-color: var(--vert);
  box-shadow: inset 0 0 0 1px var(--vert);
}
pre.code {
  background: var(--encre);
  color: #f7f7f7;
  border-radius: var(--r-s);
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 10px 0;
}
code {
  font-family: var(--mono);
  font-size: .92em;
  background: var(--sable2);
  border-radius: 3px;
  padding: 1px 5px;
  overflow-wrap: anywhere;
}
.jeton {
  display: grid;
  grid-template-columns: minmax(90px, 150px) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 10px 0;
  border-bottom: 1px solid var(--trait);
}
.jeton .j {
  background: var(--ecume);
  color: var(--ecume-f);
  border-radius: 3px;
  padding: 4px 12px;

      c.v = 0;
      d.v = 0;
    }
  });
  function tri(l) {
    return l.filter(function(x) {
      return x.v > 0;
    }).sort(function(a, b) {

    });
  }
  cr = tri(cr);

    res.push({ de: de[0].id, a: cr[0].id, c: m });

    de[0].v -= m;
    cr = tri(cr);
    de = tri(de);
  }

  return '<div class="duo"><div class="t-lavande"><span class="mini" style="color:var(--lavande-f)">Par mois</span><div class="gros">' + echapperHTML(MGP.formatMontant(Math.round(total))) + '</div></div><div class="t-peche"><span class="mini" style="color:var(--peche-f)">Capital restant dû</span><div class="gros">' + echapperHTML(MGP.formatMontant(Math.round(cap))) + "</div></div></div>" + lo.map(function(l) {
    return '<div class="ligne"><span aria-hidden="true">' + echapperHTML(l.EMOJI || "🏠") + '</span><span class="x">' + echapperHTML(l.NOM || "Logement") + "</span><b>" + echapperHTML(MGP.formatMontant(Math.round(net(l)))) + "</b></div>";
  }).join("") + ech.slice(0, 2).map(function(c) {
    var j = RES.jour(c.PROCHAINE);
    return '<div class="ligne"><span class="pil t-citron">' + echapperHTML(j === auj ? "aujourd’hui" : "J-" + (j - auj)) + '</span><span class="x">' + echapperHTML((c.LIBELLE || "Échéance") + " · " + MGP.formatMontant(RES.num(c.MONTANT_PERIODE))) + "</span></div>";
  }).join("") + '<p class="mini" style="margin-top:8px">' + echapperHTML("Charges et crédits" + (rev.length ? " · révision du loyer possible : " + rev.map(function(l) {
    return l.NOM;
  }).join(", ") : "") + ".") + "</p>";
};
RES.epargne = async function() {
  var pr = await RES.table("PROJETS_EPARGNE");
  if (!pr) {
    return null;
  }
  if (!pr.length) {
    return '<p class="mini">Aucun projet d’épargne pour l’instant.</p>';
  }
  var ouv = pr.filter(function(p) {
    return !p.CLOS;
  }), cours = ouv.filter(function(p) {
    return !p.ATTEINT;
  });
  var tot = ouv.reduce(function(s, p) {
    return s + RES.num(p.EPARGNE);
  }, 0), parMois = cours.filter(function(p) {
    return !p.EN_PAUSE;
  }).reduce(function(s, p) {
    return s + RES.num(p.PAR_MOIS);
  }, 0);
  var retard = cours.filter(function(p) {
    return p.ETAT === "En retard";
  }).length, atteints = ouv.filter(function(p) {
    return p.ATTEINT === true;
  }).length;
  var top = cours.filter(function(p) {
    return typeof p.POURCENT === "number";
  }).sort(function(a, b) {
    return b.POURCENT - a.POURCENT || a.id - b.id;
  }).slice(0, 3);
  var eur = function(n) {
    return MGP.formatMontant(Math.round(RES.num(n) * 100) / 100);
  };
  return '<div class="duo"><div class="t-flamant"><span class="mini" style="color:var(--flamant-f)">Mis de côté</span><div class="gros">' + echapperHTML(eur(tot)) + '</div></div><div class="t-peche"><span class="mini" style="color:var(--peche-f)">À mettre par mois</span><div class="gros">' + echapperHTML(eur(parMois)) + "</div></div></div>" + top.map(function(p) {
    return '<div class="ligne"><span class="pil ' + (p.ETAT === "En retard" ? "t-flamant" : "t-menthe") + '">' + echapperHTML(Math.round(p.POURCENT) + " %") + '</span><span class="x">' + echapperHTML((p.EMOJI ? p.EMOJI + " " : "") + (p.PROJET || "") + " : " + eur(p.EPARGNE) + " sur " + eur(p.OBJECTIF)) + "</span></div>";
  }).join("") + '<p class="mini" style="margin-top:8px">' + echapperHTML([retard + " en retard", atteints ? atteints + " atteint" + (atteints > 1 ? "s" : "") : ""].filter(Boolean).join(" · ") + ".") + "</p>";
};
RES.evenement = async function() {
  var ev = await RES.table("EVENEMENTS"), inv = await RES.table("EVT_INVITES") || [];
  if (!ev) {
    return null;
  }
  if (!ev.length) {
    return '<p class="mini">Aucun événement pour l’instant.</p>';
  }
  var auj = RES.aujourdhui(), avenir = ev.filter(function(e2) {
    var j = RES.jour(e2.DATE);
    return j !== null && j >= auj;
  }).sort(function(a, b) {
    return a.DATE - b.DATE;
  });
  var e = avenir[0] || ev.slice().sort(function(a, b) {
    return (b.DATE || 0) - (a.DATE || 0);
  })[0], n = typeof e.JOURS_RESTANTS === "number" ? e.JOURS_RESTANTS : null;
  var li = inv.filter(function(i) {
    return Number(i.EVENEMENT) === e.id;
  }), c = function(s) {
    return li.filter(function(i) {
      return (i.STATUT || "Sans réponse") === s;
    }).length;
  };
  var relancer = li.filter(function(i) {
    return i.A_RELANCER;
  }).length, pres = RES.num(e.PRESENTS), enf = RES.num(e.ENFANTS_PRESENTS);
  var autres = avenir.length - (avenir[0] === e ? 1 : 0);
  return "<p><b>" + echapperHTML(e.EVENEMENT || "Événement") + "</b>" + (e.DATE ? '<br><span class="mini">' + echapperHTML(RES.texteJour(RES.jour(e.DATE)) + (e.LIEU ? " · " + e.LIEU : "")) + "</span>" : "") + '</p><div class="duo"><div class="t-flamant"><span class="mini" style="color:var(--flamant-f)">' + (n !== null && n < 0 ? "C’était" : "Avant le jour J") + '</span><div class="gros">' + echapperHTML(n === null ? "?" : n > 0 ? "J-" + n : n === 0 ? "Jour J" : "J+" + -n) + '</div></div><div class="t-menthe"><span class="mini" style="color:var(--menthe-f)">Présents</span><div class="gros">' + pres + '</div></div></div><div class="ligne" style="flex-wrap:wrap;gap:6px"><span class="pil t-menthe">' + c("Oui") + ' oui</span><span class="pil t-citron">' + c("Peut-être") + ' peut-être</span><span class="pil t-flamant">' + c("Non") + ' non</span><span class="pil t-ecume">' + c("Sans réponse") + ' sans réponse</span></div><p class="mini" style="margin-top:8px">' + echapperHTML([enf ? "dont " + enf + " enfant" + (enf > 1 ? "s" : "") : "", relancer ? relancer + " à relancer" : "", RES.num(e.RESTE_A_PAYER) ? "reste à payer " + MGP.formatMontant(Math.round(RES.num(e.RESTE_A_PAYER))) : "", autres ? autres + " autre" + (autres > 1 ? "s" : "") + " événement" + (autres > 1 ? "s" : "") + " à venir" : ""].filter(Boolean).join(" · ") + ".") + "</p>";
};
RES.rendre = async function() {
  var sec = MGP.SECTIONS[RES.section];
  var z = document.getElementById("zone");
  if (!sec) {
    document.getElementById("titre").textContent = "Récapitulatif";
    z.innerHTML = '<div class="carte vide"><p>Section inconnue. L’adresse du widget doit finir par ?section=argent, maison, famille ou loisirs.</p></div>';
    return;
  }
  document.getElementById("titre").textContent = sec.page;
  if (MGP.g.acces !== "full") {
    z.innerHTML = '<div class="carte vide"><p>Ce récapitulatif lit les tables de vos widgets : donnez-lui l’accès complet au document.</p></div>';
    return;
  }
  var vues = {};
  try {
    (await MGP.g.lire("_grist_Views")).forEach(function(v) {
      vues[v.id] = v.name;
    });
  } catch (e) {
    logSecurite("pages", e);
  }
  var installes = MGP.g.techLignes.filter(function(l) {
    return MGP.g.estMarqueurCadeau(l.CLE);
  }).map(function(l) {
    try {
      return JSON.parse(l.VALEUR);
    } catch (e) {
      return null;
    }
  }).filter(function(m2) {
    return m2 && m2.section === RES.section && RES.WIDGETS[m2.cle];
  }).sort(function(a, b) {
    return sec.widgets.indexOf(a.cle) - sec.widgets.indexOf(b.cle);
  });
  var cartes = [];
  for (var i = 0; i < installes.length; i++) {
    var m = installes[i], w = RES.WIDGETS[m.cle], corps = null;
    try {
      corps = await RES[m.cle]();
    } catch (e) {
      logSecurite("récapitulatif " + m.cle, e);
    }
    if (corps === null) {
      continue;
    }
    var page = m.vue && vues[m.vue] ? vues[m.vue] : null;
    cartes.push('<section class="carte recap" data-widget="' + echapperHTML(m.cle) + '"><h2><span class="em ' + w.couleur + '" aria-hidden="true">' + w.emoji + "</span>" + echapperHTML(w.nom) + "</h2>" + corps + '<p class="voir">' + echapperHTML(page ? "Voir la page « " + page + " » dans le menu de gauche" : "Voir sa page dans le menu de gauche") + "</p></section>");
  }
  document.getElementById("sous").textContent = cartes.length ? "L’essentiel de vos widgets de cette section, d’un coup d’œil." : "";
  z.innerHTML = cartes.length ? '<div class="recaps">' + cartes.join("") + "</div>" : '<div class="carte vide"><div class="gros" aria-hidden="true">🎄</div><p>Les widgets de cette section arrivent avec le calendrier de l’Avent.</p></div>';
};
RES.demarrer = async function() {
  RES.section = MGP.param("section");
  var acces = await MGP.g.demarrer("full");
  try {
    if (acces === "full") {
      await MGP.g.lireReglagesDoc();
      await MGP.g.chargerMeta();
      await MGP.g.chargerTech();
    }
    await RES.rendre();
  } catch (e) {
    logSecurite("récapitulatif", e);
  }
  masquerLoader();
  try {
    grist.on("message", function(m) {
      if (m && (m.dataChange || m.docChange)) {
        clearTimeout(RES.t);
        RES.t = setTimeout(async function() {
          await MGP.g.chargerMeta();
          await MGP.g.chargerTech();
          RES.rendre();
        }, 400);
      }
    });
  } catch (e) {
    logSecurite("écoute", e);
  }
};
window.RES = RES;
RES.demarrer();</script>
