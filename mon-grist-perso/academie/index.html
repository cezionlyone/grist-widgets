  return vue ? { t, vue, vues, sections, nom } : null;
};
ACA.placerSurSaPage = async function(m, sa, url) {
  var moi = MGP.g.normaliserUrl(url), nomPage = m.page || "🎁 " + (m.surprise && m.surprise.nom || m.titre);
  var deja = sa.sections.some(function(s) {
    return s.parentId === sa.vue && s.parentKey === "custom" && MGP.g.normaliserUrl(MGP.g.urlSection(s)) === moi;
  });
  var nomCadeau = m.surprise && m.surprise.nom || m.titre;
  if (!deja) {
    await P.ajouterWidgetSurPage(sa.t.id, sa.vue, url, nomPage, "Votre cadeau " + nomCadeau + ", construit autour de votre table : il garde vos lignes et ajoute ce qui manque.");
  }
  var v = sa.vues.filter(function(x) {
    return x.id === sa.vue;
  })[0], raw = sa.sections.filter(function(s) {
    return s.id === sa.t.rawViewSectionRef;
  })[0];
  var nommee = !!(v && v.name !== nomPage && P.nomParDefaut(v.name, [sa.t.tableId, raw && raw.title, sa.nom, nomCadeau, nomPage]));
  if (nommee) {
    await MGP.g.actions([["UpdateRecord", "_grist_Views", sa.vue, { name: nomPage }]]);
  }
  await MGP.g.ecrireReglage("page." + m.widget, { vue: sa.vue, depuis: null, nommee });
  var section = Object.keys(MGP.SECTIONS).filter(function(k) {
    return MGP.SECTIONS[k].widgets.indexOf(m.widget) >= 0;
  })[0] || null;
  var avant = MGP.g.CADEAU;
  MGP.g.CADEAU = { cle: m.widget, section, enTete: !section, nom: nomCadeau, page: nomPage };
  try {
    await MGP.g.rangerDansSection(sa.vue);
  } catch (e) {
    logSecurite("rangement de la page", e);
  } finally {
    MGP.g.CADEAU = avant;
  }
  var apres = (await MGP.g.lire("_grist_Views")).filter(function(x) {
    return x.id === sa.vue;
  })[0];
  return apres && apres.name || nomPage;
};
ACA.ajouterPage = async function(id) {
  try {
    var m = P.module(id);
    if (!m || !m.url) {
      return false;
    }
    var url = new URL("../" + m.url, location.href).href;
    if (!MGP.g.tech) {
      await MGP.g.creerTables([MGP.SOCLE.TECH]);
    }
    await MGP.g.chargerMeta();
    await MGP.g.chargerTech();
    var sa = await ACA.pageDeMission(m);
    if (sa) {
      return await ACA.placerSurSaPage(m, sa, url);
    }
    var tech = MGP.g.tableParId(MGP.g.tech);
    if (!tech) {
      return false;
    }
    var r = await MGP.g.actions([["CreateViewSection", tech.id, 0, "custom", null, null]]);
    var res = r.retValues[0] || {};
    if (!res.viewRef || !res.sectionRef) {
      return false;
    }
    var cv = { mode: "url", url, widgetDef: null, access: "full", pluginId: "", sectionId: "", renderAfterReady: false };
    await MGP.g.actions([["UpdateRecord", "_grist_Views", res.viewRef, { name: "🎁 " + (m.surprise && m.surprise.nom || m.titre || "Mon cadeau") }], ["UpdateRecord", "_grist_Views_section", res.sectionRef, { title: "🎁 " + (m.surprise && m.surprise.nom || m.titre || "Mon cadeau"), description: MGP.g.DESCRIPTION_ATTENTE, options: JSON.stringify({ customView: JSON.stringify(cv) }) }]]);
    return true;
  } catch (e) {
    logSecurite("ajout de page", e);
    return false;
  }
};
ACA.ouvrirBilan = function(titre, rendre) {
  var d = document.getElementById("dlg-bilan");
  document.getElementById("db-corps").innerHTML = '<h2 id="db-titre" tabindex="-1">' + echapperHTML(titre) + '</h2><div id="db-zone" style="margin-top:12px"></div><div class="pied"><button type="button" class="btn sec" data-fermer>Fermer</button></div>';
  MGP.ouvrir(d, "#db-titre");
  rendre(document.getElementById("db-zone"));
};
ACA.brancher = function() {
  MGP.brancherDialogues();
  document.getElementById("ac-niveaux").addEventListener("click", function(ev) {
    var b;
    if (b = ev.target.closest("[data-ac-carte]")) {
      var el = b.closest(".ac-carte");
      if (el.dataset.etat === "verrouillée") {
        ACA.secouer(b);
        return;
      }
      ACA.retourner(el, true);
      return;
    }
    if (b = ev.target.closest("[data-ac-retourner]")) {
      ACA.retourner(b.closest(".ac-carte"), false);
      return;
    }
    if (b = ev.target.closest("[data-ac-ouvrir]")) {
      ACA.ouvrirCarte(b.dataset.acId, b.dataset.acOuvrir);
      return;
    }
    if (b = ev.target.closest("[data-ac-placement]")) {
      var niv = b.dataset.acPlacement, n = P.niveauParcours(niv);
      ACA.ouvrirBilan("🚀 Test de placement : niveau " + n.nom, function(z) {
        P.placement(z, niv, { onFin: async function() {
          await ACA.charger();
          ACA.rendre();
        } });
      });
      return;
    }
    if (b = ev.target.closest("[data-ac-bilan]")) {
      var nv = b.dataset.acBilan || null;
      ACA.ouvrirBilan(P.titreBilan(nv), function(z) {
        P.bilan(z, { niveau: nv, onFin: async function() {
          await ACA.charger();
          ACA.rendre();
        } });
      });
    }
  });
  var dc = document.getElementById("dlg-carte");
  dc.addEventListener("click", async function(ev) {
    var b;
    if (b = ev.target.closest(".pc-nav [data-pc-vue]")) {
      ACA.vue(b.dataset.pcVue);
      return;
    }
    if (b = ev.target.closest("[data-ac-ajouter]")) {
      b.disabled = true;
      var ok2 = await ACA.ajouterPage(b.dataset.acAjouter);
      MGP.annoncer(typeof ok2 === "string" ? "Cadeau ajouté sur votre page « " + ok2 + " », à côté de votre table : ouvrez-la dans le menu de gauche" : ok2 ? "Page ajoutée : ouvrez-la dans le menu de gauche" : "Ajout impossible : vérifiez que l’Académie a l’accès complet", ok2 ? "ok" : "err");
      if (!ok2) {
        b.disabled = false;
      }
      return;
    }
    if (ev.target.closest("[data-ac-copier]")) {
      try {
        await navigator.clipboard.writeText(document.getElementById("ac-url").textContent);
        MGP.annoncer("Adresse copiée", "ok");
      } catch (e) {
        logSecurite("presse-papiers", e);
        MGP.annoncer("Copie impossible ici : sélectionnez l’adresse à la main.", "err");
      }
      return;
    }
    if (b = ev.target.closest("[data-ac-terminer]")) {
      var ok = await P.enregistrer("Module", b.dataset.acTerminer, { MISSION: "Passée", MISSION_POINTS: 0, MISSION_LE: P.maintenantSec(), COMPETENCE: P.nomCompetence(P.cfg.contenu), NIVEAU: P.cfg.contenu.niveau });
      MGP.annoncer(ok ? "Carte terminée : la suivante s’ouvre" : "Non enregistré : accès complet nécessaire", ok ? "ok" : "err");
      if (ok) {
        MGP.fermer(dc);
      }
      return;
    }
    if (ev.target.closest("#pc-vue")) {
      P.clicEcran(ev);
    }
  });
  var fin = async function(dlg) {
    var id = dlg.id === "dlg-carte" && P.cfg ? P.cfg.module : null;
    await ACA.charger();
    ACA.rendre();
    var el = id && document.querySelector('.ac-carte[data-id="' + id + '"]');
    if (el && !el.classList.contains("retournee")) {
      ACA.retourner(el, true);
    }
    var cible = el ? el.querySelector("[data-ac-ouvrir]") : null;
    if (cible) {
      setTimeout(function() {
        cible.focus({ preventScroll: true });
      }, 40);
    }
  };
  dc.addEventListener("close", function() {
    fin(dc);
  });
  document.getElementById("dlg-bilan").addEventListener("close", function() {
    fin(document.getElementById("dlg-bilan"));
  });
};
ACA.NOM_PAGE = "🎓 Académie Grist";
ACA.sectionAcademie = async function() {
  var s = MGP.g.sectionCourante ? await MGP.g.sectionCourante() : null;
  if (s) {
    return s;
  }
  var vues = (await MGP.g.lire("_grist_Views")).map(function(v) {
    return v.id;
  });
  var l = (await MGP.g.lire("_grist_Views_section")).filter(function(x) {
    return x.parentKey === "custom" && vues.indexOf(x.parentId) >= 0 && /\/academie$/.test(MGP.g.normaliserUrl(MGP.g.urlSection(x)));
  });
  var pages = l.map(function(x) {
    return x.parentId;
  }).filter(function(v, i, t) {
    return t.indexOf(v) === i;
  });
  return pages.length === 1 ? l[0] : null;
};
ACA.nommerPage = async function() {
  if (ACA.lectureSeule) {
    return false;
  }
  try {
    var s = await ACA.sectionAcademie();
    if (!s) {
      return false;
    }
    await MGP.g.chargerMeta();
    var v = (await MGP.g.lire("_grist_Views")).filter(function(x) {
      return x.id === s.parentId;
    })[0];
    if (!v) {
      return false;
    }
    var sections = await MGP.g.lire("_grist_Views_section"), noms = ["Table1"];
    [MGP.g.tech, s.tableRef].forEach(function(x) {
      var t = typeof x === "number" ? MGP.g.meta.tables.filter(function(y) {
        return y.id === x;
      })[0] : MGP.g.tableParId(x);
      if (!t) {
        return;
      }
      noms.push(t.tableId);
      var raw = sections.filter(function(y) {
        return y.id === t.rawViewSectionRef;
      })[0];
      if (raw && raw.title) {
        noms.push(raw.title);
      }
    });
    var a = [];
    if (v.name !== ACA.NOM_PAGE && P.nomParDefaut(v.name, noms)) {
      a.push(["UpdateRecord", "_grist_Views", v.id, { name: ACA.NOM_PAGE }]);
    }
    var d = MGP.g.actionDecrireSection ? MGP.g.actionDecrireSection(s, ACA.NOM_PAGE, "L’Académie Grist de Mon Grist perso : 26 cartes pour apprendre Grist, une notion à la fois, avec une mission, un quiz et une surprise.") : s.title ? null : ["UpdateRecord", "_grist_Views_section", s.id, { title: ACA.NOM_PAGE }];
    if (d) {
      a.push(d);
    }
    if (a.length) {
      await MGP.g.actions(a);
    }
    return a.length > 0;
  } catch (e) {
    logSecurite("nom de la page de l’Académie", e);
    return false;
  }
};
ACA.demarrer = async function() {
  ACA.brancher();
  var acces = await MGP.g.demarrer("full");
  ACA.lectureSeule = acces !== "full";
  if (!ACA.lectureSeule) {
    try {
      await MGP.g.chargerMeta();
      await MGP.g.chargerTech();
    } catch (e) {
      logSecurite("réglages", e);
    }
    await ACA.nommerPage();
  }
  await ACA.charger();
  ACA.rendre();
  masquerLoader();
};
window.ACA = ACA;
ACA.demarrer();</script>
