<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>w</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>:root {
  --sable: #FFF8F0;
  --sable2: #FBEFE3;
  --encre: #2B2D42;
  --gris: #6B6F80;
  --trait: #EADFD3;
  --blanc: #FFFFFF;
  --ecume: #A8E6E2;
  --ecume-f: #1F7F7A;
  --flamant: #FFC2D1;
  --flamant-f: #C2406A;
  --citron: #FFF1A8;
  --citron-f: #8A6D00;
  --peche: #FFD3B5;
  --peche-f: #C25A2C;
  --lavande: #DCD0F7;
  --lavande-f: #6A4FB8;
  --menthe: #CDEDC8;
  --menthe-f: #3D7F44;
  --coucher:
    linear-gradient(
      120deg,
      var(--peche),
      var(--flamant) 48%,
      var(--lavande));
  --ombre: 0 3px 14px rgba(43, 45, 66, .08);
  --ombre-forte: 0 12px 32px rgba(43, 45, 66, .18);
  --voile: rgba(43, 45, 66, .38);
  --r-s: 16px;
  --r-m: 20px;
  --r-l: 24px;
  --r-xl: 28px;
  --police:
    "Avenir Next",
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
  --mono:
    ui-monospace,
    "SF Mono",
    Menlo,
    Consolas,
    monospace;
  --focus: 3px solid var(--lavande-f);
  --fab: 60px;
  --fab-bas: 22px;
  --fab-reserve: calc(var(--fab) + var(--fab-bas) + 28px + env(safe-area-inset-bottom, 0px));
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
}
body {
  background: var(--sable);
  color: var(--encre);
  font-family: var(--police);
  font-size: 15px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
h1,
h2,
h3 {
  margin: 0;
  line-height: 1.2;
  letter-spacing: -.3px;
}
p {
  margin: 0;
}
a {
  color: var(--ecume-f);
}
button,
input,
select,
textarea {
  font-family: inherit;
  font-size: 15px;
  color: var(--encre);
}
:focus-visible {
  outline: var(--focus);
  outline-offset: 2px;
}
.cache,
[hidden],
.btn[hidden],
.fab[hidden],
.pil[hidden],
.btn-icone[hidden],
.bandeau[hidden],
.choix[hidden],
.carte[hidden] {
  display: none;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.mini {
  font-size: 13px;
  color: var(--gris);
}
.gras {
  font-weight: 700;
}
.loader {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  place-items: center;
  background: var(--sable);
  color: var(--gris);
}
.loader.actif {
  display: grid;
}
.loader .rond {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 4px solid var(--sable2);
  border-top-color: var(--ecume-f);
  animation: tourne .9s linear infinite;
  margin: 0 auto 10px;
}
@keyframes tourne {
  to {
    transform: rotate(360deg);
  }
}
.page {
  padding: 16px 16px var(--fab-reserve);
  width: 100%;
}
.lisible {
  max-width: 75ch;
}
.barre {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.barre .titre {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}
.barre h1 {
  font-size: 22px;
  font-weight: 800;
}
.barre .marque {
  font-size: 13px;
  color: var(--gris);
  font-weight: 600;
}
.barre .actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.grille {
  display: grid;
  gap: 14px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 700px) {
  .page {
    padding: 20px 20px var(--fab-reserve);
  }
  .grille.g2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1100px) {
  .page {
    padding: 24px 24px var(--fab-reserve);
  }
  .grille.g3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
@media (min-width: 1500px) {
  .grille.g2 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grille.g3 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
@media (min-width: 1850px) {
  .grille.g3 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .grille.g3,
  .grille.g4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.carte {
  background: var(--blanc);
  border-radius: var(--r-m);
  box-shadow: var(--ombre);
  padding: 16px;
  min-width: 0;
}
.carte.douce {
  background: var(--sable2);
  box-shadow: none;
}
.carte h2 {
  font-size: 17px;
  font-weight: 800;
}
.hero {
  background: var(--coucher);
  border-radius: var(--r-l);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  color: var(--encre);
}
.hero h2 {
  font-size: 20px;
  font-weight: 800;
}
.hero p {
  color: #4a4458;
  font-size: 14px;
  margin-top: 4px;
}
.btn {
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  padding: 10px 20px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--ecume-f);
  color: var(--blanc);
  text-decoration: none;
}
.btn:hover {
  filter: brightness(1.06);
}
.btn.sec {
  background: var(--blanc);
  color: var(--ecume-f);
  box-shadow: inset 0 0 0 1.5px var(--ecume-f);
}
.btn.doux {
  background: var(--sable2);
  color: var(--encre);
}
.btn.danger {
  background: var(--flamant-f);
  color: var(--blanc);
}
.btn.lien {
  background: transparent;
  color: var(--ecume-f);
  padding: 10px 12px;
}
.btn.plein {
  width: 100%;
}
.btn[disabled] {
  opacity: .55;
  cursor: not-allowed;
}
.btn-icone {
  min-width: 44px;
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  background: var(--sable2);
  color: var(--encre);
  cursor: pointer;
  display: inline-grid;
  place-items: center;
  font-size: 17px;
  padding: 0 10px;
}
.pil {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  border: 0;
  background: var(--sable2);
  color: var(--encre);
}
button.pil {
  min-height: 44px;
  padding: 6px 14px;
  cursor: pointer;
}
.t-ecume {
  background: var(--ecume);
  color: var(--ecume-f);
}
.t-flamant {
  background: var(--flamant);
  color: var(--flamant-f);
}
.t-citron {
  background: var(--citron);
  color: var(--citron-f);
}
.t-peche {
  background: var(--peche);
  color: var(--peche-f);
}
.t-lavande {
  background: var(--lavande);
  color: var(--lavande-f);
}
.t-menthe {
  background: var(--menthe);
  color: var(--menthe-f);
}
.t-sable {
  background: var(--sable2);
  color: var(--gris);
}
.choix {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.choix button {
  min-height: 44px;
  min-width: 48px;
  border: 0;
  border-radius: 999px;
  padding: 0 16px;
  font-weight: 700;
  background: var(--sable2);
  color: var(--gris);
  cursor: pointer;
}
.choix button[aria-pressed=true] {
  background: var(--ecume-f);
  color: var(--blanc);
}
.onglets {
  position: relative;
  display: flex;
  gap: 4px;
  background: var(--blanc);
  border-radius: 999px;
  padding: 5px;
  box-shadow: var(--ombre);
  overflow-x: auto;
  margin-bottom: 16px;
  max-width: 100%;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  scroll-padding: 0 36px;
  -webkit-overflow-scrolling: touch;
}
.onglets::-webkit-scrollbar {
  display: none;
}
.onglets button {
  flex: none;
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  padding: 0 16px;
  background: transparent;
  color: var(--gris);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  scroll-snap-align: start;
}
.onglets-cadre {
  position: relative;
  margin-bottom: 16px;
}
.onglets-cadre > .onglets {
  margin-bottom: 0;
}
.onglets-cadre:before,
.onglets-cadre:after {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 46px;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  display: grid;
  align-items: center;
  color: var(--ecume-f);
  font-weight: 800;
  font-size: 22px;
}
.onglets-cadre:before {
  content: "‹";
  left: 0;
  justify-items: start;
  padding-left: 10px;
  border-radius: 999px 0 0 999px;
  background:
    linear-gradient(
      90deg,
      var(--blanc) 45%,
      rgba(255, 255, 255, 0));
}
.onglets-cadre:after {
  content: "›";
  right: 0;
  justify-items: end;
  padding-right: 10px;
  border-radius: 0 999px 999px 0;
  background:
    linear-gradient(
      270deg,
      var(--blanc) 45%,
      rgba(255, 255, 255, 0));
}
.onglets-cadre.g:before,
.onglets-cadre.d:after {
  opacity: 1;
}
.onglets button[aria-selected=true] {
  background: var(--ecume-f);
  color: var(--blanc);
}
@media (max-width: 520px) {
  .onglets button {
    padding: 0 12px;
  }
}
.jauge {
  height: 10px;
  border-radius: 999px;
  background: var(--sable2);
  overflow: hidden;
}
.jauge > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background:
    linear-gradient(
      90deg,
      var(--menthe-f),
      var(--ecume-f));
}
.jauge.alerte > i {
  background:
    linear-gradient(
      90deg,
      var(--peche-f),
      var(--flamant-f));
}
.lignes-jauge {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.lignes-jauge .jauge {
  flex: 1;
  min-width: 120px;
}
.champ {
  margin-bottom: 14px;
}
.champ > label,
.champ > .lib {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}
.champ input[type=text],
.champ input[type=number],
.champ input[type=date],
.champ input[type=url],
.champ select,
.champ textarea {
  width: 100%;
  min-height: 46px;
  border-radius: 14px;
  border: 0;
  background: var(--sable);
  box-shadow: inset 0 0 0 1.5px var(--trait);
  padding: 10px 14px;
}
.champ textarea {
  min-height: 80px;
  resize: vertical;
}
.champ input:focus-visible,
.champ select:focus-visible,
.champ textarea:focus-visible {
  box-shadow: inset 0 0 0 2px var(--ecume-f);
}
.champ .aide {
  font-size: 13px;
  color: var(--gris);
  margin-top: 4px;
}
.champ > label.photo-btn,
.photo-btn {
  display: flex;
  margin-bottom: 0;
  font-size: 15px;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  border-radius: 14px;
  background: var(--sable);
  box-shadow: inset 0 0 0 1.5px var(--trait);
  padding: 0 14px;
  color: var(--ecume-f);
  font-weight: 700;
  cursor: pointer;
}
.photo-btn input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.photo-btn:focus-within {
  outline: var(--focus);
  outline-offset: 2px;
}
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--fab-bas) + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  width: var(--fab);
  height: var(--fab);
  border-radius: 50%;
  border: 0;
  background: var(--ecume-f);
  color: var(--blanc);
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 8px 20px #1f7f7a66;
  display: grid;
  place-items: center;
}
dialog.feuille {
  border: 0;
  padding: 0;
  background: var(--blanc);
  color: var(--encre);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 40px);
  border-radius: var(--r-xl);
  box-shadow: var(--ombre-forte);
}
dialog.feuille::backdrop {
  background: var(--voile);
}
dialog.feuille .corps {
  padding: 12px 20px 22px;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
}
dialog.feuille > .fermer-x {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 3;
  background: var(--sable2);
}
dialog.feuille h2 {
  padding-right: 48px;
}
dialog.feuille .poignee {
  width: 44px;
  height: 5px;
  border-radius: 999px;
  background: var(--trait);
  margin: 10px auto 6px;
}
dialog.feuille h2 {
  font-size: 19px;
  font-weight: 800;
  margin: 4px 0 14px;
}
dialog.feuille .pied {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 10px;
}
@media (max-width: 699px) {
  dialog.feuille {
    width: 100vw;
    max-width: 100vw;
    margin: auto 0 0;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    max-height: 92vh;
  }
  dialog.feuille .corps {
    max-height: calc(92vh - 24px);
  }
  dialog.feuille .pied .btn {
    flex: 1;
  }
}
@media (min-width: 700px) {
  dialog.feuille .poignee {
    display: none;
  }
}
.toasts {
  position: fixed;
  left: 50%;
  transform: translate(-50%);
  bottom: 96px;
  z-index: 95;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(440px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  background: var(--encre);
  color: var(--blanc);
  border-radius: var(--r-s);
  padding: 12px 16px;
  font-weight: 600;
  box-shadow: var(--ombre-forte);
}
.toast.ok {
  background: var(--menthe-f);
}
.toast.err {
  background: var(--flamant-f);
}
.bandeau {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-radius: var(--r-m);
  padding: 12px 16px;
  margin-bottom: 14px;
}
.bandeau .txt {
  flex: 1;
  min-width: 200px;
}
.vide {
  text-align: center;
  padding: 28px 16px;
  color: var(--gris);
}
.vide .gros {
  font-size: 40px;
}
.av {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
}
.av.grand {
  width: 84px;
  height: 84px;
  font-size: 40px;
}
.ligne {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--sable2);
  min-width: 0;
}
.ligne .x {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.capot-grille {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 1800px) {
  .capot-grille {
    grid-template-columns: minmax(880px, 1.1fr) minmax(0, 1fr);
    align-items: start;
  }
}
.schema-svg {
  width: 100%;
  max-width: 880px;
  height: auto;
  display: block;
}
.schema-svg .boite-fond {
  fill: var(--blanc);
  stroke: var(--trait);
  stroke-width: 2;
}
.schema-svg text {
  font-family: var(--police);
  font-size: 13px;
  fill: var(--encre);
}
.schema-svg .type {
  fill: var(--gris);
  font-size: 12px;
}
.schema-svg .ent {
  font-weight: 800;
  font-size: 14px;
}
.schema-svg .champ-l {
  cursor: pointer;
}
.schema-svg .champ-l:focus-visible rect.surv,
.schema-svg .champ-l:hover rect.surv {
  fill: var(--sable2);
  stroke: var(--lavande-f);
  stroke-width: 2;
}
.schema-svg .lien {
  fill: none;
  stroke: var(--ecume-f);
  stroke-width: 2.5;
}
.schema-svg .lien-txt {
  fill: var(--gris);
  font-size: 11px;
}
.schema-mobile details {
  border-radius: var(--r-s);
  background: var(--sable);
  margin-bottom: 10px;
}
.schema-mobile summary {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-weight: 800;
  cursor: pointer;
  border-radius: var(--r-s);
}
.schema-mobile ul {
  list-style: none;
  margin: 0;
  padding: 0 14px 10px;
}
.schema-mobile li button {
  width: 100%;
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  border: 0;
  background: transparent;
  border-top: 1px solid var(--trait);
  padding: 6px 0;
  text-align: left;
  cursor: pointer;
}
.schema-mobile .fleche {
  color: var(--ecume-f);
  font-size: 13px;
  font-weight: 700;
}
.vue-bureau {
  display: none;
}
@media (min-width: 1100px) {
  .vue-bureau {
    display: block;
  }
  .vue-mobile {
    display: none;
  }
}
.fiche-champ {
  border-radius: var(--r-s);
  padding: 14px;
  background: var(--sable);
}
.fiche-champ h3 {
  font-size: 15px;
  font-weight: 800;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.fiche-champ .ex {
  margin-top: 8px;
  font-size: 13px;
}
.fiche-champ.active {
  box-shadow: inset 0 0 0 2px var(--lavande-f);
}
pre.code {
  background: var(--encre);
  color: #fff1a8;
  border-radius: var(--r-s);
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 10px 0;
}
code {
  font-family: var(--mono);
  font-size: .92em;
  background: var(--sable2);
  border-radius: 6px;
  padding: 1px 5px;
  overflow-wrap: anywhere;
}
.jeton {
  display: grid;
  grid-template-columns: minmax(90px, 150px) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 10px 0;
  border-bottom: 1px solid var(--sable2);
}
.jeton .j {
  background: var(--citron);
  color: var(--citron-f);
  border-radius: 999px;
  padding: 4px 12px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.a-vous {
  background: var(--citron);
  border-radius: var(--r-s);
  padding: 14px 16px;
  margin-top: 12px;
}
.a-vous b {
  color: var(--citron-f);
}
.formule-carte + .formule-carte {
  margin-top: 14px;
}
.kanban {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(var(--kb-cols, 4), minmax(0, 1fr));
  align-items: start;
}
.kb-col {
  background: var(--sable2);
  border-radius: var(--r-m);
  padding: 10px;
  min-height: 140px;

};
ACA.surpriseHTML = function(m) {
  var s = m.surprise || {}, inst = m.widget && P.installes[m.widget], url = m.url ? new URL("../" + m.url, location.href).href : "";
  var h = '<section class="ac-surprise"><h2>' + (ACA.ICONES[s.genre] || "🎁") + " " + echapperHTML(s.nom || "La surprise") + '</h2><p class="mini" style="color:var(--encre)">' + echapperHTML(ACA.LIB_SURPRISE[s.genre] || "") + "</p>";
  if (s.texte) {
    h += '<p style="margin-top:6px">' + MGP.texteRiche(s.texte) + "</p>";
  }
  if (inst) {
    h += '<p style="margin-top:8px"><b>✅ Installé</b> : retrouvez-le sur sa page, dans le menu de gauche.</p>';
  } else if (url) {
    h += (ACA.lectureSeule ? "" : '<div class="pc-pied" style="justify-content:flex-end"><button type="button" class="btn" data-ac-ajouter="' + echapperHTML(m.id) + '">🎁 Ajouter la page de mon cadeau</button></div>') + '<p style="margin-top:8px">Ou à la main : ajoutez une page avec un widget personnalisé (« Ajouter un widget à la page », puis « Personnalisé »), donnez-lui l’accès complet et collez cette adresse :</p><div class="ac-url"><code id="ac-url">' + echapperHTML(url) + '</code><button type="button" class="btn sec" data-ac-copier>Copier l’adresse</button></div><p class="mini" style="margin-top:8px;color:var(--encre)">Dans le widget, deux façons de l’ouvrir : « Je le construis » (la mission) ou « Installe pour moi ».</p>';
  } else if (s.genre !== "astuce" || !s.texte) {
    h += '<p style="margin-top:8px">Cette surprise arrive bientôt.</p>';
  }
  return h + "</section>";
};
ACA.ajouterPage = async function(id) {
  try {
    var m = P.module(id);
    if (!m || !m.url) {
      return false;
    }
    var url = new URL("../" + m.url, location.href).href;
    if (!MGP.g.tech) {
      await MGP.g.creerTables([MGP.SOCLE.TECH]);
    }
    await MGP.g.chargerMeta();
    var tech = MGP.g.tableParId(MGP.g.tech);
    if (!tech) {
      return false;
    }
    var r = await MGP.g.actions([["CreateViewSection", tech.id, 0, "custom", null, null]]);
    var res = r.retValues[0] || {};
    if (!res.viewRef || !res.sectionRef) {
      return false;
    }
    var cv = { mode: "url", url, widgetDef: null, access: "full", pluginId: "", sectionId: "", renderAfterReady: false };
    await MGP.g.actions([["UpdateRecord", "_grist_Views", res.viewRef, { name: "🎁 " + (m.surprise && m.surprise.nom || m.titre || "Mon cadeau") }], ["UpdateRecord", "_grist_Views_section", res.sectionRef, { title: "", options: JSON.stringify({ customView: JSON.stringify(cv) }) }]]);
    return true;
  } catch (e) {
    logSecurite("ajout de page", e);
    return false;
  }
};
ACA.ouvrirBilan = function(titre, rendre) {
  var d = document.getElementById("dlg-bilan");
  document.getElementById("db-corps").innerHTML = '<h2 id="db-titre" tabindex="-1">' + echapperHTML(titre) + '</h2><div id="db-zone" style="margin-top:12px"></div><div class="pied"><button type="button" class="btn sec" data-fermer>Fermer</button></div>';
  MGP.ouvrir(d, "#db-titre");
  rendre(document.getElementById("db-zone"));
};
ACA.brancher = function() {
  MGP.brancherDialogues();
  document.getElementById("ac-niveaux").addEventListener("click", function(ev) {
    var b;
    if (b = ev.target.closest("[data-ac-carte]")) {
      var el = b.closest(".ac-carte");
      if (el.dataset.etat === "verrouillée") {
        ACA.secouer(b);
        return;
      }
      ACA.retourner(el, true);
      return;
    }
    if (b = ev.target.closest("[data-ac-retourner]")) {
      ACA.retourner(b.closest(".ac-carte"), false);
      return;
    }
    if (b = ev.target.closest("[data-ac-ouvrir]")) {
      ACA.ouvrirCarte(b.dataset.acId, b.dataset.acOuvrir);
      return;
    }
    if (b = ev.target.closest("[data-ac-placement]")) {
      var niv = b.dataset.acPlacement, n = P.niveauParcours(niv);
      ACA.ouvrirBilan("🚀 Test de placement : niveau " + n.nom, function(z) {
        P.placement(z, niv, { onFin: async function() {
          await ACA.charger();
          ACA.rendre();
        } });
      });
      return;
    }
    if (b = ev.target.closest("[data-ac-bilan]")) {
      var nv = b.dataset.acBilan || null;
      ACA.ouvrirBilan(P.titreBilan(nv), function(z) {
        P.bilan(z, { niveau: nv, onFin: async function() {
          await ACA.charger();
          ACA.rendre();
        } });
      });
    }
  });
  var dc = document.getElementById("dlg-carte");
  dc.addEventListener("click", async function(ev) {
    var b;
    if (b = ev.target.closest(".pc-nav [data-pc-vue]")) {
      ACA.vue(b.dataset.pcVue);
      return;
    }
    if (b = ev.target.closest("[data-ac-ajouter]")) {
      b.disabled = true;
      var ok2 = await ACA.ajouterPage(b.dataset.acAjouter);
      MGP.annoncer(ok2 ? "Page ajoutée : ouvrez-la dans le menu de gauche" : "Ajout impossible : vérifiez que l’Académie a l’accès complet", ok2 ? "ok" : "err");
      if (!ok2) {
        b.disabled = false;
      }
      return;
    }
    if (ev.target.closest("[data-ac-copier]")) {
      try {
        await navigator.clipboard.writeText(document.getElementById("ac-url").textContent);
        MGP.annoncer("Adresse copiée", "ok");
      } catch (e) {
        logSecurite("presse-papiers", e);
        MGP.annoncer("Copie impossible ici : sélectionnez l’adresse à la main.", "err");
      }
      return;
    }
    if (b = ev.target.closest("[data-ac-terminer]")) {
      var ok = await P.enregistrer("Module", b.dataset.acTerminer, { MISSION: "Passée", MISSION_POINTS: 0, MISSION_LE: P.maintenantSec(), COMPETENCE: P.nomCompetence(P.cfg.contenu), NIVEAU: P.cfg.contenu.niveau });
      MGP.annoncer(ok ? "Carte terminée : la suivante s’ouvre" : "Non enregistré : accès complet nécessaire", ok ? "ok" : "err");
      if (ok) {
        MGP.fermer(dc);
      }
      return;
    }
    if (ev.target.closest("#pc-vue")) {
      P.clicEcran(ev);
    }
  });
  var fin = async function(dlg) {
    var id = dlg.id === "dlg-carte" && P.cfg ? P.cfg.module : null;
    await ACA.charger();
    ACA.rendre();
    var el = id && document.querySelector('.ac-carte[data-id="' + id + '"]');
    if (el && !el.classList.contains("retournee")) {
      ACA.retourner(el, true);
    }
    var cible = el ? el.querySelector("[data-ac-ouvrir]") : null;
    if (cible) {
      setTimeout(function() {
        cible.focus({ preventScroll: true });
      }, 40);
    }
  };
  dc.addEventListener("close", function() {
    fin(dc);
  });
  document.getElementById("dlg-bilan").addEventListener("close", function() {
    fin(document.getElementById("dlg-bilan"));
  });
  document.getElementById("btn-fete").addEventListener("click", async function() {
    ACA.appliquerFete(!ACA.fete);
    if (!ACA.lectureSeule) {
      try {
        if (!MGP.g.tech) {
          await MGP.g.creerTables([MGP.SOCLE.TECH]);
        }
        await MGP.g.ecrireReglage("ACADEMIE:FETE", ACA.fete);
      } catch (e) {
        logSecurite("réglage", e);
      }
    }
  });
};
ACA.appliquerFete = function(on) {
  ACA.fete = !!on;
  var page = document.getElementById("ac-page");
  page.classList.toggle("noel", ACA.fete);
  document.body.classList.toggle("noel-fond", ACA.fete);
  if (ACA.fete) {
    MGP.noel.decorer(page);
  } else {
    page.querySelectorAll(":scope > .guirlande, :scope > .flocons, :scope > .sapin").forEach(function(x) {
      x.remove();
    });
  }
  document.getElementById("btn-fete").setAttribute("aria-pressed", ACA.fete ? "true" : "false");
};
ACA.demarrer = async function() {
  ACA.brancher();
  var acces = await MGP.g.demarrer("full");
  ACA.lectureSeule = acces !== "full";
  if (!ACA.lectureSeule) {
    try {
      await MGP.g.chargerMeta();
      await MGP.g.chargerTech();
      ACA.appliquerFete(!!MGP.g.reglage("ACADEMIE:FETE", false));
    } catch (e) {
      logSecurite("réglages", e);
    }
  }
  await ACA.charger();
  ACA.rendre();
  masquerLoader();
};
window.ACA = ACA;
ACA.demarrer();</script>
