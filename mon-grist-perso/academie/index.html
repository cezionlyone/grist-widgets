<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>w</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>:root {
  --sable: #FFF8F0;
  --sable2: #FBEFE3;
  --encre: #2B2D42;
  --gris: #6B6F80;
  --trait: #EADFD3;
  --blanc: #FFFFFF;
  --ecume: #A8E6E2;
  --ecume-f: #1F7F7A;
  --flamant: #FFC2D1;
  --flamant-f: #C2406A;
  --citron: #FFF1A8;
  --citron-f: #8A6D00;
  --peche: #FFD3B5;
  --peche-f: #C25A2C;
  --lavande: #DCD0F7;
  --lavande-f: #6A4FB8;
  --menthe: #CDEDC8;
  --menthe-f: #3D7F44;
  --coucher:
    linear-gradient(
      120deg,
      var(--peche),
      var(--flamant) 48%,
      var(--lavande));
  --ombre: 0 3px 14px rgba(43, 45, 66, .08);
  --ombre-forte: 0 12px 32px rgba(43, 45, 66, .18);
  --voile: rgba(43, 45, 66, .38);
  --r-s: 16px;
  --r-m: 20px;
  --r-l: 24px;
  --r-xl: 28px;
  --police:
    "Avenir Next",
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
  --mono:
    ui-monospace,
    "SF Mono",
    Menlo,
    Consolas,
    monospace;
  --focus: 3px solid var(--lavande-f);
  --fab: 60px;
  --fab-bas: 22px;
  --fab-reserve: calc(var(--fab) + var(--fab-bas) + 28px + env(safe-area-inset-bottom, 0px));
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
}
body {
  background: var(--sable);
  color: var(--encre);
  font-family: var(--police);
  font-size: 15px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
h1,
h2,
h3 {
  margin: 0;
  line-height: 1.2;
  letter-spacing: -.3px;
}
p {
  margin: 0;
}
a {
  color: var(--ecume-f);
}
button,
input,
select,
textarea {
  font-family: inherit;
  font-size: 15px;
  color: var(--encre);
}
:focus-visible {
  outline: var(--focus);
  outline-offset: 2px;
}
.cache,
[hidden],
.btn[hidden],
.fab[hidden],
.pil[hidden],
.btn-icone[hidden],
.bandeau[hidden],
.choix[hidden],
.carte[hidden] {
  display: none;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.mini {
  font-size: 13px;
  color: var(--gris);
}
.gras {
  font-weight: 700;
}
.loader {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  place-items: center;
  background: var(--sable);
  color: var(--gris);
}
.loader.actif {
  display: grid;
}
.loader .rond {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 4px solid var(--sable2);
  border-top-color: var(--ecume-f);
  animation: tourne .9s linear infinite;
  margin: 0 auto 10px;
}
@keyframes tourne {
  to {
    transform: rotate(360deg);
  }
}
.page {
  padding: 16px 16px var(--fab-reserve);
  width: 100%;
}
.lisible {
  max-width: 75ch;
}
.barre {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.barre .titre {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}
.barre h1 {
  font-size: 22px;
  font-weight: 800;
}
.barre .marque {
  font-size: 13px;
  color: var(--gris);
  font-weight: 600;
}
.barre .actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.grille {
  display: grid;
  gap: 14px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 700px) {
  .page {
    padding: 20px 20px var(--fab-reserve);
  }
  .grille.g2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1100px) {
  .page {
    padding: 24px 24px var(--fab-reserve);
  }
  .grille.g3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
@media (min-width: 1500px) {
  .grille.g2 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .grille.g3 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
@media (min-width: 1850px) {
  .grille.g3 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .grille.g4 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .grille.g3,
  .grille.g4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.carte {
  background: var(--blanc);
  border-radius: var(--r-m);
  box-shadow: var(--ombre);
  padding: 16px;
  min-width: 0;
}
.carte.douce {
  background: var(--sable2);
  box-shadow: none;
}
.carte h2 {
  font-size: 17px;
  font-weight: 800;
}
.hero {
  background: var(--coucher);
  border-radius: var(--r-l);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  color: var(--encre);
}
.hero h2 {
  font-size: 20px;
  font-weight: 800;
}
.hero p {
  color: #4a4458;
  font-size: 14px;
  margin-top: 4px;
}
.btn {
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  padding: 10px 20px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--ecume-f);
  color: var(--blanc);
  text-decoration: none;
}
.btn:hover {
  filter: brightness(1.06);
}
.btn.sec {
  background: var(--blanc);
  color: var(--ecume-f);
  box-shadow: inset 0 0 0 1.5px var(--ecume-f);
}
.btn.doux {
  background: var(--sable2);
  color: var(--encre);
}
.btn.danger {
  background: var(--flamant-f);
  color: var(--blanc);
}
.btn.lien {
  background: transparent;
  color: var(--ecume-f);
  padding: 10px 12px;
}
.btn.plein {
  width: 100%;
}
.btn[disabled] {
  opacity: .55;
  cursor: not-allowed;
}
.btn-icone {
  min-width: 44px;
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  background: var(--sable2);
  color: var(--encre);
  cursor: pointer;
  display: inline-grid;
  place-items: center;
  font-size: 17px;
  padding: 0 10px;
}
.pil {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  border: 0;
  background: var(--sable2);
  color: var(--encre);
}
button.pil {
  min-height: 44px;
  padding: 6px 14px;
  cursor: pointer;
}
.t-ecume {
  background: var(--ecume);
  color: var(--ecume-f);
}
.t-flamant {
  background: var(--flamant);
  color: var(--flamant-f);
}
.t-citron {
  background: var(--citron);
  color: var(--citron-f);
}
.t-peche {
  background: var(--peche);
  color: var(--peche-f);
}
.t-lavande {
  background: var(--lavande);
  color: var(--lavande-f);
}
.t-menthe {
  background: var(--menthe);
  color: var(--menthe-f);
}
.t-sable {
  background: var(--sable2);
  color: var(--gris);
}
.choix {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.choix button {
  min-height: 44px;
  min-width: 48px;
  border: 0;
  border-radius: 999px;
  padding: 0 16px;
  font-weight: 700;
  background: var(--sable2);
  color: var(--gris);
  cursor: pointer;
}
.choix button[aria-pressed=true] {
  background: var(--ecume-f);
  color: var(--blanc);
}
.onglets {
  position: relative;
  display: flex;
  gap: 4px;
  background: var(--blanc);
  border-radius: 999px;
  padding: 5px;
  box-shadow: var(--ombre);
  overflow-x: auto;
  margin-bottom: 16px;
  max-width: 100%;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
  scroll-padding: 0 36px;
  -webkit-overflow-scrolling: touch;
}
.onglets::-webkit-scrollbar {
  display: none;
}
.onglets button {
  flex: none;
  min-height: 44px;
  border: 0;
  border-radius: 999px;
  padding: 0 16px;
  background: transparent;
  color: var(--gris);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  scroll-snap-align: start;
}
.onglets-cadre {
  position: relative;
  margin-bottom: 16px;
}
.onglets-cadre > .onglets {
  margin-bottom: 0;
}
.onglets-cadre:before,
.onglets-cadre:after {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 46px;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  display: grid;
  align-items: center;
  color: var(--ecume-f);
  font-weight: 800;
  font-size: 22px;
}
.onglets-cadre:before {
  content: "‹";
  left: 0;
  justify-items: start;
  padding-left: 10px;
  border-radius: 999px 0 0 999px;
  background:
    linear-gradient(
      90deg,
      var(--blanc) 45%,
      rgba(255, 255, 255, 0));
}
.onglets-cadre:after {
  content: "›";
  right: 0;
  justify-items: end;
  padding-right: 10px;
  border-radius: 0 999px 999px 0;
  background:
    linear-gradient(
      270deg,
      var(--blanc) 45%,
      rgba(255, 255, 255, 0));
}
.onglets-cadre.g:before,
.onglets-cadre.d:after {
  opacity: 1;
}
.onglets button[aria-selected=true] {
  background: var(--ecume-f);
  color: var(--blanc);
}
@media (max-width: 520px) {
  .onglets button {
    padding: 0 12px;
  }
}
.jauge {
  height: 10px;
  border-radius: 999px;
  background: var(--sable2);
  overflow: hidden;
}
.jauge > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background:
    linear-gradient(
      90deg,
      var(--menthe-f),
      var(--ecume-f));
}
.jauge.alerte > i {
  background:
    linear-gradient(
      90deg,
      var(--peche-f),
      var(--flamant-f));
}
.lignes-jauge {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.lignes-jauge .jauge {
  flex: 1;
  min-width: 120px;
}
.champ {
  margin-bottom: 14px;
}
.champ > label,
.champ > .lib {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}
.champ input[type=text],
.champ input[type=number],
.champ input[type=date],
.champ input[type=url],
.champ select,
.champ textarea {
  width: 100%;
  min-height: 46px;
  border-radius: 14px;
  border: 0;
  background: var(--sable);
  box-shadow: inset 0 0 0 1.5px var(--trait);
  padding: 10px 14px;
}
.champ textarea {
  min-height: 80px;
  resize: vertical;
}
.champ input:focus-visible,
.champ select:focus-visible,
.champ textarea:focus-visible {
  box-shadow: inset 0 0 0 2px var(--ecume-f);
}
.champ .aide {
  font-size: 13px;
  color: var(--gris);
  margin-top: 4px;
}
.champ > label.photo-btn,
.photo-btn {
  display: flex;
  margin-bottom: 0;
  font-size: 15px;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  border-radius: 14px;
  background: var(--sable);
  box-shadow: inset 0 0 0 1.5px var(--trait);
  padding: 0 14px;
  color: var(--ecume-f);
  font-weight: 700;
  cursor: pointer;
}
.photo-btn input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.photo-btn:focus-within {
  outline: var(--focus);
  outline-offset: 2px;
}
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--fab-bas) + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  width: var(--fab);
  height: var(--fab);
  border-radius: 50%;
  border: 0;
  background: var(--ecume-f);
  color: var(--blanc);
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 8px 20px #1f7f7a66;
  display: grid;
  place-items: center;
}
dialog.feuille {
  border: 0;
  padding: 0;
  background: var(--blanc);
  color: var(--encre);
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 40px);
  border-radius: var(--r-xl);
  box-shadow: var(--ombre-forte);
}
dialog.feuille::backdrop {
  background: var(--voile);
}
dialog.feuille .corps {
  padding: 12px 20px 22px;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
}
dialog.feuille > .fermer-x {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 3;
  background: var(--sable2);
}
dialog.feuille h2 {
  padding-right: 48px;
}
dialog.feuille .poignee {
  width: 44px;
  height: 5px;
  border-radius: 999px;
  background: var(--trait);
  margin: 10px auto 6px;
}
dialog.feuille h2 {
  font-size: 19px;
  font-weight: 800;
  margin: 4px 0 14px;
}
dialog.feuille .pied {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 10px;
}
@media (max-width: 699px) {
  dialog.feuille {
    width: 100vw;
    max-width: 100vw;
    margin: auto 0 0;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    max-height: 92vh;
  }
  dialog.feuille .corps {
    max-height: calc(92vh - 24px);
  }
  dialog.feuille .pied .btn {
    flex: 1;
  }
}
@media (min-width: 700px) {
  dialog.feuille .poignee {
    display: none;
  }
}
.toasts {
  position: fixed;
  left: 50%;
  transform: translate(-50%);
  bottom: 96px;
  z-index: 95;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(440px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  background: var(--encre);
  color: var(--blanc);
  border-radius: var(--r-s);
  padding: 12px 16px;
  font-weight: 600;
  box-shadow: var(--ombre-forte);
}
.toast.ok {
  background: var(--menthe-f);
}
.toast.err {
  background: var(--flamant-f);
}
.bandeau {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-radius: var(--r-m);
  padding: 12px 16px;
  margin-bottom: 14px;
}
.bandeau .txt {
  flex: 1;
  min-width: 200px;
}
.vide {
  text-align: center;
  padding: 28px 16px;
  color: var(--gris);
}
.vide .gros {
  font-size: 40px;
}
.av {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
}
.av.grand {
  width: 84px;
  height: 84px;
  font-size: 40px;
}
.ligne {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--sable2);
  min-width: 0;
}
.ligne .x {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.capot-grille {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 1800px) {
  .capot-grille {
    grid-template-columns: minmax(880px, 1.1fr) minmax(0, 1fr);
    align-items: start;
  }
}
.schema-svg {
  width: 100%;
  max-width: 880px;
  height: auto;
  display: block;
}
.schema-svg .boite-fond {
  fill: var(--blanc);
  stroke: var(--trait);
  stroke-width: 2;
}
.schema-svg text {
  font-family: var(--police);
  font-size: 13px;
  fill: var(--encre);
}
.schema-svg .type {
  fill: var(--gris);
  font-size: 12px;
}
.schema-svg .ent {
  font-weight: 800;
  font-size: 14px;
}
.schema-svg .champ-l {
  cursor: pointer;
}
.schema-svg .champ-l:focus-visible rect.surv,
.schema-svg .champ-l:hover rect.surv {
  fill: var(--sable2);
  stroke: var(--lavande-f);
  stroke-width: 2;
}
.schema-svg .lien {
  fill: none;
  stroke: var(--ecume-f);
  stroke-width: 2.5;
}
.schema-svg .lien-txt {
  fill: var(--gris);
  font-size: 11px;
}
.schema-mobile details {
  border-radius: var(--r-s);
  background: var(--sable);
  margin-bottom: 10px;
}
.schema-mobile summary {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-weight: 800;
  cursor: pointer;
  border-radius: var(--r-s);
}
.schema-mobile ul {
  list-style: none;
  margin: 0;
  padding: 0 14px 10px;
}
.schema-mobile li button {
  width: 100%;
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  border: 0;
  background: transparent;
  border-top: 1px solid var(--trait);
  padding: 6px 0;
  text-align: left;
  cursor: pointer;
}
.schema-mobile .fleche {
  color: var(--ecume-f);
  font-size: 13px;
  font-weight: 700;
}
.vue-bureau {
  display: none;
}
@media (min-width: 1100px) {
  .vue-bureau {
    display: block;
  }
  .vue-mobile {
    display: none;
  }
}
.fiche-champ {
  border-radius: var(--r-s);
  padding: 14px;
  background: var(--sable);
}
.fiche-champ h3 {
  font-size: 15px;
  font-weight: 800;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.fiche-champ .ex {
  margin-top: 8px;
  font-size: 13px;
}
.fiche-champ.active {
  box-shadow: inset 0 0 0 2px var(--lavande-f);
}
pre.code {
  background: var(--encre);
  color: #fff1a8;
  border-radius: var(--r-s);
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 13.5px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 10px 0;
}
code {
  font-family: var(--mono);
  font-size: .92em;
  background: var(--sable2);
  border-radius: 6px;
  padding: 1px 5px;
  overflow-wrap: anywhere;
}
.jeton {
  display: grid;
  grid-template-columns: minmax(90px, 150px) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 10px 0;
  border-bottom: 1px solid var(--sable2);
}
.jeton .j {
  background: var(--citron);
  color: var(--citron-f);
  border-radius: 999px;
  padding: 4px 12px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.a-vous {
  background: var(--citron);
  border-radius: var(--r-s);
  padding: 14px 16px;
  margin-top: 12px;
}
.a-vous b {
  color: var(--citron-f);
}
.formule-carte + .formule-carte {
  margin-top: 14px;
}
.kanban {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(var(--kb-cols, 4), minmax(0, 1fr));
  align-items: start;
}
.kb-col {
  background: var(--sable2);
  border-radius: var(--r-m);
  padding: 10px;
  min-height: 140px;

ne table, une fiche, un graphique, un formulaire...", "Une même table peut apparaître sur plusieurs pages, sous plusieurs formes. Modifier une cellule ici la modifie partout : il n'y a qu'une seule copie des données."] }, { "titre": "Une table : des lignes et des colonnes", "paragraphes": ["Une table range des informations du même genre : **une ligne par élément** (un cadeau, un contrat, un repas) et **une colonne par information** sur cet élément (l'idée, le prix, la personne).", "Quand on crée une table vide, Grist demande d'abord son nom, puis lui donne trois colonnes provisoires, A, B et C, et une page du même nom pour l'afficher. On renomme ensuite chaque colonne selon ce qu'elle contient : un nom clair aujourd'hui vous évite de vous demander dans six mois ce que contenait « B ».", "Les noms se changent à tout moment : un double-clic sur l'en-tête d'une colonne, ou un clic sur le titre de la vue pour la table (**NOM DE LA TABLE**)."] }, { "titre": "Les données source", "paragraphes": ["Tout en bas à gauche, **Données source** liste toutes les tables du document, même celles qui ne sont sur aucune page, avec leur nombre de lignes. C'est le bon endroit pour retrouver une table « perdue »."] }, { "titre": "La vue fiche d’une ligne", "paragraphes": ["Une table montre beaucoup de lignes à la fois, mais coupe les textes longs. La **vue fiche** fait l'inverse : une seule ligne, avec tous ses champs les uns sous les autres. Sélectionnez une ligne et appuyez sur **Espace** pour l'ouvrir un instant.", "On peut aussi poser une vue **Fiche** en permanence sur la page, à côté de la table : elle suit alors la ligne sélectionnée. C'est ce que vous ferez dans la mission."], "liste": ["**Entrée** ou **F2** : modifier la cellule", "**Échap** : annuler la saisie en cours", "**Ctrl + Z** (⌘ Z sur Mac) : annuler la dernière action"] }], "mission": { "titre": "La table de vos idées de cadeaux", "intro": "Posez la première pierre de votre cadeau de la carte 2 : une table Cadeaux, sur ert", "Le prix du cadeau", "L'occasion : Noël, Anniversaire, Fête des mères", "Le lien vers la boutique"], "bonnes": [0, 2], "explication": "Un Choix unique sert aux listes fermées de valeurs qui reviennent. Un prix est un nombre, un lien est un texte libre (ou un type Texte affiché en lien).", "aide": "https://support.getgrist.com/col-types/" }, { "type": "ordre", "competence": "tables", "question": "Remettez dans l'ordre les étapes pour créer la colonne PRIX.", "etapes": ["Ajouter une colonne à la table", "Ouvrir le panneau de la colonne", "Nommer la colonne PRIX", "Choisir le type Numérique"], "explication": "On crée la colonne, puis on règle son nom et son type dans le panneau de droite. Le type peut aussi être changé plus tard : Grist convertit les valeurs.", "aide": "https://support.getgrist.com/col-types/" }, { "type": "erreur", "competence": "formules", "question": "Cette formule doit donner le prix avec 20 % de marge pour les cadeaux achetés. Où est l'erreur ?", "segments": ["$PRIX * 1.2", "if", '$STATUT = "Acheté"', "else 0"], "bonne": 2, "correction": '$STATUT == "Acheté"', "explication": "En Python, une comparaison s'écrit avec deux signes égal : `==`. Un seul `=` sert à donner une valeur, et la formule est refusée.", "aide": "https://support.getgrist.com/formulas/" }, { "type": "paires", "competence": "tables", "question": "Reliez chaque type de colonne à une valeur qui lui convient.", "paires": [["Texte", "Un puzzle de 1000 pièces"], ["Numérique", "24,90"], ["Choix unique", "Emballé"], ["Date", "24/12/2026"]], "explication": "Choisir le bon type dès le départ évite les surprises : les dates se comparent, les nombres s'additionnent, les choix se colorent.", "aide": "https://support.getgrist.com/col-types/" }], "objectif": "Donner à chaque colonne le bon type : texte, nombre, choix unique.", "lecon": [{ "titre": "Une table, des colonnes, des lignes", "paragraphes": ["Dans Grist, chaque liste est une **table** : une ligne par élément, une colonne par information. Contrairement à un tableur, toute la colonne partage le même **type** : du texte, des nombres, des dates, une liste de valeurs... Le type décide de ce que Grist sait faire avec la colonne."] }, { "titre": "Le type fait le travail", "liste": ["**Texte** pour des mots ou des phrases : un nom, une idée, une remarque.", "**Numérique** pour des quantités et des montants : les totaux et les tris deviennent justes.", "**Choix unique** pour un statut ou une catégorie : une liste fermée de valeurs, réglée dans la rubrique **CHOIX** du panneau, avec une couleur par valeur."], "paragraphes": ["Le type se règle dans le panneau de la colonne, à droite (clic droit sur l'en-tête > **Options de la colonne**), rubrique **TYPE DE COLONNE**. Un prix tapé dans une colonne Texte reste du texte : impossible de l'additionner."] }, { "titre": "Des identifiants en majuscules", "paragraphes": ["Le nom d'une colonne sert aussi d'identifiant dans les formules (`$PRIX`). Les widgets Mon Grist perso utilisent des identifiants en majuscules, sans accent : c'est grâce à ces noms qu'un widget reconnaît une table construite à la main et l'adopte sans rien perdre. C'est ce que vous préparerez dans la mission."], "code": "$PRIX * 2" }], "mission": { "titre": "Typez les colonnes de vos cadeaux", "intro": "Reprenez la table Cadeaux de la carte 1 : deux colonnes de plus, bien typées, et le cœur du cadeau est prêt. Le widget ajoutera ensuite le reste (pour qui, occasion, photo...) autour de votre table, sans toucher à vos idées.", "etapes": ["Ouvrez la page **Cadeaux** de la carte 1. Pas encore de table ? **Ajouter** > **Ajouter une table vide**, nommez-la **Cadeaux** et renommez la colonne A en **IDEE**.", "Renommez la colonne B en **PRIX** et choisissez le type **Numérique** dans le panneau de la colonne (**TYPE DE COLONNE**). Donnez un prix à vos idées.", "Renommez la colonne C en **STATUT**, type **Choix unique**, avec les valeurs Idée, Acheté, Emballé et Offert (rubrique **CHOIX**, puis **Modifier**).", "Revenez ici et cliquez sur « Vérifier mon document »."], "verifications": [{ "type": "table", "table": "Cadeaux" }, { "type": "colonne", "table": "Cadeaux", "colonne": "IDEE", "typeCol": ["Text"] }, { "type": "colonne", "table": "Cadeaux", "colonne": "PRIX", "typeCol": ["Numeric", "Int"] }, { "type": "choix", "table": "Cadeaux", "colonne": "STATUT", "choix": ["Idée", "Acheté", "Emballé", "Offert"] }] }, "contenu": true, "url": "lib/x/3gm57wx6/", "page": "🎁 Mes cadeaux" }, { "carte": 3, "id": "trier", "titre": "Trier, filtrer, chercher", "niveau": "decouverte", "niveauNom": "Découverte", "competence": "trier", "surprise": { "genre": "astuce", "nom": "Le filtre qui ne disparaît plus", "texte": "Pour avoir **plusieurs vues d'une même table** (les cadeaux à acheter, ceux déjà emballés), inutile de dupliquer la table : ajoutez deux vues de la même table sur une page, chacune avec son propre filtre enregistré. Et pour un filtre qui suit la date du jour (« les échéances du mois »), ajoutez une colonne formule comme `$ECHEANCE and $ECHEANCE <= DATEADD(TODAY(), days=30)` et filtrez sur cette colonne : le filtre se met à jour tout seul, chaque jour." }, "durees": { "lecon": 5, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "trier", "question": "Votre collègue ne voit pas le filtre que vous avez réglé ce matin. Pourquoi, le plus souvent ?", "choix": ["Les filtres sont personnels pour toujours", "Le filtre n'a pas été enregistré", "Elle n'a pas les droits de lecture"], "bonne": 1, "explication": "Un filtre non enregistré ne vaut que pour la visite en cours. Le bouton « Enregistrer » le rend permanent pour tout le monde.", "aide": "https://support.getgrist.com/search-sort-filter/" }, { "type": "multiple", "competence": "trier", "question": "Que fait un filtre ?", "choix": ["Il cache des lignes", "Il supprime des lignes", "Il ne change pas les données", "Il trie les lignes"], "bonnes": [0, 2], "explication": "Un filtre ne fait que cacher : retirez-le et toutes les lignes reviennent.", "aide": "https://support.getgrist.com/search-sort-filter/" }, { "type": "qcm", "competence": "trier", "question": "Quel raccourci cherche un mot dans tout le document ?", "choix": ["Ctrl + F", "Ctrl + D", "Ctrl + ;", "Espace"], "bonne": 0, "explication": "Ctrl + F (⌘ F) ouvre la recherche, qui parcourt toutes les pages.", "aide": "https://support.getgrist.com/search-sort-filter/" }, { "type": "ordre", "competence": "trier", "question": "Remettez dans l'ordre pour garder un tri pour tout le monde.", "etapes": ["Ouvrir le menu de la colonne", "Choisir « Trier » puis « A-Z »", "Cliquer sur « Enregistrer » en haut de la vue"], "explication": "Sans le dernier geste, le tri reste temporaire.", "aide": "https://support.getgrist.com/search-sort-filter/" }, { "type": "qcm", "competence": "trier", "question": "Le plus rapide pour ne garder que les cadeaux « Emballé » ?", "choix": ["Clic droit sur une cellule « Emballé » de STATUT, puis « Filtrer par cette valeur »", "Supprimer les autres lignes", "Copier les lignes dans une nouvelle table"], "bonne": 0, "explication": "« Filtrer par cette valeur » se fait en deux clics, sans rien supprimer ni recopier.", "aide": "https://support.getgrist.com/search-sort-filter/" }], "objectif": "Trouver vite la bonne ligne : trier, filtrer, chercher, et garder ses réglages.", "lecon": [{ "titre": "Trier", "paragraphes": ["Le menu de chaque colonne (la petite flèche dans l'en-tête) propose **Trier**, avec **A-Z** et **Z-A**. Pour trier sur plusieurs colonnes, ajoutez-les dans l'onglet **Trier et Filtrer** du panneau de droite."] }, { "titre": "Filtrer", "paragraphes": ["Un filtre cache des lignes sans les effacer. Dans le menu de la colonne, **Filtrer les données** : décochez les valeurs à cacher, ou, pour une colonne de dates ou de nombres, donnez un minimum et un maximum.", "Un clic droit sur une cellule propose aussi **Filtrer par cette valeur** : le plus rapide pour ne garder que les cadeaux d'un même statut, par exemple."] }, { "titre": "Enregistrer, ou pas", "paragraphes": ["Un tri ou un filtre que vous venez de régler n'est d'abord que pour vous, le temps de la visite. Une barre apparaît alors en haut de la vue : **Enregistrer** le garde pour tout le monde, **Retour** revient en arrière. Le même réglage se retrouve dans le panneau de droite, onglet **Trier et Filtrer**.", "C'est la question la plus posée sur le forum : « mon filtre a disparu ». Il n'avait simplement pas été enregistré."] }, { "titre": "Chercher", "paragraphes": ["**Ctrl + F** (⌘ F) cherche un mot dans toutes les pages du document, de cellule en cellule. Les flèches de la barre de recherche passent au résultat suivant. Pratique pour retrouver « écharpe » parmi tous vos cadeaux."] }], "mission": { "titre": "Vos cadeaux bien rangés", "intro": "Pas de nouvelle table : vous rangez celle de vos cadeaux (cartes 1 et 2). Les moins chers d'abord, sans les cadeaux déjà offerts, réglages enregistrés pour de bon.", "etapes": ["Ouvrez la page **Cadeaux** (celle de la carte 1). Si la table n'est sur aucune page, ajoutez-la : **Ajouter** > **Ajouter une page** > **Table** > Cadeaux > **Ajouter à la Page**.", "Vérifiez qu'il y a au moins trois cadeaux, avec un prix et un statut ; ajoutez-en si besoin.", "Menu de la colonne **PRIX** (la petite flèche de l'en-tête) > **Trier** > **A-Z**, puis **Enregistrer** en haut de la vue.", "Menu de la colonne **STATUT** > **Filtrer les données** : décochez **Offert**, puis **Enregistrer**.", "Appuyez sur **Ctrl + F** (⌘ F) et cherchez une de vos idées, pour le plaisir. Puis revenez ici et cliquez sur « Vérifier mon document »."], "verifications": [{ "type": "table", "table": "Cadeaux" }, { "type": "lignes", "table": "Cadeaux", "min": 3 }, { "type": "tri", "table": "Cadeaux", "colonne": "PRIX" }, { "type": "filtre", "table": "Cadeaux", "colonne": "STATUT" }] }, "contenu": true }, { "carte": 4, "id": "envies", "titre": "Choix unique et Choix multiple", "niveau": "decouverte", "niveauNom": "Découverte", "competence": "choix", "widget": "envies", "surprise": { "genre": "widget", "nom": "La liste de mes envies", "widget": "envies", "texte": "Toutes vos envies, petites et grandes, rangées par catégorie et par humeur, avec un tirage au sort quand on ne sait pas quoi faire." }, "durees": { "lecon": 5, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "choix", "question": "Une envie peut être à la fois « Dehors » et « Sportif ». Quel type pour la colonne HUMEURS ?", "choix": ["Choix unique", "Choix multiple", "Texte", "Référence"], "bonne": 1, "explication": "Plusieurs valeurs par ligne : c'est un Choix multiple.", "aide": "https://support.getgrist.com/col-types/" }, { "type": "qcm", "competence": "choix", "question": "Une valeur s'affiche en gris dans une colonne Choix unique. Qu'est-ce que cela veut dire ?", "choix": ["Elle est en erreur et va être effacée", "Elle n'est pas dans la liste des choix", "La ligne est verrouillée"], "bonne": 1, "explication": "Grist garde la valeur mais la signale : ajoutez-la à la liste si elle est la bienvenue.", "aide": "https://support.getgrist.com/col-types/" }, { "type": "trou", "competence": "choix", "question": "Complétez la formule qui vaut Vrai quand l'humeur « Zen » fait partie des humeurs.", "formule": '"Zen" ___ ($HUMEURS or [])', "reponses": [["in"]], "explication": "Un Choix multiple est une liste : `in` teste si une valeur y figure. Le `or []` évite une erreur sur une cellule vide.", "aide": "https://support.getgrist.com/formulas/" }, { "type": "qcm", "competence": "choix", "question": "Vous renommez le choix « Voir » en « Regarder » dans le panneau de la colonne. Et les lignes ?", "choix": ["Elles gardent « Voir », en gris", "Elles passent toutes à « Regarder »", "Elles deviennent vides"], "bonne": 1, "explication": "Renommer une valeur dans la liste la renomme partout.", "aide": "https://support.getgrist.com/col-types/" }, { "type": "erreur", "competence": "choix", "question": "Cette formule doit compter les envies de la catégorie Lire. Où est l'erreur ?", "segments": ["len(", "Envies.lookupRecords(", "CATEGORIE=Lire", "))"], "bonne": 2, "correction": 'CATEGORIE="Lire"', "explication": "Une valeur de texte s'écrit entre guillemets ; sans eux, Python cherche une variable nommée Lire.", "aide": "https://support.getgrist.com/references-lookups/" }, { "type": "multiple", "competence": "choix", "question": "Lesquelles conviennent à une colonne Choix unique (une seule valeur) ?", "choix": ["Le pays du voyage", "Les personnes invitées", "La priorité : Très envie, Envie, Peut-être", "Le statut d'une tâche"], "bonnes": [0, 2, 3], "explication": "Une seule valeur dans une liste courte : Choix unique. Plusieurs personnes : plutôt une Référence multiple vers la table Personnes.", "aide": "https://support.getgrist.com/col-types/" }], "objectif": "Choisir entre Choix unique et Choix multiple, et garder des listes propres.", "lecon": [{ "titre": "Choix unique ou Choix multiple", "paragraphes": ["Une colonne **Choix unique** accepte une seule valeur parmi une liste : une catégorie, un statut. Une colonne **Choix multiple** en accepte plusieurs : des humeurs, des étiquettes.", "Chaque valeur a sa couleur : la liste devient lisible d'un coup d'œil."] }, { "titre": "Une liste fermée, mais pas figée", "paragraphes": ["Les valeurs se règlent dans le panneau de la colonne, rubrique **Choix**. Taper une valeur absente de la liste est possible : elle s'affiche alors en gris, signe qu'elle n'est pas prévue. Il suffit de l'ajouter à la liste pour la rendre officielle."] }, { "titre": "Renommer sans rien casser", "paragraphes": ["Renommer une valeur dans le panneau de la colonne la renomme aussi dans toutes les lignes qui l'utilisent. Pas besoin de rechercher-remplacer."] }, { "titre": "Dans une formule", "code": '"Lire" in ($HUMEURS or [])', "paragraphes": ['Un Choix unique se compare comme un texte : `$CATEGORIE == "Lire"`. Un Choix multiple est une liste : on teste la présence d\'une valeur avec `in`.'] }], "mission": { "titre": "Votre liste d’envies", "intro": "Le cœur du widget La liste de mes envies : une table et deux colonnes Choix unique.", "etapes": ["Créez une table **Envies** avec une colonne **ENVIE** (Texte).", "Ajoutez **CATEGORIE** en Choix unique : Faire, Voir, Apprendre, Goûter, Visiter, Lire, Essayer.", "Ajoutez **QUAND** en Choix unique : Cette année, Un jour.", "Écrivez au moins trois envies."], "verifications": [{ "type": "table", "table": "Envies" }, { "type": "colonne", "table": "Envies", "colonne": "ENVIE", "typeCol": ["Text"] }, { "type": "choix", "table": "Envies", "colonne": "CATEGORIE", "choix": ["Faire", "Voir", "Apprendre", "Goûter", "Visiter", "Lire", "Essayer"] }, { "type": "choix", "table": "Envies", "colonne": "QUAND", "choix": ["Cette année", "Un jour"] }, { "type": "lignes", "table": "Envies", "min": 3 }] }, "contenu": true, "url": "lib/x/bbic5mwy/", "page": "🌠 La liste de mes envies" }, { "carte": 5, "id": "voiture", "titre": "Premières formules", "niveau": "decouverte", "niveauNom": "Découverte", "competence": "formules", "widget": "voiture", "surprise": { "genre": "widget", "nom": "Voiture et carburant", "widget": "voiture", "texte": "Vos pleins, votre consommation aux 100 km, l'entretien et ses rappels." }, "durees": { "lecon": 10, "mission": 10, "quiz": 5 }, "questions": [{ "type": "prediction", "competence": "formules", "question": "Que vaut cette formule ?", "formule": "$LITRES * $PRIX_LITRE", "contexte": [["$LITRES", "30"], ["$PRIX_LITRE", "2"]], "reponses": [60], "explication": "30 litres à 2 € : 60. La formule lit les valeurs de la même ligne.", "aide": "https://support.getgrist.com/formulas/" }, { "type": "qcm", "competence": "formules", "question": "Où s'écrit une formule dans Grist ?", "choix": ["Dans chaque cellule, une par une", "Une fois pour toute la colonne", "Dans une feuille à part"], "bonne": 1, "explication": "Une colonne formule calcule toutes ses lignes avec la même formule, y compris les lignes ajoutées plus tard.", "aide": "https://support.getgrist.com/formulas/" }, { "type": "trou", "competence": "formules", "question": "Arrondissez le montant à deux décimales.", "formule": "___($MONTANT, 2)", "reponses": [["ROUND"]], "explication": "ROUND(valeur, décimales) arrondit, comme dans un tableur.", "aide": "https://support.getgrist.com/functions/" }, { "type": "erreur", "competence": "formules", "question": "Cette formule doit afficher « Plein » au-delà de 40 litres. Où est l'erreur ?", "segments": ['"Plein"', "if", "LITRES > 40", 'else "Appoint"'], "bonne": 2, "correction": "$LITRES > 40", "explication": "Il manque le $ : sans lui, Python ne sait pas qu'il s'agit du champ LITRES de la ligne.", "aide": "https://support.getgrist.com/formulas/" }, { "type": "prediction", "competence": "formules", "question": "Que vaut cette formule ?", "formule": '$MARQUE + " " + $MODELE', "contexte": [["$MARQUE", '"Renault"'], ["$MODELE", '"Clio"']], "reponses": ["Renault Clio"], "explication": `Le + colle des textes ; le " " ajoute l'espace entre les deux.`, "aide": "https://support.getgrist.com/formulas/" }, { "type": "qcm", "competence": "formules", "question": "Comment éviter une erreur quand LITRES est vide ?", "choix": ["`$LITRES * $PRIX_LITRE if $LITRES else None`", "`$LITRES * $PRIX_LITRE or vide`", "On ne peut pas"], "bonne": 0, "explication": "La condition `if $LITRES` ne calcule que si la cellule est remplie, sinon la case reste vide.", "aide": "https://support.getgrist.com/formulas/" }], "objectif": "Écrire ses premières formules : calculer une colonne à partir des autres.", "lecon": [{ "titre": "Une formule pour toute la colonne", "paragraphes": ["Dans Grist, une formule ne s'écrit pas cellule par cellule : elle s'écrit **une fois pour toute la colonne**. On tape `=` dans une cellule de la colonne, on écrit la formule, Entrée : toutes les lignes sont calculées, y compris les futures."] }, { "titre": "Les champs avec $", "code": "$QUANTITE * $PRIX_UNITAIRE", "paragraphes": ["`$QUANTITE` désigne la valeur de QUANTITE **sur la même ligne**. Pas de B2 ni de C2 : on nomme les champs, la formule se lit comme une phrase."] }, { "titre": "Des formules en Python", "liste": ["Calcul : `$QUANTITE * $PRIX_UNITAIRE`", "Arrondi : `ROUND($MONTANT, 2)`", 'Texte : `$MARQUE + " " + $MODELE`', 'Condition : `"Gros achat" if $QUANTITE > 10 else "Petit achat"`'] }, { "titre": "Une cellule vide", "paragraphes": ["Si QUANTITE est vide, `$QUANTITE * $PRIX_UNITAIRE` donne une erreur. La parade : `$QUANTITE * $PRIX_UNITAIRE if $QUANTITE and $PRIX_UNITAIRE else None`. C'est ce genre de formule que vous écrirez dans la mission."] }], "mission": { "titre": "Le carnet des pleins", "intro": "Le cœur du widget Voiture et carburant : vos pleins, et leur coût calculé par une formule.", "etapes": ["Créez une table **Pleins** avec DATE (Date), LITRES (Numérique) et PRIX_LITRE (Numérique).", "Ajoutez une colonne **MONTANT** : tapez `=` dans une de ses cellules, écrivez la formule `$LITRES * $PRIX_LITRE`, puis Entrée.", "Ajoutez un plein de 40 litres à 1,80 € le litre."], "verifications": [{ "type": "table", "table": "Pleins" }, { "type": "colonne", "table": "Pleins", "colonne": "DATE", "typeCol": ["Date"] }, { "type": "colonne", "table": "Pleins", "colonne": "LITRES", "typeCol": ["Numeric", "Int"] }, { "type": "colonne", "table": "Pleins", "colonne": "PRIX_LITRE", "typeCol": ["Numeric"] }, { "type": "formule", "table": "Pleins", "colonne": "MONTANT", "contient": "$LITRES", "valeur": 72, "ligne": { "LITRES": 40 }, "solution": "$LITRES * $PRIX_LITRE" }] }, "contenu": true, "url": "lib/x/wx8ngxvd/", "page": "🚗 Voiture et carburant" }, { "carte": 6, "id": "conges", "titre": "Les dates", "niveau": "decouverte", "niveauNom": "Découverte", "competence": "dates", "widget": "conges", "surprise": { "genre": "widget", "nom": "Mes congés", "widget": "conges", "texte": "Vos congés posés et à poser, les jours ouvrés comptés tout seuls, les jours fériés, un calendrier à l'année." }, "durees": { "lecon": 10, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "dates", "question": "Pourquoi utiliser le type Date plutôt que Texte pour une date ?", "choix": ["Pour pouvoir trier et calculer", "Pour gagner de la place", "C'est obligatoire dans Grist"], "bonne": 0, "explication": "Une vraie date se trie dans l'ordre du temps et sert dans les formules ; un texte, non.", "aide": "https://support.getgrist.com/dates/" }, { "type": "prediction", "competence": "dates", "question": "Combien de jours donne cette formule ?", "formule": "DAYS($FIN, $DEBUT)", "contexte": [["$DEBUT", "1er mars 2026"], ["$FIN", "11 mars 2026"]], "reponses": [10], "explication": "DAYS(fin, début) compte les jours entre les deux dates : 10.", "aide": "https://support.getgrist.com/functions/" }, { "type": "trou", "competence": "dates", "question": "Complétez pour obtenir la date deux semaines après DEBUT.", "formule": "DATEADD($DEBUT, ___=14)", "reponses": [["days"]], "explication": "DATEADD accepte days, weeks, months, years : `DATEADD($DEBUT, weeks=2)` marche aussi.", "aide": "https://support.getgrist.com/functions/" }, { "type": "qcm", "competence": "dates", "question": "Quel raccourci écrit la date du jour dans une cellule ?", "choix": ["Ctrl + ;", "Ctrl + D", "Ctrl + T"], "bonne": 0, "explication": "Ctrl + ; (⌘ ; sur Mac). Avec Maj en plus, la date et l'heure.", "aide": "https://support.getgrist.com/keyboard-shortcuts/" }, { "type": "paires", "competence": "dates", "question": "Reliez chaque fonction à ce qu'elle donne.", "paires": [["TODAY()", "La date du jour"], ["YEAR($DATE)", "L'année"], ["NETWORKDAYS($DEBUT, $FIN)", "Les jours ouvrés"], ["DATEADD($DATE, months=1)", "Un mois plus tard"]], "explication": "Ces fonctions ressemblent à celles d'un tableur et suffisent pour la plupart des besoins.", "aide": "https://support.getgrist.com/functions/" }, { "type": "erreur", "competence": "dates", "question": "C ement, ajoutez une vue de Cartons (**Ajouter > Ajouter une vue à la page**) et réglez **Sélectionner par** sur la vue Pieces_demenagement.", "Ajoutez deux cartons dans la cuisine depuis cette vue."], "verifications": [{ "type": "table", "table": "Pieces_demenagement" }, { "type": "table", "table": "Cartons" }, { "type": "reference", "table": "Cartons", "colonne": "PIECE", "cible": "Pieces_demenagement" }, { "type": "lien", "table": "Cartons", "source": "Pieces_demenagement" }, { "type": "lignes", "table": "Cartons", "min": 2 }] }, "contenu": true, "url": "lib/x/9v8qgf6c/", "page": "🚚 Je déménage" }, { "carte": 11, "id": "fiches", "titre": "Vue fiche et liste de fiches", "niveau": "pratique", "niveauNom": "Pratique", "competence": "fiches", "surprise": { "genre": "outil", "nom": "La fiche à imprimer", "texte": "Un mini-outil sans rien installer : dans une fiche bien disposée, le menu de la vue propose **Imprimer la vue**. Mettez la fiche à côté d'une table reliée (carte 10) : choisissez une ligne, imprimez sa fiche. Pour une fiche par ligne d'un coup, imprimez une **Liste de fiches** filtrée. Fiche contact pour la nounou, fiche de prêt d'un objet, fiche d'un animal pour la pension : en deux clics." }, "durees": { "lecon": 5, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "fiches", "question": "Quelle vue montre toutes les lignes, chacune sous forme de fiche ?", "choix": ["Fiche", "Liste de fiches", "Table"], "bonne": 1, "explication": "La Fiche montre une ligne ; la Liste de fiches les enchaîne.", "aide": "https://support.getgrist.com/widget-card-list/" }, { "type": "qcm", "competence": "fiches", "question": "Quelle touche ouvre la fiche de la ligne sélectionnée, sur n'importe quelle page ?", "choix": ["Espace", "Entrée", "Tab"], "bonne": 0, "explication": "Espace ouvre la fiche, Échap la referme.", "aide": "https://support.getgrist.com/keyboard-shortcuts/" }, { "type": "multiple", "competence": "fiches", "question": "Que permet « Disposition de la fiche » ?", "choix": ["Déplacer les champs", "Mettre deux champs sur une ligne", "Changer le type d’une colonne", "Retirer un champ de la fiche"], "bonnes": [0, 1, 3], "explication": "La disposition est visuelle ; le type se règle dans le panneau de la colonne.", "aide": "https://support.getgrist.com/widget-card/" }, { "type": "qcm", "competence": "fiches", "question": "Vous retirez QUAND de la disposition de la fiche. Les valeurs de QUAND ?", "choix": ["Sont effacées", "Restent dans la table, simplement cachées de la fiche", "Passent dans une autre colonne"], "bonne": 1, "explication": "Une vue ne fait que montrer : retirer un champ de la disposition ne supprime rien dans la table.", "aide": "https://support.getgrist.com/widget-card/" }, { "type": "paires", "competence": "fiches", "question": "Reliez chaque vue à son usage.", "paires": [["Fiche", "Une ligne en détail"], ["Liste de fiches", "Un carnet à faire défiler"], ["Table", "Comparer beaucoup de lignes"]], "explication": "On peut mélanger les trois sur une même page.", "aide": "https://support.getgrist.com/page-widgets/" }], "objectif": "Montrer une table en liste de fiches et soigner la disposition de la fiche.", "lecon": [{ "titre": "Fiche et liste de fiches", "paragraphes": ["La vue **Fiche** montre une ligne à la fois ; la **Liste de fiches** les montre toutes, l'une sous l'autre, comme un carnet que l'on fait défiler. Vos envies de la carte 4 s'y prêtent bien : une envie, une fiche."] }, { "titre": "Disposer les champs", "paragraphes": ["Dans le menu de la vue (les trois points en haut à droite), **Disposition de la fiche** permet de déplacer les champs, d'en mettre plusieurs sur une ligne, de les agrandir ou de les retirer. Le réglage vaut pour toutes les fiches de la vue, et ne change rien aux données."] }, { "titre": "La fiche de n’importe quelle ligne", "paragraphes": ["Partout, **Espace** ouvre la **vue fiche** de la ligne sélectionnée, même sans vue Fiche sur la page. Et un clic sur une référence ouvre la vue fiche de la ligne pointée."] }], "mission": { "titre": "Vos envies en fiches", "intro": "Pas de nouvelle table : vous montrez autrement votre liste d'envies de la carte 4, comme un carnet de fiches à faire défiler.", "etapes": ["Cliquez sur **Ajouter** > **Ajouter une page**, choisissez **Liste de fiches**, puis la table **Envies**, et **Ajouter à la Page**.", "Dans le menu de la vue (les trois points), choisissez **Disposition de la fiche**. Mettez **CATEGORIE** et **QUAND** côte à côte, sur une même ligne, puis enregistrez.", "Pas encore d'envies ? Écrivez-en au moins trois, directement dans les fiches.", "Revenez ici et cliquez sur « Vérifier mon document »."], "verifications": [{ "type": "table", "table": "Envies", "indices": ["Votre liste d'envies vient de la carte 4.", "Faites d'abord la carte 4 (mission ou « Installe pour moi ») : elle crée la table Envies.", "Carte 4, La liste de mes envies : « Je le construis » ou « Installe pour moi », puis revenez ici."] }, { "type": "lignes", "table": "Envies", "min": 3 }, { "type": "vue", "table": "Envies", "genre": "detail" }] }, "contenu": true }, { "carte": 12, "id": "papiers", "titre": "Styles conditionnels", "niveau": "pratique", "niveauNom": "Pratique", "competence": "miseenforme", "widget": "papiers", "surprise": { "genre": "widget", "nom": "Mes papiers et échéances", "widget": "papiers", "texte": "Carte d'identité, passeport, assurance, contrôle technique : les dates qui comptent, et une alerte avant qu'il soit trop tard." }, "durees": { "lecon": 10, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "miseenforme", "question": "Où ajoute-t-on un style conditionnel sur une colonne ?", "choix": ["Panneau de la colonne, Style de cellule", "Menu Fichier", "Dans la formule de la colonne"], "bonne": 0, "explication": "Style de cellule > Ajouter un style conditionnel.", "aide": "https://support.getgrist.com/conditional-formatting/" }, { "type": "trou", "competence": "miseenforme", "question": "Complétez la condition : en rouge quand il reste moins de 7 jours.", "formule": "$JOURS_RESTANTS ___ 7", "reponses": [["<"]], "explication": "Une condition de style est une formule qui vaut Vrai ou Faux.", "aide": "https://support.getgrist.com/conditional-formatting/" }, { "type": "qcm", "competence": "miseenforme", "question": "Deux règles sont vraies en même temps (moins de 7 jours, moins de 30 jours). Laquelle s'applique ?", "choix": ["La première de la liste", "La dernière ajoutée", "Aucune"], "bonne": 0, "explication": "Mettez la règle la plus stricte en premier.", "aide": "https://support.getgrist.com/conditional-formatting/" }, { "type": "erreur", "competence": "miseenforme", "question": "Cette condition doit colorer les papiers expirés. Où est l'erreur ?", "segments": ["$ECHEANCE", "and", "$ECHEANCE < TODAY"], "bonne": 2, "correction": "$ECHEANCE < TODAY()", "explication": "TODAY() avec ses parenthèses : c'est une fonction.", "aide": "https://support.getgrist.com/functions/" }, { "type": "multiple", "competence": "miseenforme", "question": "Que peut changer un style conditionnel ?", "choix": ["La couleur du texte", "La couleur de fond", "La valeur de la cellule", "Le gras"], "bonnes": [0, 1, 3], "explication": "Elle change l'apparence, jamais la valeur.", "aide": "https://support.getgrist.com/conditional-formatting/" }, { "type": "prediction", "competence": "miseenforme", "question": "L'échéance est dans 12 jours. Cette condition est-elle vraie ? (Vrai ou Faux)", "formule": "$JOURS_RESTANTS is not None and $JOURS_RESTANTS < 30", "reponses": ["Vrai", "True", "oui"], "explication": "12 est bien inférieur à 30 : la cellule se colore.", "aide": "https://support.getgrist.com/conditional-formatting/" }], "objectif": "Colorer automatiquement ce qui demande votre attention.", "lecon": [{ "titre": "Une règle, une couleur", "paragraphes": ["Dans le panneau de la colonne, **Style de cellule** puis **Ajouter un style conditionnel** : une condition, une couleur. La cellule se colore toute seule quand la condition est vraie."] }, { "titre": "Les conditions sont des formules", "code": "$STOCK is not None and $STOCK < 5", "paragraphes": ["On écrit la condition comme une formule, vraie ou fausse. Plusieurs règles peuvent s'empiler, par exemple rouge sous 5, orange sous 10 : la première règle vraie l'emporte. Pensez aux cellules vides : la condition doit d'abord vérifier que la valeur existe."] }, { "titre": "Toute la ligne", "paragraphes": ["Un style conditionnel peut aussi s'appliquer à **la ligne entière** : panneau de droite, onglet **Vue**, **Aspect de la ligne**. Pratique pour griser les papiers déjà renouvelés."] }], "mission": { "titre": "Les échéances en couleur", "intro": "Le cœur du widget Mes papiers et échéances : chaque papier, sa date d'échéance, et une alerte en couleur.", "etapes": ["Créez une table **Papiers** avec PAPIER (Texte) et ECHEANCE (Date).", "Ajoutez **JOURS_RESTANTS** avec la formule `DAYS($ECHEANCE, TODAY()) if $ECHEANCE else None`.", "Sur JOURS_RESTANTS, dans le panneau de la colonne, **Style de cellule** > **Ajouter un style conditionnel** : condition `$JOURS_RESTANTS is not None and $JOURS_RESTANTS < 30`, avec un fond rouge.", "Ajoutez deux papiers, dont un qui expire bientôt."], "verifications": [{ "type": "table", "table": "Papiers" }, { "type": "colonne", "table": "Papiers", "colonne": "ECHEANCE", "typeCol": ["Date"] }, { "type": "formule", "table": "Papiers", "colonne": "JOURS_RESTANTS", "contient": "$ECHEANCE", "solution": "DAYS($ECHEANCE, TODAY()) if $ECHEANCE else None" }, { "type": "miseEnForme", "table": "Papiers", "colonne": "JOURS_RESTANTS", "condition": "$JOURS_RESTANTS is not None and $JOURS_RESTANTS < 30" }, { "type": "lignes", "table": "Papiers", "min": 2 }] }, "contenu": true, "url": "lib/x/mhgf3yhw/", "page": "📁 Mes papiers et échéances" }, { "carte": 13, "id": "patrimoine", "titre": "Graphiques", "niveau": "pratique", "niveauNom": "Pratique", "competence": "graphiques", "widget": "patrimoine", "surprise": { "genre": "widget", "nom": "Mon patrimoine", "widget": "patrimoine", "texte": "Tous vos comptes et biens réunis, leur répartition et leur évolution, mois après mois." }, "durees": { "lecon": 10, "mission": 10, "quiz": 5 }, "questions": [{ "type": "paires", "competence": "graphiques", "question": "Reliez chaque question au graphique qui y répond le mieux.", "paires": [["Quelle part pour chaque type ?", "Diagramme circulaire"], ["Comment ça évolue mois après mois ?", "Graphique en courbes"], ["Quel poste est le plus gros ?", "Graphique en barres"]], "explication": "Une part : diagramme circulaire ; une évolution : graphique en courbes ; une comparaison : graphique en barres.", "aide": "https://support.getgrist.com/widget-chart/" }, { "type": "qcm", "competence": "graphiques", "question": "Comment ajoute-t-on un graphique ?", "choix": ["Ajouter > Ajouter une vue à la page > Graphique", "Clic droit sur une colonne > Graphique", "En exportant vers un tableur"], "bonne": 0, "explication": "Un graphique est une vue de page, branché sur une table.", "aide": "https://support.getgrist.com/widget-chart/" }, { "type": "qcm", "competence": "graphiques", "question": "Vous modifiez un MONTANT dans la table. Le graphique ?", "choix": ["Se met à jour tout seul", "Doit être recréé", "Se met à jour le lendemain"], "bonne": 0, "explication": "Le graphique lit la table en direct.", "aide": "https://support.getgrist.com/widget-chart/" }, { "type": "multiple", "competence": "graphiques", "question": "Que règle-t-on dans le panneau d'un graphique ?", "choix": ["Le type de graphique", "L'axe horizontal", "Les séries", "Le type des colonnes de la table"], "bonnes": [0, 1, 2], "explication": "Le type des colonnes se règle dans le panneau de chaque colonne, pas du graphique.", "aide": "https://support.getgrist.com/widget-chart/" }, { "type": "ordre", "competence": "graphiques", "question": "Remettez dans l'ordre pour un diagramme circulaire par type.", "etapes": ["Ajouter une vue Graphique de la table Avoirs", "Choisir le type Diagramme circulaire", "Mettre TYPE en axe horizontal", "Mettre MONTANT en série"], "explication": "Le graphique additionne les montants qui partagent le même TYPE.", "aide": "https://support.getgrist.com/widget-chart/" }], "objectif": "Faire parler vos chiffres avec un graphique.", "lecon": [{ "titre": "Une vue Graphique", "paragraphes": ["Un graphique est une vue comme une autre : **Ajouter une vue à la page**, **Graphique**, puis la table. Dans le panneau de droite, on choisit le **Type de graphique** (Graphique en barres, Diagramme circulaire, Graphique en courbes...), l'**Axe horizontal** et la ou les **Séries**."] }, { "titre": "Grouper avant de dessiner", "paragraphes": ["Pour un total par catégorie, le plus propre est de dessiner une **table récapitulative**, groupée par cette catégorie (carte 17) ; le graphique additionne aussi les valeurs identiques de l'axe horizontal."] }, { "titre": "Un graphique qui suit la sélection", "paragraphes": ["Relié à un tableau par « Sélectionner par » (carte 10), le graphique montre la ligne choisie : l'évolution d'un seul compte, par exemple."] }], "mission": { "titre": "Votre patrimoine en un coup d’œil", "intro": "Le cœur du widget Mon patrimoine : vos avoirs et leur répartition dessinée.", "etapes": ["Créez une table **Avoirs** avec NOM (Texte), TYPE (Choix unique : Compte courant, Épargne, Placement, Immobilier, Autre) et MONTANT (Numérique).", "Ajoutez au moins trois avoirs.", "Ajoutez une vue **Graphique** de la table Avoirs : **Ajouter** > **Ajouter une vue à la page** > **Graphique** > Avoirs > **Ajouter à la Page**. Dans le panneau de droite, choisissez par exemple **Diagramme circulaire**, TYPE en **Axe horizontal** et MONTANT en **Séries**."], "verifications": [{ "type": "table", "table": "Avoirs" }, { "type": "choix", "table": "Avoirs", "colonne": "TYPE", "choix": ["Compte courant", "Épargne", "Placement", "Immobilier", "Autre"] }, { "type": ix": ["CSV", "Excel (XLSX)", "JSON", "Une photo de ticket"], "bonnes": [0, 1, 2], "explication": "Les fichiers de données, oui ; une photo, non (elle va dans une colonne Pièce jointe).", "aide": "https://support.getgrist.com/imports/" }, { "type": "qcm", "competence": "import", "question": "Vous exportez en CSV un tableau filtré sur l'année 2026. Le fichier contient ?", "choix": ["Toutes les lignes de la table", "Les lignes visibles, filtre compris", "Seulement la première page"], "bonne": 1, "explication": "L'export suit ce que montre la vue.", "aide": "https://support.getgrist.com/exports/" }], "objectif": "Faire entrer des données d'ailleurs (relevé, tableur) et les faire sortir proprement.", "lecon": [{ "titre": "Importer un fichier", "paragraphes": ["**Ajouter** > **Importer depuis un fichier** accepte CSV, Excel, JSON. Grist propose de créer une nouvelle table ou d'ajouter les lignes à une table existante, en reliant chaque colonne du fichier à une colonne de la table.", "Pour un relevé bancaire mensuel, choisissez la table existante : vos formules et vos catégories restent en place."] }, { "titre": "Coller, tout simplement", "paragraphes": ["Pour quelques dizaines de lignes, copiez-les dans votre tableur ou votre banque en ligne, sélectionnez la première cellule dans Grist, **Ctrl + V** : les lignes s'ajoutent, colonne par colonne."] }, { "titre": "Nettoyer après coup", "liste": ["Une date restée en texte : changez le type de la colonne en Date, Grist convertit.", "Des montants « 12,50 € » en texte : passez en Numérique ; ce qui ne se convertit pas reste signalé en rouge.", "Des doublons : triez sur la date et le libellé, ils se retrouvent côte à côte."] }, { "titre": "Exporter", "paragraphes": ["Le menu de chaque vue propose **Télécharger en CSV** ou **Télécharger en XLSX** : on exporte ce que l'on voit, filtres compris. Le document entier se télécharge aussi, avec ses formules, depuis le menu **Partager** (**Télécharger le document**)."] }], "mission": { "t ent dans la plupart des cas.", "aide": "https://support.getgrist.com/sharing/" }, { "type": "qcm", "competence": "partage", "question": "Vos compagnons de voyage doivent ajouter des dépenses, sans toucher aux colonnes. Quel rôle ?", "choix": ["Lecture seule", "Éditeur", "Propriétaire"], "bonne": 1, "explication": "Un éditeur modifie les données, pas la structure.", "aide": "https://support.getgrist.com/sharing/" }, { "type": "ordre", "competence": "partage", "question": "Remettez dans l'ordre l'invitation d'un compagnon de voyage qui ajoutera des dépenses.", "etapes": ["Ouvrir « Partager » > « Gérer les utilisateurs »", "Taper son adresse e-mail", "Choisir le rôle Éditeur", "Confirmer l'invitation"], "explication": "Le rôle se choisit avant d'envoyer : Éditeur suffit pour ajouter des dépenses, sans toucher à la structure.", "aide": "https://support.getgrist.com/sharing/" }, { "type": "qcm", "competence": "partage", "question": "Vous voulez montrer le programme du voyage à la famille, sans compte. Le plus simple ?", "choix": ["L'accès public, en lecture seule", "Leur donner le rôle propriétaire", "Envoyer le mot de passe"], "bonne": 0, "explication": "Un lien en lecture seule se partage sans rien risquer.", "aide": "https://support.getgrist.com/sharing/" }, { "type": "trou", "competence": "partage", "question": "Complétez la formule d’initialisation qui note l'auteur.", "formule": "user.___", "reponses": [["Name"]], "explication": "`user.Name` ; `user.Email` donne l'adresse.", "aide": "https://support.getgrist.com/formulas/" }, { "type": "multiple", "competence": "partage", "question": "Un utilisateur en lecture seule peut-il... ?", "choix": ["Voir les pages", "Filtrer pour lui-même", "Modifier une cellule", "Inviter quelqu’un"], "bonnes": [0, 1], "explication": "Il consulte, trie et filtre pour lui ; il ne modifie rien.", "aide": "https://support.getgrist.com/sharing/" }], "objectif": "Partager un document avec les bons rôles, et savoir qui a écrit quoi.", "lecon": [{ "titre": "Trois rôles", "liste": ["**Lecture seule** : voit, ne modifie rien.", "**Éditeur** : modifie les données, pas la structure ni les droits.", "**Propriétaire** : tout, y compris le partage."] }, { "titre": "Inviter", "paragraphes": ["Le bouton **Partager**, puis **Gérer les utilisateurs**, invite par adresse e-mail, avec un rôle. L'**Accès public** ouvre aussi un lien en lecture seule, pour montrer un programme de voyage sans rien laisser modifier."] }, { "titre": "Savoir qui a écrit", "code": "user.Name", "paragraphes": ["En formule d’initialisation sur les nouvelles lignes, `user.Name` note le nom de la personne qui a ajouté la ligne : utile dès qu'on écrit à plusieurs. Les widgets de Mon Grist perso le font dans chaque table. C'est ce que vous ferez dans la mission."] }, { "titre": "Le bon niveau", "paragraphes": ["Donnez le rôle le plus petit qui suffit. Pour aller plus loin (chacun ne voit que ses lignes), ce sont les règles d'accès de la carte 23."] }], "mission": { "titre": "Le carnet de voyage, à plusieurs", "intro": "Construisez le cœur du widget Mes voyages : la table de vos voyages, où chaque ligne garde le nom de la personne qui l'a ajoutée. Le widget ajoutera ensuite le programme, le budget et la valise autour.", "etapes": ["Créez une table **Voyages** avec DESTINATION (Texte), DEBUT (Date) et FIN (Date).", "Ajoutez **CREE_PAR** (Texte) en formule d’initialisation `user.Name`, avec **Appliquer sur les nouvelles lignes uniquement**.", "Ajoutez un voyage, avec sa destination et ses deux dates : CREE_PAR se remplit tout seul avec votre nom.", "Ouvrez **Partager** > **Gérer les utilisateurs** et regardez les trois rôles proposés. Inviter quelqu'un n'est pas obligatoire pour réussir la mission."], "verifications": [{ "type": "table", "table": "Voyages" }, { "type": "colonne", "table": "Voyages", "colonne": "DEBUT", "typeCol": ["Date"] }, { "type": "colonne", "table": "Voyages", "colonne": "FIN", "typeCol": ["Date"] }, { "type": "declencheur", "table": "Voyages", "colonne": "CREE_PAR", "formule": "user.Name" }, { "type": "lignes", "table": "Voyages", "min": 1 }] }, "contenu": true, "url": "lib/x/cnrzmkde/", "page": "🧳 Mes voyages" }, { "carte": 23, "id": "taches", "titre": "Règles d'accès", "niveau": "expert", "niveauNom": "Expert", "competence": "acces", "widget": "taches", "surprise": { "genre": "widget", "nom": "Tâches de la maison", "widget": "taches", "texte": "Qui fait quoi à la maison, la tournante des corvées et l'équilibre de la semaine, chacun avec ses droits." }, "durees": { "lecon": 15, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "acces", "question": "Qui peut modifier les règles d'accès ?", "choix": ["Les propriétaires", "Les éditeurs", "Tout le monde"], "bonne": 0, "explication": "Seuls les propriétaires peuvent ouvrir et modifier les Permissions avancées.", "aide": "https://support.getgrist.com/access-rules/" }, { "type": "qcm", "competence": "acces", "question": "Taches_de_la_maison est en lecture seule pour les non-propriétaires. Un éditeur peut-il encore dire « Fait » dans le widget ?", "choix": ["Oui : « Fait » écrit une ligne dans Tâches faites, une autre table", "Non : la règle bloque tout le document", "Seulement s'il est aussi en lecture seule"], "bonne": 0, "explication": "Une règle de table ne protège que cette table. L'historique Tâches faites reste ouvert à l'écriture.", "aide": "https://support.getgrist.com/access-rules/" }, { "type": "paires", "competence": "acces", "question": "Reliez chaque lettre à sa permission.", "paires": [["R", "Lire"], ["U", "Modifier"], ["C", "Créer"], ["D", "Supprimer"]], "explication": "S, en plus, concerne la structure.", "aide": "https://support.getgrist.com/access-rules/" }, { "type": "trou", "competence": "acces", "question": "Complétez la condition : la ligne n'est pas de cet utilisateur.", "formule": "user.Email != ___.AUTEUR", "reponses": [["rec"]], "explication": "`rec` désigne la ligne testée par la règle.", "aide": "https://support.getgrist.com/access-rules/" }, { "type": "qcm", "competence": "acces", "question": "Comment vérifier une règle sans demander à quelqu'un ?", "choix": ["« Voir en tant que »", "Se déconnecter", "Exporter le document"], "bonne": 0, "explication": "« Voir en tant que » simule la vue d'un autre utilisateur.", "aide": "https://support.getgrist.com/access-rules/" }, { "type": "multiple", "competence": "acces", "question": "Que peuvent faire des règles d'accès ?", "choix": ["Cacher une table", "Cacher certaines colonnes", "Ne montrer à chacun que ses lignes", "Chiffrer les données"], "bonnes": [0, 1, 2], "explication": "Elles décident qui voit et modifie quoi ; le chiffrement est une autre affaire.", "aide": "https://support.getgrist.com/access-rules/" }], "objectif": "Décider qui voit et qui modifie quoi, ligne par ligne si besoin.", "lecon": [{ "titre": "Au-delà des rôles", "paragraphes": ["Les **règles d'accès** affinent les rôles : cacher une table aux éditeurs, interdire de supprimer, ou ne montrer à chacun que ses propres lignes. Elles se règlent dans **Permissions avancées**, en bas à gauche (la page des règles d'accès, propriétaire seulement)."] }, { "titre": "Une règle = une condition et des permissions", "code": "user.Access != OWNER", "paragraphes": ["Une règle porte sur une table (ou sur certaines colonnes). Avec la condition ci-dessous (la personne n'est pas propriétaire du document) et C, U et D refusés, les éditeurs lisent la table sans pouvoir la changer : pratique pour une liste de référence que seuls les propriétaires tiennent à jour.", "Une règle peut aussi regarder la ligne elle-même : avec `user.Email != rec.AUTEUR` et R, U, D refusés, chacun ne voit que les lignes qu'il a écrites."] }, { "titre": "Les lettres", "liste": ["R : lire", "U : modifier", "C : créer", "D : supprimer", "S : changer la structure"] }, { "titre": "Tester", "paragraphes": ["Le bouton **Voir en tant que** montre le document comme le voit un autre utilisateur : le meilleur moyen de vérifier une règle avant de partager."] }], "mission": { "titre": "La liste des corvées, protégée", "intro": "Construisez le cœur du widget Tâches de la maison : la table des tâches, et une règle d'accès pour que seuls les propriétaires du document changent la liste. Le foyer pourra toujours dire « Fait » : le widget le note dans une autre table.", "etapes": ["Créez une table **Taches_de_la_maison** avec NOM (Texte), FREQ_UNITE (Choix unique : Jours, Semaines, Mois, Jours de la semaine) et MINUTES (Entier).", "Ajoutez deux tâches, par exemple « Vider le lave-vaisselle », tous les Jours, 10 minutes.", "Dans **Permissions avancées**, cliquez sur **Ajouter des règles pour la table** > Taches_de_la_maison : condition `user.Access != OWNER`, droits C, U et D refusés (**Lecture seule**). Puis **Enregistrer**.", "Vérifiez avec « Voir en tant que » un éditeur : il lit la liste sans pouvoir la modifier."], "verifications": [{ "type": "table", "table": "Taches_de_la_maison" }, { "type": "choix", "table": "Taches_de_la_maison", "colonne": "FREQ_UNITE", "choix": ["Jours", "Semaines", "Mois", "Jours de la semaine"] }, { "type": "colonne", "table": "Taches_de_la_maison", "colonne": "MINUTES", "typeCol": ["Int", "Numeric"] }, { "type": "lignes", "table": "Taches_de_la_maison", "min": 2 }, { "type": "regle", "table": "Taches_de_la_maison", "contient": "user.Access", "permissions": "-CUD", "libelle": "Une règle d’accès met « Taches_de_la_maison » en lecture seule pour les non-propriétaires", "indices": ["Les règles d’accès se règlent dans « Permissions avancées », en bas à gauche (propriétaire du document seulement).", "Ajoutez des règles pour la table Taches_de_la_maison : la condition teste le rôle (`user.Access`), et les droits C, U et D sont refusés.", "Permissions avancées > Ajouter des règles pour la table > Taches_de_la_maison > Condition : user.Access != OWNER > Droits : C, U et D refusés (ou « Lecture seule ») > Enregistrer."] }] }, "contenu": true, "url": "lib/x/yjyck6mi/", "page": "🧹 Tâches de la maison" }, { "carte": 24, "id": "historique", "titre": "Historique, copies et modèles", "niveau": "expert", "niveauNom": "Expert", "competence": "historique", "surprise": { "genre": "astuce", "nom": "Le filet de sécurité", "texte": "Les questions les plus fréquentes sur le forum Grist tournent autour de « j'ai tout cassé, comment revenir en arrière ? ». La réponse tient en trois réflexes : **Ctrl + Z** tout de suite ; l'**Historique du document**, onglet Instantanés, pour une version d'hier ou de la semaine dernière (ouvrez-la, puis copiez ce qui manque) ; et, avant tout changement important, **Travailler sur une copie**. Bonus : pour repartir chaque année d'un document propre, dupliquez-le **Comme modèle** : structure et formules, sans les données." }, "durees": { "lecon": 10, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "historique", "question": "Vous avez supprimé une table hier par erreur. Où la retrouver ?", "choix": ["Dans un instantané de l’Historique du document", "Dans la corbeille de l’ordinateur", "Nulle part"], "bonne": 0, "explication": "Ouvrez un instantané d'avant la suppression, puis copiez ce qu'il faut.", "aide": "https://support.getgrist.com/automatic-backups/" }, { "type": "qcm", "competence": "historique", "question": "Avant de réorganiser toutes vos tables, le geste prudent ?", "choix": ["Travailler sur une copie", "Prévenir tout le monde de ne plus rien toucher", "Tout exporter en CSV"], "bonne": 0, "explication": "La copie privée laisse l'original intact jusqu'à ce que vous décidiez.", "aide": "https://support.getgrist.com/copying-docs/" }, { "type": "multiple", "competence": "historique", "question": "Que garde un document dupliqué « Comme modèle » ?", "choix": ["Les tables et colonnes", "Les formules", "Les pages et vues", "Les données"], "bonnes": [0, 1, 2], "explication": "Un modèle part vide, avec toute la structure.", "aide": "https://support.getgrist.com/copying-docs/" }, { "type": "paires", "competence": "historique", "question": "Reliez chaque outil à son usage.", "paires": [["Ctrl + Z", "Annuler les dernières actions"], ["Activité", "Voir qui a modifié quoi"], ["Instantanés", "Revenir à une version passée"], ["Travailler sur une copie", "Essayer sans risque"]], "explication": "Du plus rapide au plus complet.", "aide": "https://support.getgrist.com/automatic-backups/" }, { "type": "qcm", "competence": "historique", "question": "Qui voit vos essais quand vous travaillez sur une copie ?", "choix": ["Vous seul, jusqu’à ce que vous remplaciez l’original", "Tous les éditeurs", "Tout le monde"], "bonne": 0, "explication": "La copie est privée tant qu'elle n'est pas appliquée.", "aide": "https://support.getgrist.com/copying-docs/" }, { "type": "faire", "competence": "historique", "question": "À vous : dans Cadeaux, supprimez une ligne puis faites-la revenir avec Annuler (Ctrl + Z). Vos cadeaux sont-ils tous là ?", "verifications": [{ "type": "lignes", "table": "Cadeaux", "min": 2, "libelle": "La table Cadeaux a encore au moins 2 lignes" }], "explication": "Annuler défait les dernières actions dans l'ordre, même une suppression : la ligne revient avec toutes ses valeurs.", "aide": "https://support.getgrist.com/automatic-backups/" }], "objectif": "Ne plus avoir peur de casser : historique, copies, modèles.", "lecon": [{ "titre": "Annuler, et bien plus", "paragraphes": ["Ctrl + Z annule les dernières actions. Pour remonter plus loin, le panneau **Historique du document** montre l'onglet **Activité** (chaque modification, qui, quand) et l'onglet **Instantanés** : des versions complètes du document, prises automatiquement, que l'on peut ouvrir et dont on peut faire une copie."] }, { "titre": "Travailler sur une copie", "paragraphes": ["Avant un gros changement, **Travailler sur une copie** (menu **Partager**) ouvre une copie privée : on essaie tout, puis on remplace l'original, ou on abandonne. Rien n'est cassé pour les autres pendant ce temps."] }, { "titre": "Dupliquer et faire un modèle", "paragraphes": ["**Dupliquer le document** (menu **Partager**) avec l'option **Comme modèle** copie la structure, les formules et les pages, sans les données : le point de départ idéal pour un nouveau budget, une nouvelle année, un nouveau projet."] }], "mission": { "titre": "Le filet de sécurité de vos cadeaux", "intro": "Pas de nouvelle table : vous essayez le filet de sécurité de Grist sur votre table Cadeaux. Vous changez, vous supprimez, et tout revient.", "etapes": ["Ouvrez la page **Cadeaux**. Changez le prix d'un cadeau, puis supprimez une ligne (clic droit sur une de ses cellules > **Supprimer la ligne**).", "Cliquez sur **Annuler** (la flèche en haut à gauche) ou **Ctrl + Z** : la ligne revient, avec toutes ses valeurs.", "En bas à gauche, ouvrez **Historique du document**, onglet **Activité** : retrouvez votre changement de prix et la suppression, avec l'heure.", "Onglet **Instantanés** : regardez les versions gardées automatiquement. Ouvrez-en une avec **Ouvrir cet instantané**, sans rien changer, puis revenez avec **Retour à la version active**.", "Menu **Partager** > **Travailler sur une copie** : modifiez ce que vous voulez dans la copie, puis revenez à l'original, intact. Cliquez sur enfin « Vérifier mon document »."], "verifications": [{ "type": "table", "table": "Cadeaux", "libelle": "La table Cadeaux est toujours là" }, { "type": "lignes", "table": "Cadeaux", "min": 2, "libelle": "Vos cadeaux sont revenus : la table a encore au moins 2 lignes", "indices": ["Une ligne supprimée revient avec Annuler (Ctrl + Z), juste après.", "Plus tard, l'onglet Instantanés de l'Historique du document garde une version d'avant la suppression.", "Historique du document > Instantanés > Ouvrir cet instantané, copiez la ligne perdue, puis collez-la dans Cadeaux."] }] }, "contenu": true }, { "carte": 25, "id": "accueil", "titre": "Vues personnalisées (widgets personnalisés)", "niveau": "expert", "niveauNom": "Expert", "competence": "widgets", "widget": "accueil", "surprise": { "genre": "widget", "nom": "Mes 3 choses du jour", "widget": "accueil", "texte": "Votre page d'accueil : les trois choses du jour, et les échéances de tout le document réunies au même endroit." }, "durees": { "lecon": 10, "mission": 10, "quiz": 5 }, "questions": [{ "type": "qcm", "competence": "widgets", "question": "Un widget demande l'« Accès complet au document ». Que peut-il faire ?", "choix": ["Lire et modifier tout le document", "Seulement lire sa table", "Rien sans votre mot de passe"], "bonne": 0, "explication": "D'où la règle : accès complet seulement pour un widget de confiance.", "aide": "https://support.getgrist.com/widget-custom/" }, { "type": "paires", "competence": "widgets", "question": "Reliez chaque niveau d'accès à ce qu'il permet.", "paires": [["Pas d’accès au document", "Afficher sans lire le document"], ["Lire les données source sélectionnées", "Lire la table choisie"], ["Accès complet au document", "Lire et modifier tout le document"]], "explication": "Le niveau se choisit dans le panneau de droite, rubrique Niveau d’accès.", "aide": "https://support.getgrist.com/widget-custom/" }, { "type": "ordre", "competence": "widgets", "question": "Remettez dans l'ordre pour ajouter un cadeau par son adresse.", "etapes": ["Ajouter > Ajouter une page", "Choisir « Personnalisée » et la table", "Cliquer sur « Ajouter votre propre widget »", "Coller l'adresse dans « URL du widget »", "Choisir « Accès complet au document »"], "explication": "On passe par l'adresse (« Ajouter votre propre widget »), jamais par « Créez le vôtre », qui attend du code collé. Puis on règle le niveau d'accès ; l'avertissement « source inconnue » est normal pour une adresse de confiance.", "aide": "https://support.getgrist.com/widget-custom/" }, { "type": "multiple", "competence": "widgets", "question": "Lesquels sont vrais ?", "choix": ["Une vue personnalisée est une page web", "Elle peut venir de la galerie de Grist", "On peut coller l’adresse d’un widget dans « URL du widget »", "Elle remplace les tables du document"], "bonnes": [0, 1, 2], "explication": "Elle s'ajoute à côté des autres vues ; les données restent dans les tables.", "aide": "https://support.getgrist.com/widget-custom/" }, { "type": "qcm", "competence": "widgets", "question": "Un widget veut savoir quelle colonne contient la date. Où le régler ?", "choix": ["Dans le panneau de droite (onglet Vue), en reliant les colonnes", "Dans le code du widget", "En renommant la colonne"], "bonne": 0, "explication": "Le panneau propose de relier chaque besoin du widget à une colonne.", "aide": "https://support.getgrist.com/widget-custom/" }], "objectif": "Ajouter une vue personnalisée (un widget personnalisé) et comprendre ce qu'elle peut faire.", "lecon": [{ "titre": "Une vue venue d’une adresse", "paragraphes": ["Une **vue personnalisée** (widget personnalisé) est une page web branchée sur une table. Tous les cadeaux de l'académie en sont : ils sont chargés depuis leur adresse, sur internet.", "Elle s'ajoute comme les autres vues, en choisissant le type **Personnalisée**. Grist ouvre alors une galerie : des widgets tout prêts (Markdown, Carte, Calendrier...), et **Ajouter votre propre widget** pour en donner un par son adresse, dans **URL du widget** (dans le panneau de droite, le même champ s'appelle **URL personnalisée**). Chaque widget a enfin un niveau d'accès au document.", "Pour une adresse qu'il ne connaît pas, Grist affiche un avertissement, « Attention aux vues personnalisées de source inconnue ». C'est normal : une vue personnalisée exécute le code d'un autre site, et Grist vous demande si vous faites confiance à cette adresse. On ne confirme que pour une adresse connue, comme celle d'un cadeau de l'académie."] }, { "titre": "Par adresse, ou « Créez le vôtre » ?", "liste": ["**Par adresse** (Ajouter votre propre widget, URL du widget) : le widget vit sur un site ; une nouvelle version arrive toute seule. C'est ainsi qu'on ajoute les cadeaux de l'académie.", "**Créez le vôtre** (dans la liste des vues, au moment d'ajouter) : c'est un éditeur de code, un « Widget personnalisé intégré dans le document ». Le code est collé et vit dans le document. Il ne charge pas une adresse : n'y collez pas l'adresse d'un cadeau, elle ne s'ouvrirait pas."] }, { "titre": "Le niveau d’accès", "liste": ["**Pas d’accès au document** : le widget n’affiche que ce qu’on lui montre.", "**Lire les données source sélectionnées** : il lit la table choisie.", "**Accès complet au document** : il lit et modifie tout le document. À n’accorder qu’aux widgets de confiance."] }, { "titre": "Relier les colonnes", "paragraphes": ["Certains widgets demandent quelles colonnes utiliser (le titre, la date...) : on les relie dans le panneau de droite, onglet **Vue**."] }], "mission": { "titre": "Votre page d’accueil", "intro": "Le cœur du widget Mes 3 choses du jour : une petite table et une vue personnalisée sur une page.", "etapes": ["Créez **Choses_du_jour** avec CHOSE (Texte), FAITE (Booléen) et POUR_LE (Date).", "Ajoutez trois choses.", "Sur la page de cette table : **Ajouter** > **Ajouter une vue à la page** > **Personnalisée** > Choses_du_jour > **Ajouter à la Page**.", "Dans la galerie, prenez « Markdown » (puis reliez CHOSE dans le panneau de droite), ou cliquez sur **Ajouter votre propre widget** et collez l'adresse du cadeau Mes 3 choses du jour dans **URL du widget** (ou, dans le panneau de droite, **URL personnalisée**), avec l'**Accès complet au document**. Pas « Créez le vôtre » : il attend du code, pas une adresse.", "Si Grist affiche « Attention aux vues personnalisées de source inconnue », c'est normal : cochez « J’ai bien lu ces recommandations et je confirme vouloir ajouter cette vue », puis confirmez. Revenez ici et cliquez sur « Vérifier mon document »."], "verifications": [{ "type": "table", "table": "Choses_du_jour" }, { "type": "colonne", "table": "Choses_du_jour", "colonne": "FAITE", "typeCo   var t = P.trouverTable({ tables: MGP.g.meta.tables, sections }, nom);
